<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 96px; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 16px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
  button { font: inherit; font-weight: 600; min-height: 44px; border: 0; border-radius: var(--amber-radius-small); color: var(--amber-text); background: var(--amber-fill); cursor: pointer; }
  #play { background: var(--amber-text); color: var(--amber-bg); padding: 0 22px; min-width: 110px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  #mute, #clear { padding: 0 16px; }
  .tempo { display: flex; align-items: center; gap: 10px; flex: 1 1 220px; font-size: 14px; color: var(--amber-text-secondary); }
  .tempo input { flex: 1; min-height: 44px; accent-color: var(--amber-accent); }
  .tempo output { min-width: 3.5em; font-variant-numeric: tabular-nums; color: var(--amber-text); font-weight: 600; }
  .track { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 12px; margin-bottom: 12px; }
  .track h2 { font-size: 14px; margin: 0 0 8px; color: var(--amber-text-secondary); text-transform: uppercase; letter-spacing: .06em; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  @media (min-width: 480px) { .steps { grid-template-columns: repeat(8, 1fr); } }
  @media (min-width: 700px) { .steps { grid-template-columns: repeat(16, 1fr); } }
  .step { min-height: 44px; padding: 0; background: var(--amber-fill); position: relative; border: 2px solid transparent; }
  .step.beat { background: color-mix(in srgb, var(--amber-fill), var(--amber-text) 10%); }
  .step.on { background: var(--amber-accent); }
  .step.on::after { content: ""; position: absolute; inset: 0; margin: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--amber-on-accent); }
  .step.now { border-color: var(--amber-text); }
  .hint { color: var(--amber-text-secondary); font-size: 14px; margin: 8px 0 0; }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
  .err { color: var(--amber-danger); min-height: 1.2em; }
  svg { width: 16px; height: 16px; fill: currentColor; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div id="app"></div>
</main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const isOn = (s) => /^(x|✓|1|yes|true)$/i.test(String(s).trim());
  let tracks = [];      // [{name, col, steps:[bool]}]
  let tableIndex = 0, nSteps = 16;
  let bpm = 120, bpmTouched = false, playing = false, muted = false, error = "";
  let ctx = null, timer = null, nextTime = 0, step = 0, lastShown = -1;
  const queue = [];

  function readNote(note) {
    document.getElementById("title").textContent = note.title;
    const t = note.tables.find((t) => t.columns.some((c) => /^step$/i.test(c.name)));
    tracks = [];
    if (t) {
      tableIndex = t.index;
      const si = t.columns.findIndex((c) => /^step$/i.test(c.name));
      nSteps = t.rows.length;
      t.columns.forEach((c, i) => {
        if (i !== si) tracks.push({ name: c.name, steps: t.rows.map((r) => isOn(r[i])) });
      });
    }
    if (!bpmTouched) {
      const m = /(\d{2,3})\s*bpm/i.exec(note.markdown || "");
      if (m) bpm = Math.min(220, Math.max(60, +m[1]));
    }
  }

  function render() {
    const app = document.getElementById("app");
    if (!tracks.length || !nSteps) {
      app.innerHTML = '<div class="empty">Add a table with a Step column and one column per drum (Kick, Snare, Hat) to the note.</div>';
      return;
    }
    app.innerHTML = `
      <div class="bar">
        <button id="play" aria-label="${playing ? "Stop" : "Play"}">${playing ? '<svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1"/></svg>Stop' : '<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>Play'}</button>
        <label class="tempo">Tempo <input id="bpm" type="range" min="60" max="200" value="${bpm}"><output id="bpmv">${bpm} bpm</output></label>
        <button id="mute" aria-pressed="${muted}">${muted ? "Unmute" : "Mute"}</button>
      </div>
      ${tracks.map((tr, ti) => `<section class="track"><h2>${esc(tr.name)}</h2><div class="steps">${tr.steps.map((on, s) =>
        `<button class="step${on ? " on" : ""}${s % 4 === 0 ? " beat" : ""}" data-t="${ti}" data-s="${s}" aria-pressed="${on}" aria-label="${esc(tr.name)} step ${s + 1}"></button>`).join("")}</div></section>`).join("")}
      <p class="hint">Tap a step to switch it on or off. Changes are saved to the table in the note.</p>
      <div class="err" role="alert">${esc(error)}</div>`;
    document.getElementById("play").onclick = toggle;
    document.getElementById("mute").onclick = () => { muted = !muted; render(); };
    const b = document.getElementById("bpm");
    b.oninput = () => { bpm = +b.value; bpmTouched = true; document.getElementById("bpmv").textContent = bpm + " bpm"; };
    app.querySelectorAll(".step").forEach((el) => el.onclick = async () => {
      const ti = +el.dataset.t, s = +el.dataset.s;
      const on = !tracks[ti].steps[s];
      tracks[ti].steps[s] = on;           // so sound reflects it instantly
      el.classList.toggle("on", on); el.setAttribute("aria-pressed", on);
      if (on) { ensureCtx(); if (ctx) voice(tracks[ti].name, ctx.currentTime + .01); }
      const r = await amber.update({ op: "set_cell", table: tableIndex, row: s, col: tracks[ti].name, value: on ? "x" : "" });
      error = r.ok ? "" : r.error;
      if (!r.ok) render();
    });
    lastShown = -1;
  }

  function ensureCtx() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === "suspended") ctx.resume();
  }
  function noiseBuf() {
    if (noiseBuf.b) return noiseBuf.b;
    const b = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return (noiseBuf.b = b);
  }
  function voice(name, t) {
    if (muted || !ctx) return;
    const g = ctx.createGain(); g.connect(ctx.destination);
    const n = name.toLowerCase();
    if (/kick|bass|bd/.test(n)) {
      const o = ctx.createOscillator(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + .14);
      g.gain.setValueAtTime(.9, t); g.gain.exponentialRampToValueAtTime(.001, t + .35);
      o.connect(g); o.start(t); o.stop(t + .4);
    } else {
      const src = ctx.createBufferSource(); src.buffer = noiseBuf();
      const f = ctx.createBiquadFilter(); const snare = /snare|clap|sd/.test(n);
      f.type = "highpass"; f.frequency.value = snare ? 1200 : 7000;
      const len = snare ? .18 : .05;
      g.gain.setValueAtTime(snare ? .5 : .25, t); g.gain.exponentialRampToValueAtTime(.001, t + len);
      src.connect(f); f.connect(g); src.start(t); src.stop(t + len + .02);
      if (snare && !/clap/.test(n)) {
        const o = ctx.createOscillator(), og = ctx.createGain(); o.type = "triangle"; o.frequency.value = 190;
        og.gain.setValueAtTime(.4, t); og.gain.exponentialRampToValueAtTime(.001, t + .1);
        o.connect(og); og.connect(ctx.destination); o.start(t); o.stop(t + .12);
      }
    }
  }

  function tick() {
    while (nextTime < ctx.currentTime + .12) {
      const s = step % nSteps;
      tracks.forEach((tr) => { if (tr.steps[s]) voice(tr.name, nextTime); });
      queue.push({ s, t: nextTime });
      nextTime += 60 / bpm / 4;
      step++;
    }
  }
  function frame() {
    if (!playing) return;
    while (queue.length && queue[0].t <= ctx.currentTime) {
      const { s } = queue.shift();
      if (s !== lastShown) {
        document.querySelectorAll(".step.now").forEach((e) => e.classList.remove("now"));
        document.querySelectorAll(`.step[data-s="${s}"]`).forEach((e) => e.classList.add("now"));
        lastShown = s;
      }
    }
    requestAnimationFrame(frame);
  }
  function start() {
    ensureCtx(); if (!ctx) return;
    playing = true; step = 0; queue.length = 0; nextTime = ctx.currentTime + .05;
    timer = setInterval(tick, 25); tick(); requestAnimationFrame(frame);
  }
  function stop() {
    playing = false; clearInterval(timer); queue.length = 0;
    document.querySelectorAll(".step.now").forEach((e) => e.classList.remove("now"));
  }
  function toggle() { playing ? stop() : start(); render(); }
  document.addEventListener("visibilitychange", () => { if (document.hidden && playing) { stop(); render(); } });

  amber.onChange((note) => { readNote(note); render(); });
</script>
</body>
</html>
