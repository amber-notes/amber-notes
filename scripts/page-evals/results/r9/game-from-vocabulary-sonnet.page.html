<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-settings" content='{"settings":[{"key":"direction","label":"Question language","type":"choice","options":["Spanish to English","English to Spanish","Mixed"],"default":"Mixed"},{"key":"rounds","label":"Questions per round","type":"number","default":10}]}'>
<style>
*{box-sizing:border-box}
:root{--ok:#1f8a4c;--ok-soft:#dff3e6;--bad:#c23a2e;--bad-soft:#fbe3e0}
@media(prefers-color-scheme:dark){:root{--ok:#5fd18a;--ok-soft:#173a26;--bad:#ff8a7e;--bad-soft:#44201c}}
main{max-width:var(--amber-content-max);margin:0 auto;padding:16px var(--amber-gutter) 40px;min-height:100%}
@media(min-width:900px){#app{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;align-items:start}#app>.top,#app>.bar,#app>.dots,#app>.fb{grid-column:1/-1}}
h1{font-size:22px;letter-spacing:-.02em;margin:0 0 12px;font-family:var(--amber-font-rounded)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.chip{background:var(--amber-accent-soft);color:var(--amber-accent-text);border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:20px;margin-bottom:14px}
.muted{color:var(--amber-text-secondary);font-size:14px}
.big{font-family:var(--amber-font-rounded);font-weight:800;font-size:clamp(30px,9vw,48px);letter-spacing:-.02em;text-align:center;margin:10px 0;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:26px;font-variant-numeric:tabular-nums;font-family:var(--amber-font-rounded)}
button{font:inherit;font-weight:700;min-height:52px;padding:0 16px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-text);color:var(--amber-bg);width:100%;cursor:pointer}
button.alt{background:var(--amber-fill);color:var(--amber-text);border:2px solid transparent;text-align:left;padding:10px 16px}
button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--amber-text)}
button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--amber-text)}
button:disabled{cursor:default}
.opts{display:grid;gap:10px}
@media(min-width:700px){.opts{grid-template-columns:1fr 1fr}}
.bar{height:10px;border-radius:99px;background:var(--amber-fill);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:100%;background:var(--amber-accent);transform-origin:left}
.dots{display:flex;gap:4px;margin:10px 0 16px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--amber-fill)}
.dots i.r{background:var(--ok)}.dots i.w{background:var(--bad)}.dots i.c{background:var(--amber-accent)}
.fb{min-height:24px;text-align:center;font-weight:700;margin:8px 0}
.combo{font-weight:800;color:var(--amber-accent-text)}
ul{list-style:none;margin:8px 0 0;padding:0}
li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--amber-separator)}
.empty{text-align:center;padding:30px 10px}
@media(prefers-reduced-motion:no-preference){.pop{animation:pop .25s}@keyframes pop{50%{transform:scale(1.06)}}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const app=document.getElementById("app");
const QTIME=8;
let note=null,vals={},screen="menu",G=null,raf=0,last=0,advTimer=0;

function words(){
  const t=(note?.tables||[]).find(t=>t.columns.length>=2);
  if(!t)return[];
  return t.rows.map(r=>({es:(r[0]||"").trim(),en:(r[1]||"").trim()})).filter(w=>w.es&&w.en);
}
const st=()=>vals.stats||{};
const today=()=>note.today;
function save(patch){vals={...vals,...patch};Promise.resolve(amber.setData({values:patch})).then(r=>{if(r&&r.ok===false){const e=document.getElementById('saveErr');if(e)e.textContent='Could not save progress: '+r.error;}});}
function dayDiff(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);}
function streakNow(){
  if(!vals.lastDay)return 0;
  const d=dayDiff(vals.lastDay,today());
  return d<=1?(vals.streak||0):0;
}
function pick(ws,n){
  const s=st();const pool=ws.map(w=>({w,k:1+3*((s[w.es]?.w||0))/(1+(s[w.es]?.r||0)*0.5)+Math.random()*2}));
  pool.sort((a,b)=>b.k-a.k);
  // weighted shuffle: take top biased set
  const out=[];const rest=pool.slice();
  while(out.length<n&&rest.length){
    const tot=rest.reduce((a,x)=>a+x.k,0);let r=Math.random()*tot,i=0;
    for(;i<rest.length-1;i++){r-=rest[i].k;if(r<=0)break;}
    out.push(rest.splice(i,1)[0].w);
  }
  while(out.length<n&&ws.length)out.push(ws[Math.floor(Math.random()*ws.length)]);
  return out;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startGame(){
  const ws=words();if(ws.length<2)return;
  const dir=(amber.settings?.direction)||"Mixed";
  const n=Math.max(3,Math.min(30,parseInt(amber.settings?.rounds)||10));
  const qs=pick(ws,n).map(w=>{
    const toEn=dir==="Spanish to English"?true:dir==="English to Spanish"?false:Math.random()<.5;
    const others=shuffle(ws.filter(x=>x.es!==w.es)).slice(0,3);
    const opts=shuffle([w,...others]).map(x=>({text:toEn?x.en:x.es,right:x.es===w.es}));
    return{w,toEn,prompt:toEn?w.es:w.en,answer:toEn?w.en:w.es,opts,res:null};
  });
  G={qs,i:0,score:0,combo:0,best:0,right:0,t:QTIME,locked:false,fb:"",picked:-1};
  screen="play";drawPlay();last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
}
function tick(ts){
  if(screen!=="play"||!G)return;
  const dt=last?Math.min(.1,(ts-last)/1000):0;last=ts;
  if(!G.locked){
    G.t-=dt;
    if(G.t<=0){G.t=0;answer(-1);}
    const b=document.getElementById("bar");if(b)b.style.transform="scaleX("+(G.t/QTIME)+")";
  }
  raf=requestAnimationFrame(tick);
}
function answer(k){
  if(G.locked)return;G.locked=true;
  const q=G.qs[G.i];const ok=k>=0&&q.opts[k].right;
  G.picked=k;
  const s={...st()};const e={...(s[q.w.es]||{r:0,w:0})};
  if(ok){
    G.combo++;G.best=Math.max(G.best,G.combo);G.right++;
    const gain=Math.round((100+Math.round(50*G.t/QTIME))*Math.min(G.combo,5)/1);
    G.score+=gain;q.res="r";e.r++;
    G.fb=`Correct! +${gain}`;
  }else{
    G.combo=0;q.res="w";e.w++;
    G.fb=k<0?`Time's up: ${q.answer}`:`Not quite: ${q.answer}`;
  }
  s[q.w.es]=e;vals={...vals,stats:s};
  drawPlay();
  advTimer=setTimeout(()=>{
    if(G.i+1>=G.qs.length)return finish();
    G.i++;G.t=QTIME;G.locked=false;G.fb="";G.picked=-1;drawPlay();
  },ok?800:1500);
}
function finish(){
  screen="result";
  const s=st();
  let streak=vals.streak||0;
  if(vals.lastDay!==today())streak=(vals.lastDay&&dayDiff(vals.lastDay,today())===1)?streak+1:1;
  const prevBest=vals.best||0;const isBest=G.score>prevBest;
  G.isBest=isBest;G.streak=streak;
  save({stats:s,streak,lastDay:today(),best:Math.max(prevBest,G.score),rounds:(vals.rounds||0)+1});
  drawResult();
}
function drawMenu(){
  const ws=words();
  if(ws.length<2){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">Add at least two rows to the table (Spanish | English) to play.</div>`;return;}
  const s=st();
  const learned=ws.filter(w=>(s[w.es]?.r||0)>=3&&(s[w.es]?.r||0)>=2*(s[w.es]?.w||0)).length;
  const hard=ws.filter(w=>(s[w.es]?.w||0)>0).sort((a,b)=>(s[b.es].w-s[b.es].r)-(s[a.es].w-s[a.es].r)).slice(0,4);
  const played=vals.lastDay===today();
  app.innerHTML=`<div class="top"><h1 style="margin:0">${esc(note.title)}</h1><span class="chip" aria-label="Day streak">${streakNow()} day streak</span></div>
  <div class="card"><div class="muted" style="text-align:center">${played?"Played today. Another round?":"Today's round is ready."}</div>
  <div class="big">Verb Rush</div>
  <p class="muted" style="text-align:center;margin:0 0 16px">Pick the right translation before the bar runs out. Chain correct answers for a bigger multiplier. Verbs you miss come back more often.</p>
  <button id="go">Play round</button></div>
  <div class="card stats"><div><b>${vals.best||0}</b><span class="muted">Best score</span></div><div><b>${learned}/${ws.length}</b><span class="muted">Verbs learned</span></div><div><b>${vals.rounds||0}</b><span class="muted">Rounds</span></div></div>
  ${hard.length?`<div class="card"><b>Needs practice</b><ul>${hard.map(w=>`<li><span>${esc(w.es)}</span><span class="muted">${esc(w.en)}</span></li>`).join("")}</ul></div>`:""}`;
  document.getElementById("go").onclick=startGame;
}
function dots(){return`<div class="dots" aria-hidden="true">${G.qs.map((q,i)=>`<i class="${q.res||(i===G.i?"c":"")}"></i>`).join("")}</div>`;}
function drawPlay(){
  const q=G.qs[G.i];
  app.innerHTML=`<div class="top"><span class="chip">${G.score} pts</span><span class="muted">Question ${G.i+1} of ${G.qs.length}</span>${G.combo>1?`<span class="chip combo pop">x${Math.min(G.combo,5)} combo</span>`:`<span></span>`}</div>
  <div class="bar" aria-hidden="true"><i id="bar" style="transform:scaleX(${G.t/QTIME})"></i></div>${dots()}
  <div class="card"><div class="muted" style="text-align:center">${q.toEn?"What does this mean in English?":"How do you say this in Spanish?"}</div>
  <div class="big">${esc(q.prompt)}</div></div>
  <div class="opts">${q.opts.map((o,i)=>{
    let c="alt",mark="";
    if(G.locked){if(o.right){c+=" ok";mark=" ✓";}else if(i===G.picked){c+=" bad";mark=" ✕";}}
    return`<button class="${c}" data-i="${i}" ${G.locked?"disabled":""}>${esc(o.text)}${mark}</button>`;}).join("")}</div>
  <div class="fb" role="status">${esc(G.fb)}</div>`;
  app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function drawResult(){
  const n=G.qs.length;
  const msg=G.right===n?"Perfect round!":G.right>=n*.7?"Muy bien!":G.right>=n*.4?"Getting there.":"Keep at it, they'll stick.";
  const missed=G.qs.filter(q=>q.res!=="r");
  app.innerHTML=`<div class="top"><h1 style="margin:0">${esc(note.title)}</h1><span class="chip">${G.streak} day streak</span></div>
  <div class="card"><div class="muted" style="text-align:center">${esc(msg)}</div>
  <div class="big pop">${G.score}</div>
  <p class="muted" style="text-align:center;margin:0 0 16px">${G.isBest?"New best score! ":""}${G.right} of ${n} right, best chain ${G.best}</p>
  <button id="again">Play again</button><div style="height:8px"></div><button id="home" class="alt" style="text-align:center">Done</button><div id="saveErr" class="muted" role="alert"></div></div>
  ${missed.length?`<div class="card"><b>Review these</b><ul>${missed.map(q=>`<li><span>${esc(q.w.es)}</span><span class="muted">${esc(q.w.en)}</span></li>`).join("")}</ul></div>`:""}`;
  document.getElementById("again").onclick=startGame;
  document.getElementById("home").onclick=()=>{screen="menu";drawMenu();};
}
document.addEventListener("visibilitychange",()=>{last=0;});
amber.onChange((n,d)=>{
  note=n;
  if(!G||screen==="menu"){vals=(d&&d.values)||vals;}
  if(screen==="menu")drawMenu();
});
</script>
</body>
</html>
