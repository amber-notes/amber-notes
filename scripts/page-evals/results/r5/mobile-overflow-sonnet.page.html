<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{padding:20px 18px 48px;max-width:680px;margin:0 auto}
h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 16px}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);margin-bottom:14px;overflow:hidden}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;font-weight:600;font-size:17px}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--amber-accent-soft);color:var(--amber-accent-text)}
.today{border-color:var(--amber-accent)}
.m{display:flex;gap:12px;padding:10px 16px;border-top:1px solid var(--amber-separator)}
.k{flex:0 0 84px;color:var(--amber-text-secondary);font-size:14px}
.v{flex:1;min-width:0;overflow-wrap:anywhere}
.note{padding:10px 16px;border-top:1px solid var(--amber-separator);color:var(--amber-text-secondary);font-size:14px;overflow-wrap:anywhere}
.empty{padding:28px 16px;text-align:center;color:var(--amber-text-secondary)}
</style></head><body>
<main id="app"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const yes=s=>/^(yes|y|✓|x|1|true|done)$/i.test(String(s).trim());
amber.onChange(note=>{
  const app=document.getElementById("app");
  const t=note.tables[0];
  if(!t){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">Add a meal table to the note to see it here.</div>`;return;}
  const idx=re=>t.columns.findIndex(c=>re.test(c.name));
  const day=idx(/^day$/i),shop=idx(/^shop$/i),notes=idx(/^notes?$/i);
  const skip=new Set([day,shop,notes]);
  const dow=new Date(note.today+"T00:00:00").toLocaleDateString("en-US",{weekday:"long"});
  const cards=t.rows.map(r=>{
    const name=day>=0?r[day]:"";
    const meals=t.columns.map((c,i)=>skip.has(i)||!r[i]?"":`<div class="m"><div class="k">${esc(c.name)}</div><div class="v">${esc(r[i])}</div></div>`).join("");
    const badge=shop>=0&&yes(r[shop])?'<span class="badge">Shop</span>':"";
    const n=notes>=0&&r[notes]?`<div class="note">${esc(r[notes])}</div>`:"";
    return `<section class="card${name===dow?" today":""}"><div class="head"><span>${esc(name)}</span>${badge}</div>${meals}${n}</section>`;
  }).join("");
  app.innerHTML=`<h1>${esc(note.title)}</h1>`+(cards||'<div class="card empty">No meals yet.</div>');
});
</script></body></html>
