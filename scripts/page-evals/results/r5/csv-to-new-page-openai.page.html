<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{padding:20px 18px 96px;max-width:760px;margin:0 auto}h1{font-size:30px;letter-spacing:-.03em;margin:4px 0 6px}h2{font-size:18px;margin:0 0 12px}.sub{color:var(--amber-text-secondary);margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 16px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:16px;margin-bottom:16px;overflow:hidden}.metric{min-height:92px}.label{color:var(--amber-text-secondary);font-size:13px}.value{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}.small{font-size:13px;color:var(--amber-text-secondary);margin-top:4px}.barrow{display:grid;grid-template-columns:72px 1fr 56px;gap:10px;align-items:center;min-height:34px;font-size:13px}.track{height:12px;background:var(--amber-fill);border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--amber-accent);border-radius:999px;min-width:2px}.run{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--amber-separator)}.run:first-child{border-top:0;padding-top:0}.run:last-child{padding-bottom:0}.date{font-weight:650;font-variant-numeric:tabular-nums}.details{color:var(--amber-text-secondary);font-size:14px;line-height:1.35}.pill{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:var(--amber-accent-soft);color:var(--amber-accent-text);font-weight:650;margin-top:8px}.progress{height:14px;background:var(--amber-fill);border-radius:999px;overflow:hidden;margin:12px 0 8px}.progress>div{height:100%;background:var(--amber-accent);border-radius:999px}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--amber-text-secondary)}input{font:inherit;color:var(--amber-text);background:var(--amber-fill);border:0;border-radius:var(--amber-radius-small);padding:10px 12px;min-height:44px;width:100%}button{font:inherit;font-weight:700;min-height:44px;padding:0 16px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-accent);color:var(--amber-on-accent)}.wide{grid-column:1/-1}.err{color:var(--amber-danger);font-size:13px;min-height:18px}.empty{padding:28px 10px;text-align:center;color:var(--amber-text-secondary)}.mono{font-variant-numeric:tabular-nums}@media (min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}form{grid-template-columns:1fr 1fr 1fr 1fr auto}.wide{grid-column:auto}.err{grid-column:1/-1}}@media (max-width:430px){body{padding-left:14px;padding-right:14px}.grid{gap:8px}.card{padding:14px}.value{font-size:24px}.barrow{grid-template-columns:64px 1fr 48px}.run{grid-template-columns:78px 1fr}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const num=s=>{const n=parseFloat(String(s??"").replace(/\s/g,"").replace(",","."));return Number.isFinite(n)?n:0};
const fmt=n=>Number.isFinite(n)?(Math.round(n*10)/10).toLocaleString(undefined,{maximumFractionDigits:1}):"–";
const col=(t,res)=>t.columns.findIndex(c=>res.some(re=>re.test(c.name)));
let addError="",goalError="";
function pace(min,km){if(!km||!min)return"–";const p=min/km;const m=Math.floor(p);const s=Math.round((p-m)*60);return `${m}:${String(s).padStart(2,"0")}/km`;}
function niceDate(d){if(!d)return"";const parts=d.split("-");if(parts.length!==3)return d;return `${parts[1]}/${parts[2]}`;}
function weekStart(dateStr){const d=new Date(dateStr+"T00:00:00Z");if(isNaN(d))return dateStr;const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()-day+1);return d.toISOString().slice(0,10);}
function addDays(dateStr,n){const d=new Date(dateStr+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function findRunTable(note){return note.tables.find(t=>col(t,[/^activity date$/i,/^date$/i])>=0&&col(t,[/distance/i,/^km$/i])>=0)||note.tables[0];}
function rowsFrom(t){const iDate=col(t,[/^activity date$/i,/^date$/i]);const iKm=col(t,[/distance/i,/^km$/i]);const iMin=col(t,[/moving time/i,/minutes/i,/^time/i]);const iHr=col(t,[/^avg hr$/i,/heart/i,/hr$/i]);return {iDate,iKm,iMin,iHr,rows:t.rows.map((r,idx)=>({idx,date:r[iDate]||"",km:num(r[iKm]),min:num(r[iMin]),hr:iHr>=0?num(r[iHr]):0})).filter(r=>r.date).sort((a,b)=>a.date.localeCompare(b.date))};}
function render(note,data){const app=document.getElementById("app");const t=findRunTable(note);if(!t){app.innerHTML=`<h1>${esc(note.title)}</h1><p class="sub">Running dashboard</p><div class="card empty">Add a runs table with Date, Distance and Time columns.</div>`;return;}const meta=rowsFrom(t);if(meta.iDate<0||meta.iKm<0||meta.iMin<0){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">This page needs date, distance and moving time columns in the runs table.</div>`;return;}const runs=meta.rows,totalKm=runs.reduce((s,r)=>s+r.km,0),totalMin=runs.reduce((s,r)=>s+r.min,0),avgHrRuns=runs.filter(r=>r.hr),avgHr=avgHrRuns.length?avgHrRuns.reduce((s,r)=>s+r.hr,0)/avgHrRuns.length:0;const since7=addDays(note.today,-6);const last7=runs.filter(r=>r.date>=since7&&r.date<=note.today).reduce((s,r)=>s+r.km,0);const goal=Number(data.weeklyKm)||30;const pct=Math.min(100,goal?last7/goal*100:0);const weeks=new Map();runs.forEach(r=>{const w=weekStart(r.date);const cur=weeks.get(w)||{km:0,min:0,runs:0};cur.km+=r.km;cur.min+=r.min;cur.runs+=1;weeks.set(w,cur);});const weekEntries=[...weeks.entries()].sort((a,b)=>a[0].localeCompare(b[0])).slice(-8);const maxKm=Math.max(1,...weekEntries.map(x=>x[1].km),goal);const latest=[...runs].reverse().slice(0,8);app.innerHTML=`
<h1>${esc(note.title)}</h1><p class="sub">${runs.length?`${esc(niceDate(runs[0].date))}–${esc(niceDate(runs[runs.length-1].date))}`:"No runs yet"}</p>
<section class="grid" aria-label="Running totals">
 <div class="card metric"><div class="label">Total distance</div><div class="value">${fmt(totalKm)} km</div><div class="small">${runs.length} runs</div></div>
 <div class="card metric"><div class="label">Moving time</div><div class="value">${Math.floor(totalMin/60)}h ${Math.round(totalMin%60)}m</div><div class="small">${pace(totalMin,totalKm)}</div></div>
 <div class="card metric"><div class="label">Last 7 days</div><div class="value">${fmt(last7)} km</div><div class="small">Goal ${fmt(goal)} km</div></div>
 <div class="card metric"><div class="label">Avg HR</div><div class="value">${avgHr?Math.round(avgHr):"–"}</div><div class="small">beats/min</div></div>
</section>
<section class="card"><h2>7-day goal</h2><div class="progress" aria-label="${Math.round(pct)} percent of weekly goal"><div style="width:${pct}%"></div></div><div class="small mono">${fmt(last7)} of ${fmt(goal)} km (${Math.round(pct)}%)</div><form id="goalForm" style="margin-top:12px"><label class="wide">Weekly goal (km)<input name="goal" inputmode="decimal" value="${esc(goal)}" aria-label="Weekly goal in kilometres"></label><button>Save goal</button><div class="err" role="alert">${esc(goalError)}</div></form></section>
<section class="card"><h2>Weekly distance</h2>${weekEntries.length?weekEntries.map(([w,v])=>`<div class="barrow"><div class="mono">${esc(niceDate(w))}</div><div class="track"><div class="bar" style="width:${Math.max(3,v.km/maxKm*100)}%"></div></div><div class="mono">${fmt(v.km)} km</div></div>`).join(""):'<div class="empty">No weekly data yet.</div>'}</section>
<section class="card"><h2>Latest runs</h2>${latest.length?latest.map(r=>`<div class="run"><div><div class="date">${esc(niceDate(r.date))}</div><div class="pill">${fmt(r.km)} km</div></div><div class="details"><strong>${esc(pace(r.min,r.km))}</strong><br>${Math.round(r.min)} min${r.hr?` · ${Math.round(r.hr)} bpm`:""}</div></div>`).join(""):'<div class="empty">No runs yet.</div>'}</section>
<section class="card"><h2>Log a run</h2><form id="addRun"><label>Date<input name="date" type="date" value="${esc(note.today)}" required></label><label>Distance (km)<input name="km" inputmode="decimal" required></label><label>Moving time (min)<input name="min" inputmode="decimal" required></label><label>Avg HR<input name="hr" inputmode="numeric"></label><button>Add</button><div class="err" role="alert">${esc(addError)}</div></form></section>`;
document.getElementById("goalForm").onsubmit=async e=>{e.preventDefault();const v=num(new FormData(e.target).get("goal"));if(v<=0){goalError="Enter a goal above 0.";render(amber.note,amber.data);return;}const r=await amber.setData({weeklyKm:v});goalError=r.ok?"":r.error;if(!r.ok)render(amber.note,amber.data);};
document.getElementById("addRun").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const values={};values[t.columns[meta.iDate].name]=String(f.get("date")||"");values[t.columns[meta.iKm].name]=String(f.get("km")||"").replace(",",".");values[t.columns[meta.iMin].name]=String(f.get("min")||"").replace(",",".");if(meta.iHr>=0)values[t.columns[meta.iHr].name]=String(f.get("hr")||"");const r=await amber.update({op:"append_row",table:t.index,values});addError=r.ok?"":r.error;if(!r.ok)render(amber.note,amber.data);};}
amber.onChange(render);
</script>
</body>
</html>
