<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household expenses</title>
<style>
  * { box-sizing: border-box; }
  body { padding: 20px 18px 80px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 28px; line-height: 1.1; letter-spacing: -.02em; margin: 0 0 18px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--amber-text-secondary); margin: 24px 4px 8px; }
  button { font: inherit; color: inherit; }
  .hero { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 18px; margin-bottom: 18px; }
  .eyebrow { color: var(--amber-text-secondary); font-size: 15px; margin-bottom: 4px; }
  .total { font-size: clamp(42px, 13vw, 76px); line-height: .95; letter-spacing: -.055em; font-weight: 800; font-variant-numeric: tabular-nums; margin: 2px 0 10px; }
  .summary { display: flex; flex-wrap: wrap; gap: 10px 14px; color: var(--amber-text-secondary); font-size: 14px; }
  .summary strong { color: var(--amber-text); font-weight: 700; }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); overflow: hidden; margin-bottom: 16px; }
  .month { width: 100%; border: 0; background: transparent; min-height: 62px; padding: 12px 14px; display: grid; grid-template-columns: 76px 1fr auto; gap: 12px; align-items: center; text-align: left; border-top: 1px solid var(--amber-separator); }
  .month:first-child { border-top: 0; }
  .month[aria-pressed="true"] { background: var(--amber-accent-soft); }
  .month-name { font-weight: 700; }
  .bar-track { height: 14px; border-radius: 999px; background: var(--amber-fill); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; background: var(--amber-accent); min-width: 2px; }
  .amount { font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .muted { color: var(--amber-text-secondary); font-size: 13px; }
  .cat-head { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 10px; background: var(--amber-accent-soft); border-top: 1px solid var(--amber-separator); }
  .cat-head:first-child { border-top: 0; }
  .cat-name { flex: 1; min-width: 0; font-weight: 750; overflow-wrap: anywhere; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--amber-separator); }
  .item-title { min-width: 0; overflow-wrap: anywhere; }
  .empty { padding: 28px 18px; text-align: center; color: var(--amber-text-secondary); }
  .missing { padding: 18px; color: var(--amber-text-secondary); }
  @media (max-width: 430px) {
    body { padding-left: 14px; padding-right: 14px; }
    .month { grid-template-columns: 68px 1fr; }
    .month .amount { grid-column: 2; }
  }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const fullMonthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const money = (n) => (Number(n) || 0).toLocaleString("sv-SE", { maximumFractionDigits: 0 }) + " kr";
  const parseAmount = (s) => {
    const cleaned = String(s ?? "").replace(/\s/g, "").replace(/[^0-9,.-]/g, "").replace(",", ".");
    const n = parseFloat(cleaned);
    return Number.isFinite(n) ? n : 0;
  };
  const monthKey = (d) => /^\d{4}-\d{2}/.test(String(d || "")) ? String(d).slice(0, 7) : "No date";
  const monthLabel = (m, long) => {
    if (!/^\d{4}-\d{2}$/.test(m)) return m;
    const i = Math.max(0, Math.min(11, Number(m.slice(5, 7)) - 1));
    return (long ? fullMonthNames[i] : monthNames[i]) + " " + m.slice(0, 4);
  };
  const col = (t, re) => t.columns.findIndex((c) => re.test(c.name));
  let pageError = "";

  function buildRows(table, idx) {
    return table.rows.map((r, rowIndex) => ({
      rowIndex,
      date: idx.date >= 0 ? r[idx.date] : "",
      item: idx.item >= 0 ? r[idx.item] : "Expense",
      category: (idx.category >= 0 && r[idx.category]) ? r[idx.category] : "Uncategorized",
      amount: parseAmount(idx.amount >= 0 ? r[idx.amount] : "0")
    })).filter((r) => r.amount || r.item || r.date || r.category);
  }

  function render(note, data) {
    const app = document.getElementById("app");
    const table = note.tables.find((t) => col(t, /^(amt|amount|cost|price|sum|kr)$/i) >= 0) || note.tables[0];
    if (!table) {
      app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card missing">Add an expenses table with Date, Item, Category and Amount columns to see the dashboard.</div>`;
      return;
    }
    const idx = {
      date: col(table, /^date$/i),
      item: col(table, /^(item|what|description|name)$/i),
      category: col(table, /^(category|cat|type)$/i),
      amount: col(table, /^(amt|amount|cost|price|sum|kr)$/i)
    };
    if (idx.amount < 0) {
      app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card missing">I found a table, but it needs an Amount or Amt column for totals.</div>`;
      return;
    }

    const rows = buildRows(table, idx);
    const totalsByMonth = new Map();
    rows.forEach((r) => totalsByMonth.set(monthKey(r.date), (totalsByMonth.get(monthKey(r.date)) || 0) + r.amount));
    const months = [...totalsByMonth.entries()].sort((a, b) => a[0].localeCompare(b[0]));
    const latestMonth = months.length ? months[months.length - 1][0] : note.today.slice(0, 7);
    const currentMonth = months.some(([m]) => m === note.today.slice(0, 7)) ? note.today.slice(0, 7) : latestMonth;
    const selectedMonth = data && data.selectedMonth && totalsByMonth.has(data.selectedMonth) ? data.selectedMonth : currentMonth;
    const monthRows = rows.filter((r) => monthKey(r.date) === selectedMonth).sort((a, b) => String(a.date).localeCompare(String(b.date)) || a.item.localeCompare(b.item));
    const monthTotal = monthRows.reduce((s, r) => s + r.amount, 0);
    const maxMonth = Math.max(1, ...months.map(([, v]) => v));

    const grouped = new Map();
    monthRows.forEach((r) => {
      if (!grouped.has(r.category)) grouped.set(r.category, []);
      grouped.get(r.category).push(r);
    });
    const categories = [...grouped.entries()].map(([name, list]) => ({ name, list, total: list.reduce((s, r) => s + r.amount, 0) })).sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
    const biggestCategory = categories[0];

    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <section class="hero" aria-label="Selected month total">
        <div class="eyebrow">${esc(monthLabel(selectedMonth, true))} total</div>
        <div class="total">${esc(money(monthTotal))}</div>
        <div class="summary">
          <span><strong>${monthRows.length}</strong> expense${monthRows.length === 1 ? "" : "s"}</span>
          ${biggestCategory ? `<span><strong>${esc(biggestCategory.name)}</strong> is largest</span>` : ""}
        </div>
      </section>

      <h2>Monthly bars</h2>
      <section class="card" aria-label="Expenses by month">
        ${months.length ? months.map(([m, total]) => `
          <button class="month" type="button" data-month="${esc(m)}" aria-pressed="${m === selectedMonth ? "true" : "false"}">
            <div><div class="month-name">${esc(monthLabel(m, false))}</div><div class="muted">${esc(String(rows.filter((r) => monthKey(r.date) === m).length))} rows</div></div>
            <div class="bar-track" aria-hidden="true"><div class="bar-fill" style="width:${Math.max(3, total / maxMonth * 100).toFixed(1)}%"></div></div>
            <div class="amount">${esc(money(total))}</div>
          </button>`).join("") : `<div class="empty">No expenses yet.</div>`}
      </section>
      ${pageError ? `<div class="missing" role="alert">${esc(pageError)}</div>` : ""}

      <h2>By category · ${esc(monthLabel(selectedMonth, false))}</h2>
      <section class="card" aria-label="Expenses grouped by category">
        ${categories.length ? categories.map((cat) => `
          <div class="cat-head">
            <div class="cat-name">${esc(cat.name)}</div>
            <div class="muted">${Math.round(cat.total / (monthTotal || 1) * 100)}%</div>
            <div class="amount">${esc(money(cat.total))}</div>
          </div>
          ${cat.list.map((r) => `
            <div class="item">
              <div class="item-title">${esc(r.item)}<div class="muted">${esc(r.date || "No date")}</div></div>
              <div class="amount">${esc(money(r.amount))}</div>
            </div>`).join("")}`).join("") : `<div class="empty">No expenses in ${esc(monthLabel(selectedMonth, true))}.</div>`}
      </section>`;

    app.querySelectorAll("button[data-month]").forEach((button) => {
      button.addEventListener("click", async () => {
        const value = button.getAttribute("data-month");
        const result = await amber.setData({ selectedMonth: value });
        if (!result.ok) {
          pageError = result.error || "Could not switch month.";
          render(amber.note, amber.data);
        } else {
          pageError = "";
        }
      });
    });
  }

  amber.onChange(render);
</script>
</body>
</html>
