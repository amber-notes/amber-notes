<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 680px; padding: 20px 18px 96px; }
  h1 { font-size: 28px; line-height: 1.15; letter-spacing: -.02em; margin: 4px 0 8px; }
  h2 { font-size: 19px; line-height: 1.2; margin: 0; }
  .summary { color: var(--amber-text-secondary); margin: 0 0 18px; }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); margin: 0 0 16px; overflow: hidden; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px; border-bottom: 1px solid var(--amber-separator); }
  .count { color: var(--amber-text-secondary); font-size: 14px; white-space: nowrap; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid var(--amber-separator); }
  li:first-child { border-top: 0; }
  .item-label { display: flex; align-items: flex-start; gap: 12px; min-height: 52px; padding: 13px 16px; color: var(--amber-text); }
  input[type="checkbox"] { appearance: none; -webkit-appearance: none; flex: 0 0 auto; width: 24px; height: 24px; margin: 0; border: 2px solid var(--amber-text-secondary); border-radius: 7px; background: var(--amber-fill); }
  input[type="checkbox"]:checked { background: var(--amber-accent); border-color: var(--amber-accent); }
  input[type="checkbox"]:checked::after { content: ""; display: block; width: 6px; height: 11px; margin: 2px 0 0 7px; border: solid var(--amber-on-accent); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  input[type="checkbox"]:focus-visible, input[type="text"]:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--amber-accent); outline-offset: 2px; }
  .item-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .done .item-text { color: var(--amber-text-secondary); text-decoration: line-through; }
  .add-card { padding: 16px; }
  form { display: grid; gap: 12px; }
  label, .field-label { display: grid; gap: 6px; color: var(--amber-text-secondary); font-size: 14px; }
  input[type="text"], select { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--amber-separator); border-radius: var(--amber-radius-small); background: var(--amber-fill); color: var(--amber-text); font: inherit; }
  button { min-height: 44px; border: 0; border-radius: var(--amber-radius-small); padding: 0 16px; background: var(--amber-accent); color: var(--amber-on-accent); font: inherit; font-weight: 700; }
  .status { min-height: 20px; margin: 10px 0 0; color: var(--amber-text-secondary); }
  .status.error { color: var(--amber-danger); }
  .empty { padding: 24px 16px; color: var(--amber-text-secondary); text-align: center; }
  @media (min-width: 560px) { form { grid-template-columns: 1fr 180px auto; align-items: end; } .status { grid-column: 1 / -1; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  let statusText = "";
  let statusIsError = false;
  let lastSection = "";
  let focusNewItem = false;

  function headingsFromMarkdown(markdown) {
    const headings = [{ line: 1, text: "Packing" }];
    String(markdown || "").split(/\n/).forEach((line, index) => {
      const match = line.match(/^##\s+(.+)\s*$/);
      if (match) headings.push({ line: index + 1, text: match[1].trim() });
    });
    return headings;
  }

  function sectionForLine(headings, line) {
    let section = headings[0].text;
    for (const heading of headings) {
      if (heading.line < line) section = heading.text;
    }
    return section;
  }

  function groupedChecklist(note) {
    const headings = headingsFromMarkdown(note.markdown);
    const groups = [];
    const byName = new Map();
    for (const item of note.checklists) {
      const name = sectionForLine(headings, item.line);
      if (!byName.has(name)) {
        const group = { name, items: [] };
        byName.set(name, group);
        groups.push(group);
      }
      byName.get(name).items.push(item);
    }
    const selectable = headings.filter((h) => h.text !== "Packing" || groups.some((g) => g.name === "Packing")).map((h) => h.text);
    return { groups, selectable: selectable.length ? selectable : ["Packing"] };
  }

  function render(note) {
    const app = document.getElementById("app");
    const { groups, selectable } = groupedChecklist(note);
    const total = note.checklists.length;
    const packed = note.checklists.filter((item) => item.checked).length;
    if (!lastSection || !selectable.includes(lastSection)) lastSection = selectable[0] || "";

    const sectionsHtml = groups.length ? groups.map((group, index) => {
      const done = group.items.filter((item) => item.checked).length;
      const items = group.items.map((item) => {
        const checkboxId = `item-${item.line}`;
        return `<li class="${item.checked ? "done" : ""}"><label class="item-label" for="${checkboxId}"><input id="${checkboxId}" type="checkbox" data-line="${item.line}" ${item.checked ? "checked" : ""}><span class="item-text">${esc(item.text)}</span></label></li>`;
      }).join("");
      return `<section class="card" aria-labelledby="section-${index}"><div class="section-head"><h2 id="section-${index}">${esc(group.name)}</h2><span class="count">${done} of ${group.items.length} packed</span></div><ul>${items}</ul></section>`;
    }).join("") : `<section class="card"><div class="empty">No packing items yet. Add the first item below.</div></section>`;

    const options = selectable.map((name) => `<option value="${esc(name)}" ${name === lastSection ? "selected" : ""}>${esc(name)}</option>`).join("");
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <p class="summary" id="packing-summary">${packed} of ${total} items packed.</p>
      ${sectionsHtml}
      <section class="card add-card" aria-labelledby="add-heading">
        <h2 id="add-heading">Add a packing item</h2>
        <form id="add-form">
          <label for="new-item">Item name<input id="new-item" name="item" type="text" autocomplete="off" required></label>
          <label for="section-select">Section<select id="section-select" name="section">${options}</select></label>
          <button type="submit">Add item</button>
          <p id="status" class="status ${statusIsError ? "error" : ""}" role="status" aria-live="polite">${esc(statusText)}</p>
        </form>
      </section>`;

    app.querySelectorAll('input[type="checkbox"][data-line]').forEach((box) => {
      box.addEventListener("change", async () => {
        box.disabled = true;
        statusText = "";
        statusIsError = false;
        const result = await amber.update({ op: "toggle_checklist", line: Number(box.dataset.line) });
        if (!result.ok) {
          statusText = result.error || "Could not update that item.";
          statusIsError = true;
          render(amber.note);
        }
      });
    });

    const form = document.getElementById("add-form");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = new FormData(form);
      const text = String(data.get("item") || "").trim();
      const section = String(data.get("section") || "");
      lastSection = section;
      if (!text) {
        statusText = "Enter an item name.";
        statusIsError = true;
        render(note);
        return;
      }
      statusText = "Adding item…";
      statusIsError = false;
      render(note);
      const result = await amber.update({ op: "add_checklist_item", text, under_heading: section === "Packing" ? undefined : section });
      if (result.ok) {
        statusText = `Added ${text}.`;
        statusIsError = false;
        focusNewItem = true;
      } else {
        statusText = result.error || "Could not add the item.";
        statusIsError = true;
        render(amber.note);
      }
    });

    const select = document.getElementById("section-select");
    select.addEventListener("change", () => { lastSection = select.value; });
    if (focusNewItem) {
      focusNewItem = false;
      setTimeout(() => document.getElementById("new-item")?.focus(), 0);
    }
  }

  amber.onChange((note) => render(note));
</script>
</body>
</html>
