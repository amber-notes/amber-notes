<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisbon trip packing</title>
<style>
  * { box-sizing: border-box; }
  body { padding: 20px 18px 96px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 4px; }
  h2 { font-size: 20px; margin: 0; padding: 14px 16px 6px; }
  .summary { color: var(--amber-text-secondary); margin: 0 0 16px; }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); border: 1px solid var(--amber-separator); margin-bottom: 16px; overflow: hidden; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid var(--amber-separator); }
  li:first-child { border-top: 0; }
  li label { display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 10px 16px; cursor: pointer; overflow-wrap: anywhere; }
  li input[type=checkbox] { width: 24px; height: 24px; flex: none; margin: 0; accent-color: var(--amber-accent); }
  li input:checked + span { color: var(--amber-text-secondary); text-decoration: line-through; }
  form { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  form label { display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: var(--amber-text-secondary); }
  input[type=text], select { font: inherit; color: var(--amber-text); background: var(--amber-fill); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius-small); padding: 10px 12px; min-height: 44px; width: 100%; }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 20px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-accent); color: var(--amber-on-accent); }
  :focus-visible { outline: 3px solid var(--amber-accent-text); outline-offset: 2px; }
  .status { padding: 0 16px 16px; min-height: 1.4em; margin: 0; }
  .status.err { color: var(--amber-danger); }
  .empty { padding: 20px 16px; color: var(--amber-text-secondary); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="summary" id="summary"></p>
  <div id="lists"></div>
  <section class="card" aria-labelledby="addh">
    <h2 id="addh">Add an item</h2>
    <form id="add">
      <label for="v">Item name<input type="text" id="v" autocomplete="off"></label>
      <label for="sec">Section<select id="sec"></select></label>
      <button type="submit">Add item</button>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>
</main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const $ = (id) => document.getElementById(id);
  const NONE = "Other";
  let focusLine = null;

  function say(msg, isErr) { const s = $("status"); s.className = "status" + (isErr ? " err" : ""); s.textContent = ""; setTimeout(() => { s.textContent = msg; }, 30); }

  function render(note) {
    $("title").textContent = note.title;
    const lines = note.markdown.split("\n");
    const heads = [];
    lines.forEach((l, i) => { const m = /^#{2,6}\s+(.*)$/.exec(l); if (m) heads.push({ line: i + 1, text: m[1].trim() }); });
    const groups = [];
    note.checklists.forEach((c) => {
      let h = NONE;
      heads.forEach((x) => { if (x.line < c.line) h = x.text; });
      let g = groups.find((g) => g.name === h);
      if (!g) { g = { name: h, items: [] }; groups.push(g); }
      g.items.push(c);
    });
    const done = note.checklists.filter((c) => c.checked).length;
    const total = note.checklists.length;
    $("summary").textContent = total ? done + " of " + total + " items packed" : "";

    $("lists").innerHTML = total ? groups.map((g, gi) => {
      const done = g.items.filter((c) => c.checked).length;
      return `<section class="card" aria-labelledby="h${gi}"><h2 id="h${gi}">${esc(g.name)} <span class="sr">, ${done} of ${g.items.length} packed</span></h2><ul>` +
        g.items.map((c) => `<li><label><input type="checkbox" data-line="${c.line}"${c.checked ? " checked" : ""}><span>${esc(c.text)}</span></label></li>`).join("") +
        `</ul></section>`;
    }).join("") : '<div class="card empty">No items yet. Add one below.</div>';

    const sec = $("sec"), prev = sec.value;
    const names = heads.map((h) => h.text);
    sec.innerHTML = names.length ? names.map((n) => `<option>${esc(n)}</option>`).join("") : '<option value="">Checklist</option>';
    if (names.includes(prev)) sec.value = prev;

    document.querySelectorAll('#lists input[type=checkbox]').forEach((b) => {
      b.onchange = async () => {
        focusLine = b.dataset.line;
        const label = b.nextElementSibling.textContent;
        const r = await amber.update({ op: "toggle_checklist", line: +b.dataset.line });
        if (!r.ok) { b.checked = !b.checked; say(r.error, true); }
        else say(label + (b.checked ? " packed" : " not packed"));
      };
    });
    if (focusLine) {
      const el = document.querySelector('#lists input[data-line="' + focusLine + '"]');
      if (el) el.focus();
      focusLine = null;
    }
  }

  $("add").onsubmit = async (e) => {
    e.preventDefault();
    const v = $("v").value.trim();
    if (!v) { say("Enter an item name first.", true); $("v").focus(); return; }
    const op = { op: "add_checklist_item", text: v };
    if ($("sec").value) op.under_heading = $("sec").value;
    const r = await amber.update(op);
    if (r.ok) { $("v").value = ""; say(v + " added" + (op.under_heading ? " to " + op.under_heading : "")); }
    else say(r.error, true);
    $("v").focus();
  };
  amber.onChange(render);
</script>
</body>
</html>
