<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{padding:20px 16px 90px;max-width:760px;margin:0 auto}h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 6px}.muted{color:var(--amber-text-secondary);font-size:14px;line-height:1.35}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);margin:14px 0;overflow:hidden}.pad{padding:16px}.summary{display:grid;grid-template-columns:1fr;gap:10px}.tile{background:var(--amber-fill);border-radius:var(--amber-radius-small);padding:14px}.label{color:var(--amber-text-secondary);font-size:13px;margin-bottom:4px}.value{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.pos{color:var(--amber-accent-text)}.neg{color:var(--amber-danger)}.stock{padding:14px 16px;border-top:1px solid var(--amber-separator)}.stock:first-child{border-top:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.ticker{font-weight:750;font-size:18px}.nums{font-variant-numeric:tabular-nums;text-align:right}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--amber-text-secondary)}input{font:inherit;color:var(--amber-text);background:var(--amber-fill);border:0;border-radius:var(--amber-radius-small);min-height:44px;padding:9px 10px;width:100%}button{font:inherit;font-weight:650;min-height:44px;border:0;border-radius:var(--amber-radius-small);padding:0 14px;background:var(--amber-accent);color:var(--amber-on-accent)}.ghost{background:var(--amber-fill);color:var(--amber-text)}.actions{display:flex;gap:8px;align-items:flex-end}.notice{border-left:4px solid var(--amber-accent);background:var(--amber-accent-soft);padding:12px 14px;border-radius:var(--amber-radius-small);margin-top:14px}.err{color:var(--amber-danger);font-size:14px;margin-top:8px;min-height:18px}.empty{text-align:center;color:var(--amber-text-secondary);padding:28px 16px}form.add{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}@media(min-width:620px){.summary{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(5,1fr)}form.add{grid-template-columns:1.1fr .8fr .8fr .8fr auto}.full{grid-column:auto}.actions{grid-column:auto}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=s=>{const n=parseFloat(String(s??"").replace(/\s/g,"").replace(",","."));return Number.isFinite(n)?n:null};
const money=(n,c)=>Number.isFinite(n)?`${n<0?"-":""}${Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}${c?" "+c:""}`:"—";
const pct=n=>Number.isFinite(n)?`${n>=0?"+":""}${n.toFixed(1)}%`:"—";
const ci=(t,re)=>t.columns.findIndex(c=>re.test(c.name));
let msg="";
function firstTable(note){return note.tables.find(t=>ci(t,/^ticker$/i)>=0)||note.tables[0];}
function rows(t){const ix={ticker:ci(t,/^ticker$/i),shares:ci(t,/^shares?$/i),buy:ci(t,/^buy price$/i),cur:ci(t,/^current price$/i),ccy:ci(t,/^currency$/i)};return t.rows.map((r,i)=>{const shares=num(r[ix.shares]),buy=num(r[ix.buy]),cur=num(r[ix.cur]),cost=shares!=null&&buy!=null?shares*buy:null,value=shares!=null&&cur!=null?shares*cur:null,profit=value!=null&&cost!=null?value-cost:null,pp=profit!=null&&cost?profit/cost*100:null;return{row:i,ticker:r[ix.ticker]||"",shares:r[ix.shares]||"",buy:r[ix.buy]||"",cur:r[ix.cur]||"",ccy:r[ix.ccy]||"",cost,value,profit,pp};});}
function render(note,data){const app=document.getElementById("app"),t=firstTable(note);if(!t){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">Add a stock table with Ticker, Shares, Buy price and Current price columns.</div>`;return;}const need=[/^ticker$/i,/^shares?$/i,/^buy price$/i,/^current price$/i].filter(re=>ci(t,re)<0);if(need.length){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">Add columns: Ticker, Shares, Buy price, Current price.</div>`;return;}const rs=rows(t);const groups={};rs.forEach(x=>{const k=x.ccy||"";groups[k]??={cost:0,value:0,profit:0,has:false};if(x.cost!=null)groups[k].cost+=x.cost;if(x.value!=null){groups[k].value+=x.value;groups[k].has=true}if(x.profit!=null)groups[k].profit+=x.profit;});const tiles=Object.entries(groups).map(([c,g])=>`<div class="tile"><div class="label">${esc(c||"Portfolio")} profit</div><div class="value ${g.profit>=0?"pos":"neg"}">${g.has?money(g.profit,c):"—"}</div><div class="muted">Value ${g.has?money(g.value,c):"—"} · Cost ${money(g.cost,c)}</div></div>`).join("")||`<div class="tile"><div class="label">Portfolio profit</div><div class="value">—</div><div class="muted">Add stocks below.</div></div>`;app.innerHTML=`<h1>${esc(note.title)}</h1><div class="muted">Profit is calculated from Shares × (Current price − Buy price).</div><div class="notice muted"><strong>Live fetching is not available inside Amber pages.</strong> This page cannot call finance sites from the sandbox, so update the Current price cells here and it will calculate profit instantly.</div><section class="summary card pad">${tiles}</section><section class="card">${rs.length?rs.map(x=>`<div class="stock"><div class="top"><div><div class="ticker">${esc(x.ticker||"Untitled")}</div><div class="muted">${esc(x.shares)} shares @ ${esc(x.buy)}${x.ccy?" "+esc(x.ccy):""}</div></div><div class="nums"><div class="${(x.profit||0)>=0?"pos":"neg"}">${money(x.profit,x.ccy)}</div><div class="muted">${pct(x.pp)}</div></div></div><div class="grid"><label>Current price<input inputmode="decimal" data-row="${x.row}" data-col="Current price" value="${esc(x.cur)}" aria-label="Current price for ${esc(x.ticker)}"></label><label>Shares<input inputmode="decimal" data-row="${x.row}" data-col="Shares" value="${esc(x.shares)}" aria-label="Shares for ${esc(x.ticker)}"></label><label>Buy price<input inputmode="decimal" data-row="${x.row}" data-col="Buy price" value="${esc(x.buy)}" aria-label="Buy price for ${esc(x.ticker)}"></label><label>Currency<input data-row="${x.row}" data-col="Currency" value="${esc(x.ccy)}" aria-label="Currency for ${esc(x.ticker)}"></label><div class="actions"><button class="ghost save" data-row="${x.row}">Save</button></div></div></div>`).join(""):`<div class="empty">No stocks yet.</div>`}</section><section class="card pad"><form class="add" id="add"><label>Ticker<input name="Ticker" required></label><label>Shares<input name="Shares" inputmode="decimal"></label><label>Buy price<input name="Buy price" inputmode="decimal"></label><label>Current price<input name="Current price" inputmode="decimal"></label><label class="full">Currency<input name="Currency" placeholder="USD"></label><button class="full">Add</button></form><div class="err" role="alert">${esc(msg)}</div></section>`;document.querySelectorAll(".save").forEach(b=>b.onclick=async()=>{const r=Number(b.dataset.row);msg="";for(const inp of document.querySelectorAll(`input[data-row="${r}"]`)){const res=await amber.update({op:"set_cell",table:t.index,row:r,col:inp.dataset.col,value:inp.value.trim()});if(!res.ok){msg=res.error;break;}}if(msg)render(amber.note,amber.data);});document.getElementById("add").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),vals={};["Ticker","Shares","Buy price","Current price","Currency"].forEach(k=>vals[k]=(fd.get(k)||"").trim());const res=await amber.update({op:"append_row",table:t.index,values:vals});msg=res.ok?"":res.error;if(!res.ok)render(amber.note,amber.data);};}
amber.onChange(render);
</script>
</body>
</html>
