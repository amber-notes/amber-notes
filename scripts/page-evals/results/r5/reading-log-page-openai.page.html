<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    max-width: 980px;
    padding: 22px 16px 56px;
    color: var(--amber-text);
  }
  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 16px;
    align-items: end;
    margin-bottom: 16px;
  }
  h1 {
    margin: 0;
    font: 800 clamp(30px, 7vw, 54px)/.92 var(--amber-font-rounded, var(--amber-font));
    letter-spacing: -.055em;
  }
  .subtitle { margin: 10px 0 0; color: var(--amber-text-secondary); font-size: 15px; }
  .badge {
    justify-self: end;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--amber-separator);
    background: var(--amber-accent-soft);
    color: var(--amber-accent-text);
    border-radius: 999px;
    padding: 8px 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin: 14px 0 22px;
  }
  .stat, .panel {
    background: var(--amber-surface);
    border: 1px solid var(--amber-separator);
    border-radius: var(--amber-radius);
    box-shadow: 0 10px 30px color-mix(in srgb, var(--amber-text) 5%, transparent);
  }
  .stat { padding: 14px; min-height: 94px; }
  .stat .num { font-size: 30px; line-height: 1; font-weight: 800; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
  .stat .label { margin-top: 6px; color: var(--amber-text-secondary); font-size: 13px; }
  .stars { color: var(--amber-accent-text); letter-spacing: .03em; white-space: nowrap; }
  .panel { padding: 16px; margin-bottom: 22px; overflow: hidden; }
  .section-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 14px;
  }
  h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .095em;
    color: var(--amber-text-secondary);
  }
  .hint { color: var(--amber-text-secondary); font-size: 13px; }
  .months {
    display: grid;
    grid-template-columns: repeat(var(--month-count, 6), minmax(34px, 1fr));
    align-items: end;
    gap: 9px;
    min-height: 146px;
  }
  .month { min-width: 0; display: grid; grid-template-rows: 1fr auto auto; gap: 7px; align-items: end; }
  .bar-wrap { height: 108px; display: flex; align-items: end; }
  .bar {
    width: 100%;
    min-height: 5px;
    border-radius: 10px 10px 4px 4px;
    background: linear-gradient(180deg, var(--amber-accent), var(--amber-accent-text));
    box-shadow: inset 0 1px 0 color-mix(in srgb, white 25%, transparent);
  }
  .count { text-align: center; font: 800 12px/1 var(--amber-font-mono); color: var(--amber-text); }
  .mon { text-align: center; color: var(--amber-text-secondary); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shelf {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
    gap: 16px;
  }
  .book-card { min-width: 0; }
  .cover {
    position: relative;
    min-height: 230px;
    border-radius: 14px 10px 10px 14px;
    padding: 18px 16px 16px 22px;
    color: var(--amber-on-accent);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background:
      radial-gradient(circle at 20% 12%, rgba(255,255,255,.30), transparent 28%),
      linear-gradient(135deg, hsl(var(--h) 62% 48%), hsl(var(--h2) 58% 31%));
    box-shadow: 0 18px 28px color-mix(in srgb, var(--amber-text) 16%, transparent), inset 8px 0 0 rgba(0,0,0,.18), inset 9px 0 0 rgba(255,255,255,.08);
  }
  .cover:before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(255,255,255,.12), transparent 18%, rgba(0,0,0,.10));
    pointer-events: none;
  }
  .cover:after {
    content: "";
    position: absolute;
    right: 14px;
    top: 14px;
    width: 38px;
    height: 56px;
    border: 1px solid rgba(255,255,255,.45);
    border-radius: 50% 50% 45% 45%;
    opacity: .35;
  }
  .title {
    position: relative;
    font: 800 20px/1.08 var(--amber-font-rounded, var(--amber-font));
    letter-spacing: -.035em;
    overflow-wrap: anywhere;
    text-shadow: 0 1px 12px rgba(0,0,0,.20);
  }
  .author {
    position: relative;
    margin-top: 10px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .08em;
    opacity: .86;
  }
  .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
    color: var(--amber-text-secondary);
    font-size: 13px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 8px;
    border-radius: 999px;
    color: var(--amber-text);
    background: var(--amber-fill);
    font-variant-numeric: tabular-nums;
  }
  .empty {
    padding: 28px 16px;
    color: var(--amber-text-secondary);
    text-align: center;
    border: 1px dashed var(--amber-separator);
    border-radius: var(--amber-radius);
    background: var(--amber-fill);
  }
  @media (max-width: 720px) {
    .hero { grid-template-columns: 1fr; }
    .badge { justify-self: start; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .months { gap: 6px; }
    .shelf { grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 12px; }
    .cover { min-height: 210px; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[ch]);
  const findCol = (table, names) => {
    const wanted = names.map((n) => n.toLowerCase());
    return table.columns.findIndex((c) => wanted.includes(String(c.name).toLowerCase()));
  };
  const softFindCol = (table, re) => table.columns.findIndex((c) => re.test(c.name));
  const hue = (text) => {
    let h = 37;
    for (const ch of String(text || "book")) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return h;
  };
  const prettyDate = (iso) => {
    if (!iso) return "";
    const d = new Date(String(iso) + "T12:00:00");
    return Number.isNaN(d.getTime()) ? iso : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  };
  const monthLabel = (ym) => {
    const d = new Date(ym + "-15T12:00:00");
    return Number.isNaN(d.getTime()) ? ym : d.toLocaleDateString(undefined, { month: "short", year: "2-digit" });
  };
  const ratingStars = (n) => {
    if (!Number.isFinite(n)) return "Not rated";
    const full = Math.max(0, Math.min(5, Math.round(n)));
    return "★".repeat(full) + "☆".repeat(5 - full);
  };

  function render(note) {
    const app = document.getElementById("app");
    const table = note.tables.find((t) => findCol(t, ["Title", "Book"]) >= 0) || note.tables[0];
    if (!table) {
      app.innerHTML = `<div class="hero"><div><h1>${esc(note.title)}</h1><p class="subtitle">Add a reading table to see your shelf here.</p></div></div><div class="empty">No table found.</div>`;
      return;
    }

    const titleCol = findCol(table, ["Title", "Book"]);
    const authorCol = findCol(table, ["Author"]);
    const finishedCol = findCol(table, ["Finished", "Date", "Read"]);
    const ratingCol = findCol(table, ["Rating", "Stars", "Score"]);
    const tCol = titleCol >= 0 ? titleCol : 0;
    const aCol = authorCol >= 0 ? authorCol : softFindCol(table, /author|by/i);
    const fCol = finishedCol >= 0 ? finishedCol : softFindCol(table, /finish|date|read/i);
    const rCol = ratingCol >= 0 ? ratingCol : softFindCol(table, /rating|stars|score/i);

    const books = table.rows.map((row, index) => ({
      index,
      title: row[tCol] || "Untitled",
      author: aCol >= 0 ? row[aCol] : "",
      finished: fCol >= 0 ? row[fCol] : "",
      rating: rCol >= 0 && row[rCol] !== "" ? Number(row[rCol]) : NaN
    }));
    const rated = books.filter((book) => Number.isFinite(book.rating));
    const average = rated.length ? rated.reduce((sum, book) => sum + book.rating, 0) / rated.length : NaN;
    const thisYear = note.today.slice(0, 4);
    const yearCount = books.filter((book) => String(book.finished).startsWith(thisYear)).length;

    const monthMap = new Map();
    books.forEach((book) => {
      const ym = /^\d{4}-\d{2}/.test(book.finished) ? book.finished.slice(0, 7) : "No date";
      monthMap.set(ym, (monthMap.get(ym) || 0) + 1);
    });
    const months = Array.from(monthMap.entries())
      .filter(([month]) => month !== "No date")
      .sort(([a], [b]) => a.localeCompare(b));
    const maxMonth = Math.max(1, ...months.map(([, count]) => count));
    const bestMonth = months.length ? months.reduce((best, current) => current[1] > best[1] ? current : best, months[0]) : null;
    const sortedBooks = books.slice().sort((a, b) => String(b.finished).localeCompare(String(a.finished)) || b.index - a.index);

    app.innerHTML = `
      <section class="hero">
        <div>
          <h1>${esc(note.title)}</h1>
          <p class="subtitle">A visual shelf built from your existing table — no table changes made.</p>
        </div>
        <div class="badge"><span class="stars">${esc(ratingStars(average))}</span><span>${Number.isFinite(average) ? average.toFixed(1) : "No ratings"}</span></div>
      </section>

      <section class="grid" aria-label="Reading stats">
        <div class="stat"><div class="num">${books.length}</div><div class="label">books logged</div></div>
        <div class="stat"><div class="num">${Number.isFinite(average) ? average.toFixed(1) : "–"}</div><div class="label">average rating</div></div>
        <div class="stat"><div class="num">${yearCount}</div><div class="label">finished in ${esc(thisYear)}</div></div>
        <div class="stat"><div class="num">${bestMonth ? bestMonth[1] : "–"}</div><div class="label">best month${bestMonth ? ` · ${esc(monthLabel(bestMonth[0]))}` : ""}</div></div>
      </section>

      <section class="panel">
        <div class="section-title"><h2>Books per month</h2><span class="hint">Finished date</span></div>
        ${months.length ? `<div class="months" style="--month-count:${Math.min(Math.max(months.length, 1), 12)}" role="img" aria-label="Books per month: ${esc(months.map(([m, c]) => `${m}: ${c}`).join(", "))}">
          ${months.map(([month, count]) => `<div class="month"><div class="bar-wrap"><div class="bar" style="height:${Math.max(6, Math.round((count / maxMonth) * 100))}%"></div></div><div class="count">${count}</div><div class="mon">${esc(monthLabel(month))}</div></div>`).join("")}
        </div>` : `<div class="empty">Add finished dates to chart books per month.</div>`}
      </section>

      <section>
        <div class="section-title"><h2>Cover shelf</h2><span class="hint">Newest first</span></div>
        ${sortedBooks.length ? `<div class="shelf">${sortedBooks.map((book) => {
          const h = hue(book.title + book.author);
          return `<article class="book-card">
            <div class="cover" style="--h:${h};--h2:${(h + 44) % 360}">
              <div><div class="title">${esc(book.title)}</div><div class="author">${esc(book.author || "Unknown author")}</div></div>
              <div class="stars" aria-label="Rating ${Number.isFinite(book.rating) ? book.rating + " out of 5" : "not rated"}">${esc(ratingStars(book.rating))}</div>
            </div>
            <div class="meta"><span>${esc(prettyDate(book.finished))}</span><span class="pill">${Number.isFinite(book.rating) ? book.rating.toFixed(0) + "/5" : "–"}</span></div>
          </article>`;
        }).join("")}</div>` : `<div class="empty">No books yet.</div>`}
      </section>`;
  }

  amber.onChange(render);
</script>
</body>
</html>
