<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{padding:20px 18px 96px;max-width:680px;margin:0 auto;color:var(--amber-text);font:16px/1.4 var(--amber-font,-apple-system,system-ui,sans-serif)}
h1{font-size:28px;letter-spacing:-.02em}.row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--amber-separator)}.total{font-size:36px;font-weight:700;color:var(--amber-text);font-variant-numeric:tabular-nums}
.pill{background:var(--amber-accent-soft);color:var(--amber-accent-text);border-radius:99px;padding:2px 10px;font-size:13px}
</style></head><body><main id="app"></main><script>
const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const num=(s)=>parseFloat(String(s).replace(/\s/g,"").replace(",","."))||0;
amber.onChange((note)=>{const t=note.tables[0];const a=t.columns.findIndex((c)=>/amt|amount/i.test(c.name));
app.innerHTML="<h1>"+esc(note.title)+"</h1><div class=total>"+t.rows.reduce((s,r)=>s+num(r[a]),0).toLocaleString("sv-SE")+" kr</div>"+
t.rows.map((r)=>"<div class=row><span>"+esc(r[1])+" <span class=pill>"+esc(r[2])+"</span></span><b>"+esc(r[a])+"</b></div>").join("")});
</script></body></html>
