<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="amber-libs" content="preact, preact-hooks, htm">
<style>
:root{--accent:#12685d;--on:#fff;--soft:#e0f2ed;--panel:var(--amber-surface);--ink:var(--amber-text);--muted:var(--amber-text-secondary)}
@media(prefers-color-scheme:dark){:root{--accent:#68dec5;--on:#082c24;--soft:#15372e}}
*{box-sizing:border-box}main{max-width:var(--amber-content-max);margin:auto;padding:24px var(--amber-gutter) calc(100px + env(safe-area-inset-bottom));color:var(--ink)}h1{font-size:2.2rem;margin:0;letter-spacing:-.04em}h2{font-size:1.5rem;margin:0 0 16px}h3{margin:0 0 12px;font-size:1.1rem}p{line-height:1.5}button,input,select,textarea{font:inherit;min-height:44px}button{border:1px solid var(--amber-separator);background:var(--amber-fill);color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer}button.primary{background:var(--accent);color:var(--on);border:0;font-weight:700}button:disabled{opacity:.6;cursor:wait}input,select,textarea{width:100%;min-width:0;padding:10px;background:var(--amber-field);color:var(--ink);border:1px solid var(--amber-field-border);border-radius:8px}label{display:grid;gap:6px;font-size:.95rem;min-width:0}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.muted{color:var(--muted)}.eyebrow{font-family:var(--amber-font-mono);font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}.hero{padding:28px;background:var(--soft);border-left:6px solid var(--accent);border-radius:4px 18px 18px 4px}.hero h2{font-size:clamp(2rem,4vw,3.3rem);letter-spacing:-.04em;margin-bottom:12px}.number{font-size:3rem;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1}.grid{display:grid;gap:24px}.panel{background:var(--panel);border:1px solid var(--amber-separator);border-radius:16px;padding:20px;min-width:0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}.stack{display:grid;gap:16px}.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--amber-separator);padding:14px 0}.row:last-child{border-bottom:0}.grow{flex:1;min-width:0;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.set{display:grid;grid-template-columns:2rem 1fr 1fr auto;gap:8px;align-items:end;margin:12px 0}.set span{align-self:center;font-variant-numeric:tabular-nums}.exercise{padding:18px 0;border-top:1px solid var(--amber-separator)}.error{color:var(--amber-danger)}.status{margin:12px 0}.status:empty{display:none}header>div{min-width:0;overflow-wrap:anywhere}header .tag{flex-shrink:0}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;justify-content:center;padding:10px var(--amber-gutter) calc(10px + env(safe-area-inset-bottom));background:var(--amber-bg);border-top:1px solid var(--amber-separator);z-index:2}.tabs button{flex:1;max-width:220px;border:0}.tabs button[aria-current=page]{background:var(--soft);color:var(--ink);font-weight:750}.week{display:grid;gap:12px}.bar{height:12px;background:var(--amber-fill);border-radius:8px}.bar div{height:100%;background:var(--accent);border-radius:8px}progress{width:100%;height:14px;accent-color:var(--accent)}details summary{cursor:pointer;min-height:44px;padding:12px 0}.empty{padding:20px 0;line-height:1.6}.tag{display:inline-block;font-size:.9rem;background:var(--soft);padding:4px 8px;border-radius:6px}.history{max-height:65vh;overflow:auto}.history p{margin:6px 0}.sheetTitle{display:flex;gap:12px;align-items:center;justify-content:space-between}
@media(min-width:900px){.grid{grid-template-columns:1.2fr 1fr}.tabs{position:static;padding:0;margin-bottom:28px;justify-content:flex-start;border:0}.tabs button{flex:0 1 180px}main{padding-bottom:40px}.hero{min-height:300px;display:flex;flex-direction:column;justify-content:center}}
@media(max-width:380px){.panel{padding:14px}.hero{padding:22px}.set{grid-template-columns:1.4rem 1fr 1fr}.set button{grid-column:2/-1}.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div id="root"></div><script>
const html=htm.bind(preact.h);
const hooks = window['preact' + 'Hooks'];
const defaults={goal:3,unit:'kg'};
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const monday=s=>addDays(s,-((new Date(s+'T12:00:00Z').getUTCDay()+6)%7));
const number=x=>{let n=parseFloat(String(x||'').replace(',','.'));return Number.isFinite(n)?n:0};
function table(name){return (amber.note.tables||[]).find(t=>t.columns.some(c=>c.name.toLowerCase()===name.toLowerCase()))}
function records(t){return t?t.rows.map((row,index)=>Object.assign({row:index},Object.fromEntries(t.columns.map((c,i)=>[c.name.toLowerCase(),row[i]||''])))):[]}
function App(){
const [revision,refresh]=hooks['use' + 'State'](0),[screen,setScreen]=hooks['use' + 'State'](amber.data.values.screen||'today'),[draft,setDraft]=hooks['use' + 'State'](amber.data.values.draft||null),[error,setError]=hooks['use' + 'State'](''),[message,setMessage]=hooks['use' + 'State'](''),[busy,setBusy]=hooks['use' + 'State'](false);
hooks['use' + 'Effect'](()=>{amber.onChange(()=>refresh(n=>n+1))},[]);
const settings={...defaults,...amber.data.values.settings},routines=amber.data.values.routines||[],sessions=records(table('Workout')),sets=records(table('Exercise')),today=amber.note.today,start=monday(today),thisWeek=sessions.filter(s=>s.date>=start&&s.date<=today);
async function save(key,value){try{const r=await amber.store.set(key,value);if(r&&r.ok===false)throw Error(r.error);return true}catch(e){setError(e.message||'Could not save. Please try again.');return false}}
async function go(s){setScreen(s);setError('');setMessage('');await save('screen',s)}
async function changeDraft(d){setDraft(d);await save('draft',d)}
async function begin(r){const d={date:today,name:r?r.name:'My workout',type:'Strength',minutes:'',km:'',notes:'',exercises:r?r.exercises.map(name=>({name,sets:[{reps:'',weight:''}]})):[]};setMessage('');await changeDraft(d)}
function field(key,value){changeDraft({...draft,[key]:value})}
async function finish(e){e.preventDefault();setError('');const st=table('Workout'),et=table('Exercise');if(!st||!et){setError('The Text side needs Sessions and Sets tables.');return}
const exercises=draft.type==='Strength'?draft.exercises:[];if(exercises.some(ex=>!ex.name.trim()||!ex.sets.length||ex.sets.some(s=>!s.reps||number(s.reps)<1))){setError('Name each exercise and enter reps for every set.');return}
if(draft.type==='Strength'&&!exercises.length){setError('Add an exercise before finishing.');return}
if(draft.type!=='Strength'&&number(draft.minutes)<=0&&number(draft.km)<=0){setError('Enter duration or distance before finishing.');return}
const id='w'+Date.now().toString(36),ops=[{op:'append_row',table:st.index,values:{Date:draft.date,Session:id,Workout:draft.name.trim(),Type:draft.type,Minutes:draft.minutes,Km:draft.km,Notes:draft.notes.replace(/\n/g,' ')}}];
exercises.forEach(ex=>ex.sets.forEach((s,i)=>ops.push({op:'append_row',table:et.index,values:{Date:draft.date,Session:id,Exercise:ex.name.trim(),Set:String(i+1),Reps:s.reps,Weight:s.weight,Unit:settings.unit}})));
setBusy(true);try{const result=await amber.update(ops);if(!result.ok)throw Error(result.error);await changeDraft(null);setMessage('Workout saved.');}catch(e){setError(e.message)}finally{setBusy(false)}}
function editExercise(i,patch){const ex=draft.exercises.map((x,j)=>i===j?{...x,...patch}:x);changeDraft({...draft,exercises:ex})}
function editSet(i,j,key,v){editExercise(i,{sets:draft.exercises[i].sets.map((x,k)=>k===j?{...x,[key]:v}:x)})}
return html`<main><header><div><div class="eyebrow">Training log</div><h1>${amber.note.title}</h1></div><span class="tag">${today}</span></header>
${!draft&&html`<nav class="tabs" aria-label="Workout sections">${[['today','Today'],['plan','Plan'],['progress','Progress']].map(([key,label])=>html`<button aria-current=${screen===key?'page':null} onClick=${()=>go(key)}>${label}</button>`)}</nav>`}
<div class="status" role="status">${message}</div><div class="error" role="alert">${error}</div>
${draft?html`<form onSubmit=${finish} class="grid"><section class="panel stack"><div class="sheetTitle"><h2>Current workout</h2><button type="button" onClick=${async()=>{if(await save('draft',null)){setDraft(null);setMessage('Draft discarded.')}}}>Discard draft</button></div><div class="fields">
<label>Workout name<input name="workout-name" required value=${draft.name} onInput=${e=>field('name',e.target.value)}/></label>
<label>Date<input name="workout-date" type="date" required value=${draft.date} max=${today} onInput=${e=>field('date',e.target.value)}/></label>
<label>Activity<select name="workout-type" value=${draft.type} onChange=${e=>field('type',e.target.value)}>${['Strength','Run','Bike','Walk','Other'].map(x=>html`<option>${x}</option>`)}</select></label>
<label>Duration in minutes<input name="workout-minutes" type="number" min="0" step="0.1" value=${draft.minutes} onInput=${e=>field('minutes',e.target.value)}/></label>
${draft.type!=='Strength'&&html`<label>Distance in km<input name="workout-km" type="number" min="0" step="0.01" value=${draft.km} onInput=${e=>field('km',e.target.value)}/></label>`}
<label class="full">Notes<textarea name="workout-notes" value=${draft.notes} onInput=${e=>field('notes',e.target.value)}></textarea></label></div><button class="primary" disabled=${busy}>${busy?'Saving...':'Finish workout'}</button><p class="muted">Your draft saves as you go. Finished workouts appear in Progress and on the Text side.</p></section>
<section class="panel"><h2>${draft.type==='Strength'?'Log your sets':'Session details'}</h2>
${draft.type==='Strength'?html`${draft.exercises.map((ex,i)=>html`<div class="exercise"><label>Exercise<input name=${'exercise-'+i} required value=${ex.name} placeholder="Exercise name" onInput=${e=>editExercise(i,{name:e.target.value})}/></label>
${ex.sets.map((s,j)=>html`<div class="set"><span>${j+1}</span><label>Reps<input name=${'reps-'+i+'-'+j} type="number" min="1" step="1" required value=${s.reps} onInput=${e=>editSet(i,j,'reps',e.target.value)}/></label><label>Weight ${settings.unit}<input name=${'weight-'+i+'-'+j} type="number" min="0" step="0.25" value=${s.weight} onInput=${e=>editSet(i,j,'weight',e.target.value)}/></label><button type="button" aria-label=${'Remove set '+(j+1)} onClick=${()=>editExercise(i,{sets:ex.sets.filter((_,k)=>k!==j)})}>Remove</button></div>`)}
<div class="actions"><button type="button" onClick=${()=>editExercise(i,{sets:[...ex.sets,{reps:'',weight:''}]})}>Add set</button><button type="button" onClick=${()=>field('exercises',draft.exercises.filter((_,j)=>j!==i))}>Remove exercise</button></div></div>`)}
<button type="button" onClick=${()=>field('exercises',[...draft.exercises,{name:'',sets:[{reps:'',weight:''}]}])}>Add exercise</button><p class="muted">Leave weight blank for bodyweight sets.</p>`:html`<p>Record your distance, duration and notes, then finish the workout.</p>`}</section></form>`:
screen==='today'?html`<div class="grid"><section class="hero"><div class="eyebrow">Today</div><h2>Ready when you are.</h2><p>Log a strength workout or a cardio session.</p><div class="actions"><button class="primary" onClick=${()=>begin(null)}>Start workout</button></div></section><section class="panel"><h2>This week</h2><div class="number">${thisWeek.length}<span style="font-size:1.2rem"> / ${settings.goal}</span></div><p class="muted">workouts toward your weekly goal</p><progress value=${Math.min(thisWeek.length,settings.goal)} max=${Math.max(1,settings.goal)} aria-label="Weekly workout goal"></progress><h3 style="margin-top:28px">Your routines</h3>${routines.length?routines.map((r,i)=>html`<div class="row"><div class="grow">${r.name}<p class="muted">${r.exercises.length} exercises</p></div><button onClick=${()=>begin(r)}>Start</button></div>`):html`<p class="muted">Create a routine in Plan to reuse your exercise list.</p><button onClick=${()=>go('plan')}>Create a routine</button>`}</section></div>`:
screen==='plan'?html`<div class="grid"><section class="panel"><h2>Your routines</h2>${routines.map((r,i)=>html`<details><summary>${r.name}</summary><p>${r.exercises.join(', ')}</p><div class="actions"><button onClick=${()=>begin(r)}>Start workout</button><button onClick=${()=>save('routines',routines.filter((_,j)=>j!==i))}>Remove routine</button></div></details>`)}
<form class="stack" onSubmit=${async e=>{e.preventDefault();const form=e.currentTarget,fd=new FormData(form),name=fd.get('routine-name').trim(),exercises=fd.get('routine-exercises').split('\n').map(s=>s.trim()).filter(Boolean);if(!name||!exercises.length)return; if(await save('routines',[...routines,{name,exercises}])){form.reset();setMessage('Routine saved.')}}}><label>Routine name<input name="routine-name" placeholder="e.g. Upper body" required/></label><label>Exercises, one per line<textarea name="routine-exercises" rows="5" placeholder="Bench press&#10;Row&#10;Shoulder press" required></textarea></label><button class="primary">Save routine</button></form></section><section class="panel stack"><h2>Settings</h2><label>Weekly workout goal<input name="weekly-goal" type="number" min="1" max="30" step="1" value=${settings.goal} onChange=${e=>{const goal=Number(e.target.value);if(goal>=1&&goal<=30)save('settings',{...settings,goal})}}/></label><label>Weight unit<select name="weight-unit" value=${settings.unit} onChange=${e=>save('settings',{...settings,unit:e.target.value})}><option>kg</option><option>lb</option></select></label><p class="muted">Unit changes apply to new sets. Earlier workouts keep their recorded unit.</p></section></div>`:
html`<div class="grid"><section class="panel"><h2>Last eight weeks</h2><div class="week">${Array.from({length:8},(_,i)=>addDays(start,(i-7)*7)).map(w=>{const count=sessions.filter(s=>s.date>=w&&s.date<addDays(w,7)).length;return html`<div><div class="row"><span>${w}</span><span>${count} workouts</span></div><div class="bar" role="img" aria-label=${count+' workouts during week of '+w}><div style=${'width:'+Math.min(100,count/Math.max(settings.goal,count,1)*100)+'%'}></div></div></div>`})}</div></section><section class="panel"><h2>Workout history</h2><div class="history">${sessions.length?sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>html`<details><summary><strong>${s.workout||s.type||'Workout'}</strong><span class="muted"> · ${s.date}</span></summary><p>${s.type}${s.minutes?' · '+s.minutes+' min':''}${s.km?' · '+s.km+' km':''}</p>${sets.filter(x=>x.session===s.session).map(x=>html`<p>${x.exercise} · Set ${x.set} · ${x.reps} reps${x.weight?' · '+x.weight+' '+x.unit:''}</p>`)}${s.notes&&html`<p class="muted">${s.notes}</p>`}</details>`):html`<div class="empty">No workouts yet. Start your first session in Today.</div>`}</div></section></div>`}
</main>`;
}
preact.render(html`<${App}/>`,document.getElementById('root'));
</script></body></html>
