<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  :root { --btn: #9a3f00; --btn-ink: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --btn: #ffb454; --btn-ink: #2a1500; } }
  body { margin: 0; }
  .wrap { max-width: var(--amber-content-max); margin: 0 auto; padding: 16px var(--amber-gutter) 40px; }
  h1 { font-size: 1.75rem; letter-spacing: -.02em; margin: 4px 0 2px; }
  h2 { font-size: .8rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 22px 4px 8px; }
  .muted { color: var(--amber-text-secondary); font-size: .9rem; }
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--amber-fill); border-radius: 12px; margin: 14px 0 6px; }
  .tabs button { flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--amber-text); font: inherit; font-weight: 600; }
  .tabs button[aria-selected="true"] { background: var(--btn); color: var(--btn-ink); }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); overflow: hidden; }
  .grid { display: grid; gap: 16px; }
  @media (min-width: 900px) { .grid.two { grid-template-columns: 380px 1fr; align-items: start; } }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--amber-text-secondary); min-width: 0; }
  .full { grid-column: 1 / -1; }
  input, select { font: inherit; font-size: 1rem; color: var(--amber-text); background: var(--amber-field); border: 1px solid var(--amber-field-border); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; }
  .primary { grid-column: 1 / -1; min-height: 48px; border: 0; border-radius: 10px; background: var(--btn); color: var(--btn-ink); font: inherit; font-weight: 700; }
  .hint { grid-column: 1 / -1; font-size: .85rem; color: var(--amber-accent-text); min-height: 1.2em; }
  .err { color: var(--amber-danger); padding: 0 14px 12px; font-size: .9rem; }
  .ex { padding: 12px 16px; border-top: 1px solid var(--amber-separator); }
  .ex:first-child { border-top: 0; }
  .ex h3 { margin: 0 0 6px; font-size: 1rem; }
  .set { display: flex; align-items: center; gap: 10px; min-height: 44px; font-variant-numeric: tabular-nums; }
  .set .n { width: 1.6rem; color: var(--amber-text-secondary); }
  .set .v { flex: 1; font-weight: 600; }
  .set .pr { font-size: .7rem; font-weight: 700; background: var(--amber-accent-soft); color: var(--amber-accent-text); padding: 2px 8px; border-radius: 99px; }
  .icon { min-width: 44px; min-height: 44px; border: 0; background: transparent; color: var(--amber-text-secondary); font-size: 1.2rem; border-radius: 10px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 12px; }
  .stat b { display: block; font-size: 1.4rem; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .stat span { font-size: .75rem; color: var(--amber-text-secondary); }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
  .chart { padding: 12px; }
  svg { width: 100%; height: auto; display: block; }
  .day { padding: 12px 16px; border-top: 1px solid var(--amber-separator); }
  .day:first-child { border-top: 0; }
  .day .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
  .day ul { margin: 6px 0 0; padding: 0; list-style: none; color: var(--amber-text-secondary); font-size: .9rem; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const num = (s) => { const n = parseFloat(String(s ?? "").replace(",", ".")); return Number.isFinite(n) ? n : 0; };
  const fmt = (n) => (Math.round(n * 10) / 10).toString();
  const e1rm = (w, r) => r <= 1 ? w : w * (1 + r / 30);
  let tab = "today", error = "", chosen = "", draft = { ex: "", w: "", r: "" };

  function render(note) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => t.columns.some((c) => /^date$/i.test(c.name)) && t.columns.some((c) => /exercise/i.test(c.name)));
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Date, Exercise, Weight (kg), Reps and Notes columns to the note.</div>`; return; }
    const ci = (re) => t.columns.findIndex((c) => re.test(c.name));
    const D = ci(/^date$/i), E = ci(/exercise/i), W = ci(/weight|kg/i), R = ci(/reps/i), N = ci(/note/i);
    const sets = t.rows.map((r, i) => ({ i, date: r[D], ex: (r[E] || "").trim(), w: num(r[W]), r: num(r[R]), note: N >= 0 ? r[N] : "" })).filter((s) => s.ex);
    const exercises = [...new Set(sets.map((s) => s.ex))].sort((a, b) => a.localeCompare(b));
    const last = (ex) => sets.filter((s) => s.ex.toLowerCase() === ex.toLowerCase()).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.i - a.i)[0];
    const bestBefore = (s) => Math.max(0, ...sets.filter((x) => x.ex === s.ex && (x.date < s.date || (x.date === s.date && x.i < s.i))).map((x) => e1rm(x.w, x.r)));
    const isPR = (s) => s.w > 0 && e1rm(s.w, s.r) > bestBefore(s) && sets.some((x) => x.ex === s.ex && x !== s && (x.date < s.date || (x.date === s.date && x.i < s.i)));

    const tabs = ["today", "progress", "history"].map((k) => `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${k[0].toUpperCase() + k.slice(1)}</button>`).join("");
    let body = "";
    if (tab === "today") body = todayView(); else if (tab === "progress") body = progressView(); else body = historyView();
    app.innerHTML = `<h1>${esc(note.title)}</h1><div class="muted">${new Date(note.today + "T12:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}</div><div class="tabs" role="tablist">${tabs}</div>${body}`;
    app.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { tab = b.dataset.tab; render(amber.note); });

    function todayView() {
      const today = sets.filter((s) => s.date === note.today);
      const groups = [...new Set(today.map((s) => s.ex))];
      const vol = today.reduce((a, s) => a + s.w * s.r, 0);
      const list = groups.length ? groups.map((g) => `<div class="ex"><h3>${esc(g)}</h3>${today.filter((s) => s.ex === g).map((s, k) => `<div class="set"><span class="n">${k + 1}</span><span class="v">${fmt(s.w)} kg × ${fmt(s.r)}</span>${isPR(s) ? '<span class="pr">PR</span>' : ""}<button class="icon" data-del="${s.i}" aria-label="Delete set ${k + 1} of ${esc(g)}">✕</button></div>`).join("")}</div>`).join("") : `<div class="empty">No sets yet today. Log your first one.</div>`;
      return `<div class="grid two"><div><div class="card"><form id="add">
        <label class="full">Exercise<input name="ex" list="exs" value="${esc(draft.ex)}" autocomplete="off" required placeholder="e.g. Bench press"></label>
        <datalist id="exs">${exercises.map((x) => `<option value="${esc(x)}">`).join("")}</datalist>
        <label>Weight (kg)<input name="w" inputmode="decimal" value="${esc(draft.w)}" required></label>
        <label>Reps<input name="r" inputmode="numeric" value="${esc(draft.r)}" required></label>
        <label class="full">Notes<input name="note" placeholder="optional"></label>
        <div class="hint" id="hint"></div>
        <button class="primary">Add set</button></form>${error ? `<div class="err" role="alert">${esc(error)}</div>` : ""}</div></div>
        <div><div class="stats" style="margin-bottom:12px"><div class="stat"><b>${today.length}</b><span>sets</span></div><div class="stat"><b>${groups.length}</b><span>exercises</span></div><div class="stat"><b>${Math.round(vol).toLocaleString()}</b><span>kg volume</span></div></div>
        <div class="card">${list}</div></div></div>`;
    }
    function progressView() {
      if (!exercises.length) return `<div class="card empty" style="margin-top:12px">Log some sets to see progress.</div>`;
      if (!exercises.includes(chosen)) chosen = exercises[0];
      const mine = sets.filter((s) => s.ex === chosen);
      const days = [...new Set(mine.map((s) => s.date))].sort();
      const pts = days.map((d) => ({ d, v: Math.max(...mine.filter((s) => s.date === d).map((s) => e1rm(s.w, s.r))) }));
      const best = Math.max(...mine.map((s) => s.w));
      const bestE = Math.max(...pts.map((p) => p.v));
      const W_ = 600, H_ = 220, P = 34, lo = Math.min(...pts.map((p) => p.v)) * .9, hi = Math.max(...pts.map((p) => p.v)) * 1.05 || 1;
      const x = (k) => pts.length > 1 ? P + (k * (W_ - P * 2)) / (pts.length - 1) : W_ / 2;
      const y = (v) => H_ - P - ((v - lo) / ((hi - lo) || 1)) * (H_ - P * 2);
      const path = pts.map((p, k) => `${k ? "L" : "M"}${x(k).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
      const svg = `<svg viewBox="0 0 ${W_} ${H_}" role="img" aria-label="Estimated one-rep max for ${esc(chosen)} over ${pts.length} sessions, from ${fmt(pts[0].v)} to ${fmt(pts[pts.length - 1].v)} kg"><line x1="${P}" x2="${W_ - P}" y1="${H_ - P}" y2="${H_ - P}" stroke="var(--amber-separator)"/><path d="${path}" fill="none" stroke="var(--amber-accent)" stroke-width="3" stroke-linejoin="round"/>${pts.map((p, k) => `<circle cx="${x(k)}" cy="${y(p.v)}" r="4.5" fill="var(--amber-accent)"/>`).join("")}<text x="${P}" y="${H_ - 10}" font-size="13" fill="var(--amber-text-secondary)">${esc(pts[0].d.slice(5))}</text><text x="${W_ - P}" y="${H_ - 10}" font-size="13" text-anchor="end" fill="var(--amber-text-secondary)">${esc(pts[pts.length - 1].d.slice(5))}</text><text x="${P}" y="20" font-size="13" fill="var(--amber-text-secondary)">${fmt(hi)} kg</text></svg>`;
      return `<div style="margin-top:12px"><label>Exercise<select id="pick">${exercises.map((x) => `<option ${x === chosen ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></label>
        <div class="stats" style="margin:12px 0"><div class="stat"><b>${fmt(best)}</b><span>heaviest kg</span></div><div class="stat"><b>${fmt(bestE)}</b><span>est. 1RM kg</span></div><div class="stat"><b>${days.length}</b><span>sessions</span></div></div>
        <h2 style="margin-top:6px">Estimated 1RM per session</h2><div class="card chart">${svg}</div></div>`;
    }
    function historyView() {
      const days = [...new Set(sets.map((s) => s.date))].sort().reverse();
      if (!days.length) return `<div class="card empty" style="margin-top:12px">No workouts logged yet.</div>`;
      return `<div class="card" style="margin-top:12px">${days.slice(0, 60).map((d) => {
        const ds = sets.filter((s) => s.date === d), gs = [...new Set(ds.map((s) => s.ex))];
        return `<div class="day"><div class="top"><span>${esc(d)}</span><span class="muted">${ds.length} sets · ${Math.round(ds.reduce((a, s) => a + s.w * s.r, 0)).toLocaleString()} kg</span></div><ul>${gs.map((g) => `<li>${esc(g)}: ${ds.filter((s) => s.ex === g).map((s) => `${fmt(s.w)}×${fmt(s.r)}`).join(", ")}</li>`).join("")}</ul></div>`;
      }).join("")}</div>`;
    }

    const pick = document.getElementById("pick");
    if (pick) pick.onchange = () => { chosen = pick.value; render(amber.note); };
    app.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => { const r = await amber.update({ op: "delete_row", table: t.index, row: Number(b.dataset.del) }); error = r.ok ? "" : r.error; render(amber.note); });
    const f = document.getElementById("add");
    if (f) {
      const hint = document.getElementById("hint");
      const exIn = f.elements.ex;
      const showHint = (fill) => {
        const l = exIn.value.trim() && last(exIn.value.trim());
        hint.textContent = l ? `Last time: ${fmt(l.w)} kg × ${fmt(l.r)} (${l.date})` : "";
        if (l && fill && !f.elements.w.value) { f.elements.w.value = fmt(l.w); f.elements.r.value = fmt(l.r); }
      };
      showHint(false);
      exIn.onchange = () => showHint(true);
      exIn.oninput = () => { draft.ex = exIn.value; showHint(false); };
      f.elements.w.oninput = () => draft.w = f.elements.w.value;
      f.elements.r.oninput = () => draft.r = f.elements.r.value;
      f.onsubmit = async (ev) => {
        ev.preventDefault();
        const v = {};
        v[t.columns[D].name] = note.today; v[t.columns[E].name] = f.elements.ex.value.trim();
        v[t.columns[W].name] = f.elements.w.value.replace(",", ".").trim(); v[t.columns[R].name] = f.elements.r.value.trim();
        if (N >= 0) v[t.columns[N].name] = f.elements.note.value.replace(/[|\n]/g, " ").trim();
        const r = await amber.update({ op: "append_row", table: t.index, values: v });
        error = r.ok ? "" : r.error;
        if (r.ok) draft = { ex: v[t.columns[E].name], w: v[t.columns[W].name], r: v[t.columns[R].name] };
        render(amber.note);
      };
    }
  }
  amber.onChange(render);
</script>
</body>
</html>
