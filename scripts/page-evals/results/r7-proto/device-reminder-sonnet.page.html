<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;font-family:var(--amber-font)}
.w{max-width:var(--amber-content-max);margin:0 auto;padding:16px var(--amber-gutter) 32px}
h1{font-family:var(--amber-font-rounded);margin:8px 0 16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--amber-text-secondary);margin:0 0 8px}
.g{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){.g{grid-template-columns:1fr 1fr}}
.c{background:var(--amber-surface);border-radius:var(--amber-radius);padding:14px 16px}
.c p{margin:4px 0}ul{margin:0;padding-left:18px}li{margin:4px 0}
.t{display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer}
.t.d span{text-decoration:line-through;color:var(--amber-text-secondary)}
button{font:inherit;background:var(--amber-accent);color:var(--amber-on-accent);border:0;border-radius:var(--amber-radius-small);padding:10px 14px;cursor:pointer}
#m{margin-top:8px;font-size:14px;color:var(--amber-text-secondary)}
</style></head><body><div class="w"><h1 id="h"></h1><div class="g" id="g"></div></div>
<script>
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function flightDate(md,today){const m=md.match(/out\s+(?:\w+\s+)?(\d{1,2})\s+([a-z]{3})/i);if(!m)return null;
let y=+today.slice(0,4);let d=new Date(y,MON[m[2].toLowerCase()],+m[1]);return d;}
const p2=n=>String(n).padStart(2,'0');
function render(n){
document.getElementById('h').textContent=n.title;
const lines=n.markdown.split('\n');
const get=k=>{const l=lines.find(x=>x.toLowerCase().startsWith(k));return l?l.slice(l.indexOf(k)+k.length).replace(/^[:\s~]+/,''):''};
const ideas=[];let inI=false;
for(const l of lines){if(/^ideas/i.test(l)){inI=true;continue}if(inI){if(l.startsWith('- ')&&!l.startsWith('- ['))ideas.push(l.slice(2));else if(l.trim()==='')inI=false;}}
const fd=flightDate(n.markdown,n.today);
let h='<div class="c"><h2>Flights</h2><p>'+esc(get('flights'))+'</p></div>';
h+='<div class="c"><h2>Hotel</h2><p>'+esc(get('hotel'))+'</p><h2 style="margin-top:12px">Budget</h2><p>~ '+esc(get('budget'))+'</p></div>';
h+='<div class="c"><h2>Ideas</h2><ul>'+ideas.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul></div>';
h+='<div class="c"><h2>To do before</h2>'+n.checklists.map(c=>'<div class="t'+(c.checked?' d':'')+'" data-l="'+c.line+'"><input type="checkbox" '+(c.checked?'checked':'')+'><span>'+esc(c.text)+'</span></div>').join('')+
'<div style="margin-top:12px"><button id="r"'+(fd?'':' disabled')+'>Remind me to pack the evening before</button><div id="m"></div></div></div>';
document.getElementById('g').innerHTML=h;
document.querySelectorAll('.t').forEach(e=>e.onclick=ev=>{ev.preventDefault();amber.update({op:'toggle_checklist',line:+e.dataset.l})});
const b=document.getElementById('r');
if(b&&fd)b.onclick=async()=>{const e=new Date(fd);e.setDate(e.getDate()-1);
const due=e.getFullYear()+'-'+p2(e.getMonth()+1)+'-'+p2(e.getDate())+'T20:00:00';
const r=await amber.device.reminders.create({title:'Pack for Porto (flight tomorrow 07:10)',due});
document.getElementById('m').textContent=r&&r.ok?'Reminder set for '+due.replace('T',' ').slice(0,16):'Could not set reminder'+(r&&r.error?': '+r.error:'');};
}
amber.onChange(render);
</script></body></html>
