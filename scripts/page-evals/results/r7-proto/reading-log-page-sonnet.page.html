<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:16px var(--amber-gutter) 32px}
h1{font-family:var(--amber-font-rounded);font-size:28px;margin:8px 0 16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--amber-text-secondary);margin:24px 0 10px}
.top{display:grid;gap:12px;grid-template-columns:1fr}
.card{background:var(--amber-surface);border-radius:var(--amber-radius);padding:16px}
.big{font-family:var(--amber-font-rounded);font-size:44px;font-weight:700;line-height:1}
.sub{color:var(--amber-text-secondary);font-size:13px;margin-top:6px}
.stars{color:var(--amber-accent);letter-spacing:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--amber-text-secondary)}
.bar{width:100%;max-width:44px;background:var(--amber-accent);border-radius:6px 6px 2px 2px;min-height:3px}
.bar.z{background:var(--amber-fill)}
.bn{font-weight:600;color:var(--amber-text);margin-bottom:3px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
.book{display:flex;flex-direction:column;gap:8px}
.cover{aspect-ratio:2/3;border-radius:6px 12px 12px 6px;padding:14px 12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:inset 6px 0 8px -4px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.2);overflow:hidden}
.cover b{font-family:var(--amber-font-rounded);font-size:16px;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.cover span{font-size:11px;opacity:.9}
.meta{font-size:12px;color:var(--amber-text-secondary)}
form{display:grid;gap:8px;grid-template-columns:1fr}
input,select,button{font:inherit;padding:9px 10px;border-radius:var(--amber-radius-small);border:1px solid var(--amber-separator);background:var(--amber-fill);color:var(--amber-text)}
button{background:var(--amber-accent);color:var(--amber-on-accent);border:0;font-weight:600}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.top{grid-template-columns:1fr 1.6fr}.grid{grid-template-columns:repeat(5,1fr)}form{grid-template-columns:2fr 2fr 1.2fr 1fr auto}}
</style></head><body><div class="wrap">
<h1>Reading log</h1>
<div class="top">
<div class="stats">
<div class="card"><div class="big" id="avg">–</div><div class="stars" id="st"></div><div class="sub">average rating</div></div>
<div class="card"><div class="big" id="cnt">0</div><div class="sub">books read</div></div>
</div>
<div class="card"><div class="sub" style="margin:0 0 8px">Books per month</div><div class="bars" id="bars"></div></div>
</div>
<h2>Books</h2><div class="grid" id="grid"></div>
<h2>Add a book</h2>
<div class="card"><form id="f"><input id="t" placeholder="Title" required><input id="a" placeholder="Author"><input id="d" type="date"><select id="r"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><button>Add</button></form></div>
</div>
<script>
const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(n){
 const t=n.tables.find(x=>x.columns.map(c=>c.name).join()==='Title,Author,Finished,Rating')||n.tables[0];
 const rows=(t?t.rows:[]).map(r=>({t:r[0],a:r[1],d:r[2],r:parseInt(r[3])||0})).filter(b=>b.t);
 const rated=rows.filter(b=>b.r);
 const avg=rated.length?rated.reduce((s,b)=>s+b.r,0)/rated.length:0;
 document.getElementById('avg').textContent=rated.length?avg.toFixed(1):'–';
 document.getElementById('st').textContent='★'.repeat(Math.round(avg))+'☆'.repeat(5-Math.round(avg));
 document.getElementById('cnt').textContent=rows.length;
 const counts={};rows.forEach(b=>{if(b.d)counts[b.d.slice(0,7)]=(counts[b.d.slice(0,7)]||0)+1});
 const keys=Object.keys(counts).sort();let bars='';
 if(keys.length){let [y,m]=keys[0].split('-').map(Number);const [ey,em]=n.today.slice(0,7).split('-').map(Number);
  const last=keys[keys.length-1].split('-').map(Number);const E=Math.max(ey*12+em,last[0]*12+last[1]);
  const list=[];for(let i=y*12+m-1+0;i<E;i++){list.push(i)}
  const shown=list.slice(-12),mx=Math.max(...Object.values(counts));
  shown.forEach(i=>{const yy=Math.floor(i/12),mm=i%12;const k=yy+'-'+String(mm+1).padStart(2,'0');const c=counts[k]||0;
   bars+=`<div class="bcol"><div class="bn">${c}</div><div class="bar ${c?'':'z'}" style="height:${c/mx*70}%"></div><div style="margin-top:4px">${M[mm]}</div></div>`})}
 document.getElementById('bars').innerHTML=bars;
 document.getElementById('grid').innerHTML=[...rows].sort((a,b)=>(b.d||'').localeCompare(a.d||'')).map(b=>{const h=hue(b.t);
  return `<div class="book"><div class="cover" style="background:linear-gradient(160deg,hsl(${h},55%,48%),hsl(${(h+40)%360},60%,28%))"><b>${esc(b.t)}</b><span>${esc(b.a)}</span></div><div><div class="stars">${'★'.repeat(b.r)}${'☆'.repeat(5-b.r)}</div><div class="meta">${esc(b.d)}</div></div></div>`}).join('');
 const d=document.getElementById('d');if(!d.value)d.value=n.today;
}
amber.onChange(render);
document.getElementById('f').onsubmit=async e=>{e.preventDefault();
 const v=id=>document.getElementById(id).value.trim();
 const t=amber.note.tables.find(x=>x.columns[0].name==='Title')||amber.note.tables[0];
 const res=await amber.update({op:'append_row',table:t.index,values:{Title:v('t'),Author:v('a'),Finished:v('d'),Rating:v('r')}});
 if(res.ok){document.getElementById('t').value='';document.getElementById('a').value=''}};
</script></body></html>
