<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading log</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:var(--amber-font);color:var(--amber-text)}
.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:18px var(--amber-gutter) 34px}
.hero{display:grid;gap:14px;margin:4px 0 18px}.titleRow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}.eyebrow{font:700 12px/1 var(--amber-font-rounded);letter-spacing:.08em;text-transform:uppercase;color:var(--amber-accent-text);margin:0 0 7px}.title{font:800 clamp(31px,7vw,64px)/.9 var(--amber-font-rounded);margin:0;letter-spacing:-.055em}.sub{margin:9px 0 0;color:var(--amber-text-secondary);font-size:15px}.pill{border:1px solid var(--amber-separator);background:var(--amber-surface);border-radius:999px;padding:9px 13px;color:var(--amber-text-secondary);white-space:nowrap;font-size:14px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:linear-gradient(180deg,var(--amber-surface),var(--amber-fill));border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:15px;min-height:98px;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;right:-28px;bottom:-34px;width:110px;height:110px;border-radius:50%;background:var(--amber-accent-soft)}.label{font-size:12px;color:var(--amber-text-secondary);font-weight:700;text-transform:uppercase;letter-spacing:.05em}.num{font:800 34px/1 var(--amber-font-rounded);letter-spacing:-.04em;margin-top:9px;position:relative;z-index:1}.hint{font-size:13px;color:var(--amber-text-secondary);margin-top:5px;position:relative;z-index:1}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}h2{font:800 22px/1.05 var(--amber-font-rounded);letter-spacing:-.03em;margin:0}.small{font-size:13px;color:var(--amber-text-secondary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:14px}.book{display:grid;gap:9px}.cover{aspect-ratio:2/3;border-radius:12px;background:linear-gradient(140deg,var(--c1),var(--c2));box-shadow:0 16px 28px rgba(0,0,0,.14),inset 12px 0 0 rgba(0,0,0,.16),inset 13px 0 0 rgba(255,255,255,.16);padding:16px 13px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(0,0,0,.08)}.cover:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 18%,rgba(255,255,255,.34),transparent 26%),linear-gradient(90deg,rgba(255,255,255,.18),transparent 14%,transparent 86%,rgba(0,0,0,.12));mix-blend-mode:screen}.cover:after{content:"";position:absolute;left:18px;right:18px;top:50%;height:1px;background:rgba(255,255,255,.38)}.coverTitle,.coverAuthor,.mark{position:relative;z-index:1;color:white;text-shadow:0 1px 3px rgba(0,0,0,.22)}.coverTitle{font:800 clamp(16px,2.8vw,22px)/1.02 var(--amber-font-rounded);letter-spacing:-.045em;overflow-wrap:anywhere}.coverAuthor{font-size:12px;font-weight:700;opacity:.88}.mark{align-self:flex-end;font:800 34px/1 var(--amber-font-rounded);opacity:.55}.meta{padding:0 2px}.bookTitle{font-weight:750;font-size:14px;line-height:1.2}.author{color:var(--amber-text-secondary);font-size:13px;margin-top:2px}.stars{font-size:13px;color:var(--amber-accent-text);letter-spacing:.03em;margin-top:5px}.date{color:var(--amber-text-secondary);font-size:12px;margin-top:4px;font-family:var(--amber-font-mono)}
.months{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:14px;display:grid;gap:10px}.month{display:grid;grid-template-columns:64px 1fr 32px;align-items:center;gap:10px}.mLabel{font:700 12px/1 var(--amber-font-mono);color:var(--amber-text-secondary)}.barTrack{height:12px;border-radius:999px;background:var(--amber-fill);overflow:hidden}.bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--amber-accent),var(--amber-accent-text));min-width:4px}.mCount{text-align:right;color:var(--amber-text-secondary);font-size:13px}.empty{border:1px dashed var(--amber-separator);border-radius:var(--amber-radius);padding:24px;text-align:center;color:var(--amber-text-secondary);background:var(--amber-surface)}
@media (min-width:700px){.hero{grid-template-columns:1.1fr .9fr;align-items:end}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat.wide{grid-column:span 2}.titleRow{display:block}.grid{grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:18px}}
@media (min-width:1000px){.content{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}.side{position:sticky;top:12px}.grid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="titleRow"><div><p class="eyebrow">Library</p><h1 class="title">Reading log</h1><p class="sub" id="subtitle">A visual shelf built from your table.</p></div><div class="pill" id="updated">Live from note</div></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="content">
    <main>
      <div class="sectionHead"><h2>Finished books</h2><span class="small" id="sortNote">Newest first</span></div>
      <div class="grid" id="books"></div>
    </main>
    <aside class="side">
      <div class="sectionHead"><h2>Books per month</h2><span class="small" id="monthsTotal"></span></div>
      <div class="months" id="months"></div>
      <div class="sectionHead"><h2>Want to read</h2></div>
      <div class="months" id="want"></div>
    </aside>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function hash(s){let h=0;for(let i=0;i<String(s).length;i++)h=(h*31+String(s).charCodeAt(i))|0;return Math.abs(h)}
function colourPair(s){const h=hash(s)%360;return [`hsl(${h} 58% 38%)`,`hsl(${(h+38)%360} 72% 54%)`]}
function stars(r){const n=Math.max(0,Math.min(5,Math.round(Number(r)||0)));return '★'.repeat(n)+'☆'.repeat(5-n)}
function niceDate(d){if(!d)return '';const dt=new Date(d+'T00:00:00');return isNaN(dt)?d:dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function monthLabel(k){const [y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'short',year:'2-digit'})}
function readWanted(markdown){const m=String(markdown||'').match(/Want to read:\s*([^\n]+)/i);if(!m)return [];return m[1].replace(/\.$/,'').split(',').map(x=>x.trim()).filter(Boolean)}
function tableRows(note){const t=(note.tables||[])[0];if(!t)return [];const names=t.columns.map(c=>c.name);return t.rows.map((r,i)=>{let o={_i:i};names.forEach((n,idx)=>o[n]=r[idx]);return o}).filter(o=>o.Title||o.Author||o.Finished||o.Rating)}
function render(note){const rows=tableRows(note);const books=rows.slice().sort((a,b)=>String(b.Finished||'').localeCompare(String(a.Finished||'')));const rated=rows.map(r=>Number(r.Rating)).filter(n=>!isNaN(n)&&n>0);const avg=rated.length?rated.reduce((a,b)=>a+b,0)/rated.length:0;const months={};rows.forEach(r=>{if(r.Finished){const k=String(r.Finished).slice(0,7);if(/^\d{4}-\d{2}$/.test(k))months[k]=(months[k]||0)+1}});const keys=Object.keys(months).sort();const max=Math.max(1,...Object.values(months));const latest=books[0];$('subtitle').textContent=rows.length?`${rows.length} finished book${rows.length===1?'':'s'}${latest?.Finished?' · latest: '+latest.Title:''}`:'Add books to the table to fill your shelf.';$('updated').textContent=note.today?'Today '+note.today:'Live from note';$('stats').innerHTML=`<div class="stat"><div class="label">Books</div><div class="num">${rows.length}</div><div class="hint">finished total</div></div><div class="stat"><div class="label">Average rating</div><div class="num">${avg?avg.toFixed(1):'–'}</div><div class="hint">${avg?stars(avg):'no ratings yet'}</div></div><div class="stat"><div class="label">Best month</div><div class="num">${keys.length?monthLabel(keys.reduce((a,b)=>months[b]>months[a]?b:a,keys[0])):'–'}</div><div class="hint">${keys.length?Math.max(...Object.values(months))+' book(s)':'no dates yet'}</div></div><div class="stat"><div class="label">5-star reads</div><div class="num">${rows.filter(r=>Number(r.Rating)>=5).length}</div><div class="hint">top shelf</div></div>`;$('books').innerHTML=books.length?books.map(b=>{const [c1,c2]=colourPair((b.Title||'')+(b.Author||''));return `<article class="book"><div class="cover" style="--c1:${c1};--c2:${c2}"><div class="coverTitle">${esc(b.Title||'Untitled')}</div><div><div class="mark">${esc(String(b.Rating||''))}</div><div class="coverAuthor">${esc(b.Author||'Unknown author')}</div></div></div><div class="meta"><div class="bookTitle">${esc(b.Title||'Untitled')}</div><div class="author">${esc(b.Author||'')}</div><div class="stars" aria-label="Rating ${esc(b.Rating)} of 5">${stars(b.Rating)}</div><div class="date">${esc(niceDate(b.Finished))}</div></div></article>`}).join(''):'<div class="empty">No finished books yet.</div>';$('monthsTotal').textContent=keys.length?`${keys.length} month${keys.length===1?'':'s'}`:'';$('months').innerHTML=keys.length?keys.map(k=>`<div class="month"><div class="mLabel">${esc(monthLabel(k))}</div><div class="barTrack"><div class="bar" style="width:${Math.max(8,months[k]/max*100)}%"></div></div><div class="mCount">${months[k]}</div></div>`).join(''):'<div class="empty">Finished dates will appear here.</div>';const want=readWanted(note.markdown);$('want').innerHTML=want.length?want.map(w=>`<div class="month"><div class="mLabel">Next</div><div>${esc(w)}</div><div></div></div>`).join(''):'<div class="empty">No want-to-read line found.</div>'}
if(window.amber&&amber.onChange){amber.onChange(render)}else{render({today:'',tables:[],markdown:''})}
</script>
</body>
</html>
