<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Running</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:var(--amber-font);color:var(--amber-text)}.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:var(--amber-gutter)}header{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;margin:8px 0 18px}.eyebrow{color:var(--amber-accent-text);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase}.sub{color:var(--amber-text-secondary);margin-top:6px}.grid{display:grid;grid-template-columns:1fr;gap:12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:14px;box-shadow:0 1px 0 rgba(0,0,0,.03)}.stat{font-family:var(--amber-font-rounded);font-size:30px;font-weight:800;line-height:1}.label{color:var(--amber-text-secondary);font-size:13px;margin-top:6px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}h1,h2{margin:0}h1{font-size:28px}h2{font-size:18px}svg{width:100%;height:auto;display:block;overflow:visible}.axis{stroke:var(--amber-separator);stroke-width:1}.bar{fill:var(--amber-accent)}.bar2{fill:var(--amber-accent-soft);stroke:var(--amber-accent);stroke-width:1}.line{fill:none;stroke:var(--amber-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dot{fill:var(--amber-surface);stroke:var(--amber-accent);stroke-width:2}.small{font-size:12px;fill:var(--amber-text-secondary)}.big{font-weight:700;fill:var(--amber-text)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 8px;border-bottom:1px solid var(--amber-separator);text-align:left;white-space:nowrap}th{color:var(--amber-text-secondary);font-weight:600}td.num,th.num{text-align:right}.scroll{overflow:auto}.pill{display:inline-flex;align-items:center;border-radius:999px;background:var(--amber-accent-soft);color:var(--amber-accent-text);padding:5px 9px;font-size:12px;font-weight:700}.empty{padding:28px;text-align:center;color:var(--amber-text-secondary)}form{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;color:var(--amber-text-secondary);display:grid;gap:5px}input{width:100%;border:1px solid var(--amber-separator);border-radius:var(--amber-radius-small);background:var(--amber-fill);color:var(--amber-text);padding:10px;font:inherit}button{border:0;border-radius:var(--amber-radius-small);background:var(--amber-accent);color:var(--amber-on-accent);padding:11px 13px;font-weight:700;font:inherit}.full{grid-column:1/-1}.muted{color:var(--amber-text-secondary)}.split{display:grid;grid-template-columns:1fr;gap:12px}@media (min-width:700px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}form{grid-template-columns:repeat(4,1fr)}.full{grid-column:auto}}@media (min-width:900px){.split{grid-template-columns:1.3fr .7fr}.two{grid-template-columns:1fr 1fr}h1{font-size:34px}.stat{font-size:34px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><div class="eyebrow">Running log</div><h1 id="title">Running</h1><div class="sub" id="range">Loading runs…</div></div><div class="pill" id="fresh">Strava import</div></header>
<div class="grid cards" id="stats"></div>
<div class="split" style="margin-top:12px">
<section class="card"><div class="section-title"><h2>Distance trend</h2><span class="muted" id="trend"></span></div><div id="distanceChart"></div></section>
<section class="card"><div class="section-title"><h2>Pace</h2><span class="muted">min/km</span></div><div id="paceChart"></div></section>
</div>
<div class="grid two" style="margin-top:12px">
<section class="card"><div class="section-title"><h2>Weekly distance</h2><span class="muted" id="weeksLabel"></span></div><div id="weekChart"></div></section>
<section class="card"><div class="section-title"><h2>Add a run</h2></div><form id="addForm"><label>Date<input name="date" type="date" required></label><label>Distance km<input name="dist" inputmode="decimal" required placeholder="5.0"></label><label>Time min<input name="time" inputmode="decimal" required placeholder="28"></label><label>Avg HR<input name="hr" inputmode="numeric" placeholder="145"></label><button class="full" type="submit">Add to Runs table</button></form><p class="muted" id="msg"></p></section>
</div>
<section class="card" style="margin-top:12px"><div class="section-title"><h2>Runs</h2><span class="muted" id="count"></span></div><div class="scroll"><table><thead><tr><th>Date</th><th class="num">Distance</th><th class="num">Time</th><th class="num">Pace</th><th class="num">Avg HR</th></tr></thead><tbody id="runs"></tbody></table></div></section>
</div>
<script>
(function(){
const C={date:'Activity Date',dist:'Distance (km)',time:'Moving Time (min)',hr:'Avg HR'};let currentTable=0;
function n(x){return Number(String(x||'').replace(',','.'))}function fmt(x,d=1){return Number.isFinite(x)?x.toFixed(d):'—'}function pace(m,km){if(!km)return Infinity;return m/km}function paceFmt(p){if(!Number.isFinite(p))return '—';let mi=Math.floor(p),s=Math.round((p-mi)*60);if(s===60){mi++;s=0}return mi+':'+String(s).padStart(2,'0')}function shortDate(s){let d=new Date(s+'T00:00:00');return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function getRuns(note){let t=(note.tables||[]).find(t=>t.columns&&t.columns.some(c=>c.name===C.date));if(!t)return[];currentTable=t.index;let names=t.columns.map(c=>c.name);let ix=k=>names.indexOf(k);return t.rows.map((r,i)=>({i,date:r[ix(C.date)],dist:n(r[ix(C.dist)]),time:n(r[ix(C.time)]),hr:n(r[ix(C.hr)]),pace:pace(n(r[ix(C.time)]),n(r[ix(C.dist)]))})).filter(r=>r.date&&r.dist).sort((a,b)=>a.date.localeCompare(b.date))}
function stat(label,value){return `<div class="card"><div class="stat">${value}</div><div class="label">${label}</div></div>`}
function distanceSvg(data){if(!data.length)return '<div class="empty">No runs yet.</div>';let w=720,h=220,p=24,max=Math.max(...data.map(d=>d.dist),1),bw=(w-p*2)/data.length;let bars=data.map((d,i)=>{let bh=(h-p*2)*(d.dist/max),x=p+i*bw+bw*.16,y=h-p-bh;return `<rect class="bar" x="${x}" y="${y}" width="${Math.max(3,bw*.68)}" height="${bh}" rx="4"><title>${d.date}: ${d.dist} km</title></rect>`}).join('');let labels=data.filter((_,i)=>i%Math.ceil(data.length/6)===0||i===data.length-1).map((d,i,a)=>{let idx=data.indexOf(d),x=p+idx*bw+bw/2;return `<text class="small" x="${x}" y="${h-4}" text-anchor="middle">${shortDate(d.date)}</text>`}).join('');return `<svg viewBox="0 0 ${w} ${h}" role="img"><line class="axis" x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}"/><text class="small" x="${p}" y="14">${max.toFixed(1)} km</text>${bars}${labels}</svg>`}
function lineSvg(data,key,invert){if(!data.length)return '<div class="empty">No data yet.</div>';let w=360,h=220,p=28,vals=data.map(d=>d[key]).filter(Number.isFinite),mn=Math.min(...vals),mx=Math.max(...vals);if(mx===mn){mx+=1;mn-=1}let x=i=>p+i*((w-p*2)/Math.max(1,data.length-1));let y=v=>invert?p+(v-mn)/(mx-mn)*(h-p*2):h-p-(v-mn)/(mx-mn)*(h-p*2);let pts=data.map((d,i)=>x(i)+','+y(d[key])).join(' ');let dots=data.map((d,i)=>`<circle class="dot" cx="${x(i)}" cy="${y(d[key])}" r="3"><title>${d.date}: ${paceFmt(d[key])}</title></circle>`).join('');return `<svg viewBox="0 0 ${w} ${h}"><line class="axis" x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}"/><text class="small" x="${p}" y="14">faster ↑</text><polyline class="line" points="${pts}"/>${dots}</svg>`}
function weekStart(s){let d=new Date(s+'T00:00:00'),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toISOString().slice(0,10)}
function weeklySvg(data){let m={};data.forEach(r=>m[weekStart(r.date)]=(m[weekStart(r.date)]||0)+r.dist);let arr=Object.keys(m).sort().map(k=>({date:k,dist:m[k]}));document.getElementById('weeksLabel').textContent=arr.length+' weeks';return distanceSvg(arr)}
function render(note){document.getElementById('title').textContent=note.title||'Running';let runs=getRuns(note);let total=runs.reduce((s,r)=>s+r.dist,0),mins=runs.reduce((s,r)=>s+r.time,0),avgP=pace(mins,total),avgHr=runs.reduce((s,r)=>s+(r.hr||0),0)/(runs.filter(r=>r.hr).length||1);let longest=runs.reduce((a,r)=>r.dist>(a?.dist||0)?r:a,null),best=runs.reduce((a,r)=>r.pace<(a?.pace||Infinity)?r:a,null);document.getElementById('stats').innerHTML=[stat('Runs',runs.length),stat('Total distance',fmt(total,1)+' km'),stat('Average pace',paceFmt(avgP)),stat('Avg heart rate',Math.round(avgHr)+' bpm')].join('');document.getElementById('range').textContent=runs.length?`${shortDate(runs[0].date)} – ${shortDate(runs[runs.length-1].date)} · ${Math.round(mins)} min total`:'Add your first run below.';let first=runs.slice(0,6).reduce((s,r)=>s+r.dist,0)/Math.max(1,Math.min(6,runs.length)),last=runs.slice(-6).reduce((s,r)=>s+r.dist,0)/Math.max(1,Math.min(6,runs.length));document.getElementById('trend').textContent=runs.length>6?`${last>=first?'↑':'↓'} ${fmt(Math.abs(last-first),1)} km vs first 6 avg`:'';document.getElementById('distanceChart').innerHTML=distanceSvg(runs);document.getElementById('paceChart').innerHTML=lineSvg(runs,'pace',true);document.getElementById('weekChart').innerHTML=weeklySvg(runs);document.getElementById('count').textContent=[longest?'Longest '+fmt(longest.dist,1)+' km':'',best?'Best pace '+paceFmt(best.pace):''].filter(Boolean).join(' · ');document.getElementById('runs').innerHTML=runs.slice().reverse().map(r=>`<tr><td>${esc(r.date)}</td><td class="num">${fmt(r.dist,1)} km</td><td class="num">${fmt(r.time,0)} min</td><td class="num">${paceFmt(r.pace)}</td><td class="num">${r.hr?Math.round(r.hr):'—'}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No runs in the Runs table.</td></tr>';let d=document.querySelector('input[name=date]');if(d&&!d.value)d.value=note.today||new Date().toISOString().slice(0,10)}
window.amber.onChange(render);
document.getElementById('addForm').addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target),msg=document.getElementById('msg');msg.textContent='Adding…';let values={};values[C.date]=f.get('date');values[C.dist]=f.get('dist');values[C.time]=f.get('time');values[C.hr]=f.get('hr')||'';let res=await window.amber.update({op:'append_row',table:currentTable,values});msg.textContent=res.ok?'Run added.':('Could not add run: '+res.error);if(res.ok)e.target.reset();});
})();
</script>
</body>
</html>
