<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trip page</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:var(--amber-font);color:var(--amber-text)}.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:calc(var(--amber-gutter) + 8px) var(--amber-gutter) 36px}.hero{display:grid;gap:14px;margin-bottom:18px}.titleRow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.eyebrow{color:var(--amber-accent-text);font-weight:700;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase}.title{font-family:var(--amber-font-rounded);font-size:clamp(2rem,6vw,4.2rem);line-height:.96;margin:4px 0 0}.countCard{background:linear-gradient(135deg,var(--amber-accent-soft),var(--amber-surface));border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:18px;min-width:150px;text-align:center}.countNum{font-family:var(--amber-font-rounded);font-size:clamp(2.4rem,9vw,4.8rem);font-weight:800;line-height:.9;color:var(--amber-accent-text)}.countLabel{color:var(--amber-text-secondary);font-weight:650;margin-top:8px}.grid{display:grid;grid-template-columns:1fr;gap:14px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:16px;box-shadow:0 1px 0 rgba(0,0,0,.03)}.card h2{font-family:var(--amber-font-rounded);font-size:1.1rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}.muted{color:var(--amber-text-secondary)}.flightGrid{display:grid;gap:10px}.flight{background:var(--amber-fill);border-radius:var(--amber-radius-small);padding:12px}.label{font-size:.78rem;color:var(--amber-text-secondary);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}.big{font-weight:750;font-size:1.05rem}.detail{margin-top:4px;color:var(--amber-text-secondary);font-size:.94rem}.hotelName{font-size:1.15rem;font-weight:800;margin-bottom:6px}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--amber-separator);border-radius:999px;padding:6px 10px;margin:4px 5px 0 0;color:var(--amber-text-secondary);background:var(--amber-fill);font-size:.9rem}.list{display:grid;gap:8px}.item{display:flex;align-items:flex-start;gap:10px;width:100%;border:0;background:var(--amber-fill);color:var(--amber-text);text-align:left;border-radius:var(--amber-radius-small);padding:11px 12px;font:inherit;cursor:pointer}.item:active{transform:scale(.995)}.box{width:22px;height:22px;flex:0 0 22px;border-radius:7px;border:2px solid var(--amber-separator);display:grid;place-items:center;margin-top:1px;background:var(--amber-bg)}.done .box{background:var(--amber-accent);border-color:var(--amber-accent);color:var(--amber-on-accent)}.done .txt{text-decoration:line-through;color:var(--amber-text-secondary)}.empty{padding:14px;border:1px dashed var(--amber-separator);border-radius:var(--amber-radius-small);color:var(--amber-text-secondary);background:var(--amber-fill)}.progress{height:9px;background:var(--amber-fill);border-radius:999px;overflow:hidden;margin:0 0 12px}.bar{height:100%;background:var(--amber-accent);border-radius:999px;transition:width .2s}.raw{font-family:var(--amber-font-mono);font-size:.86rem;color:var(--amber-text-secondary);white-space:pre-wrap;word-break:break-word}.topMeta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.error{color:var(--amber-danger);font-size:.9rem;margin-top:8px}@media (min-width:700px){.hero{grid-template-columns:minmax(0,1fr) auto;align-items:stretch}.countCard{display:flex;flex-direction:column;justify-content:center}.flightGrid{grid-template-columns:1fr 1fr}}@media (min-width:900px){.grid{grid-template-columns:1.05fr .95fr}.span{grid-column:span 2}.ideasCard{grid-row:span 2}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
const monthMap={jan:0,january:0,feb:1,february:1,mar:2,march:2,apr:3,april:3,may:4,jun:5,june:5,jul:6,july:6,aug:7,august:7,sep:8,sept:8,september:8,oct:9,october:9,nov:10,november:10,dec:11,december:11};
const app=document.getElementById('app');
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function lineValue(md,label){const re=new RegExp('^\\s*'+label+'\\s*:\\s*(.+)$','im');const m=md.match(re);return m?m[1].trim():'';}
function stripHeading(s){return (s||'').replace(/^#+\s*/,'').trim().toLowerCase();}
function sectionFor(lines,lineNo){let idx=Math.max(0,(lineNo||1)-2);for(let i=idx;i>=0;i--){let t=lines[i].trim();if(!t) continue;if(/^[-*]\s+/.test(t)||/^- \[[ xX]\]/.test(t)) continue;return stripHeading(t).replace(/:$/,'');}return '';}
function parseChecklists(note){const lines=(note.markdown||'').split('\n');const ideas=[],todos=[];(note.checklists||[]).forEach(c=>{let sec=sectionFor(lines,c.line);let item={line:c.line,text:c.text,checked:!!c.checked};if(sec.includes('idea')) ideas.push(item);else if(sec.includes('to do')||sec.includes('todo')||sec.includes('before')) todos.push(item);});return {ideas,todos};}
function dateFromChunk(chunk,today){const m=String(chunk||'').match(/(\d{1,2})\s+([A-Za-zåäöÅÄÖ]+)\s+(\d{1,2}:\d{2})/);if(!m)return null;const mon=monthMap[m[2].toLowerCase()];if(mon==null)return null;const [hh,mm]=m[3].split(':').map(Number);let y=Number((today||'').slice(0,4))||new Date().getFullYear();let d=new Date(y,mon,Number(m[1]),hh,mm);let t=today?new Date(today+'T00:00:00'):new Date();if(d<t&&t-d>1000*60*60*24*180)d=new Date(y+1,mon,Number(m[1]),hh,mm);return d;}
function fmtDate(d){if(!d)return '';return d.toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function flightBits(text,today){let out='',back='';const m=text.match(/out\s+(.+?),\s*back\s+(.+)/i);if(m){out=m[1].trim();back=m[2].trim();}else{out=text;}const outDate=dateFromChunk(out,today);const backDate=dateFromChunk(back,today);return {out,back,outDate,backDate};}
function countdown(date,today){if(!date)return {num:'—',label:'until departure'};const base=today?new Date(today+'T00:00:00'):new Date();const days=Math.ceil((new Date(date.getFullYear(),date.getMonth(),date.getDate())-new Date(base.getFullYear(),base.getMonth(),base.getDate()))/86400000);if(days>1)return {num:days,label:'days until Porto'};if(days===1)return {num:1,label:'day until Porto'};if(days===0)return {num:'today',label:'departure day'};return {num:'✓',label:'trip started'};}
function hotelBits(text){const parts=text.split(',').map(s=>s.trim()).filter(Boolean);const name=parts.shift()||text;const rest=parts.join(', ');const conf=(text.match(/conf\s*#?([A-Za-z0-9-]+)/i)||[])[1];const check=(text.match(/check\s*in\s*(?:from)?\s*([0-9:]+)/i)||[])[1];return {name,rest,conf,check};}
function progress(items){if(!items.length)return 0;return Math.round(items.filter(x=>x.checked).length/items.length*100);}
function listHtml(items,empty){if(!items.length)return `<div class="empty">${esc(empty)}</div>`;return items.map(i=>`<button class="item ${i.checked?'done':''}" data-line="${esc(i.line)}"><span class="box">${i.checked?'✓':''}</span><span class="txt">${esc(i.text)}</span></button>`).join('');}
async function toggle(line,btn){btn.disabled=true;const res=await amber.update({op:'toggle_checklist',line:Number(line)});if(!res.ok){btn.disabled=false;let e=document.createElement('div');e.className='error';e.textContent=res.error||'Could not update the note.';btn.after(e);}}
function render(note){const md=note.markdown||'';const flight=lineValue(md,'flights');const hotel=lineValue(md,'hotel');const budget=lineValue(md,'budget');const f=flightBits(flight,note.today);const h=hotelBits(hotel);const cd=countdown(f.outDate,note.today);const lists=parseChecklists(note);const todoPct=progress(lists.todos);const ideaPct=progress(lists.ideas);app.innerHTML=`
<section class="hero"><div><div class="eyebrow">Weekend trip</div><h1 class="title">${esc(note.title||'Porto weekend')}</h1><div class="topMeta">${budget?`<span class="pill">Budget ${esc(budget.replace(/^~\s*/,''))}</span>`:''}${f.outDate?`<span class="pill">Depart ${esc(fmtDate(f.outDate))}</span>`:''}${f.backDate?`<span class="pill">Return ${esc(fmtDate(f.backDate))}</span>`:''}</div></div><div class="countCard"><div class="countNum">${esc(cd.num)}</div><div class="countLabel">${esc(cd.label)}</div></div></section>
<section class="grid"><div class="card"><h2>✈️ Flights at a glance</h2><div class="flightGrid"><div class="flight"><div class="label">Outbound</div><div class="big">${esc(f.out||'Add outbound flight')}</div>${f.outDate?`<div class="detail">${esc(fmtDate(f.outDate))}</div>`:''}</div><div class="flight"><div class="label">Return</div><div class="big">${esc(f.back||'Add return flight')}</div>${f.backDate?`<div class="detail">${esc(fmtDate(f.backDate))}</div>`:''}</div></div>${flight?`<p class="raw">${esc(flight)}</p>`:''}</div>
<div class="card"><h2>🏨 Hotel</h2><div class="hotelName">${esc(h.name||'Add hotel')}</div>${h.rest?`<div class="detail">${esc(h.rest)}</div>`:''}<div class="topMeta">${h.conf?`<span class="pill">Confirmation ${esc(h.conf)}</span>`:''}${h.check?`<span class="pill">Check-in from ${esc(h.check)}</span>`:''}</div></div>
<div class="card ideasCard"><h2>✨ Ideas to tick off</h2><div class="progress"><div class="bar" style="width:${ideaPct}%"></div></div><div class="list">${listHtml(lists.ideas,'No checklist ideas yet. Add “- [ ] …” under ideas.')}</div></div>
<div class="card"><h2>✅ To-dos before you go</h2><div class="progress"><div class="bar" style="width:${todoPct}%"></div></div><div class="list">${listHtml(lists.todos,'No to-dos yet.')}</div></div></section>`;
app.querySelectorAll('[data-line]').forEach(btn=>btn.addEventListener('click',()=>toggle(btn.dataset.line,btn)));
}
amber.onChange(render);
})();
</script>
</body>
</html>
