<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;font:16px/1.45 var(--amber-font)}
main{max-width:var(--amber-content-max);margin:0 auto;padding:16px var(--amber-gutter)}
h1{font-size:1.5rem;margin:0 0 4px}
.sum{color:var(--amber-text-secondary);margin:0 0 16px}
section{background:var(--amber-surface);border-radius:var(--amber-radius);padding:12px 16px;margin-bottom:16px}
h2{font-size:1.15rem;margin:0 0 6px}
ul{list-style:none;margin:0;padding:0}
li{border-top:1px solid var(--amber-separator)}li:first-child{border-top:0}
label{display:flex;align-items:center;gap:12px;min-height:44px;padding:4px 0;cursor:pointer}
input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--amber-accent);margin:0}
input:checked+span{color:var(--amber-text-secondary);text-decoration:line-through}
form{display:grid;gap:12px;background:var(--amber-surface);border-radius:var(--amber-radius);padding:12px 16px}
form h2{margin:0}
.row{display:flex;flex-wrap:wrap;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;flex:1 1 200px}
.f label{display:block;min-height:0;font-weight:600;padding:0}
input[type=text],select{font:inherit;min-height:44px;padding:6px 10px;border:1px solid var(--amber-text-secondary);border-radius:var(--amber-radius-small);background:var(--amber-fill);color:var(--amber-text)}
button{font:inherit;font-weight:600;min-height:44px;padding:6px 20px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-accent);color:var(--amber-on-accent);cursor:pointer;align-self:flex-start}
:focus-visible{outline:3px solid var(--amber-text);outline-offset:2px}
#status{min-height:1.4em;margin:0}
#status.err{color:var(--amber-danger);font-weight:600}
.empty{color:var(--amber-text-secondary)}
</style></head><body><main>
<h1 id="t"></h1>
<p class="sum" id="sum"></p>
<div id="list"></div>
<form id="form" aria-labelledby="fh">
<h2 id="fh">Add an item</h2>
<div class="row">
<div class="f"><label for="sec">Section</label><select id="sec"></select></div>
<div class="f"><label for="new">Item name</label><input type="text" id="new" autocomplete="off"></div>
</div>
<button type="submit" id="add">Add item</button>
<p id="status" role="status" aria-live="polite"></p>
</form>
</main><script>
const $=id=>document.getElementById(id);
let cur=null,focusLine=null,pendingMsg="";
function parse(note){
  const lines=note.markdown.split("\n"),secs=[];let s=null,k=0;
  lines.forEach(l=>{
    const h=/^##\s+(.*)$/.exec(l);
    if(h){s={name:h[1].trim(),items:[]};secs.push(s);return;}
    if(/^\s*- \[[ xX]\]/.test(l)){const c=note.checklists[k++];if(!c)return;if(!s){s={name:"Other",items:[]};secs.push(s);}s.items.push(c);}
  });
  return secs;
}
function status(m,e){const p=$("status");p.className=e?"err":"";p.textContent="";setTimeout(()=>{p.textContent=m},50);}
amber.onChange(note=>{
  cur=note;
  $("t").textContent=note.title;
  const secs=parse(note);
  const all=note.checklists,done=all.filter(c=>c.checked).length;
  $("sum").textContent=done+" of "+all.length+" items packed";
  const L=$("list");L.innerHTML="";
  secs.forEach((s,i)=>{
    const sec=document.createElement("section");sec.setAttribute("aria-labelledby","h"+i);
    const d=s.items.filter(c=>c.checked).length;
    const h=document.createElement("h2");h.id="h"+i;h.textContent=s.name+" ("+d+" of "+s.items.length+" packed)";
    sec.appendChild(h);
    const ul=document.createElement("ul");
    s.items.forEach(c=>{
      const li=document.createElement("li"),lb=document.createElement("label"),cb=document.createElement("input");
      cb.type="checkbox";cb.checked=c.checked;cb.dataset.line=c.line;
      const sp=document.createElement("span");sp.textContent=c.text;
      cb.onchange=async()=>{focusLine=c.line;const r=await amber.update({op:"toggle_checklist",line:c.line});
        status(r.ok?c.text+(cb.checked?" packed":" not packed"):"Could not update: "+r.error,!r.ok);};
      lb.append(cb,sp);li.appendChild(lb);ul.appendChild(li);
    });
    sec.appendChild(ul);L.appendChild(sec);
  });
  const sel=$("sec"),prev=sel.value;sel.innerHTML="";
  secs.filter(s=>s.name!=="Other").forEach(s=>{const o=document.createElement("option");o.textContent=s.name;o.value=s.name;sel.appendChild(o);});
  if(prev)sel.value=prev;
  if(focusLine!=null){const el=L.querySelector('input[data-line="'+focusLine+'"]');if(el)el.focus();focusLine=null;}
});
$("form").onsubmit=async e=>{
  e.preventDefault();
  const name=$("new").value.trim(),sec=$("sec").value;
  if(!name){status("Please type an item name first.",true);$("new").focus();return;}
  if(!sec){status("No section to add to.",true);return;}
  const lines=cur.markdown.split("\n");
  let i=lines.findIndex(l=>/^##\s+/.test(l)&&l.replace(/^##\s+/,"").trim()===sec);
  if(i<0){status("Section not found.",true);return;}
  let j=i+1;while(j<lines.length&&!/^#{1,2}\s/.test(lines[j]))j++;
  const body=lines.slice(i+1,j);
  while(body.length&&body[body.length-1].trim()==="")body.pop();
  body.push("- [ ] "+name.replace(/\s+/g," "));
  const r=await amber.update({op:"set_text",heading:sec,text:body.join("\n")});
  if(r.ok){$("new").value="";status(name+" added to "+sec+".");}
  else status("Could not add: "+r.error,true);
  $("new").focus();
};
</script></body></html>
