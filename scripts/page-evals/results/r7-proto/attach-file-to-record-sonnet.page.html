<!doctype html><html lang="en"><head><meta charset="utf-8"><style>main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter)}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--amber-separator)}.muted{color:var(--amber-text-secondary)}</style></head>
<body><main><h1 id="t"></h1><div id="list"></div></main><script>
const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
amber.onChange((note, data) => { t.textContent = note.title; list.innerHTML = (data.collections.expenses || []).map((e) => '<div class="row"><span>' + esc(e.item) + (e.receipt ? ' <span class="muted">(receipt)</span>' : "") + "</span><b>" + esc(e.amount) + " kr</b></div>").join(""); });
</script></body></html>
