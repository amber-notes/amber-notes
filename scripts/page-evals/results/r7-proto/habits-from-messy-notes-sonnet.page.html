<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:var(--amber-font);margin:0}
.w{max-width:var(--amber-content-max);margin:0 auto;padding:16px var(--amber-gutter)}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--amber-text-secondary);margin-bottom:16px}
.cards{display:grid;gap:10px;grid-template-columns:1fr}
.card{background:var(--amber-surface);border-radius:var(--amber-radius);padding:14px;display:flex;align-items:center;gap:14px}
.chk{width:48px;height:48px;border-radius:50%;border:2px solid var(--amber-accent);background:var(--amber-fill);font-size:24px;color:var(--amber-on-accent);flex:none;cursor:pointer}
.chk.on{background:var(--amber-accent)}
.nm{font-weight:600;font-size:17px}.st{color:var(--amber-text-secondary);font-size:14px;margin-top:2px}
.fl{color:var(--amber-accent-text);font-weight:700}
h2{font-size:16px;margin:22px 0 8px}
.grid{background:var(--amber-surface);border-radius:var(--amber-radius);padding:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%}td,th{padding:6px 4px;text-align:center;font-size:13px}
th{color:var(--amber-text-secondary);font-weight:500}td:first-child,th:first-child{text-align:left}
.d{display:inline-block;width:18px;height:18px;border-radius:5px;background:var(--amber-fill)}.d.on{background:var(--amber-accent)}
@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.cards{grid-template-columns:repeat(4,1fr)}.card{flex-direction:column;text-align:center}}
</style></head><body><div class="w"><h1>Habits</h1><div class="sub" id="sub"></div><div class="cards" id="cards"></div><h2>Last 14 days</h2><div class="grid" id="grid"></div></div>
<script>
const yes=v=>String(v).trim().toLowerCase()==='yes';
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
let busy=false;
function render(n){
 const t=n.tables[0];if(!t)return;
 const cols=t.columns.map(c=>c.name),habits=cols.slice(1);
 const idx={};t.rows.forEach((r,i)=>idx[r[0]]=i);
 const today=n.today;
 if(idx[today]===undefined&&!busy){busy=true;amber.update({op:'append_row',table:t.index,values:Object.fromEntries([[cols[0],today],...habits.map(h=>[h,'No'])])}).then(()=>busy=false);}
 const get=(d,j)=>idx[d]!==undefined&&yes(t.rows[idx[d]][j+1]);
 let cards='';
 habits.forEach((h,j)=>{
  let s=0,d=today;if(!get(d,j))d=addDays(d,-1);
  while(get(d,j)){s++;d=addDays(d,-1)}
  let best=0,run=0;const ds=t.rows.map(r=>r[0]).sort();
  ds.forEach((x,k)=>{if(get(x,j)){run=(k>0&&ds[k-1]===addDays(x,-1)&&run>0)?run+1:1;best=Math.max(best,run)}else run=0});
  const on=get(today,j);
  cards+=`<div class="card"><button class="chk ${on?'on':''}" data-h="${j}">${on?'✓':''}</button><div><div class="nm">${h}</div><div class="st"><span class="fl">${s?'🔥 ':''}${s}</span> day streak · best ${best}</div></div></div>`;
 });
 document.getElementById('cards').innerHTML=cards;
 const done=habits.filter((h,j)=>get(today,j)).length;
 document.getElementById('sub').textContent=`Today: ${done} of ${habits.length} done`;
 let g='<table><tr><th></th>'+habits.map(h=>`<th>${h}</th>`).join('')+'</tr>';
 for(let k=0;k<14;k++){const d=addDays(today,-k);g+=`<tr><td>${d.slice(5)}</td>`+habits.map((h,j)=>`<td><span class="d ${get(d,j)?'on':''}"></span></td>`).join('')+'</tr>'}
 document.getElementById('grid').innerHTML=g+'</table>';
 document.querySelectorAll('.chk').forEach(b=>b.onclick=()=>{
  const j=+b.dataset.h;if(idx[today]===undefined)return;
  amber.update({op:'set_cell',table:t.index,row:idx[today],col:habits[j],value:get(today,j)?'No':'Yes'});
 });
}
amber.onChange(render);
</script></body></html>
