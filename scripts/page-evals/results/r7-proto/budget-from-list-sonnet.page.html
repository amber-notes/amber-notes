<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:16px var(--amber-gutter) 32px}
.card{background:var(--amber-surface);border-radius:var(--amber-radius);padding:16px;margin-bottom:16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--amber-text-secondary);margin:0 0 12px}
.big{font-family:var(--amber-font-rounded);font-size:36px;font-weight:700}
.sub{color:var(--amber-text-secondary);margin-top:4px}
.bar{height:12px;background:var(--amber-fill);border-radius:6px;overflow:hidden;margin-top:12px}
.bar>div{height:100%;background:var(--amber-accent)}
.over .bar>div{background:var(--amber-danger)}.over .big{color:var(--amber-danger)}
.cat{margin-bottom:12px}.cat .r{display:flex;justify-content:space-between}
.cat .bar{height:8px;margin-top:4px}
.grid{display:block}
@media(min-width:900px){.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.big{font-size:48px}}
form{display:grid;gap:8px}
input,select,button{font:inherit;font-size:16px;padding:10px;border-radius:var(--amber-radius-small);border:1px solid var(--amber-separator);background:var(--amber-fill);color:var(--amber-text);width:100%}
button{background:var(--amber-accent);color:var(--amber-on-accent);border:0;font-weight:600}
.row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--amber-separator)}
.row small{color:var(--amber-text-secondary);display:block}
.err{color:var(--amber-danger);min-height:1em}
</style></head><body><div class="wrap">
<div class="card" id="sum"></div>
<div class="grid">
<div><div class="card"><h2>Add expense</h2>
<form id="f"><input id="n" placeholder="What? (e.g. Lunch)" required>
<input id="a" type="number" step="0.01" inputmode="decimal" placeholder="Amount (kr)" required>
<input id="c" list="cats" placeholder="Category" required><datalist id="cats"></datalist>
<button>Add expense</button><div class="err" id="e"></div></form></div>
<div class="card"><h2>By category</h2><div id="cat"></div></div></div>
<div class="card"><h2>Recent</h2><div id="list"></div></div>
</div></div>
<script>
const fmt=n=>Math.round(n).toLocaleString('sv-SE')+' kr';
const num=s=>parseFloat(String(s).replace(/\s/g,'').replace(',','.'))||0;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let T=null;
function render(note){
 T=note.tables.find(t=>t.columns.some(c=>/amount/i.test(c.name)))||note.tables[0];
 const m=note.markdown.match(/limit[^:\n]*:\s*([\d\s.,]+)/i);
 const limit=m?num(m[1]):0;
 const rows=T?T.rows:[];
 const tot={};let spent=0;
 rows.forEach(r=>{const a=num(r[1]);spent+=a;const k=(r[2]||'other').trim().toLowerCase();tot[k]=(tot[k]||0)+a});
 const left=limit-spent,pct=limit?Math.min(100,spent/limit*100):0;
 const s=document.getElementById('sum');
 s.className='card'+(left<0?' over':'');
 s.innerHTML='<h2>Spent vs limit</h2><div class="big">'+fmt(spent)+'</div><div class="sub">of '+fmt(limit)+' · '+(left>=0?fmt(left)+' left':fmt(-left)+' over')+'</div><div class="bar"><div style="width:'+pct+'%"></div></div>';
 const cats=Object.entries(tot).sort((a,b)=>b[1]-a[1]);
 document.getElementById('cat').innerHTML=cats.map(([k,v])=>'<div class="cat"><div class="r"><span>'+k+'</span><span>'+fmt(v)+'</span></div><div class="bar"><div style="width:'+(spent?v/spent*100:0)+'%"></div></div></div>').join('')||'<div class="sub">No expenses yet</div>';
 document.getElementById('cats').innerHTML=cats.map(c=>'<option value="'+c[0]+'">').join('');
 document.getElementById('list').innerHTML=rows.slice().reverse().map(r=>'<div class="row"><span>'+r[0]+'<small>'+r[2]+' · '+r[3]+'</small></span><b>'+fmt(num(r[1]))+'</b></div>').join('');
}
document.getElementById('f').onsubmit=async e=>{
 e.preventDefault();
 const d=new Date(amber.note.today+'T00:00');
 const res=await amber.update({op:'append_row',table:T.index,values:[n.value.trim().replace(/\|/g,'/'),String(num(a.value)),c.value.trim().toLowerCase().replace(/\|/g,'/'),d.getDate()+' '+MON[d.getMonth()]]});
 if(res.ok){n.value=a.value=c.value='';document.getElementById('e').textContent=''}else document.getElementById('e').textContent=res.error||'Failed';
};
amber.onChange(render);
</script></body></html>
