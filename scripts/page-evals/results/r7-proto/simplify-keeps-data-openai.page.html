<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Household expenses</title>
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 8px var(--amber-gutter) 48px; }
  h1 { margin: 6px 0 18px; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em; }
  .summary { display: grid; gap: 12px; margin-bottom: 18px; }
  @media (min-width: 700px) { .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); overflow: hidden; }
  .top { padding: 16px; }
  .name { color: var(--amber-text-secondary); font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .amount { margin-top: 6px; font-size: 36px; line-height: 1; font-weight: 750; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .count { margin-top: 6px; color: var(--amber-text-secondary); font-size: 14px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 12px 16px; border-top: .5px solid var(--amber-separator); align-items: baseline; }
  .item { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { margin-top: 3px; color: var(--amber-text-secondary); font-size: 13px; }
  .amt { font-weight: 650; font-variant-numeric: tabular-nums; }
  .empty { padding: 12px 16px; color: var(--amber-text-secondary); border-top: .5px solid var(--amber-separator); }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const ONLY = ["Food", "Housing"];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const money = (n) => n.toLocaleString("sv-SE", { maximumFractionDigits: 0 }) + " kr";
  const num = (v) => parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", ".")) || 0;

  function render(note) {
    const table = note.tables.find(t => t.columns.some(c => /^category$/i.test(c.name))) || note.tables[0];
    const app = document.getElementById("app");
    if (!table) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card"><div class="empty">No expense table found.</div></div>`; return; }

    const col = re => table.columns.findIndex(c => re.test(c.name));
    const categoryCol = col(/^category$/i);
    const amountCol = col(/^amt$|amount|cost|price|kr/i);
    const itemCol = col(/^item$|what|description/i);
    const dateCol = col(/^date$/i);

    const rows = table.rows
      .map(row => ({ row, category: categoryCol >= 0 ? String(row[categoryCol]).trim() : "", amount: num(row[amountCol]) }))
      .filter(x => ONLY.includes(x.category));

    const cards = ONLY.map(category => {
      const items = rows.filter(x => x.category === category);
      const total = items.reduce((sum, x) => sum + x.amount, 0);
      const list = items.slice().reverse().map(x => `
        <div class="row">
          <div><div class="item">${esc(itemCol >= 0 ? x.row[itemCol] : category)}</div>${dateCol >= 0 ? `<div class="meta">${esc(x.row[dateCol])}</div>` : ""}</div>
          <div class="amt">${money(x.amount)}</div>
        </div>`).join("");
      return `<section class="card">
        <div class="top"><div class="name">${esc(category)}</div><div class="amount">${money(total)}</div><div class="count">${items.length} ${items.length === 1 ? "entry" : "entries"}</div></div>
        ${list || `<div class="empty">No ${esc(category.toLowerCase())} expenses yet.</div>`}
      </section>`;
    }).join("");

    app.innerHTML = `<h1>${esc(note.title)}</h1><div class="summary">${cards}</div>`;
  }
  amber.onChange(render);
</script>
</body>
</html>
