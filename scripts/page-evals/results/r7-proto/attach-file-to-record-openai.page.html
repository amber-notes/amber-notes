<!doctype html><html lang="en"><head><meta charset="utf-8"><style>main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter)}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--amber-separator)}.muted{color:var(--amber-text-secondary)}</style></head>
<body><main><h1 id="t"></h1><div id="list"></div></main><script>
const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const rentReceipt={"$file":"f01b916a-28eb-49ff-9e5f-9a49e7ad103f","name":"receipt-rent-october.txt","filename":"receipt-rent-october.txt","type":"text/plain","bytes":43};
let attaching=false;
async function attachRentReceipt(data){
  if(attaching) return;
  const rent=(data.collections.expenses||[]).find((e)=>String(e.item||"").toLowerCase()==="rent");
  if(!rent || rent.receipt) return;
  attaching=true;
  await amber.store.collection("expenses").update(rent.id,{receipt:rentReceipt});
  attaching=false;
}
amber.onChange((note, data) => { t.textContent = note.title; attachRentReceipt(data); list.innerHTML = (data.collections.expenses || []).map((e) => '<div class="row"><span>' + esc(e.item) + (e.receipt ? ' <span class="muted">(receipt)</span>' : "") + "</span><b>" + esc(e.amount) + " kr</b></div>").join(""); });
</script></body></html>
