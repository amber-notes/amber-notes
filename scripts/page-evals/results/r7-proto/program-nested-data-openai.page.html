<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strength Coach</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:var(--amber-font);color:var(--amber-text)}button{font:inherit}.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:var(--amber-gutter)}.hero{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin:6px 0 18px}.eyebrow{color:var(--amber-accent-text);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em}.title{font-family:var(--amber-font-rounded);font-size:34px;line-height:1.05;font-weight:800;margin:4px 0}.sub{color:var(--amber-text-secondary);line-height:1.35}.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--amber-separator);background:var(--amber-surface);border-radius:999px;padding:8px 11px;color:var(--amber-text-secondary);white-space:nowrap}.grid{display:grid;grid-template-columns:1fr;gap:14px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:16px;box-shadow:0 1px 0 rgba(0,0,0,.03)}.topline{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.workoutTitle{font-family:var(--amber-font-rounded);font-size:25px;font-weight:800;margin:0}.date{color:var(--amber-text-secondary);font-size:14px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid var(--amber-separator);background:var(--amber-fill);color:var(--amber-text);border-radius:var(--amber-radius-small);padding:9px 12px;cursor:pointer}.btn.primary{background:var(--amber-accent);border-color:var(--amber-accent);color:var(--amber-on-accent);font-weight:700}.btn:disabled{opacity:.45;cursor:default}.progress{height:10px;background:var(--amber-fill);border-radius:999px;overflow:hidden;margin:14px 0 6px}.bar{height:100%;background:var(--amber-accent);border-radius:999px;transition:width .2s}.exercise{border-top:1px solid var(--amber-separator);padding-top:15px;margin-top:15px}.exHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.exName{font-size:19px;font-weight:800}.rx{font-family:var(--amber-font-mono);color:var(--amber-text-secondary);font-size:14px}.sets{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.set{width:52px;height:44px;border-radius:14px;border:1px solid var(--amber-separator);background:var(--amber-fill);color:var(--amber-text);font-weight:800;cursor:pointer}.set.done{background:var(--amber-accent);border-color:var(--amber-accent);color:var(--amber-on-accent)}.set small{display:block;font-weight:600;font-size:11px;opacity:.75}.hint{color:var(--amber-text-secondary);font-size:13px;margin-top:10px}.sessions{display:grid;gap:8px}.session{width:100%;text-align:left;border:1px solid var(--amber-separator);background:var(--amber-fill);border-radius:var(--amber-radius-small);padding:10px;cursor:pointer;color:var(--amber-text)}.session.active{border-color:var(--amber-accent);background:var(--amber-accent-soft)}.session .row{display:flex;justify-content:space-between;gap:8px}.session .name{font-weight:800}.session .meta{color:var(--amber-text-secondary);font-size:12px;margin-top:3px}.check{color:var(--amber-accent-text);font-weight:800}.muted{color:var(--amber-text-secondary)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:var(--amber-fill);border-radius:var(--amber-radius-small);padding:10px;text-align:center}.num{font-family:var(--amber-font-rounded);font-size:22px;font-weight:800}.lab{font-size:12px;color:var(--amber-text-secondary)}.empty{padding:30px;text-align:center;color:var(--amber-text-secondary)}@media (min-width:900px){.grid{grid-template-columns:minmax(0,1.7fr) minmax(280px,.85fr);align-items:start}.title{font-size:42px}.sticky{position:sticky;top:14px}}@media (max-width:520px){.hero{display:block}.pill{margin-top:12px}.summary{grid-template-columns:1fr}.set{flex:1;min-width:48px}.btn{flex:1}.workoutTitle{font-size:22px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading Strength Coach…</div></div>
<script>
(function(){
const amber=window.amber;
const seed={version:1,startDate:'2026-10-12',sessions:[
{week:1,day:'Mon',offset:0,title:'Squat + Bench',exercises:[{lift:'Squat',sets:3,reps:5,weight:60},{lift:'Bench',sets:3,reps:5,weight:40}]},
{week:1,day:'Wed',offset:2,title:'Deadlift + Row',exercises:[{lift:'Deadlift',sets:1,reps:5,weight:80},{lift:'Row',sets:3,reps:8,weight:35}]},
{week:1,day:'Fri',offset:4,title:'Squat + Press',exercises:[{lift:'Squat',sets:3,reps:5,weight:62.5},{lift:'Press',sets:3,reps:5,weight:25}]},
{week:2,day:'Mon',offset:7,title:'Squat + Bench',exercises:[{lift:'Squat',sets:3,reps:5,weight:62.5},{lift:'Bench',sets:3,reps:5,weight:42.5}]},
{week:2,day:'Wed',offset:9,title:'Deadlift + Row',exercises:[{lift:'Deadlift',sets:1,reps:5,weight:82.5},{lift:'Row',sets:3,reps:8,weight:37.5}]},
{week:2,day:'Fri',offset:11,title:'Squat + Press',exercises:[{lift:'Squat',sets:3,reps:5,weight:65},{lift:'Press',sets:3,reps:5,weight:27.5}]},
{week:3,day:'Mon',offset:14,title:'Squat + Bench',exercises:[{lift:'Squat',sets:3,reps:5,weight:65},{lift:'Bench',sets:3,reps:5,weight:45}]},
{week:3,day:'Wed',offset:16,title:'Deadlift + Row',exercises:[{lift:'Deadlift',sets:1,reps:5,weight:85},{lift:'Row',sets:3,reps:8,weight:40}]},
{week:3,day:'Fri',offset:18,title:'Squat + Press',exercises:[{lift:'Squat',sets:3,reps:5,weight:67.5},{lift:'Press',sets:3,reps:5,weight:30}]},
{week:4,day:'Mon',offset:21,title:'Deload: Squat + Bench',exercises:[{lift:'Squat',sets:2,reps:5,weight:60},{lift:'Bench',sets:2,reps:5,weight:40}]},
{week:4,day:'Wed',offset:23,title:'Deload: Deadlift + Row',exercises:[{lift:'Deadlift',sets:2,reps:5,weight:80},{lift:'Row',sets:2,reps:5,weight:35}]},
{week:4,day:'Fri',offset:25,title:'Deload: Squat + Press',exercises:[{lift:'Squat',sets:2,reps:5,weight:62.5},{lift:'Press',sets:2,reps:5,weight:25}]}
]};
let noteData={values:{}};
const $=s=>document.querySelector(s);
function parseDate(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function iso(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+da;}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return iso(d);}
function longDate(s){return parseDate(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function key(i,e,set){return 's'+i+'e'+e+'set'+set;}
function totals(program,done,idx){let total=0,complete=0;program.sessions.forEach((ses,si)=>{if(idx!==undefined&&si!==idx)return;ses.exercises.forEach((ex,ei)=>{for(let n=0;n<ex.sets;n++){total++;if(done[key(si,ei,n)])complete++;}})});return{total,complete};}
function defaultIndex(program,today){let found=program.sessions.findIndex(s=>addDays(program.startDate,s.offset)>=today);return found<0?program.sessions.length-1:found;}
function ensure(data){const v=data&&data.values?data.values:{};if(!v.program){amber.setData({values:{program:seed,done:{},selected:null}});return seed;}return v.program;}
window.selectSession=function(i){amber.setData({values:{selected:i}});};
window.goToday=function(){const p=noteData.values.program||seed;amber.setData({values:{selected:defaultIndex(p,amber.note.today)}});};
window.moveSel=function(delta){const p=noteData.values.program||seed;let i=Number.isInteger(noteData.values.selected)?noteData.values.selected:defaultIndex(p,amber.note.today);i=Math.max(0,Math.min(p.sessions.length-1,i+delta));amber.setData({values:{selected:i}});};
window.toggleSet=function(si,ei,n){const done=Object.assign({},noteData.values.done||{});const k=key(si,ei,n);if(done[k]) delete done[k]; else done[k]=true;amber.setData({values:{done:done}});};
window.finishDay=function(si){const p=noteData.values.program||seed;const done=Object.assign({},noteData.values.done||{});p.sessions[si].exercises.forEach((ex,ei)=>{for(let n=0;n<ex.sets;n++)done[key(si,ei,n)]=true;});amber.setData({values:{done:done}});};
window.clearDay=function(si){const p=noteData.values.program||seed;const done=Object.assign({},noteData.values.done||{});p.sessions[si].exercises.forEach((ex,ei)=>{for(let n=0;n<ex.sets;n++)delete done[key(si,ei,n)];});amber.setData({values:{done:done}});};
function render(note,data){noteData=data||{values:{}};const program=ensure(noteData);const vals=noteData.values||{};const done=vals.done||{};const idx=Number.isInteger(vals.selected)?vals.selected:defaultIndex(program,note.today);const ses=program.sessions[idx];const date=addDays(program.startDate,ses.offset);const dayT=totals(program,done,idx), allT=totals(program,done);const pct=dayT.total?Math.round(dayT.complete/dayT.total*100):0;const allPct=allT.total?Math.round(allT.complete/allT.total*100):0;
let exHtml=ses.exercises.map((ex,ei)=>{let sets='';for(let n=0;n<ex.sets;n++){const d=!!done[key(idx,ei,n)];sets+=`<button class="set ${d?'done':''}" onclick="toggleSet(${idx},${ei},${n})" aria-pressed="${d}">${d?'✓':n+1}<small>set</small></button>`;}return `<div class="exercise"><div class="exHead"><div class="exName">${esc(ex.lift)}</div><div class="rx">${ex.sets}×${ex.reps} · ${ex.weight}kg</div></div><div class="sets">${sets}</div></div>`;}).join('');
let list=program.sessions.map((s,i)=>{const d=addDays(program.startDate,s.offset);const t=totals(program,done,i);const ok=t.complete===t.total;return `<button class="session ${i===idx?'active':''}" onclick="selectSession(${i})"><div class="row"><span class="name">W${s.week} ${s.day}</span><span>${ok?'<span class="check">✓</span>':t.complete+'/'+t.total}</span></div><div class="meta">${esc(s.title)} · ${longDate(d)}</div></button>`;}).join('');
$('#app').innerHTML=`<div class="hero"><div><div class="eyebrow">Strength Coach</div><div class="title">${esc(note.title)}</div><div class="sub">Day-by-day guide with per-set ticking. The training plan and progress live in this app’s data, not in the note text.</div></div><div class="pill">${allT.complete}/${allT.total} sets · ${allPct}%</div></div><div class="grid"><main class="card"><div class="topline"><div><h1 class="workoutTitle">Week ${ses.week} ${ses.day}: ${esc(ses.title)}</h1><div class="date">${longDate(date)}${date===note.today?' · Today':''}</div></div><div class="pill">${dayT.complete}/${dayT.total} sets</div></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="hint">Tap each set when finished. Week 4 is the deload: 2×5 at Week 1 weights.</div>${exHtml}<div class="nav"><button class="btn" onclick="moveSel(-1)" ${idx===0?'disabled':''}>← Previous</button><button class="btn primary" onclick="goToday()">Today / next</button><button class="btn" onclick="moveSel(1)" ${idx===program.sessions.length-1?'disabled':''}>Next →</button><button class="btn" onclick="finishDay(${idx})">Mark day done</button><button class="btn" onclick="clearDay(${idx})">Clear day</button></div></main><aside class="card sticky"><div class="topline"><strong>Program</strong><span class="muted">Starts ${longDate(program.startDate)}</span></div><div class="summary"><div class="stat"><div class="num">4</div><div class="lab">weeks</div></div><div class="stat"><div class="num">12</div><div class="lab">days</div></div><div class="stat"><div class="num">${allPct}%</div><div class="lab">done</div></div></div><div class="sessions" style="margin-top:12px">${list}</div></aside></div>`;
}
amber.onChange(render);
})();
</script>
</body>
</html>
