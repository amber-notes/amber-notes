<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
*{box-sizing:border-box}
body{margin:0;color:var(--amber-text);font-family:var(--amber-font);font-size:16px;line-height:1.4}
.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:18px var(--amber-gutter) 28px}
h1{margin:0 0 14px;font-family:var(--amber-font-rounded);font-size:clamp(1.6rem,7vw,2.4rem);line-height:1.08;letter-spacing:-.03em}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.03)}
table{width:100%;border-collapse:collapse;table-layout:auto}
th,td{padding:11px 12px;border-bottom:1px solid var(--amber-separator);text-align:left;vertical-align:top;overflow-wrap:anywhere;word-break:normal}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--amber-text-secondary);background:var(--amber-fill);font-weight:700}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700;color:var(--amber-accent-text)}
.empty{padding:18px;color:var(--amber-text-secondary)}
@media (max-width:599px){
  .wrap{padding-top:14px}
  .card{border:0;background:transparent;box-shadow:none;overflow:visible}
  table,thead,tbody,tr,th,td{display:block;width:100%}
  thead{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
  tbody{display:grid;gap:12px}
  tr{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:8px 0;overflow:hidden}
  td{display:grid;grid-template-columns:minmax(82px,34%) 1fr;gap:10px;align-items:start;border-bottom:1px solid var(--amber-separator);padding:9px 12px;min-width:0}
  td:last-child{border-bottom:0}
  td::before{content:attr(data-label);color:var(--amber-text-secondary);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;overflow-wrap:anywhere}
  td:first-child{background:var(--amber-accent-soft);grid-template-columns:1fr;font-size:1.08rem;padding-top:11px;padding-bottom:11px}
  td:first-child::before{display:none}
}
@media (min-width:900px){th,td{padding:13px 16px}.wrap{padding-top:24px}}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <div class="card" id="mealCard"><table id="grid" aria-label="Meal plan"></table></div>
</div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
function render(note){
  title.textContent=note.title||"Meal plan";
  const tb=(note.tables||[])[0];
  if(!tb){grid.outerHTML='<div class="empty">No meal plan table found.</div>';return;}
  const cols=tb.columns||[];
  const head='<thead><tr>'+cols.map(c=>'<th scope="col">'+esc(c.name)+'</th>').join('')+'</tr></thead>';
  const rows=(tb.rows||[]).map(r=>'<tr>'+cols.map((c,i)=>'<td data-label="'+esc(c.name)+'">'+esc(r[i]||'')+'</td>').join('')+'</tr>').join('');
  grid.innerHTML=head+'<tbody>'+rows+'</tbody>';
}
amber.onChange(render);
</script>
</body>
</html>
