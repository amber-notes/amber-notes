<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-needs" content='{"hosts":["query1.finance.yahoo.com"]}'>
<title>Stocks I watch</title>
<style>
  *{box-sizing:border-box} .wrap{max-width:var(--amber-content-max);margin:0 auto;padding:18px var(--amber-gutter) 36px}
  .top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}
  h1{font:700 28px/1.1 var(--amber-font-rounded);margin:0 0 6px;color:var(--amber-text)}
  .muted{color:var(--amber-text-secondary);font-size:14px}.btn{appearance:none;border:0;border-radius:var(--amber-radius-small);background:var(--amber-accent);color:var(--amber-on-accent);font:600 15px var(--amber-font);padding:10px 14px;cursor:pointer}.btn:disabled{opacity:.55;cursor:default}
  .grid{display:grid;grid-template-columns:1fr;gap:12px;margin:14px 0}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:14px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .label{color:var(--amber-text-secondary);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}.big{font:750 28px/1.1 var(--amber-font-rounded);color:var(--amber-text)}.pos{color:#12833b}.neg{color:var(--amber-danger)}.small{font-size:13px;color:var(--amber-text-secondary);margin-top:5px}
  .tableCard{overflow:hidden;padding:0}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid var(--amber-separator);text-align:right;vertical-align:middle;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--amber-text-secondary);font-weight:650;background:var(--amber-fill)}tr:last-child td{border-bottom:0}.ticker{font:700 15px var(--amber-font-mono);color:var(--amber-text)}.name{display:block;font:12px var(--amber-font);color:var(--amber-text-secondary);margin-top:2px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill{display:inline-flex;align-items:center;border-radius:999px;background:var(--amber-accent-soft);color:var(--amber-accent-text);padding:3px 8px;font-size:12px;font-weight:650}.err{background:color-mix(in srgb,var(--amber-danger) 12%,var(--amber-surface));border-color:color-mix(in srgb,var(--amber-danger) 35%,var(--amber-separator));color:var(--amber-text)}
  .hint{padding:16px;text-align:center;color:var(--amber-text-secondary)}.mobileOnly{display:none}.currencyGroup{margin-bottom:4px}.footer{margin-top:10px;color:var(--amber-text-secondary);font-size:12px;line-height:1.35}
  @media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}h1{font-size:34px}.big{font-size:32px}}
  @media (max-width:640px){.hideSm{display:none}th,td{padding:10px 8px}.mobileOnly{display:block}.wrap{padding-top:12px}.big{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>Stocks I watch</h1><div id="sub" class="muted">Loading holdings…</div></div><button id="refresh" class="btn">Refresh prices</button></div>
  <div id="message"></div>
  <div class="grid" id="summary"></div>
  <div class="card tableCard"><table><thead><tr><th>Ticker</th><th>Shares</th><th class="hideSm">Buy</th><th>Price</th><th class="hideSm">Value</th><th>Profit</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="hint">No data yet.</td></tr></tbody></table></div>
  <div class="footer">Prices are fetched from Yahoo Finance when you open the page or tap Refresh. Profit is calculated from the note’s table: (live price − buy price) × shares. Totals are grouped by quote currency.</div>
</div>
<script>
(function(){
  const $=id=>document.getElementById(id); let lastNote=null, loading=false, quotes={}, lastFetch=null, lastError='';
  const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
  function num(v){ const n=parseFloat(String(v||'').replace(/[^0-9.+-]/g,'')); return isFinite(n)?n:0; }
  function money(v,c){ if(!isFinite(v)) return '—'; try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c||'USD',maximumFractionDigits:2}).format(v)}catch(e){return (c?c+' ':'')+v.toFixed(2)} }
  function plain(v){ return isFinite(v)?new Intl.NumberFormat(undefined,{maximumFractionDigits:4}).format(v):'—'; }
  function pct(v){ return isFinite(v)?(v>=0?'+':'')+v.toFixed(2)+'%':'—'; }
  function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function holdings(note){
    const t=(note.tables||[])[0]; if(!t) return [];
    const cols=t.columns.map(c=>norm(c.name));
    const ti=cols.findIndex(c=>c==='ticker'||c==='symbol');
    const si=cols.findIndex(c=>c==='shares'||c==='qty'||c==='quantity');
    const bi=cols.findIndex(c=>c==='buy price'||c==='buy'||c==='cost basis'||c==='cost');
    if(ti<0||si<0||bi<0) return [];
    return t.rows.map((r,i)=>({i,ticker:String(r[ti]||'').trim().toUpperCase(),shares:num(r[si]),buy:num(r[bi])})).filter(h=>h.ticker&&h.shares);
  }
  function candidates(t){
    const out=[t];
    if(/^[A-ZÅÄÖ]+-[A-Z]$/.test(t)) out.push(t+'.ST');
    if(t.includes('.')) out.push(t.replace(/\./g,'-'));
    return [...new Set(out)];
  }
  async function fetchPrices(list){
    if(!list.length) return;
    loading=true; lastError=''; render();
    const syms=[...new Set(list.flatMap(h=>candidates(h.ticker)))];
    try{
      const url='https://query1.finance.yahoo.com/v7/finance/quote?symbols='+encodeURIComponent(syms.join(','));
      const res=await amber.fetch(url,{method:'GET'});
      if(!res.ok) throw new Error(res.error||('Yahoo Finance returned '+res.status));
      const body=typeof res.body==='string'?JSON.parse(res.body):res.body;
      const arr=((body||{}).quoteResponse||{}).result||[];
      const bySymbol={}; arr.forEach(q=>{ if(q&&q.symbol) bySymbol[String(q.symbol).toUpperCase()]=q; });
      const next={};
      list.forEach(h=>{ for(const s of candidates(h.ticker)){ const q=bySymbol[s.toUpperCase()]; if(q && q.regularMarketPrice!=null){ next[h.ticker]=q; break; } } });
      quotes=next; lastFetch=new Date();
      if(Object.keys(next).length<list.length) lastError='Some tickers were not returned by Yahoo Finance. If a symbol needs an exchange suffix, edit the Ticker in your note (for example VOLV-B.ST).';
    }catch(e){ lastError=e.message||String(e); }
    loading=false; render();
  }
  function render(){
    const list=holdings(lastNote||amber.note||{}); $('sub').textContent=list.length?list.length+' holding'+(list.length===1?'':'s')+(lastFetch?' • updated '+lastFetch.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''):'Add rows to the table with Ticker, Shares and Buy price.';
    $('refresh').disabled=loading||!list.length; $('refresh').textContent=loading?'Refreshing…':'Refresh prices';
    $('message').innerHTML=lastError?'<div class="card err">'+esc(lastError)+'</div>':'';
    if(!list.length){$('summary').innerHTML=''; $('rows').innerHTML='<tr><td colspan="6" class="hint">No holdings found. Use columns: Ticker, Shares, Buy price.</td></tr>'; return;}
    const groups={}, rows=list.map(h=>{
      const q=quotes[h.ticker]||{}; const price=Number(q.regularMarketPrice); const cur=q.currency||'USD'; const cost=h.shares*h.buy; const val=isFinite(price)?h.shares*price:NaN; const profit=isFinite(price)?val-cost:NaN; const ret=cost?profit/cost*100:NaN;
      if(isFinite(profit)){ groups[cur]||(groups[cur]={cost:0,value:0,profit:0}); groups[cur].cost+=cost; groups[cur].value+=val; groups[cur].profit+=profit; }
      return {h,q,price,cur,cost,val,profit,ret};
    });
    const ghtml=Object.keys(groups).length?Object.entries(groups).map(([c,g])=>'<div class="currencyGroup"><b>'+esc(c)+'</b> '+money(g.profit,c)+' <span class="'+(g.profit>=0?'pos':'neg')+'">('+pct(g.cost?g.profit/g.cost*100:NaN)+')</span></div>').join(''):'—';
    const totalValue=Object.entries(groups).map(([c,g])=>'<div class="currencyGroup"><b>'+esc(c)+'</b> '+money(g.value,c)+'</div>').join('')||'—';
    const totalCost=Object.entries(groups).map(([c,g])=>'<div class="currencyGroup"><b>'+esc(c)+'</b> '+money(g.cost,c)+'</div>').join('')||'—';
    $('summary').innerHTML='<div class="card"><div class="label">Profit / loss</div><div class="big">'+ghtml+'</div><div class="small">Grouped by currency</div></div><div class="card"><div class="label">Market value</div><div class="big">'+totalValue+'</div><div class="small">Live Yahoo Finance prices</div></div><div class="card"><div class="label">Cost basis</div><div class="big">'+totalCost+'</div><div class="small">Shares × buy price</div></div>';
    $('rows').innerHTML=rows.map(r=>{
      const change=Number(r.q.regularMarketChangePercent); const cls=isFinite(r.profit)?(r.profit>=0?'pos':'neg'):'';
      return '<tr><td><span class="ticker">'+esc(r.h.ticker)+'</span><span class="name">'+esc(r.q.shortName||r.q.longName||r.q.symbol||'')+'</span></td><td>'+plain(r.h.shares)+'</td><td class="hideSm">'+money(r.h.buy,r.cur)+'</td><td>'+money(r.price,r.cur)+'<span class="name '+(change>=0?'pos':'neg')+'">'+(isFinite(change)?pct(change)+' today':'')+'</span></td><td class="hideSm">'+money(r.val,r.cur)+'</td><td><span class="'+cls+'">'+money(r.profit,r.cur)+'</span><span class="name '+cls+'">'+pct(r.ret)+'</span></td></tr>';
    }).join('');
  }
  $('refresh').addEventListener('click',()=>fetchPrices(holdings(lastNote||amber.note||{})));
  amber.onChange((note)=>{ lastNote=note; render(); const list=holdings(note); if(list.length && !loading && !lastFetch) fetchPrices(list); });
})();
</script>
</body>
</html>
