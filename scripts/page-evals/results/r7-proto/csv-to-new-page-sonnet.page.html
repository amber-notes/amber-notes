<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
.w{max-width:var(--amber-content-max);margin:0 auto;padding:16px var(--amber-gutter) 32px}
h1{font-family:var(--amber-font-rounded);font-size:26px;margin:0 0 4px}
.sub{color:var(--amber-text-secondary);margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.c{background:var(--amber-surface);border-radius:var(--amber-radius);padding:14px}
.c b{display:block;font-family:var(--amber-font-rounded);font-size:24px;color:var(--amber-accent-text)}
.c span{color:var(--amber-text-secondary);font-size:13px}
.sec{background:var(--amber-surface);border-radius:var(--amber-radius);padding:14px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 10px}
svg{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--amber-separator)}
th:first-child,td:first-child{text-align:left}
th{color:var(--amber-text-secondary);font-weight:500}
.cols{display:block}
@media(min-width:600px){.cards{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){.cols{display:grid;grid-template-columns:3fr 2fr;gap:16px}.c b{font-size:30px}}
</style></head><body><div class="w"><h1>Running</h1><div class="sub" id="sub"></div>
<div class="cards" id="cards"></div>
<div class="cols"><div><div class="sec"><h2>Weekly distance (km)</h2><div id="wk"></div></div>
<div class="sec"><h2>Pace per run (min/km)</h2><div id="pc"></div></div></div>
<div class="sec"><h2>Recent runs</h2><table id="t"></table></div></div></div>
<script>
const f=n=>n.toFixed(1);
const pace=p=>{const m=Math.floor(p),s=Math.round((p-m)*60);return s==60?(m+1)+":00":m+":"+String(s).padStart(2,"0")};
function monday(d){const x=new Date(d+"T00:00:00");x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toISOString().slice(0,10)}
function bars(vals,labels,h=150){const W=600,max=Math.max(...vals,1),bw=W/vals.length;
let s=`<svg viewBox="0 0 ${W} ${h+22}">`;vals.forEach((v,i)=>{const bh=v/max*h;
s+=`<rect x="${i*bw+3}" y="${h-bh}" width="${bw-6}" height="${bh}" rx="3" fill="var(--amber-accent)"/><text x="${i*bw+bw/2}" y="${h+15}" font-size="11" text-anchor="middle" fill="var(--amber-text-secondary)">${labels[i]}</text><text x="${i*bw+bw/2}" y="${h-bh-4}" font-size="11" text-anchor="middle" fill="var(--amber-text)">${v}</text>`});return s+"</svg>"}
function line(vals,h=120){const W=600,mn=Math.min(...vals)-.2,mx=Math.max(...vals)+.2;
const pts=vals.map((v,i)=>[i/(vals.length-1||1)*(W-20)+10,(v-mn)/(mx-mn)*(h-10)+5]);
return `<svg viewBox="0 0 ${W} ${h}"><polyline fill="none" stroke="var(--amber-accent)" stroke-width="2" points="${pts.map(p=>p.join(",")).join(" ")}"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--amber-accent)"/>`).join("")}</svg>`}
amber.onChange(n=>{
const t=n.tables.find(t=>t.columns.some(c=>/distance/i.test(c.name)))||n.tables[0];
if(!t)return;
const runs=t.rows.map(r=>({d:r[0],km:parseFloat(r[1]),min:parseFloat(r[2]),hr:parseFloat(r[3])})).filter(r=>r.km>0).sort((a,b)=>a.d<b.d?-1:1);
if(!runs.length)return;
const km=runs.reduce((a,r)=>a+r.km,0),mn=runs.reduce((a,r)=>a+r.min,0),hr=runs.reduce((a,r)=>a+r.hr,0)/runs.length;
document.getElementById("sub").textContent=runs.length+" runs · "+runs[0].d+" to "+runs[runs.length-1].d;
const best=Math.max(...runs.map(r=>r.km));
document.getElementById("cards").innerHTML=[[f(km),"total km"],[pace(mn/km)+"/km","avg pace"],[Math.round(hr)+" bpm","avg heart rate"],[f(best)+" km","longest run"]].map(c=>`<div class="c"><b>${c[0]}</b><span>${c[1]}</span></div>`).join("");
const wk={};runs.forEach(r=>{const k=monday(r.d);wk[k]=(wk[k]||0)+r.km});
const ks=Object.keys(wk).sort();
document.getElementById("wk").innerHTML=bars(ks.map(k=>+wk[k].toFixed(1)),ks.map(k=>k.slice(5)));
document.getElementById("pc").innerHTML=line(runs.map(r=>r.min/r.km))+`<div class="sub" style="margin:6px 0 0">Pace ${pace(runs[0].min/runs[0].km)} → ${pace(runs[runs.length-1].min/runs[runs.length-1].km)} min/km</div>`;
document.getElementById("t").innerHTML="<tr><th>Date</th><th>km</th><th>Pace</th><th>HR</th></tr>"+runs.slice(-10).reverse().map(r=>`<tr><td>${r.d}</td><td>${f(r.km)}</td><td>${pace(r.min/r.km)}</td><td>${r.hr}</td></tr>`).join("");
});
</script></body></html>
