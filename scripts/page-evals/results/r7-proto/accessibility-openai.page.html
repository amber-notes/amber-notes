<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Packing list</title>
<style>
*{box-sizing:border-box}body{margin:0;color:var(--amber-text);font-family:var(--amber-font);font-size:17px;line-height:1.45}.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:var(--amber-gutter)}header{margin:0 0 1rem}.eyebrow{margin:0;color:var(--amber-text-secondary);font-size:.95rem}h1{margin:.1rem 0 .35rem;font-size:2rem;line-height:1.1;font-family:var(--amber-font-rounded)}.summary{display:flex;gap:.75rem;flex-wrap:wrap;margin:.75rem 0 0}.pill{background:var(--amber-accent-soft);color:var(--amber-accent-text);border-radius:999px;padding:.45rem .75rem;font-weight:700}.grid{display:grid;gap:1rem}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:1rem}.card h2{margin:0 0 .75rem;font-size:1.25rem}.items{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}.item{display:flex;align-items:flex-start;gap:.7rem;padding:.7rem;border-radius:var(--amber-radius-small);background:var(--amber-bg);border:1px solid var(--amber-separator)}.item input{width:1.35rem;height:1.35rem;min-width:1.35rem;margin:.08rem 0 0;accent-color:var(--amber-accent)}.item label{flex:1;min-width:0}.item.done label{color:var(--amber-text-secondary);text-decoration:line-through}.empty{color:var(--amber-text-secondary);margin:.25rem 0}.add{display:grid;gap:.75rem}.row{display:grid;gap:.6rem}label.form-label{font-weight:700}input[type=text],select{width:100%;font:inherit;color:var(--amber-text);background:var(--amber-fill);border:1px solid var(--amber-separator);border-radius:var(--amber-radius-small);padding:.75rem;min-height:2.8rem}button{font:inherit;font-weight:800;border:0;border-radius:var(--amber-radius-small);background:var(--amber-accent);color:var(--amber-on-accent);padding:.8rem 1rem;min-height:2.8rem}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber-accent);outline-offset:3px}button[disabled]{opacity:.55}.status{min-height:1.5rem;color:var(--amber-text-secondary);margin:.25rem 0 0}.skip{position:absolute;left:-999px;top:auto}.skip:focus{left:var(--amber-gutter);top:var(--amber-gutter);z-index:5;background:var(--amber-surface);color:var(--amber-text);padding:.6rem;border-radius:var(--amber-radius-small)}@media (min-width:900px){.grid{grid-template-columns:1fr 1fr}.add-card{grid-column:1/-1}.row{grid-template-columns:1fr 2fr auto;align-items:end}h1{font-size:2.4rem}}
</style>
</head>
<body>
<a class="skip" href="#addItem">Skip to add an item</a>
<div class="wrap">
<header>
<p class="eyebrow">Trip packing checklist</p>
<h1 id="title">Packing list</h1>
<div class="summary" aria-label="Packing progress"><span class="pill" id="packed">0 packed</span><span class="pill" id="remaining">0 remaining</span></div>
</header>
<main>
<section class="card add-card" aria-labelledby="addHeading">
<h2 id="addHeading">Add an item</h2>
<form id="addForm" class="add">
<div class="row">
<div><label class="form-label" for="sectionSelect">Section</label><select id="sectionSelect"></select></div>
<div><label class="form-label" for="addItem">Item name</label><input id="addItem" type="text" autocomplete="off" placeholder="For example, sunglasses" required></div>
<button id="addButton" type="submit">Add item</button>
</div>
<p class="status" id="status" role="status" aria-live="polite"></p>
</form>
</section>
<div id="sections" class="grid" aria-live="polite"></div>
</main>
</div>
<script>
const $=id=>document.getElementById(id);let currentNote=null;let parsed=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function parse(note){const lines=String(note.markdown||'').split('\n');const byLine=new Map((note.checklists||[]).map(c=>[Number(c.line),c]));const sections=[];let cur=null;for(let i=0;i<lines.length;i++){const n=i+1;const m=lines[i].match(/^(#{1,6})\s+(.+?)\s*$/);if(m){cur={heading:m[2],level:m[1].length,start:n,items:[],body:[]};sections.push(cur);continue;}if(!cur){cur={heading:'Packing list',level:0,start:1,items:[],body:[]};sections.push(cur);}cur.body.push(lines[i]);const c=byLine.get(n);if(c)cur.items.push({...c,line:n});}return sections.filter(s=>s.items.length||s.level>0);}
function render(note){currentNote=note;parsed=parse(note);$('title').textContent=note.title||'Packing list';const total=(note.checklists||[]).length;const done=(note.checklists||[]).filter(c=>c.checked).length;$('packed').textContent=done+' packed';$('remaining').textContent=(total-done)+' remaining';const old=$('sectionSelect').value;$('sectionSelect').innerHTML=parsed.map(s=>'<option value="'+esc(s.heading)+'">'+esc(s.heading)+'</option>').join('');if(parsed.some(s=>s.heading===old))$('sectionSelect').value=old;$('sections').innerHTML=parsed.map((s,si)=>'<section class="card" aria-labelledby="h'+si+'"><h2 id="h'+si+'">'+esc(s.heading)+'</h2>'+(s.items.length?'<ul class="items">'+s.items.map((c,ii)=>{const id='c'+si+'_'+ii;return '<li class="item '+(c.checked?'done':'')+'"><input type="checkbox" id="'+id+'" data-line="'+c.line+'" '+(c.checked?'checked':'')+'><label for="'+id+'">'+esc(c.text)+'</label></li>';}).join('')+'</ul>':'<p class="empty">No items yet.</p>')+'</section>').join('');document.querySelectorAll('input[type=checkbox][data-line]').forEach(box=>box.addEventListener('change',toggle));}
async function toggle(e){const box=e.currentTarget;box.disabled=true;const label=box.closest('.item')?.querySelector('label')?.textContent||'item';const r=await amber.update({op:'toggle_checklist',line:Number(box.dataset.line)});$('status').textContent=r.ok?(box.checked?label+' marked packed.':label+' marked not packed.'):(r.error||'Could not update item.');if(!r.ok)box.disabled=false;}
function sectionTextWithItem(section,item){const body=section.body.slice();while(body.length&&body[body.length-1].trim()==='')body.pop();body.push('- [ ] '+item);return body.join('\n')+'\n';}
$('addForm').addEventListener('submit',async e=>{e.preventDefault();if(!currentNote)return;const item=$('addItem').value.replace(/\s+/g,' ').trim();if(!item){$('status').textContent='Enter an item name first.';$('addItem').focus();return;}const heading=$('sectionSelect').value||'Packing list';const section=parsed.find(s=>s.heading===heading);if(!section||section.level===0){$('status').textContent='Choose a section before adding.';return;}$('addButton').disabled=true;$('status').textContent='Adding '+item+'…';const r=await amber.update({op:'set_text',heading:heading,text:sectionTextWithItem(section,item)});$('addButton').disabled=false;if(r.ok){$('addItem').value='';$('status').textContent=item+' added to '+heading+'.';$('addItem').focus();}else{$('status').textContent=r.error||'Could not add item.';}});
amber.onChange(render);
</script>
</body>
</html>
