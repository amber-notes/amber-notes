<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:16px var(--amber-gutter)}
h1{font-size:1.5rem;margin:0 0 12px}
table{width:100%;border-collapse:collapse}
td,th{padding:10px 12px;border-bottom:1px solid var(--amber-separator);text-align:left;vertical-align:top;overflow-wrap:anywhere}
th{color:var(--amber-text-secondary);font-weight:600}
.cards{display:none}
.card{background:var(--amber-surface);border-radius:var(--amber-radius);padding:12px 14px;margin-bottom:10px}
.card h2{font-size:1.05rem;margin:0 0 6px;color:var(--amber-accent-text)}
.row{display:flex;gap:10px;padding:4px 0}
.row b{flex:0 0 88px;color:var(--amber-text-secondary);font-weight:500;font-size:.9rem}
.row span{flex:1;min-width:0;overflow-wrap:anywhere}
@media (max-width:700px){table{display:none}.cards{display:block}}
</style></head><body><div class="wrap"><h1 id="t"></h1><table id="grid"></table><div class="cards" id="cards"></div></div><script>
const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
amber.onChange((note)=>{t.textContent=note.title;const tb=note.tables[0];if(!tb)return;
grid.innerHTML="<tr>"+tb.columns.map((c)=>"<th>"+esc(c.name)+"</th>").join("")+"</tr>"+tb.rows.map((r)=>"<tr>"+r.map((c)=>"<td>"+esc(c)+"</td>").join("")+"</tr>").join("");
cards.innerHTML=tb.rows.map((r)=>"<div class='card'><h2>"+esc(r[0])+"</h2>"+r.slice(1).map((c,i)=>c?"<div class='row'><b>"+esc(tb.columns[i+1].name)+"</b><span>"+esc(c)+"</span></div>":"").join("")+"</div>").join("")});
</script></body></html>
