<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household expenses</title>
<style>
*{box-sizing:border-box}main{max-width:var(--amber-content-max);margin:0 auto;padding:10px var(--amber-gutter) 56px}.top{display:grid;gap:14px;margin:4px 0 24px}.eyebrow{color:var(--amber-text-secondary);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.hero{background:linear-gradient(135deg,var(--amber-accent-soft),var(--amber-surface));border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:20px}.monthName{font-size:18px;font-weight:700;color:var(--amber-accent-text);margin-bottom:6px}.total{font-family:var(--amber-font-rounded);font-size:48px;line-height:1;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums}.meta{color:var(--amber-text-secondary);margin-top:8px}.grid{display:grid;gap:20px}.card{background:var(--amber-surface);border-radius:var(--amber-radius);overflow:hidden;border:1px solid var(--amber-separator)}.cardHead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 16px 10px;border-bottom:1px solid var(--amber-separator)}h1{font-size:28px;letter-spacing:-.025em;margin:0 0 2px}h2{font-size:17px;margin:0}.hint{color:var(--amber-text-secondary);font-size:13px}.monthRows{padding:8px}.mrow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 8px;border-radius:var(--amber-radius-small);border:0;background:transparent;color:var(--amber-text);width:100%;font:inherit;text-align:left}.mrow[aria-pressed="true"]{background:var(--amber-accent-soft)}.barTrack{height:12px;border-radius:99px;background:var(--amber-fill);overflow:hidden}.barFill{height:100%;min-width:3px;border-radius:99px;background:var(--amber-accent)}.money{font-variant-numeric:tabular-nums;font-weight:700}.groups{display:grid;gap:14px}.group{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.ghead{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:14px 16px;background:var(--amber-fill)}.dot{width:11px;height:11px;border-radius:50%;background:var(--amber-accent)}.gtitle{font-weight:750}.items{display:grid}.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 16px;border-top:1px solid var(--amber-separator)}.itemName{font-weight:600}.date{color:var(--amber-text-secondary);font-size:13px;margin-top:2px}.empty{padding:22px;color:var(--amber-text-secondary);text-align:center}.small{font-size:13px;color:var(--amber-text-secondary)}@media (min-width:900px){.top{grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);align-items:stretch}.hero{padding:28px}.total{font-size:72px}.grid{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);align-items:start}.monthlyCard{position:sticky;top:12px}}@media (max-width:520px){.total{font-size:42px}.mrow{grid-template-columns:58px minmax(0,1fr);gap:8px}.mrow .money{grid-column:2;justify-self:end}.cardHead{display:block}.hint{margin-top:3px}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const monthFmt=new Intl.DateTimeFormat(undefined,{month:"long",year:"numeric"});
const shortFmt=new Intl.DateTimeFormat(undefined,{month:"short",year:"numeric"});
const numFmt=new Intl.NumberFormat(undefined,{maximumFractionDigits:0});
const money=n=>numFmt.format(Math.round(n||0));
const parseAmt=v=>{const s=String(v??"").replace(/[^0-9,.-]/g,"").replace(/\s/g,"").replace(",",".");return Number.parseFloat(s)||0};
const parseDate=v=>{const d=new Date(String(v||"")+"T00:00:00");return isNaN(d)?null:d};
const ym=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`:"No date";
const palette=["var(--amber-accent)","#3f8f6b","#4b74c9","#b5579a","#9a6a32","var(--amber-text-secondary)"];
let selected=null;
function tableInfo(note){const t=(note.tables||[]).find(t=>t.columns.some(c=>/^amt$|amount|cost|price|total/i.test(c.name)))||(note.tables||[])[0];if(!t)return null;const find=re=>t.columns.findIndex(c=>re.test(c.name));return{t,date:find(/^date$/i),item:find(/item|what|description|name/i),cat:find(/category|cat|type/i),amt:find(/^amt$|amount|cost|price|total/i)}}
function render(note){const app=document.getElementById("app"),info=tableInfo(note);if(!info||info.amt<0){app.innerHTML=`<div class="card empty">No expense table with an amount column found.</div>`;return}const {t,date,item,cat,amt}=info;const rows=t.rows.map((r,i)=>{const d=date>=0?parseDate(r[date]):null;return{idx:i,date:d,month:ym(d),dateText:date>=0?r[date]:"",item:item>=0?r[item]:"Expense",cat:cat>=0&&r[cat]?r[cat]:"Other",amt:parseAmt(r[amt])}}).filter(r=>r.amt||r.item||r.cat);const months=[...rows.reduce((m,r)=>m.set(r.month,(m.get(r.month)||0)+r.amt),new Map())].sort((a,b)=>b[0].localeCompare(a[0]));const todayMonth=note.today?note.today.slice(0,7):null;if(!selected||!months.some(([m])=>m===selected))selected=months.some(([m])=>m===todayMonth)?todayMonth:(months[0]?.[0]||todayMonth||"No date");const current=rows.filter(r=>r.month===selected).sort((a,b)=>(b.date?.getTime()||0)-(a.date?.getTime()||0));const monthTotal=current.reduce((s,r)=>s+r.amt,0);const maxMonth=Math.max(1,...months.map(([,v])=>v));const byCat=[...current.reduce((m,r)=>{const a=m.get(r.cat)||[];a.push(r);m.set(r.cat,a);return m},new Map())].map(([name,items])=>({name,items,total:items.reduce((s,r)=>s+r.amt,0)})).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name));const selectedDate=selected&&selected!=="No date"?new Date(selected+"-01T00:00:00"):null;app.innerHTML=`<section class="top"><div><div class="eyebrow">Household expenses</div><h1>${esc(note.title)}</h1><div class="hero"><div class="monthName">${esc(selectedDate?monthFmt.format(selectedDate):selected)}</div><div class="total">${money(monthTotal)}</div><div class="meta">${current.length} expense${current.length===1?"":"s"} grouped by category</div></div></div><div class="card monthlyCard"><div class="cardHead"><h2>Month by month</h2><div class="hint">Tap a month to view categories</div></div><div class="monthRows">${months.length?months.map(([m,v])=>{const d=m!=="No date"?new Date(m+"-01T00:00:00"):null;return`<button class="mrow" data-month="${esc(m)}" aria-pressed="${m===selected}"><span>${esc(d?shortFmt.format(d):m)}</span><span class="barTrack"><span class="barFill" style="display:block;width:${(v/maxMonth*100).toFixed(1)}%"></span></span><span class="money">${money(v)}</span></button>`}).join(""):`<div class="empty">No expenses yet.</div>`}</div></div></section><section class="grid"><div class="card"><div class="cardHead"><h2>Monthly bars</h2><div class="hint">All recorded months</div></div><div class="monthRows">${months.map(([m,v])=>{const d=m!=="No date"?new Date(m+"-01T00:00:00"):null;return`<div class="mrow"><span>${esc(d?shortFmt.format(d):m)}</span><span class="barTrack"><span class="barFill" style="display:block;width:${(v/maxMonth*100).toFixed(1)}%"></span></span><span class="money">${money(v)}</span></div>`}).join("")}</div></div><div><div class="eyebrow" style="margin:2px 4px 10px">By category · ${esc(selectedDate?monthFmt.format(selectedDate):selected)}</div><div class="groups">${byCat.length?byCat.map((g,i)=>`<article class="group"><div class="ghead"><span class="dot" style="background:${palette[i%palette.length]}"></span><span class="gtitle">${esc(g.name)} <span class="small">${g.items.length} item${g.items.length===1?"":"s"}</span></span><span class="money">${money(g.total)}</span></div><div class="items">${g.items.map(r=>`<div class="item"><div><div class="itemName">${esc(r.item)}</div><div class="date">${esc(r.dateText)}</div></div><div class="money">${money(r.amt)}</div></div>`).join("")}</div></article>`).join(""):`<div class="card empty">No expenses in this month.</div>`}</div></div></section>`;app.querySelectorAll("button[data-month]").forEach(b=>b.addEventListener("click",()=>{selected=b.dataset.month;render(note)}));}
amber.onChange(render);
</script>
</body>
</html>
