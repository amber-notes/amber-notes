<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
body{margin:0}
.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:16px var(--amber-gutter)}
h1{font-size:24px;margin:0 0 12px}
.cards{display:grid;gap:10px;grid-template-columns:1fr}
.card{background:var(--amber-surface);border-radius:var(--amber-radius);padding:12px 14px}
.card h2{font-size:17px;margin:0 0 8px;color:var(--amber-accent-text)}
.row{display:flex;gap:10px;padding:4px 0;border-top:1px solid var(--amber-separator)}
.row .k{flex:0 0 84px;color:var(--amber-text-secondary);font-size:13px;padding-top:2px}
.row .v{flex:1;min-width:0;overflow-wrap:anywhere}
table{display:none;width:100%;border-collapse:collapse}
td,th{padding:10px 12px;border-bottom:1px solid var(--amber-separator);text-align:left;vertical-align:top}
th{color:var(--amber-text-secondary);font-weight:600;font-size:14px}
@media (min-width:900px){.cards{display:none}table{display:table}}
</style></head><body><div class="wrap"><h1 id="t"></h1><div class="cards" id="cards"></div><table id="grid"></table></div><script>
const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
amber.onChange((note)=>{t.textContent=note.title;const tb=note.tables[0];if(!tb)return;
grid.innerHTML="<tr>"+tb.columns.map((c)=>"<th>"+esc(c.name)+"</th>").join("")+"</tr>"+tb.rows.map((r)=>"<tr>"+r.map((c)=>"<td>"+esc(c)+"</td>").join("")+"</tr>").join("");
cards.innerHTML=tb.rows.map((r)=>"<div class='card'><h2>"+esc(r[0])+"</h2>"+r.slice(1).map((c,i)=>c?"<div class='row'><div class='k'>"+esc(tb.columns[i+1].name)+"</div><div class='v'>"+esc(c)+"</div></div>":"").join("")+"</div>").join("")});
</script></body></html>
