<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:16px var(--amber-gutter) 32px}
h1{font-family:var(--amber-font-rounded);font-size:26px;margin:0 0 12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--amber-text-secondary);margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.card{background:var(--amber-surface);border-radius:var(--amber-radius);padding:14px}
.big{font-family:var(--amber-font-rounded);font-size:26px;font-weight:700;color:var(--amber-accent-text)}
.lbl{font-size:12px;color:var(--amber-text-secondary)}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
svg{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--amber-separator)}
th{color:var(--amber-text-secondary);font-weight:500}
.scroll{max-height:360px;overflow:auto}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
input{background:var(--amber-fill);color:var(--amber-text);border:0;border-radius:var(--amber-radius-small);padding:9px;font:inherit;min-width:0}
button{background:var(--amber-accent);color:var(--amber-on-accent);border:0;border-radius:var(--amber-radius-small);padding:10px;font:inherit;font-weight:600;grid-column:1/-1}
.err{color:var(--amber-danger);font-size:13px;grid-column:1/-1}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}form{grid-template-columns:repeat(4,1fr) auto}button{grid-column:auto}}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}.big{font-size:34px}}
</style></head><body><div class="wrap">
<h1>Running</h1>
<div class="stats" id="stats"></div>
<div class="grid">
<div class="card"><h2>Weekly distance (km)</h2><div id="weekly"></div></div>
<div class="card"><h2>Pace (min/km) per run</h2><div id="pace"></div></div>
<div class="card"><h2>Average heart rate</h2><div id="hr"></div></div>
<div class="card"><h2>Runs</h2><div class="scroll"><table><thead><tr><th>Date</th><th>km</th><th>Min</th><th>Pace</th><th>HR</th></tr></thead><tbody id="rows"></tbody></table></div>
<form id="f"><input name="d" type="date" required><input name="k" placeholder="km" inputmode="decimal" required><input name="m" placeholder="min" inputmode="decimal" required><input name="h" placeholder="HR" inputmode="numeric"><button>Add run</button><div class="err" id="err"></div></form></div>
</div></div>
<script>
function line(vals,labels,fmt){var W=480,H=180,p=28,mn=Math.min.apply(0,vals),mx=Math.max.apply(0,vals);if(mx==mn){mx+=1;mn-=1}var pad=(mx-mn)*.15;mn-=pad;mx+=pad;
var pts=vals.map(function(v,i){return[p+i*(W-2*p)/Math.max(1,vals.length-1),H-p-(v-mn)/(mx-mn)*(H-2*p)]});
var s='<svg viewBox="0 0 '+W+' '+H+'"><line x1="'+p+'" x2="'+(W-p)+'" y1="'+(H-p)+'" y2="'+(H-p)+'" stroke="var(--amber-separator)"/>';
s+='<polyline fill="none" stroke="var(--amber-accent)" stroke-width="2.5" points="'+pts.map(function(q){return q.join(',')}).join(' ')+'"/>';
pts.forEach(function(q){s+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="2.5" fill="var(--amber-accent)"/>'});
s+='<text x="'+p+'" y="12" font-size="11" fill="var(--amber-text-secondary)">'+fmt(Math.max.apply(0,vals))+'</text><text x="'+p+'" y="'+(H-10)+'" font-size="11" fill="var(--amber-text-secondary)">'+labels[0]+'</text><text x="'+(W-p)+'" y="'+(H-10)+'" text-anchor="end" font-size="11" fill="var(--amber-text-secondary)">'+labels[labels.length-1]+'</text>';
return s+'</svg>'}
function mon(d){var t=new Date(d+'T00:00:00');var x=(t.getDay()+6)%7;t.setDate(t.getDate()-x);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function pf(p){var m=Math.floor(p);var s=Math.round((p-m)*60);if(s==60){m++;s=0}return m+':'+String(s).padStart(2,'0')}
amber.onChange(function(n){
var t=n.tables[0];if(!t)return;
var runs=t.rows.map(function(r){return{d:r[0],k:parseFloat(r[1]),m:parseFloat(r[2]),h:parseFloat(r[3])}}).filter(function(r){return r.d&&r.k>0});
var idx=t.rows.map(function(r,i){return i});
var sorted=runs.slice().sort(function(a,b){return a.d<b.d?-1:1});
var tk=0,tm=0,hs=0,hn=0;sorted.forEach(function(r){tk+=r.k;tm+=r.m;if(r.h){hs+=r.h;hn++}});
document.getElementById('stats').innerHTML=[[sorted.length,'runs'],[tk.toFixed(1)+' km','total distance'],[tk?pf(tm/tk)+'/km':'-','average pace'],[hn?Math.round(hs/hn)+' bpm':'-','average HR']].map(function(x){return'<div class="card"><div class="big">'+x[0]+'</div><div class="lbl">'+x[1]+'</div></div>'}).join('');
var wk={},order=[];sorted.forEach(function(r){var w=mon(r.d);if(!(w in wk)){wk[w]=0;order.push(w)}wk[w]+=r.k});
var mx=Math.max.apply(0,order.map(function(w){return wk[w]}));var W=480,H=180,p=28,bw=(W-2*p)/order.length;
var s='<svg viewBox="0 0 '+W+' '+H+'"><line x1="'+p+'" x2="'+(W-p)+'" y1="'+(H-p)+'" y2="'+(H-p)+'" stroke="var(--amber-separator)"/>';
order.forEach(function(w,i){var h=wk[w]/mx*(H-2*p-10);s+='<rect x="'+(p+i*bw+bw*.15)+'" y="'+(H-p-h)+'" width="'+bw*.7+'" height="'+h+'" rx="3" fill="var(--amber-accent)"/><text x="'+(p+i*bw+bw/2)+'" y="'+(H-p-h-3)+'" text-anchor="middle" font-size="9" fill="var(--amber-text-secondary)">'+wk[w].toFixed(0)+'</text>'});
s+='<text x="'+p+'" y="'+(H-10)+'" font-size="11" fill="var(--amber-text-secondary)">wk of '+order[0]+'</text><text x="'+(W-p)+'" y="'+(H-10)+'" text-anchor="end" font-size="11" fill="var(--amber-text-secondary)">'+order[order.length-1]+'</text></svg>';
document.getElementById('weekly').innerHTML=order.length?s:'';
var lb=sorted.map(function(r){return r.d.slice(5)});
document.getElementById('pace').innerHTML=sorted.length?line(sorted.map(function(r){return r.m/r.k}),lb,pf):'';
var hr=sorted.filter(function(r){return r.h});
document.getElementById('hr').innerHTML=hr.length?line(hr.map(function(r){return r.h}),hr.map(function(r){return r.d.slice(5)}),function(v){return Math.round(v)+' bpm'}):'';
document.getElementById('rows').innerHTML=sorted.slice().reverse().map(function(r){return'<tr><td>'+r.d+'</td><td>'+r.k.toFixed(1)+'</td><td>'+r.m+'</td><td>'+pf(r.m/r.k)+'</td><td>'+(r.h||'')+'</td></tr>'}).join('');
});
document.getElementById('f').onsubmit=function(e){e.preventDefault();var f=e.target;
amber.update({op:'append_row',table:0,values:{'Date':f.d.value,'Distance (km)':f.k.value,'Moving Time (min)':f.m.value,'Avg HR':f.h.value}}).then(function(r){document.getElementById('err').textContent=r.ok?'':r.error;if(r.ok)f.reset()})};
</script></body></html>
