<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px 0 32px}
.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:0 var(--amber-gutter)}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--amber-text-secondary);font-size:14px;margin-bottom:16px}
.cards{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:600px){.cards{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.cards{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--amber-surface);border-radius:var(--amber-radius);padding:14px;display:flex;align-items:center;gap:12px}
.chk{width:48px;height:48px;border-radius:50%;border:2px solid var(--amber-separator);background:var(--amber-fill);color:var(--amber-on-accent);font-size:24px;cursor:pointer;flex:none;padding:0}
.chk.on{background:var(--amber-accent);border-color:var(--amber-accent)}
.name{font-weight:600}
.streak{font-size:13px;color:var(--amber-text-secondary)}
.streak b{color:var(--amber-accent-text);font-size:15px}
h2{font-size:16px;margin:24px 0 8px}
.scroll{overflow-x:auto;background:var(--amber-surface);border-radius:var(--amber-radius);padding:10px}
table{border-collapse:separate;border-spacing:4px;margin:0 auto}
th{font-weight:500;font-size:11px;color:var(--amber-text-secondary);text-align:center}
th.h{text-align:left;font-size:13px;color:var(--amber-text);white-space:nowrap;padding-right:8px}
td button{width:24px;height:24px;border-radius:6px;border:0;background:var(--amber-fill);cursor:pointer;padding:0}
td button.on{background:var(--amber-accent)}
td button.today{outline:2px solid var(--amber-accent-text)}
.err{color:var(--amber-danger);font-size:13px}
</style></head><body><div class="wrap">
<h1>Habits</h1><div class="sub" id="sub"></div>
<div class="cards" id="cards"></div>
<h2>Last 14 days</h2><div class="scroll"><table id="grid"></table></div>
<div class="err" id="err"></div>
</div>
<script>
var T=0;
function addDays(s,n){var d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function render(note){
  var t=note.tables[T];if(!t)return;
  var cols=t.columns.map(function(c){return c.name});
  var habits=cols.slice(1);
  var map={};
  t.rows.forEach(function(r,i){map[String(r[0]).trim()]={i:i,r:r}});
  function done(d,h){var e=map[d];if(!e)return false;return /^(yes|true|y|x|✓|1)$/i.test(String(e.r[cols.indexOf(h)]||"").trim())}
  var today=note.today;
  function streaks(h){
    var cur=0,d=done(today,h)?today:addDays(today,-1);
    while(done(d,h)){cur++;d=addDays(d,-1)}
    var dates=Object.keys(map).sort(),best=0,run=0,prev=null;
    dates.forEach(function(x){
      if(done(x,h)){run=(prev&&addDays(prev,1)===x)?run+1:1;prev=x;if(run>best)best=run}
      else{run=0;prev=null}
    });
    return {cur:cur,best:Math.max(best,cur)};
  }
  var nDone=habits.filter(function(h){return done(today,h)}).length;
  document.getElementById("sub").textContent=nDone+" of "+habits.length+" done today";
  var c=document.getElementById("cards");c.innerHTML="";
  habits.forEach(function(h){
    var s=streaks(h),on=done(today,h);
    var el=document.createElement("div");el.className="card";
    el.innerHTML='<button class="chk'+(on?' on':'')+'">'+(on?'✓':'')+'</button><div><div class="name"></div><div class="streak"><b>'+s.cur+'</b> day streak · best '+s.best+'</div></div>';
    el.querySelector(".name").textContent=h;
    el.querySelector("button").onclick=function(){toggle(today,h)};
    c.appendChild(el);
  });
  var g=document.getElementById("grid");g.innerHTML="";
  var days=[];for(var k=13;k>=0;k--)days.push(addDays(today,-k));
  var hr=document.createElement("tr");hr.appendChild(document.createElement("th"));
  days.forEach(function(d){var th=document.createElement("th");th.textContent=parseInt(d.slice(8),10);hr.appendChild(th)});
  g.appendChild(hr);
  habits.forEach(function(h){
    var tr=document.createElement("tr");var th=document.createElement("th");th.className="h";th.textContent=h;tr.appendChild(th);
    days.forEach(function(d){
      var td=document.createElement("td"),b=document.createElement("button");
      b.className=(done(d,h)?"on":"")+(d===today?" today":"");
      b.title=d;b.onclick=function(){toggle(d,h)};
      td.appendChild(b);tr.appendChild(td);
    });
    g.appendChild(tr);
  });
  window._s={map:map,cols:cols,done:done};
}
function toggle(d,h){
  var s=window._s,e=s.map[d],val=s.done(d,h)?"No":"Yes",p;
  if(e){p=amber.update({op:"set_cell",table:T,row:e.i,col:h,value:val})}
  else{
    var v={};s.cols.forEach(function(c,i){v[c]=i===0?d:"No"});v[h]="Yes";
    p=amber.update({op:"append_row",table:T,values:v});
  }
  p.then(function(r){document.getElementById("err").textContent=r.ok?"":(r.error||"Could not save")});
}
amber.onChange(render);
</script></body></html>
