<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Household expenses</title>
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 8px var(--amber-gutter) 60px; }
  h1 { font-size: 22px; font-weight: 700; margin: 6px 0 0; color: var(--amber-text-secondary); }
  .total { font-size: 52px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin: 4px 0 0; }
  .sub { color: var(--amber-text-secondary); font-size: 15px; margin-bottom: 20px; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 0 4px 8px; }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); margin-bottom: 20px; overflow: hidden; }
  .months { display: flex; align-items: flex-end; gap: 10px; height: 170px; padding: 16px 16px 12px; }
  .m { flex: 1; min-width: 0; max-width: 120px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; cursor: pointer; background: none; border: 0; padding: 0; color: var(--amber-text); font: inherit; }
  .m .v { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--amber-text-secondary); }
  .m .b { width: 100%; border-radius: 6px 6px 3px 3px; background: var(--amber-fill); min-height: 4px; transition: height .4s; }
  .m.sel .b { background: var(--amber-accent); }
  .m .n { font-size: 13px; font-weight: 600; }
  .grp-h { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px 6px; font-weight: 700; background: var(--amber-accent-soft); }
  .item { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-top: .5px solid var(--amber-separator); }
  .grow { flex: 1; min-width: 0; }
  .amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .muted { color: var(--amber-text-secondary); font-size: 13px; }
  form { display: grid; grid-template-columns: 1.4fr 1fr .9fr auto; gap: 8px; padding: 12px; }
  input { font: inherit; font-size: 16px; padding: 9px 10px; border-radius: var(--amber-radius-small); border: 0; background: var(--amber-fill); color: var(--amber-text); min-width: 0; }
  button.add { font: inherit; font-weight: 600; border: 0; border-radius: var(--amber-radius-small); padding: 0 14px; background: var(--amber-accent); color: var(--amber-on-accent); }
  .err { color: var(--amber-danger); font-size: 14px; padding: 0 16px 10px; }
  @media (max-width: 599px) { form { grid-template-columns: 1fr 1fr; } .total { font-size: 44px; } }
  @media (min-width: 900px) {
    .layout { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); column-gap: 28px; align-items: start; }
    .total { font-size: 72px; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const kr = (n) => n.toLocaleString("sv-SE", { maximumFractionDigits: 0 }) + " kr";
  const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const longName = (k) => { const [y, m] = k.split("-"); return ["January","February","March","April","May","June","July","August","September","October","November","December"][+m - 1] + " " + y; };
  let selected = null, error = "";

  function render(note) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => t.columns.some((c) => /amt|amount|cost|kr|price/i.test(c.name)));
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card" style="padding:24px">Add a table with an amount column.</div>`; return; }
    const col = (re) => t.columns.findIndex((c) => re.test(c.name));
    const a = col(/amt|amount|cost|kr|price/i), cat = col(/categ/i), item = col(/item|what|description/i), date = col(/^date$/i);
    const rows = t.rows.map((r) => ({ r, n: parseFloat(String(r[a]).replace(/\s/g, "").replace(",", ".")) || 0, m: date >= 0 ? String(r[date]).slice(0, 7) : "" }));
    const byMonth = new Map();
    for (const x of rows) byMonth.set(x.m, (byMonth.get(x.m) || 0) + x.n);
    const months = [...byMonth.keys()].sort();
    const thisMonth = note.today.slice(0, 7);
    if (!selected || !byMonth.has(selected)) selected = byMonth.has(thisMonth) ? thisMonth : months[months.length - 1];
    const max = Math.max(1, ...byMonth.values());
    const sel = rows.filter((x) => x.m === selected);
    const total = sel.reduce((s, x) => s + x.n, 0);
    const groups = new Map();
    for (const x of sel) { const k = (cat >= 0 && x.r[cat]) || "Other"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(x); }
    const gl = [...groups].map(([k, v]) => [k, v, v.reduce((s, x) => s + x.n, 0)]).sort((p, q) => q[2] - p[2]);
    const cats = [...new Set(rows.map((x) => (cat >= 0 && x.r[cat]) || "Other"))];

    app.innerHTML = `
      <h1>${esc(note.title)} · ${esc(selected ? longName(selected) : "")}</h1>
      <div class="total">${kr(total)}</div>
      <div class="sub">${sel.length} entries this month</div>
      <div class="layout"><section>
        <div class="label">By month</div>
        <div class="card"><div class="months">${months.map((k) => `<button class="m ${k === selected ? "sel" : ""}" data-m="${k}"><div class="v">${kr(byMonth.get(k))}</div><div class="b" style="height:${Math.max(3, 100 * byMonth.get(k) / max * 0.7).toFixed(1)}%"></div><div class="n">${MN[+k.slice(5) - 1]}</div></button>`).join("")}</div></div>
        <div class="label">Add an expense</div>
        <div class="card">
          <form id="add">
            <input name="item" placeholder="What" required>
            <input name="cat" list="cats" placeholder="Category">
            <datalist id="cats">${cats.map((c) => `<option value="${esc(c)}">`).join("")}</datalist>
            <input name="amount" placeholder="kr" inputmode="decimal" required>
            <button class="add">Add</button>
          </form>
          ${error ? `<div class="err">${esc(error)}</div>` : ""}
        </div>
      </section><section>
        <div class="label">By category</div>
        <div class="card">${gl.length ? gl.map(([k, v, sum]) => `<div class="grp-h"><span>${esc(k)}</span><span class="amt">${kr(sum)}</span></div>${v.map((x) => `<div class="item"><div class="grow">${esc(item >= 0 ? x.r[item] : "")}<div class="muted">${esc(date >= 0 ? x.r[date] : "")}</div></div><div class="amt">${kr(x.n)}</div></div>`).join("")}`).join("") : `<div class="item muted">No expenses this month.</div>`}</div>
      </section></div>`;
    app.querySelectorAll(".m").forEach((b) => b.addEventListener("click", () => { selected = b.dataset.m; render(amber.note); }));
    document.getElementById("add").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const values = { [t.columns[a].name]: String(f.get("amount")).trim() };
      if (item >= 0) values[t.columns[item].name] = String(f.get("item")).trim();
      if (cat >= 0) values[t.columns[cat].name] = String(f.get("cat")).trim() || "Other";
      if (date >= 0) { values[t.columns[date].name] = amber.note.today; selected = amber.note.today.slice(0, 7); }
      const r = await amber.update({ op: "append_row", table: t.index, values });
      error = r.ok ? "" : r.error;
      if (!r.ok) render(amber.note);
    });
  }
  amber.onChange(render);
</script>
</body>
</html>
