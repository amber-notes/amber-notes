<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--amber-font)}
.w{max-width:560px;margin:0 auto;padding:16px var(--amber-gutter) 32px}
.top{display:flex;justify-content:space-between;color:var(--amber-text-secondary);font-size:14px;margin-bottom:8px}
.bar{height:6px;background:var(--amber-fill);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--amber-accent);transition:width .3s}
.card{width:100%;min-height:240px;border:1px solid var(--amber-separator);background:var(--amber-surface);color:var(--amber-text);border-radius:var(--amber-radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;cursor:pointer;font:inherit;text-align:center}
.card.back{background:var(--amber-accent-soft)}
.big{font-family:var(--amber-font-rounded);font-size:36px;font-weight:600;word-break:break-word}
.hint{font-size:13px;color:var(--amber-text-secondary)}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--amber-fill);color:var(--amber-text-secondary)}
.tag.k{background:var(--amber-accent);color:var(--amber-on-accent)}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;padding:14px;border-radius:var(--amber-radius-small);border:0;font:inherit;font-size:16px;font-weight:600;background:var(--amber-fill);color:var(--amber-text);cursor:pointer}
.row button.p{background:var(--amber-accent);color:var(--amber-on-accent)}
.nav{display:flex;justify-content:space-between;margin-top:12px}
.nav button{background:none;border:0;color:var(--amber-accent-text);font:inherit;padding:8px;cursor:pointer}
.done{text-align:center;color:var(--amber-accent-text);margin-top:12px;font-weight:600}
</style></head><body><div class="w" id="app"></div><script>
var note=null,idx=0,flip=false;
function cols(t){var n=t.columns.map(function(c){return c.name.toLowerCase()});return{s:0,e:1,k:n.indexOf('known')}}
function build(){var t=note.tables[0],c=cols(t),u=[],k=[];
t.rows.forEach(function(r,i){var o={i:i,s:r[c.s],e:r[c.e],k:c.k>=0&&/^(yes|y|true|✓|x)$/i.test((r[c.k]||'').trim())};(o.k?k:u).push(o)});
return{list:u.concat(k),u:u.length,c:c}}
function set(o,v,c){return amber.update({op:'set_cell',table:0,row:o.i,col:c.k,value:v})}
function render(){if(!note||!note.tables.length)return;var d=build(),n=d.list.length,app=document.getElementById('app');
if(!n){app.innerHTML='<p class="hint">No cards yet.</p>';return}
if(d.c.k<0){app.innerHTML='<p class="hint">Add a “Known” column to the table.</p>';return}
idx=((idx%n)+n)%n;var o=d.list[idx],known=n-d.u;
app.innerHTML='<div class="top"><span>'+(d.u?d.u+' left to learn':'All known 🎉')+'</span><span>'+known+'/'+n+' known</span></div><div class="bar"><i style="width:'+(known/n*100)+'%"></i></div>'+
'<button class="card'+(flip?' back':'')+'" id="c"><span class="tag'+(o.k?' k':'')+'">'+(o.k?'Known':'Learning')+'</span><div class="big"></div><div class="hint">'+(flip?'English':'Tap to flip')+'</div></button>'+
'<div class="row"><button id="l">Still learning</button><button class="p" id="g">I know it</button></div>'+
'<div class="nav"><button id="p">← Prev</button><button id="r">Reset all</button><button id="x">Next →</button></div>';
app.querySelector('.big').textContent=flip?o.e:o.s;
document.getElementById('c').onclick=function(){flip=!flip;render()};
document.getElementById('x').onclick=function(){idx++;flip=false;render()};
document.getElementById('p').onclick=function(){idx--;flip=false;render()};
document.getElementById('l').onclick=function(){flip=false;if(o.k){set(o,'',d.c).then(function(){idx=d.u+0;})}else{idx++;render()}};
document.getElementById('g').onclick=function(){flip=false;if(o.k){idx++;render()}else set(o,'Yes',d.c)};
document.getElementById('r').onclick=function(){if(!confirm('Mark all cards as not known?'))return;var p=Promise.resolve();d.list.forEach(function(x){if(x.k)p=p.then(function(){return set(x,'',d.c)})});idx=0;flip=false}
}
amber.onChange(function(x){note=x;render()});
</script></body></html>
