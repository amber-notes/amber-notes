<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:16px var(--amber-gutter) 32px}
h1{font-family:var(--amber-font-rounded);margin:0 0 4px;font-size:28px}
.sub{color:var(--amber-text-secondary);margin-bottom:16px}
.card{background:var(--amber-surface);border-radius:var(--amber-radius);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--amber-text-secondary)}
.count{background:var(--amber-accent-soft);text-align:center}
.count .n{font-family:var(--amber-font-rounded);font-size:56px;font-weight:700;color:var(--amber-accent-text);line-height:1}
.count .l{color:var(--amber-text-secondary);margin-top:4px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}.count .n{font-size:80px}}
.row{padding:8px 0;border-top:1px solid var(--amber-separator)}
.row:first-of-type{border-top:0}
.k{font-weight:600}.s{color:var(--amber-text-secondary);font-size:14px}
label.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--amber-separator);cursor:pointer}
label.item:first-of-type{border-top:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--amber-accent);margin:0;flex:none}
.done span{text-decoration:line-through;color:var(--amber-text-secondary)}
.prog{color:var(--amber-text-secondary);font-size:13px;float:right;text-transform:none;letter-spacing:0}
</style></head><body><div class="wrap">
<h1 id="t"></h1><div class="sub" id="sub"></div>
<div class="card count"><div class="n" id="n"></div><div class="l" id="l"></div></div>
<div class="grid">
<div class="card"><h2>Flights</h2><div id="fl"></div></div>
<div class="card"><h2>Hotel</h2><div id="ho"></div></div>
</div>
<div class="grid">
<div class="card"><h2>Ideas <span class="prog" id="p1"></span></h2><div id="ideas"></div></div>
<div class="card"><h2>To do before <span class="prog" id="p2"></span></h2><div id="todo"></div></div>
</div>
<div class="card" id="bud"><h2>Budget</h2><div id="bv"></div></div>
</div><script>
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(note){
 document.getElementById('t').textContent=note.title;
 const lines=note.markdown.split('\n');
 const get=k=>{const l=lines.find(x=>x.toLowerCase().startsWith(k));return l?l.slice(l.indexOf(':')+1).trim():''};
 const fl=get('flights'),ho=get('hotel'),bu=get('budget');
 // countdown
 const m=fl.match(/out\s+\w+\s+(\d+)\s+(\w+)/i);
 const mons=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
 if(m){const y=+note.today.slice(0,4);const d=new Date(Date.UTC(y,mons.indexOf(m[2].toLowerCase().slice(0,3)),+m[1]));
  const t=note.today.split('-');const td=new Date(Date.UTC(+t[0],+t[1]-1,+t[2]));
  const days=Math.round((d-td)/864e5);
  document.getElementById('n').textContent=days>0?days:(days===0?'Today!':'✈︎');
  document.getElementById('l').textContent=days>0?(days===1?'day until Porto':'days until Porto'):(days===0?'Departure day':'Trip started');
  document.getElementById('sub').textContent='Fri 16 – Sun 18 Oct';
 }
 // flights
 const parts=fl.split(/,\s*(?=back)/i);
 document.getElementById('fl').innerHTML=parts.map(p=>{const mm=p.match(/^(.*?)(\d\d:\d\d)(.*)$/);
  const lab=/^back/i.test(p)?'Return':'Outbound';
  const fn=(p.match(/\(([^)]+)\)/)||[])[1]||'';
  return '<div class="row"><div class="k">'+lab+' · '+esc(p.replace(/^(out|back)\s*/i,'').replace(/\([^)]*\)/,'').trim())+'</div><div class="s">'+esc(fn)+'</div></div>'}).join('');
 // hotel
 const hp=ho.split(',').map(s=>s.trim());
 document.getElementById('ho').innerHTML=hp.length?'<div class="row"><div class="k">'+esc(hp[0]||'')+'</div></div>'+hp.slice(1).map(x=>'<div class="row s">'+esc(x)+'</div>').join(''):'';
 document.getElementById('bv').innerHTML=bu?'<div class="k">'+esc(bu.replace(/^~\s*/,'≈ '))+'</div>':'';
 // checklists by section
 const ci=lines.findIndex(l=>/^ideas/i.test(l)),ti=lines.findIndex(l=>/^to do/i.test(l));
 const A=[],B=[];
 note.checklists.forEach(c=>{(ti>=0&&c.line-1>=ti?B:A).push(c)});
 const draw=(id,arr,pid)=>{
  const el=document.getElementById(id);
  el.innerHTML=arr.map(c=>'<label class="item'+(c.checked?' done':'')+'"><input type="checkbox" data-l="'+c.line+'"'+(c.checked?' checked':'')+'><span>'+esc(c.text)+'</span></label>').join('');
  document.getElementById(pid).textContent=arr.filter(c=>c.checked).length+'/'+arr.length;
  el.querySelectorAll('input').forEach(i=>i.onchange=()=>amber.update({op:'toggle_checklist',line:+i.dataset.l}));
 };
 draw('ideas',A,'p1');draw('todo',B,'p2');
}
amber.onChange(render);
</script></body></html>
