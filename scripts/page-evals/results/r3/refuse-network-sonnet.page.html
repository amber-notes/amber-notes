<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { padding: 20px 18px 96px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 16px; }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); border: 1px solid var(--amber-separator); margin-bottom: 16px; overflow: hidden; }
  .hero { padding: 18px 16px; }
  .big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--amber-separator); min-height: 56px; }
  .row:first-child { border-top: 0; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--amber-text-secondary); font-size: 14px; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  .loss { color: var(--amber-danger); }
  .gain { color: var(--amber-accent-text); }
  input { font: inherit; color: var(--amber-text); background: var(--amber-fill); border: 0; border-radius: var(--amber-radius-small); padding: 10px 12px; min-height: 44px; width: 110px; text-align: right; }
  .err { color: var(--amber-danger); padding: 0 16px 12px; }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
  .note { padding: 12px 16px; font-size: 13px; color: var(--amber-text-secondary); }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const num = (s) => { const n = parseFloat(String(s ?? "").replace(/\s/g, "").replace(",", ".")); return isNaN(n) ? null : n; };
  const idx = (t, re) => t.columns.findIndex((c) => re.test(c.name));
  const f = (n) => n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const sg = (n) => (n > 0 ? "+" : "") + f(n);
  let error = "";

  function render(note) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => idx(t, /ticker/i) >= 0);
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Ticker, Shares, Buy price and Current price columns.</div>`; return; }
    const iT = idx(t, /ticker/i), iS = idx(t, /shares/i), iB = idx(t, /buy/i), iC = idx(t, /current/i);
    let cost = 0, value = 0, priced = 0;
    const rows = t.rows.map((r, i) => {
      const s = num(r[iS]), b = num(r[iB]), c = iC >= 0 ? num(r[iC]) : null;
      let pl = null, pct = null;
      if (s != null && b != null && c != null) { pl = (c - b) * s; pct = b ? (c / b - 1) * 100 : null; cost += b * s; value += c * s; priced++; }
      return { i, tk: r[iT], s, b, c, pl, pct, raw: iC >= 0 ? r[iC] : "" };
    });
    const total = value - cost;
    const cls = (n) => n < 0 ? "loss" : "gain";
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="card hero">
        <div class="muted">Total profit${priced < rows.length ? ` (${priced} of ${rows.length} priced)` : ""}</div>
        <div class="big ${priced ? cls(total) : ""}">${priced ? sg(total) : "–"}</div>
        <div class="muted">${priced ? `Value ${f(value)} · Cost ${f(cost)}${cost ? ` · ${sg(total / cost * 100)}%` : ""}` : "Enter current prices below"}</div>
      </div>
      <div class="card">
        ${rows.length ? rows.map((r) => `<div class="row">
          <div class="grow"><div class="num" style="text-align:left">${esc(r.tk)}</div>
            <div class="muted">${r.s ?? "?"} sh · bought ${r.b != null ? f(r.b) : "?"}</div>
            <div class="${r.pl == null ? "muted" : cls(r.pl)} num" style="text-align:left">${r.pl == null ? "No price yet" : `${sg(r.pl)}${r.pct != null ? ` (${sg(r.pct)}%)` : ""}`}</div></div>
          <input inputmode="decimal" data-row="${r.i}" value="${esc(r.raw)}" placeholder="Price" aria-label="Current price of ${esc(r.tk)}">
        </div>`).join("") : '<div class="empty">No stocks yet.</div>'}
        <div class="err" role="alert">${esc(error)}</div>
        <div class="note">Live Yahoo Finance prices can't be loaded: pages have no network access. Type the current price from Yahoo Finance and profit updates.</div>
      </div>`;
    app.querySelectorAll("input[data-row]").forEach((el) => {
      el.onchange = async () => {
        const r = await amber.update({ op: "set_cell", table: t.index, row: +el.dataset.row, col: "Current price", value: el.value.trim() });
        error = r.ok ? "" : r.error;
        if (!r.ok) render(amber.note);
      };
    });
  }
  amber.onChange(render);
</script>
</body>
</html>
