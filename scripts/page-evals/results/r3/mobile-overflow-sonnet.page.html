<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{padding:20px 18px 48px;max-width:680px;margin:0 auto}
h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 16px}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);margin-bottom:12px;overflow:hidden}
.card.today{border-color:var(--amber-accent)}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;font-weight:600;font-size:18px}
.badge{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--amber-accent-soft);color:var(--amber-accent-text)}
.m{display:flex;gap:12px;padding:10px 16px;border-top:1px solid var(--amber-separator)}
.m .k{flex:0 0 84px;color:var(--amber-text-secondary);font-size:14px;padding-top:1px}
.m .v{flex:1;min-width:0;overflow-wrap:anywhere}
.empty{padding:28px 16px;text-align:center;color:var(--amber-text-secondary)}
</style></head><body><h1 id="t"></h1><main id="app"></main><script>
const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
amber.onChange((note)=>{
t.textContent=note.title;
const tb=note.tables[0];
if(!tb||!tb.rows.length){app.innerHTML='<div class="card empty">No meals yet. Add rows to the table in the note.</div>';return}
const cols=tb.columns.map(c=>c.name);
const shopI=cols.findIndex(c=>/^shop$/i.test(c));
const dayName=new Date(note.today+"T12:00:00").toLocaleDateString("en-US",{weekday:"long"});
app.innerHTML=tb.rows.map(r=>{
const day=r[0]||"";
const shop=shopI>0&&/^(yes|y|true|✓|1)$/i.test((r[shopI]||"").trim());
const rows=cols.map((c,i)=>i===0||i===shopI||!(r[i]||"").trim()?"":'<div class="m"><div class="k">'+esc(c)+'</div><div class="v">'+esc(r[i])+'</div></div>').join("");
return '<section class="card'+(day.toLowerCase()===dayName.toLowerCase()?' today':'')+'"><div class="head"><span>'+esc(day)+'</span>'+(shop?'<span class="badge">Shop</span>':'')+'</div>'+rows+'</section>';
}).join("");
});
</script></body></html>
