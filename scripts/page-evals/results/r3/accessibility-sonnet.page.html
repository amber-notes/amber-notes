<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisbon trip packing</title>
<style>
  * { box-sizing: border-box; }
  body { padding: 20px 18px 80px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 6px; }
  h2 { font-size: 18px; margin: 0; padding: 14px 16px 8px; }
  .summary { color: var(--amber-text-secondary); margin: 0 0 16px; }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); border: 1px solid var(--amber-separator); margin-bottom: 16px; overflow: hidden; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid var(--amber-separator); }
  li label { display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 8px 16px; cursor: pointer; overflow-wrap: anywhere; }
  li input[type=checkbox] { width: 24px; height: 24px; flex: none; margin: 0; accent-color: var(--amber-accent); }
  li input:checked + span { color: var(--amber-text-secondary); text-decoration: line-through; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--amber-accent-text); outline-offset: 2px; }
  form { display: flex; flex-wrap: wrap; gap: 10px; padding: 8px 16px 16px; }
  form label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--amber-text); flex: 1 1 160px; }
  input[type=text], select { font: inherit; color: var(--amber-text); background: var(--amber-fill); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius-small); padding: 10px 12px; min-height: 44px; width: 100%; }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 20px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-accent); color: var(--amber-on-accent); align-self: flex-end; }
  .status { padding: 0 16px 14px; min-height: 1.4em; }
  .status.err { color: var(--amber-danger); }
  .empty { padding: 24px 16px; text-align: center; color: var(--amber-text-secondary); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1 id="title">Packing list</h1>
  <p class="summary" id="summary"></p>
  <div id="list"></div>
  <section class="card" aria-labelledby="addh">
    <h2 id="addh">Add an item</h2>
    <form id="add">
      <label for="v">Item name<input type="text" id="v" name="v" autocomplete="off" required></label>
      <label for="c">Section<select id="c" name="c"></select></label>
      <button type="submit">Add item</button>
    </form>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>
</main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const $ = (id) => document.getElementById(id);
  const DEFAULTS = ["Clothes", "Documents", "Tech", "Other"];
  let current = null;
  let message = "", isErr = false;

  function setStatus(m, err) { message = m; isErr = !!err; const s = $("status"); s.textContent = m; s.className = "status" + (err ? " err" : ""); }

  function extraTable(note) {
    return note.tables.find((t) => t.columns.some((c) => /^item$/i.test(c.name)) && t.columns.some((c) => /^packed$/i.test(c.name)));
  }

  function build(note) {
    const lines = note.markdown.split("\n");
    const headingFor = {};
    let h = "Other";
    lines.forEach((l, i) => { const m = /^#{1,6}\s+(.*)$/.exec(l); if (m && i > 0) h = m[1].trim(); headingFor[i + 1] = h; });
    const sections = new Map();
    const get = (n) => { if (!sections.has(n)) sections.set(n, []); return sections.get(n); };
    note.checklists.forEach((c) => get(headingFor[c.line] || "Other").push({ key: "l" + c.line, text: c.text, checked: c.checked, line: c.line }));
    const t = extraTable(note);
    if (t) {
      const ci = t.columns.findIndex((c) => /^item$/i.test(c.name));
      const cc = t.columns.findIndex((c) => /^category$/i.test(c.name));
      const pi = t.columns.findIndex((c) => /^packed$/i.test(c.name));
      t.rows.forEach((r, i) => {
        if (!String(r[ci]).trim()) return;
        const cat = cc >= 0 && r[cc] ? r[cc] : "Other";
        get(cat).push({ key: "t" + i, text: r[ci], checked: /^(yes|✓|x|done|1|true)$/i.test(String(r[pi]).trim()), row: i });
      });
    }
    return { sections, t };
  }

  function render(note) {
    current = note;
    const { sections, t } = build(note);
    $("title").textContent = note.title;
    const active = document.activeElement;
    const focusKey = active && active.dataset ? active.dataset.key : null;

    let total = 0, done = 0;
    sections.forEach((items) => items.forEach((it) => { total++; if (it.checked) done++; }));
    $("summary").textContent = total ? `${done} of ${total} items packed` : "";

    let html = "";
    let n = 0;
    sections.forEach((items, name) => {
      n++;
      const d = items.filter((i) => i.checked).length;
      html += `<section class="card" aria-labelledby="h${n}"><h2 id="h${n}">${esc(name)} <span class="sr">, ${d} of ${items.length} packed</span></h2><ul>` +
        items.map((it) => `<li><label><input type="checkbox" data-key="${it.key}" ${it.line ? `data-line="${it.line}"` : `data-row="${it.row}"`} ${it.checked ? "checked" : ""}><span>${esc(it.text)}</span></label></li>`).join("") +
        `</ul></section>`;
    });
    if (!total) html = `<div class="card empty">Nothing on the list yet. Use Add an item below.</div>`;
    $("list").innerHTML = html;

    const sel = $("c"), prev = sel.value;
    const names = [...new Set([...sections.keys(), ...DEFAULTS])].filter((x) => x !== "Added items");
    sel.innerHTML = names.map((x) => `<option>${esc(x)}</option>`).join("");
    if (names.includes(prev)) sel.value = prev;

    if (focusKey) { const el = document.querySelector(`[data-key="${focusKey}"]`); if (el) el.focus(); }
    $("add").querySelector("button").disabled = !t;
    if (!t && !message) setStatus("Adding items needs the Added items table in the note.", true);
  }

  $("list").addEventListener("change", async (e) => {
    const el = e.target;
    if (!el.matches("input[type=checkbox]")) return;
    const label = el.nextElementSibling.textContent;
    let r;
    if (el.dataset.line) r = await amber.update({ op: "toggle_checklist", line: +el.dataset.line });
    else r = await amber.update({ op: "set_cell", table: extraTable(current).index, row: +el.dataset.row, col: "Packed", value: el.checked ? "Yes" : "No" });
    if (r.ok) setStatus(`${label} ${el.checked ? "packed" : "not packed"}.`);
    else { setStatus(`Could not update ${label}: ${r.error}`, true); render(amber.note); }
  });

  $("add").addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = $("v").value.trim();
    if (!v) { setStatus("Type an item name first.", true); $("v").focus(); return; }
    const t = extraTable(current);
    if (!t) return;
    const r = await amber.update({ op: "append_row", table: t.index, values: { Item: v, Category: $("c").value, Packed: "No" } });
    if (r.ok) { setStatus(`Added ${v} to ${$("c").value}.`); $("v").value = ""; $("v").focus(); }
    else setStatus(`Could not add ${v}: ${r.error}`, true);
  });

  amber.onChange((note) => render(note));
</script>
</body>
</html>
