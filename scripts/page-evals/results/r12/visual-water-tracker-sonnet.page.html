<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-settings" content='{"settings":[{"key":"goal","label":"Daily goal (glasses)","type":"number","default":8,"help":"Used when the note has no “Goal: N” line."}]}'>
<style>
*{box-sizing:border-box}
main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 64px}
h1{font-size:1.75rem;letter-spacing:-.02em;margin:4px 0 16px}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--amber-text-secondary);margin:0 0 12px}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:16px;margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.grid{grid-template-columns:1fr 1.4fr}.grid .card{margin:0}}
.big{font-family:var(--amber-font-rounded);font-size:3.5rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:1.25rem;color:var(--amber-text-secondary);font-weight:600}
.msg{color:var(--amber-text-secondary);margin:6px 0 14px}
.glasses{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.glasses svg{width:34px;height:44px}
.g-out{fill:var(--amber-fill);stroke:var(--amber-text-secondary);stroke-width:2}
.g-in{fill:var(--amber-accent)}
.over .g-in{opacity:.55}
.btns{display:flex;gap:8px}
button{font:inherit;font-weight:600;min-height:44px;padding:0 18px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-text);color:var(--amber-bg)}
button.sec{background:var(--amber-fill);color:var(--amber-text)}
.err{color:var(--amber-danger);min-height:1.2em;margin-top:8px;font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--amber-fill);border-radius:var(--amber-radius-small);padding:10px}
.stat b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--amber-text-secondary)}
.chart{position:relative;height:200px;display:flex;align-items:flex-end;gap:4px;padding-top:18px;border-bottom:1px solid var(--amber-separator)}
.goal{position:absolute;left:0;right:0;border-top:2px dashed var(--amber-text-secondary);pointer-events:none}
.goal span{position:absolute;right:0;top:-1.3rem;font-size:.75rem;color:var(--amber-text-secondary);background:var(--amber-surface);padding:0 4px}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar{width:100%;border-radius:4px 4px 0 0;background:var(--amber-accent-soft);border:2px solid var(--amber-accent);border-bottom:0;min-height:2px}
.bar.hit{background:var(--amber-accent)}
.v{font-size:.75rem;font-variant-numeric:tabular-nums;margin-bottom:2px}
.days{display:flex;gap:4px;margin-top:4px}
.days div{flex:1;min-width:0;text-align:center;font-size:.75rem;color:var(--amber-text-secondary)}
.days .t{color:var(--amber-text);font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--amber-text-secondary);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;border:2px solid var(--amber-accent)}
.empty{text-align:center;color:var(--amber-text-secondary);padding:28px 8px}

</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
let error="";
const num=s=>{const n=parseFloat(String(s).replace(/\s/g,"").replace(",","."));return isNaN(n)?null:n};
function addDays(d,n){const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
const cup='<svg viewBox="0 0 34 44" aria-hidden="true"><defs><clipPath id="c"><path d="M5 3h24l-3 38H8z"/></clipPath></defs>';
function glass(full){
  return `<svg viewBox="0 0 34 44" aria-hidden="true">${full?'<path class="g-in" d="M6.2 14h21.6l-1.8 27H8z"/>':''}<path class="g-out" fill="none" d="M5 3h24l-3 38H8z"/></svg>`;
}
function render(note){
  const app=document.getElementById("app");
  const t=note.tables.find(t=>t.columns.some(c=>/^date$/i.test(c.name))&&t.columns.some(c=>/glass|water|cup/i.test(c.name)));
  if(!t){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Date and Glasses columns to see your water here.</div>`;return}
  const di=t.columns.findIndex(c=>/^date$/i.test(c.name)), gi=t.columns.findIndex(c=>/glass|water|cup/i.test(c.name));
  const m=note.markdown.match(/goal\D{0,10}(\d+(?:[.,]\d+)?)/i);
  const goal=(m&&num(m[1]))||num(amber.settings&&amber.settings.goal)||8;
  const map={};const idx={};
  t.rows.forEach((r,i)=>{const n=num(r[gi]);if(/^\d{4}-\d\d-\d\d$/.test(r[di])&&n!==null){map[r[di]]=(map[r[di]]||0)+n;idx[r[di]]=i}});
  const today=note.today, tv=map[today]||0;
  // streak
  let s=0,d=map[today]>=goal?today:addDays(today,-1);
  while((map[d]||0)>=goal){s++;d=addDays(d,-1)}
  const dates=Object.keys(map).sort();
  const last14=[];for(let i=13;i>=0;i--)last14.push(addDays(today,-i));
  const logged=last14.filter(x=>map[x]!==undefined);
  const hit=logged.filter(x=>map[x]>=goal).length;
  const avg=logged.length?logged.reduce((a,x)=>a+map[x],0)/logged.length:0;
  const count=Math.max(goal,tv);
  let gl="";for(let i=0;i<count;i++)gl+=glass(i<tv);
  const left=goal-tv;
  const msg=tv>=goal?(tv>goal?`Goal beaten by ${tv-goal}.`:"Goal reached. Nice work."):`${left} more glass${left===1?"":"es"} to go.`;
  const max=Math.max(goal,...last14.map(x=>map[x]||0));
  const top=max*1.1;
  const bars=last14.map(x=>{const v=map[x];const h=v?v/top*100:0;
    return `<div class="col" role="img" aria-label="${x}: ${v===undefined?"no entry":v+" glasses"}"><div class="v">${v===undefined?"":v}</div><div class="bar${v>=goal?" hit":""}" style="height:${h}%"></div></div>`}).join("");
  const lbl=last14.map(x=>`<div class="${x===today?"t":""}">${x.slice(8)}</div>`).join("");
  app.innerHTML=`<h1>${esc(note.title)}</h1>
  <div class="grid">
   <section class="card" aria-label="Today">
    <h2>Today</h2>
    <div class="big">${tv}<small> / ${goal}</small></div>
    <p class="msg">${msg}</p>
    <div class="glasses${tv>goal?" over":""}" role="img" aria-label="${tv} of ${goal} glasses">${gl}</div>
    <div class="btns"><button id="plus" aria-label="Add one glass">+ 1 glass</button><button id="minus" class="sec" aria-label="Remove one glass" ${tv?"":"disabled"}>− 1</button></div>
    <div class="err" role="alert">${esc(error)}</div>
    <div class="stats">
     <div class="stat"><b>${s}</b><span>day streak</span></div>
     <div class="stat"><b>${hit}/${logged.length}</b><span>goal days, last 14</span></div>
     <div class="stat"><b>${avg.toFixed(1)}</b><span>average a day</span></div>
    </div>
   </section>
   <section class="card" aria-label="Last 14 days">
    <h2>Last 14 days</h2>
    <div class="chart"><div class="goal" style="bottom:calc((100% - 18px)*${goal/top})"><span>goal ${goal}</span></div>${bars}</div>
    <div class="days">${lbl}</div>
    <div class="legend"><span><i style="background:var(--amber-accent)"></i>Goal met</span><span><i style="background:var(--amber-accent-soft)"></i>Below goal</span></div>
   </section>
  </div>`;
  const apply=async delta=>{
    const nv=Math.max(0,tv+delta);
    const r=today in idx
      ?await amber.update({op:"set_cell",table:t.index,row:idx[today],col:t.columns[gi].name,value:String(nv)})
      :await amber.update({op:"append_row",table:t.index,values:{[t.columns[di].name]:today,[t.columns[gi].name]:String(nv)}});
    error=r.ok?"":r.error;
    if(!r.ok)render(amber.note);
  };
  document.getElementById("plus").onclick=()=>apply(1);
  document.getElementById("minus").onclick=()=>apply(-1);
}
amber.onChange(render);
</script>
</body>
</html>
