<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
main{max-width:820px;margin:0 auto;padding:16px var(--amber-gutter) 64px}
h1{font-size:1.5rem;letter-spacing:-.02em;margin:4px 0 12px;font-family:var(--amber-font-rounded)}
.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--amber-text-secondary);font-variant-numeric:tabular-nums}
.chip b{color:var(--amber-text)}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:20px 16px;margin-bottom:12px}
.center{text-align:center}
.muted{color:var(--amber-text-secondary);font-size:.9rem}
button{font:inherit;font-weight:600;min-height:48px;padding:0 18px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-text);color:var(--amber-bg);cursor:pointer}
button.sec{background:var(--amber-fill);color:var(--amber-text)}
.big{width:100%;min-height:56px;font-size:1.1rem}
.bar{height:10px;border-radius:99px;background:var(--amber-fill);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:100%;background:var(--amber-accent);transition:none}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-variant-numeric:tabular-nums}
.score{font-size:1.4rem;font-weight:700}
.combo{font-weight:700;color:var(--amber-accent-text);min-width:3.5em;text-align:right}
.prompt{font-size:clamp(2rem,9vw,3rem);font-weight:700;text-align:center;margin:18px 0 4px;font-family:var(--amber-font-rounded);overflow-wrap:anywhere}
.dir{text-align:center;margin-bottom:16px}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:520px){.opts{grid-template-columns:1fr 1fr}}
.opt{background:var(--amber-fill);color:var(--amber-text);min-height:60px;font-size:1.05rem;text-align:left;display:flex;gap:10px;align-items:center;border:2px solid transparent;padding:8px 14px}
.opt kbd{font:inherit;font-size:.8rem;color:var(--amber-text-secondary);min-width:1.2em}
.opt.good{background:var(--amber-accent-soft);border-color:var(--amber-accent)}
.opt.bad{border-color:var(--amber-danger);text-decoration:line-through}
.fb{min-height:1.5em;text-align:center;font-weight:600;margin-top:12px}
.fb.bad{color:var(--amber-danger)}
.result{font-size:3rem;font-weight:800;font-family:var(--amber-font-rounded);margin:4px 0}
.stats{display:flex;justify-content:center;gap:20px;margin:10px 0 16px;font-variant-numeric:tabular-nums}
.stats div b{display:block;font-size:1.2rem}
.badge{display:inline-block;background:var(--amber-accent-soft);color:var(--amber-accent-text);border-radius:99px;padding:4px 12px;font-weight:700;font-size:.85rem}
ul.miss{list-style:none;padding:0;margin:8px 0 16px;text-align:left}
ul.miss li{padding:8px 0;border-top:1px solid var(--amber-separator);display:flex;justify-content:space-between;gap:12px}
.row2{display:flex;gap:8px}.row2 button{flex:1}
@media(min-width:900px){.prompt{font-size:3.5rem}.opt{min-height:72px;font-size:1.2rem}}
@media(prefers-reduced-motion:no-preference){.opt{transition:background .15s}}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<div class="top" id="top"></div>
<div id="stage"></div>
<p class="muted center" id="hint"></p>
</main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const ROUND=60, PENALTY=3;
let verbs=[], store={best:0,streak:0,last:"",plays:0,missed:{}}, today="";
let g=null; // game state
let raf=0, lastT=0;
const $=id=>document.getElementById(id);

function loadVerbs(note){
  const t=note.tables.find(t=>t.columns.length>=2)||null;
  verbs=t?t.rows.map(r=>({es:(r[0]||"").trim(),en:(r[1]||"").trim()})).filter(v=>v.es&&v.en):[];
}
function loadStore(d){
  const v=(d&&d.values)||{};
  store={best:v.best||0,streak:v.streak||0,last:v.last||"",plays:v.plays||0,missed:v.missed||{}};
}
function dayDiff(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5)}
function liveStreak(){ if(!store.last)return 0; const d=dayDiff(store.last,today); return d<=1?store.streak:0; }

function drawTop(){
  $("top").innerHTML=`<span class="chip">Best <b>${store.best}</b></span><span class="chip">Day streak <b>${liveStreak()}</b></span><span class="chip">Verbs <b>${verbs.length}</b></span>`;
}
function start(){
  if(verbs.length<2){return}
  g={t:ROUND,score:0,combo:0,maxCombo:0,right:0,total:0,q:null,locked:false,paused:false,over:false,missed:{},prev:""};
  next(); cancelAnimationFrame(raf); lastT=0; raf=requestAnimationFrame(tick);
}
function pick(){
  const pool=verbs.filter(v=>v.es!==g.prev);
  const list=pool.length?pool:verbs;
  const w=list.map(v=>1+2*(store.missed[v.es]||0)+3*(g.missed[v.es]||0));
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<list.length;i++){r-=w[i];if(r<=0)return list[i]}
  return list[list.length-1];
}
function next(){
  const v=pick(); g.prev=v.es;
  const toEn=Math.random()<.5;
  const key=toEn?"en":"es";
  const others=verbs.filter(x=>x.es!==v.es&&x[key]!==v[key]).sort(()=>Math.random()-.5).slice(0,3);
  const opts=[v,...others].sort(()=>Math.random()-.5);
  g.q={v,toEn,opts,key,answer:null};
  g.locked=false; draw();
}
function draw(){
  if(!g)return;
  const q=g.q;
  $("hint").textContent="Beat the clock: right answers build a combo, wrong ones cost "+PENALTY+" seconds. Keys 1–4 work too.";
  $("stage").innerHTML=`
   <div class="bar" role="progressbar" aria-label="Time left" aria-valuemin="0" aria-valuemax="${ROUND}" aria-valuenow="${Math.ceil(g.t)}"><i id="fill"></i></div>
   <div class="hud"><span class="score" id="sc">${g.score}</span><span class="muted" id="tm"></span><span class="combo" id="cb"></span></div>
   <div class="card">
     <div class="prompt">${esc(q.toEn?q.v.es:q.v.en)}</div>
     <div class="dir muted">${q.toEn?"Pick the English meaning":"Pick the Spanish verb"}</div>
     <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(o[q.key])}</span></button>`).join("")}</div>
     <div class="fb" id="fb" role="status"></div>
   </div>
   <div class="row2"><button class="sec" id="pause">${g.paused?"Resume":"Pause"}</button><button class="sec" id="quit">End round</button></div>`;
  $("stage").querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  $("pause").onclick=()=>setPause(!g.paused);
  $("quit").onclick=()=>finish();
  hud();
}
function hud(){
  if(!g||g.over)return;
  const f=$("fill"); if(f)f.style.width=Math.max(0,g.t/ROUND*100)+"%";
  const tm=$("tm"); if(tm)tm.textContent=Math.ceil(Math.max(0,g.t))+"s";
  const cb=$("cb"); if(cb)cb.textContent=g.combo>=2?"x"+mult()+" combo":"";
  const sc=$("sc"); if(sc)sc.textContent=g.score;
}
function mult(){return Math.min(5,1+Math.floor(g.combo/3))}
function answer(i){
  if(!g||g.locked||g.over||g.paused)return;
  g.locked=true;
  const q=g.q, o=q.opts[i], ok=o.es===q.v.es;
  const btns=[...$("stage").querySelectorAll(".opt")];
  btns.forEach((b,j)=>{ if(q.opts[j].es===q.v.es)b.classList.add("good"); });
  g.total++;
  const fb=$("fb");
  if(ok){
    g.right++; g.combo++; g.maxCombo=Math.max(g.maxCombo,g.combo);
    g.score+=10*mult();
    if(store.missed[q.v.es]>0){store.missed[q.v.es]--; save();}
    fb.textContent="Correct ✓";
    setTimeout(()=>{if(g&&!g.over)next()},350);
  }else{
    btns[i].classList.add("bad");
    g.combo=0; g.t-=PENALTY;
    g.missed[q.v.es]=(g.missed[q.v.es]||0)+1;
    store.missed[q.v.es]=(store.missed[q.v.es]||0)+1; save();
    fb.className="fb bad";
    fb.textContent="✗ "+q.v.es+" = "+q.v.en+"  (−"+PENALTY+"s)";
    setTimeout(()=>{if(g&&!g.over)next()},1300);
  }
  hud();
}
function setPause(p){
  if(!g||g.over)return; g.paused=p; const b=$("pause"); if(b)b.textContent=p?"Resume":"Pause";
  if(!p){lastT=0}
}
function tick(ts){
  if(!g||g.over)return;
  if(lastT&&!g.paused){ g.t-=Math.min(.25,(ts-lastT)/1000); }
  lastT=ts;
  if(g.t<=0){g.t=0;finish();return}
  hud(); raf=requestAnimationFrame(tick);
}
function save(){
  Promise.resolve(amber.setData({values:{best:store.best,streak:store.streak,last:store.last,plays:store.plays,missed:store.missed}})).then(r=>{if(r&&r.ok===false)$("hint").textContent="Couldn't save progress: "+r.error});
}
function finish(){
  if(!g||g.over)return;
  g.over=true; cancelAnimationFrame(raf);
  const newBest=g.score>store.best&&g.score>0;
  if(newBest)store.best=g.score;
  if(g.total>0){
    if(store.last!==today){ store.streak=(store.last&&dayDiff(store.last,today)===1)?store.streak+1:1; store.last=today; }
    store.plays++;
  }
  save(); drawTop();
  const acc=g.total?Math.round(g.right/g.total*100):0;
  const miss=Object.keys(g.missed).map(es=>verbs.find(v=>v.es===es)).filter(Boolean);
  $("stage").innerHTML=`<div class="card center">
    ${newBest?'<span class="badge">New best!</span>':''}
    <div class="muted">Final score</div><div class="result">${g.score}</div>
    <div class="stats"><div><b>${g.right}/${g.total}</b><span class="muted">correct</span></div><div><b>${acc}%</b><span class="muted">accuracy</span></div><div><b>x${Math.min(5,1+Math.floor(g.maxCombo/3))}</b><span class="muted">best combo</span></div></div>
    ${miss.length?`<div class="muted" style="text-align:left">Tricky ones — they'll show up more:</div><ul class="miss">${miss.map(v=>`<li><b>${esc(v.es)}</b><span class="muted">${esc(v.en)}</span></li>`).join("")}</ul>`:'<p>Flawless round. ¡Perfecto!</p>'}
    <button class="big" id="again">Play again</button></div>`;
  $("again").onclick=start;
  $("hint").textContent="A minute a day keeps the streak alive.";
  g.over=true;
}
function home(){
  drawTop();
  if(verbs.length<2){
    $("stage").innerHTML=`<div class="card center muted">Add at least two rows (Spanish | English) to the table in this note to play.</div>`; return;
  }
  $("stage").innerHTML=`<div class="card center">
    <div class="prompt" style="margin-top:0">¿Listo?</div>
    <p class="muted">60 seconds. Match each verb with its meaning, in both directions. Chain right answers for up to x5 points.</p>
    <p class="muted">${store.last===today?"You've already played today — go for a new best.":"Play today to keep your streak going."}</p>
    <button class="big" id="go">Start</button></div>
   <div class="card"><div class="muted">Verbs in play (from your note)</div><p style="line-height:1.9">${verbs.map(v=>`<span class="chip">${esc(v.es)}</span>`).join(" ")}</p></div>`;
  $("go").onclick=start;
  $("hint").textContent="";
}
document.addEventListener("keydown",e=>{
  if(!g||g.over)return;
  const n=parseInt(e.key,10); if(n>=1&&n<=4)answer(n-1);
});
document.addEventListener("visibilitychange",()=>{ if(document.hidden)setPause(true); });
let booted=false;
amber.onChange((note,data)=>{
  today=note.today; $("title").textContent=note.title;
  loadVerbs(note); loadStore(data);
  if(!g||g.over&&!$("again")){ if(!booted||!g)home(); }
  booted=true; drawTop();
});
</script>
</body>
</html>
