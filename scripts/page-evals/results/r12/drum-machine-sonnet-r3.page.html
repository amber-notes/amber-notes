<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 64px; }
  h1 { font-size: 1.75rem; letter-spacing: -.02em; margin: 4px 0 14px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
  button { font: inherit; font-weight: 600; min-height: 44px; min-width: 44px; padding: 0 18px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-fill); color: var(--amber-text); cursor: pointer; }
  button.play { background: var(--amber-text); color: var(--amber-bg); min-width: 110px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  button:focus-visible { outline: 2px solid var(--amber-accent-text); outline-offset: 2px; }
  .tempo { display: flex; align-items: center; gap: 8px; flex: 1 1 220px; color: var(--amber-text-secondary); font-size: .875rem; }
  .tempo input[type=range] { flex: 1; min-height: 44px; accent-color: var(--amber-accent); }
  .tempo output { font-variant-numeric: tabular-nums; color: var(--amber-text); font-weight: 600; min-width: 5.5ch; }
  .track { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 12px; margin-bottom: 12px; }
  .track h2 { font-size: 1rem; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .step { min-width: 0; min-height: 44px; padding: 0; border-radius: 8px; background: var(--amber-fill); color: var(--amber-on-accent); position: relative; font-size: .75rem; }
  .step.alt { background: var(--amber-accent-soft); }
  .step.on { background: var(--amber-accent); }
  .step.on::after { content: ""; position: absolute; inset: 40% 30%; border-radius: 50%; background: var(--amber-on-accent); opacity: .85; }
  .step.now { outline: 2px solid var(--amber-text); outline-offset: 1px; }
  .hint { color: var(--amber-text-secondary); font-size: .875rem; margin-top: 8px; }
  .err { color: var(--amber-danger); min-height: 1.2em; }
  @media (min-width: 700px) { .steps { grid-template-columns: repeat(16, 1fr); } .track { padding: 16px; } }
  @media (prefers-reduced-motion: no-preference) { .step { transition: background .1s; } }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="bar">
    <button class="play" id="play" aria-label="Play"></button>
    <label class="tempo">Tempo <input type="range" id="bpm" min="60" max="200" step="1" value="120"><output id="bpmout" for="bpm"></output></label>
    <button id="mute" aria-pressed="false">Sound on</button>
  </div>
  <div id="tracks"></div>
  <div class="err" id="err" role="alert"></div>
  <div class="hint">Tap a step to switch it on or off. The pattern is the table in the note.</div>
</main>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const isOn = (s) => /^(x|✓|1|yes|true|on)$/i.test(String(s || "").trim());
let tracks = [];      // [{name, col}]
let grid = [];        // grid[track][step] boolean
let steps = 16, tableIdx = 0, stepCol = 0;
let bpm = 120, muted = false, playing = false, cur = -1;
let ctx = null, nextTime = 0, nextStep = 0, timer = null, noiseBuf = null;
const queue = [];
let bpmInit = false;

const playBtn = document.getElementById("play");
const ICON_PLAY = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg>Play';
const ICON_STOP = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2" fill="currentColor"/></svg>Stop';

function readNote(note) {
  const t = note.tables.find((t) => t.columns.length > 1 && t.columns.some((c) => /^step$/i.test(c.name))) || note.tables[0];
  if (!t) { tracks = []; grid = []; return; }
  tableIdx = t.index;
  stepCol = Math.max(0, t.columns.findIndex((c) => /^step$/i.test(c.name)));
  tracks = t.columns.map((c, i) => ({ name: c.name, col: i })).filter((c) => c.col !== stepCol);
  steps = t.rows.length;
  grid = tracks.map((tr) => t.rows.map((r) => isOn(r[tr.col])));
  if (!bpmInit) {
    const saved = amber.data && amber.data.values && amber.data.values.bpm;
    const m = /(\d{2,3})\s*bpm/i.exec(note.markdown || "");
    bpm = saved || (m ? +m[1] : 120);
    bpmInit = true;
  }
}

function render(note) {
  readNote(note);
  document.getElementById("title").textContent = note.title;
  document.getElementById("bpm").value = bpm;
  document.getElementById("bpmout").textContent = bpm + " bpm";
  const el = document.getElementById("tracks");
  if (!tracks.length || !steps) {
    el.innerHTML = '<div class="track hint">Add a table with a Step column and one column per drum (Kick, Snare, Hat) to the note.</div>';
  } else {
    el.innerHTML = tracks.map((tr, ti) => `<section class="track"><h2>${esc(tr.name)}</h2><div class="steps">` +
      grid[ti].map((on, si) => `<button class="step${on ? " on" : ""}${Math.floor(si / 4) % 2 ? " alt" : ""}${si === cur ? " now" : ""}" data-t="${ti}" data-s="${si}" aria-pressed="${on}" aria-label="${esc(tr.name)} step ${si + 1}"></button>`).join("") +
      `</div></section>`).join("");
  }
  setPlayUi();
}

function setPlayUi() {
  playBtn.innerHTML = playing ? ICON_STOP : ICON_PLAY;
  playBtn.setAttribute("aria-label", playing ? "Stop" : "Play");
  const mb = document.getElementById("mute");
  mb.textContent = muted ? "Sound off" : "Sound on";
  mb.setAttribute("aria-pressed", String(muted));
}

document.getElementById("tracks").addEventListener("click", async (e) => {
  const b = e.target.closest(".step");
  if (!b) return;
  const ti = +b.dataset.t, si = +b.dataset.s;
  const on = !grid[ti][si];
  if (on && !playing) { ensureCtx(); hit(tracks[ti].name, ctx.currentTime + 0.01); }
  const r = await amber.update({ op: "set_cell", table: tableIdx, row: si, col: tracks[ti].col, value: on ? "x" : "" });
  document.getElementById("err").textContent = r.ok ? "" : (r.error || "Could not change the note.");
});

document.getElementById("bpm").addEventListener("input", (e) => {
  bpm = +e.target.value;
  document.getElementById("bpmout").textContent = bpm + " bpm";
});
document.getElementById("bpm").addEventListener("change", () => amber.store.set("bpm", bpm));
document.getElementById("mute").onclick = () => { muted = !muted; setPlayUi(); };

function ensureCtx() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ctx.state === "suspended") ctx.resume();
}

function noise(t, dur, type, freq, vol) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(ctx.destination);
  s.start(t); s.stop(t + dur + 0.02);
}
function tone(t, f0, f1, dur, vol, type) {
  const o = ctx.createOscillator(); o.type = type || "sine";
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function hit(name, t) {
  if (muted || !ctx) return;
  const n = name.toLowerCase();
  if (/kick|bass|bd/.test(n)) tone(t, 150, 40, 0.35, 0.9);
  else if (/snare|clap|sd/.test(n)) { noise(t, 0.18, "highpass", 1500, 0.5); tone(t, 220, 120, 0.1, 0.4, "triangle"); }
  else if (/open/.test(n)) noise(t, 0.3, "highpass", 7000, 0.25);
  else if (/hat|hh|cymbal|ride/.test(n)) noise(t, 0.05, "highpass", 8000, 0.3);
  else if (/tom/.test(n)) tone(t, 200, 90, 0.25, 0.6);
  else tone(t, 660, 440, 0.12, 0.3, "square");
}

function schedule() {
  while (nextTime < ctx.currentTime + 0.12) {
    const s = nextStep % Math.max(steps, 1);
    tracks.forEach((tr, ti) => { if (grid[ti] && grid[ti][s]) hit(tr.name, nextTime); });
    queue.push({ s, t: nextTime });
    nextTime += 60 / bpm / 4;
    nextStep = s + 1;
  }
}
function paint() {
  if (!playing) return;
  while (queue.length && queue[0].t <= ctx.currentTime) setCursor(queue.shift().s);
  requestAnimationFrame(paint);
}
function setCursor(s) {
  cur = s;
  document.querySelectorAll(".step.now").forEach((n) => n.classList.remove("now"));
  if (s >= 0) document.querySelectorAll('.step[data-s="' + s + '"]').forEach((n) => n.classList.add("now"));
}
function start() {
  if (!tracks.length) return;
  ensureCtx();
  playing = true; nextStep = 0; nextTime = ctx.currentTime + 0.05; queue.length = 0;
  timer = setInterval(schedule, 25); schedule();
  requestAnimationFrame(paint);
  setPlayUi();
}
function stop() {
  playing = false; clearInterval(timer); queue.length = 0; setCursor(-1); setPlayUi();
}
playBtn.onclick = () => (playing ? stop() : start());
document.addEventListener("visibilitychange", () => { if (document.hidden && playing) stop(); });
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !/INPUT|BUTTON/.test(e.target.tagName)) { e.preventDefault(); playing ? stop() : start(); }
});
amber.onChange(render);
</script>
</body>
</html>
