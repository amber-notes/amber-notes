<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 64px; }
  h1 { font-size: 1.75rem; letter-spacing: -.02em; margin: 4px 0 4px; }
  .sub { color: var(--amber-text-secondary); font-size: .9rem; margin: 0 0 16px; }
  .bar { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; margin-bottom: 16px; }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 20px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-text); color: var(--amber-bg); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  button.alt { background: var(--amber-fill); color: var(--amber-text); }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--amber-text-secondary); }
  input[type=number] { font: inherit; font-variant-numeric: tabular-nums; color: var(--amber-text); background: var(--amber-fill); border: 0; border-radius: var(--amber-radius-small); padding: 8px 12px; min-height: 44px; width: 96px; }
  .track { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 12px; margin-bottom: 12px; }
  .name { font-weight: 600; margin-bottom: 8px; font-size: .95rem; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  @media (min-width: 600px) { .steps { grid-template-columns: repeat(8, 1fr); } }
  @media (min-width: 900px) { .steps { grid-template-columns: repeat(16, 1fr); } }
  .step { min-height: 44px; min-width: 0; padding: 0; border-radius: var(--amber-radius-small); background: var(--amber-fill); color: var(--amber-on-accent); border: 2px solid transparent; justify-content: center; }
  .step.alt4 { background: color-mix(in srgb, var(--amber-fill) 70%, var(--amber-text-secondary) 30%); }
  .step.on { background: var(--amber-accent); }
  .step.now { border-color: var(--amber-text); }
  .step.on.now { filter: brightness(1.25); }
  .step svg { width: 14px; height: 14px; display: none; }
  .step.on svg { display: block; }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
  .err { color: var(--amber-danger); min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <h1 id="title">Beat</h1>
  <p class="sub">Tap a step to switch it on or off. Changes are saved in the note's table.</p>
  <div class="bar">
    <button id="play" aria-label="Play">Play</button>
    <label>Tempo (bpm)<input type="number" id="bpm" min="40" max="240" value="120"></label>
    <button class="alt" id="clear">Clear all</button>
  </div>
  <div class="err" id="err" role="alert"></div>
  <div id="grid"></div>
</main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const isOn = (s) => /^(x|✓|yes|1|true)$/i.test(String(s || "").trim());
  let note = null, ctx = null, playing = false, cur = -1, bpm = 120, timer = null, nextTime = 0, nextStep = 0, queue = [], noise = null;

  function table() {
    if (!note) return null;
    return note.tables.find((t) => t.columns.length > 1 && /^step$/i.test(t.columns[0].name)) || null;
  }
  function render() {
    const t = table(), g = document.getElementById("grid");
    document.getElementById("title").textContent = note.title;
    if (!t || !t.rows.length) { g.innerHTML = '<div class="track empty">Add a table with a Step column and one column per sound (Kick, Snare, Hat…).</div>'; return; }
    let h = "";
    for (let c = 1; c < t.columns.length; c++) {
      h += `<div class="track"><div class="name">${esc(t.columns[c].name)}</div><div class="steps">`;
      t.rows.forEach((r, i) => {
        const on = isOn(r[c]);
        h += `<button class="step${on ? " on" : ""}${Math.floor(i / 4) % 2 ? " alt4" : ""}${i === cur ? " now" : ""}" data-r="${i}" data-c="${c}" aria-pressed="${on}" aria-label="${esc(t.columns[c].name)} step ${i + 1} ${on ? "on" : "off"}"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="currentColor"/></svg></button>`;
      });
      h += "</div></div>";
    }
    g.innerHTML = h;
  }
  function mark() {
    document.querySelectorAll(".step.now").forEach((e) => e.classList.remove("now"));
    if (cur < 0) return;
    document.querySelectorAll(`.step[data-r="${cur}"]`).forEach((e) => e.classList.add("now"));
  }

  document.getElementById("grid").addEventListener("click", async (e) => {
    const b = e.target.closest(".step"); if (!b) return;
    const t = table(); const r = +b.dataset.r, c = +b.dataset.c;
    const on = isOn(t.rows[r][c]);
    if (!on) { ensureCtx(); voice(t.columns[c].name, ctx ? ctx.currentTime : 0); }
    const res = await amber.update({ op: "set_cell", table: t.index, row: r, col: c, value: on ? "" : "x" });
    document.getElementById("err").textContent = res.ok ? "" : res.error;
  });
  document.getElementById("clear").onclick = async () => {
    const t = table(); if (!t) return; const ops = [];
    t.rows.forEach((row, i) => { for (let c = 1; c < t.columns.length; c++) if (isOn(row[c])) ops.push({ op: "set_cell", table: t.index, row: i, col: c, value: "" }); });
    if (ops.length) { const res = await amber.update(ops); document.getElementById("err").textContent = res.ok ? "" : res.error; }
  };
  document.getElementById("bpm").onchange = (e) => {
    bpm = Math.min(240, Math.max(40, parseInt(e.target.value) || 120)); e.target.value = bpm;
    amber.store.set("bpm", bpm);
  };

  function ensureCtx() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC();
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function env(g, t, peak, dur) { g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); }
  function noiseHit(t, hp, peak, dur) {
    const s = ctx.createBufferSource(); s.buffer = noise;
    const f = ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp;
    const g = ctx.createGain(); env(g, t, peak, dur);
    s.connect(f); f.connect(g); g.connect(ctx.destination); s.start(t, Math.random() * 0.5); s.stop(t + dur);
  }
  function tone(t, f0, f1, peak, dur, type) {
    const o = ctx.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain(); env(g, t, peak, dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur);
  }
  function voice(name, t) {
    if (!ctx) return;
    if (/kick|bass|bd/i.test(name)) tone(t, 150, 40, 0.9, 0.35);
    else if (/snare|clap|sn/i.test(name)) { noiseHit(t, 1200, 0.5, 0.18); tone(t, 220, 120, 0.4, 0.1, "triangle"); }
    else if (/hat|hh|cym|ride/i.test(name)) noiseHit(t, 7000, 0.3, 0.05);
    else tone(t, 330, 200, 0.5, 0.2, "triangle");
  }

  function tick() {
    const t = table(); if (!t || !t.rows.length) return;
    while (nextTime < ctx.currentTime + 0.12) {
      const i = nextStep % t.rows.length;
      for (let c = 1; c < t.columns.length; c++) if (isOn(t.rows[i][c])) voice(t.columns[c].name, nextTime);
      queue.push({ time: nextTime, step: i });
      nextTime += 60 / bpm / 4; nextStep = i + 1;
    }
  }
  function frame() {
    if (!playing) return;
    let s = null;
    while (queue.length && queue[0].time <= ctx.currentTime) s = queue.shift();
    if (s && s.step !== cur) { cur = s.step; mark(); }
    requestAnimationFrame(frame);
  }
  function setPlayBtn() {
    const b = document.getElementById("play");
    b.textContent = playing ? "Stop" : "Play"; b.setAttribute("aria-label", playing ? "Stop" : "Play");
  }
  function start() {
    ensureCtx(); if (!ctx) return;
    playing = true; nextStep = 0; nextTime = ctx.currentTime + 0.05; queue = [];
    timer = setInterval(tick, 25); tick(); requestAnimationFrame(frame); setPlayBtn();
  }
  function stop() {
    playing = false; clearInterval(timer); queue = []; cur = -1; mark(); setPlayBtn();
  }
  document.getElementById("play").onclick = () => (playing ? stop() : start());
  document.addEventListener("visibilitychange", () => { if (document.hidden && playing) stop(); });

  let inited = false;
  amber.onChange((n, data) => {
    note = n;
    if (!inited) {
      inited = true;
      const saved = data && data.values && data.values.bpm;
      const m = /(\d{2,3})\s*bpm/i.exec(n.markdown || "");
      bpm = saved || (m ? +m[1] : 120);
      document.getElementById("bpm").value = bpm;
    }
    render(); mark();
  });
</script>
</body>
</html>
