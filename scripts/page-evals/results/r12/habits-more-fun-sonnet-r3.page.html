<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit tracker</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { -webkit-user-select: none; user-select: none; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 8px var(--amber-gutter) 60px; position: relative; }
  h1 { font-family: var(--amber-font-rounded); font-size: 1.75rem; margin: 6px 0 12px; letter-spacing: -.02em; }
  .label { font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 22px 4px 8px; }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); padding: 14px 16px; }
  .layout { display: grid; gap: 0 28px; }
  @media (min-width: 900px) { .layout { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; } }

  .hero { display: flex; align-items: center; gap: 16px; background: var(--amber-accent-soft); }
  .ring { position: relative; width: 84px; height: 84px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .c { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--amber-font-rounded); font-weight: 700; font-size: 1.15rem; }
  .ring circle { fill: none; stroke-width: 9; }
  .ring .bg { stroke: var(--amber-surface); }
  .ring .fg { stroke: var(--amber-accent); stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.34,1.2,.64,1); }
  .hero .msg { font-family: var(--amber-font-rounded); font-size: 1.15rem; font-weight: 700; line-height: 1.25; }
  .hero .sm { color: var(--amber-text-secondary); font-size: .9rem; margin-top: 2px; }

  .xp { margin-top: 12px; }
  .xp .top { display: flex; justify-content: space-between; font-size: .9rem; font-weight: 600; }
  .xp .top span:last-child { color: var(--amber-text-secondary); font-weight: 500; }
  .xpbar { height: 12px; border-radius: 6px; background: var(--amber-fill); margin-top: 6px; overflow: hidden; }
  .xpbar div { height: 100%; background: var(--amber-accent); border-radius: 6px; transition: width .6s; }

  .tiles { display: grid; gap: 10px; grid-template-columns: 1fr; }
  @media (min-width: 420px) { .tiles { grid-template-columns: 1fr 1fr; } }
  .tile { appearance: none; border: 2px solid transparent; font: inherit; color: inherit; text-align: left; background: var(--amber-surface); border-radius: var(--amber-radius); padding: 14px; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: transform .2s cubic-bezier(.34,1.56,.64,1), background .2s, border-color .2s; }
  .tile:active { transform: scale(.95); }
  .tile .em { font-size: 2rem; line-height: 1; transition: transform .3s; }
  .tile .nm { font-family: var(--amber-font-rounded); font-weight: 700; font-size: 1.1rem; margin-top: 8px; }
  .tile .st { font-size: .85rem; color: var(--amber-text-secondary); margin-top: 2px; }
  .tile.done { background: var(--amber-accent); color: var(--amber-on-accent); }
  .tile.done .st { color: var(--amber-on-accent); opacity: .85; }
  .tile.done .em { transform: scale(1.15) rotate(-8deg); }
  .tile:focus-visible { outline: 3px solid var(--amber-text); outline-offset: 2px; }
  .tile.bump { animation: bump .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bump { 0% { transform: scale(.88); } 100% { transform: scale(1); } }

  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
  .wd { font-size: .75rem; color: var(--amber-text-secondary); }
  .wd .dot { margin: 4px auto 0; width: 100%; max-width: 44px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: var(--amber-fill); font-size: .85rem; font-weight: 700; color: var(--amber-text); }
  .wd.full .dot { background: var(--amber-accent); color: var(--amber-on-accent); }
  .wd.part .dot { background: var(--amber-accent-soft); }
  .wd.today .dot { outline: 2px solid var(--amber-text); outline-offset: 2px; }
  .wd.future .dot { opacity: .4; }

  .heat { display: grid; gap: 4px; grid-template-columns: repeat(7, 1fr); }
  .hc { aspect-ratio: 1; border-radius: 6px; background: var(--amber-fill); }
  .hc.l1 { background: var(--amber-accent-soft); }
  .hc.l2 { background: var(--amber-accent); opacity: .65; }
  .hc.l3 { background: var(--amber-accent); }
  .hc.today { outline: 2px solid var(--amber-text); outline-offset: -2px; }
  .hc.pad { background: none; }

  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
  .badge { text-align: center; padding: 12px 6px; border-radius: var(--amber-radius-small); background: var(--amber-surface); }
  .badge .b { font-size: 1.8rem; filter: grayscale(1); opacity: .35; }
  .badge.on .b { filter: none; opacity: 1; }
  .badge .t { font-size: .8rem; font-weight: 600; margin-top: 4px; }
  .badge .d { font-size: .78rem; color: var(--amber-text-secondary); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--amber-surface); border-radius: var(--amber-radius-small); padding: 12px; }
  .stat .n { font-family: var(--amber-font-rounded); font-size: 1.5rem; font-weight: 700; }
  .stat .t { font-size: .78rem; color: var(--amber-text-secondary); }
  .err { color: var(--amber-danger); min-height: 1.2em; font-size: .9rem; margin-top: 6px; }
  .empty { padding: 30px 18px; text-align: center; color: var(--amber-text-secondary); }

  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .conf { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px; animation: fall 1.8s ease-in forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 105vh) rotate(var(--r)); opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { .conf { display: none; } .tile, .tile.bump, .ring .fg, .xpbar div { animation: none; transition: none; } }
</style>
</head>
<body>
<main id="app"></main>
<div id="fx" aria-hidden="true"></div>
<script>
  const DONE = /^(✓|✔|x|yes|y|1|true|done)$/i;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const dow = (iso) => (new Date(iso + "T12:00:00Z").getUTCDay() + 6) % 7; // Mon=0
  const EMOJI = [[/walk|run|jog|steps/i, "🚶"], [/read|book/i, "📖"], [/stretch|yoga|mobil/i, "🧘"], [/water|drink/i, "💧"], [/sleep|bed/i, "😴"], [/med/i, "🌿"], [/write|journal/i, "✍️"], [/gym|lift|workout|exercise/i, "💪"], [/code|study|learn/i, "🧠"], [/eat|meal|veg|fruit/i, "🥗"]];
  const emoji = (n) => (EMOJI.find(([r]) => r.test(n)) || [0, "⭐"])[1];
  const LEVELS = ["Seedling", "Sprout", "Sapling", "Bloom", "Tree", "Grove", "Forest"];
  let error = "", bumped = null, lastAll = null;

  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const fx = document.getElementById("fx"), cols = ["#f5a623", "#ff6b6b", "#4ecdc4", "#6c8cff", "#ffd93d", "#b388ff"];
    for (let i = 0; i < 70; i++) {
      const s = document.createElement("span"); s.className = "conf";
      s.style.left = Math.random() * 100 + "%"; s.style.background = cols[i % cols.length];
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px"); s.style.setProperty("--r", (Math.random() * 900 - 450) + "deg");
      s.style.animationDelay = Math.random() * .4 + "s"; s.style.animationDuration = 1.4 + Math.random() * 1.2 + "s";
      fx.appendChild(s); setTimeout(() => s.remove(), 3500);
    }
  }

  function render(note) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => t.columns.some((c) => /^(date|day)$/i.test(c.name)));
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with a Date column and one column per habit.</div>`; return; }
    const dc = t.columns.findIndex((c) => /^(date|day)$/i.test(c.name));
    const habits = t.columns.map((c, i) => ({ name: c.name, i })).filter((h) => h.i !== dc);
    const today = note.today;
    const byDate = new Map(t.rows.map((r, i) => [r[dc], { r, i }]));
    const done = (d, h) => DONE.test(String(byDate.get(d)?.r[h.i] ?? "").trim());
    const count = (d) => habits.filter((h) => done(d, h)).length;
    const N = habits.length || 1;

    let total = 0, perfectDays = 0;
    for (const r of t.rows) { const c = habits.filter((h) => DONE.test(String(r[h.i] ?? "").trim())).length; total += c; if (habits.length && c === habits.length) perfectDays++; }
    let bestEver = 0;
    for (const h of habits) {
      let d = done(today, h) ? today : addDays(today, -1), n = 0;
      while (done(d, h)) { n++; d = addDays(d, -1); }
      h.streak = n; h.today = done(today, h);
      let run = 0;
      for (let k = -120; k <= 0; k++) { if (done(addDays(today, k), h)) { run++; bestEver = Math.max(bestEver, run); } else run = 0; }
    }
    const xp = total * 10 + perfectDays * 20;
    const per = 100, lvl = Math.floor(xp / per), into = xp % per;
    const title = LEVELS[Math.min(lvl, LEVELS.length - 1)];
    const doneToday = count(today), allDone = habits.length > 0 && doneToday === habits.length;
    const frac = doneToday / N;
    const C = 2 * Math.PI * 36;
    const msg = allDone ? "Perfect day! 🎉" : doneToday === 0 ? "Fresh day. Pick one!" : doneToday >= N / 2 ? "Over halfway. Nice!" : "Good start, keep going!";
    const left = N - doneToday;

    const ws = addDays(today, -dow(today));
    const week = Array.from({ length: 7 }, (_, k) => addDays(ws, k));
    const weekDone = week.filter((d) => d <= today).reduce((a, d) => a + count(d), 0);

    const WEEKS = 5, start = addDays(addDays(today, -dow(today)), -7 * (WEEKS - 1));
    const cells = Array.from({ length: WEEKS * 7 }, (_, k) => addDays(start, k));
    const lv = (d) => { if (d > today) return "pad"; const c = count(d); return c === 0 ? "" : c === N ? "l3" : c >= N / 2 ? "l2" : "l1"; };

    const badges = [
      ["🔥", "On fire", "3-day streak", bestEver >= 3],
      ["⚡", "Unstoppable", "7-day streak", bestEver >= 7],
      ["🌟", "Perfect day", "All habits", perfectDays >= 1],
      ["🏅", "Hat trick", "3 perfect days", perfectDays >= 3],
      ["💯", "Centurion", "10 ticks", total >= 10],
      ["🚀", "Veteran", "50 ticks", total >= 50],
    ];

    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="layout"><div>
        <div class="card hero">
          <div class="ring" role="img" aria-label="${doneToday} of ${habits.length} done today"><svg viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="36"/><circle class="fg" cx="42" cy="42" r="36" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"/></svg><div class="c">${doneToday}/${habits.length}</div></div>
          <div><div class="msg">${msg}</div><div class="sm">${allDone ? "+20 bonus XP earned" : left + " to go for a perfect day"}</div></div>
        </div>
        <div class="xp"><div class="top"><span>Level ${lvl + 1} · ${title}</span><span>${xp} XP · ${per - into} to next</span></div><div class="xpbar"><div style="width:${into}%"></div></div></div>
        <div class="label">Today</div>
        <div class="tiles">${habits.map((h) => `<button class="tile${h.today ? " done" : ""}${bumped === h.i ? " bump" : ""}" data-h="${h.i}" aria-pressed="${h.today}"><span class="em" aria-hidden="true">${emoji(h.name)}</span><span><div class="nm">${esc(h.name)}</div><div class="st">${h.today ? "Done! " : ""}${h.streak ? "🔥 " + h.streak + (h.streak > 1 ? " days" : " day") : h.today ? "" : "Tap when done"}</div></span></button>`).join("")}</div>
        <div class="err" role="alert">${esc(error)}</div>
        <div class="label">This week</div>
        <div class="card"><div class="week">${week.map((d) => { const c = count(d), cls = d > today ? "future" : c === N ? "full" : c ? "part" : ""; return `<div class="wd ${cls} ${d === today ? "today" : ""}">${"MTWTFSS"[dow(d)]}<div class="dot">${d > today ? "" : c === N ? "★" : c || ""}</div></div>`; }).join("")}</div></div>
      </div><div>
        <div class="stats">
          <div class="stat"><div class="n">${weekDone}</div><div class="t">ticks this week</div></div>
          <div class="stat"><div class="n">${bestEver}</div><div class="t">best streak</div></div>
          <div class="stat"><div class="n">${perfectDays}</div><div class="t">perfect days</div></div>
        </div>
        <div class="label">Badges</div>
        <div class="badges">${badges.map(([b, tt, d, on]) => `<div class="badge${on ? " on" : ""}"><div class="b" aria-hidden="true">${b}</div><div class="t">${tt}</div><div class="d">${on ? "Unlocked" : d}</div></div>`).join("")}</div>
        <div class="label">Last 5 weeks</div>
        <div class="card"><div class="heat" role="img" aria-label="Heatmap of the last five weeks">${cells.map((d) => `<div class="hc ${lv(d)} ${d === today ? "today" : ""}"></div>`).join("")}</div></div>
      </div></div>`;
    bumped = null;
    if (lastAll === false && allDone) confetti();
    lastAll = allDone;

    app.querySelectorAll(".tile").forEach((b) => b.addEventListener("click", async () => {
      const h = habits.find((x) => x.i === Number(b.dataset.h));
      const row = byDate.get(today), value = done(today, h) ? "" : "✓";
      bumped = h.i;
      const r = row
        ? await amber.update({ op: "set_cell", table: t.index, row: row.i, col: h.name, value })
        : await amber.update({ op: "append_row", table: t.index, values: { [t.columns[dc].name]: today, [h.name]: value } });
      error = r.ok ? "" : r.error;
      if (!r.ok) render(amber.note);
    }));
  }
  amber.onChange(render);
</script>
</body>
</html>
