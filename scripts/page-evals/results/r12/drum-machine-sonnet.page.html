<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 64px; }
  h1 { font-size: 1.75rem; letter-spacing: -.02em; margin: 4px 0 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
  button { font: inherit; font-weight: 600; min-height: 44px; border: 0; border-radius: var(--amber-radius-small); cursor: pointer; }
  #play { min-width: 112px; padding: 0 20px; background: var(--amber-text); color: var(--amber-bg); display: flex; align-items: center; justify-content: center; gap: 8px; }
  #mute { padding: 0 16px; background: var(--amber-fill); color: var(--amber-text); }
  #mute[aria-pressed="true"] { background: var(--amber-accent-soft); color: var(--amber-accent-text); }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--amber-text-secondary); }
  input { font: inherit; color: var(--amber-text); background: var(--amber-fill); border: 0; border-radius: var(--amber-radius-small); padding: 10px 12px; min-height: 44px; width: 96px; font-variant-numeric: tabular-nums; }
  .hint { color: var(--amber-text-secondary); font-size: .9rem; margin: 0 0 16px; }
  .track { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 12px; margin-bottom: 12px; }
  .track h2 { font-size: .95rem; margin: 0 0 8px; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .step { min-height: 44px; background: var(--amber-fill); color: var(--amber-text); font-size: .75rem; font-variant-numeric: tabular-nums; border: 2px solid transparent; }
  .step.beat { border-bottom-color: var(--amber-separator); }
  .step[aria-pressed="true"] { background: var(--amber-accent-soft); color: var(--amber-accent-text); border-color: var(--amber-accent); font-weight: 700; }
  .step.now { outline: 3px solid var(--amber-text); outline-offset: 1px; }
  .step[aria-pressed="false"] { opacity: .85; }
  .err { color: var(--amber-danger); min-height: 1.2em; }
  @media (min-width: 600px) { .steps { grid-template-columns: repeat(8, 1fr); } }
  @media (min-width: 900px) { .steps { grid-template-columns: repeat(16, 1fr); } }
  @media (prefers-reduced-motion: no-preference) { .step { transition: background .08s; } }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="bar">
    <button id="play" aria-label="Play"></button>
    <label for="bpm">Tempo (bpm)<input id="bpm" name="bpm" type="number" inputmode="numeric" min="40" max="240" value="120"></label>
    <button id="mute" aria-pressed="false">Mute</button>
  </div>
  <p class="hint">Tap a step to turn it on or off. The pattern is saved in the note's table as x marks.</p>
  <div id="grid"></div>
  <div class="err" id="err" role="alert"></div>
</main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const on = (s) => /^(x|✓|yes|1|true)$/i.test(String(s).trim());
  let tIndex = -1, names = [], pat = [], steps = 0; // pat[inst][step]
  let playing = false, muted = false, bpm = 120, step = 0, nextTime = 0, timer = null, ctx = null, noise = null;
  let queue = [];
  const $ = (id) => document.getElementById(id);

  const icon = (p) => p ? '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg>Pause'
    : '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg>Play';
  function setPlayBtn() { $("play").innerHTML = icon(playing); $("play").setAttribute("aria-label", playing ? "Pause" : "Play"); }

  function read(note) {
    const t = note.tables.find((t) => t.columns.length > 1 && /^step$/i.test(t.columns[0].name)) || note.tables[0];
    if (!t) { tIndex = -1; names = []; pat = []; steps = 0; return; }
    tIndex = t.index;
    names = t.columns.slice(1).map((c) => c.name);
    steps = t.rows.length;
    pat = names.map((_, i) => t.rows.map((r) => on(r[i + 1])));
  }

  function render() {
    $("title").textContent = amber.note.title;
    if (tIndex < 0 || !steps) {
      $("grid").innerHTML = '<div class="track">Add a table with columns Step, Kick, Snare, Hat and a row per step.</div>';
      return;
    }
    $("grid").innerHTML = names.map((n, i) => `<section class="track"><h2>${esc(n)}</h2><div class="steps">${pat[i].map((v, s) =>
      `<button class="step${s % 4 === 0 ? " beat" : ""}" data-i="${i}" data-s="${s}" aria-pressed="${v}" aria-label="${esc(n)} step ${s + 1}">${s + 1}</button>`).join("")}</div></section>`).join("");
    markNow(playing ? (step + steps - 1) % steps : -1);
  }

  function markNow(s) {
    document.querySelectorAll(".step.now").forEach((e) => e.classList.remove("now"));
    if (s >= 0) document.querySelectorAll(`.step[data-s="${s}"]`).forEach((e) => e.classList.add("now"));
  }

  $("grid").addEventListener("click", async (e) => {
    const b = e.target.closest(".step"); if (!b) return;
    ensureCtx();
    const i = +b.dataset.i, s = +b.dataset.s, v = !pat[i][s];
    pat[i][s] = v; b.setAttribute("aria-pressed", v); // instant feedback; note change re-syncs
    if (v && !playing) voice(names[i], ctx.currentTime);
    const r = await amber.update({ op: "set_cell", table: tIndex, row: s, col: names[i], value: v ? "x" : "" });
    $("err").textContent = r.ok ? "" : r.error;
  });

  function ensureCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === "suspended") ctx.resume();
  }

  function env(g, t, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function noiseHit(t, freq, type, peak, dur) {
    const s = ctx.createBufferSource(); s.buffer = noise;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ctx.createGain(); env(g, t, peak, dur);
    s.connect(f); f.connect(g); g.connect(ctx.destination);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  function tone(t, f0, f1, peak, dur, type) {
    const o = ctx.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain(); env(g, t, peak, dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function voice(name, t) {
    if (muted) return;
    const n = name.toLowerCase();
    if (/kick|bass|bd/.test(n)) tone(t, 150, 40, 0.9, 0.35);
    else if (/snare|clap|sd/.test(n)) { noiseHit(t, 1800, "highpass", 0.5, 0.18); tone(t, 220, 140, 0.35, 0.1, "triangle"); }
    else if (/open/.test(n)) noiseHit(t, 7000, "highpass", 0.25, 0.3);
    else if (/hat|hh|hi/.test(n)) noiseHit(t, 7500, "highpass", 0.22, 0.05);
    else if (/tom/.test(n)) tone(t, 200, 90, 0.6, 0.25);
    else tone(t, 660, 600, 0.3, 0.12, "square");
  }

  function schedule() {
    while (nextTime < ctx.currentTime + 0.12) {
      if (steps) {
        const s = step % steps;
        pat.forEach((row, i) => { if (row[s]) voice(names[i], nextTime); });
        queue.push({ s, t: nextTime });
        step = (s + 1) % steps;
      }
      nextTime += 60 / bpm / 4;
    }
  }
  function frame() {
    if (!playing) return;
    while (queue.length && queue[0].t <= ctx.currentTime) markNow(queue.shift().s);
    requestAnimationFrame(frame);
  }
  function start() {
    ensureCtx(); playing = true; step = 0; queue = [];
    nextTime = ctx.currentTime + 0.05;
    timer = setInterval(schedule, 25); schedule();
    requestAnimationFrame(frame); setPlayBtn();
  }
  function stop() {
    playing = false; clearInterval(timer); timer = null; queue = [];
    markNow(-1); setPlayBtn();
  }
  $("play").onclick = () => (playing ? stop() : start());
  $("mute").onclick = () => { muted = !muted; $("mute").setAttribute("aria-pressed", muted); $("mute").textContent = muted ? "Muted" : "Mute"; };
  $("bpm").onchange = () => {
    const v = Math.max(40, Math.min(240, parseInt($("bpm").value, 10) || 120));
    bpm = v; $("bpm").value = v; amber.store.set("bpm", v);
  };
  document.addEventListener("visibilitychange", () => { if (document.hidden && playing) stop(); });

  let first = true;
  amber.onChange((note, data) => {
    read(note);
    if (first) {
      first = false;
      const saved = data && data.values && data.values.bpm;
      const m = /(\d{2,3})\s*bpm/i.exec(note.markdown || "");
      bpm = +saved || (m ? +m[1] : 120);
      $("bpm").value = bpm; setPlayBtn();
    }
    render();
  });
</script>
</body>
</html>
