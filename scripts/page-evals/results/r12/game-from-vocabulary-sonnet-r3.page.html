<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  main { max-width: 760px; margin: 0 auto; padding: 16px var(--amber-gutter) 48px; }
  h1 { font-size: 1.6rem; letter-spacing: -.02em; margin: 4px 0 4px; font-family: var(--amber-font-rounded); }
  .muted { color: var(--amber-text-secondary); font-size: .9rem; }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 18px; margin-top: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .stat { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius-small); padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 1.4rem; font-variant-numeric: tabular-nums; font-family: var(--amber-font-rounded); }
  .stat span { font-size: .8rem; color: var(--amber-text-secondary); }
  button { font: inherit; font-weight: 600; min-height: 48px; padding: 0 18px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-accent-soft); color: var(--amber-accent-text); border: 2px solid var(--amber-accent); cursor: pointer; }
  button.ghost { background: var(--amber-fill); color: var(--amber-text); }
  .big { width: 100%; min-height: 60px; font-size: 1.2rem; margin-top: 16px; }
  .hud { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; margin-top: 8px; }
  .score { font-size: 1.5rem; font-weight: 700; font-family: var(--amber-font-rounded); }
  .combo { font-weight: 700; color: var(--amber-accent-text); min-height: 1.4em; }
  .bar { height: 12px; border-radius: 6px; background: var(--amber-fill); overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--amber-accent); transform-origin: left; }
  .bar.low i { background: var(--amber-danger); }
  .prompt { text-align: center; padding: 28px 12px; }
  .prompt small { display: block; color: var(--amber-text-secondary); margin-bottom: 6px; font-size: .85rem; }
  .prompt div { font-size: clamp(1.8rem, 8vw, 2.6rem); font-weight: 700; font-family: var(--amber-font-rounded); overflow-wrap: anywhere; }
  .choices { display: grid; gap: 10px; }
  .choices button { border-width: 2px; background: var(--amber-surface); color: var(--amber-text); border: 2px solid var(--amber-separator); min-height: 58px; font-size: 1.05rem; text-align: left; padding: 8px 16px; display: flex; gap: 12px; align-items: center; }
  .choices button kbd { font: inherit; font-size: .8rem; color: var(--amber-text-secondary); min-width: 1ch; }
  .choices button.right { border-color: var(--amber-accent); background: var(--amber-accent-soft); }
  .choices button.wrong { border-color: var(--amber-danger); }
  .choices button.wrong::after { content: "✗"; margin-left: auto; color: var(--amber-danger); }
  .choices button.right::after { content: "✓"; margin-left: auto; color: var(--amber-accent-text); }
  .shake { animation: shake .25s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
  .center { text-align: center; }
  .final { font-size: 3rem; font-weight: 800; font-family: var(--amber-font-rounded); color: var(--amber-accent-text); }
  ul.miss { list-style: none; padding: 0; margin: 10px 0 0; text-align: left; }
  ul.miss li { padding: 8px 0; border-top: 1px solid var(--amber-separator); display: flex; justify-content: space-between; gap: 12px; }
  .row2 { display: flex; gap: 10px; margin-top: 14px; }
  .row2 button { flex: 1; }
  @media (min-width: 900px) { main { max-width: 980px; padding-top: 32px; } .choices { grid-template-columns: 1fr 1fr; } .prompt { padding: 48px 12px; } .stat b { font-size: 1.8rem; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const app = document.getElementById("app");
const ROUND = 60, PENALTY = 3;
let words = [], title = "Spanish verbs", today = "";
let stats = { best: 0, streak: 0, last: "", plays: 0, miss: {} };
let g = null, phase = "menu", raf = 0, lastT = 0, locked = false, msg = "";

function readNote(note) {
  title = note.title || title; today = note.today;
  const t = note.tables.find(t => t.columns.length >= 2) ;
  words = [];
  if (t) {
    let a = t.columns.findIndex(c => /spanish/i.test(c.name)), b = t.columns.findIndex(c => /english/i.test(c.name));
    if (a < 0) a = 0; if (b < 0 || b === a) b = a === 0 ? 1 : 0;
    t.rows.forEach(r => { const s = (r[a] || "").trim(), e = (r[b] || "").trim(); if (s && e) words.push({ s, e }); });
  }
}
function readStats(data) {
  const s = (data && data.values && data.values.stats) || {};
  stats = { best: s.best || 0, streak: s.streak || 0, last: s.last || "", plays: s.plays || 0, miss: s.miss || {} };
}
function saveStats() { amber.store.set("stats", stats); }
function dayBefore(d) { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() - 1); return x.toISOString().slice(0, 10); }
function liveStreak() { return (stats.last === today || stats.last === dayBefore(today)) ? stats.streak : 0; }

function menu() {
  phase = "menu";
  const weak = words.filter(w => (stats.miss[w.s] || 0) > 0).sort((a, b) => stats.miss[b.s] - stats.miss[a.s]).slice(0, 3);
  app.innerHTML = `<h1>${esc(title)}</h1>
  <div class="muted">${ROUND} seconds. Pick the right translation. Chain correct answers to build a combo.</div>
  <div class="stats">
    <div class="stat"><b>${stats.best}</b><span>Best score</span></div>
    <div class="stat"><b>${liveStreak()}</b><span>Day streak</span></div>
    <div class="stat"><b>${words.length}</b><span>Verbs</span></div>
  </div>
  ${stats.last === today ? `<p class="muted center">You've played today. Another round?</p>` : ""}
  ${weak.length ? `<div class="card"><div class="muted">Tricky verbs (they come up more often)</div><ul class="miss">${weak.map(w => `<li><span>${esc(w.s)}</span><span class="muted">${esc(w.e)}</span></li>`).join("")}</ul></div>` : ""}
  ${words.length < 4 ? `<div class="card center muted">Add at least 4 rows to the Spanish | English table in the note to play.</div>` :
  `<button class="big" id="go">Start</button>`}`;
  const go = document.getElementById("go"); if (go) go.onclick = start;
}

function start() {
  g = { time: ROUND, score: 0, combo: 0, maxCombo: 0, right: 0, wrong: 0, missed: [], q: null, prev: null };
  phase = "play"; locked = false; msg = "";
  app.innerHTML = `<h1>${esc(title)}</h1>
  <div class="hud"><span class="score" id="sc">0</span><span class="combo" id="cb"></span><span class="muted" id="tm"></span></div>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <div id="q"></div>`;
  nextQ(); lastT = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
}

function pickWord() {
  const pool = words.filter(w => w !== g.prev);
  const wts = pool.map(w => 1 + 2 * (stats.miss[w.s] || 0));
  let r = Math.random() * wts.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= wts[i]; if (r <= 0) return pool[i]; }
  return pool[0];
}
function nextQ() {
  const w = pickWord(); g.prev = w;
  const toEn = Math.random() < 0.5;
  const ans = toEn ? w.e : w.s;
  const opts = [ans];
  const others = words.filter(x => x !== w).sort(() => Math.random() - .5);
  for (const o of others) { const t = toEn ? o.e : o.s; if (!opts.includes(t) && opts.length < 4) opts.push(t); }
  opts.sort(() => Math.random() - .5);
  g.q = { w, toEn, ans, opts };
  locked = false;
  document.getElementById("q").innerHTML = `<div class="card prompt"><small>${toEn ? "What does this mean?" : "How do you say it in Spanish?"}</small><div>${esc(toEn ? w.s : w.e)}</div></div>
  <div class="choices">${opts.map((o, i) => `<button data-i="${i}"><kbd>${i + 1}</kbd><span>${esc(o)}</span></button>`).join("")}</div>`;
  document.querySelectorAll(".choices button").forEach(b => b.onclick = () => answer(+b.dataset.i));
}
function hud() {
  document.getElementById("sc").textContent = g.score;
  const mult = 1 + Math.min(4, Math.floor(g.combo / 3));
  document.getElementById("cb").textContent = g.combo >= 3 ? `Combo ×${mult}` : "";
}
function answer(i) {
  if (locked || phase !== "play") return;
  locked = true;
  const q = g.q, btns = document.querySelectorAll(".choices button");
  const ok = q.opts[i] === q.ans;
  if (ok) {
    const mult = 1 + Math.min(4, Math.floor(g.combo / 3));
    g.score += 10 * mult; g.combo++; g.right++; g.maxCombo = Math.max(g.maxCombo, g.combo);
    if (stats.miss[q.w.s]) { stats.miss[q.w.s]--; if (!stats.miss[q.w.s]) delete stats.miss[q.w.s]; }
    btns[i].classList.add("right");
  } else {
    g.combo = 0; g.wrong++; g.time -= PENALTY;
    stats.miss[q.w.s] = Math.min(5, (stats.miss[q.w.s] || 0) + 1);
    if (!g.missed.find(m => m.s === q.w.s)) g.missed.push(q.w);
    btns[i].classList.add("wrong", "shake"); btns[q.opts.indexOf(q.ans)].classList.add("right");
  }
  hud();
  setTimeout(() => { if (phase === "play") { if (g.time <= 0) end(); else nextQ(); } }, ok ? 300 : 900);
}
function tick(t) {
  if (phase !== "play") return;
  if (document.visibilityState === "hidden") { lastT = 0; raf = requestAnimationFrame(tick); return; }
  if (lastT) g.time -= Math.min(0.25, (t - lastT) / 1000);
  lastT = t;
  if (g.time <= 0) { g.time = 0; paint(); if (!locked) { end(); return; } }
  paint(); raf = requestAnimationFrame(tick);
}
function paint() {
  const f = document.getElementById("fill"); if (!f) return;
  f.style.transform = `scaleX(${Math.max(0, g.time / ROUND)})`;
  document.getElementById("bar").classList.toggle("low", g.time < 10);
  document.getElementById("tm").textContent = Math.ceil(Math.max(0, g.time)) + "s";
}
function end() {
  if (phase !== "play") return;
  phase = "end"; cancelAnimationFrame(raf);
  const newBest = g.score > stats.best;
  if (newBest) stats.best = g.score;
  if (stats.last !== today) { stats.streak = stats.last === dayBefore(today) ? stats.streak + 1 : 1; stats.last = today; }
  stats.plays++; saveStats();
  const total = g.right + g.wrong;
  app.innerHTML = `<h1>${esc(title)}</h1>
  <div class="card center"><div class="muted">${newBest ? "New best score!" : "Time's up"}</div>
  <div class="final">${g.score}</div>
  <div class="muted">${g.right} of ${total} right · best combo ${g.maxCombo} · ${liveStreak()}-day streak</div>
  ${g.missed.length ? `<ul class="miss">${g.missed.map(w => `<li><span>${esc(w.s)}</span><span class="muted">${esc(w.e)}</span></li>`).join("")}</ul>` : `<p>A clean round, no misses.</p>`}</div>
  <div class="row2"><button id="again">Play again</button><button class="ghost" id="home">Done</button></div>`;
  document.getElementById("again").onclick = start;
  document.getElementById("home").onclick = menu;
}
document.addEventListener("keydown", e => {
  if (phase === "play" && /^[1-4]$/.test(e.key)) answer(+e.key - 1);
  else if ((e.key === "Enter") && phase !== "play" && words.length >= 4) start();
});
amber.onChange((note, data) => {
  readNote(note);
  if (phase === "play") return;
  readStats(data);
  if (phase === "menu") menu();
});
</script>
</body>
</html>
