<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit tracker</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { -webkit-user-select: none; user-select: none; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 8px var(--amber-gutter) 60px; }
  h1 { font-size: 1.75rem; line-height: 1.1; letter-spacing: -.02em; margin: 6px 0 14px; font-family: var(--amber-font-rounded); }
  .label { font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 22px 4px 8px; }
  .hero { display: flex; align-items: center; gap: 18px; background: var(--amber-accent-soft); border-radius: var(--amber-radius); padding: 16px 18px; }
  .ring { position: relative; width: 92px; height: 92px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .bg { stroke: var(--amber-surface); }
  .ring .fg { stroke: var(--amber-accent); stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.34,1.2,.64,1); }
  .ring .mid { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.4rem; font-weight: 700; font-family: var(--amber-font-rounded); font-variant-numeric: tabular-nums; }
  .hero .msg { flex: 1; min-width: 0; }
  .hero .big { font-size: 1.15rem; font-weight: 650; font-family: var(--amber-font-rounded); }
  .hero .small { color: var(--amber-text-secondary); font-size: .9rem; margin-top: 2px; }
  .xp { height: 8px; border-radius: 4px; background: var(--amber-surface); margin-top: 10px; overflow: hidden; }
  .xp div { height: 100%; background: var(--amber-accent); border-radius: 4px; transition: width .5s; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .tile { position: relative; border: 2px solid transparent; background: var(--amber-surface); color: inherit; font: inherit; border-radius: var(--amber-radius); padding: 14px; text-align: left; cursor: pointer; min-height: 150px; display: flex; flex-direction: column; gap: 4px; transition: transform .15s, background .2s, border-color .2s; }
  .tile:active { transform: scale(.96); }
  .tile.done { background: var(--amber-accent); color: var(--amber-on-accent); }
  .tile .emo { font-size: 2.2rem; line-height: 1; transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
  .tile.done .emo { transform: scale(1.15) rotate(-8deg); }
  .tile .nm { font-size: 1.1rem; font-weight: 650; font-family: var(--amber-font-rounded); margin-top: 6px; }
  .tile .st { font-size: .85rem; opacity: .85; display: flex; gap: 4px; align-items: center; }
  .tile .wk { margin-top: auto; display: flex; gap: 4px; }
  .tile .wk i { width: 14px; height: 14px; border-radius: 50%; background: var(--amber-fill); }
  .tile .wk i.on { background: var(--amber-accent); }
  .tile.done .wk i { background: rgba(255,255,255,.35); }
  .tile.done .wk i.on { background: var(--amber-on-accent); }
  .tile .badge { position: absolute; top: 10px; right: 12px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--amber-separator); display: grid; place-items: center; font-weight: 800; }
  .tile.done .badge { background: var(--amber-on-accent); border-color: var(--amber-on-accent); color: var(--amber-accent-text); }
  .pop { animation: pop .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0% { transform: scale(.88); } 100% { transform: scale(1); } }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .bdg { display: flex; align-items: center; gap: 8px; background: var(--amber-surface); border-radius: 999px; padding: 8px 14px 8px 10px; font-size: .9rem; }
  .bdg.off { opacity: .45; filter: grayscale(1); }
  .bdg b { font-size: 1.2rem; font-weight: 400; }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); padding: 14px; overflow-x: auto; }
  .row { display: grid; grid-template-columns: 76px repeat(var(--days), minmax(0, 1fr)); gap: 4px; align-items: center; margin-bottom: 5px; }
  .row .h { font-size: .8rem; color: var(--amber-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell { aspect-ratio: 1; border-radius: 5px; background: var(--amber-fill); }
  .cell.on { background: var(--amber-accent); }
  .cell.today { box-shadow: inset 0 0 0 2px var(--amber-accent-text); }
  .days .cell { background: none; font-size: .75rem; color: var(--amber-text-secondary); text-align: center; aspect-ratio: auto; }
  .err { color: var(--amber-danger); font-size: .9rem; text-align: center; min-height: 1.2em; margin-top: 8px; }
  .empty { padding: 30px 18px; text-align: center; color: var(--amber-text-secondary); background: var(--amber-surface); border-radius: var(--amber-radius); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  @media (min-width: 900px) { .tiles { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } h1 { font-size: 2.1rem; } .ring { width: 120px; height: 120px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
  const DONE = /^(✓|✔|x|yes|y|1|true|done)$/i;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const pad = (n) => String(n).padStart(2, "0");
  const dayOf = (iso, delta) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + delta); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const EMOJI = [[/walk|run|jog|step/i, "🚶"], [/read|book/i, "📖"], [/stretch|yoga|mobil/i, "🧘"], [/water|drink/i, "💧"], [/med|mind/i, "🧠"], [/sleep|bed/i, "😴"], [/write|journal/i, "✍️"], [/gym|lift|workout|exercise/i, "💪"], [/code|study|learn/i, "🎓"], [/eat|veg|fruit|cook/i, "🥗"]];
  const emoji = (n) => (EMOJI.find(([r]) => r.test(n)) || [0, "⭐"])[1];
  const flame = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8.6 1c.4 2.2-.5 3.4-1.6 4.6C5.8 6.9 4 8.6 4 11a4 4 0 0 0 8 0c0-1.7-.8-2.9-1.5-3.8-.1 1-.6 1.8-1.4 2.2.5-2.8-.3-6.4-.5-8.4Z"/></svg>';
  let popped = null, error = "";

  // confetti
  const cv = document.getElementById("fx"), cx = cv.getContext("2d");
  let parts = [], raf = 0;
  function burst(x, y, n) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    cv.width = innerWidth; cv.height = innerHeight;
    const cols = ["#f5a623", "#ff6b6b", "#4ecdc4", "#6c7aff", "#ffd93d", "#9b5de5"];
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5, r: 3 + Math.random() * 4, c: cols[i % cols.length], life: 70 + Math.random() * 40, rot: Math.random() * 6 }); }
    if (!raf) raf = requestAnimationFrame(step);
  }
  function step() {
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter((p) => p.life-- > 0);
    for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += .35; p.vx *= .985; p.rot += .2; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore(); }
    raf = parts.length ? requestAnimationFrame(step) : 0;
  }

  function model(note) {
    const t = note.tables.find((t) => t.columns.some((c) => /^(date|day)$/i.test(c.name)));
    if (!t) return null;
    const dc = t.columns.findIndex((c) => /^(date|day)$/i.test(c.name));
    const habits = t.columns.map((c, i) => ({ name: c.name, col: i })).filter((h) => h.col !== dc);
    const byDay = new Map(t.rows.map((r, i) => [r[dc], { cells: r, index: i }]));
    const done = (day, h) => { const r = byDay.get(day); return !!r && DONE.test(String(r.cells[h.col] || "").trim()); };
    let total = 0, perfect = 0, bestAll = 0;
    for (const r of t.rows) { let c = 0; habits.forEach((h) => { if (DONE.test(String(r[h.col] || "").trim())) c++; }); total += c; if (habits.length && c === habits.length) perfect++; }
    for (const h of habits) {
      let d = done(note.today, h) ? note.today : dayOf(note.today, -1), n = 0;
      while (done(d, h)) { n++; d = dayOf(d, -1); }
      h.streak = n; h.today = done(note.today, h);
      let best = 0, run = 0;
      for (let i = -89; i <= 0; i++) { if (done(dayOf(note.today, i), h)) { run++; best = Math.max(best, run); } else run = 0; }
      h.best = best; bestAll = Math.max(bestAll, best);
    }
    return { t, dc, habits, byDay, done, total, perfect, bestAll };
  }

  function render(note) {
    const app = document.getElementById("app");
    const m = model(note);
    if (!m) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="empty">Add a table with a Date column and one column per habit.</div>`; return; }
    const H = m.habits, nDone = H.filter((h) => h.today).length, all = H.length && nDone === H.length;
    const pct = H.length ? nDone / H.length : 0, C = 2 * Math.PI * 40;
    const level = Math.floor(m.total / 10) + 1, xp = (m.total % 10) * 10;
    const maxStreak = Math.max(0, ...H.map((h) => h.streak));
    const msg = all ? ["Perfect day! 🎉", "Everything's done. Go enjoy it."] : nDone ? ["Nice, keep going 🔥", `${H.length - nDone} left today`] : ["Fresh day ☀️", "Tap a habit to get rolling"];
    const span = innerWidth >= 900 ? 28 : 14;
    const days = Array.from({ length: span }, (_, i) => dayOf(note.today, i - (span - 1)));
    const wk = Array.from({ length: 7 }, (_, i) => dayOf(note.today, i - 6));
    const badges = [
      ["🔥", "3-day streak", maxStreak >= 3], ["🚀", "7-day streak", maxStreak >= 7], ["🌟", "Perfect day", m.perfect > 0],
      ["🏅", "3 perfect days", m.perfect >= 3], ["💯", "50 ticks", m.total >= 50], ["👑", "Level 5", level >= 5]];
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="hero">
        <div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="40" fill="none" stroke-width="12"/><circle class="fg" cx="50" cy="50" r="40" fill="none" stroke-width="12" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/></svg><div class="mid" aria-label="${nDone} of ${H.length} done today">${nDone}/${H.length}</div></div>
        <div class="msg"><div class="big">${msg[0]}</div><div class="small">${msg[1]}</div>
          <div class="small" style="margin-top:8px">Level ${level} · ${m.total} ticks</div><div class="xp" role="img" aria-label="${xp}% to next level"><div style="width:${xp}%"></div></div></div>
      </div>
      <div class="label">Today</div>
      <div class="tiles">${H.map((h, i) => `
        <button class="tile ${h.today ? "done" : ""} ${popped === i ? "pop" : ""}" data-i="${i}" aria-pressed="${h.today}">
          <span class="badge" aria-hidden="true">${h.today ? "✓" : ""}</span>
          <span class="emo" aria-hidden="true">${emoji(h.name)}</span>
          <span class="nm">${esc(h.name)}</span>
          <span class="st">${h.streak ? flame + h.streak + (h.streak === 1 ? " day" : " days in a row") : "Start a streak"}</span>
          <span class="wk" aria-hidden="true">${wk.map((d) => `<i class="${m.done(d, h) ? "on" : ""}"></i>`).join("")}</span>
        </button>`).join("")}</div>
      <div class="err" role="alert">${esc(error)}</div>
      <div class="label">Badges</div>
      <div class="badges">${badges.map(([e, t, on]) => `<div class="bdg ${on ? "" : "off"}"><b aria-hidden="true">${e}</b>${t}${on ? "" : " (locked)"}</div>`).join("")}</div>
      <div class="label">${span === 28 ? "Last four weeks" : "Last two weeks"}</div>
      <div class="card" role="img" aria-label="Habit history grid"><div class="row days" style="--days:${span}"><div></div>${days.map((d) => `<div class="cell">${"SMTWTFS"[new Date(d + "T12:00:00").getDay()]}</div>`).join("")}</div>
        ${H.map((h) => `<div class="row" style="--days:${span}"><div class="h">${esc(h.name)}</div>${days.map((d) => `<div class="cell ${m.done(d, h) ? "on" : ""} ${d === note.today ? "today" : ""}"></div>`).join("")}</div>`).join("")}</div>`;
    popped = null;
    app.querySelectorAll(".tile").forEach((el) => el.addEventListener("click", (e) => toggle(m, H[+el.dataset.i], +el.dataset.i, el)));
  }

  async function toggle(m, h, i, el) {
    const row = m.byDay.get(amber.note.today);
    const value = h.today ? "" : "✓";
    const rect = el.getBoundingClientRect();
    if (!h.today) {
      const willAll = m.habits.filter((x) => x.today).length + 1 === m.habits.length;
      willAll ? (burst(innerWidth / 2, innerHeight / 3, 160), burst(rect.left + rect.width / 2, rect.top + 30, 60)) : burst(rect.left + rect.width / 2, rect.top + 30, 40);
    }
    popped = i;
    const r = row
      ? await amber.update({ op: "set_cell", table: m.t.index, row: row.index, col: h.name, value })
      : await amber.update({ op: "append_row", table: m.t.index, values: { [m.t.columns[m.dc].name]: amber.note.today, [h.name]: value } });
    error = r.ok ? "" : r.error;
    if (!r.ok) render(amber.note);
  }

  amber.onChange(render);
  let wide = innerWidth >= 900;
  addEventListener("resize", () => { if ((innerWidth >= 900) !== wide) { wide = !wide; render(amber.note); } });
</script>
</body>
</html>
