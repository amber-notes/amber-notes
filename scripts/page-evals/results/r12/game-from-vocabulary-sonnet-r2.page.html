<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
main{max-width:640px;margin:0 auto;padding:16px var(--amber-gutter) 48px}
h1{font-size:1.6rem;letter-spacing:-.02em;margin:4px 0 12px}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:18px}
.muted{color:var(--amber-text-secondary);font-size:.9rem}
.stats{display:flex;gap:8px;margin:12px 0}
.stat{flex:1;background:var(--amber-fill);border-radius:var(--amber-radius-small);padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--amber-text-secondary)}
button{font:inherit;font-weight:600;color:var(--amber-text);background:var(--amber-fill);border:2px solid transparent;border-radius:var(--amber-radius-small);min-height:52px;padding:10px 14px;cursor:pointer;text-align:left}
button.primary{background:var(--amber-text);color:var(--amber-bg);text-align:center;width:100%;min-height:56px;font-size:1.1rem;margin-top:8px}
.hud{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums;font-weight:600;margin-bottom:8px}
.combo{color:var(--amber-accent-text)}
.bar{height:10px;border-radius:5px;background:var(--amber-fill);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:100%;background:var(--amber-accent);transform-origin:left}
.dots{display:flex;gap:4px;margin-bottom:12px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--amber-fill)}
.dots i.ok{background:var(--amber-accent)}
.dots i.bad{background:var(--amber-danger)}
.dots i.cur{outline:2px solid var(--amber-text-secondary);outline-offset:1px}
.q{text-align:center;padding:22px 8px}
.q small{display:block;color:var(--amber-text-secondary);margin-bottom:6px}
.q div{font-size:2.1rem;font-weight:700;font-family:var(--amber-font-rounded);overflow-wrap:anywhere}
.opts{display:grid;gap:10px;margin-top:14px}
.opts button .k{opacity:.6;margin-right:8px;font-variant-numeric:tabular-nums}
.opts button.right{border-color:var(--amber-accent);background:var(--amber-accent-soft)}
.opts button.wrong{border-color:var(--amber-danger)}
.opts button.wrong::after{content:" ✕";color:var(--amber-danger)}
.opts button.right::after{content:" ✓"}
.fb{min-height:1.4em;text-align:center;margin-top:10px;font-weight:600}
.big{font-size:3rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;font-family:var(--amber-font-rounded)}
.center{text-align:center}
ul.miss{margin:8px 0 0;padding:0;list-style:none}
ul.miss li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--amber-separator)}
.board{display:block}
@media (min-width:900px){main{max-width:980px}.board{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}.board .opts{margin-top:0}.q div{font-size:3rem}.card.center{max-width:560px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const ROUND=10, TIME=10000;
let deck=[], title="", screen="start", g=null, raf=0, last=0;
const app=document.getElementById("app");

function loadDeck(note){
  title=note.title;
  const t=note.tables.find(t=>t.columns.length>=2)||null;
  deck=t?t.rows.map(r=>({es:(r[0]||"").trim(),en:(r[1]||"").trim()})).filter(c=>c.es&&c.en):[];
}
function store(){const v=(amber.data&&amber.data.values)||{};return{best:v.best||0,days:v.days||[],plays:v.plays||0}}
function streak(days){
  const set=new Set(days);let d=new Date(amber.note.today+"T12:00:00");let n=0;
  if(!set.has(amber.note.today))d.setDate(d.getDate()-1);
  while(set.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}
  return n;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function start(){
  const cards=shuffle(deck).slice(0,ROUND);
  g={queue:cards.map(c=>({c,dir:Math.random()<.5?"es":"en"})),i:0,score:0,combo:0,maxCombo:0,right:0,res:[],miss:[],locked:false,left:TIME,opts:[],fb:""};
  screen="play";next(true);
}
function next(first){
  const q=g.queue[g.i];
  const others=shuffle(deck.filter(c=>c!==q.c&&c.es!==q.c.es)).slice(0,3);
  const ans=q.dir==="es"?"en":"es";
  g.opts=shuffle([q.c,...others]).map(c=>({text:c[ans],ok:c===q.c,cls:""}));
  g.locked=false;g.left=TIME;g.fb="";
  renderPlay();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
}
function tick(now){
  if(screen!=="play"||g.locked)return;
  if(document.visibilityState==="hidden"){last=now;raf=requestAnimationFrame(tick);return}
  g.left-=Math.min(now-last,100);last=now;
  const b=document.getElementById("bar");
  if(g.left<=0){b&&(b.style.transform="scaleX(0)");answer(-1);return}
  if(b)b.style.transform="scaleX("+(g.left/TIME)+")";
  raf=requestAnimationFrame(tick);
}
function answer(k){
  if(g.locked)return;g.locked=true;
  const q=g.queue[g.i];const o=g.opts[k];
  const ok=!!(o&&o.ok);
  g.opts.forEach(x=>{if(x.ok)x.cls="right"});
  if(ok){
    g.combo++;g.maxCombo=Math.max(g.maxCombo,g.combo);g.right++;
    const gain=Math.round((10+Math.ceil(g.left/1000))*(1+Math.min(g.combo-1,4)*.5));
    g.score+=gain;g.res.push("ok");g.fb="+"+gain+(g.combo>1?" · combo x"+g.combo:"");
  }else{
    if(o)o.cls="wrong";
    g.combo=0;g.res.push("bad");g.miss.push(q.c);
    g.fb=k<0?"Time's up":"Not quite";
  }
  renderPlay();
  setTimeout(()=>{if(screen!=="play")return;g.i++;if(g.i>=g.queue.length)finish();else next()},ok?700:1500);
}
function finish(){
  screen="end";cancelAnimationFrame(raf);
  const s=store();const days=s.days.includes(amber.note.today)?s.days:[...s.days,amber.note.today].slice(-400);
  g.newBest=g.score>s.best;
  amber.setData({values:{best:Math.max(s.best,g.score),days,plays:s.plays+1}});
  renderEnd();
}
function renderStart(){
  const s=store();
  if(deck.length<2){app.innerHTML=`<h1>${esc(title)}</h1><div class="card center muted">Add at least 2 rows (Spanish | English) to the note's table to play.</div>`;return}
  const st=streak(s.days);
  app.innerHTML=`<h1>${esc(title)}</h1>
  <div class="card center"><div class="big" aria-hidden="true">¡Vamos!</div>
  <p class="muted">${Math.min(ROUND,deck.length)} questions · 10 seconds each · quick, correct answers and streaks score more. Keys 1–4 work too.</p>
  <div class="stats"><div class="stat"><b>${st}</b><span>day streak</span></div><div class="stat"><b>${s.best}</b><span>best score</span></div><div class="stat"><b>${deck.length}</b><span>verbs</span></div></div>
  <button class="primary" id="go">${s.days.includes(amber.note.today)?"Play again":"Play today's round"}</button></div>`;
  document.getElementById("go").onclick=start;
}
function renderPlay(){
  const q=g.queue[g.i];
  const prompt=q.dir==="es"?q.c.es:q.c.en;
  const dots=g.queue.map((_,i)=>`<i class="${g.res[i]||""} ${i===g.i?"cur":""}"></i>`).join("");
  app.innerHTML=`<h1>${esc(title)}</h1>
  <div class="hud"><span>Score ${g.score}</span><span class="combo">${g.combo>1?"Combo x"+g.combo:""}</span><span>${g.i+1}/${g.queue.length}</span></div>
  <div class="dots" role="img" aria-label="Question ${g.i+1} of ${g.queue.length}, ${g.right} correct">${dots}</div>
  <div class="bar" role="img" aria-label="Time left"><i id="bar" style="transform:scaleX(${g.left/TIME})"></i></div>
  <div class="board"><div class="card q"><small>${q.dir==="es"?"What does it mean?":"How do you say it in Spanish?"}</small><div>${esc(prompt)}</div></div>
  <div class="opts">${g.opts.map((o,i)=>`<button data-k="${i}" class="${o.cls}" ${g.locked?"disabled":""}><span class="k">${i+1}</span>${esc(o.text)}</button>`).join("")}</div></div>
  <div class="fb" role="status">${esc(g.fb)}</div>`;
  app.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
function renderEnd(){
  const s=store();
  const msg=g.right===g.queue.length?"Perfecto!":g.right>=g.queue.length*.7?"¡Muy bien!":"Keep going, you're learning";
  app.innerHTML=`<h1>${esc(title)}</h1>
  <div class="card center"><div class="muted">${msg}</div><div class="big">${g.score}</div>
  <div class="muted">${g.newBest?"New best score!":"Best: "+Math.max(s.best,g.score)}</div>
  <div class="stats"><div class="stat"><b>${g.right}/${g.queue.length}</b><span>correct</span></div><div class="stat"><b>x${g.maxCombo}</b><span>best combo</span></div><div class="stat"><b>${streak(s.days.includes(amber.note.today)?s.days:[...s.days,amber.note.today])}</b><span>day streak</span></div></div>
  ${g.miss.length?`<div style="text-align:left"><b>Review these</b><ul class="miss">${g.miss.map(c=>`<li><span>${esc(c.es)}</span><span class="muted">${esc(c.en)}</span></li>`).join("")}</ul></div>`:""}
  <button class="primary" id="go">Play again</button></div>`;
  document.getElementById("go").onclick=start;
}
document.addEventListener("keydown",e=>{
  if(screen==="play"&&/^[1-4]$/.test(e.key)){answer(+e.key-1)}
  else if(e.key==="Enter"&&screen!=="play"){const b=document.getElementById("go");b&&b.click()}
});
amber.onChange(note=>{loadDeck(note);if(screen==="start")renderStart();else if(screen==="end"&&!g)renderStart()});
</script>
</body>
</html>
