<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink: var(--amber-text); --muted: var(--amber-text-secondary); --line: rgba(90,60,30,.18); --accent: #7a2e2e; --accent-ink: #fff; --card: #f7f1e6; --star: #9a6b00; }
  @media (prefers-color-scheme: dark) { :root { --line: rgba(255,235,210,.14); --accent: #e8a0a0; --accent-ink: #2a0d0d; --card: #24201b; --star: #f2c14e; } }
  * { box-sizing: border-box; }
  body { padding: 20px 18px 56px; max-width: 760px; margin: 0 auto; }
  h1, .stat b, .cover .ct { font-family: ui-serif, 'New York', Georgia, serif; }
  h1 { font-size: 30px; letter-spacing: -.02em; margin: 4px 0 14px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 24px 4px 8px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat, .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .stat { padding: 12px; }
  .stat b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }
  .chart { display: flex; align-items: end; gap: 8px; height: 130px; padding: 14px 14px 0; }
  .m { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: end; gap: 4px; height: 100%; min-width: 0; }
  .m .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .m .b { width: 100%; max-width: 44px; border-radius: 5px 5px 0 0; background: var(--accent); min-height: 3px; }
  .m .l { font-size: 12px; color: var(--muted); padding-bottom: 8px; }
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
  .book { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .cover { aspect-ratio: 2/3; border-radius: 4px 10px 10px 4px; padding: 14px 12px 12px 18px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; position: relative; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,.22); }
  .cover::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: rgba(0,0,0,.22); }
  .cover .ct { font-size: 17px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .cover .ca { font-size: 12px; border-top: 1px solid rgba(255,255,255,.5); padding-top: 6px; overflow-wrap: anywhere; }
  .meta { font-size: 13px; color: var(--muted); padding: 4px 2px 0; }
  .stars { color: var(--star); letter-spacing: 1px; font-size: 15px; }
  .empty { padding: 24px 16px; text-align: center; color: var(--muted); }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
  input, select { font: inherit; font-size: 16px; color: var(--ink); background: var(--amber-field); border: 1px solid var(--amber-field-border); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; }
  button { grid-column: 1 / -1; font: inherit; font-weight: 600; min-height: 44px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); }
  .err { color: var(--amber-danger); padding: 0 16px 12px; min-height: 1em; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const col = (t, re) => t.columns.findIndex((c) => re.test(c.name));
  const hue = (s) => [...String(s)].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) % 360, 7);
  let error = "";
  function render(note) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => col(t, /^(title|book)$/i) >= 0);
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="panel empty">Add a table with Title, Author, Finished and Rating columns.</div>`; return; }
    const ti = col(t, /^(title|book)$/i), au = col(t, /author/i), fi = col(t, /finish|date/i), ra = col(t, /rating|stars/i);
    const books = t.rows.map((r) => ({ title: r[ti], author: r[au] || "", date: r[fi] || "", rating: parseFloat(r[ra]) }));
    const rated = books.filter((b) => Number.isFinite(b.rating));
    const avg = rated.length ? rated.reduce((s, b) => s + b.rating, 0) / rated.length : 0;
    const year = note.today.slice(0, 4);
    const months = Array.from({ length: 6 }, (_, k) => { const d = new Date(note.today.slice(0, 7) + "-15T12:00:00Z"); d.setUTCMonth(d.getUTCMonth() - 5 + k); return d.toISOString().slice(0, 7); });
    const per = months.map((m) => books.filter((b) => b.date.startsWith(m)).length);
    const top = Math.max(1, ...per);
    const stars = (n) => Number.isFinite(n) ? `<span class="stars" role="img" aria-label="${n} out of 5 stars">${"★".repeat(Math.round(n))}${"☆".repeat(5 - Math.round(n))}</span>` : "";
    const sorted = books.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="stats">
        <div class="stat"><b>${books.length}</b><span>books</span></div>
        <div class="stat"><b>${books.filter((b) => b.date.startsWith(year)).length}</b><span>in ${year}</span></div>
        <div class="stat"><b>${rated.length ? avg.toFixed(1) : "–"}<span style="font-size:15px"> ★</span></b><span>average rating</span></div>
      </div>
      <h2>Books per month</h2>
      <div class="panel chart" role="img" aria-label="Books finished per month: ${months.map((m, k) => `${m} ${per[k]}`).join(", ")}">${months.map((m, k) => `<div class="m"><div class="n">${per[k]}</div><div class="b" style="height:${(80 * per[k]) / top}px"></div><div class="l">${new Date(m + "-15T12:00:00Z").toLocaleString("en", { month: "short" })}</div></div>`).join("")}</div>
      <h2>Shelf</h2>
      <div class="shelf">${sorted.map((b) => { const h = hue(b.title); return `<article class="book"><div class="cover" style="background-color:hsl(${h} 55% 24%);background-image:linear-gradient(155deg,hsl(${h} 55% 28%),hsl(${(h + 40) % 360} 55% 18%))"><div class="ct">${esc(b.title)}</div><div class="ca">${esc(b.author)}</div></div><div class="meta">${stars(b.rating)}<br>${esc(b.date)}</div></article>`; }).join("") || `<div class="panel empty">No books yet.</div>`}</div>
      <h2>Log a book</h2>
      <div class="panel">
        <form id="add">
          <label>Title<input name="title" required></label>
          <label>Author<input name="author"></label>
          <label>Rating<select name="rating"><option value="">–</option>${[5, 4, 3, 2, 1].map((n) => `<option>${n}</option>`).join("")}</select></label>
          <label>Finished<input name="date" type="date" value="${note.today}"></label>
          <button>Add book</button>
        </form>
        <div class="err" role="alert">${esc(error)}</div>
      </div>`;
    document.getElementById("add").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const values = { [t.columns[ti].name]: String(f.get("title")).trim(), [t.columns[au].name]: String(f.get("author") || "").trim(), [t.columns[ra].name]: String(f.get("rating") || ""), [t.columns[fi].name]: String(f.get("date") || amber.note.today) };
      const r = await amber.update({ op: "append_row", table: t.index, values });
      error = r.ok ? "" : r.error;
      render(amber.note);
    };
  }
  amber.onChange(render);
</script>
</body>
</html>
