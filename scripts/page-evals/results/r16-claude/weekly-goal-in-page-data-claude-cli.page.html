<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Habit tracker</title>
<style>
  /* Amber Notes' own colours and type, from the app (--amber-*), so the page looks native. */
  :root {
    --bg: var(--amber-bg); --card: var(--amber-surface); --ink: var(--amber-text); --muted: var(--amber-text-secondary);
    --line: var(--amber-separator); --amber: var(--amber-accent); --amber-soft: var(--amber-accent-soft);
    --amber-ink: var(--amber-accent-text); --empty: var(--amber-fill);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Phone: one column. From 900 px (a Mac window, an iPad): today and the numbers on the left,
     four weeks of history on the right, inside the app's content width. */
  body { -webkit-user-select: none; user-select: none; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 8px var(--amber-gutter) 60px; }
  .layout { display: grid; grid-template-areas: "today" "weekly" "history" "stats"; }
  .weekly { grid-area: weekly; }
  .layout > section { min-width: 0; }
  .today { grid-area: today; } .history { grid-area: history; } .numbers { grid-area: stats; }
  @media (min-width: 900px) {
    .layout { grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); grid-template-areas: "today history" "weekly history" "stats history"; column-gap: 28px; align-items: start; }
    h1 { font-size: 34px; }
  }
  h1 { font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; margin: 6px 0 4px; }
  .sub { color: var(--muted); font-size: 15px; margin-bottom: 22px; }
  .sub b { color: var(--amber-ink); font-weight: 600; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 0 4px 8px; }
  .card { background: var(--card); border-radius: var(--amber-radius); margin-bottom: 22px; overflow: hidden; }
  .habit { min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 0.5px solid var(--line); cursor: pointer; }
  .habit:first-child { border-top: 0; }
  .name { flex: 1; font-size: 17px; }
  .streak { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 4px; }
  .streak.hot { color: var(--amber-ink); font-weight: 600; }
  .streak svg { width: 13px; height: 13px; }
  .check { width: 44px; height: 44px; min-width: 44px; margin: -6px; border-radius: 50%; border: 1.5px solid var(--amber-text-secondary); display: grid; place-items: center; transition: transform .25s cubic-bezier(.34,1.56,.64,1), background .2s; flex: none; }
  .habit.done .check { background: var(--amber); border-color: var(--amber); }
  .check svg { width: 16px; height: 16px; opacity: 0; transition: opacity .15s; }
  .habit.done .check svg { opacity: 1; }
  .habit:active .check { transform: scale(0.88); }
  .pop { animation: pop .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0% { transform: scale(.7); } 100% { transform: scale(1); } }
  .grid { padding: 14px 14px 12px; display: grid; gap: 6px; }
  .row { display: grid; grid-template-columns: 92px repeat(var(--days), minmax(0, 1fr)); gap: 4px; align-items: center; }
  @media (min-width: 900px) { .row { grid-template-columns: 120px repeat(var(--days), minmax(0, 1fr)); gap: 5px; } .grid { padding: 18px; gap: 9px; } .cell { border-radius: 4px; } }
  .row .h { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; }
  .cell { aspect-ratio: 1; border-radius: 5px; background: var(--empty); }
  .cell.on { background: var(--amber); }
  .cell.today { box-shadow: inset 0 0 0 1.5px var(--amber-ink); }
  .days .cell { background: none; font-size: 12px; color: var(--muted); text-align: center; aspect-ratio: auto; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); }
  .stat { padding: 14px 16px; border-left: 0.5px solid var(--line); }
  .stat:first-child { border-left: 0; }
  .stat .n { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat .t { font-size: 13px; color: var(--muted); }
  .goal { padding: 12px 16px; border-top: 0.5px solid var(--line); }
  .goal:first-child { border-top: 0; }
  .goal .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .goal .gn { font-size: 17px; }
  .goal .gc { font-size: 15px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .goal .gs { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .goal.met .gs { color: var(--amber-ink); font-weight: 600; }
  .bar { height: 10px; border-radius: 5px; background: var(--empty); margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--amber); border-radius: 5px; }
  .set { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; border-top: 0.5px solid var(--line); min-height: 52px; }
  .set:first-of-type { border-top: 0; }
  .set label { font-size: 17px; flex: 1; }
  .set input, .set select { width: 96px; min-height: 44px; font-size: 16px; text-align: center; }
  .set select { width: 140px; }
  .foot { color: var(--muted); font-size: 13px; text-align: center; margin-top: 8px; }
  .err { color: var(--amber-danger); font-size: 14px; text-align: center; min-height: 18px; }
  .empty { padding: 30px 18px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const DONE = /^(✓|✔|x|yes|y|1|true|done)$/i;
  const flame = '<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M8.6 1c.4 2.2-.5 3.4-1.6 4.6C5.8 6.9 4 8.6 4 11a4 4 0 0 0 8 0c0-1.7-.8-2.9-1.5-3.8-.1 1-.6 1.8-1.4 2.2.5-2.8-.3-6.4-.5-8.4Z"/></svg>';
  const tick = '<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="var(--amber-on-accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const pad = (n) => String(n).padStart(2, "0");
  const dayOf = (iso, delta) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + delta); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  let popped = null, error = "", settingsOpen = false;

  function model(note) {
    const t = note.tables.find((t) => t.columns.some((c) => /^date$/i.test(c.name)));
    if (!t) return null;
    const dateCol = t.columns.findIndex((c) => /^date$/i.test(c.name));
    const habits = t.columns.map((c, i) => ({ name: c.name, col: i })).filter((h) => h.col !== dateCol);
    const byDay = new Map(t.rows.map((r, i) => [r[dateCol], { cells: r, index: i }]));
    const done = (day, h) => { const r = byDay.get(day); return !!r && DONE.test((r.cells[h.col] || "").trim()); };
    for (const h of habits) {
      // The streak runs back from today, or from yesterday while today is still open.
      let d = done(note.today, h) ? note.today : dayOf(note.today, -1), n = 0;
      while (done(d, h)) { n++; d = dayOf(d, -1); }
      h.streak = n;
      let best = 0, run = 0;
      for (let i = -59; i <= 0; i++) { if (done(dayOf(note.today, i), h)) { run++; best = Math.max(best, run); } else run = 0; }
      h.best = best;
      h.today = done(note.today, h);
    }
    return { t, dateCol, habits, byDay, done };
  }

  function render(note) {
    const app = document.getElementById("app");
    const m = model(note);
    if (!m) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with a Date column to track habits.</div>`; return; }
    const st = (amber.data && amber.data.values && amber.data.values.settings) || {};
    const weekStart = st.weekStart === 0 ? 0 : 1;
    const goals = {};
    for (const h of m.habits) { const g = Math.round(+(st.goals || {})[h.name]); goals[h.name] = g >= 1 && g <= 7 ? g : 5; }
    const back = (new Date(note.today + "T12:00:00").getDay() - weekStart + 7) % 7;
    const weekDays = Array.from({ length: back + 1 }, (_, i) => dayOf(note.today, i - back));
    const weekLabel = back === 0 ? "starts today" : "since " + new Date(weekDays[0] + "T12:00:00").toLocaleDateString(undefined, { weekday: "long" });
    const doneToday = m.habits.filter((h) => h.today).length;
    // Two weeks on a phone, four where there's room.
    const span = window.innerWidth >= 900 ? 28 : 14;
    const days = Array.from({ length: span }, (_, i) => dayOf(note.today, i - (span - 1)));
    const letters = days.map((d) => "SMTWTFS"[new Date(d + "T12:00:00").getDay()]);
    const last7 = days.slice(-7);
    const rate = Math.round(100 * last7.reduce((a, d) => a + m.habits.filter((h) => m.done(d, h)).length, 0) / (7 * m.habits.length || 1));
    const longest = m.habits.reduce((a, h) => (h.streak > a.streak ? h : a), m.habits[0]);
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="sub"><b>${doneToday} of ${m.habits.length}</b> done today</div>
      <div class="layout"><section class="today">
      <div class="label">Today</div>
      <div class="card">${m.habits.map((h, i) => `
        <div class="habit ${h.today ? "done" : ""}" data-i="${i}">
          <div class="name">${esc(h.name)}</div>
          <div class="streak ${h.streak >= 3 ? "hot" : ""}">${h.streak ? flame + h.streak + (h.streak === 1 ? " day" : " days") : "Start today"}</div>
          <div class="check ${popped === i ? "pop" : ""}" role="checkbox" aria-checked="${h.today}" aria-label="${esc(h.name)} today">${tick}</div>
        </div>`).join("")}
      </div>
      <div class="err">${esc(error)}</div>
      </section><section class="history">
      <div class="label">${span === 28 ? "Last four weeks" : "Last two weeks"}</div>
      <div class="card"><div class="grid" style="--days:${span}">
        <div class="row days"><div></div>${letters.map((l) => `<div class="cell">${l}</div>`).join("")}</div>
        ${m.habits.map((h) => `<div class="row"><div class="h">${esc(h.name)}</div>${days.map((d) => `<div class="cell ${m.done(d, h) ? "on" : ""} ${d === note.today ? "today" : ""}"></div>`).join("")}</div>`).join("")}
      </div></div>
      </section><section class="weekly">
      <div class="label">Weekly goals · ${esc(weekLabel)}</div>
      <div class="card">${m.habits.map((h) => { const c = weekDays.filter((d) => m.done(d, h)).length, g = goals[h.name], pct = Math.min(100, Math.round(100 * c / g)), left = g - c, rem = 7 - weekDays.length;
        const msg = c >= g ? "Goal reached" : left <= rem ? left + (left === 1 ? " more day" : " more days") + " to go" : left + " to go, " + (left - rem) + " out of reach";
        return `<div class="goal ${c >= g ? "met" : ""}"><div class="top"><span class="gn">${esc(h.name)}</span><span class="gc">${c} / ${g} days</span></div><div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div><div class="gs">${msg}</div></div>`; }).join("")}</div>
      <div class="label" style="margin-top:22px">Change goals</div>
      <div class="card" id="goalset">
        ${m.habits.map((h, i) => `<div class="set"><label for="g${i}">${esc(h.name)} days per week</label><input id="g${i}" name="g${i}" type="number" inputmode="numeric" min="1" max="7" value="${goals[h.name]}" data-h="${esc(h.name)}"></div>`).join("")}
        <div class="set"><label for="ws">Week starts on</label><select id="ws" name="ws"><option value="1" ${weekStart === 1 ? "selected" : ""}>Monday</option><option value="0" ${weekStart === 0 ? "selected" : ""}>Sunday</option></select></div>
      </div>
      </section><section class="numbers">
      <div class="card stats">
        <div class="stat"><div class="n">${rate}%</div><div class="t">This week</div></div>
        <div class="stat"><div class="n">${longest ? longest.streak : 0}</div><div class="t">Longest now${longest && longest.streak ? ", " + esc(longest.name) : ""}</div></div>
        <div class="stat"><div class="n">${Math.max(0, ...m.habits.map((h) => h.best))}</div><div class="t">Best run</div></div>
      </div>
      </section></div>
      <div class="foot">Ticks are written to the table in this note.</div>`;
    popped = null;
    const ds = document.getElementById("goalset");
    ds.querySelectorAll("input[data-h]").forEach((el) => el.addEventListener("change", () => {
      const n = Math.max(1, Math.min(7, Math.round(+el.value) || 1));
      amber.setData({ values: { settings: { goals: { [el.dataset.h]: n } } } });
      if (String(n) !== el.value) el.value = n;
    }));
    document.getElementById("ws").addEventListener("change", (e) => amber.setData({ values: { settings: { weekStart: +e.target.value } } }));
    app.querySelectorAll(".habit").forEach((el) => el.addEventListener("click", () => toggle(m, m.habits[+el.dataset.i], +el.dataset.i)));
  }

  async function toggle(m, h, i) {
    const row = m.byDay.get(amber.note.today);
    const value = h.today ? "" : "✓";
    popped = i;
    const r = row
      ? await amber.update({ op: "set_cell", table: m.t.index, row: row.index, col: h.name, value })
      : await amber.update({ op: "append_row", table: m.t.index, values: { [m.t.columns[m.dateCol].name]: amber.note.today, [h.name]: value } });
    error = r.ok ? "" : r.error;
    if (!r.ok) render(amber.note);
  }

  amber.onChange(render);
  // Two or four weeks depends on the width: draw again when the window changes size.
  let wide = window.innerWidth >= 900;
  addEventListener("resize", () => { if ((window.innerWidth >= 900) !== wide) { wide = !wide; render(amber.note); } });
</script>
</body>
</html>
