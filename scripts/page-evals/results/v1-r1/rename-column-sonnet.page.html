<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
:root{--bg:#fff;--ink:#222;--line:#eee;--pill:#f3f3f3;--pill-ink:#555}@media (prefers-color-scheme:dark){:root{--bg:#1b1916;--ink:#f3eee8;--line:#3a352f;--pill:#34302a;--pill-ink:#d6cfc6}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:20px 18px;max-width:680px;margin:0 auto}
h1{font-size:28px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.total{font-size:36px;font-weight:700;color:var(--ink)}
.pill{background:var(--pill);color:var(--pill-ink);border-radius:99px;padding:2px 10px;font-size:13px}
</style></head><body><main id="app"></main><script>
const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const num=(s)=>parseFloat(String(s).replace(/\s/g,"").replace(",","."))||0;
amber.onChange((note)=>{const t=note.tables[0];const a=t.columns.findIndex((c)=>/^(amt|amount\s*\(kr\))$/i.test(c.name));
app.innerHTML="<h1>"+esc(note.title)+"</h1><div class=total>"+t.rows.reduce((s,r)=>s+num(r[a]),0).toLocaleString("sv-SE")+" kr</div>"+
t.rows.map((r)=>"<div class=row><span>"+esc(r[1])+" <span class=pill>"+esc(r[2])+"</span></span><b>"+esc(r[a])+"</b></div>").join("")});
</script></body></html>
