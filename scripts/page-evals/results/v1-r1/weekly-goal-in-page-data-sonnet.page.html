<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Habit tracker</title>
<style>
  :root {
    --bg: #fbf8f3; --card: #ffffff; --ink: #1d1a16; --muted: #8a8178; --line: rgba(60, 40, 20, 0.09);
    --amber: #e8891c; --amber-soft: #fdebd3; --amber-ink: #8a4b06; --empty: #f0ebe4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1916; --card: #26231f; --ink: #f3eee8; --muted: #9c948a; --line: rgba(255, 240, 220, 0.08);
      --amber: #f19a33; --amber-soft: #4a3216; --amber-ink: #ffcf91; --empty: #34302a;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.35 -apple-system, system-ui, sans-serif; padding: 20px 18px 120px; max-width: 640px; margin: 0 auto; -webkit-user-select: none; user-select: none; }
  h1 { font-size: 30px; line-height: 1.1; letter-spacing: -0.02em; margin: 6px 0 4px; }
  .sub { color: var(--muted); font-size: 15px; margin-bottom: 22px; }
  .sub b { color: var(--amber-ink); font-weight: 600; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 0 4px 8px; }
  .card { background: var(--card); border-radius: 18px; box-shadow: 0 1px 2px rgba(60, 30, 0, 0.06), 0 8px 24px rgba(60, 30, 0, 0.05); margin-bottom: 22px; overflow: hidden; }
  .habit { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 0.5px solid var(--line); cursor: pointer; }
  .habit:first-child { border-top: 0; }
  .name { flex: 1; font-size: 17px; }
  .streak { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 4px; }
  .streak.hot { color: var(--amber-ink); font-weight: 600; }
  .streak svg { width: 13px; height: 13px; }
  .check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; transition: transform .25s cubic-bezier(.34,1.56,.64,1), background .2s; flex: none; }
  .habit.done .check { background: var(--amber); border-color: var(--amber); }
  .check svg { width: 16px; height: 16px; opacity: 0; transition: opacity .15s; }
  .habit.done .check svg { opacity: 1; }
  .habit:active .check { transform: scale(0.88); }
  .pop { animation: pop .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0% { transform: scale(.7); } 100% { transform: scale(1); } }
  .grid { padding: 14px 14px 12px; display: grid; gap: 6px; }
  .row { display: grid; grid-template-columns: 92px repeat(14, 1fr); gap: 4px; align-items: center; }
  .row .h { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; }
  .cell { aspect-ratio: 1; border-radius: 5px; background: var(--empty); }
  .cell.on { background: var(--amber); }
  .cell.today { box-shadow: inset 0 0 0 1.5px var(--amber-ink); }
  .days .cell { background: none; font-size: 10px; color: var(--muted); text-align: center; aspect-ratio: auto; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); }
  .stat { padding: 14px 16px; border-left: 0.5px solid var(--line); }
  .stat:first-child { border-left: 0; }
  .stat .n { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat .t { font-size: 13px; color: var(--muted); }
  .goal { padding: 14px 16px; border-top: 0.5px solid var(--line); }
  .goal:first-child { border-top: 0; }
  .goal .top { display: flex; align-items: center; gap: 10px; }
  .goal .gn { flex: 1; font-size: 17px; }
  .goal .gp { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
  .goal .gp.met { color: var(--amber-ink); font-weight: 600; }
  .bar { height: 8px; border-radius: 4px; background: var(--empty); margin: 10px 0 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--amber); border-radius: 4px; }
  .step { display: flex; align-items: center; gap: 2px; }
  .step button { width: 44px; height: 44px; border: 0; border-radius: 10px; background: var(--empty); color: var(--ink); font: inherit; font-size: 20px; font-weight: 600; }
  .step button:disabled { opacity: .35; }
  .step .v { min-width: 24px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  .foot { color: var(--muted); font-size: 13px; text-align: center; margin-top: 8px; }
  .err { color: #c0392b; font-size: 14px; text-align: center; min-height: 18px; }
  .empty { padding: 30px 18px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const DONE = /^(✓|✔|x|yes|y|1|true|done)$/i;
  const flame = '<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M8.6 1c.4 2.2-.5 3.4-1.6 4.6C5.8 6.9 4 8.6 4 11a4 4 0 0 0 8 0c0-1.7-.8-2.9-1.5-3.8-.1 1-.6 1.8-1.4 2.2.5-2.8-.3-6.4-.5-8.4Z"/></svg>';
  const tick = '<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const pad = (n) => String(n).padStart(2, "0");
  const dayOf = (iso, delta) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + delta); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  let popped = null, error = "";

  function model(note) {
    const t = note.tables.find((t) => t.columns.some((c) => /^date$/i.test(c.name)));
    if (!t) return null;
    const dateCol = t.columns.findIndex((c) => /^date$/i.test(c.name));
    const habits = t.columns.map((c, i) => ({ name: c.name, col: i })).filter((h) => h.col !== dateCol);
    const byDay = new Map(t.rows.map((r, i) => [r[dateCol], { cells: r, index: i }]));
    const done = (day, h) => { const r = byDay.get(day); return !!r && DONE.test((r.cells[h.col] || "").trim()); };
    for (const h of habits) {
      // The streak runs back from today, or from yesterday while today is still open.
      let d = done(note.today, h) ? note.today : dayOf(note.today, -1), n = 0;
      while (done(d, h)) { n++; d = dayOf(d, -1); }
      h.streak = n;
      let best = 0, run = 0;
      for (let i = -59; i <= 0; i++) { if (done(dayOf(note.today, i), h)) { run++; best = Math.max(best, run); } else run = 0; }
      h.best = best;
      h.today = done(note.today, h);
    }
    return { t, dateCol, habits, byDay, done };
  }

  function render(note, data) {
    data = data || amber.data;
    const app = document.getElementById("app");
    const m = model(note);
    if (!m) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with a Date column to track habits.</div>`; return; }
    const DEFAULTS = { Walk: 5, Read: 4, Stretch: 3 };
    const goals = (data && data.goals) || {};
    const goalOf = (name) => { const v = parseInt(goals[name], 10); return v >= 1 && v <= 7 ? v : (DEFAULTS[name] || 3); };
    const dow = (new Date(note.today + "T12:00:00").getDay() + 6) % 7;
    const weekDays = Array.from({ length: dow + 1 }, (_, i) => dayOf(note.today, i - dow));
    const doneToday = m.habits.filter((h) => h.today).length;
    const days = Array.from({ length: 14 }, (_, i) => dayOf(note.today, i - 13));
    const letters = days.map((d) => "SMTWTFS"[new Date(d + "T12:00:00").getDay()]);
    const last7 = days.slice(7);
    const rate = Math.round(100 * last7.reduce((a, d) => a + m.habits.filter((h) => m.done(d, h)).length, 0) / (7 * m.habits.length || 1));
    const longest = m.habits.reduce((a, h) => (h.streak > a.streak ? h : a), m.habits[0]);
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="sub"><b>${doneToday} of ${m.habits.length}</b> done today</div>
      <div class="label">Today</div>
      <div class="card">${m.habits.map((h, i) => `
        <div class="habit ${h.today ? "done" : ""}" data-i="${i}" role="checkbox" aria-checked="${h.today}" aria-label="${esc(h.name)}">
          <div class="name">${esc(h.name)}</div>
          <div class="streak ${h.streak >= 3 ? "hot" : ""}">${h.streak ? flame + h.streak + (h.streak === 1 ? " day" : " days") : "Start today"}</div>
          <div class="check ${popped === i ? "pop" : ""}">${tick}</div>
        </div>`).join("")}
      </div>
      <div class="err">${esc(error)}</div>
      <div class="label">Weekly goals · since Monday</div>
      <div class="card">${m.habits.map((h, i) => {
        const g = goalOf(h.name), n = weekDays.filter((d) => m.done(d, h)).length, pct = Math.min(100, Math.round(100 * n / g));
        return `<div class="goal">
          <div class="top"><div class="gn">${esc(h.name)}</div><div class="gp ${n >= g ? "met" : ""}">${n} of ${g} days${n >= g ? " · goal met" : ""}</div>
          <div class="step"><button type="button" data-g="${i}" data-d="-1" aria-label="Lower ${esc(h.name)} goal" ${g <= 1 ? "disabled" : ""}>−</button><span class="v" aria-label="${esc(h.name)} goal">${g}</span><button type="button" data-g="${i}" data-d="1" aria-label="Raise ${esc(h.name)} goal" ${g >= 7 ? "disabled" : ""}>+</button></div></div>
          <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${g}" aria-valuenow="${Math.min(n, g)}" aria-label="${esc(h.name)} progress"><i style="width:${pct}%"></i></div>
        </div>`;
      }).join("")}</div>
      <div class="label">Last two weeks</div>
      <div class="card"><div class="grid">
        <div class="row days"><div></div>${letters.map((l) => `<div class="cell">${l}</div>`).join("")}</div>
        ${m.habits.map((h) => `<div class="row"><div class="h">${esc(h.name)}</div>${days.map((d) => `<div class="cell ${m.done(d, h) ? "on" : ""} ${d === note.today ? "today" : ""}"></div>`).join("")}</div>`).join("")}
      </div></div>
      <div class="card stats">
        <div class="stat"><div class="n">${rate}%</div><div class="t">This week</div></div>
        <div class="stat"><div class="n">${longest ? longest.streak : 0}</div><div class="t">Longest now${longest && longest.streak ? ", " + esc(longest.name) : ""}</div></div>
        <div class="stat"><div class="n">${Math.max(0, ...m.habits.map((h) => h.best))}</div><div class="t">Best run</div></div>
      </div>
      <div class="foot">Ticks are written to the table in this note.</div>`;
    popped = null;
    app.querySelectorAll("[data-g]").forEach((el) => el.addEventListener("click", async () => {
      const h = m.habits[+el.dataset.g];
      const next = Math.max(1, Math.min(7, goalOf(h.name) + +el.dataset.d));
      const all = {}; m.habits.forEach((x) => { all[x.name] = goalOf(x.name); });
      all[h.name] = next;
      const r = await amber.setData({ goals: all });
      if (!r.ok) { error = r.error; render(amber.note, amber.data); }
    }));
    app.querySelectorAll(".habit").forEach((el) => el.addEventListener("click", () => toggle(m, m.habits[+el.dataset.i], +el.dataset.i)));
  }

  async function toggle(m, h, i) {
    const row = m.byDay.get(amber.note.today);
    const value = h.today ? "" : "✓";
    popped = i;
    const r = row
      ? await amber.update({ op: "set_cell", table: m.t.index, row: row.index, col: h.name, value })
      : await amber.update({ op: "append_row", table: m.t.index, values: { [m.t.columns[m.dateCol].name]: amber.note.today, [h.name]: value } });
    error = r.ok ? "" : r.error;
    if (!r.ok) render(amber.note);
  }

  amber.onChange(render);
</script>
</body>
</html>
