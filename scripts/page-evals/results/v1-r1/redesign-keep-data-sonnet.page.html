<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household expenses</title>
<style>
  :root { --bg:#fbf8f3; --card:#fff; --ink:#1d1a16; --muted:#6f665d; --line:rgba(60,40,20,.12); --accent:#c46a0a; --accent-ink:#fff; --field:#f1ebe3; --barbg:#efe7dc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1916; --card:#26231f; --ink:#f3eee8; --muted:#a39a90; --line:rgba(255,240,220,.12); --accent:#f0a04b; --accent-ink:#1b1916; --field:#34302a; --barbg:#34302a; } }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); }
  body { font:16px/1.4 -apple-system, system-ui, sans-serif; padding:20px 18px 96px; max-width:680px; margin:0 auto; }
  h1 { font-size:28px; letter-spacing:-.02em; margin:4px 0 8px; }
  .big { font-size:52px; font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1.1; }
  .muted { color:var(--muted); font-size:14px; }
  .label { font-size:13px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:22px 4px 8px; }
  .card { background:var(--card); border-radius:16px; border:1px solid var(--line); overflow:hidden; }
  .months { padding:6px; }
  .m { display:flex; align-items:center; gap:10px; width:100%; min-height:48px; padding:6px 10px; background:none; color:var(--ink); border:0; border-radius:10px; font:inherit; font-weight:400; text-align:left; }
  .m[aria-pressed="true"] { background:var(--field); font-weight:600; }
  .m .name { width:64px; flex:none; }
  .track { flex:1; height:14px; border-radius:7px; background:var(--barbg); overflow:hidden; }
  .fill { height:100%; background:var(--muted); border-radius:7px; }
  .m[aria-pressed="true"] .fill { background:var(--accent); }
  .m .v { width:96px; flex:none; text-align:right; font-variant-numeric:tabular-nums; }
  .grp { display:flex; justify-content:space-between; padding:12px 16px; background:var(--field); font-weight:600; }
  .row { display:flex; align-items:center; gap:12px; padding:10px 16px; border-top:1px solid var(--line); min-height:48px; }
  .grow { flex:1; min-width:0; overflow-wrap:anywhere; }
  .num { font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }
  form { display:flex; flex-wrap:wrap; gap:8px; padding:12px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); flex:1 1 120px; }
  input { font:inherit; color:var(--ink); background:var(--field); border:0; border-radius:10px; padding:10px 12px; min-height:44px; width:100%; }
  .add { font:inherit; font-weight:600; min-height:44px; padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:var(--accent-ink); align-self:flex-end; }
  .err { color:#c0392b; padding:0 16px 12px; }
  .empty { padding:28px 16px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]);
  const kr = (n) => Math.round(n).toLocaleString("sv-SE") + " kr";
  const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const mlabel = (k) => MN[+k.slice(5, 7) - 1] + " " + k.slice(2, 4);
  const mfull = (k) => MN[+k.slice(5, 7) - 1] + " " + k.slice(0, 4);
  let error = "";

  function render(note, data) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => t.columns.some((c) => /^(amt|amount|cost|kr|price|sum)$/i.test(c.name)));
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Date, Item, Category and Amt columns.</div>`; return; }
    const ix = (re) => t.columns.findIndex((c) => re.test(c.name));
    const a = ix(/^(amt|amount|cost|kr|price|sum)$/i), cat = ix(/categ/i), item = ix(/^(item|what|description|name)$/i), date = ix(/^date$/i);
    const rows = t.rows.map((r, i) => ({
      r, i,
      n: parseFloat(String(r[a]).replace(/\s/g, "").replace(",", ".")) || 0,
      m: date >= 0 && /^\d{4}-\d{2}/.test(r[date]) ? r[date].slice(0, 7) : "",
      c: (cat >= 0 && r[cat].trim()) || "Other"
    }));
    const totals = new Map();
    for (const x of rows) if (x.m) totals.set(x.m, (totals.get(x.m) || 0) + x.n);
    const months = [...totals.keys()].sort();
    const thisM = note.today.slice(0, 7);
    let sel = data.month && totals.has(data.month) ? data.month : (totals.has(thisM) ? thisM : months[months.length - 1]);
    const max = Math.max(1, ...totals.values());
    const cur = rows.filter((x) => x.m === sel);
    const total = cur.reduce((s, x) => s + x.n, 0);
    const groups = new Map();
    for (const x of cur) { if (!groups.has(x.c)) groups.set(x.c, []); groups.get(x.c).push(x); }
    const gl = [...groups].map(([k, v]) => [k, v, v.reduce((s, x) => s + x.n, 0)]).sort((p, q) => q[2] - p[2]);
    const cats = [...new Set(rows.map((x) => x.c))];

    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      ${sel ? `<div class="muted">${mfull(sel)} total</div><div class="big">${kr(total)}</div><div class="muted">${cur.length} ${cur.length === 1 ? "entry" : "entries"}</div>` : `<div class="card empty">No dated expenses yet.</div>`}
      <div class="label">By month</div>
      <div class="card months">${months.map((k) => `<button class="m" data-m="${k}" aria-pressed="${k === sel}"><span class="name">${mlabel(k)}</span><span class="track"><span class="fill" style="display:block;width:${(100 * totals.get(k) / max).toFixed(1)}%"></span></span><span class="v">${kr(totals.get(k))}</span></button>`).join("") || '<div class="empty">Nothing yet.</div>'}</div>
      <div class="label">By category</div>
      <div class="card">${gl.map(([k, v, s]) => `<div class="grp"><span>${esc(k)}</span><span class="num">${kr(s)}</span></div>${v.map((x) => `<div class="row"><div class="grow">${esc(item >= 0 ? x.r[item] : "")}<div class="muted">${esc(date >= 0 ? x.r[date] : "")}</div></div><div class="num">${kr(x.n)}</div></div>`).join("")}`).join("") || '<div class="empty">No expenses this month.</div>'}</div>
      <div class="label">Add an expense</div>
      <div class="card">
        <form id="add">
          <label>What<input name="item" required></label>
          <label>Category<input name="cat" list="cats" required></label>
          <label>Amount (kr)<input name="amount" inputmode="decimal" required></label>
          <button class="add">Add</button>
          <datalist id="cats">${cats.map((c) => `<option value="${esc(c)}">`).join("")}</datalist>
        </form>
        <div class="err" role="alert">${esc(error)}</div>
      </div>`;
    app.querySelectorAll(".m").forEach((b) => b.onclick = () => amber.setData({ month: b.dataset.m }));
    document.getElementById("add").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const values = { [t.columns[a].name]: String(f.get("amount")).trim() };
      if (item >= 0) values[t.columns[item].name] = String(f.get("item")).trim();
      if (cat >= 0) values[t.columns[cat].name] = String(f.get("cat")).trim();
      if (date >= 0) values[t.columns[date].name] = note.today;
      const r = await amber.update({ op: "append_row", table: t.index, values });
      error = r.ok ? "" : r.error;
      if (!r.ok) render(amber.note, amber.data);
    };
  }
  amber.onChange(render);
</script>
</body>
</html>
