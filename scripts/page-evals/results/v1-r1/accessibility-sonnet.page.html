<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#fbf8f3;--card:#fff;--ink:#1d1a16;--muted:#5f574e;--line:rgba(60,40,20,.25);--accent:#9a4f00;--accent-ink:#fff;--field:#f1ebe3;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#1b1916;--card:#26231f;--ink:#f3eee8;--muted:#b5ada3;--line:rgba(255,240,220,.3);--accent:#f0a04b;--accent-ink:#1b1916;--field:#34302a;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 -apple-system,system-ui,sans-serif;padding:20px 18px 64px;max-width:680px;margin:0 auto}
h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 4px}
h2{font-size:18px;margin:24px 0 8px}
.sum{color:var(--muted);margin:0 0 8px}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li{border-top:1px solid var(--line)}li:first-child{border-top:0}
li label{display:flex;align-items:center;gap:14px;min-height:48px;padding:10px 16px;cursor:pointer;overflow-wrap:anywhere}
input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--accent);margin:0}
input[type=checkbox]:checked+span{color:var(--muted);text-decoration:line-through}
.empty{padding:14px 16px;color:var(--muted)}
form{display:flex;flex-wrap:wrap;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:28px}
form h2{width:100%;margin:0}
.f{display:flex;flex-direction:column;gap:4px;flex:1 1 160px;font-size:14px;color:var(--muted)}
input[type=text],select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
button{font:inherit;font-weight:600;min-height:44px;padding:0 20px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);align-self:flex-end}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#msg{min-height:1.4em;margin:10px 2px 0}
#msg.e{color:var(--err)}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p class="sum" id="sum"></p>
<div id="lists"></div>
<form id="add">
  <h2>Add an item</h2>
  <label class="f" for="v">Item name<input type="text" id="v" name="v" required autocomplete="off"></label>
  <label class="f" for="c">Category<select id="c" name="c"></select></label>
  <button type="submit">Add item</button>
</form>
<p id="msg" role="status" aria-live="polite"></p>
</main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const $=id=>document.getElementById(id);
const CATS=["Clothes","Documents","Tech","Other"];
let cats=CATS.slice();
function say(t,err){const m=$("msg");m.className=err?"e":"";m.textContent=t;}
function render(note){
  const focusKey=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.key:null;
  $("title").textContent=note.title;
  const lines=note.markdown.split("\n");
  const headOf=n=>{for(let i=Math.min(n,lines.length)-1;i>=0;i--){const m=/^#{2,6}\s+(.*?)\s*$/.exec(lines[i]);if(m)return m[1];}return "Other";};
  const groups={};
  const g=n=>groups[n]||(groups[n]=[]);
  note.checklists.forEach(c=>{g(headOf(c.line)).push({key:"l"+c.line,text:c.text,checked:c.checked,toggle:()=>amber.update({op:"toggle_checklist",line:c.line})});});
  const t=note.tables.find(t=>t.columns.some(c=>/^item$/i.test(c.name))&&t.columns.some(c=>/^packed$/i.test(c.name)));
  if(t){
    const ii=t.columns.findIndex(c=>/^item$/i.test(c.name)),ci=t.columns.findIndex(c=>/^category$/i.test(c.name)),pi=t.columns.findIndex(c=>/^packed$/i.test(c.name));
    t.rows.forEach((r,i)=>{
      const cat=(ci>=0&&r[ci])?r[ci]:"Other";
      const on=/^(yes|y|x|✓|1|true|done)$/i.test((r[pi]||"").trim());
      g(cat).push({key:"t"+i,text:r[ii],checked:on,toggle:()=>amber.update({op:"set_cell",table:t.index,row:i,col:t.columns[pi].name,value:on?"No":"Yes"})});
    });
  }
  const names=Object.keys(groups).filter(n=>n!=="Added items");
  const total=names.reduce((a,n)=>a+groups[n].length,0),done=names.reduce((a,n)=>a+groups[n].filter(i=>i.checked).length,0);
  $("sum").textContent=total?done+" of "+total+" items packed":"No items yet.";
  window._h={};
  $("lists").innerHTML=names.map((n,gi)=>{
    const items=groups[n];const d=items.filter(i=>i.checked).length;
    return '<section aria-labelledby="h'+gi+'"><h2 id="h'+gi+'">'+esc(n)+' <span class="sum" style="font-weight:400">('+d+' of '+items.length+' packed)</span></h2><ul>'+
      items.map(i=>{window._h[i.key]=i.toggle;return '<li><label><input type="checkbox" data-key="'+i.key+'"'+(i.checked?' checked':'')+'><span>'+esc(i.text)+(i.checked?'<span style="position:absolute;left:-9999px"> packed</span>':'')+'</span></label></li>';}).join("")+'</ul></section>';
  }).join("")||'<div class="empty">Nothing to pack yet. Add an item below.</div>';
  const all=Array.from(new Set(CATS.concat(names.filter(n=>n!=="Added items"))));
  const sel=$("c"),cur=sel.value;
  if(all.join("|")!==cats.join("|")||!sel.options.length){cats=all;sel.innerHTML=all.map(c=>'<option>'+esc(c)+'</option>').join("");if(cur&&all.includes(cur))sel.value=cur;}
  if(focusKey){const el=document.querySelector('[data-key="'+focusKey+'"]');if(el)el.focus();}
}
$("lists").addEventListener("change",async e=>{
  const k=e.target.dataset.key;if(!k||!window._h[k])return;
  const name=e.target.parentNode.textContent.trim().replace(/ packed$/,"");
  const was=e.target.checked;
  const r=await window._h[k]();
  if(r.ok)say((was?"Packed: ":"Not packed: ")+name,false);else{say("Could not update: "+r.error,true);render(amber.note);}
});
$("add").addEventListener("submit",async e=>{
  e.preventDefault();
  const v=$("v").value.trim();
  if(!v){say("Type an item name first.",true);$("v").focus();return;}
  const t=amber.note.tables.find(t=>t.columns.some(c=>/^item$/i.test(c.name))&&t.columns.some(c=>/^packed$/i.test(c.name)));
  if(!t){say("The Added items table is missing from the note.",true);return;}
  const r=await amber.update({op:"append_row",table:t.index,values:{Item:v,Category:$("c").value,Packed:"No"}});
  if(r.ok){say("Added "+v+" to "+$("c").value,false);$("v").value="";$("v").focus();}else say("Could not add: "+r.error,true);
});
amber.onChange(render);
</script>
</body>
</html>
