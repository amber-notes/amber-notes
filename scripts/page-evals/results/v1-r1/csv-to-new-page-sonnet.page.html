<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #fbf8f3; --card: #fff; --ink: #1d1a16; --muted: #6f665d; --line: rgba(60,40,20,.12); --accent: #b85f08; --accent-ink: #fff; --field: #f1ebe3; --soft: #ece5dc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1916; --card: #26231f; --ink: #f3eee8; --muted: #a39a90; --line: rgba(255,240,220,.12); --accent: #f0a04b; --accent-ink: #1b1916; --field: #34302a; --soft: #34302a; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.4 -apple-system, system-ui, sans-serif; padding: 20px 18px 96px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 12px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 22px 4px 8px; }
  .big { font-size: 42px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .muted { color: var(--muted); font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .chart { display: flex; align-items: end; gap: 4px; height: 130px; padding: 12px 12px 0; }
  .wk { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .wk .b { width: 100%; border-radius: 4px 4px 0 0; background: var(--accent); min-height: 2px; }
  .wk.cur .b { background: var(--ink); }
  .wk .l { font-size: 10px; color: var(--muted); padding-bottom: 8px; font-variant-numeric: tabular-nums; }
  .row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); min-height: 52px; }
  .row:first-child { border-top: 0; }
  .grow { flex: 1; min-width: 0; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
  input { font: inherit; font-size: 16px; color: var(--ink); background: var(--field); border: 0; border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; }
  button { grid-column: 1 / -1; font: inherit; font-weight: 600; min-height: 44px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); }
  .err { color: #c0392b; padding: 0 16px 12px; min-height: 1em; }
  .empty { padding: 24px 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const num = (s) => { const n = parseFloat(String(s ?? "").replace(/\s/g, "").replace(",", ".")); return Number.isFinite(n) ? n : NaN; };
  const col = (t, re) => t.columns.findIndex((c) => re.test(c.name));
  const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const monday = (iso) => { const d = new Date(iso + "T12:00:00Z"); return addDays(iso, -((d.getUTCDay() + 6) % 7)); };
  const pace = (min, km) => { if (!km || !min) return "–"; const p = min / km; let m = Math.floor(p), s = Math.round((p - m) * 60); if (s === 60) { m++; s = 0; } return m + ":" + String(s).padStart(2, "0"); };
  let error = "";

  function render(note) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => col(t, /date/i) >= 0);
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Activity Date, Distance (km), Moving Time (min) and Avg HR columns.</div>`; return; }
    const d = col(t, /date/i), km = col(t, /dist|km/i), mi = col(t, /time|min/i), hr = col(t, /hr|heart/i);
    const get = (r, i) => (i >= 0 ? num(r[i]) : NaN);
    const rows = t.rows.filter((r) => r[d]);
    const sum = (rs, i) => rs.reduce((s, r) => s + (get(r, i) || 0), 0);
    const hrs = (rs) => rs.map((r) => get(r, hr)).filter((x) => !isNaN(x));
    const avgHr = (rs) => { const h = hrs(rs); return h.length ? Math.round(h.reduce((a, b) => a + b, 0) / h.length) : "–"; };
    const weeks = Array.from({ length: 10 }, (_, k) => addDays(monday(note.today), (k - 9) * 7));
    const inWeek = (w) => rows.filter((r) => r[d] >= w && r[d] < addDays(w, 7));
    const perWeek = weeks.map((w) => sum(inWeek(w), km));
    const top = Math.max(1, ...perWeek);
    const cur = inWeek(weeks[9]);
    const month = note.today.slice(0, 7);
    const thisMonth = rows.filter((r) => r[d].startsWith(month));
    const longest = rows.reduce((m, r) => Math.max(m, get(r, km) || 0), 0);
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="big">${sum(rows, km).toFixed(1)} km</div>
      <div class="muted">${rows.length} runs · ${Math.round(sum(rows, mi))} min total</div>
      <div class="stats">
        <div class="stat"><span class="muted">Avg pace</span><b>${pace(sum(rows, mi), sum(rows, km))}</b><span class="muted">min/km</span></div>
        <div class="stat"><span class="muted">Avg HR</span><b>${avgHr(rows)}</b><span class="muted">bpm</span></div>
        <div class="stat"><span class="muted">Longest</span><b>${longest.toFixed(1)}</b><span class="muted">km</span></div>
      </div>
      <div class="stats">
        <div class="stat"><span class="muted">This week</span><b>${sum(cur, km).toFixed(1)}</b><span class="muted">km · ${cur.length} runs</span></div>
        <div class="stat"><span class="muted">This month</span><b>${sum(thisMonth, km).toFixed(1)}</b><span class="muted">km · ${thisMonth.length} runs</span></div>
        <div class="stat"><span class="muted">Month HR</span><b>${avgHr(thisMonth)}</b><span class="muted">bpm</span></div>
      </div>
      <h2>Km per week</h2>
      <div class="card chart" role="img" aria-label="Km per week: ${perWeek.map((v) => v.toFixed(0)).join(", ")}">${weeks.map((w, k) => `<div class="wk${k === 9 ? " cur" : ""}"><div class="b" style="height:${(90 * perWeek[k]) / top}px"></div><div class="l">${w.slice(8)}/${Number(w.slice(5, 7))}</div></div>`).join("")}</div>
      <h2>Latest runs</h2>
      <div class="card">${rows.slice().sort((a, b) => (a[d] < b[d] ? 1 : -1)).slice(0, 10).map((r) => `<div class="row"><span class="grow"><span class="num">${esc(r[km])} km</span><br><span class="muted">${esc(r[d])}</span></span><span class="num">${esc(r[mi])} min</span><span class="muted num">${pace(get(r, mi), get(r, km))}/km</span><span class="muted num">${esc(r[hr])} bpm</span></div>`).join("") || '<div class="empty">No runs yet.</div>'}</div>
      <h2>Log a run</h2>
      <div class="card">
        <form id="add">
          <label>Date<input name="date" type="date" value="${note.today}" required></label>
          <label>${esc(t.columns[km] ? t.columns[km].name : "Distance")}<input name="km" inputmode="decimal" required></label>
          <label>${esc(t.columns[mi] ? t.columns[mi].name : "Time")}<input name="min" inputmode="numeric" required></label>
          <label>${esc(t.columns[hr] ? t.columns[hr].name : "Avg HR")}<input name="hr" inputmode="numeric"></label>
          <button>Log run</button>
        </form>
        <div class="err" role="alert">${esc(error)}</div>
      </div>`;
    const f = document.getElementById("add");
    f.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(f);
      const values = { [t.columns[d].name]: String(fd.get("date")) };
      if (km >= 0) values[t.columns[km].name] = String(fd.get("km")).replace(",", ".").trim();
      if (mi >= 0) values[t.columns[mi].name] = String(fd.get("min")).trim();
      if (hr >= 0) values[t.columns[hr].name] = String(fd.get("hr")).trim();
      const r = await amber.update({ op: "append_row", table: t.index, values });
      error = r.ok ? "" : r.error;
      render(amber.note);
    };
  }
  amber.onChange(render);
</script>
</body>
</html>
