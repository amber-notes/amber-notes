<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="amber-lib:npm/qrcode-generator@2.0.4/dist/qrcode.js" integrity="sha256-eeyG+ChWAFsciHkFz8z8++w4Icphx/1alS+qX3ePeRw="></script>
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 48px; display: grid; gap: 20px; align-items: center; justify-items: center; text-align: center; }
  h1 { font-size: 1.75rem; letter-spacing: -.02em; margin: 4px 0 0; }
  .qr { background: #fff; padding: 16px; border-radius: var(--amber-radius); border: 1px solid var(--amber-separator); width: min(100%, 460px); }
  @media (prefers-color-scheme: dark) { .qr { background: #fff; } }
  .qr svg { display: block; width: 100%; height: auto; }
  .info { width: min(100%, 460px); background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); text-align: left; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--amber-separator); min-height: 48px; align-items: center; }
  .row:first-child { border-top: 0; }
  .k { color: var(--amber-text-secondary); font-size: .9rem; }
  .v { font-weight: 600; overflow-wrap: anywhere; text-align: right; }
  .pw { font-family: var(--amber-font-mono); }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-fill); color: var(--amber-text); }
  .hint { color: var(--amber-text-secondary); font-size: .95rem; margin: 0; }
  .empty { padding: 28px 16px; color: var(--amber-text-secondary); }
  @media (min-width: 900px) {
    main { grid-template-columns: 1fr 1fr; text-align: left; justify-items: center; }
    h1 { grid-column: 1 / -1; text-align: center; }
    .qr { width: min(100%, 520px); }
  }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const field = (md, name) => { const m = md.match(new RegExp("^\\s*" + name + "\\s*:\\s*(.*?)\\s*$", "im")); return m ? m[1] : ""; };
  const wesc = (s) => s.replace(/([\\;,:"])/g, "\\$1");
  let shown = false;

  function render(note) {
    const app = document.getElementById("app");
    const md = note.markdown || "";
    const ssid = field(md, "(?:Network|SSID|Name)");
    const pass = field(md, "Password");
    const sec = field(md, "Security");
    if (!ssid) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="empty">Add a line "Network: name" and "Password: ..." to the note.</div>`; return; }
    const type = /open|none|nopass/i.test(sec) || !pass ? "nopass" : /wep/i.test(sec) ? "WEP" : "WPA";
    const payload = `WIFI:T:${type};S:${wesc(ssid)};` + (type === "nopass" ? "" : `P:${wesc(pass)};`) + ";";
    let svg = "";
    try {
      const q = qrcode(0, "M"); q.addData(payload); q.make();
      const n = q.getModuleCount(); let d = "";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
      svg = `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" role="img" aria-label="QR code to join the Wi-Fi network ${esc(ssid)}" shape-rendering="crispEdges"><path d="${d}" fill="#000"/></svg>`;
    } catch (e) { svg = `<div class="empty" style="color:#000">Could not make a QR code.</div>`; }
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="qr">${svg}</div>
      <div>
        <p class="hint">Open the phone camera and point it at the code to join.</p>
        <div class="info" style="margin-top:16px">
          <div class="row"><span class="k">Network</span><span class="v">${esc(ssid)}</span></div>
          ${type === "nopass" ? "" : `<div class="row"><span class="k">Password</span><span class="v pw" id="pw">${shown ? esc(pass) : "••••••••"}</span><button id="tg" aria-label="${shown ? "Hide" : "Show"} password">${shown ? "Hide" : "Show"}</button></div>`}
          ${sec ? `<div class="row"><span class="k">Security</span><span class="v">${esc(sec)}</span></div>` : ""}
        </div>
      </div>`;
    const tg = document.getElementById("tg");
    if (tg) tg.onclick = () => { shown = !shown; render(amber.note); };
  }
  amber.onChange(render);
</script>
</body>
</html>
