<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }
main { max-width: var(--amber-content-max); margin: 0 auto; padding: 16px var(--amber-gutter) 32px; }
h1 { font-size: 1.6rem; letter-spacing: -.02em; margin: 4px 0 12px; }
#stage { position: relative; height: min(70vh, 640px); min-height: 320px; background: #070a14; border-radius: var(--amber-radius); overflow: hidden; touch-action: none; cursor: grab; border: 1px solid var(--amber-separator); }
#stage:active { cursor: grabbing; }
canvas { display: block; width: 100%; height: 100%; }
#labels { position: absolute; inset: 0; pointer-events: none; }
#labels button { position: absolute; left: 0; top: 0; pointer-events: auto; font: inherit; font-size: .8rem; background: transparent; border: 0; padding: 0 4px; min-height: 44px; min-width: 44px; white-space: nowrap; will-change: transform; }
#labels button span { display: inline-block; color: #ffffff; background: #2a3150; border-radius: 99px; padding: 3px 10px; }
#labels button.sel span { background: #ffb627; color: #1a1200; font-weight: 600; }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: .8rem; color: #ffffff; text-shadow: 0 0 4px #000; pointer-events: none; }
.card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 14px 16px; margin-top: 12px; }
.card h2 { margin: 0 0 6px; font-size: 1.1rem; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 24px; font-variant-numeric: tabular-nums; }
.facts div span { display: block; font-size: .78rem; color: var(--amber-text-secondary); }
.facts div b { font-size: 1.05rem; }
.note { color: var(--amber-text-secondary); font-size: .85rem; margin-top: 8px; }
.empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
</style>
<script type="importmap">{"imports":{"three":"amber-lib:three"}}</script>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div id="stage" role="img" aria-label="3D solar system. Drag to rotate, pinch or scroll to zoom.">
    <canvas id="cv"></canvas>
    <div id="labels"></div>
    <div class="hint">Drag to spin · scroll or pinch to zoom · tap a planet</div>
  </div>
  <div class="card" id="info" aria-live="polite"></div>
  <div class="note">Squashed to fit: spacing uses the square root of distance, size uses radius to the power 0.45, and the Sun is not to scale.</div>
</main>
<script type="module">
import * as THREE from "three";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const num = s => { const v = parseFloat(String(s ?? "").replace(/\s/g, "").replace(",", ".")); return isNaN(v) ? null : v; };
const COLORS = { mercury:0xb5b5b5, venus:0xe8c88a, earth:0x3f7fd6, mars:0xd1593a, jupiter:0xd9a97a, saturn:0xe6d09a, uranus:0x8fd8e0, neptune:0x4a63d9 };
const stage = document.getElementById("stage"), cv = document.getElementById("cv"), labelsEl = document.getElementById("labels"), info = document.getElementById("info");
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setClearColor(0x070a14, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const sunLight = new THREE.PointLight(0xffffff, 3.2, 0, 0); scene.add(sunLight);
const root = new THREE.Group(); scene.add(root);
// background stars
{ const g = new THREE.BufferGeometry(), p = []; for (let i = 0; i < 500; i++) { const v = new THREE.Vector3().randomDirection().multiplyScalar(150 + Math.random()*50); p.push(v.x, v.y, v.z); }
  g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, sizeAttenuation: false, transparent: true, opacity: .7 }))); }

let yaw = 0.6, pitch = 0.55, vyaw = 0.0015, vpitch = 0, dist = 24, zoom = 1, maxOrbit = 10;
let planets = [], selected = null, dragging = false, moved = 0, reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let lastNote = null;

function clearRoot() { while (root.children.length) { const o = root.children.pop(); o.traverse(m => { m.geometry?.dispose(); m.material?.dispose?.(); }); } }

function build(note) {
  lastNote = note;
  document.getElementById("title").textContent = note.title;
  const t = note.tables.find(t => t.columns.some(c => /planet|name/i.test(c.name)) && t.columns.some(c => /dist|au/i.test(c.name)));
  clearRoot(); planets = []; labelsEl.innerHTML = "";
  if (!t) { info.innerHTML = '<div class="empty">Add a table with Planet, Distance (AU) and Radius (km) columns.</div>'; return; }
  const ci = re => t.columns.findIndex(c => re.test(c.name));
  const iN = ci(/planet|name/i), iD = ci(/dist|au/i), iR = ci(/radius/i), iH = ci(/day|hour/i);
  const sun = new THREE.Mesh(new THREE.SphereGeometry(1.1, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffb627 }));
  root.add(sun);
  const glow = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffa500, transparent: true, opacity: .18 }));
  root.add(glow);
  const rows = t.rows.map((r, i) => ({ name: r[iN], au: num(r[iD]), rad: iR >= 0 ? num(r[iR]) : null, day: iH >= 0 ? num(r[iH]) : null, i })).filter(r => r.name && r.au != null && r.au > 0);
  if (!rows.length) { info.innerHTML = '<div class="empty">No planets with a distance yet.</div>'; return; }
  const maxAu = Math.max(...rows.map(r => r.au));
  const k = 10 / Math.sqrt(maxAu); maxOrbit = 10;
  rows.forEach((r, n) => {
    const orbitR = 1.8 + (k * Math.sqrt(r.au)) * 0.82;
    r.orbitR = orbitR;
    const size = 0.1 + 1.0 * Math.pow((r.rad || 6000) / 69911, 0.45) * 0.85;
    const col = COLORS[String(r.name).toLowerCase()] ?? new THREE.Color().setHSL((n * 0.17) % 1, 0.5, 0.6).getHex();
    const pivot = new THREE.Group();
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 32, 24), new THREE.MeshStandardMaterial({ color: col, roughness: .85 }));
    mesh.position.x = orbitR; mesh.userData.row = r; mesh.rotation.z = 0.3;
    pivot.add(mesh);
    if (/saturn/i.test(r.name)) {
      const ring = new THREE.Mesh(new THREE.RingGeometry(size * 1.35, size * 2.2, 64), new THREE.MeshBasicMaterial({ color: 0xcdb98a, side: THREE.DoubleSide, transparent: true, opacity: .7 }));
      ring.rotation.x = Math.PI / 2 - 0.45; mesh.add(ring);
    }
    pivot.rotation.y = n * 1.9 + 0.5;
    root.add(pivot);
    const pts = []; for (let a = 0; a <= 128; a++) pts.push(new THREE.Vector3(Math.cos(a / 128 * Math.PI * 2) * orbitR, 0, Math.sin(a / 128 * Math.PI * 2) * orbitR));
    root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .16 })));
    const b = document.createElement("button"); b.type = "button"; b.innerHTML = "<span>" + esc(r.name) + "</span>"; b.setAttribute("aria-label", "Show " + r.name);
    b.onclick = () => select(r.i); labelsEl.appendChild(b);
    Object.assign(r, { pivot, mesh, btn: b, size, speed: 0.45 / Math.pow(r.au, 1.5) });
    planets.push(r);
  });
  if (selected == null || !planets.some(p => p.i === selected)) selected = null;
  showInfo(); resize();
}

function select(i) { selected = selected === i ? null : i; showInfo(); }
function showInfo() {
  planets.forEach(p => p.btn.classList.toggle("sel", p.i === selected));
  const p = planets.find(p => p.i === selected);
  if (!p) { info.innerHTML = "<h2>Tap a planet</h2><div class=\"muted\">Its numbers from the table appear here.</div>"; return; }
  const f = (l, v) => v == null ? "" : `<div><span>${l}</span><b>${esc(v)}</b></div>`;
  info.innerHTML = `<h2>${esc(p.name)}</h2><div class="facts">${f("Distance from Sun", p.au.toLocaleString() + " AU")}${f("Radius", p.rad == null ? null : p.rad.toLocaleString() + " km")}${f("Day", p.day == null ? null : p.day.toLocaleString() + " h")}</div>`;
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  const fov = camera.fov * Math.PI / 180, need = (maxOrbit * 1.5) / Math.min(Math.tan(fov / 2), Math.tan(fov / 2) * camera.aspect);
  dist = need;
}
new ResizeObserver(resize).observe(stage);

stage.addEventListener("pointerdown", e => { dragging = true; moved = 0; vyaw = vpitch = 0; stage.lastX = e.clientX; stage.lastY = e.clientY; pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); });
const pts = new Map(); let pinch0 = 0, zoom0 = 1;
addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (!pinch0) { pinch0 = d; zoom0 = zoom; } zoom = Math.min(2.5, Math.max(0.5, zoom0 * d / pinch0)); return; }
  const dx = e.clientX - stage.lastX, dy = e.clientY - stage.lastY; stage.lastX = e.clientX; stage.lastY = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  yaw += dx * 0.008; pitch = Math.max(-1.45, Math.min(1.45, pitch + dy * 0.008));
  vyaw = dx * 0.0008; vpitch = 0;
});
const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch0 = 0; if (!pts.size) dragging = false; };
addEventListener("pointerup", up); addEventListener("pointercancel", up);
stage.addEventListener("wheel", e => { e.preventDefault(); zoom = Math.min(2.5, Math.max(0.5, zoom * Math.exp(-e.deltaY * 0.0012))); }, { passive: false });
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
stage.addEventListener("click", e => {
  if (moved > 6 || e.target.closest("button")) return;
  const r = stage.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(planets.map(p => p.mesh), false)[0];
  if (hit) select(hit.object.userData.row.i);
});

let last = 0; const v3 = new THREE.Vector3();
function frame(ts) {
  requestAnimationFrame(frame);
  if (document.visibilityState !== "visible" || !stage.clientWidth) { last = ts; return; }
  const dt = Math.min((ts - last) / 1000, 0.05); last = ts;
  if (!dragging) { yaw += vyaw; vyaw *= 0.96; if (Math.abs(vyaw) < 0.0004 && !reduce) vyaw = 0.0004; }
  if (!reduce) planets.forEach(p => { p.pivot.rotation.y -= p.speed * dt * 0.5; p.mesh.rotation.y += dt * 0.6; });
  const d = dist / zoom;
  camera.position.set(Math.sin(yaw) * Math.cos(pitch) * d, Math.sin(pitch) * d, Math.cos(yaw) * Math.cos(pitch) * d);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  const w = stage.clientWidth, h = stage.clientHeight;
  planets.forEach(p => {
    p.mesh.getWorldPosition(v3); v3.project(camera);
    const x = (v3.x * 0.5 + 0.5) * w, y = (-v3.y * 0.5 + 0.5) * h;
    p.btn.style.transform = `translate(${x.toFixed(1)}px, ${(y + 2).toFixed(1)}px) translateX(-50%)`;
    p.btn.style.display = v3.z < 1 ? "" : "none";
  });
}
amber.onChange(note => build(note));
requestAnimationFrame(frame);
</script>
</body>
</html>
