<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Budget</title>
<style>
  :root { --bg: #fbf8f3; --card: #fff; --ink: #1d1a16; --muted: #8a8178; --line: rgba(60,40,20,.09); --amber: #e8891c; --field: #f3eee7;
    --c0: #e8891c; --c1: #3f8f6b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1916; --card: #26231f; --ink: #f3eee8; --muted: #9c948a; --line: rgba(255,240,220,.08); --field: #34302a; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.35 -apple-system, system-ui, sans-serif; padding: 20px 18px 120px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 30px; letter-spacing: -0.02em; margin: 6px 0 2px; }
  .total { font-size: 44px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin: 14px 0 0; }
  .sub { color: var(--muted); font-size: 15px; margin-bottom: 18px; }
  .bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 6px 0 14px; background: var(--field); }
  .bar div { height: 100%; }
  .card { background: var(--card); border-radius: 18px; box-shadow: 0 1px 2px rgba(60,30,0,.06), 0 8px 24px rgba(60,30,0,.05); margin-bottom: 20px; overflow: hidden; }
  .cat, .item { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: .5px solid var(--line); }
  .cat:first-child, .item:first-child { border-top: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .grow { flex: 1; min-width: 0; }
  .amt { font-variant-numeric: tabular-nums; font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 4px 8px; }
  form { display: grid; grid-template-columns: 1.4fr 1fr .9fr auto; gap: 8px; padding: 12px; }
  input, select { font: inherit; font-size: 16px; padding: 9px 10px; border-radius: 10px; border: 0; background: var(--field); color: var(--ink); min-width: 0; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 0 14px; background: var(--amber); color: #fff; }
  .err { color: #c0392b; font-size: 14px; padding: 0 16px 10px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const SHOW = ["Food", "Housing"];
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const kr = (n) => n.toLocaleString("sv-SE", { maximumFractionDigits: 0 }) + " kr";
  let error = "";

  function render(note) {
    const t = note.tables.find((t) => t.columns.some((c) => /amount|amt|cost|kr|price/i.test(c.name)));
    const app = document.getElementById("app");
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card" style="padding:24px">Add a table with an Amount column.</div>`; return; }
    const col = (re) => t.columns.findIndex((c) => re.test(c.name));
    const a = col(/amount|amt|cost|kr|price/i), cat = col(/categ/i), item = col(/item|what|description/i), date = col(/^date$/i);
    const rows = t.rows
      .map((r) => ({ r, n: parseFloat(String(r[a]).replace(/\s/g, "").replace(",", ".")) || 0 }))
      .filter((x) => SHOW.includes(String(x.r[cat]).trim()));
    const total = rows.reduce((s, x) => s + x.n, 0);
    const byCat = SHOW.map((k) => [k, rows.filter((x) => String(x.r[cat]).trim() === k).reduce((s, x) => s + x.n, 0)]);
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="total">${kr(total)}</div>
      <div class="sub">Food and Housing · ${rows.length} entries</div>
      <div class="bar">${byCat.map(([k, v], i) => `<div style="width:${(100 * v / (total || 1)).toFixed(2)}%;background:var(--c${i})"></div>`).join("")}</div>
      <div class="card">${byCat.map(([k, v], i) => `<div class="cat"><div class="dot" style="background:var(--c${i})"></div><div class="grow">${esc(k)}</div><div class="muted">${Math.round(100 * v / (total || 1))}%</div><div class="amt">${kr(v)}</div></div>`).join("")}</div>
      <div class="label">Add an expense</div>
      <div class="card">
        <form id="add">
          <input name="item" placeholder="What" required>
          <select name="cat">${SHOW.map((k) => `<option>${k}</option>`).join("")}</select>
          <input name="amount" placeholder="kr" inputmode="decimal" required>
          <button>Add</button>
        </form>
        ${error ? `<div class="err">${esc(error)}</div>` : ""}
      </div>
      <div class="label">Latest</div>
      <div class="card">${rows.slice().reverse().slice(0, 6).map((x) => `<div class="item"><div class="grow">${esc(item >= 0 ? x.r[item] : "")}<div class="muted">${esc(date >= 0 ? x.r[date] : "")} · ${esc(x.r[cat])}</div></div><div class="amt">${kr(x.n)}</div></div>`).join("")}</div>`;
    document.getElementById("add").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const values = { [t.columns[a].name]: String(f.get("amount")).trim() };
      if (item >= 0) values[t.columns[item].name] = String(f.get("item")).trim();
      if (cat >= 0) values[t.columns[cat].name] = String(f.get("cat"));
      if (date >= 0) values[t.columns[date].name] = amber.note.today;
      const r = await amber.update({ op: "append_row", table: t.index, values });
      error = r.ok ? "" : r.error;
      if (!r.ok) render(amber.note);
    });
  }
  amber.onChange(render);
</script>
</body>
</html>
