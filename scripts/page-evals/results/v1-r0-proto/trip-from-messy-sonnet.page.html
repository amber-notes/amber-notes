<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--bg:#fff8f0;--fg:#2b2118;--card:#fff;--mut:#8a7766;--acc:#d9622b;--bd:#f0e2d3}
@media(prefers-color-scheme:dark){:root{--bg:#1c1713;--fg:#f3e9df;--card:#272019;--mut:#a39382;--acc:#f08a52;--bd:#3a3026}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
h1{margin:0 0 12px;font-size:24px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.count{text-align:center;padding:18px}.count b{font-size:56px;color:var(--acc);display:block;line-height:1}
.mut{color:var(--mut);font-size:14px}
label{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:6px;cursor:pointer}
input{width:20px;height:20px;accent-color:var(--acc);flex:none}.done span{text-decoration:line-through;color:var(--mut)}
</style></head><body><h1>🇵🇹 Porto weekend</h1><div id="app"></div><script>
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(n){
const md=n.markdown.split('\n');
const get=k=>{const l=md.find(x=>x.toLowerCase().startsWith(k));return l?l.slice(k.length).trim():''};
const fl=get('flights:'),ho=get('hotel:'),bu=get('budget');
let cd='';const m=fl.match(/(\d{1,2})\s+([a-z]{3})[a-z]*\s+(\d{1,2}):(\d{2})/i);
if(m){const t=n.today.split('-').map(Number);const now=Date.UTC(t[0],t[1]-1,t[2]);
let y=t[0];let d=Date.UTC(y,MON[m[2].toLowerCase()],+m[1]);
const days=Math.round((d-now)/864e5);
cd=days>0?`<b>${days}</b>days to go`:days==0?`<b>Today!</b>Have a great trip`:`<b>${-days}</b>days since takeoff`}
const todoLine=md.findIndex(x=>x.toLowerCase().startsWith('to do'))+1;
const item=c=>`<label class="${c.checked?'done':''}"><input type="checkbox" data-l="${c.line}" ${c.checked?'checked':''}><span>${esc(c.text)}</span></label>`;
const ideas=n.checklists.filter(c=>c.line<todoLine||!todoLine),todos=n.checklists.filter(c=>todoLine&&c.line>=todoLine);
const parts=fl.split(/,\s*back/i);
document.getElementById('app').innerHTML=
`<div class="card count">${cd}</div>
<h2>Flights</h2><div class="card">🛫 ${esc(parts[0].replace(/^out\s*/i,'Out '))}<br>🛬 ${parts[1]?esc('Back'+parts[1]):''}</div>
<h2>Hotel</h2><div class="card">🏨 ${esc(ho)}</div>
${bu?`<div class="card mut">💰 Budget ${esc(bu.replace(/^[~=\s]+/,'~ '))}</div>`:''}
<h2>Ideas</h2>${ideas.map(item).join('')}
<h2>To do before</h2>${todos.map(item).join('')}`;
document.querySelectorAll('input').forEach(i=>i.onchange=()=>amber.update({op:'toggle_checklist',line:+i.dataset.l}));}
amber.onChange(render);
</script></body></html>
