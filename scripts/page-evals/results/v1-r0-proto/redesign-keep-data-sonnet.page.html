<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Household expenses</title>
<style>
  :root { --bg:#fbf8f3; --card:#fff; --ink:#1d1a16; --muted:#8a8178; --line:rgba(60,40,20,.09); --amber:#e8891c; --field:#f3eee7; --bar:#e9dccb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1916; --card:#26231f; --ink:#f3eee8; --muted:#9c948a; --line:rgba(255,240,220,.08); --field:#34302a; --bar:#4a4339; } }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); }
  body { font:16px/1.35 -apple-system,system-ui,sans-serif; padding:20px 18px 100px; max-width:640px; margin:0 auto; }
  .hero { text-align:center; padding:18px 0 6px; }
  .hero .m { color:var(--muted); font-size:15px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
  .hero .total { font-size:60px; font-weight:800; letter-spacing:-0.035em; font-variant-numeric:tabular-nums; line-height:1.1; margin-top:4px; }
  .hero .sub { color:var(--muted); font-size:15px; margin-top:4px; }
  .card { background:var(--card); border-radius:18px; box-shadow:0 1px 2px rgba(60,30,0,.06),0 8px 24px rgba(60,30,0,.05); margin-bottom:20px; overflow:hidden; }
  .label { font-size:13px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:18px 4px 8px; }
  .chart { display:flex; align-items:flex-end; gap:10px; height:170px; padding:16px 16px 12px; }
  .col { flex:1; min-width:0; max-width:90px; margin:0 auto; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px; background:none; border:0; padding:0; color:var(--ink); font:inherit; cursor:pointer; }
  .col .v { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .col .b { width:100%; border-radius:8px 8px 4px 4px; background:var(--bar); min-height:4px; transition:height .4s; }
  .col.sel .b { background:var(--amber); }
  .col .n { font-size:13px; font-weight:600; }
  .col.sel .n { color:var(--amber); }
  .grp { display:flex; align-items:baseline; justify-content:space-between; padding:12px 16px 6px; border-top:.5px solid var(--line); background:var(--field); }
  .grp:first-child { border-top:0; }
  .grp b { font-size:15px; }
  .item { display:flex; align-items:center; gap:10px; padding:10px 16px; border-top:.5px solid var(--line); }
  .grow { flex:1; min-width:0; }
  .amt { font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }
  .muted { color:var(--muted); font-size:13px; }
  .empty { padding:24px; color:var(--muted); text-align:center; }
  form { display:grid; grid-template-columns:1.4fr 1fr .9fr auto; gap:8px; padding:12px; }
  @media (max-width:480px){ form { grid-template-columns:1fr 1fr; } .hero .total{font-size:48px;} }
  input,select { font:inherit; font-size:16px; padding:9px 10px; border-radius:10px; border:0; background:var(--field); color:var(--ink); min-width:0; }
  button.add { font:inherit; font-weight:600; border:0; border-radius:10px; padding:9px 14px; background:var(--amber); color:#fff; }
  .err { color:#c0392b; font-size:14px; padding:0 16px 10px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  const kr = n => n.toLocaleString("sv-SE",{maximumFractionDigits:0}).replace(/\u00a0/g," ") + " kr";
  const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  let selected = null, error = "";

  function render(note) {
    const app = document.getElementById("app");
    const t = note.tables.find(t => t.columns.some(c => /amt|amount|cost|kr|price/i.test(c.name)));
    if (!t) { app.innerHTML = `<div class="card empty">Add a table with an amount column.</div>`; return; }
    const col = re => t.columns.findIndex(c => re.test(c.name));
    const a = col(/amt|amount|cost|kr|price/i), cat = col(/categ/i), item = col(/item|what|description/i), date = col(/^date$/i);
    const rows = t.rows.map(r => ({
      item: item >= 0 ? r[item] : "", cat: (cat >= 0 && r[cat]) || "Other",
      date: date >= 0 ? String(r[date]) : "",
      n: parseFloat(String(r[a]).replace(/[\s\u00a0]/g,"").replace(",",".")) || 0
    }));
    rows.forEach(x => x.month = /^\d{4}-\d{2}/.test(x.date) ? x.date.slice(0,7) : "");
    const byMonth = new Map();
    for (const x of rows) byMonth.set(x.month, (byMonth.get(x.month)||0) + x.n);
    const months = [...byMonth.keys()].sort();
    const curKey = note.today.slice(0,7);
    if (!selected || !byMonth.has(selected)) selected = byMonth.has(curKey) ? curKey : months[months.length-1];
    const max = Math.max(1, ...byMonth.values());
    const label = k => k ? `${FULL[+k.slice(5)-1]} ${k.slice(0,4)}` : "No date";
    const short = k => k ? MN[+k.slice(5)-1] : "–";

    const sel = rows.filter(x => x.month === selected);
    const total = byMonth.get(selected) || 0;
    const groups = new Map();
    for (const x of sel) { if (!groups.has(x.cat)) groups.set(x.cat, {sum:0, items:[]}); const g = groups.get(x.cat); g.sum += x.n; g.items.push(x); }
    const gs = [...groups].sort((p,q) => q[1].sum - p[1].sum);
    const catNames = [...new Set(rows.map(x => x.cat))];

    app.innerHTML = `
      <div class="hero">
        <div class="m">${esc(label(selected))}</div>
        <div class="total">${kr(total)}</div>
        <div class="sub">${sel.length} ${sel.length===1?"entry":"entries"}</div>
      </div>
      <div class="label">By month</div>
      <div class="card"><div class="chart">${months.map(k => `
        <button class="col ${k===selected?"sel":""}" data-m="${esc(k)}">
          <div class="v">${kr(byMonth.get(k))}</div>
          <div class="b" style="height:${Math.max(3, 100*byMonth.get(k)/max*0.8)}%"></div>
          <div class="n">${esc(short(k))}</div>
        </button>`).join("")}</div></div>
      <div class="label">By category</div>
      <div class="card">${gs.length ? gs.map(([k,g]) => `
        <div class="grp"><b>${esc(k)}</b><span class="amt">${kr(g.sum)}</span></div>
        ${g.items.map(x => `<div class="item"><div class="grow">${esc(x.item)}<div class="muted">${esc(x.date)}</div></div><div class="amt">${kr(x.n)}</div></div>`).join("")}
      `).join("") : `<div class="empty">No expenses this month.</div>`}</div>
      <div class="label">Add an expense</div>
      <div class="card">
        <form id="add">
          <input name="item" placeholder="What" required>
          <select name="cat">${catNames.map(k => `<option>${esc(k)}</option>`).join("")}</select>
          <input name="amount" placeholder="kr" inputmode="decimal" required>
          <button class="add">Add</button>
        </form>
        ${error ? `<div class="err">${esc(error)}</div>` : ""}
      </div>`;
    app.querySelectorAll(".col").forEach(b => b.addEventListener("click", () => { selected = b.dataset.m; render(amber.note); }));
    document.getElementById("add").addEventListener("submit", async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const values = { [t.columns[a].name]: String(f.get("amount")).trim() };
      if (item >= 0) values[t.columns[item].name] = String(f.get("item")).trim();
      if (cat >= 0) values[t.columns[cat].name] = String(f.get("cat"));
      if (date >= 0) values[t.columns[date].name] = amber.note.today;
      selected = null;
      const r = await amber.update({ op:"append_row", table:t.index, values });
      error = r.ok ? "" : r.error;
      if (!r.ok) render(amber.note);
    });
  }
  amber.onChange(render);
</script>
</body>
</html>
