<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--bg:#fff;--fg:#222;--mut:#777;--card:#f4f1ec;--acc:#d9822b;--line:#e3ddd3}
@media(prefers-color-scheme:dark){:root{--bg:#1b1b1b;--fg:#eee;--mut:#999;--card:#272624;--acc:#f0a050;--line:#3a3834}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
h1{font-size:20px;margin:0 0 12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.c{background:var(--card);border-radius:10px;padding:10px}.c b{display:block;font-size:20px}.c span{color:var(--mut);font-size:12px}
h2{font-size:14px;color:var(--mut);margin:16px 0 6px}
svg{width:100%;height:auto;background:var(--card);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
</style></head><body><h1>Running</h1><div class="g" id="s"></div>
<h2>Weekly distance (km)</h2><div id="w"></div><h2>Avg HR per run</h2><div id="h"></div><h2>Runs</h2><table id="t"></table>
<script>
function wk(d){var x=new Date(d+"T00:00:00");var day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toISOString().slice(0,10)}
function bars(el,labels,vals,fmt){var W=600,H=160,p=24,n=vals.length,mx=Math.max.apply(0,vals),bw=(W-2*p)/n,s='<svg viewBox="0 0 '+W+' '+H+'">';
vals.forEach(function(v,i){var h=(H-2*p)*v/mx;s+='<rect x="'+(p+i*bw+2)+'" y="'+(H-p-h)+'" width="'+(bw-4)+'" height="'+h+'" rx="3" fill="var(--acc)"/>';if(n<=16)s+='<text x="'+(p+i*bw+bw/2)+'" y="'+(H-8)+'" font-size="9" text-anchor="middle" fill="var(--mut)">'+labels[i].slice(5)+'</text>';if(n<=16)s+='<text x="'+(p+i*bw+bw/2)+'" y="'+(H-p-h-3)+'" font-size="9" text-anchor="middle" fill="var(--fg)">'+fmt(v)+'</text>'});
el.innerHTML=s+'</svg>'}
amber.onChange(function(n){var t=n.tables[0];if(!t)return;var r=t.rows.map(function(x){return{d:x[0],k:parseFloat(x[1])||0,m:parseFloat(x[2])||0,h:parseFloat(x[3])||0}}).filter(function(x){return x.d});
var K=r.reduce(function(a,x){return a+x.k},0),M=r.reduce(function(a,x){return a+x.m},0),H=r.reduce(function(a,x){return a+x.h},0)/(r.length||1);
var pace=K?M/K:0,pm=Math.floor(pace),ps=Math.round((pace-pm)*60);if(ps==60){pm++;ps=0}
var longest=Math.max.apply(0,r.map(function(x){return x.k}));
function c(b,s){return'<div class="c"><b>'+b+'</b><span>'+s+'</span></div>'}
document.getElementById('s').innerHTML=c(r.length,'runs')+c(K.toFixed(1),'total km')+c(pm+':'+(ps<10?'0':'')+ps,'avg min/km')+c(Math.round(H),'avg HR')+c(longest.toFixed(1),'longest km');
var W={},o=[];r.forEach(function(x){var k=wk(x.d);if(!(k in W)){W[k]=0;o.push(k)}W[k]+=x.k});
bars(document.getElementById('w'),o,o.map(function(k){return W[k]}),function(v){return v.toFixed(0)});
bars(document.getElementById('h'),r.map(function(x){return x.d}),r.map(function(x){return x.h}),function(v){return v});
document.getElementById('t').innerHTML='<tr><th>Date</th><th>km</th><th>min</th><th>pace</th><th>HR</th></tr>'+r.slice().reverse().map(function(x){var p=x.m/x.k,a=Math.floor(p),b=Math.round((p-a)*60);if(b==60){a++;b=0}return'<tr><td>'+x.d+'</td><td>'+x.k.toFixed(1)+'</td><td>'+x.m+'</td><td>'+a+':'+(b<10?'0':'')+b+'</td><td>'+x.h+'</td></tr>'}).join('')})
</script></body></html>
