<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1c1c1e;--mut:#8a8a8e;--line:#e5e5ea;--g:#1a9d4b;--r:#d93025}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#f2f2f7;--line:#3a3a3c;--g:#4cd480;--r:#ff6b60}}
body{font:15px system-ui;background:var(--bg);color:var(--fg);margin:0;padding:16px}
h1{font-size:18px;margin:0 0 4px}.sub{color:var(--mut);font-size:12px;margin-bottom:14px}
.tot{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px}.tot div{font-size:12px;color:var(--mut)}.tot b{display:block;font-size:20px;color:var(--fg)}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mut);font-weight:500}
input{width:80px;font:inherit;text-align:right;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px}
.p{color:var(--g)}.n{color:var(--r)}
</style></head><body>
<h1>Stocks I watch</h1>
<div class="sub">Live Yahoo Finance prices can't be loaded here (pages have no network access). Enter current prices; they're remembered on this device.</div>
<div class="tot" id="tot"></div>
<table><thead><tr><th>Ticker</th><th>Shares</th><th>Buy</th><th>Now</th><th>Profit</th><th>%</th></tr></thead><tbody id="b"></tbody></table>
<script>
const K='stk-prices';let P={};try{P=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
const f=(x)=>x.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const cls=x=>x>=0?'p':'n';
function render(note){
 const t=note.tables[0];const b=document.getElementById('b');
 if(b.contains(document.activeElement)&&document.activeElement.tagName=='INPUT')return;
 b.innerHTML='';let cost=0,val=0,any=false;
 t.rows.forEach(r=>{
  const [tk,sh,bp]=[r[0],parseFloat(r[1]),parseFloat(r[2])];
  const now=parseFloat(P[tk]);const ok=!isNaN(now);
  cost+=sh*bp;
  const tr=document.createElement('tr');
  let pl='',pc='';
  if(ok){val+=sh*now;any=true;const d=sh*(now-bp);pl=`<span class="${cls(d)}">${d>=0?'+':''}${f(d)}</span>`;pc=`<span class="${cls(d)}">${f((now/bp-1)*100)}%</span>`}else val+=sh*bp;
  tr.innerHTML=`<td>${tk}</td><td>${sh}</td><td>${f(bp)}</td><td><input inputmode="decimal" value="${ok?P[tk]:''}" placeholder="price"></td><td>${pl}</td><td>${pc}</td>`;
  tr.querySelector('input').onchange=e=>{P[tk]=e.target.value;try{localStorage.setItem(K,JSON.stringify(P))}catch(x){}render(note)};
  b.appendChild(tr)});
 const d=val-cost;
 document.getElementById('tot').innerHTML=`<div>Cost<b>${f(cost)}</b></div><div>Value<b>${f(val)}</b></div><div>Profit<b class="${cls(d)}">${d>=0?'+':''}${f(d)} (${f(cost?d/cost*100:0)}%)</b></div>`;
}
amber.onChange(render);
</script></body></html>
