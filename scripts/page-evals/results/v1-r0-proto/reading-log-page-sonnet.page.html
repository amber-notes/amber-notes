<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--bg:#fbf7f1;--fg:#2b2118;--card:#fff;--mut:#8a7a6a;--acc:#d98324;--bd:#eadfce}
@media(prefers-color-scheme:dark){:root{--bg:#1d1813;--fg:#f2e8da;--card:#2a231c;--mut:#a69683;--bd:#3a3128}}
body{margin:0;padding:18px;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
h1{margin:0 0 14px;font-size:22px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 8px}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;flex:1;min-width:110px}
.stat b{display:block;font-size:26px;color:var(--acc)}.stat span{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.book{border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--bd)}
.cover{aspect-ratio:2/3;padding:12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-sizing:border-box}
.cover .t{font-weight:700;font-size:16px;line-height:1.2;font-family:Georgia,serif}.cover .a{font-size:12px;opacity:.9}
.meta{padding:8px 10px;font-size:12px;color:var(--mut);display:flex;justify-content:space-between}.stars{color:var(--acc);letter-spacing:1px}
.bars{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.row .l{width:62px;color:var(--mut)}
.bar{height:14px;border-radius:7px;background:var(--acc);min-width:4px}.row .n{color:var(--mut)}
</style></head><body><h1>📚 Reading log</h1><div class="stats" id="s"></div><h2>Books per month</h2><div class="bars" id="m"></div><h2>Books</h2><div class="grid" id="g"></div>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
amber.onChange(n=>{
const t=n.tables[0];if(!t)return;
const ci=k=>t.columns.findIndex(c=>c.name===k);
const books=t.rows.map(r=>({t:r[ci('Title')],a:r[ci('Author')],d:r[ci('Finished')]||'',r:parseInt(r[ci('Rating')])||0})).filter(b=>b.t);
const rated=books.filter(b=>b.r);const avg=rated.length?(rated.reduce((x,b)=>x+b.r,0)/rated.length):0;
const months={};books.forEach(b=>{if(b.d)months[b.d.slice(0,7)]=(months[b.d.slice(0,7)]||0)+1});
const keys=Object.keys(months).sort();
const yr=n.today.slice(0,4);const thisYear=books.filter(b=>b.d.startsWith(yr)).length;
document.getElementById('s').innerHTML=`<div class="stat"><b>${books.length}</b><span>books read</span></div><div class="stat"><b>${avg?avg.toFixed(1):'–'}</b><span>average rating</span></div><div class="stat"><b>${thisYear}</b><span>in ${yr}</span></div>`;
const max=Math.max(1,...Object.values(months));
document.getElementById('m').innerHTML=keys.map(k=>`<div class="row"><span class="l">${MN[+k.slice(5)-1]} ${k.slice(2,4)}</span><div class="bar" style="width:${months[k]/max*60}%"></div><span class="n">${months[k]}</span></div>`).join('')||'<span class="n">No dates yet</span>';
document.getElementById('g').innerHTML=books.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(b=>{const h=hue(b.t);
return `<div class="book"><div class="cover" style="background:linear-gradient(160deg,hsl(${h},50%,42%),hsl(${(h+40)%360},55%,28%))"><div class="t">${esc(b.t)}</div><div class="a">${esc(b.a)}</div></div><div class="meta"><span class="stars">${'★'.repeat(b.r)}${'☆'.repeat(5-b.r)}</span><span>${esc(b.d.slice(5))}</span></div></div>`}).join('');
});
</script></body></html>
