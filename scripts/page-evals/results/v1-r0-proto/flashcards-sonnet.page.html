<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--bg:#faf7f2;--fg:#222;--card:#fff;--acc:#d97706;--mut:#777;--ok:#16a34a;--bd:#e5dfd5}
@media(prefers-color-scheme:dark){:root{--bg:#1b1a18;--fg:#eee;--card:#2a2825;--mut:#999;--bd:#3d3a35}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding:16px;max-width:480px;margin:auto}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:12px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--ok)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;user-select:none;box-shadow:0 4px 14px #0001}
.w{font-size:36px;font-weight:700}.hint{color:var(--mut);font-size:13px;margin-top:14px}.tag{font-size:12px;color:var(--ok);margin-top:10px}
.row{display:flex;gap:10px;margin-top:14px}button{flex:1;padding:16px;font-size:16px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.y{background:var(--ok);color:#fff;border:0}.n{background:var(--acc);color:#fff;border:0}
.small{margin-top:14px;text-align:center}.small button{flex:none;padding:10px 14px;font-size:14px}
</style></head><body><div id="app"></div><script>
let flipped=false,idx=0,showAll=false,deck=[],busy=false;
function build(n){const t=n.tables[0];if(!t)return[];const ci=t.columns.findIndex(c=>c.name==="Known");
return t.rows.map((r,i)=>({i,es:r[0],en:r[1],known:/^(yes|true|y|✓)$/i.test((r[ci]||"").trim())}))}
let note=null;
function order(){const all=build(note);const un=all.filter(c=>!c.known),kn=all.filter(c=>c.known);return {all,un,list:showAll?un.concat(kn):un}}
function render(){const {all,un,list}=order();const app=document.getElementById("app");
const k=all.length-un.length;
let h=`<div class="top"><span>${k} / ${all.length} known</span><span>${un.length} to learn</span></div><div class="bar"><i style="width:${all.length?k/all.length*100:0}%"></i></div>`;
if(!list.length){h+=`<div class="card" style="cursor:default"><div class="w">🎉</div><div class="hint">You know every verb!</div></div><div class="small"><button onclick="showAll=true;idx=0;render()">Review all</button> <button onclick="reset()">Reset progress</button></div>`;app.innerHTML=h;return}
if(idx>=list.length)idx=0;const c=list[idx];
h+=`<div class="card" onclick="flipped=!flipped;render()"><div class="w">${flipped?c.en:c.es}</div>${c.known?'<div class="tag">✓ known</div>':''}<div class="hint">${flipped?'English':'Spanish'} · tap to flip · ${idx+1}/${list.length}</div></div>
<div class="row"><button class="n" onclick="mark(${c.i},false)">Still learning</button><button class="y" onclick="mark(${c.i},true)">I know it</button></div>
<div class="row"><button onclick="go(-1)">← Prev</button><button onclick="go(1)">Next →</button></div>
<div class="small"><button onclick="showAll=!showAll;idx=0;flipped=false;render()">${showAll?'Only unknown':'Include known'}</button> <button onclick="reset()">Reset</button></div>`;
app.innerHTML=h}
function go(d){const l=order().list;idx=(idx+d+l.length)%l.length;flipped=false;render()}
async function mark(i,v){if(busy)return;busy=true;flipped=false;
await amber.update({op:"set_cell",table:0,row:i,col:"Known",value:v?"Yes":"No"});busy=false;if(!v)idx++}
async function reset(){for(const c of build(note))if(c.known)await amber.update({op:"set_cell",table:0,row:c.i,col:"Known",value:"No"});showAll=false;idx=0}
amber.onChange(n=>{note=n;render()});
</script></body></html>
