<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="amber-settings" content='{"settings":[{"key":"goal","label":"Daily goal in glasses","type":"number","default":8,"min":1,"max":30,"step":1}]}'>
<style>
:root{--water:#096aab;--water-soft:#e9f5ff;--water-deep:#084a79;--water-line:#7bb8dc}
@media(prefers-color-scheme:dark){:root{--water:#71c7ff;--water-soft:#102b40;--water-deep:#b8e2ff;--water-line:#4384ae}}
*{box-sizing:border-box}body{margin:0;font-family:var(--amber-font);color:var(--amber-text)}
main{max-width:var(--amber-content-max,1100px);margin:auto;padding:24px var(--amber-gutter,20px) 40px}h1{font-size:2rem;margin:0;letter-spacing:-.04em}header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}.muted{color:var(--amber-text-secondary)}.layout{display:grid;gap:28px}.today{background:var(--water-soft);border-radius:28px;padding:24px;text-align:center;color:var(--water-deep)}h2{font-size:1.2rem;margin:0 0 16px}.gauge{position:relative;max-width:280px;margin:0 auto 16px;aspect-ratio:1}.gauge svg{width:100%;height:100%}.reading{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center}.number{font-size:4rem;font-weight:750;line-height:1;font-variant-numeric:tabular-nums}.reading span:last-child{margin-top:10px;font-size:1rem}.status{font-size:1.25rem;font-weight:650;margin:12px 0 20px}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{font:inherit;font-weight:650;border:1px solid var(--amber-separator);border-radius:14px;min-height:48px;padding:12px 18px;background:var(--amber-surface);color:var(--amber-text);cursor:pointer}button.primary{background:var(--water);color:#fff;border-color:var(--water)}@media(prefers-color-scheme:dark){button.primary{color:#08283e}}button:disabled{opacity:.55;cursor:default}button:focus-visible{outline:3px solid var(--water);outline-offset:3px}.err{color:var(--amber-danger);margin:12px 0 0;min-height:1.4rem}.history{min-width:0;padding:8px 0}.chart{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:5px;height:220px;align-items:end;margin:16px 0 12px;border-bottom:1px solid var(--amber-separator);position:relative}.day{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;min-width:0}.bar{width:100%;max-width:40px;height:var(--height);background:var(--water-line);border-radius:6px 6px 0 0;min-height:2px;position:relative}.day.hit .bar{background:var(--water)}.day.current .bar{outline:2px solid var(--water-deep);outline-offset:2px}.count{font-size:.75rem;line-height:1.5;color:var(--amber-text);font-variant-numeric:tabular-nums}.date{font-size:.75rem;position:absolute;bottom:-24px;color:var(--amber-text-secondary)}.goal-line{position:absolute;bottom:var(--level);left:0;right:0;border-top:2px dashed var(--water-deep);pointer-events:none;z-index:1}.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:36px;font-size:.875rem}.key{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--water);margin-right:6px}.key.line{height:0;border-top:2px dashed var(--water-deep);width:20px;border-radius:0;vertical-align:middle;background:none}.summary{display:flex;flex-wrap:wrap;gap:24px;margin-top:28px;padding-top:20px;border-top:1px solid var(--amber-separator)}.summary strong{display:block;font-size:1.75rem;color:var(--water-deep);font-variant-numeric:tabular-nums}.summary span{font-size:.875rem}.empty{padding:24px;background:var(--amber-surface);border-radius:16px}.note{font-size:.875rem;line-height:1.5;margin-top:16px}
@media(min-width:900px){.layout{grid-template-columns:minmax(300px, .9fr) minmax(0,1.4fr);gap:40px}.gauge{max-width:320px}.today{padding:32px}.chart{height:280px;gap:10px}.history{padding-top:24px}}
@media(max-width:360px){main{padding-left:14px;padding-right:14px}.today{padding:18px}.chart{gap:3px}.count,.date{font-size:.75rem}}
</style></head><body><main id="app"></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const col=(t,re)=>t.columns.findIndex(c=>re.test(c.name));
const number=s=>{const n=parseFloat(String(s??'').replace(/\s/g,'').replace(',','.'));return Number.isFinite(n)&&n>=0?n:null;};
const dayOffset=(date,n)=>{const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
let error='',busy=false;
function render(note){
 const title='<header><h1>'+esc(note.title)+'</h1><span class="muted">'+esc(note.today)+'</span></header>';
 const t=(note.tables||[]).find(t=>col(t,/^date$/i)>=0&&col(t,/^glasses$/i)>=0);
 const app=document.getElementById('app');
 if(!t){app.innerHTML=title+'<div class="empty">Add a table with Date and Glasses columns to see your progress.</div>';return;}
 const dc=col(t,/^date$/i),gc=col(t,/^glasses$/i),byDate=new Map();
 t.rows.forEach((r,i)=>{const date=String(r[dc]);const n=number(r[gc]);if(/^\d{4}-\d{2}-\d{2}$/.test(date)&&n!==null)byDate.set(date,{n,i});});
 const setting=number(amber.settings?.goal);const textGoal=number((note.markdown||'').match(/Goal:\s*([\d.,]+)\s*glasses/i)?.[1]);
 const goal=setting>0?setting:(textGoal>0?textGoal:8);
 const today=byDate.get(note.today),total=today?.n??0,pct=Math.min(1,total/goal),remaining=Math.max(0,goal-total);
 const dates=Array.from({length:14},(_,i)=>dayOffset(note.today,i-13));
 const values=dates.map(d=>byDate.get(d)?.n),max=Math.max(goal,...values.filter(v=>v!==undefined))+2;
 const past=dates.slice(0,-1).map(d=>byDate.get(d)?.n).filter(v=>v!==undefined);
 const hit=past.filter(n=>n>=goal).length,avg=past.length?(past.reduce((a,b)=>a+b,0)/past.length).toFixed(1):null;
 const chartLabel=dates.map((d,i)=>d+': '+(values[i]===undefined?'not logged':values[i]+' glasses')).join('; ');
 const bars=dates.map((d,i)=>{const n=values[i],height=(n??0)/max*100;return '<div class="day '+(n>=goal?'hit ':'')+(d===note.today?'current':'')+'"><span class="count">'+(n===undefined?'·':esc(n))+'</span><div class="bar" style="--height:'+height+'%;'+(n===undefined?'background:var(--amber-fill);':'')+'"></div><span class="date">'+esc(d.slice(-2))+'</span></div>';}).join('');
 app.innerHTML=title+'<div class="layout"><section class="today"><h2>Today</h2><div class="gauge"><svg viewBox="0 0 240 240" role="img" aria-label="'+esc(total+' of '+goal+' glasses logged today')+'"><circle cx="120" cy="120" r="104" fill="none" stroke="var(--amber-separator)" stroke-width="16"/><circle cx="120" cy="120" r="104" fill="none" stroke="var(--water)" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+(pct*653.45)+' 653.45" transform="rotate(-90 120 120)"/></svg><div class="reading"><span class="number">'+esc(total)+'</span><span>of '+esc(goal)+' glasses</span></div></div><p class="status">'+(remaining?esc(remaining)+' glasses to go':'Goal reached')+'</p><div class="actions"><button class="primary" id="add" '+(busy?'disabled':'')+'>+ Log a glass</button><button id="minus" aria-label="Remove one glass from today" '+(busy||total<=0?'disabled':'')+'>− 1</button></div><p class="err" role="alert">'+esc(error)+'</p>'+(!today?'<p class="note">Nothing logged today yet.</p>':'')+'</section><section class="history"><h2>Last 14 days</h2><p class="muted">'+esc(dates[0].slice(5))+' to '+esc(note.today.slice(5))+'</p><div class="chart" role="img" aria-label="'+esc(chartLabel)+'"><div class="goal-line" style="--level:'+goal/max*100+'%"></div>'+bars+'</div><div class="legend"><span><i class="key"></i>Goal reached</span><span><i class="key line"></i>'+esc(goal)+'-glass goal</span><span>· Not logged</span></div><div class="summary"><div><strong>'+hit+' / '+past.length+'</strong><span>Previous logged days at goal</span></div><div><strong>'+(avg??'No data')+'</strong><span>Average glasses, excluding today</span></div></div><p class="muted note">Today is outlined. Missing days are unlogged, not zero.</p></section></div>';
 document.getElementById('add').onclick=()=>change(1);
 document.getElementById('minus').onclick=()=>change(-1);
 async function change(delta){
  if(busy)return;busy=true;error='';render(amber.note);
  try{
   const current=amber.note.tables.find(x=>x.index===t.index);
   const row=current.rows.findIndex(r=>r[dc]===amber.note.today);
   const value=Math.max(0,(row>=0?(number(current.rows[row][gc])??0):0)+delta);
   const result=await amber.update(row>=0?{op:'set_cell',table:t.index,row,col:gc,value:String(value)}:{op:'append_row',table:t.index,values:{[t.columns[dc].name]:amber.note.today,[t.columns[gc].name]:String(value)}});
   if(!result.ok)error=result.error||'Could not save. Please try again.';
  }catch(e){error='Could not save. Please try again.';}
  finally{busy=false;render(amber.note);}
 }
}
amber.onChange(render);
</script></body></html>
