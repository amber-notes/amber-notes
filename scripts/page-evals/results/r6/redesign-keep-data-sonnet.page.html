<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household expenses</title>
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 12px var(--amber-gutter) 80px; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 6px 0 4px; }
  .hero { padding: 8px 0 18px; }
  .monthname { color: var(--amber-text-secondary); font-size: 15px; }
  .total { font-size: 52px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 2px 0; }
  .sub { color: var(--amber-text-secondary); font-size: 15px; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 0 4px 8px; }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); margin-bottom: 20px; overflow: hidden; }
  .months { display: flex; align-items: flex-end; gap: 10px; padding: 16px; overflow-x: auto; }
  .m { flex: 1 0 64px; max-width: 140px; display: flex; flex-direction: column; align-items: stretch; gap: 6px; background: none; color: var(--amber-text); border: 0; padding: 4px; min-height: 44px; border-radius: var(--amber-radius-small); font: inherit; cursor: pointer; }
  .m .track { height: 120px; display: flex; align-items: flex-end; }
  .m .fill { width: 100%; min-height: 3px; background: var(--amber-fill); border-radius: 6px 6px 2px 2px; border: 1px solid var(--amber-separator); }
  .m[aria-pressed="true"] .fill { background: var(--amber-accent); border-color: var(--amber-accent); }
  .m[aria-pressed="true"] { background: var(--amber-accent-soft); }
  .m .v { font-size: 13px; font-variant-numeric: tabular-nums; text-align: center; font-weight: 600; }
  .m .n { font-size: 13px; text-align: center; color: var(--amber-text-secondary); }
  .grouphead { display: flex; justify-content: space-between; gap: 10px; padding: 12px 16px; background: var(--amber-accent-soft); font-weight: 700; }
  .item { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--amber-separator); min-height: 48px; }
  .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .muted { color: var(--amber-text-secondary); font-size: 13px; }
  .amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
  form { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--amber-text-secondary); flex: 1 1 130px; }
  input { font: inherit; font-size: 16px; color: var(--amber-text); background: var(--amber-fill); border: 0; border-radius: var(--amber-radius-small); padding: 10px 12px; min-height: 44px; width: 100%; }
  .add { font: inherit; font-weight: 600; min-height: 44px; padding: 0 18px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-accent); color: var(--amber-on-accent); align-self: flex-end; }
  .err { color: var(--amber-danger); padding: 0 16px 12px; }
  @media (min-width: 900px) {
    .total { font-size: 76px; }
    .cols { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 28px; align-items: start; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const kr = (n) => n.toLocaleString("sv-SE", { maximumFractionDigits: 0 }) + " kr";
  const MN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const monthLabel = (k) => MN[+k.slice(5, 7) - 1] + " " + k.slice(0, 4);
  let selected = null, error = "";

  function render(note) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => t.columns.some((c) => /^(amt|amount|cost|price|sum|kr)$/i.test(c.name)));
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Date, Item, Category and Amt columns.</div>`; return; }
    const ci = (re) => t.columns.findIndex((c) => re.test(c.name));
    const a = ci(/^(amt|amount|cost|price|sum|kr)$/i), cat = ci(/categ/i), item = ci(/item|what|description/i), date = ci(/^date$/i);
    const rows = t.rows.map((r, i) => ({
      i, r,
      n: parseFloat(String(r[a]).replace(/\s/g, "").replace(",", ".")) || 0,
      m: date >= 0 && /^\d{4}-\d{2}/.test(r[date]) ? r[date].slice(0, 7) : "",
      c: (cat >= 0 && r[cat]) || "Other"
    }));
    const byMonth = new Map();
    for (const x of rows) if (x.m) byMonth.set(x.m, (byMonth.get(x.m) || 0) + x.n);
    const keys = [...byMonth.keys()].sort();
    const todayM = note.today.slice(0, 7);
    if (!selected || !byMonth.has(selected)) selected = byMonth.has(todayM) ? todayM : (keys[keys.length - 1] || todayM);
    const max = Math.max(1, ...byMonth.values());
    const cur = rows.filter((x) => x.m === selected);
    const total = cur.reduce((s, x) => s + x.n, 0);
    const groups = new Map();
    for (const x of cur) { if (!groups.has(x.c)) groups.set(x.c, []); groups.get(x.c).push(x); }
    const gl = [...groups].map(([k, xs]) => [k, xs, xs.reduce((s, x) => s + x.n, 0)]).sort((p, q) => q[2] - p[2]);
    const allCats = [...new Set(rows.map((x) => x.c))];

    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="hero">
        <div class="monthname">${esc(monthLabel(selected))}</div>
        <div class="total">${kr(total)}</div>
        <div class="sub">${cur.length} ${cur.length === 1 ? "entry" : "entries"}</div>
      </div>
      <div class="cols"><section>
        <div class="label">By month</div>
        <div class="card months">${keys.length ? keys.map((k) => `<button class="m" data-m="${k}" aria-pressed="${k === selected}" aria-label="${esc(monthLabel(k))}: ${kr(byMonth.get(k))}">
          <div class="v">${kr(byMonth.get(k))}</div>
          <div class="track"><div class="fill" style="height:${Math.max(2, 100 * byMonth.get(k) / max).toFixed(1)}%"></div></div>
          <div class="n">${MN[+k.slice(5, 7) - 1].slice(0, 3)} ${k.slice(2, 4)}</div></button>`).join("") : '<div class="empty" style="flex:1">No dated expenses yet.</div>'}</div>
        <div class="label">Add an expense</div>
        <div class="card">
          <form id="add">
            <label>What<input name="item" required></label>
            <label>Category<input name="cat" list="cats" value="${esc(allCats[0] || "")}"></label>
            <label>Amount (kr)<input name="amount" inputmode="decimal" required></label>
            <button class="add">Add</button>
            <datalist id="cats">${allCats.map((c) => `<option value="${esc(c)}">`).join("")}</datalist>
          </form>
          ${error ? `<div class="err" role="alert">${esc(error)}</div>` : ""}
        </div>
      </section><section>
        <div class="label">${esc(monthLabel(selected))} by category</div>
        ${gl.length ? gl.map(([k, xs, sum]) => `<div class="card">
          <div class="grouphead"><span>${esc(k)}</span><span class="amt">${kr(sum)}</span></div>
          ${xs.map((x) => `<div class="item"><div class="grow">${esc(item >= 0 ? x.r[item] : "")}<div class="muted">${esc(date >= 0 ? x.r[date] : "")}</div></div><div class="amt">${kr(x.n)}</div></div>`).join("")}
        </div>`).join("") : '<div class="card empty">Nothing spent this month.</div>'}
      </section></div>`;

    app.querySelectorAll(".m").forEach((b) => b.onclick = () => { selected = b.dataset.m; render(amber.note); });
    document.getElementById("add").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const values = { [t.columns[a].name]: String(f.get("amount")).trim() };
      if (item >= 0) values[t.columns[item].name] = String(f.get("item")).trim();
      if (cat >= 0) values[t.columns[cat].name] = String(f.get("cat")).trim() || "Other";
      if (date >= 0) values[t.columns[date].name] = amber.note.today;
      const r = await amber.update({ op: "append_row", table: t.index, values });
      error = r.ok ? "" : r.error;
      if (r.ok) selected = amber.note.today.slice(0, 7); else render(amber.note);
    });
  }
  amber.onChange(render);
</script>
</body>
</html>
