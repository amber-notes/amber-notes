<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 96px; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--amber-text-secondary); margin: 20px 0 8px; }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); border: 1px solid var(--amber-separator); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--amber-separator); min-height: 48px; }
  .row:first-child { border-top: 0; }
  .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .muted { color: var(--amber-text-secondary); font-size: 14px; }
  .big { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--amber-accent-text); }
  .hero { padding: 16px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-accent); color: var(--amber-on-accent); }
  button:disabled { opacity: .6; }
  .check { display: flex; align-items: center; gap: 12px; width: 100%; background: none; color: var(--amber-text); text-align: left; padding: 0; font-weight: 400; }
  .box { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--amber-text-secondary); flex: none; display: grid; place-items: center; }
  .box.on { background: var(--amber-accent); border-color: var(--amber-accent); color: var(--amber-on-accent); }
  .done { text-decoration: line-through; color: var(--amber-text-secondary); }
  .msg { padding: 0 16px 14px; min-height: 1em; font-size: 14px; }
  .err { color: var(--amber-danger); }
  .grid { display: grid; gap: 16px; }
  @media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; align-items: start; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const MON = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  let msg = "", isErr = false;

  function flightDate(md, today) {
    const m = md.match(/out\s+(?:\w+\s+)?(\d{1,2})\s+([a-z]{3})\w*\s+(\d{1,2}):(\d{2})/i);
    if (!m) return null;
    const mo = MON.indexOf(m[2].toLowerCase());
    if (mo < 0) return null;
    let y = +today.slice(0, 4);
    return { y, mo, d: +m[1], h: +m[3], mi: +m[4] };
  }
  const pad = (n) => String(n).padStart(2, "0");

  function parse(md) {
    const lines = md.split("\n");
    const facts = [];
    lines.forEach((l) => {
      const m = l.match(/^(flights|hotel|budget)\s*[:~]?\s*(.+)$/i);
      if (m) facts.push({ label: m[1][0].toUpperCase() + m[1].slice(1).toLowerCase(), value: m[2].replace(/^~\s*/, "~ ") });
    });
    const ideas = [];
    let inIdeas = false;
    lines.forEach((l) => {
      if (/^ideas\s*$/i.test(l.trim())) { inIdeas = true; return; }
      if (inIdeas) {
        const m = l.match(/^\s*[-*]\s+(?!\[[ xX]\])(.+)$/);
        if (m) ideas.push(m[1]); else if (l.trim() === "" ) { if (ideas.length) inIdeas = false; } else inIdeas = false;
      }
    });
    return { facts, ideas };
  }

  function render(note) {
    const app = document.getElementById("app");
    const { facts, ideas } = parse(note.markdown);
    const f = flightDate(note.markdown, note.today);
    let hero = "";
    if (f) {
      const days = Math.round((Date.UTC(f.y, f.mo, f.d) - Date.UTC(...note.today.split("-").map((v, i) => i === 1 ? v - 1 : +v))) / 864e5);
      const label = days > 0 ? `${days} day${days === 1 ? "" : "s"} to go` : days === 0 ? "Flight is today" : "Trip started";
      const eve = new Date(f.y, f.mo, f.d - 1);
      const evLabel = eve.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "short" });
      hero = `<div class="card"><div class="hero"><span class="big">${esc(label)}</span><span class="muted">Flight ${esc(f.d)} ${esc(MON[f.mo])} at ${pad(f.h)}:${pad(f.mi)}</span></div>
        <div class="row"><div class="grow"><div>Pack the evening before</div><div class="muted">Reminder for ${esc(evLabel)}, 20:00</div></div><button id="rem">Set reminder</button></div>
        <div class="msg ${isErr ? "err" : ""}" role="status">${esc(msg)}</div></div>`;
    } else {
      hero = `<div class="card"><div class="row muted">Add a line like "out fri 16 oct 07:10" to the note to enable the packing reminder.</div></div>`;
    }
    const factsHtml = facts.length ? `<div class="card">${facts.map((x) => `<div class="row"><div class="grow"><div class="muted">${esc(x.label)}</div><div>${esc(x.value)}</div></div></div>`).join("")}</div>` : "";
    const ideasHtml = ideas.length ? `<h2>Ideas</h2><div class="card">${ideas.map((i) => `<div class="row"><div class="grow">${esc(i)}</div></div>`).join("")}</div>` : "";
    const cl = note.checklists;
    const todo = cl.length ? `<h2>To do before (${cl.filter((c) => c.checked).length}/${cl.length})</h2><div class="card">${cl.map((c) => `<div class="row"><button class="check" data-line="${c.line}" aria-pressed="${c.checked}"><span class="box ${c.checked ? "on" : ""}">${c.checked ? "✓" : ""}</span><span class="grow ${c.checked ? "done" : ""}">${esc(c.text)}</span></button></div>`).join("")}</div>` : "";
    app.innerHTML = `<h1>${esc(note.title)}</h1>${hero}<div class="grid"><div><h2>Details</h2>${factsHtml}${ideasHtml}</div><div>${todo}</div></div>`;

    const b = document.getElementById("rem");
    if (b) b.onclick = async () => {
      b.disabled = true;
      const due = `${f.y}-${pad(f.mo + 1)}-${pad(f.d - 1 > 0 ? f.d - 1 : 1)}T20:00:00`;
      const d = new Date(f.y, f.mo, f.d - 1, 20, 0, 0);
      const dueIso = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T20:00:00`;
      let r;
      try { r = await amber.device.reminders.create({ title: "Pack for Porto (flight tomorrow 07:10)", due: dueIso }); } catch (e) { r = { ok: false }; }
      isErr = !(r && r.ok !== false);
      msg = isErr ? "Couldn't set the reminder (declined or not available)." : "Reminder set for the evening before.";
      render(amber.note);
    };
    app.querySelectorAll(".check").forEach((el) => el.onclick = async () => {
      const r = await amber.update({ op: "toggle_checklist", line: +el.dataset.line });
      if (!r.ok) { isErr = true; msg = r.error; render(amber.note); }
    });
  }
  amber.onChange(render);
</script>
</body>
</html>
