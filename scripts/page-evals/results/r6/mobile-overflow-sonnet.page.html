<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}
main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 48px}
h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 16px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:14px 16px;min-width:0}
.card.today{border-color:var(--amber-accent)}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.day{font-weight:700;font-size:18px}
.badge{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--amber-accent-soft);color:var(--amber-accent-text)}
.meal{display:flex;gap:12px;padding:6px 0;border-top:1px solid var(--amber-separator)}
.meal:first-of-type{border-top:0}
.k{flex:0 0 84px;color:var(--amber-text-secondary);font-size:14px}
.v{flex:1;min-width:0;overflow-wrap:anywhere}
.note{margin-top:6px;color:var(--amber-text-secondary);font-size:14px;overflow-wrap:anywhere}
.empty{padding:28px 16px;text-align:center;color:var(--amber-text-secondary)}
@media (min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main><h1 id="t"></h1><div class="grid" id="g"></div></main><script>
const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
amber.onChange((note)=>{
t.textContent=note.title;
const tb=note.tables.find(x=>x.columns.some(c=>/^day$/i.test(c.name)))||note.tables[0];
if(!tb||!tb.rows.length){g.innerHTML='<div class="card empty">Add a table with a Day column to see your plan.</div>';return}
const names=tb.columns.map(c=>c.name);
const di=Math.max(0,names.findIndex(n=>/^day$/i.test(n)));
const si=names.findIndex(n=>/^shop$/i.test(n));
const ni=names.findIndex(n=>/^notes?$/i.test(n));
const wd=new Date(note.today+"T12:00:00").toLocaleDateString("en-US",{weekday:"long"});
g.innerHTML=tb.rows.map(r=>{
const meals=names.map((n,i)=>i!==di&&i!==si&&i!==ni&&r[i]?'<div class="meal"><div class="k">'+esc(n)+'</div><div class="v">'+esc(r[i])+'</div></div>':"").join("");
const shop=si>=0&&/^(yes|y|true|1|✓)$/i.test((r[si]||"").trim())?'<span class="badge">Shop</span>':"";
const isT=(r[di]||"").trim().toLowerCase()===wd.toLowerCase();
return '<div class="card'+(isT?' today':'')+'"><div class="head"><span class="day">'+esc(r[di])+(isT?' · today':'')+'</span>'+shop+'</div>'+meals+(ni>=0&&r[ni]?'<div class="note">'+esc(r[ni])+'</div>':"")+'</div>'}).join("")});
</script></body></html>
