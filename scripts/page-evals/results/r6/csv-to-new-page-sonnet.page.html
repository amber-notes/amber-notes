<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 96px; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 16px; }
  h2 { font-size: 15px; margin: 0; padding: 14px 16px 0; color: var(--amber-text-secondary); font-weight: 600; }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); border: 1px solid var(--amber-separator); margin-bottom: 16px; overflow: hidden; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 14px 16px; }
  .stat b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  .stat.main { background: var(--amber-accent-soft); }
  .muted { color: var(--amber-text-secondary); font-size: 13px; }
  .chart { padding: 12px 16px 16px; display: flex; align-items: flex-end; gap: 6px; height: 170px; }
  .bar { flex: 1; background: var(--amber-accent); border-radius: 4px 4px 0 0; min-width: 4px; }
  .barwrap { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; align-items: stretch; min-width: 0; }
  .barwrap span { font-size: 10px; text-align: center; color: var(--amber-text-secondary); margin-top: 4px; white-space: nowrap; overflow: hidden; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 10px 16px; border-top: 1px solid var(--amber-separator); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 13px; color: var(--amber-text-secondary); font-weight: 600; border-top: 0; }
  form { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 16px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--amber-text-secondary); flex: 1 1 100px; }
  input { font: inherit; color: var(--amber-text); background: var(--amber-fill); border: 0; border-radius: var(--amber-radius-small); padding: 10px 12px; min-height: 44px; width: 100%; }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 20px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-accent); color: var(--amber-on-accent); align-self: flex-end; }
  .err { color: var(--amber-danger); padding: 0 16px 12px; }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
  @media (min-width: 900px) { .stats { grid-template-columns: repeat(4, 1fr); } .stat b { font-size: 32px; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const num = s => { const n = parseFloat(String(s).replace(/\s/g, "").replace(",", ".")); return isNaN(n) ? null : n; };
const fc = (t, re) => t.columns.findIndex(c => re.test(c.name));
let error = "";
function weekStart(d) { const x = new Date(d + "T00:00:00Z"); const k = (x.getUTCDay() + 6) % 7; x.setUTCDate(x.getUTCDate() - k); return x.toISOString().slice(0, 10); }
function pace(km, min) { if (!km) return "–"; const p = min / km; const m = Math.floor(p), s = Math.round((p - m) * 60); return m + ":" + String(s === 60 ? 0 : s).padStart(2, "0"); }
function render(note) {
  const app = document.getElementById("app");
  const t = note.tables.find(t => fc(t, /date/i) >= 0 && fc(t, /dist/i) >= 0);
  if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Activity Date and Distance (km) columns.</div>`; return; }
  const di = fc(t, /date/i), ki = fc(t, /dist/i), mi = fc(t, /time/i), hi = fc(t, /hr/i);
  const runs = t.rows.map((r, i) => ({ i, d: r[di], km: num(r[ki]), min: mi >= 0 ? num(r[mi]) : null, hr: hi >= 0 ? num(r[hi]) : null })).filter(r => r.d && r.km != null);
  const sorted = [...runs].sort((a, b) => b.d.localeCompare(a.d));
  const km = runs.reduce((a, r) => a + r.km, 0);
  const min = runs.reduce((a, r) => a + (r.min || 0), 0);
  const hrs = runs.filter(r => r.hr != null);
  const avgHr = hrs.length ? hrs.reduce((a, r) => a + r.hr, 0) / hrs.length : null;
  const longest = runs.reduce((a, r) => Math.max(a, r.km), 0);
  // weekly
  const wk = {};
  runs.forEach(r => { const w = weekStart(r.d); wk[w] = (wk[w] || 0) + r.km; });
  const weeks = Object.keys(wk).sort().slice(-12);
  const maxW = Math.max(1, ...weeks.map(w => wk[w]));
  const chart = weeks.map(w => `<div class="barwrap" title="Week of ${w}: ${wk[w].toFixed(1)} km"><div class="bar" style="height:${Math.round(wk[w] / maxW * 100) * 0.85}%"></div><span>${w.slice(5)}</span></div>`).join("");
  app.innerHTML = `
    <h1>${esc(note.title)}</h1>
    <div class="stats">
      <div class="stat main"><b>${km.toFixed(1)} km</b><span class="muted">Total · ${runs.length} runs</span></div>
      <div class="stat"><b>${pace(km, min)}</b><span class="muted">Avg pace min/km</span></div>
      <div class="stat"><b>${avgHr ? Math.round(avgHr) : "–"}</b><span class="muted">Avg HR</span></div>
      <div class="stat"><b>${longest.toFixed(1)} km</b><span class="muted">Longest run</span></div>
    </div>
    <div class="card"><h2>Weekly distance (km, week starting)</h2>${weeks.length ? `<div class="chart" role="img" aria-label="Weekly distance bar chart">${chart}</div>` : '<div class="empty">No runs yet.</div>'}</div>
    <div class="card"><h2>Log a run</h2>
      <form id="add">
        <label>Date<input type="date" name="d" required value="${esc(note.today)}"></label>
        <label>Distance (km)<input name="k" inputmode="decimal" required></label>
        <label>Time (min)<input name="m" inputmode="decimal"></label>
        <label>Avg HR<input name="h" inputmode="numeric"></label>
        <button>Add</button>
      </form><div class="err" role="alert">${esc(error)}</div></div>
    <div class="card"><h2>Runs</h2><div class="scroll"><table>
      <tr><th>Date</th><th>Km</th><th>Min</th><th>Pace</th><th>HR</th></tr>
      ${sorted.map(r => `<tr><td>${esc(r.d)}</td><td>${r.km.toFixed(1)}</td><td>${r.min ?? "–"}</td><td>${r.min ? pace(r.km, r.min) : "–"}</td><td>${r.hr ?? "–"}</td></tr>`).join("")}
    </table></div></div>`;
  document.getElementById("add").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target), v = {};
    v[t.columns[di].name] = f.get("d"); v[t.columns[ki].name] = f.get("k").trim();
    if (mi >= 0) v[t.columns[mi].name] = f.get("m").trim();
    if (hi >= 0) v[t.columns[hi].name] = f.get("h").trim();
    const r = await amber.update({ op: "append_row", table: t.index, values: v });
    error = r.ok ? "" : r.error;
    if (!r.ok) render(amber.note);
  };
}
amber.onChange(render);
</script>
</body>
</html>
