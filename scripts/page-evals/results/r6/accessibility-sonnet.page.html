<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 96px; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 8px; }
  h2 { font-size: 18px; margin: 0; padding: 12px 16px; }
  .sum { color: var(--amber-text-secondary); margin: 0 0 16px; }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); border: 1px solid var(--amber-separator); margin-bottom: 16px; overflow: hidden; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid var(--amber-separator); }
  label.item { display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 8px 16px; cursor: pointer; }
  label.item input { width: 26px; height: 26px; flex: none; accent-color: var(--amber-accent); margin: 0; }
  .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .done .grow { color: var(--amber-text-secondary); text-decoration: line-through; }
  .packed { font-size: 13px; color: var(--amber-text-secondary); }
  form { display: flex; flex-wrap: wrap; gap: 12px; padding: 16px; align-items: flex-end; }
  form h2 { padding: 0; width: 100%; }
  .f { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--amber-text-secondary); flex: 1 1 160px; }
  input[type=text], select { font: inherit; color: var(--amber-text); background: var(--amber-fill); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius-small); padding: 10px 12px; min-height: 44px; width: 100%; }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 20px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-accent); color: var(--amber-on-accent); }
  :focus-visible { outline: 3px solid var(--amber-accent-text); outline-offset: 2px; }
  .msg { padding: 0 16px 16px; min-height: 1.4em; margin: 0; }
  .err { color: var(--amber-danger); }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (min-width: 900px) { #lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; } #lists .card { margin: 0; } }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sum" id="sum"></p>
  <div id="lists"></div>
  <div class="card">
    <form id="add">
      <h2>Add an item</h2>
      <div class="f"><label for="v">Item name</label><input type="text" id="v" autocomplete="off"></div>
      <div class="f"><label for="sec">Section</label><select id="sec"></select></div>
      <button type="submit">Add item</button>
    </form>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </div>
</main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const $ = (id) => document.getElementById(id);
  const msg = $("msg");
  function say(text, isErr) { msg.className = "msg" + (isErr ? " err" : ""); msg.textContent = ""; setTimeout(() => { msg.textContent = text; }, 30); }

  function render(note) {
    $("title").textContent = note.title;
    const lines = note.markdown.split("\n");
    const headingAt = [];
    let cur = "Other items";
    const headings = [];
    lines.forEach((l, i) => {
      const m = l.match(/^#{1,6}\s+(.+?)\s*#*\s*$/);
      if (m && i > 0) { cur = m[1]; headings.push(cur); }
      headingAt[i + 1] = cur;
    });
    const groups = [];
    note.checklists.forEach((c) => {
      const name = headingAt[c.line] || "Other items";
      let g = groups.find((x) => x.name === name);
      if (!g) { g = { name, items: [] }; groups.push(g); }
      g.items.push(c);
    });
    const total = note.checklists.length, done = note.checklists.filter((c) => c.checked).length;
    $("sum").textContent = total ? `${done} of ${total} items packed` : "";
    const active = document.activeElement;
    const focusLine = active && active.dataset ? active.dataset.line : null;
    $("lists").innerHTML = total ? groups.map((g) => {
      const d = g.items.filter((c) => c.checked).length;
      return `<section class="card" aria-labelledby="h-${esc(g.name)}"><h2 id="h-${esc(g.name)}">${esc(g.name)} <span class="packed">(${d} of ${g.items.length} packed)</span></h2><ul>` +
        g.items.map((c) => `<li><label class="item${c.checked ? " done" : ""}"><input type="checkbox" data-line="${c.line}"${c.checked ? " checked" : ""}><span class="grow">${esc(c.text)}</span></label></li>`).join("") +
        `</ul></section>`;
    }).join("") : '<div class="card empty">No items yet. Add your first one below.</div>';
    if (focusLine) { const el = document.querySelector(`input[data-line="${focusLine}"]`); if (el) el.focus(); }
    document.querySelectorAll('input[type=checkbox]').forEach((b) => {
      b.onchange = async () => {
        const text = b.parentElement.querySelector(".grow").textContent;
        const want = b.checked;
        const r = await amber.update({ op: "toggle_checklist", line: +b.dataset.line });
        if (!r.ok) { b.checked = !want; say("Could not update " + text + ": " + r.error, true); }
        else say(text + (want ? " packed" : " not packed"));
      };
    });
    const sec = $("sec"), prev = sec.value;
    const opts = [...new Set([...groups.map((g) => g.name).filter((n) => n !== "Other items" || !headings.length), ...headings])];
    sec.innerHTML = opts.length ? opts.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join("") : '<option value="">End of note</option>';
    if (opts.includes(prev)) sec.value = prev;
  }

  $("add").onsubmit = async (e) => {
    e.preventDefault();
    const input = $("v"), text = input.value.trim();
    if (!text) { say("Type an item name first.", true); input.focus(); return; }
    const sec = $("sec").value;
    const op = { op: "add_checklist_item", text };
    if (sec) op.under_heading = sec;
    const r = await amber.update(op);
    if (r.ok) { input.value = ""; say(`Added ${text}${sec ? " to " + sec : ""}.`); }
    else say("Could not add item: " + r.error, true);
    input.focus();
  };
  amber.onChange(render);
</script>
</body>
</html>
