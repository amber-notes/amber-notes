<!doctype html>
<!-- template: trip-log | A trip at a glance: a countdown, the key facts, the day-by-day plan, and every checklist in the note (to do, ideas, packing) with tick boxes and progress. | Optionally a table with Date (yyyy-mm-dd) and What/Plan columns (plus Time, Where); checklists under headings. The trip start is the first date in the table, or amber.data.values.start. Key facts are "Label: value" lines, or amber.data.values.facts = [{ label, value }]. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: var(--amber-bg); --card: var(--amber-surface); --ink: var(--amber-text); --muted: var(--amber-text-secondary); --line: var(--amber-separator); --accent: var(--amber-accent); --accent-ink: var(--amber-on-accent); --soft: var(--amber-accent-soft); --field: var(--amber-fill); }
  * { box-sizing: border-box; }
  body { padding: 20px 18px 96px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 30px; letter-spacing: -.02em; margin: 4px 0 4px; }
  h2 { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 22px 4px 8px; }
  .count { display: inline-flex; align-items: baseline; gap: 8px; background: var(--soft); color: var(--ink); border-radius: 14px; padding: 10px 14px; margin: 8px 0 4px; }
  .count b { font-size: 34px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--amber-radius); overflow: hidden; }
  .fact { display: grid; grid-template-columns: minmax(80px, 30%) 1fr; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .fact:first-child, .day:first-child, .item:first-child { border-top: 0; }
  .fact dt { color: var(--muted); font-size: 14px; }
  .fact dd { margin: 0; overflow-wrap: anywhere; }
  .day { display: flex; gap: 14px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .day .d { flex: none; width: 52px; text-align: center; }
  .day .d b { display: block; font-size: 22px; line-height: 1; }
  .day .d span { color: var(--muted); font-size: 12px; text-transform: uppercase; }
  .day .w { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .muted { color: var(--muted); font-size: 14px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); min-height: 48px; cursor: pointer; }
  .item input { width: 22px; height: 22px; flex: none; accent-color: var(--accent); }
  .item.done span { color: var(--muted); text-decoration: line-through; }
  .bar { height: 6px; border-radius: 3px; background: var(--field); overflow: hidden; margin: 0 4px 8px; }
  .bar div { height: 100%; background: var(--accent); }
  .wx { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .wx button { font: inherit; min-height: 44px; padding: 0 14px; border: 0; border-radius: var(--amber-radius-small); background: var(--accent); color: var(--accent-ink); }
  .err { color: var(--amber-danger); min-height: 1em; margin: 8px 4px; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const col = (t, re) => t.columns.findIndex((c) => re.test(c.name));
  const strip = (s) => String(s).replace(/\*\*|__|`/g, "").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1");
  let error = "";
  let wxText = "";
  const PORTO = { lat: 41.1579, lon: -8.6291 };
  function wxSummary(w) {
    const x = (w && (w.weather || w.current || w.data)) || w || {};
    const temp = x.temperature ?? x.temp ?? x.temperatureC ?? x.temp_c;
    const cond = x.condition ?? x.summary ?? x.description ?? "";
    const parts = [];
    if (temp !== undefined) parts.push(Math.round(temp) + "°C");
    if (cond) parts.push(cond);
    return parts.length ? parts.join(" · ") : JSON.stringify(x).slice(0, 120);
  }
  async function loadWx() {
    wxText = "Loading…"; render(amber.note, amber.data);
    try {
      const r = await amber.device.weather.current(PORTO);
      if (r && r.ok === false) { wxText = "Weather unavailable"; }
      else { wxText = wxSummary(r) + " (" + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + ")"; await amber.store.set("wx", wxText); }
    } catch (e) { wxText = "Weather unavailable"; }
    render(amber.note, amber.data);
  }

  function render(note, data) {
    const app = document.getElementById("app");
    const lines = note.markdown.split("\n");
    // Checklists, grouped under the heading above them.
    const groups = [];
    for (const c of note.checklists) {
      let h = "To do";
      for (let k = c.line - 2; k >= 0; k--) { const m = lines[k].match(/^#{1,6}\s+(.*)$/); if (m) { h = strip(m[1]); break; } }
      let g = groups.find((x) => x.h === h);
      if (!g) groups.push((g = { h, items: [] }));
      g.items.push(c);
    }
    const t = note.tables.find((t) => col(t, /^date$|^day$/i) >= 0);
    const d = t ? col(t, /^date$|^day$/i) : -1;
    const what = t ? col(t, /what|plan|activity|event|title|note/i) : -1, time = t ? col(t, /time|when/i) : -1, where = t ? col(t, /where|place|location/i) : -1;
    const plan = t ? t.rows.filter((r) => /^\d{4}-\d{2}-\d{2}$/.test(r[d])).sort((a, b) => (a[d] < b[d] ? -1 : 1)) : [];
    const start = (data && data.values && data.values.start) || (plan[0] && plan[0][d]) || null;
    const days = start ? Math.round((Date.parse(start + "T12:00:00Z") - Date.parse(note.today + "T12:00:00Z")) / 864e5) : null;
    const facts = (data && data.values && Array.isArray(data.values.facts) && data.values.facts.length ? data.values.facts : lines.map((l) => l.match(/^\s*(?:[-*]\s+)?\*{0,2}([A-Za-zÅÄÖåäö][\w ÅÄÖåäö/&.-]{1,24}?)\*{0,2}\s*:\s+(.{2,})$/)).filter(Boolean).filter((m) => !/^https?$/i.test(m[1])).map((m) => ({ label: m[1], value: m[2] })));
    const when = (iso) => { const x = new Date(iso + "T12:00:00Z"); return { day: x.getUTCDate(), wd: x.toLocaleString("en", { weekday: "short", timeZone: "UTC" }) }; };
    if (!wxText && data && data.values && data.values.wx) wxText = data.values.wx;
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <h2><span>Weather in Porto</span></h2><div class="card wx"><span>${esc(wxText || "Not loaded yet")}</span><button id="wxBtn">Refresh</button></div>
      ${days !== null ? `<div class="count">${days > 0 ? `<b>${days}</b> day${days === 1 ? "" : "s"} to go` : days === 0 ? `<b>Today</b>` : `<b>${-days}</b> day${days === -1 ? "" : "s"} ago`}</div>` : ""}
      ${facts.length ? `<h2><span>At a glance</span></h2><dl class="card">${facts.slice(0, 8).map((f) => `<div class="fact"><dt>${esc(strip(f.label))}</dt><dd>${esc(strip(f.value))}</dd></div>`).join("")}</dl>` : ""}
      ${plan.length ? `<h2><span>Plan</span></h2><div class="card">${plan.map((r) => { const w = when(r[d]); return `<div class="day"><div class="d"><b>${w.day}</b><span>${w.wd}</span></div><div class="w">${esc(what >= 0 ? r[what] : r.filter((_, k) => k !== d).join(" · "))}<div class="muted">${esc([time >= 0 ? r[time] : "", where >= 0 ? r[where] : ""].filter(Boolean).join(" · "))}</div></div></div>`; }).join("")}</div>` : ""}
      ${groups.map((g) => { const done = g.items.filter((c) => c.checked).length; return `<h2><span>${esc(g.h)}</span><span>${done}/${g.items.length}</span></h2>
        <div class="bar" aria-hidden="true"><div style="width:${(100 * done) / g.items.length}%"></div></div>
        <div class="card">${g.items.map((c) => `<label class="item ${c.checked ? "done" : ""}"><input type="checkbox" data-line="${c.line}" ${c.checked ? "checked" : ""}><span>${esc(strip(c.text))}</span></label>`).join("")}</div>`; }).join("")}
      <div class="err" role="alert">${esc(error)}</div>`;
    document.getElementById("wxBtn").addEventListener("click", loadWx);
    app.querySelectorAll("[data-line]").forEach((box) => box.addEventListener("change", async () => {
      const r = await amber.update({ op: "toggle_checklist", line: Number(box.dataset.line) });
      error = r.ok ? "" : r.error;
      if (!r.ok) render(amber.note, amber.data);
    }));
  }
  amber.onChange(render);
</script>
</body>
</html>
