<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-needs" content='{"hosts": ["query1.finance.yahoo.com"]}'>
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 96px; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 16px; }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); border: 1px solid var(--amber-separator); margin-bottom: 16px; overflow: hidden; }
  .muted { color: var(--amber-text-secondary); font-size: 14px; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; }
  .totals { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-bottom: 16px; }
  .total { padding: 16px; }
  .big { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .row { padding: 14px 16px; border-top: 1px solid var(--amber-separator); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
  .row:first-child { border-top: 0; }
  .tick { font-weight: 700; font-size: 17px; }
  .right { text-align: right; }
  .up { color: #1a7f37; } .down { color: var(--amber-danger); }
  @media (prefers-color-scheme: dark) { .up { color: #4ac26b; } }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .bar .grow { flex: 1; }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 18px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-accent); color: var(--amber-on-accent); }
  button:disabled { opacity: .6; }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
  .err { color: var(--amber-danger); font-size: 14px; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const num = (s) => { const n = parseFloat(String(s ?? "").replace(/\s/g, "").replace(",", ".")); return isNaN(n) ? null : n; };
  const col = (t, re) => t.columns.findIndex((c) => re.test(c.name));
  const quotes = {}; // ticker -> {price, currency} | {error}
  let loading = false, updated = "", note = null;

  async function fetchOne(sym) {
    const r = await amber.fetch("https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(sym) + "?interval=1d&range=1d");
    if (!r || r.ok === false) throw new Error((r && r.error) || "request failed");
    const body = typeof r.body === "string" ? r.body : (typeof r.text === "string" ? r.text : JSON.stringify(r.body ?? r.data ?? {}));
    const j = JSON.parse(body);
    const m = j && j.chart && j.chart.result && j.chart.result[0] && j.chart.result[0].meta;
    if (!m || typeof m.regularMarketPrice !== "number") throw new Error("no price");
    return { price: m.regularMarketPrice, currency: m.currency || "", symbol: sym };
  }
  async function getQuote(t) {
    try { return await fetchOne(t); }
    catch (e) {
      if (!t.includes(".")) { try { return await fetchOne(t + ".ST"); } catch (e2) {} }
      return { error: String(e.message || e) };
    }
  }
  function tableOf(n) { return n.tables.find((t) => col(t, /^ticker|symbol$/i) >= 0); }
  async function refresh() {
    if (loading || !note) return;
    const t = tableOf(note); if (!t) return;
    loading = true; render(note);
    const ti = col(t, /^ticker|symbol$/i);
    await Promise.all(t.rows.map(async (r) => { const k = r[ti].trim(); if (k) quotes[k] = await getQuote(k); }));
    loading = false; updated = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    render(note);
  }
  const money = (v, cur) => (v < 0 ? "-" : "") + Math.abs(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + (cur ? " " + cur : "");
  const sign = (v) => (v > 0 ? "+" : "") ;

  function render(n) {
    note = n;
    const app = document.getElementById("app");
    const t = tableOf(n);
    if (!t) { app.innerHTML = `<h1>${esc(n.title)}</h1><div class="card empty">Add a table with Ticker, Shares and Buy price columns.</div>`; return; }
    const ti = col(t, /^ticker|symbol$/i), si = col(t, /^shares|qty|quantity$/i), bi = col(t, /^buy/i);
    const sums = {};
    const rows = t.rows.filter((r) => (r[ti] || "").trim()).map((r) => {
      const k = r[ti].trim(), sh = num(r[si]), buy = num(r[bi]), q = quotes[k];
      let html;
      if (!q) html = `<div class="tick">${esc(k)}</div><div class="right muted">${loading ? "Loading…" : "Not fetched"}</div>`;
      else if (q.error) html = `<div class="tick">${esc(k)}</div><div class="right err">Price unavailable</div>`;
      else {
        const cur = q.currency;
        let line = `<div class="muted">${esc(sh ?? "?")} shares · bought ${buy == null ? "?" : money(buy)} · now ${money(q.price)} ${esc(cur)}</div>`;
        let right = `<div class="right muted">–</div>`;
        if (sh != null && buy != null) {
          const pl = (q.price - buy) * sh, pct = (q.price / buy - 1) * 100, s = sums[cur] || (sums[cur] = { cost: 0, value: 0 });
          s.cost += buy * sh; s.value += q.price * sh;
          const c = pl >= 0 ? "up" : "down";
          right = `<div class="right num ${c}">${pl >= 0 ? "▲ +" : "▼ "}${money(pl, cur)}</div>`;
          line += ``;
          html = `<div class="tick">${esc(k)}</div>${right}${line}<div class="right muted ${c}">${pct >= 0 ? "+" : ""}${pct.toFixed(1)}%</div>`;
          return `<div class="row">${html}</div>`;
        }
        html = `<div class="tick">${esc(k)}</div>${right}${line}`;
      }
      return `<div class="row">${html}</div>`;
    });
    const totals = Object.keys(sums).map((cur) => {
      const s = sums[cur], pl = s.value - s.cost, pct = s.cost ? pl / s.cost * 100 : 0, c = pl >= 0 ? "up" : "down";
      return `<div class="card total"><div class="muted">Total profit${Object.keys(sums).length > 1 ? " (" + esc(cur) + ")" : ""}</div><div class="big ${c}">${pl >= 0 ? "+" : ""}${money(pl, cur)}</div><div class="muted">${pct >= 0 ? "+" : ""}${pct.toFixed(1)}% · value ${money(s.value, cur)} · cost ${money(s.cost, cur)}</div></div>`;
    }).join("");
    app.innerHTML = `<h1>${esc(n.title)}</h1>
      <div class="bar"><div class="grow muted">${loading ? "Fetching live prices…" : updated ? "Prices from Yahoo Finance, updated " + esc(updated) : "Prices from Yahoo Finance"}</div><button id="rf" ${loading ? "disabled" : ""}>Refresh prices</button></div>
      ${totals ? `<div class="totals">${totals}</div>` : ""}
      <div class="card">${rows.length ? rows.join("") : '<div class="empty">No stocks yet. Add rows to the table.</div>'}</div>
      <p class="muted">Profit = (current price − buy price) × shares. Totals are kept per currency. Tickers without an exchange suffix that Yahoo doesn't know are retried as .ST (Stockholm).</p>`;
    document.getElementById("rf").onclick = refresh;
  }
  let first = true;
  amber.onChange((n) => { render(n); if (first) { first = false; refresh(); } });
</script>
</body>
</html>
