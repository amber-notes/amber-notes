<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisbon trip packing</title>
<style>
  * { box-sizing: border-box; }
  main { max-width: 700px; margin: 0 auto; padding: 20px var(--amber-gutter, 16px) 64px; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 4px; }
  h2 { font-size: 20px; margin: 24px 0 8px; }
  .summary { color: var(--amber-text-secondary); margin: 0 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); overflow: hidden; }
  li { border-top: 1px solid var(--amber-separator); }
  li:first-child { border-top: 0; }
  li label { display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 8px 16px; cursor: pointer; overflow-wrap: anywhere; }
  li input[type=checkbox] { width: 44px; height: 44px; flex: none; margin: -8px -6px -8px -10px; accent-color: var(--amber-accent); }
  li.done .t { color: var(--amber-text-secondary); text-decoration: line-through; }
  .state { color: var(--amber-text-secondary); font-size: 14px; margin-left: auto; padding-left: 8px; }
  .empty { padding: 14px 16px; color: var(--amber-text-secondary); background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); }
  form { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; padding: 16px; background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); }
  form h2 { flex: 1 1 100%; margin: 0; }
  .f { display: flex; flex-direction: column; gap: 4px; flex: 1 1 180px; font-size: 15px; }
  .f span { color: var(--amber-text-secondary); font-size: 14px; }
  input[type=text], select { font: inherit; color: var(--amber-text); background: var(--amber-fill); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius-small); padding: 10px 12px; min-height: 44px; width: 100%; }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 20px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-text); color: var(--amber-bg); align-self: flex-end; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--amber-accent-text); outline-offset: 2px; }
  #msg { flex: 1 1 100%; min-height: 1.4em; margin: 0; }
  #msg.err { color: var(--amber-danger); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="summary" id="summary"></p>
  <div id="lists"></div>
  <form id="add" aria-labelledby="addh">
    <h2 id="addh">Add an item</h2>
    <label class="f"><span>Item name</span><input type="text" id="v" autocomplete="off" required></label>
    <label class="f"><span>Section</span><select id="sec"></select></label>
    <button type="submit">Add item</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const $ = (id) => document.getElementById(id);
  let focusLine = null;

  function say(text, isErr) { const m = $("msg"); m.className = isErr ? "err" : ""; m.textContent = text; }

  function sections(note) {
    const lines = note.markdown.split("\n");
    const heads = [];
    lines.forEach((l, i) => { const m = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(l); if (m && i > 0) heads.push({ line: i + 1, level: m[1].length, text: m[2] }); });
    const secs = heads.map((h, k) => {
      let end = lines.length + 1;
      for (let j = k + 1; j < heads.length; j++) if (heads[j].level <= h.level) { end = heads[j].line; break; }
      return { ...h, end, items: [] };
    });
    const loose = [];
    note.checklists.forEach((c) => {
      let best = null;
      secs.forEach((s) => { if (c.line > s.line && c.line < s.end && (!best || s.line > best.line)) best = s; });
      (best ? best.items : loose).push(c);
    });
    return { secs, loose, lines };
  }

  function render(note) {
    $("title").textContent = note.title;
    const { secs, loose } = sections(note);
    const total = note.checklists.length, done = note.checklists.filter((c) => c.checked).length;
    $("summary").textContent = total ? `${done} of ${total} items packed` : "No items yet";
    const block = (name, items, lvl) => `<section aria-label="${esc(name)}">${name ? `<h2>${esc(name)}</h2>` : ""}` +
      (items.length ? `<ul>${items.map((c) => `<li class="${c.checked ? "done" : ""}"><label><input type="checkbox" data-line="${c.line}" ${c.checked ? "checked" : ""}><span class="t">${esc(c.text)}</span></label></li>`).join("")}</ul>` : `<p class="empty">Nothing in ${esc(name)} yet.</p>`) + `</section>`;
    let html = "";
    if (loose.length) html += block(secs.length ? "Other" : "Items", loose);
    html += secs.filter((s) => s.items.length || true).map((s) => block(s.text, s.items)).join("");
    if (!html) html = '<p class="empty">Add your first item below.</p>';
    $("lists").innerHTML = html;
    if (focusLine != null) { const el = document.querySelector(`input[data-line="${focusLine}"]`); if (el) el.focus(); focusLine = null; }
    const sel = $("sec"), prev = sel.value;
    sel.innerHTML = secs.map((s) => `<option value="${esc(s.text)}">${esc(s.text)}</option>`).join("");
    if (prev && secs.some((s) => s.text === prev)) sel.value = prev;
    $("sec").disabled = !secs.length;
  }

  $("lists").addEventListener("change", async (e) => {
    const b = e.target; if (!b.dataset || !b.dataset.line) return;
    const label = b.closest("label").textContent.trim();
    focusLine = +b.dataset.line;
    const r = await amber.update({ op: "toggle_checklist", line: focusLine });
    if (!r.ok) { say("Could not update " + label + ": " + r.error, true); b.checked = !b.checked; focusLine = null; }
    else say(label + (b.checked ? " packed" : " not packed"), false);
  });

  $("add").addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = $("v").value.trim().replace(/\s+/g, " ");
    if (!v) { say("Type an item name first.", true); $("v").focus(); return; }
    const head = $("sec").value;
    const { secs, lines } = sections(amber.note);
    const s = secs.find((x) => x.text === head);
    if (!s) { say("Add a heading to the note first, so the item has a section.", true); return; }
    const body = lines.slice(s.line, s.end - 1);
    while (body.length && body[body.length - 1].trim() === "") body.pop();
    body.push("- [ ] " + v);
    const r = await amber.update({ op: "set_text", heading: s.text, text: body.join("\n") });
    if (!r.ok) { say("Could not add " + v + ": " + r.error, true); return; }
    $("v").value = "";
    say(v + " added to " + s.text, false);
    $("v").focus();
  });

  amber.onChange(render);
</script>
</body>
</html>
