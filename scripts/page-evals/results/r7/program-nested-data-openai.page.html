<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 96px}.top{display:flex;flex-direction:column;gap:8px;margin:4px 0 16px}h1{font-size:30px;letter-spacing:-.03em;margin:0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0}.muted{color:var(--amber-text-secondary)}.small{font-size:13px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);margin-bottom:14px;overflow:hidden}.pad{padding:16px}.hero{display:grid;gap:14px}.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.badge{display:inline-flex;align-items:center;min-height:30px;padding:4px 10px;border-radius:999px;background:var(--amber-accent-soft);color:var(--amber-accent-text);font-weight:700;font-size:13px}.badge.plain{background:var(--amber-fill);color:var(--amber-text-secondary)}.bar{height:10px;background:var(--amber-fill);border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--amber-accent);border-radius:999px}.big{font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.grid{display:grid;gap:14px}.lift{border-top:1px solid var(--amber-separator);padding:14px 16px}.lift:first-child{border-top:0}.liftHead{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:12px}.rx{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}.set{min-height:46px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-fill);color:var(--amber-text);font:inherit;font-weight:800;padding:10px 12px}.set.done{background:var(--amber-accent-soft);color:var(--amber-accent-text);outline:2px solid var(--amber-accent)}button{font:inherit;font-weight:700;min-height:44px;border:0;border-radius:var(--amber-radius-small);padding:10px 14px;background:var(--amber-fill);color:var(--amber-text)}button.secondary{background:var(--amber-fill);color:var(--amber-text)}button.danger{background:var(--amber-fill);color:var(--amber-danger)}button:disabled{opacity:.45}.actions{display:flex;flex-wrap:wrap;gap:8px}.sessions{display:grid;gap:8px}.sessionBtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--amber-fill);color:var(--amber-text)}.sessionBtn.current{outline:2px solid var(--amber-accent);background:var(--amber-accent-soft)}.sessionBtn.done .name{text-decoration:line-through}.daymeta{display:flex;flex-direction:column;gap:2px;min-width:0}.name{font-weight:800;overflow-wrap:anywhere}.pct{font-variant-numeric:tabular-nums;color:var(--amber-text-secondary);font-size:13px;white-space:nowrap}.empty{padding:28px 16px;text-align:center;color:var(--amber-text-secondary)}.err{color:var(--amber-danger);min-height:1em;margin-top:8px}.two{display:grid;gap:14px}@media (min-width:900px){.hero{grid-template-columns:1.4fr .8fr;align-items:stretch}.two{grid-template-columns:1.15fr .85fr}.top{flex-direction:row;align-items:end;justify-content:space-between}.sessions{max-height:620px;overflow:auto;padding-right:2px}}@media (max-width:430px){h1{font-size:27px}.big{font-size:30px}.liftHead{flex-direction:column;gap:4px}.rx{white-space:normal}.sets{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayOffsets={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};
let lastNote=null,lastData=null,msg="";
function addDays(iso,n){const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function niceDate(iso){const d=new Date(iso+"T00:00:00");return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
function kg(n){return Number(n).toLocaleString(undefined,{maximumFractionDigits:1})+"kg"}
function flatten(program){const out=[];(program.weeks||[]).forEach((w,wi)=>{(w.sessions||[]).forEach((s,si)=>{const offset=wi*7+(dayOffsets[s.day]??si*2);out.push({...s,week:w.week,label:w.label,deload:!!w.deload,date:program.startDate?addDays(program.startDate,offset):"",order:out.length})})});return out}
function setKey(s,liftIndex,setIndex){return s.id+"|"+liftIndex+"|"+setIndex}
function totals(session,progress){let done=0,total=0;(session.lifts||[]).forEach((l,li)=>{for(let i=1;i<=Number(l.sets||0);i++){total++;if(progress[setKey(session,li,i)])done++}});return{done,total,pct:total?Math.round(done*100/total):0}}
function findFocus(sessions,today,progress,selected){if(selected){const x=sessions.find(s=>s.id===selected);if(x)return x}const todaySession=sessions.find(s=>s.date===today);if(todaySession)return todaySession;const nextOpen=sessions.find(s=>s.date>=today&&totals(s,progress).done<totals(s,progress).total);if(nextOpen)return nextOpen;return sessions.find(s=>totals(s,progress).done<totals(s,progress).total)||sessions[sessions.length-1]||null}
function daysUntil(date,today){if(!date)return"";const a=new Date(today+"T00:00:00"),b=new Date(date+"T00:00:00");return Math.round((b-a)/86400000)}
function render(note,data){lastNote=note;lastData=data;const root=document.getElementById("app");const values=(data&&data.values)||{};const program=values.program;if(!program||!Array.isArray(program.weeks)){root.innerHTML=`<div class="top"><h1>${esc(note.title)}</h1></div><div class="card empty">No strength program is saved in this app's data yet.</div>`;return}const progress=values.progress||{};const sessions=flatten(program);const selected=values.selectedSession;const current=findFocus(sessions,note.today,progress,selected);if(!current){root.innerHTML=`<div class="top"><h1>${esc(note.title)}</h1></div><div class="card empty">The program has no sessions yet.</div>`;return}const allDone=sessions.reduce((a,s)=>a+totals(s,progress).done,0);const allSets=sessions.reduce((a,s)=>a+totals(s,progress).total,0);const cur=totals(current,progress);const delta=daysUntil(current.date,note.today);const timing=delta===0?"Today":delta>0?`In ${delta} day${delta===1?"":"s"}`:`${Math.abs(delta)} day${Math.abs(delta)===1?"":"s"} ago`;root.innerHTML=`
<div class="top"><div><h1>${esc(note.title)}</h1><div class="muted">${esc(program.name||"Strength program")}${program.startDate?` · starts ${esc(niceDate(program.startDate))}`:""}</div></div><div class="badge plain">${allDone}/${allSets} sets done</div></div>
<section class="hero">
  <div class="card pad"><div class="status"><span class="badge">${esc(timing)}</span><span class="badge plain">${esc(current.label||("Week "+current.week))}</span>${current.deload?'<span class="badge plain">Deload</span>':''}</div><div class="big">${esc(current.day)} · ${esc(current.name||"Workout")}</div><div class="muted">${esc(current.date?niceDate(current.date):"")}</div><div class="bar" aria-label="Current workout progress"><span style="width:${cur.pct}%"></span></div><div class="muted small">${cur.done} of ${cur.total} sets ticked off</div><div class="actions"><button id="prev" class="secondary">Previous day</button><button id="next" class="secondary">Next day</button><button id="complete">Tick all sets</button><button id="reset" class="danger">Untick this day</button></div><div class="err" role="alert">${esc(msg)}</div></div>
  <div class="card pad"><h2>Block progress</h2><div class="big">${allSets?Math.round(allDone*100/allSets):0}%</div><div class="bar" aria-label="Whole program progress"><span style="width:${allSets?Math.round(allDone*100/allSets):0}%"></span></div><div class="muted small">${sessions.filter(s=>totals(s,progress).done===totals(s,progress).total).length} of ${sessions.length} workouts complete</div></div>
</section>
<section class="two">
  <div class="card" aria-label="Current workout sets">${(current.lifts||[]).map((l,li)=>`<div class="lift"><div class="liftHead"><div><h3>${esc(l.name)}</h3><div class="muted small">Set-by-set checklist</div></div><div class="rx">${esc(l.sets)}×${esc(l.reps)} · ${esc(kg(l.weightKg))}</div></div><div class="sets">${Array.from({length:Number(l.sets||0)},(_,i)=>{const n=i+1,k=setKey(current,li,n),done=!!progress[k];return `<button class="set ${done?'done':''}" data-set="${esc(k)}" aria-pressed="${done}">Set ${n}${done?' ✓':''}</button>`}).join("")}</div></div>`).join("")}</div>
  <div class="card pad"><h2>Program days</h2><div class="sessions">${sessions.map(s=>{const t=totals(s,progress),is=s.id===current.id,done=t.total&&t.done===t.total;return `<button class="sessionBtn ${is?'current':''} ${done?'done':''}" data-session="${esc(s.id)}"><span class="daymeta"><span class="name">${esc(s.label||("Week "+s.week))} · ${esc(s.day)} · ${esc(s.name||"Workout")}</span><span class="muted small">${esc(s.date?niceDate(s.date):"")}${s.deload?' · deload':''}</span></span><span class="pct">${t.done}/${t.total}</span></button>`}).join("")}</div></div>
</section>`;wire(current,sessions,progress,values)}
async function saveValues(patch){msg="";try{const r=await Promise.resolve(amber.setData({values:patch}));if(r&&r.ok===false)msg=r.error||"Could not save progress."}catch(e){msg=e.message||"Could not save progress."}if(msg)render(lastNote,lastData)}
function wire(current,sessions,progress,values){document.querySelectorAll("[data-set]").forEach(b=>{b.onclick=()=>{const key=b.getAttribute("data-set");saveValues({progress:{[key]:!progress[key]}})}});document.querySelectorAll("[data-session]").forEach(b=>{b.onclick=()=>saveValues({selectedSession:b.getAttribute("data-session")})});const idx=sessions.findIndex(s=>s.id===current.id);document.getElementById("prev").disabled=idx<=0;document.getElementById("next").disabled=idx>=sessions.length-1;document.getElementById("prev").onclick=()=>idx>0&&saveValues({selectedSession:sessions[idx-1].id});document.getElementById("next").onclick=()=>idx<sessions.length-1&&saveValues({selectedSession:sessions[idx+1].id});document.getElementById("complete").onclick=()=>{const p={};(current.lifts||[]).forEach((l,li)=>{for(let i=1;i<=Number(l.sets||0);i++)p[setKey(current,li,i)]=true});saveValues({progress:p,selectedSession:current.id})};document.getElementById("reset").onclick=()=>{const p={};(current.lifts||[]).forEach((l,li)=>{for(let i=1;i<=Number(l.sets||0);i++)p[setKey(current,li,i)]=false});saveValues({progress:p,selectedSession:current.id})}}
amber.onChange(render);
</script>
</body>
</html>
