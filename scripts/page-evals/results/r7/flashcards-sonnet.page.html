<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: var(--amber-bg); --card: var(--amber-surface); --ink: var(--amber-text); --muted: var(--amber-text-secondary); --line: var(--amber-separator); --accent: var(--amber-accent); --accent-ink: var(--amber-on-accent); --field: var(--amber-fill); --ok: #2f7d5b; }
  :root { --ok-ink: #fff; }
  @media (prefers-color-scheme: dark) { :root { --ok: #5cc497; --ok-ink: #0b2a1d; } }
  * { box-sizing: border-box; }
  body { padding: 20px 18px 96px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .bar { height: 8px; border-radius: 4px; background: var(--field); overflow: hidden; margin-bottom: 18px; }
  .bar div { height: 100%; background: var(--ok); }
  .flip { display: grid; place-items: center; width: 100%; min-height: 260px; padding: 28px 20px; border-radius: 22px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; text-align: center; cursor: pointer; }
  .flip .side { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .flip .word { font-size: 32px; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; margin: 8px 0; }
  .flip .hint { color: var(--muted); font-size: 14px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .actions button { font: inherit; font-weight: 600; min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .actions .known { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
  .list { margin-top: 26px; }
  .list summary { cursor: pointer; color: var(--muted); padding: 8px 4px; min-height: 44px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 4px; border-top: 1px solid var(--line); }
  .row .k { color: var(--ok); font-size: 14px; white-space: nowrap; }
  .reset { font: inherit; color: var(--accent); background: none; border: 0; min-height: 44px; padding: 0 4px; }
  .err { color: var(--amber-danger); min-height: 1em; margin: 8px 4px; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--card); border-radius: var(--amber-radius); border: 1px solid var(--line); }
  @media (prefers-reduced-motion: no-preference) { .flip { transition: transform .15s; } .flip:active { transform: scale(.98); } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  let showBack = false, current = null, error = "";

  function render(note, data) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => t.columns.length >= 2 && t.rows.length);
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="empty">Add a two-column table (front | back) to the note to make cards.</div>`; return; }
    const known = (data && data.values && data.values.known) || {};
    const cards = t.rows.filter((r) => r[0]).map((r) => ({ front: r[0], back: r[1] }));
    const todo = cards.filter((c) => !known[c.front]);
    const done = cards.length - todo.length;
    if (!current || !cards.some((c) => c.front === current) || (known[current] && todo.length)) { current = (todo[0] || cards[0]).front; showBack = false; }
    const card = cards.find((c) => c.front === current);
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <p class="sub">${done} of ${cards.length} known${todo.length ? ` · ${todo.length} to go` : " · all done"}</p>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${cards.length}" aria-valuenow="${done}" aria-label="Cards known"><div style="width:${(100 * done) / cards.length}%"></div></div>
      <button class="flip" id="flip" aria-label="${showBack ? "Back" : "Front"}: ${esc(showBack ? card.back : card.front)}. Tap to flip.">
        <span><span class="side">${showBack ? esc(t.columns[1].name) : esc(t.columns[0].name)}</span>
        <span class="word" style="display:block">${esc(showBack ? card.back : card.front)}</span>
        <span class="hint">${showBack ? "" : "Tap to see the answer"}</span></span>
      </button>
      <div class="actions">
        <button id="again">Again</button>
        <button id="know" class="known">I know it</button>
      </div>
      <div class="err" role="alert">${esc(error)}</div>
      <details class="list" open><summary>All cards</summary>
        ${cards.map((c) => `<div class="row"><span>${esc(c.front)} · <span style="color:var(--muted)">${esc(c.back)}</span></span>${known[c.front] ? `<span class="k">Known</span>` : ""}</div>`).join("")}
        ${done ? `<button class="reset" id="reset">Start over</button>` : ""}
      </details>`;

    const next = () => {
      const rest = cards.filter((c) => !((amber.data.values.known || {})[c.front]) && c.front !== current);
      current = (rest[0] || cards[(cards.findIndex((c) => c.front === current) + 1) % cards.length]).front;
      showBack = false;
    };
    const save = async (patch) => { const r = await amber.setData({ values: patch }); error = r.ok ? "" : r.error; return r.ok; };
    document.getElementById("flip").onclick = () => { showBack = !showBack; render(amber.note, amber.data); };
    document.getElementById("again").onclick = async () => {
      if (known[current]) { if (!(await save({ known: { [current]: null } }))) return render(amber.note, amber.data); }
      next(); render(amber.note, amber.data);
    };
    document.getElementById("know").onclick = async () => {
      const was = current;
      next();
      if (!(await save({ known: { [was]: note.today } }))) { current = was; render(amber.note, amber.data); }
    };
    const reset = document.getElementById("reset");
    if (reset) reset.onclick = async () => { await save({ known: null }); current = null; render(amber.note, amber.data); };
  }
  amber.onChange(render);
</script>
</body>
</html>
