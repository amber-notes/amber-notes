<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading log</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px 0 80px;color:var(--amber-text);font-family:var(--amber-font)}.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:0 var(--amber-gutter)}.hero{display:grid;gap:16px;margin-bottom:18px}.kicker{color:var(--amber-accent-text);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.titleRow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{font-size:clamp(34px,7vw,64px);line-height:.93;letter-spacing:-.06em;margin:0;font-family:var(--amber-font-rounded,var(--amber-font))}.sub{color:var(--amber-text-secondary);margin:6px 0 0;font-size:16px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{background:linear-gradient(180deg,var(--amber-surface),var(--amber-fill));border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:16px;min-height:98px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 30px rgba(0,0,0,.04)}.stat b{font-size:clamp(28px,7vw,48px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}.stat span{color:var(--amber-text-secondary);font-size:13px;font-weight:600}.grid{display:grid;gap:18px}.panel{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.panelHead{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}.panel h2{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--amber-text-secondary)}.hint{color:var(--amber-text-secondary);font-size:13px}.months{display:flex;align-items:end;gap:8px;height:190px;padding:12px 14px 16px;overflow-x:auto}.month{min-width:48px;flex:1;display:grid;grid-template-rows:1fr auto auto;align-items:end;gap:6px;text-align:center}.barWrap{height:120px;display:flex;align-items:end;justify-content:center}.bar{width:min(34px,80%);min-height:3px;border-radius:999px 999px 4px 4px;background:linear-gradient(180deg,var(--amber-accent),var(--amber-accent-soft));position:relative}.bar em{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-style:normal;font-size:12px;color:var(--amber-text-secondary);font-variant-numeric:tabular-nums}.monthName{font-size:12px;color:var(--amber-text-secondary);white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.book{min-height:236px;border-radius:18px;position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--cover) 44%,var(--amber-separator));background:linear-gradient(135deg,color-mix(in srgb,var(--cover) 84%,#fff),color-mix(in srgb,var(--cover) 45%,#000));box-shadow:0 14px 30px rgba(0,0,0,.12);color:var(--amber-on-accent);display:flex;flex-direction:column;justify-content:space-between;padding:18px}.book:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 10%,rgba(255,255,255,.34),transparent 34%),linear-gradient(90deg,rgba(0,0,0,.22),transparent 18%,rgba(255,255,255,.12) 19%,transparent 21%);pointer-events:none}.book:after{content:"";position:absolute;left:13px;top:14px;bottom:14px;width:2px;background:rgba(255,255,255,.28);border-radius:10px}.book>*{position:relative;z-index:1}.bookTitle{font-family:var(--amber-font-rounded,var(--amber-font));font-size:clamp(20px,4.8vw,30px);line-height:1.02;font-weight:800;letter-spacing:-.04em;text-wrap:balance}.author{font-size:14px;opacity:.86;margin-top:8px}.meta{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-left:8px}.date{font-size:12px;opacity:.82}.stars{font-size:18px;letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,.25);white-space:nowrap}.empty{padding:30px;text-align:center;color:var(--amber-text-secondary)}.want{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 18px}.chip{background:var(--amber-fill);border:1px solid var(--amber-separator);color:var(--amber-text);border-radius:999px;padding:8px 11px;font-size:14px}.foot{margin-top:16px;color:var(--amber-text-secondary);font-size:13px;text-align:center}@media (max-width:599px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.cards{grid-template-columns:1fr}.book{min-height:220px}.months{margin-left:calc(var(--amber-gutter) * -1);margin-right:calc(var(--amber-gutter) * -1);border-radius:0}}@media (min-width:900px){.hero{grid-template-columns:1.2fr .8fr;align-items:end}.stats{align-self:end}.grid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.span{grid-column:1/-1}.cards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.book{min-height:280px}.side{position:sticky;top:16px}}
</style>
</head>
<body>
<main id="app" class="wrap"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const col=(t,re)=>t.columns.findIndex(c=>re.test(c.name));
const nval=v=>{const n=parseFloat(String(v??"").replace(",","."));return Number.isFinite(n)?n:NaN};
const shortDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s))?new Date(s+"T12:00:00Z").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):String(s||"");
function hash(s){let h=23;for(const ch of String(s)){h=(h*37+ch.charCodeAt(0))%360}return h}
function stars(r){if(!Number.isFinite(r))return "";const v=Math.max(0,Math.min(5,Math.round(r)));return "★".repeat(v)+"☆".repeat(5-v)}
function wantFromMarkdown(md){const m=String(md||"").match(/want to read\s*:\s*([^\n]+)/i);return m?m[1].replace(/\.$/,"").split(/,|;/).map(x=>x.trim()).filter(Boolean):[]}
function render(note){
 const root=document.getElementById("app");
 const table=note.tables.find(t=>col(t,/^(title|book)$/i)>=0)||note.tables[0];
 if(!table){root.innerHTML=`<section class="panel empty">Add a reading table to the note to see your library.</section>`;return}
 const ti=col(table,/^(title|book)$/i), ai=col(table,/author|writer|by/i), fi=col(table,/finish|finished|date|read/i), ri=col(table,/rating|stars|score/i);
 const books=table.rows.map((r,i)=>({i,title:r[ti]||"Untitled",author:ai>=0?r[ai]:"",finished:fi>=0?r[fi]:"",rating:ri>=0?nval(r[ri]):NaN}));
 const dated=books.filter(b=>/^\d{4}-\d{2}/.test(String(b.finished)));
 const rated=books.filter(b=>Number.isFinite(b.rating));
 const avg=rated.length?rated.reduce((s,b)=>s+b.rating,0)/rated.length:0;
 const year=note.today.slice(0,4);
 const inYear=dated.filter(b=>String(b.finished).startsWith(year)).length;
 const months=Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,"0")}`);
 const counts=months.map(m=>dated.filter(b=>String(b.finished).startsWith(m)).length);
 const max=Math.max(1,...counts);
 const best=books.slice().sort((a,b)=>(Number.isFinite(b.rating)?b.rating:-1)-(Number.isFinite(a.rating)?a.rating:-1))[0];
 const sorted=books.slice().sort((a,b)=>String(b.finished).localeCompare(String(a.finished))||b.i-a.i);
 const want=note.checklists.length?note.checklists.filter(c=>!c.checked).map(c=>c.text):wantFromMarkdown(note.markdown);
 root.innerHTML=`
 <section class="hero">
  <div><div class="kicker">Reading log</div><div class="titleRow"><h1>${esc(note.title)}</h1></div><p class="sub">A shelf-style view of the table in your note.</p></div>
  <div class="stats" aria-label="Reading statistics">
   <div class="stat"><span>Total books</span><b>${books.length}</b></div>
   <div class="stat"><span>${year} books</span><b>${inYear}</b></div>
   <div class="stat"><span>Average rating</span><b>${rated.length?avg.toFixed(1):"–"}</b></div>
  </div>
 </section>
 <section class="grid">
  <div>
   <section class="panel" aria-label="Books per month"><div class="panelHead"><h2>Books per month</h2><span class="hint">${year}</span></div><div class="months">${months.map((m,i)=>`<div class="month"><div class="barWrap"><div class="bar" style="height:${Math.max(3,counts[i]/max*118)}px"><em>${counts[i]||""}</em></div></div><div class="monthName">${new Date(m+"-15T12:00:00Z").toLocaleString(undefined,{month:"short"})}</div></div>`).join("")}</div></section>
  </div>
  <aside class="side">
   <section class="panel"><div class="panelHead"><h2>Highlights</h2></div><div class="stats" style="grid-template-columns:1fr"><div class="stat"><span>Highest rated</span><b style="font-size:22px;line-height:1.05">${best?esc(best.title):"–"}</b></div><div class="stat"><span>Rated books</span><b>${rated.length}</b></div></div></section>
   ${want.length?`<section class="panel" style="margin-top:18px"><div class="panelHead"><h2>Want to read</h2></div><div class="want">${want.map(w=>`<span class="chip">${esc(w)}</span>`).join("")}</div></section>`:""}
  </aside>
  <section class="span"><div class="panelHead" style="padding-left:0"><h2>Cover shelf</h2><span class="hint">Newest first</span></div><div class="cards">${sorted.map(b=>`<article class="book" style="--cover:hsl(${hash(b.title)} 58% 46%)"><div><div class="bookTitle">${esc(b.title)}</div><div class="author">${esc(b.author)}</div></div><div class="meta"><div class="date">${esc(shortDate(b.finished))}</div><div class="stars" aria-label="${Number.isFinite(b.rating)?b.rating+' out of 5':'No rating'}">${stars(b.rating)}</div></div></article>`).join("")||`<div class="panel empty">No books yet.</div>`}</div></section>
 </section><p class="foot">The App side reads from your existing table; no columns or rows were changed.</p>`;
}
amber.onChange(render);
</script>
</body>
</html>
