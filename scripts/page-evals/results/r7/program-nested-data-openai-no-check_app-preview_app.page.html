<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 88px}.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin:2px 0 16px;flex-wrap:wrap}h1{font-size:30px;line-height:1.05;letter-spacing:-.03em;margin:0 0 4px}.muted{color:var(--amber-text-secondary)}.small{font-size:13px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden;margin-bottom:14px}.hero{padding:18px}.grid{display:grid;gap:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:var(--amber-fill);border-radius:var(--amber-radius-small);padding:12px}.num{font-variant-numeric:tabular-nums;font-weight:750;font-size:22px}.bar{height:10px;background:var(--amber-fill);border-radius:999px;overflow:hidden;margin-top:12px}.bar span{display:block;height:100%;width:0;background:var(--amber-accent);border-radius:999px}.nav{display:flex;gap:8px;align-items:center}.nav button,.ghost{min-height:44px;border:0;border-radius:var(--amber-radius-small);font:inherit;font-weight:650;padding:0 14px;background:var(--amber-fill);color:var(--amber-text)}button.primary{background:var(--amber-accent);color:var(--amber-on-accent)}button:disabled{opacity:.45}.lift{padding:14px 16px;border-top:1px solid var(--amber-separator)}.lift:first-child{border-top:0}.liftHead{display:flex;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:12px}.liftName{font-weight:750;font-size:18px}.pill{display:inline-flex;align-items:center;min-height:28px;border-radius:999px;background:var(--amber-accent-soft);color:var(--amber-accent-text);padding:3px 10px;font-weight:700;font-size:13px;white-space:nowrap}.sets{display:flex;gap:8px;flex-wrap:wrap}.setBtn{min-width:74px;min-height:46px;border:1px solid var(--amber-separator);border-radius:var(--amber-radius-small);background:var(--amber-fill);color:var(--amber-text);font:inherit;font-weight:700}.setBtn.done{background:var(--amber-accent);color:var(--amber-on-accent);border-color:var(--amber-accent)}.days{display:grid;gap:8px}.dayBtn{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;min-height:52px;border:0;border-radius:var(--amber-radius-small);padding:10px 12px;background:var(--amber-fill);color:var(--amber-text);font:inherit}.dayBtn.active{outline:2px solid var(--amber-accent);background:var(--amber-accent-soft)}.dayBtn.done .title{text-decoration:line-through;color:var(--amber-text-secondary)}.check{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:var(--amber-surface);border:1px solid var(--amber-separator);font-size:14px}.dayBtn.done .check{background:var(--amber-accent);color:var(--amber-on-accent);border-color:var(--amber-accent)}.title{font-weight:700}.empty{padding:28px 16px;text-align:center;color:var(--amber-text-secondary)}.err{color:var(--amber-danger);padding:0 16px 14px;min-height:1em}@media (min-width:900px){.grid{grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr)}.program{grid-column:2;grid-row:1 / span 2}.workout{grid-column:1}.hero{grid-column:1}.num{font-size:26px}}@media (max-width:420px){.stats{grid-template-columns:1fr}.liftHead{display:block}.pill{margin-top:6px}.setBtn{flex:1 1 70px}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let selected=null,error="";
function flat(program){const out=[];(program.weeks||[]).forEach(w=>(w.days||[]).forEach((d,di)=>out.push({...d,week:w.week,dayIndex:di,id:`w${w.week}d${di}`})));return out}
function fmtDate(s){if(!s)return"";const d=new Date(s+"T00:00:00");return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
function setCount(day){return (day.lifts||[]).reduce((n,l)=>n+(Number(l.sets)||0),0)}
function key(day,li,si){return `${day.id}|${li}|${si}`}
function doneSets(day,completed){let n=0;(day.lifts||[]).forEach((l,li)=>{for(let i=1;i<=(Number(l.sets)||0);i++)if(completed[key(day,li,i)])n++});return n}
function liftDone(day,li,completed){const l=day.lifts[li];for(let i=1;i<=l.sets;i++)if(!completed[key(day,li,i)])return false;return true}
function firstFocus(days,completed,today){let i=days.findIndex(d=>d.date>=today&&doneSets(d,completed)<setCount(d));if(i<0)i=days.findIndex(d=>doneSets(d,completed)<setCount(d));return i<0?Math.max(0,days.length-1):i}
function render(note,data){const app=document.getElementById("app"),program=data?.values?.program,completed=data?.values?.completed||{};if(!program){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">No strength program data yet.</div>`;return}const days=flat(program);if(!days.length){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">The program has no workout days.</div>`;return}if(selected===null||selected<0||selected>=days.length)selected=firstFocus(days,completed,note.today);const day=days[selected],total=days.reduce((n,d)=>n+setCount(d),0),done=days.reduce((n,d)=>n+doneSets(d,completed),0),dayTotal=setCount(day),dayDone=doneSets(day,completed),pct=total?Math.round(done/total*100):0,dayPct=dayTotal?Math.round(dayDone/dayTotal*100):0;app.innerHTML=`<div class="top"><div><h1>${esc(note.title)}</h1><div class="muted">${esc(program.name||"Strength program")} · starts ${esc(fmtDate(program.startDate))}</div></div><div class="nav"><button id="prev" aria-label="Previous workout" ${selected===0?"disabled":""}>Back</button><button id="focus" class="primary">Next up</button><button id="next" aria-label="Next workout" ${selected===days.length-1?"disabled":""}>Next</button></div></div><div class="grid"><section class="card hero"><div class="muted small">Workout ${selected+1} of ${days.length}</div><h2 style="margin:4px 0 0;font-size:24px">Week ${esc(day.week)} · ${esc(fmtDate(day.date))}</h2><div class="bar" aria-label="Overall program progress"><span style="width:${pct}%"></span></div><div class="stats"><div class="stat"><div class="num">${dayDone}/${dayTotal}</div><div class="muted small">sets today</div></div><div class="stat"><div class="num">${done}/${total}</div><div class="muted small">sets total</div></div><div class="stat"><div class="num">${pct}%</div><div class="muted small">complete</div></div></div></section><section class="card workout" aria-label="Current workout">${(day.lifts||[]).map((l,li)=>`<div class="lift"><div class="liftHead"><div class="liftName">${esc(l.name)}</div><div class="pill">${esc(l.sets)}×${esc(l.reps)} · ${esc(l.weightKg)} kg</div></div><div class="sets">${Array.from({length:Number(l.sets)||0},(_,x)=>{const si=x+1,done=!!completed[key(day,li,si)];return `<button class="setBtn ${done?"done":""}" data-li="${li}" data-si="${si}" aria-pressed="${done}" aria-label="${esc(l.name)} set ${si} ${done?"done":"not done"}">Set ${si}</button>`}).join("")}</div></div>`).join("")}<div class="err" role="alert">${esc(error)}</div></section><aside class="card program"><div style="padding:14px 16px;border-bottom:1px solid var(--amber-separator);font-weight:750">Program days</div><div class="days" style="padding:10px">${days.map((d,i)=>{const ds=doneSets(d,completed),ts=setCount(d),isDone=ts>0&&ds===ts;return `<button class="dayBtn ${i===selected?"active":""} ${isDone?"done":""}" data-day="${i}" aria-label="Open week ${esc(d.week)} ${esc(fmtDate(d.date))}"><span class="check">${isDone?"✓":""}</span><span><span class="title">Week ${esc(d.week)} · ${esc(fmtDate(d.date))}</span><br><span class="muted small">${esc((d.lifts||[]).map(l=>l.name).join(", "))}</span></span><span class="muted small">${ds}/${ts}</span></button>`}).join("")}</div></aside></div>`;document.getElementById("prev").onclick=()=>{selected=Math.max(0,selected-1);render(note,data)};document.getElementById("next").onclick=()=>{selected=Math.min(days.length-1,selected+1);render(note,data)};document.getElementById("focus").onclick=()=>{selected=firstFocus(days,completed,note.today);render(note,data)};app.querySelectorAll(".dayBtn").forEach(b=>b.onclick=()=>{selected=Number(b.dataset.day);render(note,data)});app.querySelectorAll(".setBtn").forEach(b=>b.onclick=async()=>{const li=Number(b.dataset.li),si=Number(b.dataset.si),k=key(day,li,si),next={...completed,[k]:!completed[k]};if(!next[k])delete next[k];const r=await amber.setData({values:{completed:next}});error=r&&r.ok===false?r.error:"";if(error)render(note,data)});}
amber.onChange(render);
</script>
</body>
</html>
