<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 96px; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 4px; }
  h2 { font-size: 20px; margin: 0; }
  .muted { color: var(--amber-text-secondary); font-size: 14px; }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); border: 1px solid var(--amber-separator); margin-bottom: 16px; overflow: hidden; }
  .head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; }
  .head .grow { flex: 1; min-width: 0; text-align: center; }
  .lift { padding: 14px 16px; border-top: 1px solid var(--amber-separator); }
  .lift-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .lift-name { font-weight: 600; font-size: 17px; }
  .num { font-variant-numeric: tabular-nums; }
  .sets { display: flex; flex-wrap: wrap; gap: 8px; }
  .set { min-width: 64px; min-height: 48px; padding: 0 14px; font: inherit; font-weight: 600; border-radius: var(--amber-radius-small); border: 1px solid var(--amber-separator); background: var(--amber-fill); color: var(--amber-text); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .set[aria-pressed="true"] { background: var(--amber-accent); color: var(--amber-on-accent); border-color: var(--amber-accent); }
  button.nav { font: inherit; font-weight: 600; min-height: 44px; min-width: 44px; padding: 0 14px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-fill); color: var(--amber-text); }
  button.nav:disabled { opacity: .4; }
  .bar { height: 8px; background: var(--amber-fill); border-radius: 4px; overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; background: var(--amber-accent); }
  .badge { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 99px; background: var(--amber-accent-soft); color: var(--amber-accent-text); font-weight: 600; }
  .days { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 14px; }
  .day { min-height: 44px; padding: 0 12px; font: inherit; border-radius: var(--amber-radius-small); border: 1px solid var(--amber-separator); background: var(--amber-fill); color: var(--amber-text); }
  .day[aria-pressed="true"] { border-color: var(--amber-accent); box-shadow: inset 0 0 0 1px var(--amber-accent); font-weight: 600; }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
  .reset { background: none; border: 0; color: var(--amber-text-secondary); font: inherit; font-size: 14px; min-height: 44px; text-decoration: underline; }
  .err { color: var(--amber-danger); min-height: 1em; }
  @media (min-width: 900px) { .lifts { display: grid; grid-template-columns: 1fr 1fr; } .lifts .lift:nth-child(-n+2) { border-top: 0; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  let sel = null, err = "", doneMap = {};
  const kgFmt = (n) => (Math.round(n * 100) / 100).toString();
  function dateOf(start, off) {
    const [y, m, d] = start.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d + off)).toISOString().slice(0, 10);
  }
  function pretty(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
  }
  const keyOf = (w, s, l, i) => `${w}-${s}-${l}-${i}`;
  function sessionStats(prog, w, s) {
    let total = 0, n = 0;
    prog[w].sessions[s].lifts.forEach((l, li) => { for (let i = 0; i < l.sets; i++) { total++; if (doneMap[keyOf(w, s, li, i)]) n++; } });
    return { total, n };
  }
  function render(note, data) {
    const app = document.getElementById("app");
    const v = (data && data.values) || {};
    const prog = Array.isArray(v.program) ? v.program : [];
    doneMap = v.done || {};
    if (!prog.length) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">No program in the app's data yet.</div>`; return; }
    const start = v.start || note.today;
    const flat = [];
    prog.forEach((wk, w) => wk.sessions.forEach((s, si) => flat.push({ w, s: si, date: dateOf(start, s.offset) })));
    if (!sel || !flat.some((f) => f.w === sel.w && f.s === sel.s)) {
      const open = flat.filter((f) => sessionStats(prog, f.w, f.s).n < sessionStats(prog, f.w, f.s).total);
      sel = open.find((f) => f.date >= note.today) || open[0] || flat[flat.length - 1];
      sel = { w: sel.w, s: sel.s };
    }
    const idx = flat.findIndex((f) => f.w === sel.w && f.s === sel.s);
    const wk = prog[sel.w], ses = wk.sessions[sel.s], date = flat[idx].date;
    const st = sessionStats(prog, sel.w, sel.s);
    const pct = st.total ? Math.round((st.n / st.total) * 100) : 0;
    let all = 0, alln = 0;
    prog.forEach((p, w) => p.sessions.forEach((_, s) => { const x = sessionStats(prog, w, s); all += x.total; alln += x.n; }));
    const rel = date === note.today ? "Today" : date > note.today ? "Upcoming" : "Past";
    const status = st.n === st.total ? "Done" : rel;
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="muted num">Block starts ${esc(pretty(start))} · ${alln} of ${all} sets done</div>
      <div class="card" style="margin-top:16px">
        <div class="head">
          <button class="nav" id="prev" aria-label="Previous session" ${idx === 0 ? "disabled" : ""}>&#8249;</button>
          <div class="grow"><h2>${esc(wk.label)} · ${esc(ses.day)}</h2><div class="muted num">${esc(pretty(date))} <span class="badge">${esc(status)}</span></div></div>
          <button class="nav" id="next" aria-label="Next session" ${idx === flat.length - 1 ? "disabled" : ""}>&#8250;</button>
        </div>
        <div style="padding:0 16px 14px"><div class="muted num">${st.n} of ${st.total} sets</div><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>
        <div class="lifts">${ses.lifts.map((l, li) => `
          <div class="lift">
            <div class="lift-top"><span class="lift-name">${esc(l.name)}</span><span class="num muted">${l.sets} × ${l.reps} @ ${kgFmt(l.kg)} kg</span></div>
            <div class="sets">${Array.from({ length: l.sets }, (_, i) => `<button class="set num" data-k="${keyOf(sel.w, sel.s, li, i)}" aria-pressed="${!!doneMap[keyOf(sel.w, sel.s, li, i)]}" aria-label="${esc(l.name)} set ${i + 1}, ${l.reps} reps at ${kgFmt(l.kg)} kilograms">${i + 1}${doneMap[keyOf(sel.w, sel.s, li, i)] ? " ✓" : ""}</button>`).join("")}</div>
          </div>`).join("")}</div>
      </div>
      <div class="card"><div style="padding:14px 16px 8px" class="muted">Jump to session</div>
        ${prog.map((p, w) => `<div style="padding:0 16px 4px" class="muted">${esc(p.label)}</div><div class="days">${p.sessions.map((s, si) => { const x = sessionStats(prog, w, si); return `<button class="day" data-w="${w}" data-s="${si}" aria-pressed="${w === sel.w && si === sel.s}">${esc(s.day)}${x.n === x.total ? " ✓" : ""}</button>`; }).join("")}</div>`).join("")}
      </div>
      <div class="err" role="alert">${esc(err)}</div>
      <button class="reset" id="reset">Clear this session's ticks</button>`;
    document.getElementById("prev").onclick = () => { const f = flat[idx - 1]; sel = { w: f.w, s: f.s }; render(amber.note, amber.data); };
    document.getElementById("next").onclick = () => { const f = flat[idx + 1]; sel = { w: f.w, s: f.s }; render(amber.note, amber.data); };
    app.querySelectorAll(".day").forEach((b) => b.onclick = () => { sel = { w: +b.dataset.w, s: +b.dataset.s }; render(amber.note, amber.data); });
    app.querySelectorAll(".set").forEach((b) => b.onclick = async () => {
      const k = b.dataset.k;
      const r = await amber.setData({ values: { done: { [k]: doneMap[k] ? null : true } } });
      err = r && r.ok === false ? r.error : "";
    });
    document.getElementById("reset").onclick = async () => {
      const patch = {};
      ses.lifts.forEach((l, li) => { for (let i = 0; i < l.sets; i++) patch[keyOf(sel.w, sel.s, li, i)] = null; });
      await amber.setData({ values: { done: patch } });
    };
  }
  amber.onChange(render);
</script>
</body>
</html>
