<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 96px}h1{font-size:32px;letter-spacing:-.03em;margin:2px 0 6px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.055em;color:var(--amber-text-secondary);margin:22px 4px 9px;display:flex;justify-content:space-between;gap:12px}.hero{display:grid;gap:12px;margin-top:14px}.count{background:var(--amber-accent-soft);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:18px}.count .k{font-size:42px;line-height:1;font-weight:750;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.count .t{color:var(--amber-text-secondary);margin-top:5px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.grid{display:grid;gap:12px}.tile{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:15px 16px;min-width:0}.label{font-size:13px;color:var(--amber-text-secondary);margin-bottom:6px}.big{font-size:19px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}.sub{color:var(--amber-text-secondary);font-size:14px;margin-top:4px;overflow-wrap:anywhere}.fact{display:grid;grid-template-columns:minmax(76px,28%) 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--amber-separator)}.fact:first-child,.item:first-child{border-top:0}.fact dt{color:var(--amber-text-secondary);font-size:14px}.fact dd{margin:0;overflow-wrap:anywhere}.item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-top:1px solid var(--amber-separator);min-height:50px;cursor:pointer}.item input{width:44px;height:44px;flex:0 0 auto;margin-top:-5px;accent-color:var(--amber-accent)}.item span{min-width:0;overflow-wrap:anywhere}.item.done span{color:var(--amber-text-secondary);text-decoration:line-through}.bar{height:6px;border-radius:999px;background:var(--amber-fill);overflow:hidden;margin:0 4px 8px}.bar div{height:100%;background:var(--amber-accent)}.empty{padding:24px 16px;text-align:center;color:var(--amber-text-secondary)}.err{color:var(--amber-danger);min-height:1em;margin:10px 4px}@media (min-width:700px){.hero{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}@media (min-width:1000px){.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.wide{grid-column:1/-1}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip=s=>String(s??"").replace(/\*\*|__|`/g,"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").trim();
let error="";
const months={jan:"01",january:"01",feb:"02",february:"02",mar:"03",march:"03",apr:"04",april:"04",may:"05",jun:"06",june:"06",jul:"07",july:"07",aug:"08",august:"08",sep:"09",sept:"09",september:"09",oct:"10",october:"10",nov:"11",november:"11",dec:"12",december:"12"};
function wordDate(day,mon,today){let y=String(today||"").slice(0,4)||String(new Date().getFullYear());let mm=months[String(mon).toLowerCase()];if(!mm)return null;return `${y}-${mm}-${String(day).padStart(2,"0")}`}
function diffDays(a,b){return Math.round((Date.parse(a+"T12:00:00Z")-Date.parse(b+"T12:00:00Z"))/864e5)}
function facts(lines){let out=[];for(const l of lines){let m=l.match(/^\s*(?:[-*]\s+)?\*{0,2}([A-Za-zÅÄÖåäö][\w ÅÄÖåäö/&.-]{1,24}?)\*{0,2}\s*:\s+(.+)$/);if(m)out.push({label:strip(m[1]),value:strip(m[2])});else{let b=l.match(/^\s*budget\s*~?\s*(.+)$/i);if(b)out.push({label:"budget",value:strip(b[1])})}}return out}
function flightInfo(txt,today){txt=String(txt||"");let out=txt.match(/out\s+(?:\w+\s+)?(\d{1,2})\s+([a-z]+)\s+(\d{1,2}:\d{2})\s+([A-Z]{3})\s*[-–]?\>\s*([A-Z]{3})\s*\(([^)]+)\)/i);let back=txt.match(/back\s+(?:\w+\s+)?(\d{1,2})\s+([a-z]+)\s+(\d{1,2}:\d{2})(?:\s+([A-Z]{3})\s*[-–]?\>\s*([A-Z]{3}))?\s*\(([^)]+)\)/i);let r=[];if(out)r.push({label:"Outbound",date:wordDate(out[1],out[2],today),time:out[3],route:`${out[4]} → ${out[5]}`,no:out[6]});if(back)r.push({label:"Return",date:wordDate(back[1],back[2],today),time:back[3],route:back[4]?`${back[4]} → ${back[5]}`:(out?`${out[5]} → ${out[4]}`:""),no:back[6]});return r}
function fmtDate(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||""))return "";let d=new Date(iso+"T12:00:00Z");return d.toLocaleString("en",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"})}
function render(note,data){const app=document.getElementById("app"),lines=note.markdown.split("\n"),fs=facts(lines),fm=fs.find(f=>/^flights?$/i.test(f.label)),hm=fs.find(f=>/^hotel$/i.test(f.label)),bm=fs.find(f=>/^budget$/i.test(f.label)),flights=flightInfo(fm&&fm.value,note.today);let start=(flights[0]&&flights[0].date)||data?.values?.start||"",end=(flights[1]&&flights[1].date)||data?.values?.end||"";let days=start?diffDays(start,note.today):null;
let groups=[];for(const c of note.checklists){let h="To do";for(let k=c.line-2;k>=0;k--){let m=lines[k].match(/^#{1,6}\s+(.*)$/);if(m){h=strip(m[1]);break}}let g=groups.find(x=>x.h===h);if(!g)groups.push(g={h,items:[]});g.items.push(c)}
let count=days===null?"":days>0?`<div class="k">${days}</div><div class="t">day${days===1?"":"s"} until Porto</div>`:days===0?`<div class="k">Today</div><div class="t">Porto weekend starts now</div>`:`<div class="k">${-days}</div><div class="t">day${days===-1?"":"s"} since the trip</div>`;
app.innerHTML=`<h1>${esc(note.title)}</h1><div class="sub">${start?esc(fmtDate(start))+(end?" – "+esc(fmtDate(end)):""):"Trip at a glance"}</div><section class="hero"><div class="count">${count||'<div class="t">Add a start date to see a countdown.</div>'}</div><div class="tile"><div class="label">Hotel</div><div class="big">${esc(hm?hm.value.split(",")[0]:"Not added yet")}</div><div class="sub">${esc(hm?hm.value.split(",").slice(1).join(", ").trim():"Add a hotel line to the note.")}</div></div></section><h2><span>Flights</span></h2><section class="grid">${flights.length?flights.map(f=>`<div class="tile"><div class="label">${esc(f.label)}</div><div class="big">${esc(f.route||"Flight")}</div><div class="sub">${esc([fmtDate(f.date),f.time,f.no].filter(Boolean).join(" · "))}</div></div>`).join(""):'<div class="card empty span2">Add a flights line to see outbound and return details.</div>'}</section><section class="layout"><div class="wide"><h2><span>At a glance</span></h2><dl class="card">${fs.length?fs.map(f=>`<div class="fact"><dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd></div>`).join(""):'<div class="empty">Add lines like “hotel: …” or “budget …” to show facts here.</div>'}</dl></div>${groups.map(g=>{let done=g.items.filter(i=>i.checked).length,pct=g.items.length?100*done/g.items.length:0;return `<section><h2><span>${esc(g.h)}</span><span>${done}/${g.items.length}</span></h2><div class="bar" aria-hidden="true"><div style="width:${pct}%"></div></div><div class="card">${g.items.map(i=>`<label class="item ${i.checked?"done":""}"><input aria-label="${esc(strip(i.text))}" type="checkbox" data-line="${i.line}" ${i.checked?"checked":""}><span>${esc(strip(i.text))}</span></label>`).join("")}</div></section>`}).join("")}</section><div class="err" role="alert">${esc(error)}</div>`;
app.querySelectorAll("[data-line]").forEach(box=>box.addEventListener("change",async()=>{let r=await amber.update({op:"toggle_checklist",line:Number(box.dataset.line)});error=r.ok?"":r.error;if(!r.ok)render(amber.note,amber.data)}))}
amber.onChange(render);
</script>
</body>
</html>
