<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;color:var(--amber-text);font:16px/1.4 var(--amber-font,-apple-system,system-ui,sans-serif)}main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 64px}h1{font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:4px 0 16px}.summary{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:18px;margin-bottom:14px}.label{color:var(--amber-text-secondary);font-size:14px}.total{font-size:38px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:4px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;min-height:52px;padding:12px 16px;border-top:1px solid var(--amber-separator)}.row:first-child{border-top:0}.item{min-width:0;overflow-wrap:anywhere}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--amber-text-secondary);font-size:13px;margin-top:3px}.pill{background:var(--amber-accent-soft);color:var(--amber-accent-text);border-radius:99px;padding:2px 10px}.amount{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.empty{padding:28px 16px;text-align:center;color:var(--amber-text-secondary)}@media (min-width:900px){main{padding-top:28px}.total{font-size:46px}.row{grid-template-columns:1fr 160px}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const num=(s)=>{const n=parseFloat(String(s??"").replace(/\s/g,"").replace(",","."));return Number.isFinite(n)?n:0};
const findCol=(t,re)=>t.columns.findIndex(c=>re.test(c.name));
function render(note){
 const t=(note.tables||[])[0];
 if(!t){app.innerHTML='<h1>'+esc(note.title)+'</h1><div class="card empty">Add an expenses table to see totals here.</div>';return;}
 const date=findCol(t,/^date$/i), item=findCol(t,/^(item|name|title)$/i), cat=findCol(t,/^category$/i), amt=findCol(t,/^(amt|amount( \(kr\))?|amount|kr)$/i);
 if(amt<0){app.innerHTML='<h1>'+esc(note.title)+'</h1><div class="card empty">Add an Amount (kr) column to see totals here.</div>';return;}
 const total=t.rows.reduce((sum,r)=>sum+num(r[amt]),0);
 const rows=t.rows.map(r=>'<div class="row"><div class="item"><div>'+esc(item>=0?r[item]:'Expense')+'</div><div class="meta">'+(date>=0?'<span>'+esc(r[date])+'</span>':'')+(cat>=0?'<span class="pill">'+esc(r[cat])+'</span>':'')+'</div></div><div class="amount">'+esc(r[amt])+' kr</div></div>').join('');
 app.innerHTML='<h1>'+esc(note.title)+'</h1><section class="summary"><div class="label">Total expenses</div><div class="total">'+total.toLocaleString('sv-SE')+' kr</div></section><section class="card">'+(rows||'<div class="empty">No expenses yet.</div>')+'</section>';
}
amber.onChange(render);
</script>
</body>
</html>
