<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px var(--amber-gutter) 96px;color:var(--amber-text);font-family:var(--amber-font)}.wrap{max-width:var(--amber-content-max);margin:0 auto}.head{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}h1{margin:0;font-size:30px;line-height:1.05;letter-spacing:-.03em}h2{margin:24px 0 10px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--amber-text-secondary)}.month{display:flex;flex-direction:column;gap:5px;color:var(--amber-text-secondary);font-size:13px}.grid{display:grid;grid-template-columns:1fr;gap:14px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.hero{padding:18px}.total{font-size:44px;line-height:1;font-weight:750;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.sub{margin-top:8px;color:var(--amber-text-secondary)}.sub.bad{color:var(--amber-danger);font-weight:650}.meter{height:12px;border-radius:999px;background:var(--amber-fill);overflow:hidden;margin-top:16px}.fill{height:100%;background:var(--amber-accent);border-radius:999px;transition:width .2s}.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--amber-separator)}.stat{background:var(--amber-surface);padding:14px}.label{color:var(--amber-text-secondary);font-size:13px}.value{margin-top:3px;font-weight:700;font-variant-numeric:tabular-nums}.rows{display:flex;flex-direction:column}.row{display:flex;align-items:center;gap:12px;min-height:50px;padding:12px 14px;border-top:1px solid var(--amber-separator)}.row:first-child{border-top:0}.grow{flex:1;min-width:0}.muted{color:var(--amber-text-secondary);font-size:13px}.num{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.barbox{width:88px;height:8px;background:var(--amber-fill);border-radius:999px;overflow:hidden;flex:none}.bar{height:100%;background:var(--amber-accent);border-radius:999px}.empty{padding:26px 16px;text-align:center;color:var(--amber-text-secondary)}form{display:grid;grid-template-columns:1fr;gap:10px;padding:14px}label{display:flex;flex-direction:column;gap:5px;color:var(--amber-text-secondary);font-size:13px}input,select{width:100%;min-height:46px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-fill);color:var(--amber-text);font:inherit;font-size:16px;padding:10px 12px}button{min-height:48px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-accent);color:var(--amber-on-accent);font:inherit;font-weight:700;padding:0 16px}.err{min-height:20px;color:var(--amber-danger);padding:0 14px 14px}.ok{color:var(--amber-accent-text)}.tiny{font-size:12px;color:var(--amber-text-secondary);padding:0 14px 14px}.limitline{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px;border-top:1px solid var(--amber-separator)}.limitline label{margin:0}.limitline button{min-width:76px}.latest .row{align-items:flex-start}@media(min-width:700px){form{grid-template-columns:1.2fr .7fr .8fr .7fr auto;align-items:end}form button{min-width:96px}.grid{grid-template-columns:1.05fr .95fr}.span{grid-column:1/-1}.limitline{grid-template-columns:1fr auto}}@media(min-width:1000px){.grid{grid-template-columns:1fr 1fr}.total{font-size:56px}.latest{max-height:460px;overflow:auto}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseNum=v=>{let s=String(v??"").toLowerCase().replace(/kr|sek|\s| /g,"");if(s.includes(",")&&!s.includes("."))s=s.replace(",",".");return Number.parseFloat(s)||0};
const money=(n,cur)=>Number(n||0).toLocaleString("sv-SE",{maximumFractionDigits:2})+" "+cur;
const findCol=(t,re)=>t.columns.findIndex(c=>re.test(c.name));
let state={month:null,msg:"",err:""};
function fallbackLimit(md){const m=String(md||"").match(/limit[^\d]*(\d[\d\s.,]*)/i);return m?parseNum(m[1]):0}
function getBudgetTable(note){return note.tables.find(t=>findCol(t,/amount|cost|price|^kr$|sum|belopp/i)>=0)||note.tables[0]}
function render(note,data){
 const root=document.getElementById("app"),t=getBudgetTable(note),cur=(data&&data.values&&data.values.currency)||"kr";
 if(!t){root.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Date, Item, Category and Amount columns to use this budget app.</div>`;return}
 const ci={date:findCol(t,/^date$|^day$|datum/i),item:findCol(t,/item|what|desc|name|vad/i),cat:findCol(t,/categ|kategori|type/i),amt:findCol(t,/amount|cost|price|^kr$|sum|belopp/i)};
 const months=[...new Set(t.rows.map(r=>ci.date>=0?String(r[ci.date]).slice(0,7):"").filter(m=>/^\d{4}-\d{2}$/.test(m)))].sort();
 const todayMonth=String(note.today||"").slice(0,7); if(!state.month)state.month=months.includes(todayMonth)?todayMonth:(months[months.length-1]||todayMonth);
 const rows=t.rows.map((r,i)=>({r,i,amt:parseNum(r[ci.amt])})).filter(x=>ci.date<0||String(x.r[ci.date]).startsWith(state.month));
 const total=rows.reduce((s,x)=>s+x.amt,0),limit=Number(data&&data.values&&data.values.limit)||fallbackLimit(note.markdown),left=limit-total;
 const cats=new Map(); rows.forEach(x=>{const k=(ci.cat>=0&&x.r[ci.cat])?String(x.r[ci.cat]):"Other";cats.set(k,(cats.get(k)||0)+x.amt)});
 const byCat=[...cats].sort((a,b)=>b[1]-a[1]),catNames=[...new Set(t.rows.map(r=>ci.cat>=0?String(r[ci.cat]||""):"").filter(Boolean))].sort();
 const spentPct=limit?Math.min(100,(total/limit)*100):(rows.length?100:0),largest=Math.max(...byCat.map(x=>x[1]),1);
 root.innerHTML=`<div class="head"><div><h1>${esc(note.title)}</h1><div class="muted">${state.month?esc(state.month):"All expenses"}</div></div>${months.length>1?`<label class="month">Month<select id="month">${months.map(m=>`<option value="${esc(m)}" ${m===state.month?"selected":""}>${esc(m)}</option>`).join("")}</select></label>`:""}</div>
 <section class="grid"><div class="card"><div class="hero"><div class="total">${money(total,cur)}</div><div class="sub ${limit&&left<0?"bad":""}">${limit?(left>=0?`${money(left,cur)} left of ${money(limit,cur)} limit`:`${money(Math.abs(left),cur)} over the ${money(limit,cur)} limit`):`${rows.length} expenses logged`}</div><div class="meter" aria-label="Spent versus limit"><div class="fill" style="width:${spentPct}%"></div></div></div><div class="stats"><div class="stat"><div class="label">Limit</div><div class="value">${limit?money(limit,cur):"Not set"}</div></div><div class="stat"><div class="label">Transactions</div><div class="value">${rows.length}</div></div></div><div class="limitline"><label>Change limit<input id="limit" inputmode="decimal" value="${limit||""}" aria-label="Monthly limit"></label><button id="saveLimit">Save</button></div><div class="tiny" id="limitMsg"></div></div>
 <div><h2 style="margin-top:0">Spending by category</h2><div class="card rows">${byCat.length?byCat.map(([k,v])=>`<div class="row"><div class="grow"><strong>${esc(k)}</strong><div class="muted">${Math.round(v/(total||1)*100)}% of spending</div></div><div class="barbox" aria-hidden="true"><div class="bar" style="width:${Math.max(4,v/largest*100)}%"></div></div><div class="num">${money(v,cur)}</div></div>`).join(""):`<div class="empty">No spending in this month yet.</div>`}</div></div></section>
 <h2>Quick add expense</h2><div class="card"><form id="add"><label>Date<input type="date" name="date" value="${esc(note.today||"")}" required></label><label>Item<input name="item" autocomplete="off" placeholder="Coffee" required></label><label>Category<input name="cat" list="categories" placeholder="food"><datalist id="categories">${catNames.map(c=>`<option value="${esc(c)}"></option>`).join("")}</datalist></label><label>Amount<input name="amt" inputmode="decimal" placeholder="129" required></label><button>Add</button></form><div class="err" role="alert">${esc(state.err)}</div>${state.msg?`<div class="tiny ok">${esc(state.msg)}</div>`:""}</div>
 <h2>Latest expenses</h2><div class="card rows latest">${rows.slice().reverse().slice(0,10).map(x=>`<div class="row"><div class="grow"><strong>${esc(ci.item>=0?x.r[ci.item]:"Expense")}</strong><div class="muted">${esc(ci.date>=0?x.r[ci.date]:"")}${ci.cat>=0&&x.r[ci.cat]?" · "+esc(x.r[ci.cat]):""}</div></div><div class="num">${money(x.amt,cur)}</div></div>`).join("")||`<div class="empty">No expenses yet.</div>`}</div>`;
 const m=document.getElementById("month"); if(m)m.onchange=()=>{state.month=m.value;state.err="";state.msg="";render(note,data)};
 document.getElementById("saveLimit").onclick=async()=>{const val=parseNum(document.getElementById("limit").value);const r=await amber.setData({values:{limit:val||null,currency:cur}});state.msg=r.ok?"Limit saved.":"";state.err=r.ok?"":r.error;if(!r.ok)render(amber.note,amber.data);};
 document.getElementById("add").onsubmit=async e=>{e.preventDefault();state.err="";state.msg="";const fd=new FormData(e.currentTarget),values={}; if(ci.date>=0)values[t.columns[ci.date].name]=String(fd.get("date")||note.today); if(ci.item>=0)values[t.columns[ci.item].name]=String(fd.get("item")||"").trim(); if(ci.cat>=0)values[t.columns[ci.cat].name]=String(fd.get("cat")||"").trim()||"Other"; values[t.columns[ci.amt].name]=String(fd.get("amt")||"").trim().replace(",","."); if(!parseNum(values[t.columns[ci.amt].name])){state.err="Enter an amount greater than 0.";render(note,data);return} const r=await amber.update({op:"append_row",table:t.index,values}); if(r.ok){state.msg="Expense added.";e.currentTarget.reset();}else{state.err=r.error;render(amber.note,amber.data);}};
}
amber.onChange(render);
</script>
</body>
</html>
