<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;padding:18px 0 42px;font-family:var(--amber-font);color:var(--amber-text)}.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:0 var(--amber-gutter)}header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:4px 0 14px}h1{font-size:30px;line-height:1.08;letter-spacing:-.03em;margin:0}h2{font-size:13px;line-height:1.2;letter-spacing:.04em;text-transform:uppercase;color:var(--amber-text-secondary);margin:0 0 10px}.grid{display:grid;gap:14px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.pad{padding:16px}.summary{display:grid;gap:14px}.spent{font-size:42px;line-height:1.05;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.muted{color:var(--amber-text-secondary)}.status{font-size:16px}.status.over{color:var(--amber-danger);font-weight:700}.meter{height:12px;border-radius:999px;background:var(--amber-fill);overflow:hidden}.meter>div{height:100%;background:var(--amber-accent);border-radius:999px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--amber-fill);border-radius:var(--amber-radius-small);padding:10px;min-width:0}.stat b{display:block;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat span{display:block;font-size:12px;color:var(--amber-text-secondary);margin-top:2px}label{display:grid;gap:5px;font-size:13px;color:var(--amber-text-secondary);min-width:0}input,select,button{font:inherit;font-size:16px;min-height:44px;border:0;border-radius:var(--amber-radius-small)}input,select{width:100%;padding:10px 12px;background:var(--amber-fill);color:var(--amber-text)}button{padding:0 16px;background:var(--amber-accent);color:var(--amber-on-accent);font-weight:700}button.secondary{background:var(--amber-fill);color:var(--amber-text)}form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide-field{grid-column:1/-1}.actions{display:grid;grid-template-columns:1fr;gap:8px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--amber-separator)}.row:first-child{border-top:0}.row-main{min-width:0}.row-title{font-weight:650;overflow-wrap:anywhere}.row-meta{font-size:13px;color:var(--amber-text-secondary);margin-top:2px;overflow-wrap:anywhere}.amount{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:13px 14px;border-top:1px solid var(--amber-separator)}.cat-row:first-child{border-top:0}.cat-name{font-weight:650;overflow-wrap:anywhere}.bar{grid-column:1/-1;height:8px;border-radius:999px;background:var(--amber-fill);overflow:hidden}.bar span{display:block;height:100%;border-radius:999px;background:var(--amber-accent)}.empty{padding:24px 16px;text-align:center;color:var(--amber-text-secondary)}.err{min-height:1.2em;color:var(--amber-danger);font-size:14px;margin-top:10px}.month{max-width:180px}.limit-line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-top:12px}.hint{font-size:13px;color:var(--amber-text-secondary);margin-top:8px}@media (max-width:599px){.spent{font-size:38px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}form{grid-template-columns:1fr}.month{max-width:none;width:100%}}@media (min-width:900px){.grid{grid-template-columns:1.05fr .95fr;align-items:start}.span-2{grid-column:1/-1}.spent{font-size:56px}.summary{min-height:100%}}
</style>
</head>
<body>
<div class="wrap"><main id="app" aria-live="polite"></main></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const clean=s=>String(s??"").replace(/[\s\u00a0]/g,"").replace(/kr|sek|\$|€|£/gi,"").replace(",",".");
const toNum=s=>{const n=parseFloat(clean(s));return Number.isFinite(n)?n:0};
const findCol=(t,rx)=>t.columns.findIndex(c=>rx.test(c.name));
const todayMonth=n=>String(n.today||"").slice(0,7);
let state={month:null,error:"",form:{date:"",item:"",category:"",amount:""}};
let currentNote=null,currentData=null;
function money(n,cur){return n.toLocaleString("sv-SE",{maximumFractionDigits:2})+" "+cur}
function monthName(m){if(!/^\d{4}-\d{2}$/.test(m||""))return "All";const d=new Date(m+"-01T00:00:00");return d.toLocaleDateString(undefined,{month:"long",year:"numeric"})}
function getLimit(note,data){const v=data&&data.values&&data.values.limit;if(v!==undefined&&v!==null&&v!=="")return Number(v)||0;const m=String(note.markdown||"").match(/limit[^\d]*(\d[\d\s.,]*)/i);return m?toNum(m[1]):0}
function render(note,data){currentNote=note;currentData=data||{values:{}};const app=document.getElementById("app");const table=note.tables.find(t=>findCol(t,/amount|cost|price|^kr$|sum|belopp/i)>=0)||note.tables[0];if(!table){app.innerHTML=`<header><h1>${esc(note.title)}</h1></header><div class="card empty">Add an Expenses table with Date, Item, Category and Amount columns to use the budget app.</div>`;return}const d=findCol(table,/^date$|datum|day/i), item=findCol(table,/item|what|desc|name|vad/i), cat=findCol(table,/category|kategori|type/i), amt=findCol(table,/amount|cost|price|^kr$|sum|belopp/i);if(amt<0){app.innerHTML=`<header><h1>${esc(note.title)}</h1></header><div class="card empty">I found a table, but it needs an Amount column.</div>`;return}const cur=(currentData.values&&currentData.values.currency)||"kr";const months=[...new Set(table.rows.map(r=>d>=0?String(r[d]).slice(0,7):"").filter(m=>/^\d{4}-\d{2}$/.test(m)))].sort();if(!state.month)state.month=months.includes(todayMonth(note))?todayMonth(note):(months[months.length-1]||"");const month=state.month;const all=table.rows.map((r,i)=>({r,i,amount:toNum(r[amt]),date:d>=0?String(r[d]):""}));const rows=all.filter(x=>!month||d<0||x.date.startsWith(month));const total=rows.reduce((s,x)=>s+x.amount,0);const limit=getLimit(note,currentData);const left=limit-total;const pct=limit?Math.min(100,Math.max(0,total/limit*100)):100;const by=new Map();rows.forEach(x=>{const k=(cat>=0&&x.r[cat])?String(x.r[cat]):"Other";by.set(k,(by.get(k)||0)+x.amount)});const cats=[...by.entries()].sort((a,b)=>b[1]-a[1]);const catOptions=[...new Set(table.rows.map(r=>cat>=0?String(r[cat]||""):"").filter(Boolean))].sort((a,b)=>a.localeCompare(b));const latest=rows.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||b.i-a.i).slice(0,8);const f=state.form;if(!f.date)f.date=note.today;app.innerHTML=`<header><div><h1>${esc(note.title)}</h1><div class="muted">${esc(monthName(month))}</div></div>${months.length>1?`<label>Month<select id="month" class="month"><option value="">All months</option>${months.map(m=>`<option value="${esc(m)}" ${m===month?"selected":""}>${esc(monthName(m))}</option>`).join("")}</select></label>`:""}</header><section class="grid"><div class="card pad summary"><div><div class="muted">Spent so far</div><div class="spent">${money(total,cur)}</div><div class="status ${left<0?"over":""}">${limit?(left>=0?`${money(left,cur)} left of ${money(limit,cur)}`:`${money(Math.abs(left),cur)} over the ${money(limit,cur)} limit`):`${rows.length} expense${rows.length===1?"":"s"}`}</div></div><div class="meter" role="img" aria-label="${limit?Math.round(pct)+" percent of budget used":"Spending total"}"><div style="width:${pct}%"></div></div><div class="stats"><div class="stat"><b>${rows.length}</b><span>expenses</span></div><div class="stat"><b>${money(rows.length?total/rows.length:0,cur)}</b><span>average</span></div><div class="stat"><b>${cats.length?esc(cats[0][0]):"—"}</b><span>top category</span></div></div><div class="limit-line"><label>Monthly limit<input id="limit" inputmode="decimal" value="${limit||""}" placeholder="15000"></label><button class="secondary" id="saveLimit" type="button">Save</button></div></div><div class="card pad"><h2>Quick add expense</h2><form id="add"><label>Date<input name="date" type="date" value="${esc(f.date||note.today)}" required></label><label>Amount<input name="amount" inputmode="decimal" value="${esc(f.amount)}" placeholder="129" required></label>${item>=0?`<label class="wide-field">What<input name="item" value="${esc(f.item)}" placeholder="Coffee, groceries…" required></label>`:""}${cat>=0?`<label class="wide-field">Category<input name="category" list="cats" value="${esc(f.category)}" placeholder="food"><datalist id="cats">${catOptions.map(c=>`<option value="${esc(c)}"></option>`).join("")}</datalist></label>`:""}<div class="actions wide-field"><button type="submit">Add expense</button></div></form><div class="err" role="alert">${esc(state.error)}</div><div class="hint">Adds a new row to the Expenses table in the note.</div></div><div><h2>Spending by category</h2><div class="card">${cats.length?cats.map(([name,val])=>`<div class="cat-row"><div class="cat-name">${esc(name)}</div><div class="amount">${money(val,cur)}</div><div class="bar" aria-hidden="true"><span style="width:${Math.max(2,val/(total||1)*100)}%"></span></div><div class="muted">${Math.round(val/(total||1)*100)}% of spending</div></div>`).join(""):`<div class="empty">No spending in this month yet.</div>`}</div></div><div><h2>Latest expenses</h2><div class="card">${latest.length?latest.map(x=>`<div class="row"><div class="row-main"><div class="row-title">${esc(item>=0?(x.r[item]||"Expense"):"Expense")}</div><div class="row-meta">${esc(x.date)}${cat>=0&&x.r[cat]?" · "+esc(x.r[cat]):""}</div></div><div class="amount">${money(x.amount,cur)}</div></div>`).join(""):`<div class="empty">No expenses yet.</div>`}</div></div></section>`;const ms=document.getElementById("month");if(ms)ms.onchange=()=>{state.month=ms.value;render(currentNote,currentData)};document.getElementById("saveLimit").onclick=async()=>{const raw=document.getElementById("limit").value.trim();const res=await amber.setData({values:{limit:raw?toNum(raw):null,currency:cur}});state.error=res&&res.ok===false?res.error:"";render(currentNote,currentData)};document.getElementById("add").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);state.form={date:String(fd.get("date")||note.today),amount:String(fd.get("amount")||""),item:String(fd.get("item")||""),category:String(fd.get("category")||"")};if(!toNum(state.form.amount)){state.error="Enter the amount as a number.";render(currentNote,currentData);return}const values={};if(d>=0)values[table.columns[d].name]=state.form.date;if(item>=0)values[table.columns[item].name]=state.form.item.trim();if(cat>=0)values[table.columns[cat].name]=state.form.category.trim();values[table.columns[amt].name]=state.form.amount.trim().replace(",",".");const res=await amber.update({op:"append_row",table:table.index,values});if(res&&res.ok===false){state.error=res.error}else{state.error="";state.form={date:note.today,item:"",category:state.form.category,amount:""}}render(currentNote,currentData)}}
amber.onChange(render);
</script>
</body>
</html>
