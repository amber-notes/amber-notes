<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 96px; }
  h1 { font-size: 30px; letter-spacing: -.02em; margin: 4px 0 4px; }
  h2 { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 22px 4px 8px; }
  .count { display: inline-flex; align-items: baseline; gap: 8px; background: var(--amber-accent-soft); border-radius: 14px; padding: 10px 14px; margin: 8px 0 4px; }
  .count b { font-size: 34px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); overflow: hidden; margin: 0; }
  .fact { display: grid; grid-template-columns: minmax(80px, 28%) 1fr; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--amber-separator); }
  .fact:first-child, .item:first-child { border-top: 0; }
  .fact dt { color: var(--amber-text-secondary); font-size: 14px; }
  .fact dd { margin: 0; overflow-wrap: anywhere; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--amber-separator); min-height: 48px; cursor: pointer; }
  .item input { width: 30px; height: 30px; flex: none; margin: 0; accent-color: var(--amber-accent); }
  .item.done span { color: var(--amber-text-secondary); text-decoration: line-through; }
  .bar { height: 6px; border-radius: 3px; background: var(--amber-fill); overflow: hidden; margin: 0 4px 8px; }
  .bar div { height: 100%; background: var(--amber-accent); }
  .err { color: var(--amber-danger); min-height: 1em; margin: 8px 4px; }
  .cols { display: block; }
  @media (min-width: 900px) { .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const strip = (s) => String(s).replace(/\*\*|__|`/g, "").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1");
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  let error = "";
  function render(note, data) {
    const app = document.getElementById("app");
    const lines = note.markdown.split("\n");
    const groups = [];
    for (const c of note.checklists) {
      let h = "To do";
      for (let k = c.line - 2; k >= 0; k--) { const m = lines[k].match(/^#{1,6}\s+(.*)$/); if (m) { h = strip(m[1]); break; } }
      let g = groups.find((x) => x.h === h);
      if (!g) groups.push((g = { h, items: [] }));
      g.items.push(c);
    }
    const facts = lines.map((l) => l.match(/^\s*(flights?|hotel|budget)\s*(?::|~)\s*(.{2,})$/i)).filter(Boolean).map((m) => ({ label: cap(m[1]), value: m[2] }));
    const start = data && data.values && data.values.start;
    const days = start ? Math.round((Date.parse(start + "T12:00:00Z") - Date.parse(note.today + "T12:00:00Z")) / 864e5) : null;
    const count = days === null ? "" : `<div class="count">${days > 0 ? `<b>${days}</b> day${days === 1 ? "" : "s"} to go` : days === 0 ? `<b>Today</b>` : `<b>${-days}</b> day${days === -1 ? "" : "s"} ago`}</div>`;
    const box = (g) => { const done = g.items.filter((c) => c.checked).length; return `<section><h2><span>${esc(g.h)}</span><span>${done}/${g.items.length}</span></h2>
      <div class="bar" aria-hidden="true"><div style="width:${(100 * done) / g.items.length}%"></div></div>
      <div class="card">${g.items.map((c) => `<label class="item ${c.checked ? "done" : ""}"><input type="checkbox" data-line="${c.line}" ${c.checked ? "checked" : ""}><span>${esc(strip(c.text))}</span></label>`).join("")}</div></section>`; };
    app.innerHTML = `<h1>${esc(note.title)}</h1>${count}
      ${facts.length ? `<h2><span>At a glance</span></h2><dl class="card">${facts.map((f) => `<div class="fact"><dt>${esc(f.label)}</dt><dd>${esc(strip(f.value))}</dd></div>`).join("")}</dl>` : ""}
      <div class="cols">${groups.map(box).join("")}</div>
      <div class="err" role="alert">${esc(error)}</div>`;
    app.querySelectorAll("[data-line]").forEach((b) => b.addEventListener("change", async () => {
      const r = await amber.update({ op: "toggle_checklist", line: Number(b.dataset.line) });
      error = r.ok ? "" : r.error;
      if (!r.ok) render(amber.note, amber.data);
    }));
  }
  amber.onChange(render);
</script>
</body>
</html>
