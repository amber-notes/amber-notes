<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 88px}.hero{background:linear-gradient(135deg,var(--amber-accent-soft),var(--amber-surface));border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:18px;margin-bottom:16px}h1{font-size:30px;line-height:1.08;letter-spacing:-.025em;margin:0 0 10px}.muted{color:var(--amber-text-secondary)}.summary{display:grid;gap:10px;margin-top:14px}.pill{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:999px;padding:9px 12px;display:flex;gap:8px;align-items:center;min-width:0}.label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--amber-text-secondary);font-weight:700}.value{font-weight:650;overflow-wrap:anywhere}.grid{display:grid;gap:16px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.cardHead{padding:14px 16px;border-bottom:1px solid var(--amber-separator)}h2{font-size:18px;margin:0}.body{padding:14px 16px}.big{font-size:36px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}.detail{margin-top:6px}.buttonRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{font:inherit;font-weight:700;min-height:44px;padding:0 16px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-accent);color:var(--amber-on-accent)}button.secondary{background:var(--amber-fill);color:var(--amber-text)}button:disabled{opacity:.65}.status{min-height:20px;margin-top:10px;color:var(--amber-text-secondary)}.status.err{color:var(--amber-danger)}.list{display:grid}.item{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--amber-separator);min-height:48px}.item:first-child{border-top:0}.check{width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:1px solid var(--amber-separator);background:var(--amber-fill);color:var(--amber-text);display:grid;place-items:center;font-weight:800}.check.done{background:var(--amber-accent);color:var(--amber-on-accent);border-color:var(--amber-accent)}.grow{flex:1;min-width:0;overflow-wrap:anywhere}.doneText{text-decoration:line-through;color:var(--amber-text-secondary)}.empty{padding:22px 16px;text-align:center;color:var(--amber-text-secondary)}.fact{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--amber-separator)}.fact:first-child{border-top:0;padding-top:0}.mono{font-family:var(--amber-font-mono);font-variant-numeric:tabular-nums}@media (min-width:700px){.summary{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:1.1fr .9fr}.wide{grid-column:1/-1}}@media (min-width:1000px){h1{font-size:36px}.grid{grid-template-columns:1fr 1fr 1fr}.wide{grid-column:auto}.span2{grid-column:span 2}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const months={jan:0,january:0,feb:1,february:1,mar:2,march:2,apr:3,april:3,may:4,jun:5,june:5,jul:6,july:6,aug:7,august:7,sep:8,sept:8,september:8,oct:9,october:9,nov:10,november:10,dec:11,december:11};
let msg="";let err=false;let busy=false;let current=null;
function cap(s){return s?String(s).charAt(0).toUpperCase()+String(s).slice(1):""}
function parseFlight(note){const m=note.markdown.match(/flights?:\s*([^\n]+)/i);const line=m?m[1]:"";const out=line.match(/out\s+(?:mon|tue|wed|thu|fri|sat|sun)?\s*(\d{1,2})\s+([a-z]+)\s+(\d{1,2}:\d{2})\s+([^,\n]+)/i);if(!out)return{line};const day=+out[1],mon=months[out[2].toLowerCase()],time=out[3],route=out[4].trim();let y=+(note.today||new Date().toISOString().slice(0,4)).slice(0,4);let d=new Date(y,mon,day);const today=new Date((note.today||"")+"T00:00:00");if(d<today)d=new Date(y+1,mon,day);const pack=new Date(d);pack.setDate(d.getDate()-1);pack.setHours(19,0,0,0);return{line,day,mon,time,route,date:d,due:pack,dueISO:localISO(pack),dateText:fmtDate(d),dueText:fmtDateTime(pack)}}
function localISO(d){const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:00`}
function fmtDate(d){return d?d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}):""}
function fmtDateTime(d){return d?d.toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):""}
function daysUntil(note,d){if(!d)return null;const a=new Date((note.today||localISO(new Date()).slice(0,10))+"T00:00:00");const b=new Date(d);b.setHours(0,0,0,0);return Math.round((b-a)/86400000)}
function facts(note){return note.markdown.split(/\n/).map(l=>l.trim()).filter(l=>/^(hotel|budget):/i.test(l)).map(l=>{const i=l.indexOf(":");return{label:cap(l.slice(0,i)),value:l.slice(i+1).trim()}})}
function bulletsUnder(note,heading){const lines=note.markdown.split(/\n/);let inSec=false,arr=[];for(const raw of lines){const l=raw.trim();if(new RegExp("^"+heading+"$","i").test(l)){inSec=true;continue}if(inSec&&l&&!l.startsWith("-")&&!/^\s/.test(raw))break;if(inSec){const m=l.match(/^-\s+(?!\[[ xX]\]\s)(.+)/);if(m)arr.push(m[1])}}return arr}
function render(note,data){current=note;const f=parseFlight(note);const n=daysUntil(note,f.date);const stored=data&&data.values&&data.values.packReminderDue;const app=document.getElementById("app");const todo=note.checklists||[];const ideas=bulletsUnder(note,"ideas");const fs=facts(note);app.innerHTML=`<section class="hero"><div class="label">Weekend trip</div><h1>${esc(note.title)}</h1><div class="muted">${f.line?esc(f.line):"Add a flights line to the note to calculate reminders."}</div><div class="summary"><div class="pill"><span class="label">Departure</span><span class="value">${f.dateText?esc(f.dateText+" at "+f.time):"Not found"}</span></div><div class="pill"><span class="label">Route</span><span class="value">${esc(f.route||"Not found")}</span></div><div class="pill"><span class="label">Countdown</span><span class="value">${n==null?"—":esc(n===0?"Today":n+" days")}</span></div></div></section><section class="grid"><div class="card span2"><div class="cardHead"><h2>Pack reminder</h2></div><div class="body"><div class="big">${f.dueText?esc(f.dueText):"—"}</div><div class="detail muted">Sets a phone reminder for the evening before the outbound flight.</div><div class="buttonRow"><button id="remind" ${(!f.dueISO||busy)?"disabled":""}>${busy?"Setting…":"Remind me to pack"}</button></div><div id="status" class="status ${err?"err":""}" role="status">${esc(msg|| (stored===f.dueISO?"Reminder set for this time." : ""))}</div></div></div><div class="card"><div class="cardHead"><h2>Trip details</h2></div><div class="body">${fs.length?fs.map(x=>`<div class="fact"><div class="label">${esc(x.label)}</div><div>${esc(x.value)}</div></div>`).join(""):'<div class="empty">Add hotel or budget lines to the note.</div>'}</div></div><div class="card"><div class="cardHead"><h2>To do before</h2></div><div class="list">${todo.length?todo.map(i=>`<button class="item secondary" data-line="${i.line}" aria-pressed="${i.checked}"><span class="check ${i.checked?"done":""}" aria-hidden="true">${i.checked?"✓":""}</span><span class="grow ${i.checked?"doneText":""}">${esc(i.text)}</span></button>`).join(""):'<div class="empty">No checklist yet.</div>'}</div></div><div class="card wide"><div class="cardHead"><h2>Ideas</h2></div><div class="list">${ideas.length?ideas.map(x=>`<div class="item"><div class="grow">${esc(x)}</div></div>`).join(""):'<div class="empty">No ideas listed yet.</div>'}</div></div></section>`;const rb=document.getElementById("remind");if(rb)rb.onclick=setReminder;document.querySelectorAll("button[data-line]").forEach(b=>{b.onclick=async()=>{const r=await amber.update({op:"toggle_checklist",line:+b.dataset.line});if(!r.ok){msg=r.error;err=true;render(amber.note,amber.data)}}})}
async function setReminder(){if(!current)return;const f=parseFlight(current);busy=true;msg="";err=false;render(current,amber.data);try{const r=await amber.device.reminders.create({title:`Pack for ${current.title}`,due:f.dueISO});if(r&&r.ok){msg=`Reminder set for ${f.dueText}.`;err=false;if(amber.store&&amber.store.set)await amber.store.set("packReminderDue",f.dueISO)}else{msg=(r&&r.error)||"Could not set the reminder.";err=true}}catch(e){msg=e&&e.message?e.message:"Could not set the reminder.";err=true}busy=false;render(amber.note||current,amber.data)}
amber.onChange(render);
</script>
</body>
</html>
