<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 96px}h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:4px 0 10px}h2{font-size:18px;line-height:1.25;margin:0}.summary{margin:0 0 18px;color:var(--amber-text-secondary)}.grid{display:grid;gap:16px}@media (min-width:900px){.grid{grid-template-columns:1fr 1fr;align-items:start}.add-card{grid-column:1/-1}}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:16px;border-bottom:1px solid var(--amber-separator)}.count{font-variant-numeric:tabular-nums;color:var(--amber-text-secondary);font-size:14px}.items{display:grid}.item{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;min-height:68px;padding:12px 16px;border-top:1px solid var(--amber-separator)}.item:first-child{border-top:0}.name{min-width:0;overflow-wrap:anywhere;padding-top:10px}.done{text-decoration:line-through;color:var(--amber-text-secondary)}button{font:inherit;font-weight:700;min-height:44px;border:1px solid var(--amber-separator);border-radius:var(--amber-radius-small);padding:0 18px;background:var(--amber-fill);color:var(--amber-text)}.check{width:44px;height:44px;min-height:44px;padding:0;display:grid;place-items:center;font-size:24px;line-height:1;border:2px solid var(--amber-text-secondary);border-radius:12px;background:var(--amber-fill);color:var(--amber-text)}.check[aria-pressed=true]{background:var(--amber-accent-soft);border-color:var(--amber-accent);color:var(--amber-text)}.check .mark{visibility:hidden}.check[aria-pressed=true] .mark{visibility:visible}input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--amber-accent);outline-offset:3px}form{display:grid;gap:12px;padding:16px}@media (min-width:600px){form{grid-template-columns:1fr 1fr auto;align-items:end}}.field{display:grid;gap:6px}.field span{font-size:14px;color:var(--amber-text-secondary)}input[type=text],select{font:inherit;color:var(--amber-text);background:var(--amber-fill);border:1px solid var(--amber-separator);border-radius:var(--amber-radius-small);min-height:48px;padding:12px;width:100%}select{appearance:none;-webkit-appearance:none}button[disabled],input[disabled],select[disabled]{opacity:.65}.empty{padding:24px 16px;color:var(--amber-text-secondary)}.status{min-height:22px;padding:0 16px 16px;color:var(--amber-text-secondary)}.status.error{color:var(--amber-danger)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<main id="app"></main>
<script>
const esc=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
let message="";let isError=false;let busy=false;
function parse(note){const lines=String(note.markdown||"").split(/\r?\n/);const sections=[];let current={heading:"Other",items:[]};const byLine=new Map((note.checklists||[]).map(i=>[i.line,i]));lines.forEach((line,i)=>{const n=i+1;const h=line.match(/^(#{1,6})\s+(.+?)\s*$/);if(h){if(current.heading!=="Other"||current.items.length)sections.push(current);current={heading:h[2],items:[]};return}if(byLine.has(n))current.items.push(byLine.get(n));});if(current.heading!=="Other"||current.items.length)sections.push(current);return sections;}
function headings(note){return String(note.markdown||"").split(/\r?\n/).map(l=>l.match(/^(#{1,6})\s+(.+?)\s*$/)).filter(Boolean).map(m=>({level:m[1].length,text:m[2]}));}
function sectionTextWithAdded(note,heading,item){const lines=String(note.markdown||"").split(/\r?\n/);let start=-1,level=0;for(let i=0;i<lines.length;i++){const h=lines[i].match(/^(#{1,6})\s+(.+?)\s*$/);if(h&&h[2]===heading){start=i;level=h[1].length;break}}if(start<0)return null;let end=lines.length;for(let i=start+1;i<lines.length;i++){const h=lines[i].match(/^(#{1,6})\s+(.+?)\s*$/);if(h&&h[1].length<=level){end=i;break}}const body=lines.slice(start+1,end);while(body.length&&body[body.length-1].trim()==="")body.pop();body.push("- [ ] "+item);return body.join("\n");}
function clean(s){return String(s||"").replace(/\s+/g," ").trim();}
function safeId(s){return String(s).replace(/[^a-z0-9_-]+/gi,"-");}
function render(note){const app=document.getElementById("app");const sections=parse(note);const all=note.checklists||[];const done=all.filter(i=>i.checked).length;const total=all.length;const heads=headings(note);const headOptions=heads.map(h=>`<option value="${esc(h.text)}">${esc(h.text)}</option>`).join("");app.innerHTML=`<h1>${esc(note.title||"Packing list")}</h1><p class="summary" id="summary">${done} of ${total} packed.</p><div class="grid">${sections.length?sections.map(sec=>{const d=sec.items.filter(i=>i.checked).length;const hid="h-"+safeId(sec.heading);return `<section class="card" aria-labelledby="${hid}"><div class="card-head"><h2 id="${hid}">${esc(sec.heading)}</h2><span class="count">${d} of ${sec.items.length}</span></div>${sec.items.length?`<div class="items">${sec.items.map(it=>`<div class="item"><button type="button" class="check" data-line="${it.line}" aria-pressed="${it.checked?"true":"false"}" aria-label="${esc(it.checked?"Mark "+it.text+" as not packed":"Mark "+it.text+" as packed")}" ${busy?"disabled":""}><span class="mark" aria-hidden="true">✓</span></button><span class="name ${it.checked?"done":""}" id="item-${it.line}">${esc(it.text)}</span></div>`).join("")}</div>`:`<p class="empty">No items in this section yet.</p>`}</section>`}).join(""):`<section class="card"><p class="empty">No packing items yet. Add headings and checklist items in Text, or add an item below if the note has a heading.</p></section>`}<section class="card add-card" aria-labelledby="add-title"><div class="card-head"><h2 id="add-title">Add a packing item</h2></div><form id="add-form"><label class="field"><span>Section</span><select name="heading" ${heads.length?"":"disabled"} required>${headOptions}</select></label><label class="field"><span>Item name</span><input name="item" type="text" autocomplete="off" required aria-describedby="hint" placeholder="e.g. Sunglasses" ${heads.length?"":"disabled"}></label><button type="submit" ${heads.length?"":"disabled"}>Add item</button></form><p id="hint" class="sr-only">Choose a section and enter the item to add it as an unchecked checklist item in the note.</p><p id="status" class="status ${isError?"error":""}" role="${isError?"alert":"status"}" aria-live="polite">${esc(message||(!heads.length?"Add a heading in Text before adding items here.":""))}</p></section></div>`;app.querySelectorAll("button.check[data-line]").forEach(btn=>{btn.addEventListener("click",async()=>{message="";isError=false;busy=true;const was=btn.getAttribute("aria-pressed")==="true";const line=Number(btn.dataset.line);const r=await amber.update({op:"toggle_checklist",line});busy=false;if(r.ok){message=was?"Marked as not packed.":"Marked as packed.";isError=false}else{message=r.error||"Could not update the item.";isError=true;render(amber.note)}})});const form=document.getElementById("add-form");if(form)form.addEventListener("submit",async(e)=>{e.preventDefault();if(busy)return;const data=new FormData(form);const heading=String(data.get("heading")||"");const item=clean(data.get("item"));if(!heading||!item){message="Choose a section and enter an item.";isError=true;render(note);return}const text=sectionTextWithAdded(note,heading,item);if(text===null){message="Could not find that section in the note.";isError=true;render(note);return}busy=true;message="Adding item…";isError=false;render(note);const r=await amber.update({op:"set_text",heading,text});busy=false;if(r.ok){message=`Added ${item}.`;isError=false}else{message=r.error||"Could not add the item.";isError=true;render(amber.note)}})}
amber.onChange((note)=>{busy=false;render(note)});
</script>
</body>
</html>
