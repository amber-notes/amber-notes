<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 96px}h1{font-size:30px;letter-spacing:-.03em;margin:2px 0 4px}h2{font-size:17px;margin:0 0 12px}.sub{color:var(--amber-text-secondary);margin:0 0 18px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:14px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.pad{padding:16px}.stat .label,.muted{color:var(--amber-text-secondary);font-size:13px}.stat .value{font-size:28px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px}.stat .hint{font-size:12px;color:var(--amber-text-secondary);margin-top:4px}.cols{display:grid;gap:14px}.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--amber-separator);min-height:52px}.row:first-child{border-top:0}.grow{flex:1;min-width:0}.num{font-variant-numeric:tabular-nums;font-weight:650}.pill{display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:4px 9px;border-radius:999px;background:var(--amber-accent-soft);color:var(--amber-accent-text);font-size:12px;font-weight:650}.barrow{display:grid;grid-template-columns:76px 1fr 54px;gap:10px;align-items:center;padding:8px 0}.track{height:12px;border-radius:999px;background:var(--amber-fill);overflow:hidden}.bar{height:100%;border-radius:999px;background:var(--amber-accent);min-width:2px}.tablewrap{overflow-x:auto}.smalltable{width:100%;border-collapse:collapse}.smalltable th,.smalltable td{text-align:left;padding:10px 12px;border-top:1px solid var(--amber-separator);font-size:14px}.smalltable th{color:var(--amber-text-secondary);font-weight:600}.smalltable td:last-child,.smalltable th:last-child{text-align:right}form{display:grid;grid-template-columns:1fr;gap:10px}label{display:flex;flex-direction:column;gap:5px;color:var(--amber-text-secondary);font-size:13px}input{font:inherit;color:var(--amber-text);background:var(--amber-fill);border:0;border-radius:var(--amber-radius-small);padding:10px 12px;min-height:44px;width:100%}button{font:inherit;font-weight:700;min-height:44px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-accent);color:var(--amber-on-accent);padding:0 16px}.secondary{background:var(--amber-fill);color:var(--amber-text)}.err{color:var(--amber-danger);min-height:18px;font-size:13px}.empty{padding:28px 16px;text-align:center;color:var(--amber-text-secondary)}.goal{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-top:12px}.progress{height:14px;background:var(--amber-fill);border-radius:999px;overflow:hidden;margin-top:10px}.progress div{height:100%;background:var(--amber-accent);border-radius:999px}.stack{display:grid;gap:14px}@media (min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}form{grid-template-columns:repeat(4,minmax(0,1fr)) auto;align-items:end}.err{grid-column:1/-1}}@media (min-width:900px){.cols{grid-template-columns:1.1fr .9fr}.span{grid-column:1/-1}.stat .value{font-size:32px}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return Number.isFinite(n)?n:0};
const fmt=n=>Number.isFinite(n)?(Math.round(n*10)/10).toLocaleString(undefined,{maximumFractionDigits:1}):"–";
const minPerKm=(mins,km)=>km>0?mins/km:NaN;
const pace=v=>{if(!Number.isFinite(v))return"–";const m=Math.floor(v),s=Math.round((v-m)*60);return m+":"+String(s).padStart(2,"0")+" /km"};
const dt=s=>{const p=String(s||"").split("-").map(Number);return p.length===3?new Date(Date.UTC(p[0],p[1]-1,p[2])):null};
const iso=d=>d.toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d);x.setUTCDate(x.getUTCDate()+n);return x};
const weekStart=s=>{const d=dt(s);if(!d)return"";const day=d.getUTCDay()||7;return iso(addDays(d,1-day))};
function findCols(t){const names=t.columns.map(c=>c.name);const f=re=>names.findIndex(n=>re.test(n));return{date:f(/^(activity\s*)?date$/i),km:f(/^(distance(\s*\(km\))?|km|kilometres|kilometers)$/i),min:f(/^(moving\s*time\s*\(min\)|moving\s*time|time|minutes|min)$/i),hr:f(/^(avg\s*hr|average\s*hr|heart\s*rate)$/i)}}
function bestTable(note){return note.tables.find(t=>{const c=findCols(t);return c.date>=0&&c.km>=0})}
function runs(t,c){return t.rows.map((r,i)=>({i,date:String(r[c.date]||""),km:num(r[c.km]),min:c.min>=0?num(r[c.min]):0,hr:c.hr>=0?num(r[c.hr]):0})).filter(r=>r.date&&r.km>0).sort((a,b)=>a.date.localeCompare(b.date))}
let msg="";
function render(note,data){const app=document.getElementById("app"),t=bestTable(note);if(!t){app.innerHTML=`<h1>${esc(note.title)}</h1><p class="sub">Running dashboard</p><div class="card empty">Add a table with Activity Date and Distance (km) columns to see your runs here.</div>`;return}const c=findCols(t),rs=runs(t,c),today=note.today,month=today.slice(0,7),goal=Number(data?.values?.weeklyKm)||30;const totalKm=rs.reduce((a,r)=>a+r.km,0),totalMin=rs.reduce((a,r)=>a+r.min,0),avgPace=minPerKm(totalMin,totalKm),hrs=rs.filter(r=>r.hr>0),avgHr=hrs.length?hrs.reduce((a,r)=>a+r.hr,0)/hrs.length:NaN;const currentWeek=weekStart(today),weekKm=rs.filter(r=>weekStart(r.date)===currentWeek).reduce((a,r)=>a+r.km,0);const monthRuns=rs.filter(r=>r.date.startsWith(month));const monthKm=monthRuns.reduce((a,r)=>a+r.km,0);const last=rs[rs.length-1];let weeks=[];let start=dt(currentWeek);for(let i=7;i>=0;i--){const ws=iso(addDays(start,-7*i));weeks.push({ws,km:rs.filter(r=>weekStart(r.date)===ws).reduce((a,r)=>a+r.km,0)})}const maxW=Math.max(goal,...weeks.map(w=>w.km),1);const recent=rs.slice(-10).reverse();const progress=Math.min(100,weekKm/goal*100);app.innerHTML=`<h1>${esc(note.title)}</h1><p class="sub">${rs.length?`${rs.length} runs from ${esc(rs[0].date)} to ${esc(last.date)}`:"No runs yet."}</p><section class="grid stats"><div class="card pad stat"><div class="label">Total distance</div><div class="value">${fmt(totalKm)} km</div><div class="hint">All logged runs</div></div><div class="card pad stat"><div class="label">This week</div><div class="value">${fmt(weekKm)} km</div><div class="hint">Goal ${fmt(goal)} km</div></div><div class="card pad stat"><div class="label">Average pace</div><div class="value">${pace(avgPace)}</div><div class="hint">Moving time ÷ distance</div></div><div class="card pad stat"><div class="label">Average HR</div><div class="value">${Number.isFinite(avgHr)?Math.round(avgHr):"–"}</div><div class="hint">bpm</div></div></section><section class="cols"><div class="stack"><div class="card pad"><h2>Weekly distance</h2>${weeks.map(w=>`<div class="barrow"><div class="muted">${esc(w.ws.slice(5))}</div><div class="track" aria-label="${esc(w.ws)} ${fmt(w.km)} km"><div class="bar" style="width:${Math.max(0,Math.min(100,w.km/maxW*100))}%"></div></div><div class="num">${fmt(w.km)}</div></div>`).join("")}<div class="progress" aria-label="Weekly goal progress"><div style="width:${progress}%"></div></div><div class="muted" style="margin-top:8px">${fmt(weekKm)} of ${fmt(goal)} km this week</div><form class="goal" id="goal"><label>Weekly goal (km)<input name="goal" type="number" min="0" step="0.1" value="${esc(goal)}"></label><button class="secondary">Save</button></form></div><div class="card pad"><h2>Log a run</h2><form id="add"><label>Date<input name="date" type="date" required value="${esc(today)}"></label><label>Distance (km)<input name="km" inputmode="decimal" type="number" min="0" step="0.01" required></label><label>Moving time (min)<input name="min" inputmode="decimal" type="number" min="0" step="1"></label><label>Avg HR<input name="hr" inputmode="numeric" type="number" min="0" step="1"></label><button>Add run</button><div class="err" role="alert">${esc(msg)}</div></form></div></div><div class="stack"><div class="card pad"><h2>This month</h2><div class="row" style="padding-left:0;padding-right:0"><div class="grow"><div class="num">${fmt(monthKm)} km</div><div class="muted">${esc(month)} total</div></div><span class="pill">${monthRuns.length} runs</span></div><div class="row" style="padding-left:0;padding-right:0"><div class="grow"><div class="num">${monthRuns.length?fmt(monthKm/monthRuns.length):"–"} km</div><div class="muted">Average run</div></div><span class="pill">${last?esc(last.date):"–"}</span></div></div><div class="card"><div class="pad"><h2>Recent runs</h2></div>${recent.length?recent.map(r=>`<div class="row"><div class="grow"><div class="num">${esc(r.date)}</div><div class="muted">${r.min?pace(minPerKm(r.min,r.km)):"No time"}${r.hr?` · ${Math.round(r.hr)} bpm`:""}</div></div><div class="num">${fmt(r.km)} km</div></div>`).join(""):`<div class="empty">No runs yet.</div>`}</div></div><div class="card span tablewrap"><table class="smalltable"><thead><tr><th>Date</th><th>Distance</th><th>Time</th><th>Avg HR</th><th>Pace</th></tr></thead><tbody>${recent.map(r=>`<tr><td>${esc(r.date)}</td><td>${fmt(r.km)} km</td><td>${r.min?esc(r.min)+" min":"–"}</td><td>${r.hr?Math.round(r.hr):"–"}</td><td>${r.min?pace(minPerKm(r.min,r.km)):"–"}</td></tr>`).join("")}</tbody></table></div></section>`;document.getElementById("goal").onsubmit=async e=>{e.preventDefault();const v=Number(new FormData(e.target).get("goal"));if(Number.isFinite(v)&&v>=0){await amber.setData({values:{weeklyKm:v}})}};document.getElementById("add").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const vals={};vals[t.columns[c.date].name]=String(fd.get("date")||"");vals[t.columns[c.km].name]=String(fd.get("km")||"");if(c.min>=0)vals[t.columns[c.min].name]=String(fd.get("min")||"");if(c.hr>=0)vals[t.columns[c.hr].name]=String(fd.get("hr")||"");const r=await amber.update({op:"append_row",table:t.index,values:vals});msg=r.ok?"":r.error;if(r.ok)e.target.reset();if(!r.ok)render(amber.note,amber.data)}}
amber.onChange(render);
</script>
</body>
</html>
