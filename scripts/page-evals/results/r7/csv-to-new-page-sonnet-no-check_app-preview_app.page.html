<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 96px}
h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 16px}
h2{font-size:17px;margin:0;padding:14px 16px 4px}
.card{background:var(--amber-surface);border-radius:var(--amber-radius);border:1px solid var(--amber-separator);margin-bottom:16px;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:14px 16px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;font-family:var(--amber-font-rounded)}
.muted{color:var(--amber-text-secondary);font-size:14px}
.cols{display:block}
@media(min-width:900px){.stats{grid-template-columns:repeat(4,1fr)}.cols{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}}
.chart{display:flex;align-items:flex-end;gap:6px;height:160px;padding:12px 16px 0}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bar i{display:block;width:100%;background:var(--amber-accent);border-radius:4px 4px 0 0;min-height:2px}
.bar span{font-size:11px;color:var(--amber-text-secondary);font-variant-numeric:tabular-nums}
.lbl{display:flex;gap:6px;padding:4px 16px 12px}
.lbl span{flex:1;text-align:center;font-size:11px;color:var(--amber-text-secondary);min-width:0}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--amber-separator);min-height:48px}
.row .g{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums;font-weight:600}
form{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 16px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--amber-text-secondary);flex:1 1 100px}
input{font:inherit;color:var(--amber-text);background:var(--amber-fill);border:0;border-radius:var(--amber-radius-small);padding:10px 12px;min-height:44px;width:100%}
button{font:inherit;font-weight:600;min-height:44px;padding:0 16px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-accent);color:var(--amber-on-accent);align-self:flex-end}
.err{color:var(--amber-danger);padding:0 16px 12px;min-height:1em}
.empty{padding:28px 16px;text-align:center;color:var(--amber-text-secondary)}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const num=s=>{const n=parseFloat(String(s).replace(/\s/g,"").replace(",","."));return isNaN(n)?null:n};
const col=(t,re)=>t.columns.findIndex(c=>re.test(c.name));
const D=s=>new Date(s+"T00:00:00Z");
const iso=d=>d.toISOString().slice(0,10);
const monday=s=>{const d=D(s);d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return iso(d)};
const fmtPace=m=>{const mm=Math.floor(m),ss=Math.round((m-mm)*60);return mm+":"+String(ss===60?0:ss).padStart(2,"0")};
const short=s=>D(s).toLocaleDateString("en",{month:"short",day:"numeric",timeZone:"UTC"});
let error="";
function render(note){
  const app=document.getElementById("app");
  const t=note.tables.find(t=>col(t,/date/i)>=0&&col(t,/dist/i)>=0);
  if(!t){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Date and Distance columns to the note.</div>`;return}
  const ci=col(t,/date/i),di=col(t,/dist/i),ti=col(t,/time/i),hi=col(t,/hr|heart/i);
  const runs=t.rows.map(r=>({date:r[ci],km:num(r[di]),min:ti>=0?num(r[ti]):null,hr:hi>=0?num(r[hi]):null})).filter(r=>r.date&&r.km!=null).sort((a,b)=>a.date<b.date?1:-1);
  if(!runs.length){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">No runs yet.</div>`;return}
  const km=runs.reduce((a,r)=>a+r.km,0);
  const timed=runs.filter(r=>r.min!=null);
  const tk=timed.reduce((a,r)=>a+r.km,0),tm=timed.reduce((a,r)=>a+r.min,0);
  const hrs=runs.filter(r=>r.hr!=null);
  const hr=hrs.length?hrs.reduce((a,r)=>a+r.hr,0)/hrs.length:null;
  const longest=Math.max(...runs.map(r=>r.km));
  // weekly, last 8 weeks ending this week
  const thisMon=monday(note.today);const weeks=[];
  for(let i=7;i>=0;i--){const d=D(thisMon);d.setUTCDate(d.getUTCDate()-7*i);weeks.push({s:iso(d),km:0})}
  runs.forEach(r=>{const w=weeks.find(w=>w.s===monday(r.date));if(w)w.km+=r.km});
  const mx=Math.max(1,...weeks.map(w=>w.km));
  const thisWk=weeks[7].km;
  const chart=`<div class="chart" role="img" aria-label="Weekly kilometres, last 8 weeks">${weeks.map(w=>`<div class="bar"><span>${w.km?w.km.toFixed(1):""}</span><i style="height:${Math.round(w.km/mx*120)}px"></i></div>`).join("")}</div><div class="lbl">${weeks.map(w=>`<span>${esc(short(w.s))}</span>`).join("")}</div>`;
  const list=runs.slice(0,12).map(r=>`<div class="row"><div class="g"><div class="num">${r.km.toFixed(1)} km</div><div class="muted">${esc(short(r.date))}${r.min!=null?" · "+r.min+" min · "+fmtPace(r.min/r.km)+" /km":""}</div></div>${r.hr!=null?`<div class="muted num">${r.hr} bpm</div>`:""}</div>`).join("");
  app.innerHTML=`<h1>${esc(note.title)}</h1>
  <div class="stats">
   <div class="stat"><b>${km.toFixed(1)}</b><span class="muted">km total · ${runs.length} runs</span></div>
   <div class="stat"><b>${thisWk.toFixed(1)}</b><span class="muted">km this week</span></div>
   <div class="stat"><b>${tm?fmtPace(tm/tk):"–"}</b><span class="muted">avg pace /km</span></div>
   <div class="stat"><b>${hr?Math.round(hr):"–"}</b><span class="muted">avg HR · longest ${longest.toFixed(1)} km</span></div>
  </div>
  <div class="cols">
   <div class="card"><h2>Weekly distance (km)</h2>${chart}</div>
   <div class="card"><h2>Latest runs</h2>${list}</div>
  </div>
  <div class="card"><h2>Log a run</h2><form id="f">
   <label>Date<input type="date" name="d" value="${esc(note.today)}" required></label>
   <label>Distance (km)<input name="k" inputmode="decimal" required></label>
   <label>Time (min)<input name="m" inputmode="decimal"></label>
   <label>Avg HR<input name="h" inputmode="numeric"></label>
   <button>Add</button></form><div class="err" role="alert">${esc(error)}</div></div>`;
  document.getElementById("f").onsubmit=async e=>{
    e.preventDefault();const f=new FormData(e.target);const v={};
    v[t.columns[ci].name]=f.get("d");v[t.columns[di].name]=f.get("k").trim();
    if(ti>=0)v[t.columns[ti].name]=f.get("m").trim();
    if(hi>=0)v[t.columns[hi].name]=f.get("h").trim();
    const r=await amber.update({op:"append_row",table:t.index,values:v});
    error=r.ok?"":r.error;if(!r.ok)render(amber.note);
  };
}
amber.onChange(render);
</script>
</body>
</html>
