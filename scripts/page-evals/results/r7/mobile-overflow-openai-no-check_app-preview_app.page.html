<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 80px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:4px 0 16px;color:var(--amber-text)}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden;margin:0 0 14px}
.empty{padding:28px 16px;text-align:center;color:var(--amber-text-secondary)}
.day{padding:16px;border-bottom:1px solid var(--amber-separator)}
.day:last-child{border-bottom:0}
.day h2{font-size:18px;line-height:1.2;margin:0 0 12px;color:var(--amber-text)}
.meals{display:grid;grid-template-columns:1fr;gap:10px}
.meal{min-width:0;background:var(--amber-fill);border-radius:var(--amber-radius-small);padding:10px 12px}
.label{display:block;font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--amber-text-secondary);margin-bottom:3px}
.value{overflow-wrap:anywhere;color:var(--amber-text)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--amber-accent-soft);color:var(--amber-accent-text);font-size:13px;font-weight:600}
.tableWrap{display:none;overflow-x:auto;border-radius:var(--amber-radius);border:1px solid var(--amber-separator);background:var(--amber-surface)}
table{width:100%;border-collapse:collapse;table-layout:auto}th,td{padding:10px 12px;border-bottom:1px solid var(--amber-separator);text-align:left;vertical-align:top;white-space:normal;overflow-wrap:anywhere;color:var(--amber-text)}th{font-size:13px;color:var(--amber-text-secondary);font-weight:600}tr:last-child td{border-bottom:0}
@media (min-width:600px){.meals{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:900px){.cards{display:none}.tableWrap{display:block}h1{font-size:32px}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const col=(t,name)=>t.columns.findIndex(c=>c.name.toLowerCase()===name.toLowerCase());
function render(note){
  const app=document.getElementById("app");
  const table=note.tables&&note.tables[0];
  if(!table){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">Add a meal plan table to the note to see it here.</div>`;return;}
  const dayCol=col(table,"Day");
  const columns=table.columns.map(c=>c.name);
  const visibleMealCols=columns.map((name,i)=>({name,i})).filter(c=>c.i!==dayCol);
  const cards=table.rows.length?table.rows.map(row=>{
    const day=dayCol>=0?row[dayCol]:"Day";
    return `<section class="day"><h2>${esc(day)}</h2><div class="meals">${visibleMealCols.map(c=>{
      const val=row[c.i]||"";
      const isShop=/^shop$/i.test(c.name)&&/^(yes|true|✓|x)$/i.test(String(val).trim());
      return `<div class="meal"><span class="label">${esc(c.name)}</span><div class="value">${isShop?`<span class="badge">${esc(val)}</span>`:esc(val||"—")}</div></div>`;
    }).join("")}</div></section>`;
  }).join(""):`<div class="empty">No meals yet.</div>`;
  const tableHtml=`<div class="tableWrap" aria-label="Meal plan table"><table><thead><tr>${columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${table.rows.map(row=>`<tr>${columns.map((_,i)=>`<td>${esc(row[i]||"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  app.innerHTML=`<h1>${esc(note.title)}</h1><div class="cards card">${cards}</div>${tableHtml}`;
}
amber.onChange(render);
</script>
</body>
</html>
