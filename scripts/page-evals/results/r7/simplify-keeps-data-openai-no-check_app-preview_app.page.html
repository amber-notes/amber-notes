<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household expenses</title>
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 72px; }
  h1 { font-size: 28px; line-height: 1.15; letter-spacing: -.02em; margin: 4px 0 18px; }
  .summary { color: var(--amber-text-secondary); margin: -8px 0 18px; font-size: 15px; }
  .grid { display: grid; gap: 14px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 18px; min-width: 0; }
  .name { color: var(--amber-text-secondary); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
  .amount { font-size: 36px; line-height: 1; font-weight: 750; letter-spacing: -.03em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .count { color: var(--amber-text-secondary); font-size: 14px; margin-top: 10px; }
  .empty { color: var(--amber-text-secondary); padding: 22px 18px; text-align: center; }
  .bar { height: 8px; border-radius: 999px; overflow: hidden; background: var(--amber-fill); margin-top: 16px; }
  .fill { height: 100%; background: var(--amber-accent); border-radius: 999px; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  const money = (n) => n.toLocaleString("sv-SE", { maximumFractionDigits: 0 }) + " kr";
  const parseAmt = (v) => parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", ".")) || 0;

  function render(note) {
    const app = document.getElementById("app");
    const table = note.tables.find((t) => t.columns.some((c) => /^(category)$/i.test(c.name)) && t.columns.some((c) => /^(amt|amount|cost|price|kr|sum)$/i.test(c.name)));
    if (!table) {
      app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Category and Amount columns to show Food and Housing.</div>`;
      return;
    }
    const col = (re) => table.columns.findIndex((c) => re.test(c.name));
    const catCol = col(/^(category)$/i);
    const amtCol = col(/^(amt|amount|cost|price|kr|sum)$/i);
    const wanted = ["Food", "Housing"];
    const stats = wanted.map((name) => {
      const rows = table.rows.filter((r) => String(r[catCol] ?? "").trim().toLowerCase() === name.toLowerCase());
      return { name, count: rows.length, total: rows.reduce((sum, r) => sum + parseAmt(r[amtCol]), 0) };
    });
    const grand = stats.reduce((sum, s) => sum + s.total, 0);
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="summary">Showing Food and Housing only.</div>
      <div class="grid">
        ${stats.map((s) => `
          <section class="card" aria-label="${esc(s.name)} expenses">
            <div class="name">${esc(s.name)}</div>
            <div class="amount">${money(s.total)}</div>
            <div class="count">${s.count} ${s.count === 1 ? "entry" : "entries"}</div>
            <div class="bar" aria-hidden="true"><div class="fill" style="width:${grand ? Math.max(3, Math.round((s.total / grand) * 100)) : 0}%"></div></div>
          </section>`).join("")}
      </div>`;
  }
  amber.onChange(render);
</script>
</body>
</html>
