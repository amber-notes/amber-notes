<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household expenses</title>
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 12px var(--amber-gutter) 80px; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 8px; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 0 4px 8px; }
  .total { font-size: 48px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; font-family: var(--amber-font-rounded); line-height: 1.1; }
  .sub { color: var(--amber-text-secondary); font-size: 15px; margin: 4px 0 20px; }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); margin-bottom: 20px; overflow: hidden; }
  .months { display: flex; align-items: flex-end; gap: 10px; padding: 16px; overflow-x: auto; }
  .m { flex: 1 0 64px; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; color: var(--amber-text); border: 0; padding: 4px 2px; min-height: 44px; font: inherit; border-radius: var(--amber-radius-small); }
  .m .col { width: 100%; height: 120px; display: flex; align-items: flex-end; }
  .m .fill { width: 100%; background: var(--amber-fill); border-radius: 6px 6px 2px 2px; min-height: 3px; }
  .m[aria-pressed="true"] .fill { background: var(--amber-accent); }
  .m[aria-pressed="true"] { background: var(--amber-accent-soft); font-weight: 700; }
  .m .v { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--amber-text-secondary); }
  .m .n { font-size: 13px; }
  .grp-h { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px; background: var(--amber-accent-soft); font-weight: 700; }
  .grp-h .grow { flex: 1; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--amber-separator); min-height: 48px; }
  .grp-h + .row { border-top: 0; }
  .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .muted { color: var(--amber-text-secondary); font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
  form { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--amber-text-secondary); flex: 1 1 120px; }
  input { font: inherit; color: var(--amber-text); background: var(--amber-fill); border: 0; border-radius: var(--amber-radius-small); padding: 10px 12px; min-height: 44px; width: 100%; }
  button.add { font: inherit; font-weight: 600; min-height: 44px; padding: 0 20px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-accent); color: var(--amber-on-accent); align-self: flex-end; }
  .err { color: var(--amber-danger); padding: 0 16px 12px; }
  .m:focus-visible, button.add:focus-visible { outline: 2px solid var(--amber-accent); outline-offset: 2px; }
  @media (min-width: 900px) {
    .total { font-size: 72px; }
    .layout { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 28px; align-items: start; }
  }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const kr = (n) => Math.round(n).toLocaleString("sv-SE") + " kr";
  const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const monthName = (k) => MN[+k.slice(5, 7) - 1] + " " + k.slice(0, 4);
  let selected = null, error = "";

  function render(note) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => t.columns.some((c) => /^(amt|amount|cost|kr|price|sum)$/i.test(c.name)));
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Date, Item, Category and Amt columns.</div>`; return; }
    const ci = (re) => t.columns.findIndex((c) => re.test(c.name));
    const a = ci(/^(amt|amount|cost|kr|price|sum)$/i), cat = ci(/categ/i), item = ci(/item|what|description/i), date = ci(/^date$/i);
    const rows = t.rows.map((r) => ({
      month: date >= 0 && /^\d{4}-\d{2}/.test(r[date]) ? r[date].slice(0, 7) : "undated",
      date: date >= 0 ? r[date] : "", item: item >= 0 ? r[item] : "", cat: (cat >= 0 && r[cat]) || "Other",
      n: parseFloat(String(r[a]).replace(/\s/g, "").replace(",", ".")) || 0
    }));
    const byMonth = new Map();
    for (const x of rows) byMonth.set(x.month, (byMonth.get(x.month) || 0) + x.n);
    const months = [...byMonth.keys()].sort();
    if (!selected || !byMonth.has(selected)) selected = months.includes(note.today.slice(0, 7)) ? note.today.slice(0, 7) : months[months.length - 1];
    const max = Math.max(1, ...byMonth.values());
    const cur = rows.filter((x) => x.month === selected);
    const total = cur.reduce((s, x) => s + x.n, 0);
    const groups = new Map();
    for (const x of cur) { if (!groups.has(x.cat)) groups.set(x.cat, []); groups.get(x.cat).push(x); }
    const gl = [...groups].map(([k, l]) => [k, l, l.reduce((s, x) => s + x.n, 0)]).sort((p, q) => q[2] - p[2]);
    const cats = [...new Set(rows.map((x) => x.cat))];

    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="layout"><section>
        <div class="label">${selected ? esc(monthName(selected)) : ""}</div>
        <div class="total">${kr(total)}</div>
        <div class="sub">${cur.length} ${cur.length === 1 ? "entry" : "entries"}</div>
        <div class="label">By month</div>
        <div class="card"><div class="months">${months.length ? months.map((k) => `<button class="m" data-m="${k}" aria-pressed="${k === selected}" aria-label="${esc(monthName(k))}: ${kr(byMonth.get(k))}"><span class="v">${kr(byMonth.get(k))}</span><span class="col"><span class="fill" style="height:${(100 * byMonth.get(k) / max).toFixed(1)}%"></span></span><span class="n">${esc(k === "undated" ? k : MN[+k.slice(5)-1])}</span></button>`).join("") : '<div class="empty" style="width:100%">No entries yet.</div>'}</div></div>
        <div class="label">Add an expense</div>
        <div class="card"><form id="add">
          <label>What<input name="item" required></label>
          <label>Category<input name="cat" list="cats" required></label>
          <label>Amount (kr)<input name="amount" inputmode="decimal" required></label>
          <button class="add">Add</button>
          <datalist id="cats">${cats.map((c) => `<option value="${esc(c)}">`).join("")}</datalist>
        </form>${error ? `<div class="err" role="alert">${esc(error)}</div>` : ""}</div>
      </section><section>
        <div class="label">By category</div>
        <div class="card">${gl.length ? gl.map(([k, l, s]) => `<div class="grp-h"><span class="grow">${esc(k)}</span><span class="muted">${Math.round(100 * s / (total || 1))}%</span><span class="num">${kr(s)}</span></div>` + l.slice().sort((p, q) => q.date.localeCompare(p.date)).map((x) => `<div class="row"><div class="grow">${esc(x.item)}<div class="muted">${esc(x.date)}</div></div><div class="num">${kr(x.n)}</div></div>`).join("")).join("") : '<div class="empty">Nothing this month.</div>'}</div>
      </section></div>`;
    app.querySelectorAll(".m").forEach((b) => b.onclick = () => { selected = b.dataset.m; render(amber.note); });
    document.getElementById("add").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const values = { [t.columns[a].name]: String(f.get("amount")).trim() };
      if (item >= 0) values[t.columns[item].name] = String(f.get("item")).trim();
      if (cat >= 0) values[t.columns[cat].name] = String(f.get("cat")).trim();
      if (date >= 0) values[t.columns[date].name] = amber.note.today;
      const r = await amber.update({ op: "append_row", table: t.index, values });
      error = r.ok ? "" : r.error;
      if (r.ok) selected = amber.note.today.slice(0, 7); else render(amber.note);
    };
  }
  amber.onChange(render);
</script>
</body>
</html>
