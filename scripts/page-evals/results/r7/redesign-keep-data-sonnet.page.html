<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household expenses</title>
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 12px var(--amber-gutter) 80px; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 6px 0 0; }
  .hero { margin: 8px 0 20px; }
  .mlabel { color: var(--amber-text-secondary); font-size: 15px; }
  .total { font-size: 52px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 0 4px 8px; }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); border: 1px solid var(--amber-separator); margin-bottom: 20px; overflow: hidden; }
  .months { display: flex; align-items: flex-end; gap: 8px; padding: 16px 12px 8px; overflow-x: auto; }
  .m { flex: 1 1 0; min-width: 56px; max-width: 120px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; color: var(--amber-text); border: 0; padding: 4px; min-height: 44px; font: inherit; border-radius: var(--amber-radius-small); }
  .m .col { height: 120px; width: 100%; display: flex; align-items: flex-end; }
  .m .fill { width: 100%; background: var(--amber-accent-soft); border: 1px solid var(--amber-accent); border-radius: 6px 6px 2px 2px; min-height: 3px; }
  .m[aria-pressed="true"] .fill { background: var(--amber-accent); }
  .m[aria-pressed="true"] { background: var(--amber-fill); }
  .m .v { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--amber-text-secondary); }
  .m .n { font-size: 13px; font-weight: 600; }
  .ghead { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; background: var(--amber-fill); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--amber-separator); min-height: 48px; }
  .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .muted { color: var(--amber-text-secondary); font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  form { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--amber-text-secondary); flex: 1 1 120px; }
  input { font: inherit; color: var(--amber-text); background: var(--amber-fill); border: 0; border-radius: var(--amber-radius-small); padding: 10px 12px; min-height: 44px; width: 100%; }
  button.add { font: inherit; font-weight: 600; min-height: 44px; padding: 0 20px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-text); color: var(--amber-bg); align-self: flex-end; }
  .err { color: var(--amber-danger); padding: 0 16px 12px; }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
  @media (min-width: 900px) {
    .total { font-size: 72px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
    .m .col { height: 160px; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const num = (s) => { const n = parseFloat(String(s ?? "").replace(/\s/g, "").replace(",", ".")); return isNaN(n) ? 0 : n; };
  const kr = (n) => Math.round(n).toLocaleString("sv-SE") + " kr";
  const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const mname = (k, long) => { const [y, m] = k.split("-"); return (long ? ["January","February","March","April","May","June","July","August","September","October","November","December"][+m - 1] + " " + y : MN[+m - 1]); };
  let sel = null, error = "";

  function render(note) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => t.columns.some((c) => /^(amt|amount|cost|kr|price|sum)$/i.test(c.name)));
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Date, Item, Category and Amt columns.</div>`; return; }
    const ci = (re) => t.columns.findIndex((c) => re.test(c.name));
    const a = ci(/^(amt|amount|cost|kr|price|sum)$/i), cat = ci(/categ/i), item = ci(/item|what|description/i), date = ci(/^date$/i);
    const rows = t.rows.map((r, i) => ({ i, d: date >= 0 ? r[date] : "", item: item >= 0 ? r[item] : "", cat: (cat >= 0 && r[cat]) || "Other", n: num(r[a]) }));
    const byM = new Map();
    for (const x of rows) { const k = /^\d{4}-\d{2}/.test(x.d) ? x.d.slice(0, 7) : "0000-00"; byM.set(k, (byM.get(k) || 0) + x.n); }
    const keys = [...byM.keys()].sort();
    if (!keys.length) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">No expenses yet.</div>`; return; }
    const thisM = note.today.slice(0, 7);
    if (!sel || !byM.has(sel)) sel = byM.has(thisM) ? thisM : keys[keys.length - 1];
    const max = Math.max(1, ...byM.values());
    const inM = rows.filter((x) => (/^\d{4}-\d{2}/.test(x.d) ? x.d.slice(0, 7) : "0000-00") === sel);
    const groups = new Map();
    for (const x of inM) { if (!groups.has(x.cat)) groups.set(x.cat, []); groups.get(x.cat).push(x); }
    const gl = [...groups].map(([k, v]) => [k, v, v.reduce((s, x) => s + x.n, 0)]).sort((p, q) => q[2] - p[2]);
    const total = byM.get(sel) || 0;
    const lbl = sel === "0000-00" ? "No date" : mname(sel, true);

    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="hero"><div class="mlabel">${esc(lbl)}</div><div class="total">${kr(total)}</div><div class="mlabel">${inM.length} entries</div></div>
      <div class="grid"><section>
        <div class="label">By month</div>
        <div class="card"><div class="months">${keys.map((k) => `<button class="m" data-m="${k}" aria-pressed="${k === sel}" aria-label="${esc(k === "0000-00" ? "No date" : mname(k, true))}: ${kr(byM.get(k))}"><span class="v">${kr(byM.get(k)).replace(" kr", "")}</span><span class="col"><span class="fill" style="height:${(100 * byM.get(k) / max).toFixed(1)}%"></span></span><span class="n">${k === "0000-00" ? "?" : mname(k)}</span></button>`).join("")}</div></div>
        <div class="label">Add an expense</div>
        <div class="card">
          <form id="add">
            <label>Item<input name="item" required></label>
            <label>Category<input name="cat" list="cats" required></label>
            <label>Amount (kr)<input name="amount" inputmode="decimal" required></label>
            <button class="add">Add</button>
          </form>
          <datalist id="cats">${[...new Set(rows.map((x) => x.cat))].map((c) => `<option value="${esc(c)}">`).join("")}</datalist>
          ${error ? `<div class="err" role="alert">${esc(error)}</div>` : ""}
        </div>
      </section><section>
        <div class="label">By category</div>
        ${gl.length ? gl.map(([k, v, s]) => `<div class="card"><div class="ghead"><span>${esc(k)}</span><span class="num">${kr(s)}</span></div>${v.sort((p, q) => q.d.localeCompare(p.d)).map((x) => `<div class="row"><div class="grow">${esc(x.item)}<div class="muted">${esc(x.d)}</div></div><div class="num">${kr(x.n)}</div></div>`).join("")}</div>`).join("") : '<div class="card empty">Nothing this month.</div>'}
      </section></div>`;

    app.querySelectorAll(".m").forEach((b) => b.onclick = () => { sel = b.dataset.m; render(amber.note); });
    document.getElementById("add").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const values = { [t.columns[a].name]: String(f.get("amount")).trim() };
      if (item >= 0) values[t.columns[item].name] = String(f.get("item")).trim();
      if (cat >= 0) values[t.columns[cat].name] = String(f.get("cat")).trim();
      if (date >= 0) values[t.columns[date].name] = note.today;
      const r = await amber.update({ op: "append_row", table: t.index, values });
      error = r.ok ? "" : r.error;
      if (r.ok) sel = note.today.slice(0, 7); else render(amber.note);
    };
  }
  amber.onChange(render);
</script>
</body>
</html>
