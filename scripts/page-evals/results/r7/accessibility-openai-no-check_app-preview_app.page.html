<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 88px}h1{font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:0 0 8px}.summary{color:var(--amber-text-secondary);margin:0 0 18px}.grid{display:grid;gap:16px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.card h2{font-size:19px;margin:0;padding:16px 16px 10px}.row{display:flex;align-items:flex-start;gap:12px;min-height:52px;padding:12px 16px;border-top:1px solid var(--amber-separator)}.row:first-of-type{border-top:0}.row input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:28px;height:28px;margin:0;border:2px solid var(--amber-text-secondary);border-radius:8px;background:var(--amber-fill);position:relative}.row input[type=checkbox]:checked{background:var(--amber-accent);border-color:var(--amber-accent)}.row input[type=checkbox]:checked:after{content:"";position:absolute;left:8px;top:3px;width:8px;height:15px;border:solid var(--amber-on-accent);border-width:0 3px 3px 0;transform:rotate(45deg)}.row input[type=checkbox]:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--amber-accent);outline-offset:3px}.itemtext{line-height:1.35;overflow-wrap:anywhere;padding-top:3px}.done .itemtext{color:var(--amber-text-secondary);text-decoration:line-through}.empty{padding:18px 16px;color:var(--amber-text-secondary)}form{padding:16px;display:grid;gap:12px}label{display:grid;gap:6px;font-weight:600}input,select,button{font:inherit;min-height:44px;border-radius:var(--amber-radius-small)}input,select{width:100%;color:var(--amber-text);background:var(--amber-fill);border:1px solid var(--amber-separator);padding:10px 12px}button{border:0;padding:0 16px;font-weight:700;background:var(--amber-accent);color:var(--amber-on-accent)}.status{min-height:22px;color:var(--amber-text-secondary);padding:0 16px 16px}.status.err{color:var(--amber-danger)}.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}@media (min-width:900px){.grid{grid-template-columns:1fr 1fr}.addcard{grid-column:1/-1}h1{font-size:36px}}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p id="summary" class="summary" aria-live="polite"></p>
  <section id="lists" class="grid" aria-label="Packing checklist"></section>
</main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
let lastNote=null, message="", isError=false;
function headings(note){const lines=note.markdown.split(/\n/);const hs=[];for(let i=0;i<lines.length;i++){const m=lines[i].match(/^(#{1,6})\s+(.+?)\s*$/);if(m)hs.push({line:i+1,level:m[1].length,text:m[2]});}return hs;}
function groups(note){const hs=headings(note).filter(h=>h.level===2||h.level===3);const map=new Map();hs.forEach(h=>map.set(h.text,{heading:h,items:[]}));const uncategorized={heading:null,items:[]};note.checklists.forEach(c=>{let h=null;for(const x of hs){if(x.line<c.line)h=x;else break;}const g=h?map.get(h.text):uncategorized;g.items.push(c);});const out=[...map.values()].filter(g=>g.items.length||g.heading);if(uncategorized.items.length)out.unshift(uncategorized);return out;}
function sectionTextWithNewItem(note,heading,item){const lines=note.markdown.split(/\n/);const hs=headings(note);const h=hs.find(x=>x.text===heading);if(!h)return null;let end=lines.length+1;for(const x of hs){if(x.line>h.line&&x.level<=h.level){end=x.line;break;}}const body=lines.slice(h.line,end-1);let insert=body.length;for(let i=0;i<body.length;i++){if(/^\s*- \[[ xX]\]/.test(body[i]))insert=i+1;}body.splice(insert,0,"- [ ] "+item.replace(/\s+/g," ").trim());return body.join("\n");}
async function toggle(line){const r=await amber.update({op:"toggle_checklist",line});message=r.ok?"":r.error;isError=!r.ok;if(!r.ok)render(amber.note,amber.data);}
async function addItem(e){e.preventDefault();const fd=new FormData(e.target);const item=String(fd.get("item")||"").trim();const heading=String(fd.get("heading")||"");if(!item){message="Enter an item to add.";isError=true;render(lastNote,amber.data);return;}const text=sectionTextWithNewItem(lastNote,heading,item);if(text==null){message="Choose a section for the new item.";isError=true;render(lastNote,amber.data);return;}const r=await amber.update({op:"set_text",heading,text});if(r.ok){message="Added “"+item+"” to "+heading+".";isError=false;e.target.reset();}else{message=r.error;isError=true;render(lastNote,amber.data);}}
function render(note){lastNote=note;const all=note.checklists||[];const done=all.filter(i=>i.checked).length;document.getElementById("title").textContent=note.title;document.getElementById("summary").textContent=all.length?done+" of "+all.length+" packed. "+(all.length-done)+" remaining.":"No packing items yet.";const gs=groups(note);const sectionOptions=gs.filter(g=>g.heading).map(g=>`<option value="${esc(g.heading.text)}">${esc(g.heading.text)}</option>`).join("");const cards=gs.map(g=>`<section class="card" aria-labelledby="h-${esc((g.heading?g.heading.text:"Other").replace(/\W+/g,"-"))}"><h2 id="h-${esc((g.heading?g.heading.text:"Other").replace(/\W+/g,"-"))}">${esc(g.heading?g.heading.text:"Other")}</h2>${g.items.length?g.items.map(c=>`<label class="row ${c.checked?"done":""}"><input type="checkbox" ${c.checked?"checked":""} aria-label="${esc((c.checked?"Mark not packed: ":"Mark packed: ")+c.text)}" data-line="${c.line}"><span class="itemtext">${esc(c.text)}</span></label>`).join(""):`<div class="empty">No items in this section.</div>`}</section>`).join("");document.getElementById("lists").innerHTML=cards+`<section class="card addcard" aria-labelledby="add-title"><h2 id="add-title">Add a packing item</h2><form id="addform"><label for="newitem">Item name</label><input id="newitem" name="item" autocomplete="off" required><label for="section">Section</label><select id="section" name="heading" required>${sectionOptions}</select><button type="submit">Add item</button></form><div class="status ${isError?"err":""}" role="status" aria-live="polite">${esc(message)}</div></section>`;document.querySelectorAll('input[type="checkbox"][data-line]').forEach(cb=>cb.addEventListener("change",()=>toggle(Number(cb.dataset.line))));document.getElementById("addform").addEventListener("submit",addItem);}
amber.onChange(render);
</script>
</body>
</html>
