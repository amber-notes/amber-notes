<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 90px}.top{display:grid;gap:14px;margin-bottom:16px}.title{margin:4px 0 0;font-size:32px;line-height:1.05;letter-spacing:-.03em}.subtitle{margin:6px 0 0;color:var(--amber-text-secondary)}.hero{background:linear-gradient(135deg,var(--amber-accent-soft),var(--amber-surface));border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:18px}.count{display:flex;align-items:end;gap:10px;margin-top:12px}.num{font-variant-numeric:tabular-nums;font-size:44px;font-weight:750;letter-spacing:-.04em}.label{color:var(--amber-text-secondary);padding-bottom:7px}.grid{display:grid;gap:14px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.card h2{font-size:17px;margin:0;padding:15px 16px;border-bottom:1px solid var(--amber-separator)}.fact{display:grid;gap:4px;padding:13px 16px;border-top:1px solid var(--amber-separator)}.fact:first-of-type{border-top:0}.k{font-size:13px;color:var(--amber-text-secondary);text-transform:uppercase;letter-spacing:.04em}.v{overflow-wrap:anywhere}.pillrow{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}.pill{background:var(--amber-fill);border-radius:999px;padding:7px 10px;font-size:14px;color:var(--amber-text-secondary)}.list{padding:6px}.item{display:flex;gap:10px;align-items:flex-start;min-height:48px;padding:10px;border-radius:var(--amber-radius-small)}.item+ .item{border-top:1px solid var(--amber-separator)}.item input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--amber-accent);flex:0 0 auto}.item span{line-height:1.35}.item.done span{text-decoration:line-through;color:var(--amber-text-secondary)}.progress{height:8px;background:var(--amber-fill);border-radius:999px;overflow:hidden;margin:0 16px 14px}.bar{height:100%;background:var(--amber-accent);border-radius:999px}.muted{color:var(--amber-text-secondary)}.empty{padding:26px 16px;text-align:center;color:var(--amber-text-secondary)}.err{color:var(--amber-danger);padding:0 16px 12px;min-height:1em}.section-note{padding:0 16px 12px;color:var(--amber-text-secondary);font-size:14px}@media (min-width:900px){.top{grid-template-columns:1.15fr .85fr;align-items:stretch}.grid{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.title{font-size:42px}.num{font-size:56px}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let lastError="";
function lines(note){return String(note.markdown||"").split(/\r?\n/)}
function facts(note){const out={};lines(note).forEach(l=>{const m=l.match(/^\s*([^:\n]{2,28}):\s*(.+)$/);if(m)out[m[1].trim().toLowerCase()]=m[2].trim()});return out}
const months={jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
function iso(y,m,d){return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function parseTripDates(note){const text=String(note.markdown||"");const year=Number((note.today||"").slice(0,4))||new Date().getFullYear();let found=[];let re=/(?:mon|tue|wed|thu|fri|sat|sun)?\s*(\d{1,2})\s+([a-z]{3,9})(?:\s+(\d{4}))?/gi,m;while((m=re.exec(text))){const mo=months[m[2].toLowerCase()];if(mo)found.push(iso(Number(m[3])||year,mo,Number(m[1])))}if(!found.length)return{};found=[...new Set(found)].sort();return{start:found[0],end:found[found.length-1]}}
function days(a,b){const A=Date.UTC(+a.slice(0,4),+a.slice(5,7)-1,+a.slice(8,10));const B=Date.UTC(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10));return Math.round((B-A)/86400000)}
function pretty(isoDate){if(!isoDate)return"";const [y,m,d]=isoDate.split("-").map(Number);return new Date(Date.UTC(y,m-1,d)).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
function sectionFor(lineNo,allLines){for(let i=lineNo-2;i>=0;i--){let l=allLines[i].trim();if(!l||/^- \[[ xX]\]/.test(l)||/^[-*] /.test(l))continue;if(i===0)break;return l.replace(/^#+\s*/,"").toLowerCase()}return"other"}
function groupedChecks(note){const all=lines(note);const groups={ideas:[],todos:[],other:[]};(note.checklists||[]).forEach(ch=>{const s=sectionFor(ch.line,all);if(/idea/.test(s))groups.ideas.push(ch);else if(/to\s*do|todo|before|task/.test(s))groups.todos.push(ch);else groups.other.push(ch)});return groups}
function flightBits(f){if(!f)return[];let a=[];const out=f.match(/out\s+([^,]+?)(?=,\s*back|$)/i);const back=f.match(/back\s+(.+)$/i);if(out)a.push(["Outbound",out[1].trim()]);if(back)a.push(["Return",back[1].trim()]);return a.length?a:[["Flights",f]]}
function progress(items){if(!items.length)return 0;return Math.round(items.filter(x=>x.checked).length*100/items.length)}
function listCard(title,items,noteText){const p=progress(items);return `<section class="card"><h2>${esc(title)}</h2>${items.length?`<div class="pillrow"><span class="pill">${items.filter(i=>i.checked).length} of ${items.length} done</span><span class="pill">${p}%</span></div><div class="progress" aria-label="${esc(title)} progress"><div class="bar" style="width:${p}%"></div></div><div class="list">${items.map(it=>`<label class="item ${it.checked?'done':''}"><input type="checkbox" data-line="${it.line}" ${it.checked?'checked':''} aria-label="${esc(it.text)}"><span>${esc(it.text)}</span></label>`).join("")}</div>`:`<div class="empty">${esc(noteText)}</div>`}</section>`}
function render(note){const f=facts(note), dates=parseTripDates(note), today=note.today, diff=dates.start?days(today,dates.start):null;let count="Set dates", countLabel="Add trip dates to the note";if(dates.start){if(diff>1){count=diff;countLabel="days until Porto"}else if(diff===1){count=1;countLabel="day until Porto"}else if(diff===0){count="Today";countLabel="the trip starts"}else if(dates.end&&days(today,dates.end)>=0){count="Now";countLabel="you are in Porto"}else{count="Done";countLabel="trip dates have passed"}}
const groups=groupedChecks(note);const hotel=f.hotel||"Add a hotel line to the note.";const budget=f.budget||"";const flightCards=flightBits(f.flights).map(x=>`<div class="fact"><div class="k">${esc(x[0])}</div><div class="v">${esc(x[1])}</div></div>`).join("");
document.getElementById("app").innerHTML=`<div class="top"><section class="hero"><h1 class="title">${esc(note.title)}</h1><p class="subtitle">${dates.start?`${esc(pretty(dates.start))}${dates.end&&dates.end!==dates.start?` – ${esc(pretty(dates.end))}`:""}`:"Weekend trip"}</p><div class="count"><div class="num">${esc(count)}</div><div class="label">${esc(countLabel)}</div></div></section><section class="card"><h2>At a glance</h2>${budget?`<div class="fact"><div class="k">Budget</div><div class="v">${esc(budget)}</div></div>`:""}<div class="fact"><div class="k">Hotel</div><div class="v">${esc(hotel)}</div></div></section></div><div class="grid"><section class="card"><h2>Flights</h2>${flightCards||'<div class="empty">Add a flights line to the note.</div>'}</section>${listCard("Ideas",groups.ideas,"Add checklist items under “ideas” in the note.")}${listCard("To-dos",groups.todos,"Add checklist items under “to do” in the note.")}${groups.other.length?listCard("Other checklist",groups.other,""):""}</div><div class="err" role="alert">${esc(lastError)}</div>`;
document.querySelectorAll('input[type="checkbox"][data-line]').forEach(box=>{box.onchange=async e=>{const line=Number(e.currentTarget.dataset.line);const r=await amber.update({op:"toggle_checklist",line});lastError=r.ok?"":r.error||"Could not update item";if(!r.ok)render(amber.note)}})}
amber.onChange((note)=>render(note));
</script>
</body>
</html>
