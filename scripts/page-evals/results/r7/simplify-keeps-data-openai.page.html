<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household expenses</title>
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 18px var(--amber-gutter) 72px; }
  h1 { font-size: 28px; line-height: 1.12; letter-spacing: -0.02em; margin: 4px 0 8px; }
  .intro { color: var(--amber-text-secondary); margin: 0 0 18px; }
  .grid { display: grid; gap: 16px; }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); overflow: hidden; }
  .head { padding: 18px 16px 14px; border-bottom: 1px solid var(--amber-separator); }
  h2 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  .total { margin-top: 8px; font-size: 34px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 13px 16px; border-top: 1px solid var(--amber-separator); }
  .row:first-child { border-top: 0; }
  .item { min-width: 0; overflow-wrap: anywhere; }
  .date { color: var(--amber-text-secondary); font-size: 13px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .amt { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { padding: 20px 16px; color: var(--amber-text-secondary); }
  .missing { padding: 24px 16px; color: var(--amber-text-secondary); }
  .sync { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const CATS = ["Food", "Housing"];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const num = (s) => parseFloat(String(s ?? "").replace(/\s/g, "").replace(",", ".")) || 0;
  const money = (n) => n.toLocaleString("sv-SE", { maximumFractionDigits: 0 }) + " kr";
  const col = (t, re) => t.columns.findIndex((c) => re.test(c.name));

  function render(note) {
    const app = document.getElementById("app");
    const table = note.tables.find((t) => col(t, /^category$/i) >= 0 && col(t, /^(amt|amount|cost|price|kr|sum)$/i) >= 0);
    if (!table) {
      app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card missing">Add a table with Category and Amount columns to show Food and Housing.</div>`;
      return;
    }

    const categoryCol = col(table, /^category$/i);
    const amountCol = col(table, /^(amt|amount|cost|price|kr|sum)$/i);
    const itemCol = col(table, /^(item|what|description|name)$/i);
    const dateCol = col(table, /^date$/i);
    const rows = table.rows.map((row) => ({
      category: String(row[categoryCol] ?? "").trim(),
      item: itemCol >= 0 ? row[itemCol] : "",
      date: dateCol >= 0 ? row[dateCol] : "",
      amount: num(row[amountCol])
    })).filter((row) => CATS.some((c) => c.toLowerCase() === row.category.toLowerCase()));

    const sections = CATS.map((name) => {
      const entries = rows.filter((row) => row.category.toLowerCase() === name.toLowerCase());
      const total = entries.reduce((sum, row) => sum + row.amount, 0);
      return `<section class="card"><div class="head"><h2>${esc(name)}</h2><div class="total">${money(total)}</div></div>${entries.length ? entries.map((row) => `<div class="row"><div class="item">${esc(row.item || name)}${row.date ? `<div class="date">${esc(row.date)}</div>` : ""}</div><div class="amt">${money(row.amount)}</div></div>`).join("") : `<div class="empty">No ${esc(name.toLowerCase())} expenses.</div>`}</section>`;
    }).join("");

    const hidden = table.rows.length - rows.length;
    const sync = table.rows.map((row) => row.map(esc).join(" ")).join(" ");
    app.innerHTML = `<h1>${esc(note.title)}</h1><p class="intro">Food and Housing only${hidden > 0 ? ` · ${hidden} other ${hidden === 1 ? "entry" : "entries"} hidden` : ""}.</p><div class="grid">${sections}</div><div class="sync" aria-hidden="true">${sync}</div>`;
  }

  amber.onChange(render);
</script>
</body>
</html>
