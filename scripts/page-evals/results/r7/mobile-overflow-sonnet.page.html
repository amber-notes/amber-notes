<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 48px}
h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 16px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:14px 16px;min-width:0}
.card h2{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--amber-accent-soft);color:var(--amber-accent-text);white-space:nowrap}
dl{margin:0}
.m{display:flex;gap:12px;padding:6px 0;border-top:1px solid var(--amber-separator)}
dt{width:84px;flex:none;color:var(--amber-text-secondary);font-size:14px}
dd{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.note{margin-top:8px;color:var(--amber-text-secondary);font-size:14px;overflow-wrap:anywhere}
.empty{padding:28px 16px;text-align:center;color:var(--amber-text-secondary)}
@media (min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main><h1 id="t"></h1><div class="grid" id="g"></div></main><script>
const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
amber.onChange((note)=>{
document.getElementById("t").textContent=note.title;
const g=document.getElementById("g");
const tb=note.tables.find(t=>t.columns.some(c=>/^day$/i.test(c.name)))||note.tables[0];
if(!tb||!tb.rows.length){g.innerHTML='<div class="card empty">Add a table with a Day column to see it here.</div>';return}
const ci=(re)=>tb.columns.findIndex(c=>re.test(c.name));
const day=Math.max(ci(/^day$/i),0),shop=ci(/^shop$/i),notes=ci(/^notes?$/i);
g.innerHTML=tb.rows.map(r=>{
const yes=shop>=0&&/^(yes|y|✓|x|1|true)$/i.test((r[shop]||"").trim());
const meals=tb.columns.map((c,i)=>({c:c.name,v:r[i]||"",i})).filter(m=>m.i!==day&&m.i!==shop&&m.i!==notes&&m.v);
return '<section class="card"><h2>'+esc(r[day])+(yes?'<span class="tag">Shop</span>':'')+'</h2><dl>'+
meals.map(m=>'<div class="m"><dt>'+esc(m.c)+'</dt><dd>'+esc(m.v)+'</dd></div>').join("")+'</dl>'+
(notes>=0&&r[notes]?'<div class="note">'+esc(r[notes])+'</div>':'')+'</section>'}).join("");
});
</script></body></html>
