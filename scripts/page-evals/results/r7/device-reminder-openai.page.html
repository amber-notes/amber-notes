<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 88px}.hero{display:grid;gap:14px;margin-bottom:16px}.title{font-size:32px;line-height:1.05;letter-spacing:-.03em;margin:6px 0 0}.muted{color:var(--amber-text-secondary)}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden;margin-bottom:14px}.pad{padding:16px}.kicker{font-size:13px;font-weight:700;color:var(--amber-accent-text);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}.big{font-size:24px;font-weight:750;letter-spacing:-.02em;margin:0}.sub{font-size:15px;color:var(--amber-text-secondary);margin:6px 0 0;line-height:1.35}.grid{display:grid;gap:14px}.facts{display:grid;grid-template-columns:1fr;gap:10px}.fact{background:var(--amber-fill);border-radius:var(--amber-radius-small);padding:12px}.fact b{display:block;font-size:13px;color:var(--amber-text-secondary);margin-bottom:3px}.fact span{overflow-wrap:anywhere}.button{width:100%;min-height:50px;border:0;border-radius:var(--amber-radius-small);padding:0 16px;background:var(--amber-fill);color:var(--amber-text);font:inherit;font-weight:750}.button:disabled{opacity:.55}.secondary{background:var(--amber-fill);color:var(--amber-text)}.status{min-height:20px;margin-top:10px;font-size:14px}.err{color:var(--amber-danger)}.ok{color:var(--amber-accent-text)}.row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-top:1px solid var(--amber-separator);min-height:48px}.row:first-child{border-top:0}.check{appearance:none;width:32px;height:32px;flex:0 0 32px;border-radius:7px;border:2px solid var(--amber-separator);background:var(--amber-fill);margin:0}.check:checked{background:var(--amber-accent);border-color:var(--amber-accent)}.grow{flex:1;min-width:0;overflow-wrap:anywhere}.done{text-decoration:line-through;color:var(--amber-text-secondary)}ul.clean{list-style:none;padding:0;margin:0}.idea{padding:12px 16px;border-top:1px solid var(--amber-separator)}.idea:first-child{border-top:0}.empty{padding:22px 16px;text-align:center;color:var(--amber-text-secondary)}@media (min-width:900px){.grid{grid-template-columns:1.05fr .95fr}.hero{grid-template-columns:1.15fr .85fr;align-items:stretch}.title{font-size:42px}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const months={jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,sept:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
let message="",busy=false;
function two(n){return String(n).padStart(2,"0")}
function localDate(y,m,d){return `${y}-${two(m)}-${two(d)}`}
function dateLabel(iso){if(!iso)return "";const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
function parseTrip(note){const md=note.markdown||"";const lines=md.split(/\r?\n/);const flightLine=lines.find(l=>/^\s*flights?\s*:/i.test(l))||lines.find(l=>/\bout\b.*\d{1,2}\s+[a-z]+.*\d{1,2}[:.]\d{2}/i.test(l))||"";let year=Number((note.today||"").slice(0,4))||new Date().getFullYear();const explicit=flightLine.match(/\b(20\d{2})\b/);if(explicit)year=Number(explicit[1]);function part(kind){const re=kind==="out"?/\bout\s+(?:[a-z]+\s+)?(\d{1,2})\s+([a-z]+)\s+(\d{1,2}[:.]\d{2})/i:/\bback\s+(?:[a-z]+\s+)?(\d{1,2})\s+([a-z]+)\s+(\d{1,2}[:.]\d{2})/i;const m=flightLine.match(re);if(!m)return null;let mo=months[m[2].toLowerCase()];if(!mo)return null;let y=year;const today=note.today||"";if(!explicit&&today){const cand=localDate(y,mo,Number(m[1]));if(cand<today)y++}return{date:localDate(y,mo,Number(m[1])),time:m[3].replace(".",":"),raw:m[0]}}
 const out=part("out"),back=part("back");let due="";if(out){const [y,m,d]=out.date.split("-").map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()-1);due=`${dt.getFullYear()}-${two(dt.getMonth()+1)}-${two(dt.getDate())}T18:00:00`}
 const facts=[];for(const line of lines){const m=line.match(/^\s*([^\n:#-][^:\n]{1,28})\s*:\s*(.+)$/);if(m&&!/^flights?$/i.test(m[1]))facts.push({label:m[1].trim(),value:m[2].trim()})}
 const ideas=[];let inIdeas=false;for(const line of lines){if(/^\s*ideas\s*$/i.test(line)){inIdeas=true;continue}if(inIdeas&&/^\s*[^-\s].+/.test(line))break;const b=line.match(/^\s*-\s+(.+)/);if(inIdeas&&b&&!/^\[[ xX]\]/.test(b[1]))ideas.push(b[1].trim())}
 return{out,back,due,facts,ideas,flightLine}
}
async function toggle(line){message="";const r=await amber.update({op:"toggle_checklist",line});if(!r.ok){message="Could not update checklist: "+r.error;render(amber.note,amber.data)}}
async function remind(note){const trip=parseTrip(note);if(!trip.due){message="I could not find the outbound flight date in the note.";render(note,amber.data);return}busy=true;message="";render(note,amber.data);try{const r=await amber.device.reminders.create({title:`Pack for ${note.title}`,due:trip.due});if(r.ok){await amber.store.set("packReminder",{due:trip.due,setAt:note.today});message=`Reminder set for ${dateLabel(trip.due.slice(0,10))} at 18:00.`}else message=r.error||"The reminder was not created."}catch(e){message=String(e&&e.message?e.message:e)}busy=false;render(amber.note||note,amber.data)}
function render(note,data){const trip=parseTrip(note);const saved=(data&&data.values&&data.values.packReminder)||{};const app=document.getElementById("app");const checks=note.checklists||[];const done=checks.filter(c=>c.checked).length;app.innerHTML=`<section class="hero"><div class="card pad"><p class="kicker">Weekend trip</p><h1 class="title">${esc(note.title)}</h1><p class="sub">${trip.out?`Outbound ${esc(dateLabel(trip.out.date))} at ${esc(trip.out.time)}`:"Add an outbound flight line to calculate the packing reminder."}${trip.back?` · Back ${esc(dateLabel(trip.back.date))} at ${esc(trip.back.time)}`:""}</p></div><div class="card pad"><p class="kicker">Pack reminder</p><p class="big">${trip.due?`${esc(dateLabel(trip.due.slice(0,10)))} · 18:00`:"Flight date needed"}</p><p class="sub">Creates a reminder on this phone for the evening before the outbound flight.</p><button class="button" id="remind" ${trip.due&& !busy?"":"disabled"}>${busy?"Setting reminder…":saved.due===trip.due?"Set packing reminder again":"Set packing reminder"}</button><div class="status ${message.startsWith("Reminder")?"ok":"err"}" role="status">${esc(message)}</div></div></section><section class="grid"><div>${factsCard(trip)}${ideasCard(trip)}</div><div>${todoCard(checks,done)}</div></section>`;const b=document.getElementById("remind");if(b)b.onclick=()=>remind(note);document.querySelectorAll("input[data-line]").forEach(i=>{i.onchange=()=>toggle(Number(i.dataset.line))})}
function factsCard(trip){if(!trip.facts.length&&!trip.flightLine)return"";const all=trip.flightLine?[{label:"Flights",value:trip.flightLine.replace(/^\s*flights?\s*:\s*/i,"")},...trip.facts]:trip.facts;return`<div class="card pad"><p class="kicker">Key details</p><div class="facts">${all.map(f=>`<div class="fact"><b>${esc(f.label)}</b><span>${esc(f.value)}</span></div>`).join("")}</div></div>`}
function ideasCard(trip){return`<div class="card"><div class="pad"><p class="kicker">Ideas</p></div>${trip.ideas.length?`<ul class="clean">${trip.ideas.map(x=>`<li class="idea">${esc(x)}</li>`).join("")}</ul>`:`<div class="empty">Add ideas as bullet points under an “ideas” line.</div>`}</div>`}
function todoCard(checks,done){return`<div class="card"><div class="pad"><p class="kicker">Before you go</p><p class="big">${done}/${checks.length} done</p></div>${checks.length?checks.map(c=>`<label class="row"><input class="check" type="checkbox" data-line="${c.line}" ${c.checked?"checked":""} aria-label="${esc(c.text)}"><span class="grow ${c.checked?"done":""}">${esc(c.text)}</span></label>`).join(""):`<div class="empty">Add checklist items in the note to track trip prep.</div>`}</div>`}
amber.onChange(render);
</script>
</body>
</html>
