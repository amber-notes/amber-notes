<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 96px}
h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 16px}
h2{font-size:17px;margin:0 0 12px}
.card{background:var(--amber-surface);border-radius:var(--amber-radius);border:1px solid var(--amber-separator);margin-bottom:16px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:14px 16px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;font-family:var(--amber-font-rounded)}
.muted{color:var(--amber-text-secondary);font-size:14px}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bar i{display:block;width:100%;background:var(--amber-accent);border-radius:4px 4px 0 0;min-height:2px}
.bar span{font-size:12px;color:var(--amber-text-secondary);font-variant-numeric:tabular-nums;margin-bottom:4px}
.lbl{display:flex;gap:6px;margin-top:6px}
.lbl span{flex:1;text-align:center;font-size:12px;color:var(--amber-text-secondary)}
.run{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--amber-separator);min-height:48px}
.run:first-of-type{border-top:0}
.run .d{flex:1}.run .n{font-variant-numeric:tabular-nums;text-align:right}
form{display:flex;flex-wrap:wrap;gap:8px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--amber-text-secondary);flex:1 1 110px}
input{font:inherit;color:var(--amber-text);background:var(--amber-fill);border:0;border-radius:var(--amber-radius-small);padding:10px 12px;min-height:44px;width:100%}
button{font:inherit;font-weight:600;min-height:44px;padding:0 20px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-accent-soft);color:var(--amber-accent-text);border:1px solid var(--amber-accent);align-self:flex-end}
.err{color:var(--amber-danger);min-height:1em;margin-top:8px}
.empty{padding:20px;text-align:center;color:var(--amber-text-secondary)}
@media(min-width:900px){.stats{grid-template-columns:repeat(4,1fr)}.cols{display:grid;grid-template-columns:3fr 2fr;gap:16px}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const num=s=>{const n=parseFloat(String(s).replace(/\s/g,"").replace(",","."));return isNaN(n)?null:n};
const fi=(t,re)=>t.columns.findIndex(c=>re.test(c.name));
let error="";
function mon(d){const x=new Date(d+"T00:00:00Z");const w=(x.getUTCDay()+6)%7;x.setUTCDate(x.getUTCDate()-w);return x}
const iso=x=>x.toISOString().slice(0,10);
function pace(km,min){if(!km||!min)return"–";const p=min/km;let m=Math.floor(p),s=Math.round((p-m)*60);if(s===60){m++;s=0}return m+":"+String(s).padStart(2,"0")+" /km"}
function render(note){
 const app=document.getElementById("app");
 const t=note.tables.find(t=>fi(t,/date/i)>=0&&fi(t,/dist/i)>=0);
 if(!t){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Activity Date and Distance (km) columns.</div>`;return}
 const di=fi(t,/date/i),ki=fi(t,/dist/i),mi=fi(t,/time/i),hi=fi(t,/hr|heart/i);
 const runs=t.rows.map(r=>({d:r[di],km:num(r[ki]),min:mi>=0?num(r[mi]):null,hr:hi>=0?num(r[hi]):null})).filter(r=>r.d&&r.km!=null).sort((a,b)=>a.d<b.d?1:-1);
 const sum=a=>a.reduce((x,y)=>x+y,0);
 const tk=sum(runs.map(r=>r.km)),tm=sum(runs.map(r=>r.min||0));
 const hrs=runs.filter(r=>r.hr!=null).map(r=>r.hr);
 const longest=runs.reduce((m,r)=>Math.max(m,r.km),0);
 // weeks
 const cur=mon(note.today);const wk=[];
 for(let i=7;i>=0;i--){const s=new Date(cur);s.setUTCDate(s.getUTCDate()-7*i);const e=new Date(s);e.setUTCDate(e.getUTCDate()+6);
  wk.push({s:iso(s),e:iso(e),km:sum(runs.filter(r=>r.d>=iso(s)&&r.d<=iso(e)).map(r=>r.km)),l:iso(s).slice(5)})}
 const mx=Math.max(1,...wk.map(w=>w.km));
 const chart=wk.map(w=>`<div class="bar" title="Week of ${w.s}: ${w.km.toFixed(1)} km"><span>${w.km?w.km.toFixed(0):""}</span><i style="height:${Math.round(w.km/mx*110)}px"></i></div>`).join("");
 const lbl=wk.map(w=>`<span>${w.l}</span>`).join("");
 app.innerHTML=`<h1>${esc(note.title)}</h1>
 <div class="stats">
  <div class="stat"><b>${runs.length}</b><span class="muted">runs</span></div>
  <div class="stat"><b>${tk.toFixed(1)}</b><span class="muted">total km</span></div>
  <div class="stat"><b>${pace(tk,tm)}</b><span class="muted">avg pace</span></div>
  <div class="stat"><b>${hrs.length?Math.round(sum(hrs)/hrs.length):"–"}</b><span class="muted">avg HR · longest ${longest.toFixed(1)} km</span></div>
 </div>
 <div class="cols"><div>
 <div class="card"><h2>Weekly distance (km)</h2><div class="chart">${chart}</div><div class="lbl">${lbl}</div><div class="muted" style="margin-top:8px">Weeks starting Monday (MM-DD)</div></div>
 <div class="card"><h2>Log a run</h2><form id="f">
  <label>Date<input type="date" name="d" required value="${esc(note.today)}"></label>
  <label>Distance (km)<input name="k" inputmode="decimal" required></label>
  <label>Time (min)<input name="m" inputmode="decimal"></label>
  <label>Avg HR<input name="h" inputmode="numeric"></label>
  <button>Add</button></form><div class="err" role="alert">${esc(error)}</div></div>
 </div>
 <div class="card"><h2>Recent runs</h2>${runs.length?runs.slice(0,10).map(r=>`<div class="run"><div class="d">${esc(r.d)}<div class="muted">${pace(r.km,r.min)}${r.hr!=null?" · "+r.hr+" bpm":""}</div></div><div class="n"><b>${r.km.toFixed(1)} km</b><div class="muted">${r.min!=null?r.min+" min":""}</div></div></div>`).join(""):'<div class="empty">No runs yet.</div>'}</div>
 </div>`;
 document.getElementById("f").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
  const v={};v[t.columns[di].name]=f.get("d");v[t.columns[ki].name]=f.get("k").trim();
  if(mi>=0)v[t.columns[mi].name]=f.get("m").trim();if(hi>=0)v[t.columns[hi].name]=f.get("h").trim();
  const r=await amber.update({op:"append_row",table:t.index,values:v});error=r.ok?"":r.error;if(!r.ok)render(amber.note)};
}
amber.onChange(render);
</script>
</body>
</html>
