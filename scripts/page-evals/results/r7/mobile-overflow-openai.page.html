<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 72px}
h1{font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:4px 0 16px;color:var(--amber-text)}
.card,.table-card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}
.cards{display:grid;gap:12px}
.day{padding:16px}
.day h2{font-size:20px;line-height:1.2;margin:0 0 14px;color:var(--amber-text)}
.meals{display:grid;gap:10px}
.meal{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:start;padding-top:10px;border-top:1px solid var(--amber-separator)}
.meal:first-child{border-top:0;padding-top:0}
.label{color:var(--amber-text-secondary);font-size:13px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.value{color:var(--amber-text);min-width:0;overflow-wrap:anywhere}
.badge{display:inline-flex;min-height:28px;align-items:center;border-radius:999px;padding:4px 10px;background:var(--amber-accent-soft);color:var(--amber-accent-text);font-weight:700;font-size:13px}
.badge.no{background:var(--amber-fill);color:var(--amber-text-secondary)}
.empty{padding:28px 16px;text-align:center;color:var(--amber-text-secondary)}
.table-wrap{display:none;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;table-layout:auto}
th,td{padding:12px 14px;border-bottom:1px solid var(--amber-separator);text-align:left;vertical-align:top;color:var(--amber-text);overflow-wrap:anywhere;min-width:0}
th{color:var(--amber-text-secondary);font-size:13px;font-weight:700;background:var(--amber-fill)}
tr:last-child td{border-bottom:0}
@media (min-width:700px){.cards{display:none}.table-wrap{display:block}.table-card{overflow:hidden}}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <section id="content" aria-live="polite"></section>
</main>
<script>
const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const yes=(s)=>/^(yes|y|true|1|✓|x)$/i.test(String(s??"").trim());
function render(note){
  document.getElementById("title").textContent=note.title;
  const content=document.getElementById("content");
  const tb=note.tables&&note.tables[0];
  if(!tb){content.innerHTML='<div class="card empty">Add a meal-plan table to the note to see it here.</div>';return;}
  const cols=tb.columns.map(c=>c.name);
  if(!tb.rows.length){content.innerHTML='<div class="card empty">No meals planned yet.</div>';return;}
  const idx=(name)=>cols.findIndex(c=>c.toLowerCase()===name.toLowerCase());
  const day=idx("Day"), shop=idx("Shop");
  const cards=tb.rows.map((r)=>{
    const title=day>=0?r[day]:r[0];
    const parts=cols.map((name,i)=>{
      if(i===day)return "";
      const v=r[i]||"";
      if(i===shop){return `<div class="meal"><div class="label">${esc(name)}</div><div class="value"><span class="badge ${yes(v)?"":"no"}">${yes(v)?"Shop needed":"No shopping"}</span></div></div>`;}
      return `<div class="meal"><div class="label">${esc(name)}</div><div class="value">${v?esc(v):'<span class="label">—</span>'}</div></div>`;
    }).join("");
    return `<article class="card day"><h2>${esc(title||"Meal")}</h2><div class="meals">${parts}</div></article>`;
  }).join("");
  const head="<tr>"+cols.map(c=>"<th>"+esc(c)+"</th>").join("")+"</tr>";
  const rows=tb.rows.map(r=>"<tr>"+cols.map((_,i)=>"<td>"+esc(r[i]||"")+"</td>").join("")+"</tr>").join("");
  content.innerHTML=`<div class="cards">${cards}</div><div class="table-card table-wrap"><table>${head}${rows}</table></div>`;
}
amber.onChange(render);
</script>
</body>
</html>
