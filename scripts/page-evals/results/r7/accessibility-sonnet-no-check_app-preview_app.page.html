<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 96px}
h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 4px}
h2{font-size:18px;margin:0;padding:12px 16px;border-bottom:1px solid var(--amber-separator)}
.sum{color:var(--amber-text-secondary);margin:0 0 16px}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);margin-bottom:16px;overflow:hidden}
ul{list-style:none;margin:0;padding:0}
li{border-top:1px solid var(--amber-separator)}li:first-child{border-top:0}
li label{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 16px;cursor:pointer;overflow-wrap:anywhere}
li input{width:24px;height:24px;flex:none;accent-color:var(--amber-accent);margin:0}
li.done span{color:var(--amber-text-secondary);text-decoration:line-through}
.none{padding:14px 16px;color:var(--amber-text-secondary)}
form{display:flex;flex-wrap:wrap;gap:12px;padding:16px;align-items:flex-end}
form h2{border:0;padding:0;width:100%}
.f{display:flex;flex-direction:column;gap:4px;flex:1 1 180px;font-size:14px;color:var(--amber-text-secondary)}
input[type=text],select{font:inherit;font-size:16px;color:var(--amber-text);background:var(--amber-fill);border:1px solid var(--amber-separator);border-radius:var(--amber-radius-small);padding:10px 12px;min-height:44px;width:100%}
button{font:inherit;font-weight:600;min-height:44px;padding:0 20px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-accent);color:var(--amber-on-accent)}
:focus-visible{outline:3px solid var(--amber-text);outline-offset:2px}
.msg{padding:0 16px 14px;min-height:1.2em;margin:0}
.msg.bad{color:var(--amber-danger)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(min-width:900px){#lists{columns:2;column-gap:16px}#lists .card{break-inside:avoid}}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p class="sum" id="sum"></p>
<div id="lists"></div>
<div class="card">
<form id="add">
<h2>Add an item</h2>
<div class="f"><label for="nv">Item name</label><input type="text" id="nv" autocomplete="off"></div>
<div class="f"><label for="ns">List</label><select id="ns"></select></div>
<button type="submit">Add item</button>
</form>
<p class="msg" id="msg"></p>
</div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
</main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const $=id=>document.getElementById(id);
let msg="",bad=false,focusLine=null,lastSel="";
function sections(note){
  const lines=note.markdown.split("\n"),secs=[];let cur={name:"",head:false,items:[]};secs.push(cur);
  const byLine={};note.checklists.forEach(c=>byLine[c.line]=c);
  lines.forEach((l,i)=>{
    const h=/^(#{1,6})\s+(.*?)\s*$/.exec(l);
    if(h&&i>0){cur={name:h[2],head:true,items:[]};secs.push(cur);}
    else if(byLine[i+1])cur.items.push(byLine[i+1]);
  });
  return secs.filter(s=>s.head||s.items.length);
}
function render(note){
  const secs=sections(note);
  const all=note.checklists,done=all.filter(c=>c.checked).length;
  $("title").textContent=note.title;
  $("sum").textContent=all.length?done+" of "+all.length+" items packed":"Nothing on the list yet.";
  $("lists").innerHTML=secs.map(s=>{
    const d=s.items.filter(c=>c.checked).length;
    const nm=s.name||"Items";
    return '<section class="card" aria-label="'+esc(nm)+'"><h2>'+esc(nm)+' <span class="sum" style="font-weight:400">('+d+' of '+s.items.length+' packed)</span></h2>'+
    (s.items.length?'<ul>'+s.items.map(c=>'<li class="'+(c.checked?'done':'')+'"><label><input type="checkbox" data-line="'+c.line+'"'+(c.checked?' checked':'')+'><span>'+esc(c.text)+'</span></label></li>').join("")+'</ul>':'<div class="none">No items in this list.</div>')+'</section>';
  }).join("");
  const sel=$("ns"),cur=sel.value||lastSel;
  sel.innerHTML=secs.filter(s=>s.head).map(s=>'<option>'+esc(s.name)+'</option>').join("");
  if(cur)sel.value=cur;
  const m=$("msg");m.textContent=msg;m.className="msg"+(bad?" bad":"");m.setAttribute("role",bad?"alert":"status");
  document.querySelectorAll('#lists input').forEach(b=>b.onchange=async()=>{
    const line=+b.dataset.line;focusLine=line;
    const r=await amber.update({op:"toggle_checklist",line});
    if(!r.ok){msg=r.error;bad=true;render(amber.note);}
    else{const c=amber.note.checklists.find(x=>x.line===line);
      $("live").textContent=(c?c.text+" "+(c.checked?"packed":"not packed"):"Updated");}
  });
  if(focusLine!=null){const e=document.querySelector('#lists input[data-line="'+focusLine+'"]');if(e)e.focus();focusLine=null;}
}
$("add").onsubmit=async e=>{
  e.preventDefault();
  const v=$("nv").value.trim().replace(/\s+/g," "),h=$("ns").value;lastSel=h;
  if(!v){msg="Type an item name first.";bad=true;render(amber.note);$("nv").focus();return;}
  if(!h){msg="Add a heading to the note first, to hold the item.";bad=true;render(amber.note);return;}
  const lines=amber.note.markdown.split("\n");
  let start=lines.findIndex((l,i)=>i>0&&/^#{1,6}\s+/.test(l)&&l.replace(/^#{1,6}\s+/,"").trim()===h);
  if(start<0){msg="Could not find that list.";bad=true;render(amber.note);return;}
  const lvl=/^(#+)/.exec(lines[start])[1].length;let end=lines.length;
  for(let i=start+1;i<lines.length;i++){const m=/^(#+)\s/.exec(lines[i]);if(m&&m[1].length<=lvl){end=i;break;}}
  const body=lines.slice(start+1,end).join("\n").replace(/^\n+|\s+$/g,"");
  const text=(body?body+"\n":"")+"- [ ] "+v;
  const r=await amber.update({op:"set_text",heading:h,text});
  if(r.ok){msg="Added "+v+" to "+h+".";bad=false;$("nv").value="";$("live").textContent=msg;}
  else{msg=r.error||"Could not add the item.";bad=true;}
  render(amber.note);$("nv").focus();
};
amber.onChange(n=>render(n));
</script>
</body>
</html>
