<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;padding:18px 0 88px;color:var(--amber-text);font-family:var(--amber-font)}.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:0 var(--amber-gutter)}header{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;margin:6px 0 18px}h1{font-size:32px;line-height:1.05;letter-spacing:-.03em;margin:0 0 5px}.sub{color:var(--amber-text-secondary);font-size:15px}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--amber-accent-soft);color:var(--amber-accent-text);padding:7px 10px;font-weight:650;font-size:14px;white-space:nowrap}.layout{display:grid;gap:16px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.card.pad{padding:14px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--amber-text-secondary);margin:0 0 10px}.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}.nav,.today,.habit{appearance:none;border:0;font:inherit;color:inherit}.nav{width:42px;height:42px;border-radius:var(--amber-radius-small);background:var(--amber-fill);font-size:22px}.today{min-height:42px;padding:0 13px;border-radius:var(--amber-radius-small);background:var(--amber-fill);font-weight:650}.datebar input{flex:1;min-width:0;height:42px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-fill);color:var(--amber-text);font:inherit;padding:0 10px}.habits{display:grid;gap:9px}.habit{width:100%;min-height:64px;display:flex;align-items:center;gap:13px;text-align:left;background:var(--amber-fill);border-radius:14px;padding:11px 13px}.habit:active{transform:scale(.99)}.tick{width:34px;height:34px;flex:none;border:2px solid var(--amber-separator);border-radius:50%;display:grid;place-items:center}.habit.on .tick{background:var(--amber-accent);border-color:var(--amber-accent);color:var(--amber-on-accent)}.tick svg{width:18px;height:18px;opacity:0}.habit.on .tick svg{opacity:1}.name{font-size:17px;font-weight:650;flex:1;min-width:0;overflow-wrap:anywhere}.meta{font-size:13px;color:var(--amber-text-secondary);font-variant-numeric:tabular-nums;text-align:right}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:var(--amber-fill);border-radius:14px;padding:12px}.num{font-size:28px;font-weight:750;letter-spacing:-.03em}.lab{font-size:12px;color:var(--amber-text-secondary);margin-top:2px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:minmax(90px,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--amber-separator)}.row:first-child{border-top:0}.streak{font-weight:750;font-variant-numeric:tabular-nums}.bar{height:8px;background:var(--amber-fill);border-radius:99px;overflow:hidden;width:80px}.bar span{display:block;height:100%;background:var(--amber-accent);border-radius:99px}.gridwrap{overflow:hidden;padding:12px}.grid{display:grid;gap:5px}.gline{display:grid;grid-template-columns:minmax(78px,110px) repeat(14,minmax(10px,1fr));gap:3px;align-items:center}.gname{font-size:13px;color:var(--amber-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell{aspect-ratio:1;min-height:16px;border-radius:5px;background:var(--amber-fill)}.cell.on{background:var(--amber-accent)}.cell.sel{outline:2px solid var(--amber-text);outline-offset:-2px}.legend{display:flex;justify-content:space-between;color:var(--amber-text-secondary);font-size:12px;margin:7px 14px 13px 126px}.empty,.err{padding:18px;color:var(--amber-text-secondary);text-align:center}.err{color:var(--amber-danger)}@media (min-width:900px){.layout{grid-template-columns:minmax(0,1fr) 360px}.wide{grid-column:1/-1}.habits{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:38px}}@media (max-width:520px){header{display:block}.pill{margin-top:10px}.stats{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.bar{grid-column:1/-1;width:100%}.gline{grid-template-columns:minmax(72px,88px) repeat(14,minmax(8px,1fr));gap:2px}.legend{margin-left:86px}.meta{text-align:left}}
</style>
</head>
<body>
<div class="wrap"><main id="app"></main></div>
<script>
const DONE=/^(✓|✔|x|yes|y|1|true|done)$/i;const CHECK='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.3 8.4l3 3.1 6.5-7" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';let selected=null,error='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function addDays(iso,n){const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function nice(iso){const d=new Date(iso+'T12:00:00Z');return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
function render(note){selected=selected||note.today;const app=document.getElementById('app');const t=(note.tables||[]).find(x=>x.columns.some(c=>/^date$/i.test(c.name)));if(!t){app.innerHTML='<header><div><h1>'+esc(note.title)+'</h1><p class="sub">Add a table with a Date column and one column per habit.</p></div></header>';return}const dc=t.columns.findIndex(c=>/^date$/i.test(c.name));const habits=t.columns.map((c,i)=>({name:c.name,i})).filter(h=>h.i!==dc);const dateCol=t.columns[dc].name;const byDate=new Map(t.rows.map((r,i)=>[r[dc],{r,i}]));const done=(d,h)=>DONE.test(String(byDate.get(d)?.r[h.i]??'').trim());const row=byDate.get(selected);const todayRow=byDate.get(note.today);const todayDone=habits.filter(h=>done(note.today,h)).length;function streak(h){let n=0,d=done(note.today,h)?note.today:addDays(note.today,-1);while(done(d,h)){n++;d=addDays(d,-1)}return n}function best(h){let keys=[...byDate.keys()].sort();if(!keys.length)return 0;let best=0,run=0,d=keys[0];while(d<=note.today){if(done(d,h)){run++;best=Math.max(best,run)}else run=0;d=addDays(d,1)}return best}const avg=habits.length?Math.round(todayDone*100/habits.length):0;const days=Array.from({length:14},(_,i)=>addDays(note.today,i-13));app.innerHTML='<header><div><h1>'+esc(note.title)+'</h1><div class="sub">Tap a habit to tick it off. Changes are saved to the note table.</div></div><div class="pill">'+todayDone+'/'+habits.length+' today</div></header>'+(error?'<div class="card err" role="alert">'+esc(error)+'</div>':'')+'<div class="layout"><section class="card pad"><h2>Tick off</h2><div class="datebar"><button class="nav" data-shift="-1" aria-label="Previous day">‹</button><input id="datepick" type="date" value="'+esc(selected)+'" aria-label="Selected date"><button class="nav" data-shift="1" aria-label="Next day">›</button><button class="today" data-today>Today</button></div><div class="habits">'+habits.map(h=>'<button class="habit '+(done(selected,h)?'on':'')+'" data-h="'+h.i+'" aria-pressed="'+done(selected,h)+'"><span class="tick">'+CHECK+'</span><span class="name">'+esc(h.name)+'</span><span class="meta">'+(done(selected,h)?'done':'tap')+'</span></button>').join('')+'</div></section><aside class="card pad"><h2>Streaks</h2><div class="stats"><div class="stat"><div class="num">'+avg+'%</div><div class="lab">today complete</div></div><div class="stat"><div class="num">'+(habits.reduce((m,h)=>Math.max(m,streak(h)),0))+'</div><div class="lab">longest current</div></div></div><div class="list" style="margin-top:12px">'+habits.map(h=>{const s=streak(h),b=best(h),w=Math.min(100,b?100*s/b:s?100:0);return '<div class="row"><span>'+esc(h.name)+'</span><span class="streak">'+s+' day'+(s===1?'':'s')+'</span><span class="bar" aria-hidden="true"><span style="width:'+w+'%"></span></span></div>'}).join('')+'</div></aside><section class="card wide"><div class="gridwrap"><h2>Last 14 days</h2><div class="grid">'+habits.map(h=>'<div class="gline"><span class="gname">'+esc(h.name)+'</span>'+days.map(d=>'<span title="'+esc(h.name+' '+nice(d))+'" class="cell '+(done(d,h)?'on ':'')+(d===selected?'sel':'')+'"></span>').join('')+'</div>').join('')+'</div><div class="legend"><span>'+esc(nice(days[0]))+'</span><span>'+esc(nice(note.today))+'</span></div></div></section></div>';app.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>{selected=addDays(selected,Number(b.dataset.shift));render(note)});app.querySelector('[data-today]').onclick=()=>{selected=note.today;render(note)};app.querySelector('#datepick').onchange=e=>{selected=e.target.value||note.today;render(note)};app.querySelectorAll('.habit').forEach(b=>b.onclick=async()=>{const h=habits.find(x=>x.i===Number(b.dataset.h));const current=done(selected,h);const value=current?'':'✓';const r=row?await amber.update({op:'set_cell',table:t.index,row:row.i,col:h.name,value}):await amber.update({op:'append_row',table:t.index,values:{[dateCol]:selected,[h.name]:value}});error=r.ok?'':r.error;if(!r.ok)render(note)});
}
amber.onChange((note)=>{error='';render(note)});
</script>
</body>
</html>
