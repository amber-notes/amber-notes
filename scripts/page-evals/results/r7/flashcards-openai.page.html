<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --card: var(--amber-surface); --ink: var(--amber-text); --muted: var(--amber-text-secondary); --line: var(--amber-separator); --accent: var(--amber-accent); --accent-ink: var(--amber-on-accent); --field: var(--amber-fill); --soft: var(--amber-accent-soft); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px 0 88px; }
  .wrap { width: 100%; max-width: 620px; margin: 0 auto; padding: 0 var(--amber-gutter); }
  h1 { font-size: clamp(25px, 7vw, 34px); letter-spacing: -.03em; margin: 6px 0 4px; line-height: 1.08; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 16px; line-height: 1.35; }
  .bar { height: 9px; border-radius: 999px; background: var(--field); overflow: hidden; margin-bottom: 18px; }
  .bar div { height: 100%; background: var(--accent); border-radius: inherit; }
  .cardShell { perspective: 1000px; }
  .flip { display: grid; place-items: center; width: 100%; min-height: min(58vh, 360px); padding: 28px 20px; border-radius: 28px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; text-align: center; cursor: pointer; box-shadow: 0 10px 32px rgba(0,0,0,.08); }
  .flip:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .side { display: block; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
  .word { display: block; font-size: clamp(34px, 10vw, 56px); font-weight: 750; letter-spacing: -.025em; overflow-wrap: anywhere; margin: 10px 0 8px; line-height: 1.08; }
  .hint { color: var(--muted); font-size: 15px; min-height: 1.4em; display: block; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 14px; }
  .actions button, .reset { font: inherit; font-weight: 700; min-height: 54px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 0 12px; }
  .actions .known { background: var(--soft); border-color: var(--accent); color: var(--ink); }
  .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0 6px; }
  .pill { background: var(--soft); border: 1px solid var(--line); border-radius: 16px; padding: 10px 8px; text-align: center; }
  .num { display: block; font-size: 20px; font-weight: 750; color: var(--ink); }
  .label { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .list { margin-top: 22px; border-top: 1px solid var(--line); }
  .list summary { cursor: pointer; color: var(--muted); padding: 14px 4px; min-height: 48px; }
  .row { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--line); line-height: 1.35; }
  .row .back { color: var(--muted); }
  .row .k { color: var(--amber-accent-text); font-size: 14px; white-space: nowrap; font-weight: 700; }
  .reset { margin-top: 12px; width: 100%; color: var(--amber-accent-text); background: var(--field); }
  .err { color: var(--amber-danger); min-height: 1.2em; margin: 10px 4px 0; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--card); border-radius: var(--amber-radius); border: 1px solid var(--line); }
  @media (prefers-reduced-motion: no-preference) { .flip { transition: transform .16s ease, box-shadow .16s ease; } .flip:active { transform: scale(.985); box-shadow: 0 6px 18px rgba(0,0,0,.07); } }
  @media (min-width: 900px) { .wrap { max-width: 760px; } .flip { min-height: 420px; } }
</style>
</head>
<body>
<main id="app" class="wrap" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  let showBack = false;
  let current = null;
  let error = "";
  let seenFronts = null;

  function getCards(note) {
    const table = note.tables.find((t) => t.columns.length >= 2 && t.rows.length);
    if (!table) return { table: null, cards: [] };
    const cards = table.rows
      .filter((r) => String(r[0] || "").trim())
      .map((r) => ({ front: String(r[0] || ""), back: String(r[1] || "") }));
    return { table, cards };
  }

  function chooseNext(cards, known, afterFront) {
    const unknown = cards.filter((c) => !known[c.front]);
    const pool = unknown.length ? unknown : cards;
    if (!afterFront) return pool[0] ? pool[0].front : null;
    const currentIndex = pool.findIndex((c) => c.front === afterFront);
    if (currentIndex >= 0 && pool.length > 1) return pool[(currentIndex + 1) % pool.length].front;
    return pool.find((c) => c.front !== afterFront)?.front || pool[0]?.front || null;
  }

  function render(note, data) {
    const app = document.getElementById("app");
    const { table, cards } = getCards(note);
    if (!table || !cards.length) {
      app.innerHTML = `<h1>${esc(note.title)}</h1><div class="empty">Add a two-column table, like Spanish | English, to make flashcards.</div>`;
      return;
    }

    const known = (data && data.values && data.values.known) || {};
    const knownCount = cards.filter((c) => known[c.front]).length;
    const unknownCount = cards.length - knownCount;
    const previousFronts = seenFronts;
    seenFronts = new Set(cards.map((c) => c.front));
    const newUnknown = previousFronts ? cards.find((c) => !previousFronts.has(c.front) && !known[c.front]) : null;
    if (newUnknown) {
      current = newUnknown.front;
      showBack = false;
    }
    if (!current || !cards.some((c) => c.front === current) || (known[current] && unknownCount)) {
      current = chooseNext(cards, known, current);
      showBack = false;
    }
    const card = cards.find((c) => c.front === current) || cards[0];
    const progress = cards.length ? Math.round((100 * knownCount) / cards.length) : 0;

    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <p class="sub">Flip each Spanish verb, then mark it Known or Again. Unknown cards are shown first.</p>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${cards.length}" aria-valuenow="${knownCount}" aria-label="Known flashcards"><div style="width:${progress}%"></div></div>
      <section class="cardShell" aria-label="Current flashcard">
        <button class="flip" id="flip" aria-label="${showBack ? "Answer" : "Prompt"}: ${esc(showBack ? card.back : card.front)}. Tap to flip.">
          <span>
            <span class="side">${showBack ? esc(table.columns[1].name) : esc(table.columns[0].name)}</span>
            <span class="word">${esc(showBack ? card.back : card.front)}</span>
            <span class="hint">${showBack ? "Tap to see the Spanish verb" : "Tap to see the English meaning"}</span>
          </span>
        </button>
      </section>
      <div class="actions">
        <button id="again" type="button">Again</button>
        <button id="know" type="button" class="known">I know it</button>
      </div>
      <div class="meta" aria-label="Study progress">
        <div class="pill"><span class="num">${cards.length}</span><span class="label">Cards</span></div>
        <div class="pill"><span class="num">${unknownCount}</span><span class="label">To learn</span></div>
        <div class="pill"><span class="num">${knownCount}</span><span class="label">Known</span></div>
      </div>
      <div class="err" role="alert">${esc(error)}</div>
      <details class="list" open>
        <summary>All cards</summary>
        ${cards.map((c) => `<div class="row"><span><strong>${esc(c.front)}</strong><br><span class="back">${esc(c.back)}</span></span>${known[c.front] ? `<span class="k">Known</span>` : ""}</div>`).join("")}
        ${knownCount ? `<button class="reset" id="reset" type="button">Reset known cards</button>` : ""}
      </details>`;

    async function saveKnown(patch) {
      const response = await amber.setData({ values: { known: patch } });
      error = response && response.ok ? "" : ((response && response.error) || "Could not save progress.");
      return !!(response && response.ok);
    }

    document.getElementById("flip").onclick = () => {
      showBack = !showBack;
      render(amber.note, amber.data);
    };
    document.getElementById("again").onclick = async () => {
      const was = current;
      if (known[was] && !(await saveKnown({ [was]: null }))) {
        render(amber.note, amber.data);
        return;
      }
      current = chooseNext(cards, { ...known, [was]: null }, was);
      showBack = false;
      render(amber.note, amber.data);
    };
    document.getElementById("know").onclick = async () => {
      const was = current;
      const nextKnown = { ...known, [was]: note.today };
      current = chooseNext(cards, nextKnown, was);
      showBack = false;
      if (!(await saveKnown({ [was]: note.today }))) current = was;
      render(amber.note, amber.data);
    };
    const reset = document.getElementById("reset");
    if (reset) reset.onclick = async () => {
      await amber.setData({ values: { known: null } });
      current = null;
      showBack = false;
      render(amber.note, amber.data);
    };
  }

  amber.onChange(render);
</script>
</body>
</html>
