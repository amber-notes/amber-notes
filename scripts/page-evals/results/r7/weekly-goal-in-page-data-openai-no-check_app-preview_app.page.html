<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit tracker</title>
<style>
  :root { --card: var(--amber-surface); --muted: var(--amber-text-secondary); --line: var(--amber-separator); --amber: var(--amber-accent); --amber-soft: var(--amber-accent-soft); --amber-ink: var(--amber-accent-text); --empty: var(--amber-fill); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { -webkit-user-select: none; user-select: none; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 8px var(--amber-gutter) 60px; }
  .layout { display: grid; grid-template-areas: "today" "goals" "history" "stats"; }
  .layout > section { min-width: 0; }
  .today { grid-area: today; } .goals { grid-area: goals; } .history { grid-area: history; } .numbers { grid-area: stats; }
  @media (min-width: 900px) { .layout { grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); grid-template-areas: "today history" "goals history" "stats history"; column-gap: 28px; align-items: start; } h1 { font-size: 34px; } }
  h1 { font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; margin: 6px 0 4px; }
  .sub { color: var(--muted); font-size: 15px; margin-bottom: 22px; }
  .sub b { color: var(--amber-ink); font-weight: 600; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 0 4px 8px; }
  .card { background: var(--card); border-radius: var(--amber-radius); margin-bottom: 22px; overflow: hidden; border: 1px solid var(--line); }
  .habit { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 0.5px solid var(--line); cursor: pointer; min-height: 58px; }
  .habit:first-child { border-top: 0; }
  .name { flex: 1; font-size: 17px; min-width: 0; overflow-wrap: anywhere; }
  .streak { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .streak.hot { color: var(--amber-ink); font-weight: 600; }
  .streak svg { width: 13px; height: 13px; }
  .check { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; transition: transform .25s cubic-bezier(.34,1.56,.64,1), background .2s; flex: none; }
  .habit.done .check { background: var(--amber); border-color: var(--amber); }
  .check svg { width: 16px; height: 16px; opacity: 0; transition: opacity .15s; }
  .habit.done .check svg { opacity: 1; }
  .habit:active .check { transform: scale(0.88); }
  .pop { animation: pop .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0% { transform: scale(.7); } 100% { transform: scale(1); } }
  .goal { padding: 14px 16px; border-top: 0.5px solid var(--line); }
  .goal:first-child { border-top: 0; }
  .goalTop { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  .goalName { font-weight: 600; overflow-wrap: anywhere; }
  .goalText { color: var(--muted); font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .goal.met .goalText { color: var(--amber-ink); font-weight: 600; }
  label.goalInput { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  input[type="number"] { font: inherit; color: var(--amber-text); background: var(--empty); border: 1px solid var(--line); border-radius: var(--amber-radius-small); min-height: 44px; width: 62px; padding: 8px 10px; text-align: center; }
  .bar { margin-top: 10px; height: 8px; background: var(--empty); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; width: var(--p); background: var(--amber); border-radius: inherit; }
  .grid { padding: 14px 14px 12px; display: grid; gap: 6px; }
  .row { display: grid; grid-template-columns: 92px repeat(var(--days), minmax(0, 1fr)); gap: 4px; align-items: center; }
  @media (min-width: 900px) { .row { grid-template-columns: 120px repeat(var(--days), minmax(0, 1fr)); gap: 5px; } .grid { padding: 18px; gap: 9px; } .cell { border-radius: 4px; } }
  .row .h { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; }
  .cell { aspect-ratio: 1; border-radius: 5px; background: var(--empty); }
  .cell.on { background: var(--amber); }
  .cell.today { box-shadow: inset 0 0 0 1.5px var(--amber-ink); }
  .days .cell { background: none; font-size: 10px; color: var(--muted); text-align: center; aspect-ratio: auto; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); }
  .stat { padding: 14px 16px; border-left: 0.5px solid var(--line); }
  .stat:first-child { border-left: 0; }
  .stat .n { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat .t { font-size: 13px; color: var(--muted); }
  .foot { color: var(--muted); font-size: 13px; text-align: center; margin-top: 8px; }
  .err { color: var(--amber-danger); font-size: 14px; text-align: center; min-height: 18px; }
  .empty { padding: 30px 18px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const DONE = /^(✓|✔|x|yes|y|1|true|done)$/i;
  const flame = '<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M8.6 1c.4 2.2-.5 3.4-1.6 4.6C5.8 6.9 4 8.6 4 11a4 4 0 0 0 8 0c0-1.7-.8-2.9-1.5-3.8-.1 1-.6 1.8-1.4 2.2.5-2.8-.3-6.4-.5-8.4Z"/></svg>';
  const tick = '<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="var(--amber-on-accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const pad = (n) => String(n).padStart(2, "0");
  const dayOf = (iso, delta) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + delta); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const weekDays = (today) => { const d = new Date(today + "T12:00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); const start = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; return Array.from({ length: 7 }, (_, i) => dayOf(start, i)); };
  let popped = null, error = "";

  function model(note, data) {
    const t = note.tables.find((t) => t.columns.some((c) => /^date$/i.test(c.name)));
    if (!t) return null;
    const dateCol = t.columns.findIndex((c) => /^date$/i.test(c.name));
    const goals = ((data && data.values && data.values.goals) || {});
    const daysThisWeek = weekDays(note.today);
    const habits = t.columns.map((c, i) => ({ name: c.name, col: i })).filter((h) => h.col !== dateCol);
    const byDay = new Map(t.rows.map((r, i) => [r[dateCol], { cells: r, index: i }]));
    const done = (day, h) => { const r = byDay.get(day); return !!r && DONE.test((r.cells[h.col] || "").trim()); };
    for (const h of habits) {
      let d = done(note.today, h) ? note.today : dayOf(note.today, -1), n = 0;
      while (done(d, h)) { n++; d = dayOf(d, -1); }
      h.streak = n;
      let best = 0, run = 0;
      for (let i = -59; i <= 0; i++) { if (done(dayOf(note.today, i), h)) { run++; best = Math.max(best, run); } else run = 0; }
      h.best = best;
      h.today = done(note.today, h);
      const rawGoal = Number(goals[h.name]);
      h.goal = Number.isFinite(rawGoal) ? Math.max(0, Math.min(7, Math.round(rawGoal))) : 5;
      h.weekCount = daysThisWeek.filter((d) => done(d, h)).length;
      h.goalPct = h.goal > 0 ? Math.min(100, Math.round((h.weekCount / h.goal) * 100)) : 100;
    }
    return { t, dateCol, habits, byDay, done, daysThisWeek, goals };
  }

  function render(note, data) {
    const app = document.getElementById("app");
    const m = model(note, data);
    if (!m) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with a Date column to track habits.</div>`; return; }
    const doneToday = m.habits.filter((h) => h.today).length;
    const span = window.innerWidth >= 900 ? 28 : 14;
    const days = Array.from({ length: span }, (_, i) => dayOf(note.today, i - (span - 1)));
    const letters = days.map((d) => "SMTWTFS"[new Date(d + "T12:00:00").getDay()]);
    const goalsMet = m.habits.filter((h) => h.weekCount >= h.goal).length;
    const totalGoal = m.habits.reduce((a, h) => a + h.goal, 0);
    const totalDone = m.habits.reduce((a, h) => a + Math.min(h.weekCount, h.goal), 0);
    const goalRate = totalGoal ? Math.round((totalDone / totalGoal) * 100) : 100;
    const longest = m.habits.reduce((a, h) => (h.streak > a.streak ? h : a), m.habits[0]);
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="sub"><b>${doneToday} of ${m.habits.length}</b> done today</div>
      <div class="layout"><section class="today">
      <div class="label">Today</div>
      <div class="card">${m.habits.map((h, i) => `
        <div class="habit ${h.today ? "done" : ""}" data-i="${i}" role="button" tabindex="0" aria-label="Toggle ${esc(h.name)} today">
          <div class="name">${esc(h.name)}</div>
          <div class="streak ${h.streak >= 3 ? "hot" : ""}">${h.streak ? flame + h.streak + (h.streak === 1 ? " day" : " days") : "Start today"}</div>
          <div class="check ${popped === i ? "pop" : ""}" role="checkbox" aria-checked="${h.today}" aria-label="${esc(h.name)} today">${tick}</div>
        </div>`).join("")}
      </div><div class="err" role="alert">${esc(error)}</div></section>
      <section class="goals"><div class="label">This week's goals</div><div class="card">${m.habits.map((h, i) => `
        <div class="goal ${h.weekCount >= h.goal ? "met" : ""}">
          <div class="goalTop"><div><div class="goalName">${esc(h.name)}</div><div class="goalText">${h.weekCount} of ${h.goal} days this week${h.weekCount >= h.goal ? " · met" : ""}</div></div>
          <label class="goalInput">Goal <input type="number" min="0" max="7" step="1" value="${h.goal}" data-goal="${i}" aria-label="Weekly goal for ${esc(h.name)}"></label></div>
          <div class="bar" aria-hidden="true"><div class="fill" style="--p:${h.goalPct}%"></div></div>
        </div>`).join("")}</div></section>
      <section class="history"><div class="label">${span === 28 ? "Last four weeks" : "Last two weeks"}</div><div class="card"><div class="grid" style="--days:${span}">
        <div class="row days"><div></div>${letters.map((l) => `<div class="cell">${l}</div>`).join("")}</div>
        ${m.habits.map((h) => `<div class="row"><div class="h">${esc(h.name)}</div>${days.map((d) => `<div class="cell ${m.done(d, h) ? "on" : ""} ${d === note.today ? "today" : ""}"></div>`).join("")}</div>`).join("")}
      </div></div></section><section class="numbers"><div class="card stats">
        <div class="stat"><div class="n">${goalRate}%</div><div class="t">Goal progress</div></div>
        <div class="stat"><div class="n">${goalsMet}/${m.habits.length}</div><div class="t">Goals met</div></div>
        <div class="stat"><div class="n">${longest ? longest.streak : 0}</div><div class="t">Longest now${longest && longest.streak ? ", " + esc(longest.name) : ""}</div></div>
      </div></section></div><div class="foot">Ticks are written to the table. Goals are saved in the App side.</div>`;
    popped = null;
    app.querySelectorAll(".habit").forEach((el) => {
      const run = () => toggle(m, m.habits[+el.dataset.i], +el.dataset.i);
      el.addEventListener("click", run);
      el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); run(); } });
    });
    app.querySelectorAll("input[data-goal]").forEach((input) => input.addEventListener("change", () => saveGoal(m, m.habits[+input.dataset.goal], input.value)));
  }

  async function toggle(m, h, i) {
    const row = m.byDay.get(amber.note.today);
    const value = h.today ? "" : "✓";
    popped = i;
    const r = row ? await amber.update({ op: "set_cell", table: m.t.index, row: row.index, col: h.name, value }) : await amber.update({ op: "append_row", table: m.t.index, values: { [m.t.columns[m.dateCol].name]: amber.note.today, [h.name]: value } });
    error = r.ok ? "" : r.error;
    if (!r.ok) render(amber.note, amber.data);
  }

  async function saveGoal(m, h, value) {
    const n = Math.max(0, Math.min(7, Math.round(Number(value) || 0)));
    const next = Object.assign({}, (amber.data && amber.data.values && amber.data.values.goals) || m.goals || {});
    next[h.name] = n;
    const r = await amber.setData({ values: { goals: next } });
    error = r && r.ok === false ? r.error : "";
    if (error) render(amber.note, amber.data);
  }

  amber.onChange(render);
  let wide = window.innerWidth >= 900;
  addEventListener("resize", () => { if ((window.innerWidth >= 900) !== wide) { wide = !wide; render(amber.note, amber.data); } });
</script>
</body>
</html>
