<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-needs" content='{"keys":[{"name":"OpenWeather","hosts":["api.openweathermap.org"],"query":"appid={key}","help":"Create a free OpenWeather API key, then add it in Amber Notes Settings › API Keys."}]}'>
<style>
*{box-sizing:border-box}main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 96px}.top{display:grid;gap:14px;margin-bottom:16px}h1{font-size:30px;line-height:1.05;letter-spacing:-.03em;margin:4px 0 0}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--amber-text-secondary)}.small{font-size:13px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.hero{padding:18px}.heroGrid{display:grid;gap:16px}.temp{font-size:54px;line-height:1;font-weight:750;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.summary{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:6px 10px;border-radius:999px;background:var(--amber-accent-soft);color:var(--amber-accent-text);font-weight:650}.wxIcon{width:22px;height:22px;display:block}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.fact{background:var(--amber-fill);border-radius:var(--amber-radius-small);padding:10px}.fact b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.days{display:grid;gap:10px;padding:12px}.day{border:1px solid var(--amber-separator);border-radius:var(--amber-radius-small);padding:12px;background:var(--amber-bg)}.dayTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.dayName{font-weight:700}.temps{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}.details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.detail{background:var(--amber-fill);border-radius:var(--amber-radius-small);padding:8px;font-size:13px}.detail span{display:block;color:var(--amber-text-secondary);font-size:12px}.hours{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;margin-top:4px}.hour{flex:0 0 auto;min-width:70px;background:var(--amber-fill);border-radius:var(--amber-radius-small);padding:8px;text-align:center;font-size:12px}.hour b{display:block;font-size:14px;font-variant-numeric:tabular-nums}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}button{font:inherit;font-weight:650;min-height:44px;padding:0 16px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-accent);color:var(--amber-on-accent)}button.secondary{background:var(--amber-fill);color:var(--amber-text)}.status{min-height:20px}.err{color:var(--amber-danger)}.empty{padding:24px 16px;text-align:center;color:var(--amber-text-secondary)}.checklist{padding:6px 0}.check{display:flex;gap:10px;align-items:center;width:100%;min-height:48px;padding:10px 14px;border-top:1px solid var(--amber-separator);background:transparent;color:var(--amber-text);text-align:left;font-weight:400}.check:first-child{border-top:0}.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber-separator);background:var(--amber-fill);display:grid;place-items:center;flex:0 0 auto}.check[aria-pressed="true"] .box{background:var(--amber-accent);border-color:var(--amber-accent);color:var(--amber-on-accent)}.check[aria-pressed="true"] .label{text-decoration:line-through;color:var(--amber-text-secondary)}.grid{display:grid;gap:16px}.keyHelp{padding:14px 16px;border-top:1px solid var(--amber-separator);background:var(--amber-fill)}@media (min-width:760px){.heroGrid{grid-template-columns:1.1fr .9fr;align-items:end}.days{grid-template-columns:repeat(5,minmax(0,1fr))}.dayTop{display:block}.temps{margin-top:8px}.details{grid-template-columns:1fr}.grid{grid-template-columns:minmax(0,2fr) minmax(260px,1fr)}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let noteState=null, dataState=null, forecast=null, loading=false, error="", checklistError="";
const url="https://api.openweathermap.org/data/2.5/forecast?lat=41.1496&lon=-8.6109&units=metric&cnt=40";
function icon(kind){const k=String(kind||"").toLowerCase();if(k.includes("rain")||k.includes("drizzle"))return '<svg class="wxIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14.5a5 5 0 0 1 .9-9.9 6.5 6.5 0 0 1 12 3.4A4 4 0 0 1 19 16H8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8 19l-1 2M13 18l-1 2M18 19l-1 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';if(k.includes("cloud"))return '<svg class="wxIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a5 5 0 0 1 .9-9.9 6.5 6.5 0 0 1 12 3.4A4 4 0 0 1 19 18H7Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';if(k.includes("clear"))return '<svg class="wxIcon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';return '<svg class="wxIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17h10M5 12h14M8 7h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'}
function n(v,d=0){return Number.isFinite(v)?v.toFixed(d):"–"}function cap(s){s=String(s||"Forecast");return s.charAt(0).toUpperCase()+s.slice(1)}function labelDate(s){try{return new Intl.DateTimeFormat(undefined,{weekday:"short",month:"short",day:"numeric"}).format(new Date(s+"T12:00:00"))}catch(e){return s}}
function process(data){const groups={};(data.list||[]).forEach(x=>{const day=String(x.dt_txt||"").slice(0,10);if(!day)return;(groups[day]||(groups[day]=[])).push(x)});return Object.keys(groups).slice(0,5).map(day=>{const items=groups[day];let min=Infinity,max=-Infinity,pop=0,rain=0,wind=0;items.forEach(x=>{min=Math.min(min,Number(x.main&&x.main.temp_min));max=Math.max(max,Number(x.main&&x.main.temp_max));pop=Math.max(pop,Number(x.pop||0));rain+=Number((x.rain&&x.rain["3h"])||0);wind=Math.max(wind,Number(x.wind&&x.wind.speed)||0)});let rep=items.find(x=>String(x.dt_txt).includes("12:00:00"))||items[Math.floor(items.length/2)]||{};let w=(rep.weather&&rep.weather[0])||{};return{day,items,min,max,pop,rain,wind,main:w.main||"",desc:w.description||"Forecast"}})}
function render(){const note=noteState||amber.note||{title:"Porto weekend",checklists:[]};const days=forecast?process(forecast):[];const current=forecast&&forecast.list&&forecast.list[0];let hero="";if(loading){hero='<div class="card empty">Loading Porto forecast from OpenWeather…</div>'}else if(error){hero='<div class="card"><div class="empty err">'+esc(error)+'</div><div class="keyHelp small">This app needs an API key named <b>OpenWeather</b>. Create a free key with OpenWeather, then in Amber Notes open <b>Settings › API Keys</b>, add a key named <b>OpenWeather</b>, and paste it there.</div></div>'}else if(current){const w=(current.weather&&current.weather[0])||{};hero='<section class="card hero"><div class="heroGrid"><div><div class="muted small">Porto, Portugal · 5-day / 3-hour forecast</div><h1>'+esc(note.title)+'</h1><div class="summary"><div class="temp">'+n(Number(current.main&&current.main.temp),0)+'°</div><div><div class="badge">'+icon(w.main)+esc(cap(w.description))+'</div><div class="muted small" style="margin-top:6px">Feels like '+n(Number(current.main&&current.main.feels_like),0)+'° · Updated from OpenWeather</div></div></div></div><div class="facts"><div class="fact"><span class="muted small">Wind</span><b>'+n(Number(current.wind&&current.wind.speed),1)+' m/s</b></div><div class="fact"><span class="muted small">Humidity</span><b>'+n(Number(current.main&&current.main.humidity),0)+'%</b></div><div class="fact"><span class="muted small">Chance rain</span><b>'+n(Number(current.pop||0)*100,0)+'%</b></div><div class="fact"><span class="muted small">Next slot</span><b>'+esc(String(current.dt_txt||"").slice(11,16))+'</b></div></div></div><div class="toolbar"><button id="refresh">Refresh forecast</button><div class="status muted small">'+esc(statusText())+'</div></div></section>'}else{hero='<div class="card empty">Forecast will load when the App side opens.</div>'}const daysHtml=days.length?'<section class="card"><div class="days">'+days.map(d=>'<article class="day"><div class="dayTop"><div><div class="dayName">'+esc(labelDate(d.day))+'</div><div class="muted small">'+esc(cap(d.desc))+'</div></div><div class="temps">'+n(d.max,0)+'° / '+n(d.min,0)+'°</div></div><div class="details"><div class="detail"><span>Rain</span>'+n(d.rain,1)+' mm</div><div class="detail"><span>Chance</span>'+n(d.pop*100,0)+'%</div><div class="detail"><span>Wind</span>'+n(d.wind,1)+' m/s</div></div><div class="hours">'+d.items.slice(0,8).map(h=>'<div class="hour"><span>'+esc(String(h.dt_txt||"").slice(11,16))+'</span><b>'+n(Number(h.main&&h.main.temp),0)+'°</b><span>'+esc(cap((h.weather&&h.weather[0]&&h.weather[0].main)||""))+'</span></div>').join("")+'</div></article>').join("")+'</div></section>':'';const checks=(note.checklists||[]);const checkHtml='<section class="card"><div style="padding:14px 16px"><h2>Trip checklist</h2><div class="muted small">Tap to tick items from the note.</div></div><div class="checklist">'+(checks.length?checks.map(c=>'<button class="check" data-line="'+c.line+'" aria-pressed="'+(c.checked?'true':'false')+'"><span class="box">'+(c.checked?'✓':'')+'</span><span class="label">'+esc(c.text)+'</span></button>').join(""):'<div class="empty">No checklist items yet.</div>')+'</div>'+(checklistError?'<div class="err small" role="alert" style="padding:0 16px 14px">'+esc(checklistError)+'</div>':'')+'</section>';document.getElementById("app").innerHTML='<div class="top">'+hero+'</div><div class="grid"><div>'+daysHtml+'</div><div>'+checkHtml+'</div></div>';const r=document.getElementById("refresh");if(r)r.onclick=loadForecast;document.querySelectorAll(".check").forEach(b=>b.onclick=async()=>{const line=Number(b.dataset.line);const res=await amber.update({op:"toggle_checklist",line});checklistError=res.ok?"":(res.error||"Could not update checklist.");if(!res.ok)render()})}
function statusText(){if(!forecast||!forecast.list||!forecast.list[0])return"";return"Forecast through "+labelDate(String(forecast.list[forecast.list.length-1].dt_txt||"").slice(0,10))}
async function loadForecast(){if(loading)return;loading=true;error="";render();try{const res=await amber.fetch(url,{key:"OpenWeather"});if(!res.ok)throw new Error(res.error||("OpenWeather request failed ("+res.status+")."));let body=typeof res.body==="string"?JSON.parse(res.body):res.body;if(String(body.cod)!=="200")throw new Error(body.message||"OpenWeather did not return a forecast.");forecast=body}catch(e){error=String(e.message||e)}finally{loading=false;render()}}
amber.onChange((note,data)=>{noteState=note;dataState=data;render();if(!forecast&&!loading)loadForecast()});
</script>
</body>
</html>
