<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 48px}
h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 16px}
.days{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:14px 16px;min-width:0}
.card.today{border-color:var(--amber-accent)}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.day{font-size:18px;font-weight:700}
.badge{font-size:13px;font-weight:600;background:var(--amber-accent-soft);color:var(--amber-accent-text);border-radius:99px;padding:3px 10px;white-space:nowrap}
dl{margin:0}
.f{display:flex;gap:12px;padding:6px 0;border-top:1px solid var(--amber-separator)}
dt{flex:0 0 84px;color:var(--amber-text-secondary);font-size:14px}
dd{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.note{margin-top:8px;color:var(--amber-text-secondary);font-size:14px;overflow-wrap:anywhere}
.empty{padding:28px 16px;text-align:center;color:var(--amber-text-secondary)}
@media (min-width:600px){.days{grid-template-columns:1fr 1fr}}
@media (min-width:900px){.days{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main><h1 id="t"></h1><div class="days" id="grid"></div></main><script>
const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
amber.onChange((note)=>{
document.getElementById("t").textContent=note.title;
const g=document.getElementById("grid");
const tb=note.tables[0];
if(!tb||!tb.rows.length){g.innerHTML='<div class="card empty">Add rows to the table in the note to see your meals here.</div>';return;}
const ix=(re)=>tb.columns.findIndex((c)=>re.test(c.name));
const d=ix(/^day$/i)>=0?ix(/^day$/i):0, s=ix(/^shop$/i), n=ix(/^notes?$/i);
g.innerHTML=tb.rows.map((r)=>{
const meals=tb.columns.map((c,i)=>i).filter((i)=>i!==d&&i!==s&&i!==n&&(r[i]||"").trim());
return '<section class="card"><div class="head"><span class="day">'+esc(r[d])+'</span>'+(s>=0&&/^(yes|y|✓|x|1|true)$/i.test((r[s]||"").trim())?'<span class="badge">Shop</span>':'')+'</div><dl>'+
meals.map((i)=>'<div class="f"><dt>'+esc(tb.columns[i].name)+'</dt><dd>'+esc(r[i])+'</dd></div>').join("")+'</dl>'+
(n>=0&&(r[n]||"").trim()?'<div class="note">'+esc(r[n])+'</div>':'')+'</section>';}).join("");
});
</script></body></html>
