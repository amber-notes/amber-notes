<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 96px; }
  h1 { font-size: 30px; letter-spacing: -.02em; margin: 4px 0 4px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 22px 4px 8px; display: flex; justify-content: space-between; }
  .count { display: inline-flex; align-items: baseline; gap: 8px; background: var(--amber-accent-soft); border-radius: 14px; padding: 10px 14px; margin: 8px 0 4px; }
  .count b { font-size: 34px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); overflow: hidden; }
  .fact { display: grid; grid-template-columns: minmax(80px, 30%) 1fr; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--amber-separator); }
  .fact:first-child, .item:first-child, .idea:first-child { border-top: 0; }
  .fact dt { color: var(--amber-text-secondary); font-size: 14px; }
  .fact dd { margin: 0; overflow-wrap: anywhere; }
  .idea { padding: 12px 16px; border-top: 1px solid var(--amber-separator); overflow-wrap: anywhere; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--amber-separator); min-height: 48px; cursor: pointer; }
  .item input { width: 28px; height: 28px; flex: none; accent-color: var(--amber-accent); }
  .item.done span { color: var(--amber-text-secondary); text-decoration: line-through; }
  .muted { color: var(--amber-text-secondary); font-size: 14px; }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 18px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-accent); color: var(--amber-on-accent); }
  .rem { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 16px; }
  .rem .t { flex: 1 1 200px; }
  .err { color: var(--amber-danger); min-height: 1em; margin: 8px 4px; }
  @media (min-width: 900px) { .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const strip = (s) => String(s).replace(/\*\*|__|`/g, "").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1");
  const MON = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  let msg = "", isErr = false;

  function flight(lines, today) {
    for (const l of lines) {
      if (!/flight/i.test(l)) continue;
      const m = l.match(/(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(?:at\s+)?(\d{1,2}):(\d{2})/i);
      if (!m) continue;
      const mo = MON.indexOf(m[2].toLowerCase());
      let y = Number(today.slice(0, 4));
      const iso = (yy) => `${yy}-${String(mo + 1).padStart(2, "0")}-${String(m[1]).padStart(2, "0")}`;
      if (iso(y) < today) y++;
      return { date: iso(y), time: `${m[3].padStart(2, "0")}:${m[4]}` };
    }
    return null;
  }
  function dayBefore(iso) {
    const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - 1);
    return d.toISOString().slice(0, 10);
  }

  function render(note, data) {
    const app = document.getElementById("app");
    const lines = note.markdown.split("\n");
    const f = flight(lines, note.today);
    const days = f ? Math.round((Date.parse(f.date + "T12:00:00Z") - Date.parse(note.today + "T12:00:00Z")) / 864e5) : null;
    const facts = lines.map((l) => l.match(/^\s*([A-Za-zÅÄÖåäö][\w ÅÄÖåäö/&.-]{1,24}?)\s*:\s+(.{2,})$/)).filter(Boolean).map((m) => ({ label: m[1], value: m[2] }));
    const budget = lines.map((l) => l.match(/^\s*budget\s*(.+)$/i)).find(Boolean);
    if (budget) facts.push({ label: "Budget", value: budget[1].replace(/^[~:\s]+/, "~") });
    // plain bullets under an "ideas" line
    const ideas = [];
    const hi = lines.findIndex((l) => /^\W*ideas\W*$/i.test(l));
    if (hi >= 0) for (let k = hi + 1; k < lines.length; k++) { const m = lines[k].match(/^\s*[-*]\s+(?!\[[ xX]\])(.*)$/); if (m) ideas.push(m[1]); else if (lines[k].trim() === "" ) break; else break; }
    const groups = [];
    for (const c of note.checklists) {
      let h = "To do";
      for (let k = c.line - 2; k >= 0; k--) {
        const l = lines[k];
        if (/^\s*[-*]\s/.test(l) || l.trim() === "") continue;
        h = strip(l.replace(/^#+\s*/, "")).trim(); break;
      }
      let g = groups.find((x) => x.h === h);
      if (!g) groups.push((g = { h, items: [] }));
      g.items.push(c);
    }
    const remDate = f ? dayBefore(f.date) : null;
    const done = data && data.values && data.values.packReminder;
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      ${days !== null ? `<div class="count">${days > 0 ? `<b>${days}</b> day${days === 1 ? "" : "s"} to go` : days === 0 ? `<b>Today</b>` : `<b>${-days}</b> day${days === -1 ? "" : "s"} ago`}</div>` : ""}
      ${f ? `<h2><span>Reminder</span></h2><div class="card rem"><div class="t">Pack the evening before your flight<div class="muted">${esc(remDate)} at 19:00${done === remDate ? " · reminder set" : ""}</div></div><button id="rem" type="button">${done === remDate ? "Set again" : "Remind me to pack"}</button></div>` : `<div class="card rem"><div class="t muted">Add a flights line like "out fri 16 oct 07:10" to set a packing reminder.</div></div>`}
      <div class="err" role="alert" style="${isErr ? "" : "color:var(--amber-text-secondary)"}">${esc(msg)}</div>
      <div class="cols"><div>
      ${facts.length ? `<h2><span>At a glance</span></h2><dl class="card" style="margin:0">${facts.map((x) => `<div class="fact"><dt>${esc(strip(x.label))}</dt><dd>${esc(strip(x.value))}</dd></div>`).join("")}</dl>` : ""}
      ${ideas.length ? `<h2><span>Ideas</span></h2><div class="card">${ideas.map((i) => `<div class="idea">${esc(strip(i))}</div>`).join("")}</div>` : ""}
      </div><div>
      ${groups.map((g) => { const d = g.items.filter((c) => c.checked).length; return `<h2><span>${esc(g.h)}</span><span>${d}/${g.items.length}</span></h2>
        <div class="card">${g.items.map((c) => `<label class="item ${c.checked ? "done" : ""}"><input type="checkbox" data-line="${c.line}" ${c.checked ? "checked" : ""}><span>${esc(strip(c.text))}</span></label>`).join("")}</div>`; }).join("")}
      </div></div>`;
    app.querySelectorAll("[data-line]").forEach((box) => box.addEventListener("change", async () => {
      const r = await amber.update({ op: "toggle_checklist", line: Number(box.dataset.line) });
      isErr = !r.ok; msg = r.ok ? "" : r.error;
      if (!r.ok) render(amber.note, amber.data);
    }));
    const b = document.getElementById("rem");
    if (b) b.onclick = async () => {
      const r = await amber.device.reminders.create({ title: "Pack for Porto (flight tomorrow " + f.time + ")", due: remDate + "T19:00:00" });
      if (r && r.ok) { await amber.store.set("packReminder", remDate); isErr = false; msg = "Reminder set for " + remDate + " at 19:00."; }
      else { isErr = true; msg = (r && r.error) || "Could not set the reminder."; render(amber.note, amber.data); }
    };
  }
  amber.onChange(render);
</script>
</body>
</html>
