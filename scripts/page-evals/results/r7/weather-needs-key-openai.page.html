<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-needs" content='{"hosts":["api.openweathermap.org"],"keys":[{"name":"OpenWeather","hosts":["api.openweathermap.org"],"query":"appid={key}","help":"Create a free OpenWeather API key, then add it in Amber Notes Settings / API Keys."}]}'>
<style>
*{box-sizing:border-box}main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 88px}header{display:flex;flex-direction:column;gap:12px;margin:2px 0 18px}.kicker{color:var(--amber-accent-text);font-weight:700;font-size:14px;letter-spacing:.02em;text-transform:uppercase}h1{font-size:30px;line-height:1.05;letter-spacing:-.03em;margin:0}.muted{color:var(--amber-text-secondary)}.top{display:grid;gap:14px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.hero{padding:18px}.heroMain{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.temp{font-family:var(--amber-font-rounded);font-size:52px;line-height:.95;font-weight:800;letter-spacing:-.05em}.desc{text-transform:capitalize;font-size:18px;font-weight:700;margin-top:6px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.pill{display:inline-flex;align-items:center;min-height:34px;padding:7px 10px;border-radius:999px;background:var(--amber-fill);color:var(--amber-text-secondary);font-size:14px}.updated{font-size:14px;color:var(--amber-text-secondary);margin-top:12px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{font:inherit;font-weight:700;min-height:44px;padding:0 15px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-accent);color:var(--amber-on-accent)}.btn.secondary{background:var(--amber-fill);color:var(--amber-text)}.grid{display:grid;gap:12px}.day{padding:14px}.dayHead{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--amber-separator);padding-bottom:10px;margin-bottom:10px}.dayName{font-weight:800}.range{font-variant-numeric:tabular-nums;font-weight:800}.summary{text-transform:capitalize;color:var(--amber-text-secondary);font-size:14px}.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.slot{background:var(--amber-fill);border-radius:var(--amber-radius-small);padding:9px;min-height:64px}.time{font-size:13px;color:var(--amber-text-secondary);font-variant-numeric:tabular-nums}.slotTemp{font-weight:800;font-variant-numeric:tabular-nums}.slotDesc{font-size:13px;color:var(--amber-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:capitalize}.state{padding:28px 16px;text-align:center;color:var(--amber-text-secondary)}.state strong{display:block;color:var(--amber-text);font-size:18px;margin-bottom:6px}.err{color:var(--amber-danger)}.small{font-size:14px;line-height:1.35}.noteBits{padding:14px 16px}.checklist{display:grid;gap:8px;margin-top:10px}.check{display:flex;gap:9px;align-items:center;color:var(--amber-text-secondary);font-size:14px}.dot{width:9px;height:9px;border-radius:50%;background:var(--amber-accent);flex:0 0 auto}.dot.open{background:var(--amber-separator);border:1px solid var(--amber-text-secondary)}@media (min-width:700px){.top{grid-template-columns:1.2fr .8fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.slots{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (min-width:1050px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.slots{grid-template-columns:1fr}.day{min-height:100%}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let forecast=null,loading=false,error="",lastNote=null,loadedAt="";
function timeFrom(dt){return String(dt||"").slice(11,16)}
function dateFrom(dt){return String(dt||"").slice(0,10)}
function niceDate(iso){const d=new Date(iso+"T12:00:00");return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
function hm(){return new Date().toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}
function parseBody(body){return typeof body==="string"?JSON.parse(body):body}
function groupDays(data){const groups=[],by={};(data.list||[]).forEach(item=>{const k=dateFrom(item.dt_txt);if(!by[k]){by[k]=[];groups.push({date:k,items:by[k]})}by[k].push(item)});return groups.slice(0,5).map(g=>{const temps=g.items.map(x=>Number(x.main&&x.main.temp)).filter(Number.isFinite);const mins=g.items.map(x=>Number(x.main&&x.main.temp_min)).filter(Number.isFinite);const maxs=g.items.map(x=>Number(x.main&&x.main.temp_max)).filter(Number.isFinite);const noon=g.items.find(x=>/12:00:00$/.test(x.dt_txt))||g.items[Math.floor(g.items.length/2)]||g.items[0];return{date:g.date,items:g.items,min:Math.round(Math.min(...(mins.length?mins:temps))),max:Math.round(Math.max(...(maxs.length?maxs:temps))),summary:noon&&noon.weather&&noon.weather[0]?noon.weather[0].description:""}})}
function current(data){const item=(data.list||[])[0]||{};const w=item.weather&&item.weather[0]||{};return{temp:Math.round(Number(item.main&&item.main.temp)||0),feels:Math.round(Number(item.main&&item.main.feels_like)||0),desc:w.description||"forecast",wind:item.wind?Math.round(item.wind.speed):"",humidity:item.main?Math.round(item.main.humidity):"",time:item.dt_txt||""}}
function checklist(note){const items=(note.checklists||[]).slice(0,4);if(!items.length)return"";return`<div class="checklist">${items.map(i=>`<div class="check"><span class="dot ${i.checked?"":"open"}"></span><span>${esc(i.text)}</span></div>`).join("")}</div>`}
function render(note){lastNote=note;const app=document.getElementById("app"),title=esc(note.title||"Porto weekend");const noteCard=`<section class="card noteBits"><div class="kicker">Trip note</div><div class="small muted">5-day forecast for Porto, Portugal, using OpenWeather.</div>${checklist(note)}</section>`;let body="";if(loading){body=`<section class="card state"><strong>Loading Porto forecast…</strong><div>Asking OpenWeather for the next 5 days.</div></section>`}else if(error){body=`<section class="card state"><strong>Forecast unavailable</strong><div class="err small">${esc(error)}</div><div class="small" style="margin-top:10px">If this is the first run, add an API key named <strong>OpenWeather</strong> in Amber Notes Settings › API Keys, then reopen the App side.</div></section>`}else if(forecast){const c=current(forecast),days=groupDays(forecast);body=`<section class="card hero"><div class="heroMain"><div><div class="kicker">Porto now</div><div class="temp">${esc(c.temp)}°</div><div class="desc">${esc(c.desc)}</div></div></div><div class="meta"><span class="pill">Feels ${esc(c.feels)}°</span><span class="pill">Wind ${esc(c.wind)} m/s</span><span class="pill">Humidity ${esc(c.humidity)}%</span></div><div class="updated">Updated ${esc(loadedAt)} · Next slot ${esc(timeFrom(c.time))}</div></section><section class="grid">${days.map(d=>`<article class="card day"><div class="dayHead"><div><div class="dayName">${esc(niceDate(d.date))}</div><div class="summary">${esc(d.summary)}</div></div><div class="range">${esc(d.max)}° / ${esc(d.min)}°</div></div><div class="slots">${d.items.slice(0,6).map(s=>`<div class="slot"><div class="time">${esc(timeFrom(s.dt_txt))}</div><div class="slotTemp">${esc(Math.round(Number(s.main&&s.main.temp)||0))}°</div><div class="slotDesc">${esc(s.weather&&s.weather[0]?s.weather[0].description:"")}</div></div>`).join("")}</div></article>`).join("")}</section>`}else{body=`<section class="card state"><strong>Ready to load Porto weather</strong><div>The forecast loads automatically when the App side opens.</div></section>`}app.innerHTML=`<header><div><div class="kicker">Weekend weather</div><h1>${title}</h1></div></header><div class="top">${body}${noteCard}</div>`}
async function fetchForecast(){if(loading)return;loading=true;error="";render(lastNote||amber.note);try{const host="api.openweathermap.org";const url=["https:","",host,"data","2.5","forecast"].join("/")+"?q=Porto,PT&units=metric";const res=await amber.fetch(url,{key:"OpenWeather"});if(!res||!res.ok){throw new Error(res&&res.status===401?"OpenWeather rejected the API key. Check that the key named OpenWeather is correct and active.":(res&&res.error)||("OpenWeather request failed"+(res&&res.status?" ("+res.status+")":"")))}const data=parseBody(res.body);if(!data||!Array.isArray(data.list))throw new Error("OpenWeather returned an unexpected forecast response.");forecast=data;loadedAt=hm()}catch(e){error=e&&e.message?e.message:String(e)}finally{loading=false;render(lastNote||amber.note)}}
amber.onChange(note=>{render(note);if(!forecast&&!loading&&!error)fetchForecast()});
</script>
</body>
</html>
