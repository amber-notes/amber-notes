<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-needs" content='{"hosts":["api.openweathermap.org"],"keys":[{"name":"OpenWeather","hosts":["api.openweathermap.org"],"query":"appid={key}","help":"Sign up free at openweathermap.org, then copy your key from My API keys."}]}'>
<style>
* { box-sizing: border-box; }
main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 80px; }
h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 4px; }
h2 { font-size: 17px; margin: 24px 0 10px; }
.muted { color: var(--amber-text-secondary); font-size: 14px; }
.card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); overflow: hidden; }
.days { display: grid; grid-template-columns: 1fr; gap: 10px; }
.day { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
.day.trip { border-color: var(--amber-accent); background: var(--amber-accent-soft); }
.day .d { flex: 1; min-width: 0; }
.day .name { font-weight: 600; }
.temp { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600; text-align: right; }
.temp small { font-size: 15px; color: var(--amber-text-secondary); font-weight: 400; }
svg { width: 40px; height: 40px; flex: none; color: var(--amber-accent-text); }
@media (min-width: 700px) { .days { grid-template-columns: repeat(5, 1fr); } .day { flex-direction: column; text-align: center; align-items: center; } .temp { text-align: center; } }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--amber-separator); min-height: 48px; }
.row:first-child { border-top: 0; }
button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-fill); color: var(--amber-text); }
.msg { padding: 16px; }
.err { color: var(--amber-danger); }
.chk { background: none; color: var(--amber-text); text-align: left; flex: 1; padding: 0; display: flex; gap: 12px; align-items: center; font-weight: 400; }
.box { width: 22px; height: 22px; border: 2px solid var(--amber-text-secondary); border-radius: 6px; flex: none; display: grid; place-items: center; font-size: 14px; line-height: 1; }
.box.on { background: var(--amber-text); border-color: var(--amber-text); color: var(--amber-bg); }
.done { text-decoration: line-through; color: var(--amber-text-secondary); }
</style>
</head>
<body>
<main>
  <h1 id="title">Porto weekend</h1>
  <div class="muted" id="sub"></div>
  <h2>5-day forecast</h2>
  <div id="fc"></div>
  <h2>To do before</h2>
  <div class="card" id="todo"></div>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const icons = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
  cloud: '<path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z"/>',
  rain: '<path d="M7 14h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 7a3.5 3.5 0 0 0 1 7z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/>',
  snow: '<path d="M12 3v18M4 7.5l16 9M20 7.5l-16 9"/>',
  storm: '<path d="M7 13h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 6a3.5 3.5 0 0 0 1 7z"/><path d="M12 13l-2 4h4l-2 4"/>',
  mist: '<path d="M4 8h16M6 12h12M4 16h16"/>'
};
const icon = main => { const k = main==="Clear"?"sun":main==="Clouds"?"cloud":main==="Rain"||main==="Drizzle"?"rain":main==="Snow"?"snow":main==="Thunderstorm"?"storm":"mist";
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[k]}</svg>`; };
const fmt = d => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
let forecast = null, status = "loading", note = null;

function tripDates(md) {
  const m = md.match(/out\s+\w+\s+(\d{1,2})\s+(\w{3})\w*.*?back\s+\w+\s+(\d{1,2})\s+(\w{3})/i);
  if (!m) return [];
  const mons = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  const y = (note.today || "2026").slice(0, 4);
  const mk = (d, mo) => `${y}-${String(mons.indexOf(mo.toLowerCase()) + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  const a = mk(m[1], m[2]), b = mk(m[3], m[4]), out = [];
  for (let d = new Date(a + "T12:00:00"); d <= new Date(b + "T12:00:00"); d.setDate(d.getDate() + 1)) out.push(d.toISOString().slice(0, 10));
  return out;
}

function drawForecast() {
  const el = document.getElementById("fc");
  if (status === "loading") { el.innerHTML = '<div class="card msg muted">Loading forecast…</div>'; return; }
  if (status !== "ok") { el.innerHTML = `<div class="card msg"><div class="err" role="alert">${esc(status)}</div><p><button id="retry">Try again</button></p></div>`; document.getElementById("retry").onclick = load; return; }
  const trip = tripDates(note.markdown);
  const by = {};
  for (const e of forecast.list) {
    const d = e.dt_txt.slice(0, 10);
    (by[d] = by[d] || []).push(e);
  }
  const days = Object.keys(by).sort().slice(0, 5).map(d => {
    const es = by[d];
    const mid = es.reduce((a, e) => Math.abs(+e.dt_txt.slice(11, 13) - 13) < Math.abs(+a.dt_txt.slice(11, 13) - 13) ? e : a);
    return { d, hi: Math.round(Math.max(...es.map(e => e.main.temp_max))), lo: Math.round(Math.min(...es.map(e => e.main.temp_min))),
      main: mid.weather[0].main, desc: mid.weather[0].description, pop: Math.round(Math.max(...es.map(e => e.pop || 0)) * 100) };
  });
  el.innerHTML = '<div class="days">' + days.map(x => `<div class="day${trip.includes(x.d) ? " trip" : ""}">${icon(x.main)}<div class="d"><div class="name">${esc(fmt(x.d))}${x.d === note.today ? " · today" : ""}</div><div class="muted">${esc(x.desc)} · ${x.pop}% rain${trip.includes(x.d) ? " · trip" : ""}</div></div><div class="temp">${x.hi}°<small> / ${x.lo}°</small></div></div>`).join("") + '</div>' +
    (trip.length && days.length && trip[0] > days[days.length - 1].d ? `<p class="muted">Your trip (${esc(fmt(trip[0]))} – ${esc(fmt(trip[trip.length - 1]))}) is beyond this 5-day forecast; check back closer to the date.</p>` : "");
}

async function load() {
  status = "loading"; drawForecast();
  try {
    const r = await amber.fetch("https://api.openweathermap.org/data/2.5/forecast?q=Porto,PT&units=metric", { key: "OpenWeather" });
    if (!r.ok) status = r.status === 401 ? "OpenWeather rejected the key. In Amber Notes open Settings › API Keys and check the key named OpenWeather (new keys can take a couple of hours to activate)." : (r.error || "Could not load the forecast (status " + r.status + ").");
    else { forecast = typeof r.body === "string" ? JSON.parse(r.body) : r.body; status = forecast && forecast.list ? "ok" : "Unexpected answer from OpenWeather."; }
  } catch (e) { status = "Could not load the forecast: " + e.message; }
  drawForecast();
}

function drawTodo() {
  const el = document.getElementById("todo");
  const cl = note.checklists;
  el.innerHTML = cl.length ? cl.map(c => `<div class="row"><button class="chk" data-line="${c.line}" aria-pressed="${c.checked}"><span class="box${c.checked ? " on" : ""}">${c.checked ? "✓" : ""}</span><span class="${c.checked ? "done" : ""}">${esc(c.text)}</span></button></div>`).join("") : '<div class="msg muted">Nothing to do.</div>';
  el.querySelectorAll("button").forEach(b => b.onclick = () => amber.update({ op: "toggle_checklist", line: +b.dataset.line }));
}

let started = false;
amber.onChange(n => {
  note = n;
  document.getElementById("title").textContent = n.title;
  const f = (n.markdown.match(/^flights:\s*(.+)$/im) || [])[1];
  document.getElementById("sub").textContent = f || "";
  drawTodo();
  if (!started) { started = true; load(); } else if (status === "ok") drawForecast();
});
</script>
</body>
</html>
