<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;padding:22px 0 90px;font-family:var(--amber-font);color:var(--amber-text)}.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:0 var(--amber-gutter)}header{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:0 0 16px}.eyebrow{color:var(--amber-text-secondary);font-size:13px;font-weight:650;letter-spacing:.05em;text-transform:uppercase}h1{font-size:34px;line-height:1.05;letter-spacing:-.035em;margin:4px 0 0}h2{font-size:14px;line-height:1.25;margin:0;color:var(--amber-text-secondary);letter-spacing:.04em;text-transform:uppercase}.grid{display:grid;grid-template-columns:1fr;gap:12px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:16px;overflow:hidden}.stat{min-height:122px;display:flex;flex-direction:column;justify-content:space-between}.label{font-size:13px;color:var(--amber-text-secondary);font-weight:600}.value{font-size:32px;line-height:1.05;letter-spacing:-.03em;font-weight:750;font-variant-numeric:tabular-nums}.sub{font-size:14px;color:var(--amber-text-secondary);margin-top:4px}.big{font-size:46px}.section{margin-top:22px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px 9px}.pill{border-radius:999px;background:var(--amber-accent-soft);color:var(--amber-accent-text);padding:5px 10px;font-size:13px;font-weight:650}.bars{height:190px;display:flex;align-items:flex-end;gap:8px;padding:14px 2px 0}.bar-wrap{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px}.bar{width:100%;max-width:46px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--amber-accent),var(--amber-accent-soft));min-height:3px}.bar.current{background:var(--amber-text)}.bar-label{font-size:12px;color:var(--amber-text-secondary);font-variant-numeric:tabular-nums;white-space:nowrap}.table{padding:0}.run-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:13px 16px;border-top:1px solid var(--amber-separator)}.run-row:first-child{border-top:0}.date{font-weight:650}.nums{font-variant-numeric:tabular-nums;text-align:right}.muted{color:var(--amber-text-secondary)}.trend{height:170px;position:relative;margin-top:8px}.spark{width:100%;height:150px;display:block}.dot{fill:var(--amber-accent)}.line{fill:none;stroke:var(--amber-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.axis{stroke:var(--amber-separator);stroke-width:1}.empty{padding:26px 16px;text-align:center;color:var(--amber-text-secondary)}form{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:13px;color:var(--amber-text-secondary);font-weight:600}input{width:100%;min-height:44px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-fill);color:var(--amber-text);font:inherit;font-size:16px;padding:10px 12px}button{grid-column:1/-1;min-height:46px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-text);color:var(--amber-bg);font:inherit;font-weight:750}.err{min-height:1.2em;color:var(--amber-danger);font-size:14px;margin-top:10px}.help{font-size:13px;color:var(--amber-text-secondary);margin-top:10px}@media (min-width:700px){.grid.stats{grid-template-columns:repeat(4,1fr)}.grid.two{grid-template-columns:1.35fr .9fr}.big{font-size:54px}}@media (max-width:430px){.run-row{grid-template-columns:1fr auto}.pace{display:none}form{grid-template-columns:1fr}h1{font-size:30px}.value{font-size:29px}.big{font-size:42px}}
</style>
</head>
<body><main class="wrap" id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return Number.isFinite(n)?n:0};
const col=(t,re)=>t.columns.findIndex(c=>re.test(c.name));
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const monday=iso=>{const d=new Date(iso+"T12:00:00Z");return addDays(iso,-((d.getUTCDay()+6)%7))};
const fmt=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:1});
const pace=(mins,km)=>km>0&&mins>0?`${Math.floor(mins/km)}:${String(Math.round((mins/km%1)*60)).padStart(2,"0")}/km`:"–";
let error="";
function prep(note){
 const t=note.tables.find(x=>col(x,/date|activity/i)>=0&&col(x,/dist|km/i)>=0)||note.tables[0];
 if(!t)return null;
 const date=col(t,/^activity date$|^date$/i),dist=col(t,/distance|\bkm\b/i),time=col(t,/moving time|minutes|\bmin\b|duration|time/i),hr=col(t,/avg hr|heart|hr/i);
 if(date<0||dist<0)return null;
 const rows=t.rows.map((r,i)=>({i,date:String(r[date]||""),km:num(r[dist]),min:time>=0?num(r[time]):0,hr:hr>=0?num(r[hr]):0})).filter(r=>/^\d{4}-\d{2}-\d{2}$/.test(r.date)).sort((a,b)=>a.date.localeCompare(b.date));
 return {t,date,dist,time,hr,rows};
}
function render(note,data){
 const app=document.getElementById("app"), p=prep(note);
 if(!p){app.innerHTML=`<header><div><div class="eyebrow">Run log</div><h1>${esc(note.title)}</h1></div></header><div class="card empty">Add a table with Activity Date and Distance columns to see your running dashboard.</div>`;return}
 const {t,date,dist,time,hr,rows}=p, total=rows.reduce((s,r)=>s+r.km,0), mins=rows.reduce((s,r)=>s+r.min,0), avgHrRows=rows.filter(r=>r.hr>0), avgHr=avgHrRows.length?avgHrRows.reduce((s,r)=>s+r.hr,0)/avgHrRows.length:0, latest=rows[rows.length-1];
 const thisStart=monday(note.today), thisRows=rows.filter(r=>r.date>=thisStart&&r.date<addDays(thisStart,7)), thisKm=thisRows.reduce((s,r)=>s+r.km,0);
 const weeks=Array.from({length:8},(_,k)=>addDays(thisStart,(k-7)*7));
 const wk=weeks.map(w=>{const rs=rows.filter(r=>r.date>=w&&r.date<addDays(w,7));return {w,km:rs.reduce((s,r)=>s+r.km,0),n:rs.length}}), max=Math.max(1,...wk.map(w=>w.km));
 const recent=rows.slice().reverse().slice(0,10);
 const hrRows=rows.filter(r=>r.hr>0).slice(-14), hmin=Math.min(...hrRows.map(r=>r.hr),120), hmax=Math.max(...hrRows.map(r=>r.hr),160), pts=hrRows.map((r,i)=>{const x=hrRows.length<2?50:5+i*(90/(hrRows.length-1));const y=135-((r.hr-hmin)/Math.max(1,hmax-hmin))*115;return `${x},${y}`}).join(" ");
 app.innerHTML=`<header><div><div class="eyebrow">Running dashboard</div><h1>${esc(note.title)}</h1></div><div class="pill">${rows.length} runs imported</div></header>
 <section class="grid stats"><div class="card stat"><div class="label">Total distance</div><div><div class="value big">${fmt(total)} km</div><div class="sub">since ${esc(rows[0]?.date||"")}</div></div></div><div class="card stat"><div class="label">This week</div><div><div class="value">${fmt(thisKm)} km</div><div class="sub">${thisRows.length} run${thisRows.length===1?"":"s"}</div></div></div><div class="card stat"><div class="label">Average pace</div><div><div class="value">${esc(pace(mins,total))}</div><div class="sub">${fmt(mins)} moving min</div></div></div><div class="card stat"><div class="label">Average HR</div><div><div class="value">${avgHr?Math.round(avgHr):"–"} bpm</div><div class="sub">latest ${latest&&latest.hr?Math.round(latest.hr)+" bpm":"–"}</div></div></div></section>
 <section class="section grid two"><div><div class="section-head"><h2>Weekly distance</h2><span class="muted">last 8 weeks</span></div><div class="card"><div class="bars" role="img" aria-label="Weekly kilometres: ${esc(wk.map(w=>fmt(w.km)).join(", "))}">${wk.map((w,i)=>`<div class="bar-wrap"><div class="bar ${i===7?"current":""}" title="${esc(w.w)}: ${fmt(w.km)} km" style="height:${Math.max(3,Math.round(w.km/max*150))}px"></div><div class="bar-label">${Number(w.w.slice(5,7))}/${w.w.slice(8)}</div></div>`).join("")}</div></div></div><div><div class="section-head"><h2>Heart rate</h2><span class="muted">recent avg</span></div><div class="card trend">${hrRows.length?`<svg class="spark" viewBox="0 0 100 150" preserveAspectRatio="none" role="img" aria-label="Recent average heart rate"><line class="axis" x1="0" x2="100" y1="135" y2="135"></line><polyline class="line" points="${pts}"></polyline>${hrRows.map((r,i)=>{const x=hrRows.length<2?50:5+i*(90/(hrRows.length-1));const y=135-((r.hr-hmin)/Math.max(1,hmax-hmin))*115;return `<circle class="dot" cx="${x}" cy="${y}" r="2.4"></circle>`}).join("")}</svg><div class="sub">Range ${Math.round(hmin)}–${Math.round(hmax)} bpm</div>`:`<div class="empty">No HR values yet.</div>`}</div></div></section>
 <section class="section grid two"><div><div class="section-head"><h2>Recent runs</h2><span class="muted">latest first</span></div><div class="card table">${recent.length?recent.map(r=>`<div class="run-row"><div><div class="date">${esc(r.date)}</div><div class="sub">${r.min?fmt(r.min)+" min": "Moving time not set"}${r.hr?` · ${Math.round(r.hr)} bpm`:""}</div></div><div class="nums"><strong>${fmt(r.km)}</strong> km</div><div class="nums pace">${esc(pace(r.min,r.km))}</div></div>`).join(""):`<div class="empty">No runs yet.</div>`}</div></div><div><div class="section-head"><h2>Log a run</h2></div><div class="card"><form id="runForm"><label>${esc(t.columns[date].name)}<input name="date" type="date" required value="${esc(note.today)}"></label><label>${esc(t.columns[dist].name)}<input name="dist" inputmode="decimal" placeholder="5.0"></label>${time>=0?`<label>${esc(t.columns[time].name)}<input name="time" inputmode="numeric" placeholder="30"></label>`:""}${hr>=0?`<label>${esc(t.columns[hr].name)}<input name="hr" inputmode="numeric" placeholder="145"></label>`:""}<button>Add run</button></form><div class="err" role="alert">${esc(error)}</div><div class="help">New runs are added to the table in the Text side.</div></div></div></section>`;
 document.getElementById("runForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const values={};values[t.columns[date].name]=String(f.get("date")||note.today);values[t.columns[dist].name]=String(f.get("dist")||"").replace(",",".").trim();if(time>=0)values[t.columns[time].name]=String(f.get("time")||"").trim();if(hr>=0)values[t.columns[hr].name]=String(f.get("hr")||"").trim();const res=await amber.update({op:"append_row",table:t.index,values});error=res.ok?"":res.error;render(amber.note,amber.data)};
}
amber.onChange(render);
</script></body></html>
