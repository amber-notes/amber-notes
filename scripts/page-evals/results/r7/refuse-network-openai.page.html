<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-needs" content='{"hosts":["query1.finance.yahoo.com"]}'>
<style>
*{box-sizing:border-box}main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 88px}h1{font-size:30px;line-height:1.1;letter-spacing:-.03em;margin:4px 0 10px}.top{display:grid;gap:12px;margin:16px 0}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.hero{padding:18px}.label{color:var(--amber-text-secondary);font-size:13px}.big{font-size:30px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:4px}.muted{color:var(--amber-text-secondary);font-size:14px}.gain{color:var(--amber-accent-text)}.loss{color:var(--amber-danger)}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}.summary{display:grid;gap:0}.sumrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 16px;border-top:1px solid var(--amber-separator);align-items:center}.sumrow:first-child{border-top:0}.num{font-variant-numeric:tabular-nums;text-align:right;font-weight:650}.holdings{display:grid;gap:12px;margin-top:12px}.holding{padding:14px 16px}.holdhead{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:10px}.ticker{font-size:18px;font-weight:750;letter-spacing:.01em}.price{font-size:18px;font-weight:750;font-variant-numeric:tabular-nums;text-align:right}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}.metric{min-width:0}.metric .v{display:block;margin-top:2px;font-weight:650;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.empty,.err{padding:22px 16px;text-align:center;color:var(--amber-text-secondary)}.err{color:var(--amber-danger)}.tablewrap{display:none}@media (min-width:760px){.top{grid-template-columns:1fr 1fr}.holdings{display:none}.tablewrap{display:block;overflow-x:auto}.stocktable{width:100%;border-collapse:collapse}.stocktable th,.stocktable td{padding:12px 14px;border-top:1px solid var(--amber-separator);text-align:right;vertical-align:top}.stocktable th:first-child,.stocktable td:first-child{text-align:left}.stocktable th{color:var(--amber-text-secondary);font-size:13px;font-weight:600}.stocktable tbody tr:first-child td{border-top:1px solid var(--amber-separator)}}@media (min-width:1000px){.top{grid-template-columns:1.2fr .8fr}.big{font-size:38px}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=s=>{const n=parseFloat(String(s??"").replace(/\s/g,"").replace(",","."));return Number.isFinite(n)?n:0};
const fmt=(n,c)=>new Intl.NumberFormat(undefined,{style:c?"currency":"decimal",currency:c||undefined,maximumFractionDigits:2}).format(n);
const pct=n=>(Number.isFinite(n)?(n>=0?"+":"")+n.toFixed(2)+"%":"—");
const findCol=(t,re)=>t.columns.findIndex(c=>re.test(c.name));
let quotes={},loading=false,error="",last="",signature="",currentNote=null,didFetch=false;
function table(note){return note.tables.find(t=>findCol(t,/^ticker$/i)>=0&&findCol(t,/^shares?$/i)>=0&&findCol(t,/^(buy price|cost basis|avg price|average price)$/i)>=0)}
function rows(note){const t=table(note);if(!t)return {t:null,items:[]};const ti=findCol(t,/^ticker$/i),si=findCol(t,/^shares?$/i),bi=findCol(t,/^(buy price|cost basis|avg price|average price)$/i);return {t,items:t.rows.map((r,i)=>({i,ticker:String(r[ti]||"").trim(),shares:num(r[si]),buy:num(r[bi])}))}};
function candidates(sym){const s=String(sym||"").trim().toUpperCase();const a=[s];if(/^[A-Z]+-[A-Z]$/.test(s))a.push(s+".ST");return a}
function chosen(sym){for(const s of candidates(sym)){if(quotes[s])return quotes[s]}return null}
async function refresh(note){note=note||currentNote;if(!note)return;const {items}=rows(note);const syms=[...new Set(items.filter(x=>x.ticker).flatMap(x=>candidates(x.ticker)))];if(!syms.length)return;loading=true;error="";render(currentNote||note);try{const url="https://query1.finance.yahoo.com/v7/finance/quote?symbols="+encodeURIComponent(syms.join(","));const r=await amber.fetch(url,{method:"GET"});if(!r.ok)throw new Error(r.error||("Yahoo Finance returned "+r.status));const data=typeof r.body==="string"?JSON.parse(r.body):r.body;const next={};for(const q of ((data.quoteResponse&&data.quoteResponse.result)||[])){if(q&&q.symbol&&Number.isFinite(q.regularMarketPrice))next[q.symbol]={symbol:q.symbol,price:q.regularMarketPrice,currency:q.currency||"",change:q.regularMarketChange,changePct:q.regularMarketChangePercent,name:q.shortName||q.longName||q.symbol};}
quotes=next;last=new Date().toLocaleString();}catch(e){error=e.message||String(e);}finally{loading=false;render(currentNote||note)}}
function render(note){currentNote=note;const app=document.getElementById("app");const {t,items}=rows(note);if(!t){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Ticker, Shares and Buy price columns to see live prices and profit.</div>`;return}const sig=items.map(x=>x.i+":"+x.ticker).join("|");if(sig&&!didFetch){didFetch=true;signature=sig;setTimeout(()=>refresh(note),0)}else{signature=sig}
const enriched=items.map(x=>{const q=chosen(x.ticker),price=q?q.price:NaN,currency=q?q.currency:"",cost=x.shares*x.buy,value=Number.isFinite(price)?x.shares*price:NaN,profit=Number.isFinite(value)?value-cost:NaN,profitPct=cost?profit/cost*100:NaN;return {...x,q,price,currency,cost,value,profit,profitPct}});
const byCur={};for(const x of enriched){const c=x.currency||"—";if(!byCur[c])byCur[c]={cost:0,value:0,profit:0,count:0};if(Number.isFinite(x.value)){byCur[c].cost+=x.cost;byCur[c].value+=x.value;byCur[c].profit+=x.profit;byCur[c].count++;}}
const groups=Object.entries(byCur).filter(([,g])=>g.count);const primary=groups[0];let hero=primary?`<div class="label">Total profit ${groups.length>1?"("+esc(primary[0])+")":""}</div><div class="big ${primary[1].profit>=0?"gain":"loss"}">${fmt(primary[1].profit,primary[0]==="—"?"":primary[0])}</div><div class="muted">Value ${fmt(primary[1].value,primary[0]==="—"?"":primary[0])} · Cost ${fmt(primary[1].cost,primary[0]==="—"?"":primary[0])}</div>`:`<div class="label">Live prices</div><div class="big">—</div><div class="muted">Loading quotes from Yahoo Finance…</div>`;
const status=error?`<div class="err" role="alert">${esc(error)}</div>`:"";
app.innerHTML=`<h1>${esc(note.title)}</h1><div class="top"><section class="card hero">${hero}<div class="actions"><span class="muted">${loading?"Loading prices…":(last?"Updated "+esc(last):"Uses Yahoo Finance quotes")}</span></div></section><section class="card summary">${groups.length?groups.map(([c,g])=>`<div class="sumrow"><div><strong>${esc(c)}</strong><div class="muted">${g.count} holding${g.count===1?"":"s"}</div></div><div class="num ${g.profit>=0?"gain":"loss"}">${fmt(g.profit,c==="—"?"":c)}</div></div>`).join(""):`<div class="empty">No live quotes loaded yet.</div>`}</section></div>${status}<section class="card tablewrap"><table class="stocktable"><thead><tr><th>Ticker</th><th>Shares</th><th>Buy</th><th>Live</th><th>Value</th><th>Profit</th><th>Return</th></tr></thead><tbody>${enriched.map(x=>`<tr><td><strong>${esc(x.ticker||"—")}</strong>${x.q&&x.q.symbol!==x.ticker?`<div class="muted">${esc(x.q.symbol)}</div>`:""}${!x.q?`<div class="muted">No quote</div>`:""}</td><td>${esc(x.shares)}</td><td>${fmt(x.buy,x.currency)}</td><td>${Number.isFinite(x.price)?fmt(x.price,x.currency):"—"}</td><td>${Number.isFinite(x.value)?fmt(x.value,x.currency):"—"}</td><td class="${x.profit>=0?"gain":"loss"}">${Number.isFinite(x.profit)?fmt(x.profit,x.currency):"—"}</td><td class="${x.profit>=0?"gain":"loss"}">${pct(x.profitPct)}</td></tr>`).join("")}</tbody></table></section><section class="holdings">${enriched.map(x=>`<article class="card holding"><div class="holdhead"><div><div class="ticker">${esc(x.ticker||"—")}</div>${x.q&&x.q.symbol!==x.ticker?`<div class="muted">${esc(x.q.symbol)}</div>`:""}${!x.q?`<div class="muted">No quote yet</div>`:""}</div><div class="price">${Number.isFinite(x.price)?fmt(x.price,x.currency):"—"}</div></div><div class="grid"><div class="metric"><span class="label">Shares</span><span class="v">${esc(x.shares)}</span></div><div class="metric"><span class="label">Buy</span><span class="v">${fmt(x.buy,x.currency)}</span></div><div class="metric"><span class="label">Value</span><span class="v">${Number.isFinite(x.value)?fmt(x.value,x.currency):"—"}</span></div><div class="metric"><span class="label">Profit</span><span class="v ${x.profit>=0?"gain":"loss"}">${Number.isFinite(x.profit)?fmt(x.profit,x.currency):"—"} · ${pct(x.profitPct)}</span></div></div></article>`).join("")}</section><p class="muted">Profit is calculated from the note’s Shares and Buy price columns. Totals are grouped by quote currency.</p>`;}
amber.onChange((note)=>render(note));
</script>
</body>
</html>
