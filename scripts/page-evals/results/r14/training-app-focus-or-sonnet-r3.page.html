<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="amber-libs" content="chart">
<style>
*{box-sizing:border-box}
:root{--ok:#1f7a45;--ok-bg:#dff3e5;--ok-t:#14532d}
@media (prefers-color-scheme:dark){:root{--ok:#4cc38a;--ok-bg:#16382a;--ok-t:#a7f0c7}}
main{max-width:var(--amber-content-max);margin:0 auto;padding:16px var(--amber-gutter) 40px}
h1{font-family:var(--amber-font-rounded);font-size:1.7rem;letter-spacing:-.02em;margin:0 0 12px}
h2{font-size:1.1rem;margin:0}
.tabs{display:flex;gap:4px;background:var(--amber-fill);padding:4px;border-radius:14px;margin-bottom:16px}
.tabs button{flex:1;background:transparent;color:var(--amber-text);min-height:44px;border-radius:10px}
.tabs button[aria-current=page]{background:var(--amber-text);color:var(--amber-bg)}
button{font:inherit;font-weight:600;border:0;border-radius:var(--amber-radius-small);min-height:44px;padding:0 14px;background:var(--amber-fill);color:var(--amber-text);cursor:pointer}
button.pri{background:var(--amber-accent);color:var(--amber-on-accent)}
button.ghost{background:transparent;color:var(--amber-accent-text)}
button.danger{color:var(--amber-danger);background:transparent}
input,select{font:inherit;color:var(--amber-text);background:var(--amber-field);border:1px solid var(--amber-field-border);border-radius:var(--amber-radius-small);padding:8px 10px;min-height:44px;width:100%}
.days{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.days button{min-width:64px}
.days button[aria-pressed=true]{background:var(--amber-text);color:var(--amber-bg)}
.grid{display:grid;gap:14px}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:14px}
.card.done{border-color:var(--ok)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.muted{color:var(--amber-text-secondary);font-size:.9rem}
.badge{background:var(--ok-bg);color:var(--ok-t);font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:99px}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.set{width:62px;min-height:62px;border-radius:16px;font-size:1.4rem;font-family:var(--amber-font-rounded);font-variant-numeric:tabular-nums;border:2px dashed var(--amber-separator);background:var(--amber-bg)}
.set.on{background:var(--amber-accent);color:var(--amber-on-accent);border:2px solid var(--amber-accent)}
.set.part{background:var(--amber-accent-soft);color:var(--amber-text);border:2px solid var(--amber-accent)}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.row label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--amber-text-secondary)}
.w{width:110px}
.bar{height:6px;background:var(--amber-fill);border-radius:9px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--amber-accent)}
.big{font-family:var(--amber-font-rounded);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stats .card{padding:10px}
.pe{display:grid;grid-template-columns:1fr 64px 76px 44px;gap:6px;margin-bottom:8px;align-items:center}
.pe input{min-width:0}
.hist{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--amber-separator);font-variant-numeric:tabular-nums}
.empty{padding:24px;text-align:center;color:var(--amber-text-secondary)}
.err{color:var(--amber-danger);min-height:1.2em}
canvas{max-height:300px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let screen="today", pickedDay=null, progEx=null, sess={date:"",ex:{}}, err="", chart=null, loaded=false, newDay="";
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const num=s=>{const n=parseFloat(String(s).replace(",","."));return isNaN(n)?null:n};

function parsePlan(md){
  const plan=[];
  for(const line of md.split("\n")){
    const m=line.match(/^\s*[-*]\s*([A-Za-z]{3})[A-Za-z]*\s*:\s*(.+)$/);
    if(!m) continue;
    const day=cap(m[1].toLowerCase());
    const items=m[2].split(",").map(x=>x.trim()).filter(Boolean).map(x=>{
      const k=x.match(/^(.*?)\s+(\d+)\s*[x×]\s*(\d+|max)$/i);
      return k?{name:cap(k[1].trim()),sets:+k[2],reps:k[3].toLowerCase()}:{name:cap(x),sets:3,reps:"5"};
    });
    plan.push({day,items});
  }
  return plan;
}
const ser=plan=>plan.map(d=>`- ${d.day}: ${d.items.map(i=>`${i.name.toLowerCase()} ${i.sets}x${i.reps}`).join(", ")}`).join("\n");
function logRows(note){
  const t=note.tables.find(t=>t.columns.some(c=>/^exercise$/i.test(c.name))&&t.columns.some(c=>/^date$/i.test(c.name)));
  if(!t) return {t:null,rows:[]};
  const ix=re=>t.columns.findIndex(c=>re.test(c.name));
  const d=ix(/^date$/i),e=ix(/^exercise$/i),w=ix(/^weight/i),r=ix(/^reps/i);
  return {t,ix:{d,e,w,r},rows:t.rows.map((x,i)=>({i,date:x[d]||"",ex:(x[e]||"").trim(),w:num(x[w]),wRaw:x[w],reps:(x[r]||"").split(/[,\s/]+/).map(num).filter(n=>n!==null)})).filter(r=>r.ex&&r.date)};
}
function persist(){amber.store.set("session",sess)}
function render(note,data){
  const today=note.today;
  if(!loaded){loaded=true;const v=(data&&data.values)||amber.data.values||{};if(v.session)sess=v.session;if(v.screen)screen=v.screen;if(v.progEx)progEx=v.progEx}
  if(sess.date!==today)sess={date:today,ex:{}};
  const plan=parsePlan(note.markdown), L=logRows(note);
  const tabs=[["today","Today"],["plan","Plan"],["progress","Progress"]];
  let body="";
  if(screen==="today")body=todayView(note,plan,L);
  else if(screen==="plan")body=planView(plan);
  else body=progressView(L);
  document.getElementById("app").innerHTML=`<h1>${esc(note.title)}</h1>
  <nav class="tabs" aria-label="Sections">${tabs.map(([k,l])=>`<button data-act="tab" data-v="${k}" ${screen===k?'aria-current="page"':""}>${l}</button>`).join("")}</nav>${body}<div class="err" role="alert">${esc(err)}</div>`;
  if(screen==="progress")drawChart(L);
  else if(chart){chart.destroy();chart=null}
}
function dayFor(plan,today){
  if(pickedDay&&plan.some(p=>p.day===pickedDay))return pickedDay;
  if(!plan.length)return null;
  const wd=new Date(today+"T12:00:00").getDay();
  for(let o=0;o<7;o++){const d=DN[(wd+o)%7];if(plan.some(p=>p.day===d))return d}
  return plan[0].day;
}
function lastFor(L,name,today){
  const r=L.rows.filter(r=>r.ex.toLowerCase()===name.toLowerCase()&&r.date<today).sort((a,b)=>a.date<b.date?-1:1);
  return r[r.length-1]||null;
}
function todayView(note,plan,L){
  const today=note.today;
  if(!plan.length)return `<div class="card empty">No plan yet. Add lines like “- Mon: squat 3x5” under the Plan heading.</div>`+(L.rows.length?`<div class="card"><h2>Recent log</h2>${L.rows.slice(-8).reverse().map(r=>`<div class="hist"><span>${esc(r.date)} · ${esc(r.ex)}</span><span>${esc(r.wRaw)} kg × ${esc(r.reps.join(", "))}</span></div>`).join("")}</div>`:"");
  const day=dayFor(plan,today), p=plan.find(x=>x.day===day);
  const isToday=DN[new Date(today+"T12:00:00").getDay()]===day;
  let doneN=0;
  const cards=p.items.map(it=>{
    const key=it.name.toLowerCase();
    const logged=L.rows.filter(r=>r.date===today&&r.ex.toLowerCase()===key).pop();
    const last=lastFor(L,it.name,today);
    let sug=last&&last.w!==null?last.w:0, up=false;
    const tgt=it.reps==="max"?null:+it.reps;
    if(last&&last.w!==null&&tgt&&last.reps.length>=it.sets&&last.reps.every(n=>n>=tgt)){sug=last.w+(/dead/i.test(it.name)?5:2.5);up=true}
    let s=sess.ex[key];
    if(!s){s={w:logged&&logged.w!==null?String(logged.w):String(sug),reps:Array.from({length:it.sets},(_,i)=>logged&&logged.reps[i]||0)};sess.ex[key]=s}
    while(s.reps.length<it.sets)s.reps.push(0);
    const filled=s.reps.slice(0,it.sets).filter(n=>n>0).length;
    if(logged)doneN++;
    const hint=last?`Last: ${esc(last.wRaw)} kg × ${esc(last.reps.join(", "))}${up?` · try ${sug} kg`:""}`:"No previous log";
    return `<section class="card ${logged?"done":""}" aria-label="${esc(it.name)}">
      <div class="head"><h2>${esc(it.name)}</h2><span class="muted">${it.sets} × ${esc(it.reps)}</span></div>
      <div class="muted">${hint}</div>
      <div class="sets">${s.reps.slice(0,it.sets).map((n,i)=>`<button class="set ${n>0?(tgt&&n<tgt?"part":"on"):""}" data-act="set" data-ex="${esc(key)}" data-i="${i}" aria-label="Set ${i+1}, ${n>0?n+" reps":"not done"}">${n>0?n:"·"}</button>`).join("")}</div>
      <div class="row"><label>Weight (kg)<input class="w" inputmode="decimal" data-act="w" data-ex="${esc(key)}" value="${esc(s.w)}"></label>
      <button class="pri" data-act="save" data-ex="${esc(key)}" data-name="${esc(it.name)}" ${filled?"":"disabled"}>${logged?"Update log":"Save"}</button>
      ${logged?'<span class="badge">Logged</span>':""}</div></section>`;
  }).join("");
  const pct=p.items.length?Math.round(doneN/p.items.length*100):0;
  return `<div class="days" role="group" aria-label="Workout day">${plan.map(d=>`<button data-act="day" data-v="${d.day}" aria-pressed="${d.day===day}">${d.day}</button>`).join("")}</div>
  <div class="head"><div><div class="big">${doneN}/${p.items.length}</div><div class="muted">${isToday?"Today":"Next up"} · ${day} · exercises logged</div></div></div>
  <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
  <p class="muted">Tap a set when done. Tap again for one rep fewer; keep tapping to clear.</p>
  <div class="grid">${cards}</div>`;
}
function planView(plan){
  const used=plan.map(p=>p.day), free=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].filter(d=>!used.includes(d));
  return `<p class="muted">Changes save straight to the Plan in your note. Reps can be a number or “max”.</p><div class="grid">${plan.map((d,di)=>`
  <section class="card" aria-label="${d.day}"><div class="head"><h2>${d.day}</h2><button class="danger" data-act="rmday" data-d="${di}" aria-label="Remove ${d.day}">Remove day</button></div>
  ${d.items.map((it,ii)=>`<div class="pe">
    <input aria-label="Exercise name" data-act="pe" data-f="name" data-d="${di}" data-i="${ii}" value="${esc(it.name)}">
    <input aria-label="Sets" inputmode="numeric" data-act="pe" data-f="sets" data-d="${di}" data-i="${ii}" value="${it.sets}">
    <input aria-label="Reps" data-act="pe" data-f="reps" data-d="${di}" data-i="${ii}" value="${esc(it.reps)}">
    <button class="danger" data-act="rmex" data-d="${di}" data-i="${ii}" aria-label="Remove ${esc(it.name)}">✕</button></div>`).join("")}
  <div class="pe"><input id="add-name-${di}" aria-label="New exercise for ${d.day}" placeholder="New exercise"><input id="add-sets-${di}" aria-label="Sets" inputmode="numeric" value="3"><input id="add-reps-${di}" aria-label="Reps" value="5"><button class="pri" data-act="addex" data-d="${di}" aria-label="Add exercise to ${d.day}">+</button></div>
  </section>`).join("")}</div>
  ${free.length?`<div class="row" style="margin-top:14px"><label>Add a training day<select id="newday">${free.map(d=>`<option ${d===newDay?"selected":""}>${d}</option>`).join("")}</select></label><button class="pri" data-act="addday">Add day</button></div>`:""}`;
}
function exList(L){return [...new Set(L.rows.map(r=>r.ex.toLowerCase()))].sort()}
function progressView(L){
  if(!L.rows.length)return `<div class="card empty">Log a workout and your progress shows up here.</div>`;
  const exs=exList(L); if(!progEx||!exs.includes(progEx))progEx=exs[0];
  const rows=L.rows.filter(r=>r.ex.toLowerCase()===progEx).sort((a,b)=>a.date<b.date?-1:1);
  const best=Math.max(...rows.map(r=>r.w||0));
  const dates=[...new Set(L.rows.map(r=>r.date))];
  const cut=new Date(Date.now());const since=amber.note.today.slice(0,8);
  const month=dates.filter(d=>d.slice(0,7)===amber.note.today.slice(0,7)).length;
  const vol=rows.reduce((a,r)=>a+(r.w||0)*r.reps.reduce((x,y)=>x+y,0),0);
  return `<div class="stats"><div class="card"><div class="big">${dates.length}</div><div class="muted">training days</div></div>
  <div class="card"><div class="big">${month}</div><div class="muted">this month</div></div>
  <div class="card"><div class="big">${best}</div><div class="muted">best kg</div></div></div>
  <label class="muted" for="pex">Exercise</label><select id="pex" data-act="pex">${exs.map(e=>`<option value="${esc(e)}" ${e===progEx?"selected":""}>${esc(cap(e))}</option>`).join("")}</select>
  <div class="card" style="margin:12px 0"><canvas id="ch" role="img" aria-label="Weight lifted over time for ${esc(progEx)}"></canvas></div>
  <div class="card"><div class="head"><h2>History</h2><span class="muted">Volume ${Math.round(vol)} kg</span></div>
  ${rows.slice().reverse().map(r=>`<div class="hist"><span>${esc(r.date)}</span><span>${esc(r.wRaw)} kg × ${esc(r.reps.join(", "))}</span></div>`).join("")}</div>`;
}
function drawChart(L){
  const c=document.getElementById("ch");if(!c||typeof Chart==="undefined")return;
  if(chart)chart.destroy();
  const rows=L.rows.filter(r=>r.ex.toLowerCase()===progEx&&r.w!==null).sort((a,b)=>a.date<b.date?-1:1);
  const cs=getComputedStyle(document.documentElement);
  const acc=cs.getPropertyValue("--amber-accent").trim()||"#d98a00", tx=cs.getPropertyValue("--amber-text-secondary").trim()||"#888", sep=cs.getPropertyValue("--amber-separator").trim()||"#8884";
  chart=new Chart(c,{type:"line",data:{labels:rows.map(r=>r.date.slice(5)),datasets:[{label:"kg",data:rows.map(r=>r.w),borderColor:acc,backgroundColor:acc,tension:.25,pointRadius:5}]},
   options:{responsive:true,animation:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:tx},grid:{color:sep}},y:{ticks:{color:tx},grid:{color:sep},grace:"10%"}}}});
}
async function commit(plan){
  const r=await amber.update({op:"set_text",heading:"Plan",text:ser(plan)});
  err=r.ok?"":(r.error||"Could not save the plan");
  if(!r.ok)render(amber.note,amber.data);
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="INPUT"||b.tagName==="SELECT")return;
  const a=b.dataset.act, note=amber.note;
  if(a==="tab"){screen=b.dataset.v;amber.store.set("screen",screen);err="";render(note,amber.data)}
  else if(a==="day"){pickedDay=b.dataset.v;render(note,amber.data)}
  else if(a==="set"){
    const s=sess.ex[b.dataset.ex],i=+b.dataset.i;
    const plan=parsePlan(note.markdown);let it;
    for(const d of plan)for(const x of d.items)if(x.name.toLowerCase()===b.dataset.ex)it=x;
    const tgt=it&&it.reps!=="max"?+it.reps:8;
    const prev=s.reps[i];
    s.reps[i]=prev===0?(it&&it.reps==="max"?(s.reps.find(n=>n>0)||tgt):tgt):prev-1;
    persist();render(note,amber.data);
  }
  else if(a==="save"){
    const s=sess.ex[b.dataset.ex],name=b.dataset.name;
    const L=logRows(note);if(!L.t){err="Add a table with Date, Exercise, Weight and Reps columns.";render(note,amber.data);return}
    const reps=s.reps.filter(n=>n>0).join(",");
    const w=String(s.w||"0").replace(",",".");
    const ex=L.rows.filter(r=>r.date===note.today&&r.ex.toLowerCase()===b.dataset.ex).pop();
    const ops=ex?[{op:"set_cell",table:L.t.index,row:ex.i,col:"Weight",value:w},{op:"set_cell",table:L.t.index,row:ex.i,col:"Reps",value:reps}]
      :[{op:"append_row",table:L.t.index,values:{Date:note.today,Exercise:name,Weight:w,Reps:reps}}];
    const r=await amber.update(ops);err=r.ok?"":(r.error||"Could not save");if(!r.ok)render(note,amber.data);
  }
  else if(a==="rmex"){const p=parsePlan(note.markdown);p[+b.dataset.d].items.splice(+b.dataset.i,1);commit(p)}
  else if(a==="rmday"){const p=parsePlan(note.markdown);p.splice(+b.dataset.d,1);commit(p)}
  else if(a==="addex"){
    const d=+b.dataset.d,name=document.getElementById("add-name-"+d).value.trim();
    if(!name){err="Type an exercise name first.";render(note,amber.data);return}
    const sets=parseInt(document.getElementById("add-sets-"+d).value)||3,reps=(document.getElementById("add-reps-"+d).value.trim()||"5").toLowerCase();
    const p=parsePlan(note.markdown);p[d].items.push({name:cap(name),sets,reps});commit(p);
  }
  else if(a==="addday"){const v=document.getElementById("newday").value;const p=parsePlan(note.markdown);p.push({day:v,items:[]});
    const o=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];p.sort((x,y)=>o.indexOf(x.day)-o.indexOf(y.day));
    // empty days would serialise as "- Day: " and be lost; give a placeholder
    p.forEach(d=>{if(!d.items.length)d.items.push({name:"New exercise",sets:3,reps:"5"})});commit(p)}
});
document.addEventListener("change",e=>{
  const t=e.target,a=t.dataset.act,note=amber.note;
  if(a==="w"){sess.ex[t.dataset.ex].w=t.value;persist()}
  else if(a==="pex"){progEx=t.value;amber.store.set("progEx",progEx);render(note,amber.data)}
  else if(a==="pe"){
    const p=parsePlan(note.markdown),it=p[+t.dataset.d].items[+t.dataset.i],f=t.dataset.f;
    if(f==="name"){if(!t.value.trim())return;it.name=cap(t.value.trim())}
    else if(f==="sets")it.sets=Math.max(1,parseInt(t.value)||it.sets);
    else it.reps=(t.value.trim()||it.reps).toLowerCase();
    commit(p);
  }
  else if(t.id==="newday")newDay=t.value;
});
amber.onChange(render);
</script>
</body>
</html>
