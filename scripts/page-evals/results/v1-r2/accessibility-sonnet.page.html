<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisbon trip packing</title>
<style>
:root{--bg:#fbf8f3;--card:#fff;--ink:#1d1a16;--muted:#5e564d;--line:#8a8076;--accent:#9a4f00;--accent-ink:#fff;--field:#fff;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--bg:#1b1916;--card:#26231f;--ink:#f3eee8;--muted:#c2b9ae;--line:#9d9388;--accent:#f0a04b;--accent-ink:#1b1916;--field:#34302a;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 -apple-system,system-ui,sans-serif;padding:20px 18px 80px;max-width:680px;margin:0 auto}
h1{font-size:28px;margin:4px 0 4px}
h2{font-size:20px;margin:0;padding:14px 16px 6px}
.sum{color:var(--muted);margin:0 0 16px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
ul{list-style:none;margin:0;padding:0 0 6px}
li label{display:flex;align-items:center;gap:14px;min-height:48px;padding:6px 16px;cursor:pointer}
input[type=checkbox]{width:26px;height:26px;flex:none;accent-color:var(--accent);margin:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.done{color:var(--muted);text-decoration:line-through}
form{display:flex;flex-direction:column;gap:12px;padding:16px}
form label{display:flex;flex-direction:column;gap:4px;font-weight:600}
input[type=text],select{font:inherit;font-weight:400;color:var(--ink);background:var(--field);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
button{font:inherit;font-weight:600;min-height:46px;padding:0 20px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink)}
#msg{padding:0 16px 14px;margin:0;min-height:1.4em}
#msg.err{color:var(--err);font-weight:600}
.empty{padding:8px 16px 14px;color:var(--muted)}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p class="sum" id="sum" role="status"></p>
<div id="lists"></div>
<section aria-labelledby="addh">
<h2 id="addh">Add an item</h2>
<form id="add">
<label for="cat">Section<select id="cat"></select></label>
<label for="txt">Item<input type="text" id="txt" autocomplete="off"></label>
<div><button type="submit">Add item</button></div>
</form>
<p id="msg" role="status"></p>
</section>
</main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const $=id=>document.getElementById(id);
const isDone=s=>/^(✓|x|yes|done|1|true)$/i.test(String(s).trim());
let msgTimer;
function say(text,isErr){const m=$("msg");m.className=isErr?"err":"";m.textContent="";setTimeout(()=>{m.textContent=text},50);}
function render(note){
  $("title").textContent=note.title;
  const lines=note.markdown.split("\n");
  const sections=[];const byName={};
  const get=(name)=>{const k=name.toLowerCase();if(!byName[k]){byName[k]={name,items:[]};sections.push(byName[k]);}return byName[k];};
  // headings in order
  const headAt=[];
  lines.forEach((l,i)=>{const m=l.match(/^#{1,6}\s+(.*?)\s*#*\s*$/);if(m&&i>0)headAt.push({line:i+1,name:m[1]});});
  const secFor=line=>{let h=null;for(const x of headAt){if(x.line<line)h=x;}return h?h.name:"Items";};
  note.checklists.forEach(c=>{get(secFor(c.line)).items.push({text:c.text,checked:c.checked,key:"c"+c.line,op:{op:"toggle_checklist",line:c.line}});});
  const t=note.tables.find(t=>t.columns.some(c=>/^item$/i.test(c.name)));
  let extraCount=0;
  if(t){
    const ci=t.columns.findIndex(c=>/^category$/i.test(c.name)),ii=t.columns.findIndex(c=>/^item$/i.test(c.name)),pi=t.columns.findIndex(c=>/^packed$/i.test(c.name));
    t.rows.forEach((r,n)=>{if(!String(r[ii]||"").trim())return;extraCount++;
      get((ci>=0&&r[ci]||"").trim()||"Other").items.push({text:r[ii],checked:pi>=0&&isDone(r[pi]),key:"t"+n,op:{op:"set_cell",table:t.index,row:n,col:t.columns[pi].name,value:isDone(r[pi])?"":"✓"}});});
  }
  const all=sections.reduce((a,s)=>a.concat(s.items),[]);
  const packed=all.filter(i=>i.checked).length;
  $("sum").textContent=packed+" of "+all.length+" items packed";
  const active=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.key:null;
  window._ops={};
  $("lists").innerHTML=sections.filter(s=>s.items.length).map((s,si)=>{
    const p=s.items.filter(i=>i.checked).length;
    return '<section aria-labelledby="h'+si+'"><h2 id="h'+si+'">'+esc(s.name)+' <span class="sum" style="font-size:15px;font-weight:400">('+p+' of '+s.items.length+' packed)</span></h2><ul>'+
    s.items.map(i=>{window._ops[i.key]=i.op;return '<li><label><input type="checkbox" data-key="'+i.key+'"'+(i.checked?' checked':'')+'><span class="'+(i.checked?'done':'')+'">'+esc(i.text)+'</span></label></li>';}).join("")+'</ul></section>';
  }).join("")||'<section><p class="empty">Nothing to pack yet. Add an item below.</p></section>';
  $("lists").querySelectorAll("input[type=checkbox]").forEach(b=>{
    b.onchange=async()=>{const r=await amber.update(window._ops[b.dataset.key]);if(!r.ok){say(r.error||"Could not update.",true);b.checked=!b.checked;}};
    if(b.dataset.key===active)b.focus();
  });
  const names=sections.map(s=>s.name).filter(n=>!/^(added items|items)$/i.test(n));
  if(!names.length)names.push("Other");
  const cat=$("cat"),cur=cat.value;
  cat.innerHTML=names.map(n=>'<option>'+esc(n)+'</option>').join("");
  if(names.includes(cur))cat.value=cur;
}
$("add").onsubmit=async e=>{
  e.preventDefault();
  const v=$("txt").value.trim();
  if(!v){say("Type an item name first.",true);$("txt").focus();return;}
  const note=amber.note;
  const t=note.tables.find(t=>t.columns.some(c=>/^item$/i.test(c.name)));
  if(!t){say("The Added items table is missing from the note.",true);return;}
  const r=await amber.update({op:"append_row",table:t.index,values:{Category:$("cat").value,Item:v,Packed:""}});
  if(r.ok){say("Added "+v+" to "+$("cat").value+".",false);$("txt").value="";$("txt").focus();}
  else say(r.error||"Could not add the item.",true);
};
amber.onChange(render);
</script>
</body>
</html>
