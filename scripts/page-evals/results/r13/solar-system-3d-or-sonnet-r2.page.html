<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="amber-libs" content="three">
<style>
*{box-sizing:border-box}
#wrap{position:relative;height:max(420px,82vh);max-height:900px;background:#05070f;color:#eef1fa;overflow:hidden;border-radius:var(--amber-radius);margin:8px auto;max-width:var(--amber-content-max);touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
h1{position:absolute;top:12px;left:16px;margin:0;font-size:1.5rem;letter-spacing:-.02em;pointer-events:none}
.hint{position:absolute;top:44px;left:16px;font-size:.8125rem;color:#b4bcd4;pointer-events:none}
.bar{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:linear-gradient(transparent,#05070f 40%)}
.info{font-size:.875rem;color:#eef1fa;min-height:2.6em;font-variant-numeric:tabular-nums}
.info b{font-size:1rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:0 0 auto;font:inherit;font-size:.875rem;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid #3a4260;background:#151a2e;color:#eef1fa;display:flex;align-items:center;gap:7px}
.chips button[aria-pressed=true]{background:#f5b041;color:#1a1200;border-color:#f5b041}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
@media (prefers-color-scheme:dark){#wrap{background:#05070f;color:#eef1fa}.hint,.empty{color:#b4bcd4}}
.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:#b4bcd4}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" role="img" aria-label="3D solar system you can rotate by dragging. Planet sizes and distances come from the table."></canvas>
  <h1 id="title"></h1>
  <div class="hint">Drag to spin · pinch to zoom · tap a planet</div>
  <div class="empty" id="empty">Add a table with Planet, Distance (AU) and Radius (km) columns.</div>
  <div class="bar"><div class="info" id="info" aria-live="polite"></div><div class="chips" id="chips"></div></div>
</div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const num=s=>{const v=parseFloat(String(s??"").replace(/\s/g,"").replace(",","."));return isNaN(v)?null:v};
const COL={mercury:0xb5a9a0,venus:0xe8c27a,earth:0x3f7fd9,mars:0xd1572f,jupiter:0xd9a56f,saturn:0xe6cf95,uranus:0x8fdde0,neptune:0x4a63e0,pluto:0xc9b8a8};
const BASE=[0x9aa7c7,0xc58fe0,0x7fd6a0,0xe0907f,0x7fb8e0];
const wrap=document.getElementById('wrap'),cv=document.getElementById('c');
document.getElementById('title').textContent=amber.note.title;
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05070f);
const camera=new THREE.PerspectiveCamera(45,1,.1,500);
scene.add(new THREE.AmbientLight(0x404868,1.2));
const sunLight=new THREE.PointLight(0xfff2d0,3.5,0,0);scene.add(sunLight);
// stars
{const n=700,p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=150+Math.random()*100,a=Math.random()*6.283,b=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(b)*Math.cos(a);p[i*3+1]=r*Math.cos(b);p[i*3+2]=r*Math.sin(b)*Math.sin(a)}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.9,sizeAttenuation:false})))}
const sun=new THREE.Mesh(new THREE.SphereGeometry(1.5,32,24),new THREE.MeshBasicMaterial({color:0xffc94d}));scene.add(sun);
const glow=new THREE.Mesh(new THREE.SphereGeometry(1.9,32,24),new THREE.MeshBasicMaterial({color:0xff9d2e,transparent:true,opacity:.18}));scene.add(glow);
let group=new THREE.Group();scene.add(group);
let planets=[],sel=-1,maxR=14;
let yaw=0.6,pitch=0.5,zoom=1;

function build(note){
  scene.remove(group);group.traverse(o=>{o.geometry&&o.geometry.dispose();o.material&&o.material.dispose&&o.material.dispose()});
  group=new THREE.Group();scene.add(group);planets=[];
  const t=note.tables.find(t=>t.columns.some(c=>/^(planet|name)/i.test(c.name))&&t.columns.some(c=>/dist|au/i.test(c.name)));
  const empty=document.getElementById('empty');
  if(!t){empty.style.display='flex';document.getElementById('chips').innerHTML='';document.getElementById('info').textContent='';return}
  const ci=re=>t.columns.findIndex(c=>re.test(c.name));
  const iN=ci(/^(planet|name)/i),iD=ci(/dist|au/i),iR=ci(/radius/i),iY=ci(/day/i);
  const rows=t.rows.map(r=>({name:r[iN],d:num(r[iD]),r:iR>=0?num(r[iR]):null,day:iY>=0?num(r[iY]):null})).filter(p=>p.name&&p.d!=null&&p.d>0);
  empty.style.display=rows.length?'none':'flex';
  const maxD=Math.max(...rows.map(p=>p.d),1),maxRad=Math.max(...rows.map(p=>p.r||0),1);
  maxR=3.2+11*1;
  rows.forEach((p,i)=>{
    const dist=3.2+11*Math.sqrt(p.d/maxD);          // square-root squash of distance
    const rad=.22+.95*Math.sqrt((p.r||maxRad*.1)/maxRad); // squashed radius
    const key=p.name.toLowerCase().trim();
    const color=COL[key]??BASE[i%BASE.length];
    const m=new THREE.Mesh(new THREE.SphereGeometry(rad,32,24),new THREE.MeshStandardMaterial({color,roughness:.8,metalness:0}));
    const pivot=new THREE.Group();pivot.rotation.y=i*1.7;pivot.add(m);m.position.x=dist;group.add(pivot);
    if(key==='saturn'){const ring=new THREE.Mesh(new THREE.RingGeometry(rad*1.4,rad*2.2,64),new THREE.MeshBasicMaterial({color:0xcdb98a,side:THREE.DoubleSide,transparent:true,opacity:.75}));ring.rotation.x=Math.PI/2.2;m.add(ring)}
    const pts=[];for(let k=0;k<=128;k++){const a=k/128*6.2832;pts.push(new THREE.Vector3(Math.cos(a)*dist,0,Math.sin(a)*dist))}
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x3a4260})));
    m.rotation.z=.2;
    planets.push({...p,mesh:m,pivot,dist,rad,color,spin:p.day?Math.min(6,2.4/Math.sqrt(Math.max(p.day,1))*2):.5,orbit:.25/Math.pow(p.d,1.5)+.02});
  });
  maxR=3.2+11+2;
  document.getElementById('chips').innerHTML=planets.map((p,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===sel}"><span class="dot" style="background:#${p.color.toString(16).padStart(6,'0')}"></span>${esc(p.name)}</button>`).join('');
  document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>select(+b.dataset.i===sel?-1:+b.dataset.i));
  if(sel>=planets.length)sel=-1;
  select(sel);
}
function select(i){
  sel=i;
  document.querySelectorAll('.chips button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.i===sel)));
  const el=document.getElementById('info');
  if(i<0||!planets[i]){el.innerHTML=planets.length?'Sizes and distances are square-root squashed so everything fits.':'';return}
  const p=planets[i];
  el.innerHTML=`<b>${esc(p.name)}</b> · ${p.d} AU${p.r!=null?` · radius ${p.r.toLocaleString()} km`:''}${p.day!=null?` · day ${p.day.toLocaleString()} h`:''}`;
}
function fit(){
  const w=wrap.clientWidth,h=wrap.clientHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;
  // keep the whole system visible on narrow screens
  const fov=camera.fov*Math.PI/180,hf=2*Math.atan(Math.tan(fov/2)*Math.min(1,camera.aspect));
  camera.userData.base=(maxR*1.15)/Math.tan(hf/2)*0.9;
  camera.updateProjectionMatrix();
}
new ResizeObserver(fit).observe(wrap);
// input
const ptrs=new Map();let moved=0,pinch0=0,zoom0=1;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=zoom}cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];zoom=Math.max(.3,Math.min(2.5,zoom0*pinch0/Math.hypot(a.x-b.x,a.y-b.y)));moved+=9}
  else{yaw-=dx*.008;pitch=Math.max(-1.45,Math.min(1.45,pitch+dy*.008));moved+=Math.abs(dx)+Math.abs(dy);vel=dx*.008}});
let vel=0;
function up(e){const had=ptrs.delete(e.pointerId);cv.style.cursor='grab';
  if(had&&moved<6&&ptrs.size===0){const r=cv.getBoundingClientRect();const v=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
    const rc=new THREE.Raycaster();rc.setFromCamera(v,camera);const hit=rc.intersectObjects(planets.map(p=>p.mesh),false)[0];
    if(hit)select(planets.findIndex(p=>p.mesh===hit.object));}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.3,Math.min(2.5,zoom*(1+e.deltaY*.001)))},{passive:false});
// loop
let last=0,running=true;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(t){
  if(!running)return;requestAnimationFrame(frame);
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(!reduce){planets.forEach(p=>{p.pivot.rotation.y+=p.orbit*dt;p.mesh.rotation.y+=p.spin*dt});sun.rotation.y+=dt*.1}
  const dist=(camera.userData.base||40)*zoom;
  camera.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);
  camera.lookAt(0,0,0);
  if(sel>=0&&planets[sel]){const s=1+.08*Math.sin(t/300);planets[sel].mesh.scale.setScalar(s)}
  planets.forEach((p,i)=>{if(i!==sel)p.mesh.scale.setScalar(1)});
  renderer.render(scene,camera);
}
document.addEventListener('visibilitychange',()=>{const v=document.visibilityState==='visible';if(v&&!running){running=true;last=performance.now();requestAnimationFrame(frame)}else if(!v)running=false});
let sig='';
amber.onChange(note=>{const s=JSON.stringify(note.tables);if(s!==sig){sig=s;build(note)}document.getElementById('title').textContent=note.title;fit()});
fit();requestAnimationFrame(frame);
</script>
</body>
</html>
