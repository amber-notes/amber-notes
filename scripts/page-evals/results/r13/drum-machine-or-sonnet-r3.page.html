<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { --k: #e8743b; --s: #3b9ae8; --h: #3bb88a; --o: #a56be8; --pad-off: var(--amber-fill); }
  @media (prefers-color-scheme: dark) { :root { --k: #f08a55; --s: #5aaeff; --h: #4fd1a0; --o: #b98af0; } }
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 48px; }
  h1 { font-family: var(--amber-font-rounded); font-size: 1.9rem; letter-spacing: -.02em; margin: 4px 0 14px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 18px; }
  button { font: inherit; font-weight: 700; min-height: 48px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--amber-text); color: var(--amber-bg); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  button.ghost { background: var(--amber-fill); color: var(--amber-text); border: 1px solid var(--amber-separator); }
  .tempo { display: flex; align-items: center; gap: 10px; flex: 1 1 220px; min-width: 200px; }
  .tempo input { flex: 1; min-height: 44px; padding: 0; }
  .bpm { font-family: var(--amber-font-mono); font-variant-numeric: tabular-nums; font-weight: 700; min-width: 5.5em; }
  .machine { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 14px; }
  .track { margin-bottom: 14px; }
  .track:last-child { margin-bottom: 0; }
  .name { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .95rem; margin-bottom: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 4px; background: var(--c); }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .pad { min-height: 44px; padding: 0; border-radius: 8px; background: var(--pad-off); border: 1px solid var(--amber-separator); color: var(--amber-text); font-size: .75rem; font-weight: 600; font-variant-numeric: tabular-nums; position: relative; justify-content: center; }
  .pad.beat { border-bottom: 3px solid var(--amber-text-secondary); }
  .pad.on { background: var(--c); border-color: var(--c); color: #111; }
  .pad.on::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: #111; }
  .pad.now { outline: 3px solid var(--amber-text); outline-offset: 1px; }
  .hint { color: var(--amber-text-secondary); font-size: .85rem; margin-top: 12px; }
  .err { color: var(--amber-danger); min-height: 1.2em; }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
  @media (min-width: 500px) { .steps { grid-template-columns: repeat(8, 1fr); } }
  @media (min-width: 900px) { .steps { grid-template-columns: repeat(16, 1fr); } .pad { min-height: 52px; } }
  @media (prefers-reduced-motion: no-preference) { .pad { transition: background .08s; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const COLORS = ["var(--k)", "var(--s)", "var(--h)", "var(--o)"];
  let tracks = [], nSteps = 0, tIndex = 0, bpm = 120, playing = false, cur = -1, error = "";
  let ctx = null, timer = null, nextTime = 0, nextStep = 0, queue = [];
  let grid = [];   // grid[trackIdx][step] = bool, always the latest note

  function parse(note, data) {
    const t = note.tables.find((t) => t.columns.length > 1 && /^step$/i.test(t.columns[0].name)) || note.tables.find((t) => t.columns.length > 1);
    if (!t) return null;
    tIndex = t.index;
    tracks = t.columns.slice(1).map((c) => c.name);
    nSteps = t.rows.length;
    grid = tracks.map((_, ci) => t.rows.map((r) => /^(x|✓|1|yes|true)$/i.test((r[ci + 1] || "").trim())));
    const saved = data && data.values && data.values.bpm;
    const m = note.markdown.match(/(\d{2,3})\s*bpm/i);
    bpm = Number(saved) || (m ? Number(m[1]) : 120);
    return t;
  }

  function render(note, data) {
    const app = document.getElementById("app");
    const t = parse(note, data);
    if (!t || !nSteps) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="machine empty">Add a table with a Step column and one column per drum (Kick, Snare, Hat…). Put x where it should hit.</div>`; return; }
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="bar">
        <button id="play" aria-label="${playing ? "Stop" : "Play"}">${playing
          ? '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2" fill="currentColor"/></svg> Stop'
          : '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg> Play'}</button>
        <div class="tempo"><label for="bpm" class="bpm" id="bpmv">${bpm} bpm</label><input id="bpm" type="range" min="60" max="200" value="${bpm}"></div>
      </div>
      <div class="machine" role="group" aria-label="Step sequencer">
        ${tracks.map((n, ti) => `<div class="track" style="--c:${COLORS[ti % COLORS.length]}">
          <div class="name"><span class="dot"></span>${esc(n)}</div>
          <div class="steps">${grid[ti].map((on, s) => `<button class="pad${on ? " on" : ""}${s % 4 === 0 ? " beat" : ""}${s === cur ? " now" : ""}" data-t="${ti}" data-s="${s}" aria-pressed="${on}" aria-label="${esc(n)} step ${s + 1}">${s + 1}</button>`).join("")}</div>
        </div>`).join("")}
      </div>
      <div class="err" role="alert">${esc(error)}</div>
      <div class="hint">Tap a pad to switch it on or off. The pattern is saved in the note's table as x marks.</div>`;
    document.getElementById("play").onclick = toggle;
    document.getElementById("bpm").oninput = (e) => { bpm = Number(e.target.value); document.getElementById("bpmv").textContent = bpm + " bpm"; };
    document.getElementById("bpm").onchange = (e) => amber.store.set("bpm", Number(e.target.value));
    app.querySelectorAll(".pad").forEach((b) => b.onclick = async () => {
      const ti = +b.dataset.t, s = +b.dataset.s;
      const was = grid[ti][s];
      if (!was) { ensureCtx(); if (ctx) hit(tracks[ti], ctx.currentTime + 0.01); }
      const r = await amber.update({ op: "set_cell", table: tIndex, row: s, col: tracks[ti], value: was ? "" : "x" });
      error = r.ok ? "" : r.error;
      if (!r.ok) render(amber.note, amber.data);
    });
  }

  /* ---- sound ---- */
  function ensureCtx() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { error = "Sound isn't available here."; } }
    if (ctx && ctx.state === "suspended") ctx.resume();
  }
  function noiseBuf() {
    if (ctx._n) return ctx._n;
    const b = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return (ctx._n = b);
  }
  function env(g, t, peak, dur) { g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); }
  function noise(t, dur, type, freq, peak) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf();
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ctx.createGain(); env(g, t, peak, dur);
    s.connect(f); f.connect(g); g.connect(ctx.destination); s.start(t); s.stop(t + dur + 0.02);
  }
  function tone(t, f0, f1, dur, peak, type) {
    const o = ctx.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain(); env(g, t, peak, dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function hit(name, t) {
    const n = name.toLowerCase();
    if (/kick|bass|bd/.test(n)) tone(t, 150, 40, 0.35, 1);
    else if (/snare|sd/.test(n)) { noise(t, 0.18, "highpass", 1500, 0.7); tone(t, 220, 120, 0.1, 0.5, "triangle"); }
    else if (/clap/.test(n)) { noise(t, 0.05, "bandpass", 1500, 0.8); noise(t + 0.02, 0.15, "bandpass", 1500, 0.8); }
    else if (/open|oh/.test(n)) noise(t, 0.3, "highpass", 7000, 0.35);
    else if (/hat|hh|hi/.test(n)) noise(t, 0.05, "highpass", 8000, 0.4);
    else if (/tom/.test(n)) tone(t, 200, 90, 0.25, 0.8);
    else tone(t, 800, 500, 0.12, 0.5, "square");
  }

  /* ---- sequencer ---- */
  function schedule() {
    while (nextTime < ctx.currentTime + 0.12) {
      const s = nextStep % nSteps;
      tracks.forEach((n, ti) => { if (grid[ti] && grid[ti][s]) hit(n, nextTime); });
      queue.push({ s, t: nextTime });
      nextTime += 60 / bpm / 4;   // 16th notes
      nextStep++;
    }
  }
  function setNow(s) {
    cur = s;
    document.querySelectorAll(".pad.now").forEach((p) => p.classList.remove("now"));
    if (s >= 0) document.querySelectorAll(`.pad[data-s="${s}"]`).forEach((p) => p.classList.add("now"));
  }
  function frame() {
    if (!playing) return;
    while (queue.length && queue[0].t <= ctx.currentTime) { const q = queue.shift(); setNow(q.s); }
    requestAnimationFrame(frame);
  }
  function start() {
    ensureCtx(); if (!ctx) return;
    playing = true; nextStep = 0; nextTime = ctx.currentTime + 0.05; queue = [];
    timer = setInterval(schedule, 25); schedule(); requestAnimationFrame(frame);
    render(amber.note, amber.data);
  }
  function stop() {
    playing = false; clearInterval(timer); queue = []; cur = -1;
    render(amber.note, amber.data);
  }
  function toggle() { playing ? stop() : start(); }
  document.addEventListener("visibilitychange", () => { if (document.hidden && playing) stop(); });
  window.addEventListener("pagehide", () => { if (playing) stop(); });
  document.addEventListener("keydown", (e) => { if (e.code === "Space" && e.target.tagName !== "INPUT" && e.target.tagName !== "BUTTON") { e.preventDefault(); toggle(); } });

  amber.onChange(render);
</script>
</body>
</html>
