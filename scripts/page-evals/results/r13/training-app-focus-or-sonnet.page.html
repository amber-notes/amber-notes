<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-libs" content="chart">
<meta name="amber-settings" content='{"settings": [{"key": "step", "label": "Weight step (kg)", "type": "number", "default": 2.5, "help": "Added to the suggestion after a fully completed exercise"}]}'>
<style>
  * { box-sizing: border-box; }
  :root { --iron: #c42b31; --iron-soft: #fde4e4; --iron-ink: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --iron: #ff6b6f; --iron-soft: #3a1c1d; --iron-ink: #2a0b0c; } }
  .wrap { max-width: var(--amber-content-max); margin: 0 auto; padding: 16px var(--amber-gutter) 96px; }
  h1 { font-size: 1.75rem; letter-spacing: -.02em; margin: 4px 0 12px; }
  h2 { font-size: .8rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 20px 4px 8px; }
  .muted { color: var(--amber-text-secondary); font-size: .9rem; }
  .tabs { display: flex; gap: 4px; background: var(--amber-fill); padding: 4px; border-radius: 14px; margin-bottom: 14px; }
  .tabs button { flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--amber-text); font: inherit; font-weight: 600; }
  .tabs button[aria-selected="true"] { background: var(--iron); color: var(--iron-ink); }
  .days { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { min-height: 44px; padding: 0 16px; border-radius: 99px; border: 1px solid var(--amber-separator); background: var(--amber-surface); color: var(--amber-text); font: inherit; font-weight: 600; }
  .chip[aria-pressed="true"] { background: var(--amber-text); color: var(--amber-bg); }
  .chip .dot { color: var(--iron); }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 14px 16px; margin-bottom: 12px; }
  .card.done { border-color: var(--iron); }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .name { font-size: 1.2rem; font-weight: 700; }
  .target { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--amber-accent-text); }
  .sets { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
  .set { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--amber-separator); background: var(--amber-fill); color: var(--amber-text-secondary); font: inherit; font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .set.on { background: var(--iron); border-color: var(--iron); color: var(--iron-ink); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  input, select { font: inherit; font-size: 1rem; color: var(--amber-text); background: var(--amber-field); border: 1px solid var(--amber-field-border); border-radius: 10px; padding: 8px 12px; min-height: 44px; min-width: 0; }
  input.w { width: 5.5rem; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  input.sm { width: 4.2rem; text-align: center; }
  .btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--amber-separator); background: var(--amber-fill); color: var(--amber-text); font: inherit; font-weight: 600; }
  .btn.pri { background: var(--iron); border-color: var(--iron); color: var(--iron-ink); }
  .btn.sq { width: 44px; padding: 0; font-size: 1.3rem; }
  .btn.del { color: var(--amber-danger); }
  .btn[disabled] { opacity: .5; }
  .bar { height: 8px; border-radius: 4px; background: var(--iron-soft); overflow: hidden; margin: 6px 0 14px; }
  .bar div { height: 100%; background: var(--iron); }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .stat { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 10px 12px; }
  .stat b { display: block; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
  .chartbox { position: relative; height: 240px; }
  .hist { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--amber-separator); font-variant-numeric: tabular-nums; }
  .hist:first-child { border-top: 0; }
  .editrow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .err { color: var(--amber-danger); min-height: 1.2em; }
  @media (min-width: 900px) {
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
    .cols .card { margin-bottom: 0; }
    .chartbox { height: 320px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const cap = (s) => s.trim().charAt(0).toUpperCase() + s.trim().slice(1);
const num = (s) => { const n = parseFloat(String(s ?? "").replace(",", ".")); return Number.isFinite(n) ? n : null; };
const fmt = (n) => (Math.round(n * 100) / 100).toString();
let tab = "today", pickedDay = null, pickedEx = null, error = "", chart = null;
let N = null, D = null;

function parsePlan(md) {
  const plan = [];
  for (const line of md.split("\n")) {
    const m = line.match(/^\s*[-*]\s*(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\w*:\s*(.+)$/i);
    if (!m) continue;
    const items = [];
    for (const part of m[2].split(",")) {
      const p = part.trim().match(/^(.+?)\s+(\d+)\s*x\s*(\d+|max)$/i);
      if (p) items.push({ name: cap(p[1]), sets: Number(p[2]), reps: p[3].toLowerCase() === "max" ? "max" : Number(p[3]) });
    }
    if (items.length) plan.push({ day: cap(m[1].slice(0, 3).toLowerCase()), items });
  }
  return plan;
}
const getPlan = () => D && D.values && Array.isArray(D.values.plan) ? D.values.plan : null;
const sortedPlan = (p) => p.slice().sort((a, b) => DAYS.indexOf(a.day) - DAYS.indexOf(b.day));
function savePlan(p) { D = { ...D, values: { ...(D.values || {}), plan: p } }; amber.store.set("plan", p); render(); }

function table() {
  const t = N.tables.find((t) => t.columns.some((c) => /^exercise$/i.test(c.name)) && t.columns.some((c) => /^date$/i.test(c.name)));
  if (!t) return null;
  const ix = (re) => t.columns.findIndex((c) => re.test(c.name));
  return { t, d: ix(/^date$/i), e: ix(/^exercise$/i), w: ix(/weight|kg/i), r: ix(/reps/i) };
}
function logRows() {
  const T = table(); if (!T) return [];
  return T.t.rows.map((r, i) => ({ i, date: r[T.d], ex: r[T.e], w: num(r[T.w]), reps: String(r[T.r] ?? "").split(/[,\s]+/).map(Number).filter((x) => Number.isFinite(x) && x > 0) }))
    .filter((x) => x.date && x.ex);
}
const same = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
function lastOf(name) {
  return logRows().filter((x) => same(x.ex, name) && x.date < N.today).sort((a, b) => (a.date < b.date ? 1 : -1))[0] || null;
}
function targetFor(item, last) {
  if (item.reps !== "max") return item.reps;
  return last && last.reps.length ? Math.max(...last.reps) : 8;
}
function suggestion(item, last) {
  if (!last || last.w == null) return null;
  const step = Number(amber.settings.step) || 0;
  const tgt = item.reps === "max" ? null : item.reps;
  const full = tgt != null && last.reps.length >= item.sets && last.reps.every((r) => r >= tgt);
  return full && last.w > 0 ? last.w + step : last.w;
}
const drafts = () => (D && D.values && D.values.draft) || {};
function setDraft(key, val) {
  const all = { ...drafts() };
  if (val == null) delete all[key]; else all[key] = val;
  D = { ...D, values: { ...(D.values || {}), draft: all } };
  amber.store.set("draft", all);
  render();
}

function todayView() {
  const plan = getPlan() ? sortedPlan(getPlan()) : [];
  if (!plan.length) return `<div class="card empty">No plan yet. Open the Plan tab to add your days.</div>`;
  const wd = new Date(N.today + "T12:00:00Z").getUTCDay();
  let day = plan.find((p) => p.day === pickedDay);
  let note = "";
  if (!day) {
    day = plan.find((p) => DAYS.indexOf(p.day) === wd);
    if (!day) {
      for (let k = 1; k <= 7 && !day; k++) day = plan.find((p) => DAYS.indexOf(p.day) === (wd + k) % 7);
      note = `Rest day today. Next up: ${esc(day.day)}.`;
    }
  }
  const isToday = DAYS.indexOf(day.day) === wd;
  const rows = logRows();
  const doneNames = day.items.filter((it) => rows.some((r) => r.date === N.today && same(r.ex, it.name)));
  const chips = plan.map((p) => `<button class="chip" data-day="${esc(p.day)}" aria-pressed="${p.day === day.day}">${esc(p.day)}${DAYS.indexOf(p.day) === wd ? ' <span class="dot" aria-label="today">●</span>' : ""}</button>`).join("");
  const cards = day.items.map((it, idx) => {
    const logged = rows.find((r) => r.date === N.today && same(r.ex, it.name));
    const last = lastOf(it.name);
    const tgt = targetFor(it, last);
    if (logged) {
      return `<div class="card done"><div class="head"><span class="name">${esc(it.name)} ✓</span><span class="muted">logged</span></div>
        <div class="sets">${logged.reps.map((r) => `<span class="set on" style="display:inline-flex;align-items:center;justify-content:center">${r}</span>`).join("")}</div>
        <div class="row"><span class="grow muted">${logged.w ? fmt(logged.w) + " kg" : "Bodyweight"} · ${logged.reps.join(", ")}</span><button class="btn" data-undo="${logged.i}" aria-label="Undo log of ${esc(it.name)}">Undo</button></div></div>`;
    }
    const key = N.today + "|" + it.name;
    const dr = drafts()[key] || {};
    const sug = suggestion(it, last);
    const w = dr.w != null ? dr.w : sug != null ? sug : "";
    const reps = Array.from({ length: it.sets }, (_, i) => (dr.reps && dr.reps[i]) || 0);
    const any = reps.some((r) => r > 0);
    return `<div class="card"><div class="head"><span class="name">${esc(it.name)}</span><span class="target">${it.sets} × ${esc(it.reps)}</span></div>
      <div class="muted">${last ? `Last: ${last.w ? fmt(last.w) + " kg" : "BW"} × ${last.reps.join(", ")}${sug != null && last.w && sug !== last.w ? ` → try ${fmt(sug)} kg` : ""}` : "First time. Pick a starting weight."}</div>
      <div class="sets" role="group" aria-label="Sets for ${esc(it.name)}">${reps.map((r, i) => `<button class="set${r ? " on" : ""}" data-ex="${idx}" data-set="${i}" aria-label="Set ${i + 1}, ${r ? r + " reps done" : "not done, target " + tgt}">${r || tgt}</button>`).join("")}</div>
      <div class="row">
        <button class="btn sq" data-wd="${idx}" aria-label="Lower weight">−</button>
        <input class="w" inputmode="decimal" data-w="${idx}" value="${esc(w)}" aria-label="Weight in kg for ${esc(it.name)}" placeholder="BW">
        <button class="btn sq" data-wu="${idx}" aria-label="Raise weight">+</button>
        <span class="muted">kg</span><span class="grow"></span>
        <button class="btn pri" data-log="${idx}" ${any ? "" : "disabled"}>Log it</button></div></div>`;
  }).join("");
  return `${note ? `<div class="muted" style="margin:0 4px 10px">${note}</div>` : ""}
    <div class="days" role="group" aria-label="Training day">${chips}</div>
    ${isToday ? `<div class="muted">${doneNames.length} of ${day.items.length} exercises logged</div><div class="bar"><div style="width:${(100 * doneNames.length) / Math.max(1, day.items.length)}%"></div></div>` : `<div class="muted" style="margin:0 4px 10px">Logging goes under today's date (${esc(N.today)}).</div>`}
    <div class="err" role="alert">${esc(error)}</div>
    <div class="cols">${cards}</div>
    <div id="dayItems" hidden data-day="${esc(day.day)}"></div>`;
}

function planView() {
  const plan = getPlan() ? sortedPlan(getPlan()) : [];
  const used = plan.map((p) => p.day);
  const free = DAYS.slice(1).concat(DAYS[0]).filter((d) => !used.includes(d));
  return `<div class="cols">${plan.map((p) => `<div class="card"><div class="head"><span class="name">${esc(p.day)}</span><button class="btn del" data-rmday="${esc(p.day)}" aria-label="Remove ${esc(p.day)}">Remove day</button></div>
    <div class="muted" style="margin:6px 0 10px">Exercise · sets × reps (a number or "max")</div>
    ${p.items.map((it, i) => `<div class="editrow">
      <input class="grow" data-pn="${esc(p.day)}|${i}" value="${esc(it.name)}" aria-label="Exercise name">
      <input class="sm" inputmode="numeric" data-ps="${esc(p.day)}|${i}" value="${esc(it.sets)}" aria-label="Sets">
      <span>×</span>
      <input class="sm" data-pr="${esc(p.day)}|${i}" value="${esc(it.reps)}" aria-label="Reps">
      <button class="btn sq del" data-rmex="${esc(p.day)}|${i}" aria-label="Remove ${esc(it.name)}">×</button></div>`).join("")}
    <button class="btn" data-addex="${esc(p.day)}">+ Add exercise</button></div>`).join("")}</div>
    ${free.length ? `<div class="row" style="margin-top:14px"><select id="newday" aria-label="Day to add">${free.map((d) => `<option>${d}</option>`).join("")}</select><button class="btn pri" id="addday">Add day</button></div>` : ""}
    <p class="muted">Changes save as you go. Logged workouts stay in the note's table.</p>`;
}

function progressView() {
  const rows = logRows();
  const names = [];
  [...(getPlan() || []).flatMap((p) => p.items.map((i) => i.name)), ...rows.map((r) => r.ex)].forEach((n) => { if (!names.some((x) => same(x, n))) names.push(cap(n)); });
  if (!rows.length) return `<div class="card empty">Nothing logged yet. Finish a set and it shows up here.</div>`;
  const ex = names.find((n) => pickedEx && same(n, pickedEx)) || names.find((n) => rows.some((r) => same(r.ex, n))) || names[0];
  const mine = rows.filter((r) => same(r.ex, ex)).sort((a, b) => (a.date < b.date ? -1 : 1));
  const best = Math.max(0, ...mine.map((r) => r.w || 0));
  const vol = (r) => (r.w || 0) * r.reps.reduce((a, b) => a + b, 0);
  const first = mine[0], lastR = mine[mine.length - 1];
  const gain = first && lastR && first.w != null && lastR.w != null ? lastR.w - first.w : 0;
  return `<div class="row"><select class="grow" id="exsel" aria-label="Exercise">${names.map((n) => `<option ${same(n, ex) ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>
    <div class="stats"><div class="stat"><span class="muted">Best</span><b>${best ? fmt(best) : "BW"}</b></div><div class="stat"><span class="muted">Sessions</span><b>${mine.length}</b></div><div class="stat"><span class="muted">Change</span><b>${gain > 0 ? "+" : ""}${fmt(gain)}</b></div></div>
    <div class="card"><div class="chartbox"><canvas id="chart" role="img" aria-label="Weight over time for ${esc(ex)}"></canvas></div></div>
    <h2>History</h2>
    <div class="card">${mine.slice().reverse().map((r) => `<div class="hist"><span class="muted">${esc(r.date)}</span><span class="grow"><b>${r.w ? fmt(r.w) + " kg" : "BW"}</b> × ${r.reps.join(", ")}</span><span class="muted">${vol(r) ? fmt(vol(r)) + " kg vol" : ""}</span></div>`).join("")}</div>`;
}

function drawChart() {
  const cv = document.getElementById("chart");
  if (chart) { chart.destroy(); chart = null; }
  if (!cv || typeof Chart === "undefined") return;
  const rows = logRows();
  const sel = document.getElementById("exsel").value;
  const mine = rows.filter((r) => same(r.ex, sel)).sort((a, b) => (a.date < b.date ? -1 : 1));
  const cs = getComputedStyle(document.documentElement);
  const accent = cs.getPropertyValue("--iron").trim() || "#e5484d";
  const txt = cs.getPropertyValue("--amber-text-secondary").trim() || "#888";
  const grid = cs.getPropertyValue("--amber-separator").trim() || "#ccc";
  chart = new Chart(cv, { type: "line",
    data: { labels: mine.map((r) => r.date.slice(5)), datasets: [{ label: "Weight (kg)", data: mine.map((r) => r.w || 0), borderColor: accent, backgroundColor: accent, tension: .25, pointRadius: 5, fill: false }] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: txt }, grid: { color: grid } }, y: { ticks: { color: txt }, grid: { color: grid }, beginAtZero: false } } } });
}

function render() {
  if (!N) return;
  const body = tab === "today" ? todayView() : tab === "plan" ? planView() : progressView();
  document.getElementById("app").innerHTML = `<h1>${esc(N.title)}</h1>
    <div class="tabs" role="tablist">${[["today", "Today"], ["plan", "Plan"], ["progress", "Progress"]].map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join("")}</div>${body}`;
  bind();
  if (tab === "progress") drawChart();
}

function currentDay() {
  const el = document.getElementById("dayItems");
  const d = el && el.dataset.day;
  return (getPlan() || []).find((p) => p.day === d);
}
async function logEx(idx) {
  const day = currentDay(); if (!day) return;
  const it = day.items[idx];
  const key = N.today + "|" + it.name;
  const dr = drafts()[key] || {};
  const last = lastOf(it.name);
  const w = dr.w != null ? dr.w : suggestion(it, last);
  const reps = (dr.reps || []).filter((r) => r > 0);
  if (!reps.length) return;
  const T = table();
  const vals = { Date: N.today, Exercise: it.name, Weight: w == null || w === "" ? "" : String(w), Reps: reps.join(",") };
  let r;
  if (!T) r = { ok: false, error: "The note needs a table with Date, Exercise, Weight and Reps." };
  else {
    const named = { [T.t.columns[T.d].name]: vals.Date, [T.t.columns[T.e].name]: vals.Exercise };
    if (T.w >= 0) named[T.t.columns[T.w].name] = vals.Weight;
    if (T.r >= 0) named[T.t.columns[T.r].name] = vals.Reps;
    r = await amber.update({ op: "append_row", table: T.t.index, values: named });
  }
  error = r.ok ? "" : r.error;
  if (r.ok) setDraft(key, null); else render();
}

function bind() {
  const q = (s) => document.querySelectorAll(s);
  q("[data-tab]").forEach((b) => b.onclick = () => { tab = b.dataset.tab; error = ""; render(); });
  q("[data-day]").forEach((b) => b.onclick = () => { pickedDay = b.dataset.day; render(); });
  q("[data-set]").forEach((b) => b.onclick = () => {
    const day = currentDay(); const it = day.items[+b.dataset.ex]; const i = +b.dataset.set;
    const key = N.today + "|" + it.name; const dr = drafts()[key] || {};
    const reps = Array.from({ length: it.sets }, (_, k) => (dr.reps && dr.reps[k]) || 0);
    const tgt = targetFor(it, lastOf(it.name));
    reps[i] = reps[i] === 0 ? tgt : reps[i] - 1;
    setDraft(key, { ...dr, reps });
  });
  const setW = (idx, f) => {
    const day = currentDay(); const it = day.items[idx]; const key = N.today + "|" + it.name; const dr = drafts()[key] || {};
    const cur = dr.w != null ? num(dr.w) : suggestion(it, lastOf(it.name));
    setDraft(key, { ...dr, w: f(cur == null ? 0 : cur) });
  };
  const step = () => Number(amber.settings.step) || 2.5;
  q("[data-wd]").forEach((b) => b.onclick = () => setW(+b.dataset.wd, (c) => Math.max(0, c - step())));
  q("[data-wu]").forEach((b) => b.onclick = () => setW(+b.dataset.wu, (c) => c + step()));
  q("[data-w]").forEach((i) => i.onchange = () => setW(+i.dataset.w, () => num(i.value) ?? 0));
  q("[data-log]").forEach((b) => b.onclick = () => logEx(+b.dataset.log));
  q("[data-undo]").forEach((b) => b.onclick = async () => { const r = await amber.update({ op: "delete_row", table: table().t.index, row: +b.dataset.undo }); error = r.ok ? "" : r.error; render(); });
  const exs = document.getElementById("exsel"); if (exs) exs.onchange = () => { pickedEx = exs.value; render(); };
  // plan editing
  const edit = (ref, fn) => { const [day, i] = ref.split("|"); const p = JSON.parse(JSON.stringify(getPlan())); const d = p.find((x) => x.day === day); fn(d, +i, p); savePlan(p); };
  q("[data-pn]").forEach((e) => e.onchange = () => edit(e.dataset.pn, (d, i) => { d.items[i].name = cap(e.value) || d.items[i].name; }));
  q("[data-ps]").forEach((e) => e.onchange = () => edit(e.dataset.ps, (d, i) => { d.items[i].sets = Math.max(1, Math.min(10, parseInt(e.value) || d.items[i].sets)); }));
  q("[data-pr]").forEach((e) => e.onchange = () => edit(e.dataset.pr, (d, i) => { const v = e.value.trim().toLowerCase(); d.items[i].reps = v === "max" ? "max" : Math.max(1, parseInt(v) || (d.items[i].reps === "max" ? 5 : d.items[i].reps)); }));
  q("[data-rmex]").forEach((e) => e.onclick = () => edit(e.dataset.rmex, (d, i) => { d.items.splice(i, 1); }));
  q("[data-addex]").forEach((e) => e.onclick = () => edit(e.dataset.addex + "|0", (d) => { d.items.push({ name: "New exercise", sets: 3, reps: 5 }); }));
  q("[data-rmday]").forEach((e) => e.onclick = () => { if (pickedDay === e.dataset.rmday) pickedDay = null; savePlan(getPlan().filter((p) => p.day !== e.dataset.rmday)); });
  const ad = document.getElementById("addday");
  if (ad) ad.onclick = () => savePlan([...(getPlan() || []), { day: document.getElementById("newday").value, items: [{ name: "New exercise", sets: 3, reps: 5 }] }]);
}

amber.onChange((note, data) => {
  N = note; D = data || { values: {}, collections: {} };
  if (!getPlan()) {
    const plan = parsePlan(note.markdown);
    D = { ...D, values: { ...(D.values || {}), plan } };
    amber.store.set("plan", plan);
  }
  render();
});
