<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-libs" content="chart">
<style>
  *{box-sizing:border-box}body{margin:0;padding:clamp(1rem,3vw,1.5rem) var(--amber-gutter) 2rem;color:var(--amber-text);font-family:var(--amber-font)}.wrap{max-width:var(--amber-content-max);margin:0 auto}h1{font-size:clamp(1.75rem,4vw,3rem);line-height:1.02;letter-spacing:-.045em;margin:.2rem 0 .35rem;font-family:var(--amber-font-rounded)}h2{font-size:1rem;margin:0 0 .75rem;letter-spacing:-.015em}h3{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--amber-text-secondary);font-weight:700;margin:0 0 .4rem}.lede{color:var(--amber-text-secondary);margin:0 0 1rem;font-size:1rem}.tabs{display:flex;gap:.45rem;overflow:auto;padding:.15rem .05rem .65rem;margin:0 0 .35rem;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{display:inline-flex;align-items:center;text-decoration:none;font:inherit;font-weight:750;min-height:44px;padding:.55rem .85rem;border-radius:999px;border:1px solid var(--amber-separator);background:var(--amber-surface);color:var(--amber-text);white-space:nowrap}.tab[aria-selected="true"]{background:var(--amber-accent-soft);color:var(--amber-text);border-color:var(--amber-accent)}.hero{display:grid;grid-template-columns:1fr;gap:.85rem;margin-bottom:1rem}.summary{background:linear-gradient(135deg,var(--amber-accent-soft),var(--amber-surface));border:1px solid var(--amber-separator);border-radius:calc(var(--amber-radius) + .4rem);padding:1rem;overflow:hidden;position:relative}.summary:after{content:"";position:absolute;right:-3rem;top:-4rem;width:11rem;height:11rem;border-radius:50%;background:color-mix(in srgb,var(--amber-accent) 18%,transparent);pointer-events:none}.big{font-size:clamp(2rem,8vw,4.3rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.06em;position:relative;z-index:1}.meta{display:flex;gap:.55rem;flex-wrap:wrap;margin-top:.75rem;position:relative;z-index:1}.pill{display:inline-flex;align-items:center;gap:.35rem;min-height:2rem;padding:.3rem .65rem;border-radius:999px;background:var(--amber-surface);border:1px solid var(--amber-separator);font-size:.88rem;color:var(--amber-text-secondary)}.pill strong{color:var(--amber-text)}.cards{display:none;grid-template-columns:1fr;gap:.85rem}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:1rem;min-width:0;box-shadow:0 .5rem 1.8rem color-mix(in srgb,var(--amber-text) 5%,transparent)}.stat{display:flex;flex-direction:column;gap:.2rem;min-height:7rem;justify-content:space-between}.stat .label{color:var(--amber-text-secondary);font-size:.88rem}.stat .value{font-size:1.55rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.stat .note{font-size:.88rem;color:var(--amber-text-secondary)}.grid{display:grid;grid-template-columns:1fr;gap:1rem}.chartBox{height:18rem;position:relative}.chartBox.small{height:15.5rem}.lineGrid{display:grid;gap:.75rem}.lineCard{display:grid;grid-template-columns:1fr;gap:.6rem;padding:.8rem;border-radius:var(--amber-radius-small);background:var(--amber-bg);border:1px solid var(--amber-separator)}.lineHead{display:flex;align-items:center;justify-content:space-between;gap:.5rem}.lineName{display:flex;align-items:center;gap:.5rem;font-weight:750;min-width:0;overflow-wrap:anywhere}.dot{width:.75rem;height:.75rem;border-radius:50%;flex:none}.trend{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.trend.up{color:#237a42}.trend.down{color:var(--amber-danger)}.trend.flat{color:var(--amber-text-secondary)}@media (prefers-color-scheme:dark){.trend.up{color:#7ddf9b}}.bar{height:.55rem;background:var(--amber-fill);border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;border-radius:999px;min-width:.15rem}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.75rem;align-items:center;padding:.72rem 0;border-top:1px solid var(--amber-separator)}.row:first-child{border-top:0;padding-top:.15rem}.row:last-child{padding-bottom:.1rem}.muted{color:var(--amber-text-secondary);font-size:.88rem}.num{font-variant-numeric:tabular-nums;font-weight:750;white-space:nowrap}.empty{text-align:center;color:var(--amber-text-secondary);padding:2rem 1rem;border:1px dashed var(--amber-separator);border-radius:var(--amber-radius);background:var(--amber-surface)}canvas{max-width:100%}@media (min-width:700px){.cards{display:grid;grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:1.35fr .65fr}.grid{grid-template-columns:1.2fr .8fr}.wide{grid-column:1/-1}.lineGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.chartBox{height:20rem}}@media (min-width:1100px){.grid{grid-template-columns:1.25fr .75fr}.chartBox{height:22rem}.chartBox.small{height:18rem}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toNum=v=>{const n=parseFloat(String(v??"").replace(/[\s,]/g,""));return Number.isFinite(n)?n:0};
const monthOrder={jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,sept:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
const colors=["#D89213","#2F7D5B","#4D74CF","#B55B96","#7C68B6","#BF5B45","#2B8C9B","#8B7B2A"];
let charts=[],active="trend";
function killCharts(){charts.forEach(c=>c.destroy());charts=[]}function fmt(n){return new Intl.NumberFormat(undefined,{maximumFractionDigits:0}).format(n)}function short(n){return new Intl.NumberFormat(undefined,{notation:"compact",maximumFractionDigits:1}).format(n)}function pct(n){return `${n>0?"+":""}${(n*100).toFixed(Math.abs(n)<.1?1:0)}%`}
function model(note){const table=note.tables&&note.tables[0];if(!table||!table.rows||table.rows.length===0||table.columns.length<2)return null;const lines=table.columns.slice(1).map((c,i)=>({name:c.name,col:i+1,color:colors[i%colors.length]}));const rows=table.rows.map((r,idx)=>{const label=String(r[0]??`Row ${idx+1}`).trim()||`Row ${idx+1}`;const key=monthOrder[label.toLowerCase()]||idx+1;const vals=lines.map(l=>toNum(r[l.col]));return{label,key,vals,total:vals.reduce((a,b)=>a+b,0)}}).sort((a,b)=>a.key-b.key);const labels=rows.map(r=>r.label),totals=rows.map(r=>r.total),grand=totals.reduce((a,b)=>a+b,0),last=rows[rows.length-1],best=rows.reduce((a,b)=>b.total>a.total?b:a,rows[0]),worst=rows.reduce((a,b)=>b.total<a.total?b:a,rows[0]),prev=rows.length>1?rows[rows.length-2].total:0,mom=prev?((last.total-prev)/prev):0;const lineStats=lines.map((l,idx)=>{const vals=rows.map(r=>r.vals[idx]),total=vals.reduce((a,b)=>a+b,0),start=vals.find(v=>v!==0)??0,end=vals[vals.length-1]??0,trend=start?((end-start)/start):0;let changes=[];for(let i=1;i<vals.length;i++){if(vals[i-1])changes.push((vals[i]-vals[i-1])/vals[i-1])}const avg=changes.length?changes.reduce((a,b)=>a+b,0)/changes.length:0;return{...l,total,start,end,trend,avg,share:grand?total/grand:0}}).sort((a,b)=>b.total-a.total);return{table,lines,rows,labels,totals,grand,last,best,worst,mom,lineStats}}
function tabs(){return `<nav class="tabs" role="tablist" aria-label="Dashboard sections">${[["trend","Trend"],["mix","Mix"],["months","Best & worst"]].map(([id,label])=>`<a class="tab" role="tab" aria-selected="${active===id}" href="#${id}" data-tab="${id}">${label}</a>`).join("")}</nav>`}
function render(note){killCharts();const app=document.getElementById("app"),m=model(note);if(!m){app.innerHTML=`<h1>${esc(note.title)}</h1><p class="lede">Sales dashboard</p><div class="empty">Add a table with Month plus one or more sales lines.</div>`;return}const bestLine=m.lineStats[0];let panel="";if(active==="trend")panel=`<section class="grid"><div class="card wide"><h2>Monthly sales trend</h2><div class="chartBox"><canvas id="trendChart" aria-label="Monthly sales trend chart"></canvas></div></div><div class="card wide"><h2>Line performance</h2><div class="lineGrid">${m.lineStats.map(s=>`<article class="lineCard"><div class="lineHead"><div class="lineName"><span class="dot" style="background:${s.color}"></span><span>${esc(s.name)}</span></div><span class="trend ${s.trend>0.005?"up":s.trend<-0.005?"down":"flat"}">${pct(s.trend)}</span></div><div class="muted">${fmt(s.end)} latest · avg MoM ${pct(s.avg)}</div><div class="bar" aria-label="${esc(s.name)} share"><span style="width:${Math.max(2,s.share*100)}%;background:${s.color}"></span></div><div class="muted">${Math.round(s.share*100)}% of total mix</div></article>`).join("")}</div></div></section>`;if(active==="mix")panel=`<section class="grid"><div class="card"><h2>Sales mix</h2><div class="chartBox small"><canvas id="mixChart" aria-label="Sales mix chart"></canvas></div></div><div class="card"><h2>Mix ranking</h2>${m.lineStats.map(s=>`<div class="row"><div><strong>${esc(s.name)}</strong><div class="muted">${Math.round(s.share*100)}% of total</div></div><div class="num">${fmt(s.total)}</div></div>`).join("")}</div></section>`;if(active==="months")panel=`<section class="grid"><div class="card"><h2>Best and worst months</h2><div class="row"><div><strong>Best: ${esc(m.best.label)}</strong><div class="muted">Above average by ${short(m.best.total-(m.grand/m.rows.length))}</div></div><div class="num">${fmt(m.best.total)}</div></div><div class="row"><div><strong>Worst: ${esc(m.worst.label)}</strong><div class="muted">Below average by ${short((m.grand/m.rows.length)-m.worst.total)}</div></div><div class="num">${fmt(m.worst.total)}</div></div><div class="row"><div><strong>Latest: ${esc(m.last.label)}</strong><div class="muted">${m.mom>=0?"Up":"Down"} ${pct(Math.abs(m.mom))} from the previous month</div></div><div class="num">${fmt(m.last.total)}</div></div></div><div class="card"><h2>Monthly ranking</h2>${m.rows.slice().sort((a,b)=>b.total-a.total).map((r,i)=>`<div class="row"><div><strong>${i+1}. ${esc(r.label)}</strong><div class="muted">${r===m.best?"Best month":r===m.worst?"Worst month":"Total sales"}</div></div><div class="num">${fmt(r.total)}</div></div>`).join("")}</div></section>`;app.innerHTML=`<h1>${esc(note.title)}</h1><p class="lede">Charts for how each line is trending, the sales mix, and the best and worst months.</p>${tabs()}<section class="hero" aria-label="Sales summary"><div class="summary"><h3>Total sales</h3><div class="big">${short(m.grand)}</div><div class="meta"><span class="pill"><strong>${esc(m.last.label)}</strong> ${short(m.last.total)}</span><span class="pill"><strong>${m.mom>=0?"▲":"▼"} ${pct(m.mom)}</strong> vs prior month</span><span class="pill"><strong>${esc(bestLine?bestLine.name:"")}</strong> leads the mix</span></div></div><div class="cards"><div class="card stat"><span class="label">Best month</span><span class="value">${esc(m.best.label)}</span><span class="note">${fmt(m.best.total)}</span></div><div class="card stat"><span class="label">Worst month</span><span class="value">${esc(m.worst.label)}</span><span class="note">${fmt(m.worst.total)}</span></div><div class="card stat"><span class="label">Range</span><span class="value">${short(m.best.total-m.worst.total)}</span><span class="note">best minus worst</span></div></div></section>${panel}`;document.querySelectorAll(".tab").forEach(b=>b.onclick=e=>{e.preventDefault();active=b.dataset.tab;render(amber.note)});requestAnimationFrame(()=>makeCharts(m))}
function makeCharts(m){if(typeof Chart==="undefined")return;const root=getComputedStyle(document.documentElement),text=root.getPropertyValue("--amber-text").trim(),muted=root.getPropertyValue("--amber-text-secondary").trim(),sep=root.getPropertyValue("--amber-separator").trim(),surface=root.getPropertyValue("--amber-surface").trim();Chart.defaults.color=muted;Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;const trend=document.getElementById("trendChart");if(trend){const datasets=m.lines.map((l,idx)=>({label:l.name,data:m.rows.map(r=>r.vals[idx]),borderColor:l.color,backgroundColor:l.color,tension:.34,pointRadius:3,pointHoverRadius:5,borderWidth:3}));datasets.push({label:"Total",data:m.totals,borderColor:text,backgroundColor:"transparent",borderWidth:4,tension:.28,pointRadius:0,borderDash:[6,5]});charts.push(new Chart(trend,{type:"line",data:{labels:m.labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{legend:{position:"bottom",labels:{usePointStyle:true,boxWidth:8}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.parsed.y)}`}}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:sep},ticks:{callback:v=>short(v)}}}}}))}const mix=document.getElementById("mixChart");if(mix)charts.push(new Chart(mix,{type:"doughnut",data:{labels:m.lineStats.map(s=>s.name),datasets:[{data:m.lineStats.map(s=>s.total),backgroundColor:m.lineStats.map(s=>s.color),borderColor:surface,borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{position:"bottom",labels:{usePointStyle:true,boxWidth:8}},tooltip:{callbacks:{label:c=>`${c.label}: ${fmt(c.parsed)} (${Math.round((c.parsed/(m.grand||1))*100)}%)`}}}}}))}
amber.onChange(render);
</script>
</body>
</html>
