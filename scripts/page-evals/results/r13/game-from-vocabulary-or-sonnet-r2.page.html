<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="amber-libs" content="confetti">
<style>
*{box-sizing:border-box}
:root{--st:#1f1b4d}@media(prefers-color-scheme:dark){:root{--st:#16133b}}
.stage{max-width:var(--amber-content-max);margin:0 auto;background:var(--st);color:#fff;border-radius:var(--amber-radius);padding:20px clamp(14px,4vw,32px) 28px;min-height:70vh;font-family:var(--amber-font-rounded)}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:#cfcbfa;font-size:.9rem;margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{background:#2e2a6b;border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums;color:#fbbf24}
.stat span{font-size:.8rem;color:#cfcbfa}
button{font:inherit;font-weight:700;min-height:48px;border:0;border-radius:14px;cursor:pointer;color:#fff;background:#2e2a6b}
button:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}
.play{width:100%;background:#fbbf24;color:#1f1b4d;font-size:1.25rem;min-height:60px;margin-bottom:22px}
.ghost{background:#3b3790;padding:0 18px}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.v{background:#2e2a6b;border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:5px;min-height:52px}
.v small{color:#cfcbfa;overflow-wrap:anywhere}
.pips{display:flex;gap:3px}.pips i{width:100%;height:6px;border-radius:3px;background:#4a45a3}.pips i.on{background:#fbbf24}
h2{font-size:1rem;margin:0 0 10px;color:#cfcbfa;font-weight:600}
.hud{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums;font-weight:700;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.hud .sc{color:#fbbf24;font-size:1.3rem}
.bar{height:10px;background:#2e2a6b;border-radius:5px;overflow:hidden;margin-bottom:22px}
.bar div{height:100%;background:#fbbf24;width:100%}
.dirl{color:#cfcbfa;font-size:.85rem;text-align:center}
.word{font-size:clamp(2rem,9vw,3.2rem);font-weight:800;text-align:center;margin:6px 0 22px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
.opt{background:#2e2a6b;font-size:1.1rem;padding:12px 14px;min-height:60px;text-align:left;overflow-wrap:anywhere;border:2px solid #4a45a3}
.opt.ok{background:#15803d;border-color:#fff}.opt.bad{background:#b91c1c;border-color:#fff}
.msg{min-height:1.6em;text-align:center;margin-top:14px;font-weight:700}
.big{font-size:3.4rem;font-weight:800;color:#fbbf24;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
.center{text-align:center}
.miss{display:flex;justify-content:space-between;gap:10px;background:#2e2a6b;border-radius:12px;padding:10px 12px;margin-bottom:6px}
.row2{display:flex;gap:10px;margin-top:16px}.row2 button{flex:1}
@media(min-width:700px){.opts{grid-template-columns:1fr 1fr}.stage{padding-top:28px}}
@media(prefers-reduced-motion:no-preference){.opt{transition:background .15s}}
</style>
</head>
<body>
<main class="stage" id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const ROUND=10,SECS=8000;
let pool=[],V={},title="",today="",G={screen:"home"},raf=0;
const app=document.getElementById("app");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const mast=k=>(V.mastery&&V.mastery[k])||0;
function readNote(note,data){
  title=note.title;today=note.today;V=(data&&data.values)||{};
  const t=note.tables.find(t=>t.columns.length>=2);
  pool=t?t.rows.map(r=>({es:(r[0]||"").trim(),en:(r[1]||"").trim()})).filter(x=>x.es&&x.en):[];
}
function pips(n){let s="";for(let i=0;i<5;i++)s+=`<i class="${i<n?"on":""}"></i>`;return `<div class="pips" role="img" aria-label="Mastery ${n} of 5">${s}</div>`}
function home(){
  const rounds=V.rounds&&V.rounds.date===today?V.rounds.n:0;
  const learned=pool.filter(p=>mast(p.es)>=4).length;
  let h=`<h1>${esc(title)}</h1><p class="sub">${ROUND} questions. Three lives. Beat the clock.</p>`;
  if(pool.length<4){app.innerHTML=h+`<p>Add at least 4 rows (Spanish | English) to the table in the note to play.</p>`;return}
  h+=`<div class="stats"><div class="stat"><b>${V.streak||0}</b><span>day streak</span></div><div class="stat"><b>${V.best||0}</b><span>best score</span></div><div class="stat"><b>${learned}/${pool.length}</b><span>learned</span></div></div>
  <button class="play" id="go">${rounds?"Play again":"Play today's round"}</button>
  <h2>Your verbs${rounds?` · ${rounds} round${rounds>1?"s":""} today`:""}</h2><div class="dots">`+
  pool.map(p=>`<div class="v"><b>${esc(p.es)}</b><small>${esc(p.en)}</small>${pips(mast(p.es))}</div>`).join("")+`</div>`;
  app.innerHTML=h;document.getElementById("go").onclick=start;
}
function makeQ(p,dir){
  const ans=dir?p.es:p.en,others=shuffle(pool.filter(x=>x!==p).map(x=>dir?x.es:x.en).filter(t=>t!==ans));
  const uniq=[...new Set(others)].slice(0,3);
  return{p,dir,prompt:dir?p.en:p.es,ans,opts:shuffle([ans,...uniq])};
}
function start(){
  const w=pool.map(p=>({p,w:1+(5-mast(p.es))*1.5+Math.random()*3}));
  w.sort((a,b)=>b.w-a.w);
  const picks=w.slice(0,Math.min(ROUND,pool.length)).map(x=>x.p);
  G={screen:"play",qs:shuffle(picks).map(p=>makeQ(p,Math.random()<.4)),i:0,score:0,lives:3,combo:0,maxCombo:0,missed:[],right:0,locked:false,mastery:Object.assign({},V.mastery||{})};
  question();
}
function question(){
  const q=G.qs[G.i];G.locked=false;G.t0=performance.now();G.left=SECS;
  app.innerHTML=`<h1>${esc(title)}</h1>
  <div class="hud"><span>Q ${G.i+1}/${G.qs.length}</span><span class="sc" id="sc">${G.score}</span><span id="lv" aria-label="${G.lives} lives left">Lives ${"♥".repeat(G.lives)}</span></div>
  <div class="bar" role="img" aria-label="Time left"><div id="tb"></div></div>
  <div class="dirl">${q.dir?"English → Spanish":"Spanish → English"}${G.combo>1?` · combo x${G.combo}`:""}</div>
  <div class="word">${esc(q.prompt)}</div>
  <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>
  <div class="msg" id="msg"></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
}
let last=0;
function tick(ts){
  if(G.screen!=="play"||G.locked)return;
  if(document.visibilityState!=="visible"){G.t0=performance.now()-(SECS-G.left);raf=requestAnimationFrame(tick);return}
  G.left=Math.max(0,SECS-(performance.now()-G.t0));
  const tb=document.getElementById("tb");if(tb)tb.style.width=(G.left/SECS*100)+"%";
  if(G.left<=0)return answer(-1);
  raf=requestAnimationFrame(tick);
}
function answer(i){
  if(G.locked)return;G.locked=true;cancelAnimationFrame(raf);
  const q=G.qs[G.i],btns=[...app.querySelectorAll(".opt")],ok=i>=0&&q.opts[i]===q.ans,k=q.p.es;
  btns.forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.ans){b.classList.add("ok");if(!ok)b.textContent="✓ "+q.opts[j]}});
  const msg=document.getElementById("msg");
  if(ok){
    G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);G.right++;
    const pts=10+Math.min(G.combo,5)*2+Math.floor(G.left/1000);G.score+=pts;
    G.mastery[k]=Math.min(5,(G.mastery[k]||0)+1);
    btns[i].classList.add("ok");btns[i].textContent="✓ "+q.opts[i];msg.textContent="+"+pts+(G.combo>2?" 🔥 combo!":"");
  }else{
    G.combo=0;G.lives--;G.missed.push(q);G.mastery[k]=Math.max(0,(G.mastery[k]||0)-1);
    if(i>=0){btns[i].classList.add("bad");btns[i].textContent="✗ "+q.opts[i]}
    msg.textContent=i<0?"Time's up!":"Not quite. Lives left: "+G.lives;
  }
  document.getElementById("sc").textContent=G.score;
  setTimeout(next,ok?650:1400);
}
function next(){
  if(G.screen!=="play")return;
  G.i++;
  if(G.lives<=0||G.i>=G.qs.length)return finish();
  question();
}
function dayBefore(d){const t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()-1);return t.toISOString().slice(0,10)}
function finish(){
  G.screen="end";
  const best=Math.max(V.best||0,G.score),newBest=G.score>(V.best||0);
  let streak=V.streak||0;
  if(V.lastDay!==today)streak=(V.lastDay===dayBefore(today))?streak+1:1;
  const n=(V.rounds&&V.rounds.date===today?V.rounds.n:0)+1;
  const flawless=G.right===G.qs.length;
  G.saveErr="";amber.setData({values:{best,streak,lastDay:today,mastery:G.mastery,rounds:{date:today,n}}}).then(r=>{if(r&&r.ok===false){const m=document.getElementById("sv");if(m)m.textContent="Couldn't save progress: "+r.error}});
  V=Object.assign({},V,{best,streak,lastDay:today,mastery:G.mastery,rounds:{date:today,n}});
  app.innerHTML=`<h1>${esc(title)}</h1>
  <p class="sub center">${G.lives<=0?"Out of lives":"Round complete"}${newBest?" · new best!":""}</p>
  <div class="big">${G.score}</div>
  <div class="stats"><div class="stat"><b>${G.right}/${G.qs.length}</b><span>correct</span></div><div class="stat"><b>x${G.maxCombo}</b><span>best combo</span></div><div class="stat"><b>${streak}</b><span>day streak</span></div></div>
  ${G.missed.length?`<h2>Review these</h2>`+G.missed.map(q=>`<div class="miss"><b>${esc(q.p.es)}</b><span>${esc(q.p.en)}</span></div>`).join(""):`<p class="center"><b>Flawless! 🎉</b></p>`}
  <p class="center" id="sv" role="alert"></p><div class="row2"><button class="play" id="again" style="margin:0">Play again</button><button class="ghost" id="hm">Home</button></div>`;
  document.getElementById("again").onclick=start;
  document.getElementById("hm").onclick=()=>{G.screen="home";home()};
  if((newBest||flawless)&&window.confetti&&!matchMedia("(prefers-reduced-motion: reduce)").matches)confetti({particleCount:120,spread:80,origin:{y:.4}});
}
amber.onChange((note,data)=>{
  readNote(note,data);
  if(G.screen==="home")home();
});
document.addEventListener("keydown",e=>{
  if(G.screen==="play"&&!G.locked&&/^[1-4]$/.test(e.key)&&G.qs[G.i].opts[+e.key-1]!==undefined)answer(+e.key-1);
});
</script>
</body>
</html>
