<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="amber-libs" content="chart">
<meta name="amber-settings" content='{"settings":[{"key":"unit","label":"Weight unit","type":"text","default":"kg"},{"key":"step","label":"Weight step","type":"number","default":2.5,"help":"Used by the + and - buttons and the suggested increase."}]}'>
<style>
  * { box-sizing: border-box; }
  :root { --ok: #1f8a4c; --ok-text: #fff; }
  @media (prefers-color-scheme: dark) { :root { --ok: #3ac574; --ok-text: #08210f; } }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 16px var(--amber-gutter) calc(96px + env(safe-area-inset-bottom)); }
  h1 { font-family: var(--amber-font-rounded); font-size: 1.9rem; letter-spacing: -.02em; margin: 0; }
  h2 { font-size: 1.1rem; margin: 0; }
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .muted { color: var(--amber-text-secondary); font-size: .875rem; }
  .num { font-variant-numeric: tabular-nums; }
  .days { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; }
  .days button { flex: 1 0 auto; background: var(--amber-fill); color: var(--amber-text); }
  .days button[aria-pressed="true"] { background: var(--amber-accent-soft); color: var(--amber-text); box-shadow: inset 0 0 0 2px var(--amber-accent); }
  button { font: inherit; font-weight: 600; min-height: 44px; min-width: 44px; padding: 0 16px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-accent); color: var(--amber-on-accent); cursor: pointer; }
  button.ghost { background: var(--amber-fill); color: var(--amber-text); }
  button.danger { background: var(--amber-fill); color: var(--amber-danger); }
  input, select { font: inherit; color: var(--amber-text); background: var(--amber-field); border: 1px solid var(--amber-field-border); border-radius: var(--amber-radius-small); padding: 8px 10px; min-height: 44px; width: 100%; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--amber-text-secondary); }
  .summary { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 14px 16px; margin-bottom: 14px; }
  .bar { height: 10px; background: var(--amber-fill); border-radius: 5px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--ok); transition: width .25s; }
  .big { font-size: 2rem; font-weight: 800; font-family: var(--amber-font-rounded); }
  .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
  .ex { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 14px 16px; }
  .ex.done { border-color: var(--ok); }
  .exh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .target { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--amber-accent-text); }
  .wt { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
  .wt input { text-align: center; font-size: 1.25rem; font-weight: 700; max-width: 120px; font-variant-numeric: tabular-nums; }
  .wt button { padding: 0; width: 48px; font-size: 1.3rem; }
  .sets { display: flex; flex-wrap: wrap; gap: 10px; }
  .set { width: 60px; height: 60px; min-height: 60px; border-radius: 50%; padding: 0; font-size: 1.3rem; background: var(--amber-fill); color: var(--amber-text-secondary); border: 2px solid var(--amber-field-border); font-variant-numeric: tabular-nums; }
  .set.on { background: var(--ok); color: var(--ok-text); border-color: var(--ok); }
  .set.part { background: var(--amber-accent-soft); color: var(--amber-text); border-color: var(--amber-accent); }
  .hint { margin-top: 10px; }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 12px 14px; margin-bottom: 14px; }
  .prow { display: grid; grid-template-columns: 1fr 64px 76px 44px; gap: 8px; align-items: end; margin-top: 10px; }
  .prow button { padding: 0; }
  .add { display: grid; grid-template-columns: 90px 1fr 64px 76px; gap: 8px; align-items: end; }
  .add button { grid-column: 1 / -1; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 10px 12px; }
  .stat b { display: block; font-size: 1.4rem; font-family: var(--amber-font-rounded); font-variant-numeric: tabular-nums; }
  .chart { position: relative; height: 240px; }
  .sess { padding: 10px 0; border-top: 1px solid var(--amber-separator); }
  .sess:first-child { border-top: 0; }
  .empty { padding: 24px 8px; text-align: center; color: var(--amber-text-secondary); }
  .err { color: var(--amber-danger); min-height: 1.2em; font-size: .9rem; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 8px; padding: 8px var(--amber-gutter) calc(8px + env(safe-area-inset-bottom)); background: var(--amber-surface); border-top: 1px solid var(--amber-separator); z-index: 5; }
  nav button { flex: 1; max-width: 220px; background: transparent; color: var(--amber-text-secondary); }
  nav button[aria-current="page"] { background: var(--amber-accent-soft); color: var(--amber-text); }
  @media (max-width: 400px) { .prow { grid-template-columns: 1fr 56px 68px 44px; } .add { grid-template-columns: 80px 1fr 56px 68px; } }
</style>
</head>
<body>
<main id="app"></main>
<nav aria-label="Sections">
  <button data-act="screen" data-v="today">Today</button>
  <button data-act="screen" data-v="plan">Plan</button>
  <button data-act="screen" data-v="progress">Progress</button>
</nav>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const FULL = { sun: "Sunday", mon: "Monday", tue: "Tuesday", wed: "Wednesday", thu: "Thursday", fri: "Friday", sat: "Saturday" };
  const ci = (t, re) => t.columns.findIndex((c) => re.test(c.name));
  const num = (s) => { const n = parseFloat(String(s ?? "").replace(/\s/g, "").replace(",", ".")); return isNaN(n) ? null : n; };
  const fmt = (n) => String(Math.round(n * 100) / 100);
  let screen = (amber.data && amber.data.values && amber.data.values.screen) || "today";
  let selDay = null, progEx = null, error = "", busy = false, chart = null;
  const drafts = {};

  function model(note) {
    const pt = note.tables.find((t) => ci(t, /^day$/i) >= 0 && ci(t, /^exercise$/i) >= 0);
    const lt = note.tables.find((t) => ci(t, /^date$/i) >= 0 && ci(t, /^exercise$/i) >= 0 && ci(t, /^reps$/i) >= 0);
    const plan = [], log = [];
    if (pt) {
      const d = ci(pt, /^day$/i), e = ci(pt, /^exercise$/i), s = ci(pt, /^sets$/i), r = ci(pt, /^reps$/i);
      pt.rows.forEach((row, i) => { if ((row[e] || "").trim()) plan.push({ i, day: (row[d] || "").trim().slice(0, 3).toLowerCase(), ex: row[e].trim(), sets: parseInt(row[s]) || 1, reps: r >= 0 ? (row[r] || "").trim() : "" }); });
    }
    if (lt) {
      const d = ci(lt, /^date$/i), e = ci(lt, /^exercise$/i), w = ci(lt, /^weight$/i), r = ci(lt, /^reps$/i);
      lt.rows.forEach((row, i) => { if ((row[e] || "").trim()) log.push({ i, date: (row[d] || "").trim(), ex: row[e].trim(), w: w >= 0 ? (row[w] || "").trim() : "", reps: (row[r] || "").split(",").map((x) => parseInt(x)).filter((x) => !isNaN(x)) }); });
    }
    return { pt, lt, plan, log };
  }
  const key = (s) => s.toLowerCase();
  const dayOf = (date) => DAYS[new Date(date + "T12:00:00").getDay()].toLowerCase();
  const addDays = (date, n) => { const d = new Date(date + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };

  function lastFor(m, ex, today) {
    let best = null;
    for (const r of m.log) if (key(r.ex) === key(ex) && r.date < today && (!best || r.date >= best.date)) best = r;
    return best;
  }
  function suggest(item, last, step) {
    if (!last) return { w: "", note: "No history yet" };
    const w = num(last.w);
    if (w === null) return { w: last.w, note: "Last: " + last.reps.join(", ") };
    const tgt = parseInt(item.reps);
    const ok = !isNaN(tgt) && last.reps.length >= item.sets && last.reps.every((r) => r >= tgt);
    const inc = /deadlift/i.test(item.ex) ? step * 2 : step;
    return ok ? { w: fmt(w + inc), note: "Last: " + fmt(w) + " × " + last.reps.join(",") + " — all reps hit, +" + fmt(inc) }
              : { w: fmt(w), note: "Last: " + fmt(w) + " × " + last.reps.join(",") + " — repeat" };
  }

  function render(note) {
    const m = model(note), app = document.getElementById("app");
    const unit = (amber.settings && amber.settings.unit) || "kg";
    document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-current", b.dataset.v === screen ? "page" : "false"));
    const days = [...new Set(m.plan.map((p) => p.day))].sort((a, b) => DAYS.findIndex((x) => x.toLowerCase() === a) - DAYS.findIndex((x) => x.toLowerCase() === b));
    if (!m.pt) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="empty">Add a plan table with Day, Exercise, Sets and Reps columns, and a log table with Date, Exercise, Weight and Reps.</div>`; return; }
    if (screen === "plan") app.innerHTML = planHTML(note, m, days);
    else if (screen === "progress") { app.innerHTML = progressHTML(note, m, unit); drawChart(m, unit); }
    else app.innerHTML = todayHTML(note, m, days, unit);
  }

  function todayHTML(note, m, days, unit) {
    const today = note.today, todayKey = dayOf(today);
    if (!selDay || !days.includes(selDay)) {
      selDay = days.includes(todayKey) ? todayKey : null;
      for (let n = 1; !selDay && n <= 7; n++) { const k = dayOf(addDays(today, n)); if (days.includes(k)) selDay = k; }
      selDay = selDay || days[0];
    }
    const items = m.plan.filter((p) => p.day === selDay);
    const step = (amber.settings && num(amber.settings.step)) || 2.5;
    let total = 0, done = 0;
    const cards = items.map((p) => {
      const row = m.log.find((r) => r.date === today && key(r.ex) === key(p.ex));
      const last = lastFor(m, p.ex, today), sg = suggest(p, last, step);
      const w = row ? row.w : (drafts[key(p.ex)] ?? sg.w);
      const n = row ? row.reps.length : 0;
      total += p.sets; done += Math.min(n, p.sets);
      const tgt = parseInt(p.reps);
      let bub = "";
      for (let k = 0; k < Math.max(p.sets, n); k++) {
        const r = row ? row.reps[k] : undefined;
        const cls = r === undefined ? "" : (!isNaN(tgt) && r < tgt ? "part" : "on");
        bub += `<button class="set ${cls}" data-act="set" data-ex="${esc(p.ex)}" data-k="${k}" aria-label="${esc(p.ex)} set ${k + 1}${r !== undefined ? ", " + r + " reps done" : ", not done"}">${r !== undefined ? r : ""}</button>`;
      }
      return `<section class="ex ${n >= p.sets ? "done" : ""}">
        <div class="exh"><h2>${esc(p.ex)}</h2><span class="target">${p.sets} × ${esc(p.reps || "?")}</span></div>
        <div class="wt"><button class="ghost" data-act="w" data-d="-1" data-ex="${esc(p.ex)}" aria-label="Lower weight">−</button>
          <input inputmode="decimal" data-act="wset" data-ex="${esc(p.ex)}" value="${esc(w)}" placeholder="BW" aria-label="${esc(p.ex)} weight in ${esc(unit)}">
          <button class="ghost" data-act="w" data-d="1" data-ex="${esc(p.ex)}" aria-label="Raise weight">+</button><span class="muted">${esc(unit)}</span></div>
        <div class="sets">${bub}</div>
        <div class="muted hint">${esc(sg.note)}</div></section>`;
    }).join("");
    const pct = total ? Math.round(done / total * 100) : 0;
    const isToday = selDay === todayKey;
    return `<div class="top"><div><h1>${esc(note.title)}</h1><div class="muted">${esc(FULL[todayKey])}, ${esc(today)}</div></div></div>
      <div class="days" role="group" aria-label="Workout day">${days.map((d) => `<button data-act="day" data-v="${d}" aria-pressed="${d === selDay}">${esc(FULL[d] ? FULL[d].slice(0, 3) : d)}${d === todayKey ? " · today" : ""}</button>`).join("")}</div>
      ${items.length ? `<div class="summary"><div class="exh"><span class="big num">${done}/${total}</span><span class="muted">sets done${isToday ? "" : " · logs to today"}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
      <div class="grid">${cards}</div><p class="muted">Tap the next circle to log a set at the target reps. Tap a done set to take one rep off; at zero it clears.</p>`
      : `<div class="empty">Nothing planned. Add exercises in the Plan tab.</div>`}
      <div class="err" role="alert">${esc(error)}</div>`;
  }

  function planHTML(note, m, days) {
    const groups = days.map((d) => `<section class="card"><h2>${esc(FULL[d] || d)}</h2>${m.plan.filter((p) => p.day === d).map((p) => `
      <div class="prow"><label>Exercise<input data-act="pcell" data-i="${p.i}" data-c="Exercise" value="${esc(p.ex)}"></label>
      <label>Sets<input inputmode="numeric" data-act="pcell" data-i="${p.i}" data-c="Sets" value="${p.sets}"></label>
      <label>Reps<input data-act="pcell" data-i="${p.i}" data-c="Reps" value="${esc(p.reps)}"></label>
      <button class="danger" data-act="pdel" data-i="${p.i}" aria-label="Remove ${esc(p.ex)}">✕</button></div>`).join("")}</section>`).join("");
    return `<div class="top"><div><h1>${esc(note.title)}</h1><div class="muted">Plan · edits save to the note</div></div></div>
      <div class="grid">${groups}</div>
      <form class="card" id="padd"><h2>Add an exercise</h2><div class="add" style="margin-top:10px">
        <label>Day<select name="day">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => `<option>${d}</option>`).join("")}</select></label>
        <label>Exercise<input name="ex" required></label><label>Sets<input name="sets" inputmode="numeric" value="3"></label><label>Reps<input name="reps" value="5"></label>
        <button>Add to plan</button></div></form>
      <div class="err" role="alert">${esc(error)}</div>`;
  }

  function progressHTML(note, m, unit) {
    const today = note.today, cut = addDays(today, -6);
    const names = [...new Map(m.log.map((r) => [key(r.ex), r.ex])).values()];
    if (!progEx || !names.some((n) => key(n) === key(progEx))) progEx = names[0] || null;
    const week = m.log.filter((r) => r.date >= cut && r.date <= today);
    const vol = week.reduce((s, r) => s + (num(r.w) || 0) * r.reps.reduce((a, b) => a + b, 0), 0);
    const sessions = new Set(week.map((r) => r.date)).size;
    const mine = m.log.filter((r) => progEx && key(r.ex) === key(progEx));
    const pr = mine.reduce((b, r) => Math.max(b, num(r.w) || 0), 0);
    const byDate = {};
    m.log.forEach((r) => (byDate[r.date] = byDate[r.date] || []).push(r));
    const recent = Object.keys(byDate).sort().reverse().slice(0, 8).map((d) => `<div class="sess"><b class="num">${esc(d)}</b> <span class="muted">${esc(FULL[dayOf(d)] || "")}</span>
      <div class="muted num">${byDate[d].map((r) => esc(r.ex) + " " + (num(r.w) !== null ? esc(r.w) + " " + esc(unit) + " × " : "") + r.reps.join(",")).join(" · ")}</div></div>`).join("");
    return `<div class="top"><div><h1>${esc(note.title)}</h1><div class="muted">Progress</div></div></div>
      ${names.length ? `<div class="stats"><div class="stat"><span class="muted">Sessions, 7 days</span><b>${sessions}</b></div>
        <div class="stat"><span class="muted">Volume, 7 days</span><b>${Math.round(vol).toLocaleString()}</b></div>
        <div class="stat"><span class="muted">${esc(progEx)} best</span><b>${pr ? fmt(pr) + " " + esc(unit) : "–"}</b></div></div>
      <div class="card"><label>Exercise<select data-act="pex" aria-label="Exercise to chart">${names.map((n) => `<option ${key(n) === key(progEx) ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label>
        <div class="chart" style="margin-top:10px"><canvas id="ch" role="img" aria-label="Weight lifted over time for ${esc(progEx)}"></canvas></div></div>
      <div class="card"><h2>Recent sessions</h2>${recent}</div>` : `<div class="empty">Log your first set on the Today tab to see progress.</div>`}`;
  }

  function drawChart(m, unit) {
    if (chart) { chart.destroy(); chart = null; }
    const cv = document.getElementById("ch"); if (!cv || !window.Chart) return;
    const pts = {};
    m.log.filter((r) => key(r.ex) === key(progEx) && num(r.w) !== null).forEach((r) => { pts[r.date] = Math.max(pts[r.date] || 0, num(r.w)); });
    const labels = Object.keys(pts).sort();
    const cs = getComputedStyle(document.documentElement);
    const accent = cs.getPropertyValue("--amber-accent").trim() || "#d98a00", txt = cs.getPropertyValue("--amber-text-secondary").trim() || "#888", sep = cs.getPropertyValue("--amber-separator").trim() || "#ccc";
    chart = new Chart(cv, { type: "line", data: { labels, datasets: [{ label: "Top weight (" + unit + ")", data: labels.map((l) => pts[l]), borderColor: accent, backgroundColor: accent, tension: .25, pointRadius: 5 }] },
      options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { labels: { color: txt } } }, scales: { x: { ticks: { color: txt }, grid: { color: sep } }, y: { ticks: { color: txt }, grid: { color: sep } } } } });
  }

  async function run(ops) {
    if (busy) return; busy = true;
    const r = await amber.update(ops); busy = false;
    error = r.ok ? "" : r.error;
    if (!r.ok) render(amber.note);
  }

  function setTap(ex, k) {
    const note = amber.note, m = model(note), today = note.today;
    const p = m.plan.find((x) => key(x.ex) === key(ex) && x.day === selDay); if (!p) return;
    const row = m.log.find((r) => r.date === today && key(r.ex) === key(ex));
    const reps = row ? row.reps.slice() : [];
    let tgt = parseInt(p.reps);
    if (isNaN(tgt)) { const l = lastFor(m, ex, today); tgt = (l && l.reps[0]) || 8; }
    if (k >= reps.length) { while (reps.length <= k) reps.push(tgt); }
    else { reps[k] = reps[k] - 1; if (reps[k] <= 0) reps.length = k; }
    const lt = m.lt, t = lt.index;
    if (!reps.length) { if (row) run({ op: "delete_row", table: t, row: row.i }); return; }
    if (!row) {
      const last = lastFor(m, ex, today), step = (amber.settings && num(amber.settings.step)) || 2.5;
      const w = drafts[key(ex)] ?? suggest(p, last, step).w;
      run({ op: "append_row", table: t, values: { Date: today, Exercise: p.ex, Weight: String(w), Reps: reps.join(",") } });
    } else run({ op: "set_cell", table: t, row: row.i, col: "Reps", value: reps.join(",") });
  }

  function setWeight(ex, val) {
    const note = amber.note, m = model(note), row = m.log.find((r) => r.date === note.today && key(r.ex) === key(ex));
    drafts[key(ex)] = val;
    if (row) run({ op: "set_cell", table: m.lt.index, row: row.i, col: "Weight", value: val });
    else render(note);
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const a = b.dataset.act, note = amber.note;
    if (a === "screen") { screen = b.dataset.v; amber.store.set("screen", screen); render(note); }
    else if (a === "day") { selDay = b.dataset.v; render(note); }
    else if (a === "set") setTap(b.dataset.ex, +b.dataset.k);
    else if (a === "w") {
      const m = model(note), row = m.log.find((r) => r.date === note.today && key(r.ex) === key(b.dataset.ex));
      const p = m.plan.find((x) => key(x.ex) === key(b.dataset.ex) && x.day === selDay);
      const step = (amber.settings && num(amber.settings.step)) || 2.5;
      const cur = num(row ? row.w : (drafts[key(b.dataset.ex)] ?? suggest(p, lastFor(m, b.dataset.ex, note.today), step).w)) || 0;
      setWeight(b.dataset.ex, fmt(Math.max(0, cur + step * +b.dataset.d)));
    }
    else if (a === "pdel") { const m = model(note); run({ op: "delete_row", table: m.pt.index, row: +b.dataset.i }); }
  });
  document.addEventListener("change", (e) => {
    const t = e.target, a = t.dataset && t.dataset.act, note = amber.note; if (!a) return;
    if (a === "wset") setWeight(t.dataset.ex, t.value.trim());
    else if (a === "pcell") { const m = model(note); run({ op: "set_cell", table: m.pt.index, row: +t.dataset.i, col: t.dataset.c, value: t.value.trim() }); }
    else if (a === "pex") { progEx = t.value; render(note); }
  });
  document.addEventListener("submit", (e) => {
    if (e.target.id !== "padd") return; e.preventDefault();
    const f = new FormData(e.target), m = model(amber.note);
    run({ op: "append_row", table: m.pt.index, values: { Day: f.get("day"), Exercise: String(f.get("ex")).trim(), Sets: String(f.get("sets")).trim() || "3", Reps: String(f.get("reps")).trim() || "5" } });
  });
  amber.onChange((note) => render(note));
</script>
</body>
</html>
