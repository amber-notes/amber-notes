<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="amber-libs" content="chart">
<style>
* { box-sizing: border-box; }
main { max-width: var(--amber-content-max); margin: 0 auto; padding: 16px var(--amber-gutter) calc(96px + env(safe-area-inset-bottom)); }
h1 { font-family: var(--amber-font-rounded); font-size: 1.9rem; letter-spacing: -.02em; margin: 0 0 4px; }
h2 { font-size: 1.05rem; margin: 0; }
.sub { color: var(--amber-text-secondary); font-size: .9rem; margin: 0 0 14px; }
.card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 14px; margin-bottom: 12px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { color: var(--amber-text); min-height: 44px; padding: 0 18px; border-radius: 22px; background: var(--amber-fill); color: var(--amber-text); border: 1px solid var(--amber-separator); font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--amber-accent-soft); color: var(--amber-accent-text); border: 2px solid var(--amber-accent); }
.chip small { font-weight: 500; opacity: .85; margin-left: 4px; opacity: 1; }
button { font: inherit; cursor: pointer; }
.btn { min-height: 48px; padding: 0 18px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-accent); color: var(--amber-on-accent); font-weight: 700; }
.btn:disabled { background: var(--amber-fill); color: var(--amber-text-secondary); cursor: default; }
.btn.ghost { background: var(--amber-fill); color: var(--amber-text); }
.btn.danger { background: var(--amber-fill); color: var(--amber-danger); }
.bar { height: 8px; border-radius: 4px; background: var(--amber-fill); overflow: hidden; margin: 8px 0 16px; }
.bar > i { display: block; height: 100%; background: var(--amber-accent); border-radius: 4px; }
.ex-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.target { font-family: var(--amber-font-rounded); font-weight: 800; font-size: 1.1rem; color: var(--amber-accent-text); font-variant-numeric: tabular-nums; }
.hint { color: var(--amber-text-secondary); font-size: .85rem; margin: 2px 0 10px; }
.wrow { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.wrow input { width: 6.5rem; text-align: center; font-size: 1.2rem; font-weight: 700; min-height: 48px; font-variant-numeric: tabular-nums; }
.step { width: 48px; min-height: 48px; border-radius: var(--amber-radius-small); border: 1px solid var(--amber-separator); background: var(--amber-fill); color: var(--amber-text); font-size: 1.3rem; font-weight: 700; padding: 0; }
.sets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.set { width: 60px; height: 60px; border-radius: 50%; border: 2px dashed var(--amber-text-secondary); background: transparent; color: var(--amber-text-secondary); font-family: var(--amber-font-rounded); font-size: 1.4rem; font-weight: 800; padding: 0; font-variant-numeric: tabular-nums; }
.set[aria-pressed="true"] { border: 2px solid var(--amber-accent); background: var(--amber-accent); color: var(--amber-on-accent); }
.done { display: flex; align-items: center; gap: 10px; color: var(--amber-text); }
.done svg { flex: none; color: var(--amber-accent-text); }
.card.logged { background: var(--amber-accent-soft); }
.lbl { font-size: .8rem; color: var(--amber-text-secondary); }
input, select { font: inherit; color: var(--amber-text); background: var(--amber-field); border: 1px solid var(--amber-field-border); border-radius: var(--amber-radius-small); padding: 8px 10px; min-height: 44px; }
.prow { display: grid; grid-template-columns: 1fr 4.2rem 4.8rem 44px; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--amber-separator); }
.prow:first-of-type { border-top: 0; }
.prow input { width: 100%; text-align: center; }
.prow .nm { overflow-wrap: anywhere; font-weight: 600; }
.x { width: 44px; height: 44px; padding: 0; border-radius: var(--amber-radius-small); border: 0; background: var(--amber-fill); color: var(--amber-danger); }
.add { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.add label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--amber-text-secondary); flex: 1 1 90px; }
.add label input, .add label select { width: 100%; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 10px 12px; }
.stat b { display: block; font-family: var(--amber-font-rounded); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.chartbox { position: relative; height: 240px; }
.hist { display: grid; grid-template-columns: 6.5rem 1fr auto; gap: 8px; padding: 8px 0; border-top: 1px solid var(--amber-separator); font-variant-numeric: tabular-nums; font-size: .95rem; }
.hist:first-child { border-top: 0; }
.empty { text-align: center; color: var(--amber-text-secondary); padding: 24px 8px; }
.err { color: var(--amber-danger); min-height: 1.2em; font-size: .9rem; }
nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--amber-surface); border-top: 1px solid var(--amber-separator); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
nav .in { display: flex; width: 100%; max-width: var(--amber-content-max); }
nav button { flex: 1; min-height: 56px; background: none; border: 0; color: var(--amber-text-secondary); font-size: .8rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
nav button[aria-current="page"] { color: var(--amber-accent-text); }
nav svg { width: 22px; height: 22px; }
@media (min-width: 900px) {
  .today { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .today .card { margin: 0; }
  .prog { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; align-items: start; }
  .chartbox { height: 340px; }
}
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .3s; } }
</style>
</head>
<body>
<main id="app"></main>
<nav aria-label="Sections"><div class="in" id="nav"></div></nav>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const num = s => { const n = parseFloat(String(s ?? "").replace(/\s/g, "").replace(",", ".")); return isNaN(n) ? null : n; };
const fmt = n => (Math.round(n * 100) / 100).toString();
const ci = (t, re) => t.columns.findIndex(c => re.test(c.name));
const ICON = {
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/></svg>',
  plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  prog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>',
  check: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
  x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
let screen = null, day = null, S = null, err = "", progEx = null, chart = null, last = null;

function model(note) {
  const plan = note.tables.find(t => ci(t, /^day$/i) >= 0 && ci(t, /^exercise$/i) >= 0);
  const log = note.tables.find(t => ci(t, /^date$/i) >= 0 && ci(t, /^exercise$/i) >= 0 && ci(t, /^weight$/i) >= 0);
  return { plan, log };
}
function planRows(plan) {
  if (!plan) return [];
  const d = ci(plan, /^day$/i), e = ci(plan, /^exercise$/i), s = ci(plan, /^sets$/i), r = ci(plan, /^reps$/i);
  return plan.rows.map((row, i) => ({ i, day: (row[d] || "").trim(), name: (row[e] || "").trim(), sets: s >= 0 ? row[s] : "3", reps: r >= 0 ? row[r] : "5" })).filter(x => x.name);
}
function logRows(log) {
  if (!log) return [];
  const d = ci(log, /^date$/i), e = ci(log, /^exercise$/i), w = ci(log, /^weight$/i), r = ci(log, /^reps$/i);
  return log.rows.map(row => ({ date: (row[d] || "").trim(), name: (row[e] || "").trim(), w: num(row[w]), reps: String(row[r] || "").split(/[,\s/]+/).map(num).filter(x => x !== null) })).filter(x => x.name && x.date);
}
const key = n => n.toLowerCase();
function persist(k, v) { try { amber.store.set(k, v); } catch (e) {} }
function saveS() { persist("session", S); }
function lastFor(logs, name, before) {
  let best = null;
  for (const l of logs) if (key(l.name) === key(name) && l.date < before && (!best || l.date >= best.date)) best = l;
  return best;
}

function render(note, data) {
  last = note;
  const v = (data && data.values) || {};
  if (screen === null) screen = v.screen || "today";
  if (day === null && v.day) day = v.day;
  if (!S) S = v.session;
  if (!S || S.date !== note.today) S = { date: note.today, ex: {} };
  const { plan, log } = model(note);
  const pr = planRows(plan), logs = logRows(log);
  const days = [...new Set(pr.map(p => p.day))];
  const wd = DAYS[new Date(note.today + "T12:00:00").getDay()];
  if (!day || !days.includes(day)) {
    day = days.includes(wd) ? wd : (days.find(d => DAYS.indexOf(d) > DAYS.indexOf(wd)) || days[0] || wd);
  }
  document.getElementById("nav").innerHTML = [["today", "Today"], ["plan", "Plan"], ["progress", "Progress"]].map(([k, l]) =>
    `<button data-go="${k}" ${screen === k ? 'aria-current="page"' : ""}>${ICON[k === "progress" ? "prog" : k]}${l}</button>`).join("");
  const app = document.getElementById("app");
  if (chart) { chart.destroy(); chart = null; }
  if (screen === "plan") app.innerHTML = planView(note, plan, pr, days);
  else if (screen === "progress") app.innerHTML = progView(logs, log);
  else app.innerHTML = todayView(note, pr, logs, days, wd, plan, log);
  bind(note, plan, log, pr, logs);
  if (screen === "progress") drawChart(logs);
}

function todayView(note, pr, logs, days, wd, plan, log) {
  let h = `<h1>${esc(note.title)}</h1>`;
  if (!plan) return h + `<div class="card empty">Add a plan table with Day, Exercise, Sets and Reps columns under a Plan heading to see your workout here.</div>`;
  if (!log) h += `<div class="card empty">Add a log table with Date, Exercise, Weight and Reps columns to save sets.</div>`;
  const todays = pr.filter(p => p.day === day);
  const loggedToday = n => logs.filter(l => l.date === note.today && key(l.name) === key(n)).pop();
  const nDone = todays.filter(p => loggedToday(p.name)).length;
  const rest = !days.includes(wd);
  h += `<p class="sub">${rest ? `Rest day today (${wd}). Next up: ${esc(day)}.` : esc(day) + (day === wd ? " · today" : "")} · ${nDone} of ${todays.length} done</p>`;
  h += `<div class="chips" role="group" aria-label="Workout day">${days.map(d => `<button class="chip" data-day="${esc(d)}" aria-pressed="${d === day}">${esc(d)}${d === wd ? "<small>today</small>" : ""}</button>`).join("")}</div>`;
  h += `<div class="bar" role="progressbar" aria-label="Exercises done" aria-valuemin="0" aria-valuemax="${todays.length}" aria-valuenow="${nDone}"><i style="width:${todays.length ? nDone / todays.length * 100 : 0}%"></i></div>`;
  h += `<div class="err" role="alert">${esc(err)}</div><div class="today">`;
  for (const p of todays) {
    const done = loggedToday(p.name);
    const nSets = Math.max(1, parseInt(p.sets) || 1);
    const tgt = num(p.reps);
    const prev = lastFor(logs, p.name, note.today + "~");
    const prevB = lastFor(logs, p.name, "9999");
    if (done) {
      h += `<section class="card logged"><div class="done">${ICON.check}<div><h2>${esc(p.name)}</h2><div class="hint" style="margin:0">${fmt(done.w ?? 0)} kg · ${esc(done.reps.join(", ") || "-")}</div></div></div></section>`;
      continue;
    }
    const lastLog = lastFor(logs, p.name, "9999");
    let hint = "First time: pick a light weight.", sugg = null;
    if (lastLog && lastLog.w !== null) {
      sugg = lastLog.w;
      const ok = tgt !== null && lastLog.reps.length >= nSets && lastLog.reps.every(r => r >= tgt);
      hint = `Last: ${fmt(lastLog.w)} kg × ${lastLog.reps.join(",")}` + (ok ? ` — all sets hit, try ${fmt(lastLog.w + 2.5)}` : "");
      if (ok) sugg = lastLog.w + 2.5;
    }
    const st = S.ex[p.name] || {};
    const w = st.w !== undefined ? st.w : (sugg !== null ? fmt(sugg) : "");
    const reps = st.reps || [];
    const start = tgt !== null ? tgt : ((lastLog && lastLog.reps[0]) || 8);
    h += `<section class="card" data-ex="${esc(p.name)}"><div class="ex-head"><h2>${esc(p.name)}</h2><span class="target">${nSets} × ${esc(p.reps)}</span></div>
      <p class="hint">${esc(hint)}</p>
      <div class="wrow"><button class="step" data-w="-2.5" aria-label="Lower weight of ${esc(p.name)} by 2.5">−</button>
      <input inputmode="decimal" data-weight aria-label="Weight in kg for ${esc(p.name)}" value="${esc(w)}"><span class="lbl">kg</span>
      <button class="step" data-w="2.5" aria-label="Raise weight of ${esc(p.name)} by 2.5">+</button></div>
      <div class="sets">${Array.from({ length: nSets }, (_, k) => {
        const r = reps[k] || 0;
        return `<button class="set" data-set="${k}" data-start="${start}" aria-pressed="${r > 0}" aria-label="Set ${k + 1}, ${r > 0 ? r + " reps done" : "not done, target " + esc(p.reps)}">${r > 0 ? r : esc(p.reps === "max" ? "max" : p.reps)}</button>`;
      }).join("")}</div>
      <button class="btn" data-save ${reps.some(r => r > 0) ? "" : "disabled"}>Save ${esc(p.name)}</button></section>`;
  }
  if (!todays.length) h += `<div class="card empty">Nothing planned for ${esc(day)}. Add exercises on the Plan tab.</div>`;
  h += `</div>`;
  if (todays.length && nDone === todays.length) h += `<p class="sub" style="margin-top:14px"><b>Workout complete.</b> Nice work.</p>`;
  h += `<p class="hint" style="margin-top:12px">Tap a set when done. Tap again to lower the reps, until it clears.</p>`;
  return h;
}

function planView(note, plan, pr, days) {
  let h = `<h1>${esc(note.title)}</h1><p class="sub">Adjust your plan. Changes save to the note.</p><div class="err" role="alert">${esc(err)}</div>`;
  if (!plan) return h + `<div class="card empty">Add a plan table with Day, Exercise, Sets and Reps columns.</div>`;
  const order = [...new Set([...days])];
  for (const d of order) {
    h += `<section class="card"><h2>${esc(d)}</h2>`;
    for (const p of pr.filter(x => x.day === d)) {
      h += `<div class="prow"><span class="nm">${esc(p.name)}</span>
        <input data-cell="Sets" data-row="${p.i}" aria-label="Sets for ${esc(p.name)} on ${esc(d)}" inputmode="numeric" value="${esc(p.sets)}">
        <input data-cell="Reps" data-row="${p.i}" aria-label="Reps for ${esc(p.name)} on ${esc(d)}" value="${esc(p.reps)}">
        <button class="x" data-del="${p.i}" aria-label="Remove ${esc(p.name)} from ${esc(d)}">${ICON.x}</button></div>`;
    }
    h += `</section>`;
  }
  h += `<section class="card"><h2 style="margin-bottom:10px">Add exercise</h2><form class="add" id="addf">
    <label>Day<select name="day">${[...new Set([...days, "Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"])].map(d => `<option>${esc(d)}</option>`).join("")}</select></label>
    <label style="flex-basis:160px">Exercise<input name="ex" required></label>
    <label style="flex-basis:60px">Sets<input name="sets" inputmode="numeric" value="3"></label>
    <label style="flex-basis:70px">Reps<input name="reps" value="5"></label>
    <button class="btn">Add</button></form></section>
    <p class="hint">Use a number for reps, or "max" for as many as you can.</p>`;
  return h;
}

function progView(logs, log) {
  let h = `<h1>${esc(last.title)}</h1><p class="sub">Your progress over time.</p>`;
  if (!logs.length) return h + `<div class="card empty">No sessions logged yet. Save an exercise on the Today tab.</div>`;
  const names = [...new Map(logs.map(l => [key(l.name), l.name])).values()];
  if (!progEx || !names.some(n => key(n) === key(progEx))) progEx = names[0];
  const mine = logs.filter(l => key(l.name) === key(progEx));
  const best = Math.max(...mine.map(l => l.w ?? 0));
  const first = mine[0], lastL = mine[mine.length - 1];
  const dates = new Set(logs.map(l => l.date));
  const wkAgo = new Date(new Date(last.today + "T12:00:00").getTime() - 6 * 864e5).toISOString().slice(0, 10);
  const week = new Set(logs.filter(l => l.date >= wkAgo).map(l => l.date)).size;
  h += `<div class="chips" role="group" aria-label="Exercise">${names.map(n => `<button class="chip" data-prog="${esc(n)}" aria-pressed="${key(n) === key(progEx)}">${esc(n)}</button>`).join("")}</div>
  <div class="stats"><div class="stat"><span class="lbl">Best</span><b>${fmt(best)}<small class="lbl"> kg</small></b></div>
  <div class="stat"><span class="lbl">Change</span><b>${first && lastL && first.w !== null && lastL.w !== null ? (lastL.w - first.w >= 0 ? "+" : "") + fmt(lastL.w - first.w) : "–"}<small class="lbl"> kg</small></b></div>
  <div class="stat"><span class="lbl">Last 7 days</span><b>${week}<small class="lbl"> of ${dates.size} sessions</small></b></div></div>
  <div class="prog"><div class="card"><h2 style="margin-bottom:8px">${esc(progEx)} weight</h2>
  ${mine.length > 1 ? `<div class="chartbox"><canvas id="ch" role="img" aria-label="Line chart of ${esc(progEx)} weight by date"></canvas></div>` : `<div class="empty">Log ${esc(progEx)} on one more day to see a chart.</div>`}</div>
  <div class="card"><h2 style="margin-bottom:6px">Sessions</h2>${mine.slice().reverse().slice(0, 12).map(l => `<div class="hist"><span>${esc(l.date)}</span><span>${l.w !== null ? fmt(l.w) + " kg" : "–"}</span><span>${esc(l.reps.join(", "))}</span></div>`).join("")}</div></div>`;
  return h;
}
function drawChart(logs) {
  const c = document.getElementById("ch");
  if (!c || typeof Chart === "undefined") return;
  const mine = logs.filter(l => key(l.name) === key(progEx) && l.w !== null);
  const cs = getComputedStyle(document.documentElement);
  const acc = cs.getPropertyValue("--amber-accent").trim() || "#d98a00";
  const txt = cs.getPropertyValue("--amber-text-secondary").trim() || "#888";
  const sep = cs.getPropertyValue("--amber-separator").trim() || "#8884";
  chart = new Chart(c, { type: "line",
    data: { labels: mine.map(l => l.date.slice(5)), datasets: [{ label: "kg", data: mine.map(l => l.w), borderColor: acc, backgroundColor: acc, tension: .25, pointRadius: 5 }] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: txt }, grid: { color: sep } }, y: { ticks: { color: txt }, grid: { color: sep }, title: { display: true, text: "kg", color: txt } } } } });
}

async function run(ops) {
  const r = await amber.update(ops);
  err = r.ok ? "" : (r.error || "That didn't save.");
  if (!r.ok && last) render(last, amber.data);
  return r.ok;
}
function bind(note, plan, log, pr, logs) {
  const q = (s, f) => document.querySelectorAll(s).forEach(f);
  q("[data-go]", b => b.onclick = () => { screen = b.dataset.go; persist("screen", screen); err = ""; render(last, amber.data); window.scrollTo(0, 0); });
  q("[data-day]", b => b.onclick = () => { day = b.dataset.day; persist("day", day); render(last, amber.data); });
  q("[data-prog]", b => b.onclick = () => { progEx = b.dataset.prog; render(last, amber.data); });
  q("[data-ex]", card => {
    const name = card.dataset.ex;
    const st = () => (S.ex[name] = S.ex[name] || {});
    const p = pr.find(x => x.name === name && x.day === day);
    const nSets = Math.max(1, parseInt(p.sets) || 1);
    const wIn = card.querySelector("[data-weight]");
    wIn.onchange = () => { st().w = wIn.value; saveS(); };
    card.querySelectorAll("[data-w]").forEach(b => b.onclick = () => {
      const cur = num(wIn.value) ?? 0;
      st().w = fmt(Math.max(0, cur + parseFloat(b.dataset.w))); saveS(); render(last, amber.data);
    });
    card.querySelectorAll("[data-set]").forEach(b => b.onclick = () => {
      const s = st(); s.reps = s.reps || Array(nSets).fill(0);
      const k = +b.dataset.set, cur = s.reps[k] || 0;
      s.reps[k] = cur === 0 ? +b.dataset.start : cur - 1;
      if (s.w === undefined) s.w = wIn.value;
      saveS(); render(last, amber.data);
    });
    card.querySelector("[data-save]").onclick = async () => {
      const s = st(); const w = s.w !== undefined ? s.w : wIn.value;
      const reps = (s.reps || []).filter(r => r > 0);
      if (!reps.length) return;
      if (num(w) === null) { err = "Enter the weight first."; render(last, amber.data); return; }
      const ok = await run({ op: "append_row", table: log.index, values: { Date: note.today, Exercise: name, Weight: fmt(num(w)), Reps: reps.join(",") } });
      if (ok) { delete S.ex[name]; saveS(); }
    };
  });
  q("[data-cell]", i => i.onchange = () => run({ op: "set_cell", table: plan.index, row: +i.dataset.row, col: i.dataset.cell, value: i.value.trim() }));
  q("[data-del]", b => b.onclick = () => run({ op: "delete_row", table: plan.index, row: +b.dataset.del }));
  const f = document.getElementById("addf");
  if (f) f.onsubmit = async e => {
    e.preventDefault();
    const d = new FormData(f), ex = (d.get("ex") || "").trim();
    if (!ex) return;
    const ok = await run({ op: "append_row", table: plan.index, values: { Day: d.get("day"), Exercise: ex, Sets: (d.get("sets") || "3").trim(), Reps: (d.get("reps") || "5").trim() } });
    if (ok) f.reset();
  };
}
amber.onChange(render);
</script>
</body>
</html>
