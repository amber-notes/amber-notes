<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-libs" content="chart">
<style>
:root{--c0:#b45309;--c1:#0f766e;--c2:#6d28d9;--c3:#be123c;--c4:#1d4ed8;--best:#166534;--worst:#991b1b}
@media (prefers-color-scheme:dark){:root{--c0:#fbbf24;--c1:#2dd4bf;--c2:#a78bfa;--c3:#fb7185;--c4:#60a5fa;--best:#4ade80;--worst:#f87171}}
*{box-sizing:border-box}
main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 64px}
h1{font-size:1.7rem;letter-spacing:-.02em;margin:4px 0 4px;font-family:var(--amber-font-rounded)}
.sub{color:var(--amber-text-secondary);font-size:.9rem;margin-bottom:16px}
.tabs{display:flex;gap:4px;background:var(--amber-fill);padding:4px;border-radius:var(--amber-radius-small);margin-bottom:16px}
.tabs button{flex:1;min-height:44px;border:0;border-radius:8px;background:transparent;color:var(--amber-text);font:inherit;font-weight:600}
.tabs button[aria-current=true]{background:var(--amber-surface);color:var(--amber-text);box-shadow:inset 0 -3px 0 var(--amber-accent-text)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.kpi,.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:14px 16px}
.kpi .l{font-size:.8rem;color:var(--amber-text-secondary)}
.kpi .v{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
.card h2{font-size:1rem;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block}
.stat{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--amber-text-secondary);margin-bottom:8px;font-variant-numeric:tabular-nums}
.up{color:var(--best);font-weight:700}.down{color:var(--worst);font-weight:700}
.chart{position:relative;height:200px}.chart.tall{height:300px}
table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
td,th{padding:8px 4px;border-top:1px solid var(--amber-separator);text-align:left}th{color:var(--amber-text-secondary);font-weight:600;border-top:0}
td:not(:first-child),th:not(:first-child){text-align:right}
.bw{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:12px}
.bw .kpi .v{font-size:1.3rem}.best .v{color:var(--best)}.worst .v{color:var(--worst)}
.empty{padding:28px;text-align:center;color:var(--amber-text-secondary)}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}.grid.cols{grid-template-columns:repeat(3,1fr)}.grid.two{grid-template-columns:1fr 1fr}.chart.tall{height:340px}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const num=s=>{const n=parseFloat(String(s??"").replace(/\s/g,"").replace(",","."));return isNaN(n)?0:n};
const fmt=n=>Math.round(n).toLocaleString("en-US");
const pct=n=>(n>=0?"+":"")+n.toFixed(1)+"%";
let view="trends",charts=[];
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function render(note){
  const app=document.getElementById("app");
  charts.forEach(c=>c.destroy());charts=[];
  const t=note.tables.find(t=>t.columns.length>1&&t.rows.length);
  if(!t){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">Add a table with a Month column and one column per sales line.</div>`;return}
  const lines=t.columns.slice(1).map((c,i)=>({name:c.name,color:`var(--c${i%5})`,cc:`--c${i%5}`,v:t.rows.map(r=>num(r[i+1]))}));
  const months=t.rows.map(r=>r[0]);
  const tot=months.map((_,i)=>lines.reduce((a,l)=>a+l.v[i],0));
  const grand=tot.reduce((a,b)=>a+b,0);
  const bi=tot.indexOf(Math.max(...tot)),wi=tot.indexOf(Math.min(...tot));
  const ch=(a,b)=>b? (a-b)/b*100:0;
  const first=tot[0],last=tot[tot.length-1];
  let h=`<h1>${esc(note.title)}</h1><div class="sub">${esc(months[0])} – ${esc(months[months.length-1])} · ${months.length} months</div>
  <div class="kpis">
   <div class="kpi"><div class="l">Total sales</div><div class="v">${fmt(grand)}</div></div>
   <div class="kpi"><div class="l">Monthly average</div><div class="v">${fmt(grand/months.length)}</div></div>
   <div class="kpi"><div class="l">Latest month</div><div class="v">${fmt(last)}</div></div>
   <div class="kpi"><div class="l">Since ${esc(months[0])}</div><div class="v ${last>=first?'up':'down'}">${pct(ch(last,first))}</div></div>
  </div>
  <div class="tabs" role="tablist">${[["trends","Trends"],["mix","Mix"],["months","Best & worst"]].map(([k,n])=>`<button data-v="${k}" aria-current="${view===k}">${n}</button>`).join("")}</div>`;
  if(view==="trends"){
    h+=`<div class="grid cols">`+lines.map((l,i)=>{
      const s=l.v.reduce((a,b)=>a+b,0),d=ch(l.v[l.v.length-1],l.v[0]),m=l.v.length>1?ch(l.v[l.v.length-1],l.v[l.v.length-2]):0;
      return `<div class="card"><h2><span class="dot" style="background:${l.color}"></span>${esc(l.name)}</h2>
      <div class="stat"><span>Total ${fmt(s)}</span><span class="${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${pct(d)} since ${esc(months[0])}</span><span>Last month ${pct(m)}</span></div>
      <div class="chart" role="img" aria-label="${esc(l.name)} by month"><canvas id="c${i}"></canvas></div></div>`}).join("")+`</div>`;
  } else if(view==="mix"){
    h+=`<div class="grid two"><div class="card"><h2>Share of total sales</h2><div class="chart tall" role="img" aria-label="Share of sales by line"><canvas id="mixD"></canvas></div></div>
    <div class="card"><h2>Mix by month (%)</h2><div class="chart tall" role="img" aria-label="Share of each line per month"><canvas id="mixB"></canvas></div></div></div>
    <div class="card" style="margin-top:12px"><table><tr><th>Line</th><th>Total</th><th>Share</th></tr>${lines.map(l=>{const s=l.v.reduce((a,b)=>a+b,0);return `<tr><td><span class="dot" style="background:${l.color}"></span> ${esc(l.name)}</td><td>${fmt(s)}</td><td>${(s/grand*100).toFixed(1)}%</td></tr>`}).join("")}</table></div>`;
  } else {
    h+=`<div class="bw"><div class="kpi best"><div class="l">Best month</div><div class="v">${esc(months[bi])} · ${fmt(tot[bi])}</div></div><div class="kpi worst"><div class="l">Worst month</div><div class="v">${esc(months[wi])} · ${fmt(tot[wi])}</div></div></div>
    <div class="grid two"><div class="card"><h2>Total by month</h2><div class="stat"><span>Green = best, red = worst</span></div><div class="chart tall" role="img" aria-label="Total sales per month"><canvas id="mb"></canvas></div></div>
    <div class="card"><h2>Per line</h2><table><tr><th>Line</th><th>Best</th><th>Worst</th></tr>${lines.map(l=>{const mx=l.v.indexOf(Math.max(...l.v)),mn=l.v.indexOf(Math.min(...l.v));return `<tr><td><span class="dot" style="background:${l.color}"></span> ${esc(l.name)}</td><td>${esc(months[mx])} ${fmt(l.v[mx])}</td><td>${esc(months[mn])} ${fmt(l.v[mn])}</td></tr>`}).join("")}</table></div></div>`;
  }
  app.innerHTML=h;
  app.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;amber.store.set("view",view);render(amber.note)});
  const tc=cv("--amber-text-secondary"),gc=cv("--amber-separator");
  const col=l=>cv(l.cc);
  const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:tc},grid:{display:false}},y:{ticks:{color:tc,callback:v=>v>=1000?v/1000+"k":v},grid:{color:gc}}}};
  const mk=(id,cfg)=>{const e=document.getElementById(id);if(e)charts.push(new Chart(e,cfg))};
  if(view==="trends")lines.forEach((l,i)=>mk("c"+i,{type:"line",data:{labels:months,datasets:[{data:l.v,borderColor:col(l),backgroundColor:col(l),tension:.3,pointRadius:3,borderWidth:2.5}]},options:base}));
  if(view==="mix"){
    mk("mixD",{type:"doughnut",data:{labels:lines.map(l=>l.name),datasets:[{data:lines.map(l=>l.v.reduce((a,b)=>a+b,0)),backgroundColor:lines.map(col),borderColor:cv("--amber-surface"),borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{color:cv("--amber-text")}}}}});
    mk("mixB",{type:"bar",data:{labels:months,datasets:lines.map((l,j)=>({label:l.name,data:l.v.map((x,i)=>tot[i]?x/tot[i]*100:0),backgroundColor:col(l)}))},options:{...base,plugins:{legend:{position:"bottom",labels:{color:cv("--amber-text")}}},scales:{x:{stacked:true,ticks:{color:tc},grid:{display:false}},y:{stacked:true,max:100,ticks:{color:tc,callback:v=>v+"%"},grid:{color:gc}}}}});
  }
  if(view==="months")mk("mb",{type:"bar",data:{labels:months,datasets:[{data:tot,backgroundColor:tot.map((_,i)=>i===bi?cv("--best"):i===wi?cv("--worst"):cv("--c4")),borderRadius:4}]},options:base});
}
amber.onChange(n=>{view=(amber.data&&amber.data.values&&amber.data.values.view)||view;render(n)});
</script>
</body>
</html>
