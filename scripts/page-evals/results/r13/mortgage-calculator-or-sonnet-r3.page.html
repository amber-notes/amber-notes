<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--ink:#14302b;--teal:#0f766e;--teal2:#14b8a6;--int:#d97706;--panel:#0f3d38;--panel-text:#f2fbf9;--panel-dim:#a7d4cd;--on-teal:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#e6f4f1;--teal:#2dd4bf;--teal2:#2dd4bf;--int:#fbbf24;--panel:#0b2b28;--panel-text:#f2fbf9;--panel-dim:#9ccbc4;--on-teal:#04201d}}
*{box-sizing:border-box}
main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 48px}
h1{font-family:var(--amber-font-rounded);font-size:1.6rem;letter-spacing:-.02em;margin:4px 0 16px}
.grid{display:grid;gap:16px}
@media (min-width:900px){.grid{grid-template-columns:minmax(320px,5fr) 7fr;align-items:start}}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--amber-fill);padding:4px;border-radius:var(--amber-radius-small);margin-bottom:18px}
.seg button{font:inherit;font-weight:600;min-height:44px;border:0;border-radius:calc(var(--amber-radius-small) - 2px);background:transparent;color:var(--amber-text-secondary);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--teal);color:var(--on-teal)}
.field{margin-bottom:20px}
.field:last-of-type{margin-bottom:8px}
.fh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.fh label{font-size:.85rem;color:var(--amber-text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.inp{display:flex;align-items:center;gap:6px}
.inp input{width:8.5rem;text-align:right;font:inherit;font-family:var(--amber-font-mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem;color:var(--amber-text);min-height:44px;padding:6px 10px;border-radius:var(--amber-radius-small)}
.inp.s input{width:5.5rem}
.inp span{color:var(--amber-text-secondary);min-width:2rem;font-size:.9rem}
input[type=range]{width:100%;min-height:44px;accent-color:var(--teal);padding:0;background:transparent;border:0}
.hero{background:var(--panel);color:var(--panel-text);border-radius:var(--amber-radius);padding:22px 20px;margin-bottom:16px}
.hero .k{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--panel-dim);font-weight:600}
.hero .big{font-family:var(--amber-font-rounded);font-variant-numeric:tabular-nums;font-weight:800;font-size:clamp(2.2rem,9vw,3.6rem);letter-spacing:-.03em;line-height:1.1;margin:4px 0 2px}
.hero .big small{font-size:.4em;font-weight:600;color:var(--panel-dim);letter-spacing:0;margin-left:6px}
.hero .sub{color:var(--panel-dim);font-size:.9rem;min-height:1.3em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:14px}
.stat .k{font-size:.75rem;color:var(--amber-text-secondary);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat .v{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.3rem;margin-top:4px;color:var(--amber-text)}
.stat .v.i{color:var(--amber-accent-text)}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:6px 0 8px;background:var(--amber-fill)}
.bar i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--amber-text-secondary)}
.leg b{color:var(--amber-text);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--amber-text-secondary);margin:0 0 8px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--amber-text-secondary);font-size:13px;font-family:var(--amber-font)}
details{margin-top:16px}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--amber-accent-text)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
th,td{text-align:right;padding:8px 6px;border-top:1px solid var(--amber-separator)}
th{color:var(--amber-text-secondary);font-weight:600;font-size:.75rem;text-transform:uppercase}
th:first-child,td:first-child{text-align:left}
.reset{font:inherit;font-weight:600;min-height:44px;margin-top:12px;padding:0 14px;border-radius:var(--amber-radius-small);border:1px solid var(--amber-field-border);background:var(--amber-fill);color:var(--amber-text);cursor:pointer}
</style>
</head>
<body>
<main>
<h1 id="title">Mortgage</h1>
<div class="grid">
  <section class="card" aria-label="Loan inputs">
    <div class="seg" role="group" aria-label="Amortization">
      <button type="button" id="m-ann" aria-pressed="false">Annuity</button>
      <button type="button" id="m-str" aria-pressed="false">Straight</button>
    </div>
    <div class="field">
      <div class="fh"><label for="loan">Loan</label><div class="inp"><input id="loan" inputmode="numeric" autocomplete="off"><span>kr</span></div></div>
      <input type="range" id="loanR" min="100000" max="10000000" step="50000" aria-label="Loan slider">
    </div>
    <div class="field">
      <div class="fh"><label for="rate">Rate</label><div class="inp s"><input id="rate" inputmode="decimal" autocomplete="off"><span>%</span></div></div>
      <input type="range" id="rateR" min="0" max="12" step="0.05" aria-label="Rate slider">
    </div>
    <div class="field">
      <div class="fh"><label for="years">Years</label><div class="inp s"><input id="years" inputmode="numeric" autocomplete="off"><span>yrs</span></div></div>
      <input type="range" id="yearsR" min="1" max="50" step="1" aria-label="Years slider">
    </div>
    <button class="reset" id="reset" type="button">Reset to note</button>
  </section>
  <div>
    <div class="hero" aria-live="polite">
      <div class="k" id="hk">Monthly payment</div>
      <div class="big"><span id="pay">–</span><small>kr / mo</small></div>
      <div class="sub" id="psub"></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">Total interest</div><div class="v i" id="tint">–</div></div>
      <div class="stat"><div class="k">Total paid</div><div class="v" id="ttot">–</div></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <h2>Where the money goes</h2>
      <div class="bar" role="img" id="barA" aria-label="Principal versus interest"><i id="bp" style="background:var(--teal)"></i><i id="bi" style="background:var(--int)"></i></div>
      <div class="leg"><span><span class="dot" style="background:var(--teal)"></span>Principal <b id="lp"></b></span><span><span class="dot" style="background:var(--int)"></span>Interest <b id="li"></b></span></div>
    </div>
    <div class="card">
      <h2>Remaining balance</h2>
      <div id="chart"></div>
      <details><summary>Year by year</summary><div style="overflow-x:auto"><table><thead><tr><th>Year</th><th>Interest</th><th>Principal</th><th>Balance</th></tr></thead><tbody id="rows"></tbody></table></div></details>
    </div>
  </div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('en').replace(/,/g,'\u00a0');
let S={loan:3200000,rate:4.1,years:25,mode:'ann'};
let built=false;

function parseNote(md){
  const o={};
  const num=re=>{const m=md.match(re);return m?parseFloat(m[1].replace(/\s|\u00a0/g,'').replace(',','.')):NaN};
  const l=num(/loan:\s*([\d\s\u00a0.,]+)/i),r=num(/rate:\s*([\d.,]+)/i),y=num(/years?:\s*(\d+)/i);
  if(l>0)o.loan=l; if(r>=0)o.rate=r; if(y>0)o.years=y;
  if(/amortization:[^\n]*straight/i.test(md))o.mode='str'; else if(/amortization:[^\n]*annuit/i.test(md))o.mode='ann';
  return o;
}
function calc(){
  const n=Math.max(1,Math.round(S.years*12)),r=S.rate/1200,L=S.loan;
  const bal=[L];let intY=[],prY=[],b=L,first,last,ti=0,yi=0,yp=0;
  const annP=r===0?L/n:L*r/(1-Math.pow(1+r,-n));
  for(let m=1;m<=n;m++){
    const i=b*r;let p,pay;
    if(S.mode==='ann'){pay=annP;p=pay-i}else{p=L/n;pay=p+i}
    b=Math.max(0,b-p);ti+=i;yi+=i;yp+=p;
    if(m===1)first=pay; if(m===n)last=pay;
    bal.push(b);
    if(m%12===0||m===n){intY.push(yi);prY.push(yp);yi=0;yp=0}
  }
  return{n,bal,intY,prY,first,last,ti};
}
function chart(c){
  const W=340,H=190,pl=46,pb=24,pt=10,pr=8,w=W-pl-pr,h=H-pb-pt;
  const pts=c.bal.map((v,i)=>[pl+w*i/c.n,pt+h*(1-v/S.loan)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  let g='';
  [0,.5,1].forEach(f=>{const y=pt+h*(1-f);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--amber-separator)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${f?(S.loan*f/1e6).toFixed(f===1?1:2).replace(/\.?0+$/,'')+' M':'0'}</text>`});
  const step=S.years>30?10:S.years>12?5:1;
  for(let y=0;y<=S.years;y+=step){const x=pl+w*y/S.years;g+=`<text x="${x}" y="${H-5}" text-anchor="${y===0?'start':'middle'}">${y}</text>`}
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Balance falls from ${fmt(S.loan)} kr to zero over ${S.years} years">${g}<path d="${line}L${pl+w} ${pt+h}L${pl} ${pt+h}Z" fill="var(--teal2)" opacity=".22"/><path d="${line}" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}
function update(){
  const c=calc(),tot=S.loan+c.ti;
  $('title').textContent=(amber.note&&amber.note.title)||'Mortgage';
  $('m-ann').setAttribute('aria-pressed',S.mode==='ann');$('m-str').setAttribute('aria-pressed',S.mode==='str');
  $('pay').textContent=fmt(c.first);
  if(S.mode==='ann'){$('hk').textContent='Monthly payment';$('psub').textContent='Same amount every month for '+S.years+' years'}
  else{$('hk').textContent='First month\u2019s payment';$('psub').textContent='Falls to '+fmt(c.last)+' kr in the last month'}
  $('tint').textContent=fmt(c.ti)+' kr';$('ttot').textContent=fmt(tot)+' kr';
  const pp=S.loan/tot*100;
  $('bp').style.width=pp+'%';$('bi').style.width=(100-pp)+'%';
  $('lp').textContent=fmt(S.loan)+' kr ('+pp.toFixed(0)+'%)';$('li').textContent=fmt(c.ti)+' kr ('+(100-pp).toFixed(0)+'%)';
  $('barA').setAttribute('aria-label','Principal '+pp.toFixed(0)+' percent, interest '+(100-pp).toFixed(0)+' percent');
  $('chart').innerHTML=chart(c);
  let b=S.loan,rows='';
  c.intY.forEach((iy,k)=>{b=Math.max(0,b-c.prY[k]);rows+=`<tr><td>${k+1}</td><td>${fmt(iy)}</td><td>${fmt(c.prY[k])}</td><td>${fmt(b)}</td></tr>`});
  $('rows').innerHTML=rows;
}
function sync(skip){
  if(skip!=='loan')$('loan').value=fmt(S.loan);
  if(skip!=='rate')$('rate').value=String(S.rate);
  if(skip!=='years')$('years').value=String(S.years);
  $('loanR').value=S.loan;$('rateR').value=S.rate;$('yearsR').value=S.years;
}
function save(){try{amber.store.set('calc',S)}catch(e){}}
function set(k,v,skip){S[k]=v;sync(skip);update();save()}
function build(){
  built=true;
  $('loanR').oninput=e=>set('loan',+e.target.value);
  $('rateR').oninput=e=>set('rate',+e.target.value);
  $('yearsR').oninput=e=>set('years',+e.target.value);
  const bind=(id,k,lo,hi,conv)=>{
    $(id).addEventListener('input',e=>{const v=conv(e.target.value);if(isFinite(v)&&v>=lo&&v<=hi)set(k,v,id)});
    $(id).addEventListener('blur',()=>sync());
  };
  bind('loan','loan',1,1e9,s=>parseFloat(s.replace(/[\s\u00a0]/g,'').replace(',','.')));
  bind('rate','rate',0,50,s=>parseFloat(s.replace(',','.')));
  bind('years','years',1,60,s=>parseInt(s,10));
  $('m-ann').onclick=()=>set('mode','ann');$('m-str').onclick=()=>set('mode','str');
  $('reset').onclick=()=>{S=Object.assign({loan:3200000,rate:4.1,years:25,mode:'ann'},parseNote(amber.note.markdown||''));sync();update();save()};
}
amber.onChange((note,data)=>{
  if(built)return;
  const saved=data&&data.values&&data.values.calc;
  S=Object.assign(S,parseNote(note.markdown||''),saved||{});
  build();sync();update();
});
</script>
</body>
</html>
