<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit tracker</title>
<meta name="amber-libs" content="confetti">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { -webkit-user-select: none; user-select: none; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 8px var(--amber-gutter) 60px; }
  h1 { font-family: var(--amber-font-rounded); font-size: 1.8rem; letter-spacing: -.02em; margin: 6px 0 14px; }
  h2 { font-size: .8rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 22px 4px 10px; }
  .layout { display: grid; gap: 0; }
  .layout > section { min-width: 0; }
  @media (min-width: 900px) { .layout { grid-template-columns: minmax(340px, 460px) minmax(0, 1fr); column-gap: 28px; align-items: start; } }

  .hero { display: flex; align-items: center; gap: 16px; background: var(--amber-surface); border-radius: var(--amber-radius); padding: 16px; }
  .ring { position: relative; width: 84px; height: 84px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .bg { stroke: var(--amber-fill); }
  .ring .fg { stroke: var(--amber-accent); stroke-linecap: round; transition: stroke-dasharray .5s ease; }
  .ring .mid { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--amber-font-rounded); font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .hero .msg { flex: 1; min-width: 0; }
  .hero .big { font-family: var(--amber-font-rounded); font-size: 1.2rem; font-weight: 800; }
  .hero .small { color: var(--amber-text-secondary); font-size: .9rem; margin-top: 2px; }
  .xp { height: 10px; border-radius: 6px; background: var(--amber-fill); margin-top: 10px; overflow: hidden; }
  .xp div { height: 100%; background: var(--amber-accent); border-radius: 6px; transition: width .5s; }

  .tiles { display: grid; gap: 10px; grid-template-columns: 1fr; }
  @media (min-width: 420px) { .tiles { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 900px) { .tiles { grid-template-columns: 1fr; } }
  .tile { position: relative; display: flex; align-items: center; gap: 12px; min-height: 76px; width: 100%; padding: 12px 14px; border-radius: 20px; border: 2px solid var(--c); background: var(--amber-surface); color: var(--amber-text); font: inherit; text-align: left; cursor: pointer; transition: transform .2s cubic-bezier(.34,1.56,.64,1), background .2s; }
  .tile:active { transform: scale(.95); }
  .tile .emo { font-size: 1.9rem; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; background: var(--amber-fill); flex: none; transition: transform .3s; }
  .tile .tx { flex: 1; min-width: 0; }
  .tile .nm { font-family: var(--amber-font-rounded); font-weight: 800; font-size: 1.1rem; overflow-wrap: anywhere; }
  .tile .st { font-size: .85rem; color: var(--amber-text-secondary); margin-top: 2px; }
  .tile .badge { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--amber-separator); display: grid; place-items: center; flex: none; font-weight: 800; }
  .tile.done { background: var(--c); color: #fff; }
  .tile.done .st { color: #fff; opacity: .92; }
  .tile.done .emo { background: rgba(255,255,255,.25); transform: rotate(-8deg) scale(1.1); }
  .tile.done .badge { background: #fff; border-color: #fff; }
  .tile.done .badge::after { content: "✓"; color: #14301f; }
  @media (prefers-color-scheme: dark) { .tile.done .badge { background: #f3f3f3; } }
  .tile.pop { animation: pop .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0% { transform: scale(.9); } 100% { transform: scale(1); } }
  .week { display: flex; gap: 5px; margin-top: 6px; }
  .week i { width: 11px; height: 11px; border-radius: 50%; background: var(--amber-fill); border: 1px solid var(--amber-separator); }
  .tile.done .week i { background: rgba(255,255,255,.3); border-color: transparent; }
  .week i.on { background: var(--c); border-color: var(--c); }
  .tile.done .week i.on { background: #fff; }

  .card { background: var(--amber-surface); border-radius: var(--amber-radius); padding: 14px; }
  .hm { display: grid; gap: 6px; }
  .hr { display: grid; grid-template-columns: 2rem repeat(var(--days), minmax(0, 1fr)); gap: 4px; align-items: center; }
  .hr .e { font-size: 1.1rem; text-align: center; }
  .hr .dl { font-size: .75rem; color: var(--amber-text-secondary); text-align: center; }
  .cell { aspect-ratio: 1; border-radius: 50%; background: var(--amber-fill); }
  .cell.on { background: var(--c); }
  .cell.today { box-shadow: 0 0 0 2px var(--amber-text); }
  .star { text-align: center; font-size: .8rem; line-height: 1; opacity: .25; filter: grayscale(1); }
  .star.on { opacity: 1; filter: none; }

  .awards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .award { background: var(--amber-surface); border-radius: 16px; padding: 12px; text-align: center; }
  .award .ic { font-size: 1.8rem; }
  .award .at { font-weight: 700; font-size: .9rem; margin-top: 2px; }
  .award .ad { font-size: .78rem; color: var(--amber-text-secondary); }
  .award.locked { opacity: .55; }
  .award.locked .ic { filter: grayscale(1); }
  .err { color: var(--amber-danger); min-height: 1.2em; font-size: .9rem; text-align: center; }
  .empty { padding: 30px; text-align: center; color: var(--amber-text-secondary); background: var(--amber-surface); border-radius: var(--amber-radius); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const DONE = /^(✓|✔|x|yes|y|1|true|done)$/i;
  const COLORS = ["#2f7d4f", "#3a6fd8", "#b4448a", "#c2410c", "#7c4dbd", "#0f766e"];
  const EMOJI = [[/walk|run|jog|steps|hike/i, "👟"], [/read|book/i, "📚"], [/stretch|yoga|mobil/i, "🧘"], [/water|drink/i, "💧"], [/sleep|bed/i, "😴"], [/med/i, "🧠"], [/write|journal/i, "✍️"], [/gym|lift|workout|exercise/i, "💪"], [/eat|veg|fruit|meal/i, "🥗"], [/code|study|learn/i, "🎓"]];
  const emojiFor = (n) => (EMOJI.find(([r]) => r.test(n)) || [0, "⭐"])[1];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const wd = (iso) => (new Date(iso + "T12:00:00Z").getUTCDay() + 6) % 7;
  let popped = null, error = "";

  function render(note) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => t.columns.some((c) => /^(date|day)$/i.test(c.name)));
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="empty">Add a table with a Date column and one column per habit.</div>`; return; }
    const dc = t.columns.findIndex((c) => /^(date|day)$/i.test(c.name));
    const habits = t.columns.map((c, i) => ({ name: c.name, i })).filter((h) => h.i !== dc).map((h, k) => ({ ...h, color: COLORS[k % COLORS.length], emoji: emojiFor(h.name) }));
    const today = note.today;
    const by = new Map(t.rows.map((r, i) => [r[dc], { r, i }]));
    const done = (d, h) => DONE.test(String(by.get(d)?.r[h.i] ?? "").trim());
    const perfect = (d) => habits.length > 0 && habits.every((h) => done(d, h));
    const monday = addDays(today, -wd(today));
    let total = 0;
    for (const h of habits) {
      let d = done(today, h) ? today : addDays(today, -1), n = 0;
      while (done(d, h)) { n++; d = addDays(d, -1); }
      h.streak = n; h.today = done(today, h);
      let best = 0, run = 0;
      for (const r of t.rows) { /* count in date order */ }
      const dates = t.rows.map((r) => r[dc]).filter(Boolean).sort();
      let prev = null;
      for (const dt of dates) { if (done(dt, h)) { run = prev && addDays(prev, 1) === dt && run ? run + 1 : 1; best = Math.max(best, run); prev = dt; total++; } else { run = 0; prev = null; } }
      h.best = best;
    }
    const n = habits.length, dn = habits.filter((h) => h.today).length;
    const level = Math.floor(total / 10) + 1, into = total % 10;
    const frac = n ? dn / n : 0, C = 2 * Math.PI * 40;
    const topStreak = Math.max(0, ...habits.map((h) => h.streak));
    const bestRun = Math.max(0, ...habits.map((h) => h.best));
    const perfectDays = new Set(t.rows.map((r) => r[dc]).filter((d) => d && perfect(d))).size;
    const msg = !n ? "Add a habit column" : dn === n ? "Perfect day! 🎉" : dn === 0 ? "Let's get going 💪" : `${n - dn} to go, you've got this`;
    const span = window.innerWidth >= 900 ? 28 : 14;
    const days = Array.from({ length: span }, (_, i) => addDays(today, i - span + 1));
    const awards = [
      ["🔥", "On fire", "3-day streak", topStreak >= 3 || bestRun >= 3],
      ["🚀", "Week warrior", "7-day streak", bestRun >= 7],
      ["🌟", "Perfect day", "Every habit in a day", perfectDays >= 1],
      ["🏆", "Hat trick", "3 perfect days", perfectDays >= 3],
      ["🎯", "Getting serious", "Reach level 5", level >= 5],
    ];
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="layout"><section>
        <div class="hero">
          <div class="ring" role="img" aria-label="${dn} of ${n} done today"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="40"/><circle class="fg" cx="50" cy="50" r="40" stroke-dasharray="${(C * frac).toFixed(1)} ${C.toFixed(1)}"/></svg><div class="mid">${dn}/${n}</div></div>
          <div class="msg"><div class="big">${msg}</div><div class="small">Level ${level} · ${total} ticks${topStreak ? ` · 🔥 ${topStreak}` : ""}</div>
            <div class="xp" aria-label="${into} of 10 to next level"><div style="width:${into * 10}%"></div></div></div>
        </div>
        <h2>Today</h2>
        <div class="tiles">${habits.map((h, k) => `
          <button class="tile ${h.today ? "done" : ""} ${popped === k ? "pop" : ""}" style="--c:${h.color}" data-k="${k}" aria-pressed="${h.today}">
            <span class="emo" aria-hidden="true">${h.emoji}</span>
            <span class="tx"><div class="nm">${esc(h.name)}</div><div class="st">${h.streak ? `🔥 ${h.streak} day${h.streak > 1 ? "s" : ""} in a row` : "Start a streak"}</div>
              <div class="week" aria-hidden="true">${Array.from({ length: 7 }, (_, j) => { const d = addDays(monday, j); return `<i class="${done(d, h) ? "on" : ""}"></i>`; }).join("")}</div></span>
            <span class="badge" aria-hidden="true"></span>
          </button>`).join("")}</div>
        <div class="err" role="alert">${esc(error)}</div>
      </section><section>
        <h2>Last ${span === 28 ? "four weeks" : "two weeks"}</h2>
        <div class="card hm" style="--days:${span}">
          <div class="hr"><span></span>${days.map((d) => `<span class="dl">${"MTWTFSS"[wd(d)]}</span>`).join("")}</div>
          ${habits.map((h) => `<div class="hr" style="--c:${h.color}"><span class="e" title="${esc(h.name)}">${h.emoji}</span>${days.map((d) => `<span class="cell ${done(d, h) ? "on" : ""} ${d === today ? "today" : ""}"></span>`).join("")}</div>`).join("")}
          <div class="hr"><span class="e">🌟</span>${days.map((d) => `<span class="star ${perfect(d) ? "on" : ""}">★</span>`).join("")}</div>
        </div>
        <h2>Awards</h2>
        <div class="awards">${awards.map(([ic, tt, dd, ok]) => `<div class="award ${ok ? "" : "locked"}"><div class="ic">${ic}</div><div class="at">${tt}</div><div class="ad">${ok ? "Unlocked!" : dd}</div></div>`).join("")}</div>
      </section></div>`;
    popped = null;
    app.querySelectorAll(".tile").forEach((b) => b.addEventListener("click", async () => {
      const k = +b.dataset.k, h = habits[k], row = by.get(today);
      const value = h.today ? "" : "✓";
      popped = k;
      const r = row
        ? await amber.update({ op: "set_cell", table: t.index, row: row.i, col: h.name, value })
        : await amber.update({ op: "append_row", table: t.index, values: { [t.columns[dc].name]: today, [h.name]: value } });
      error = r.ok ? "" : r.error;
      if (!r.ok) render(amber.note);
      else if (value && dn + 1 === n && window.confetti) confetti({ particleCount: 140, spread: 80, origin: { y: .5 } });
    }));
  }
  amber.onChange(render);
  let wide = window.innerWidth >= 900;
  addEventListener("resize", () => { if ((window.innerWidth >= 900) !== wide) { wide = !wide; render(amber.note); } });
</script>
</body>
</html>
