<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-libs" content="confetti">
<meta name="amber-settings" content='{"settings":[{"key":"weeklyGoal","label":"Weekly goal per habit","type":"number","default":5},{"key":"gardenName","label":"Garden name","type":"text","default":"Tiny Victory Garden"},{"key":"emojiSet","label":"Garden style","type":"choice","options":["plants","space","pets"],"default":"plants"}]}'>
<style>
  *{box-sizing:border-box} body{margin:0;padding:0 0 calc(92px + env(safe-area-inset-bottom));font-family:var(--amber-font);color:var(--amber-text)}
  .wrap{width:100%;max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 28px}
  .hero{position:relative;overflow:hidden;border-radius:calc(var(--amber-radius) + 8px);padding:22px 18px;border:1px solid var(--amber-separator);background:linear-gradient(145deg,var(--amber-accent-soft),var(--amber-surface) 62%);min-height:188px}
  .hero:before{content:"";position:absolute;inset:auto -8% -28px -8%;height:70px;background:radial-gradient(closest-side,var(--amber-accent-soft),transparent 70%);opacity:.95}
  .top{position:relative;display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
  h1{font-size:clamp(1.7rem,4.8vw,3rem);line-height:1;margin:0 0 8px;letter-spacing:-.045em}
  .garden-name{font-size:.9rem;font-weight:800;color:var(--amber-accent-text);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
  .sub{margin:0;color:var(--amber-text-secondary);font-size:1rem;line-height:1.35;max-width:44rem}
  .score{flex:0 0 auto;min-width:92px;min-height:92px;border-radius:28px;display:grid;place-items:center;text-align:center;background:var(--amber-text);color:var(--amber-bg);box-shadow:0 14px 34px rgba(0,0,0,.12);padding:10px}
  .score strong{font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}.score span{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .scene{position:relative;margin-top:16px;min-height:82px;display:flex;align-items:flex-end;gap:6px;padding:0 2px 6px}.sprite{font-size:clamp(2rem,8vw,4.8rem);line-height:1;filter:drop-shadow(0 8px 8px rgba(0,0,0,.12));transform-origin:50% 100%;animation:pop .45s ease both}.sprite.small{font-size:clamp(1.3rem,4vw,2.2rem);opacity:.86}.sprite.rest{opacity:.32;filter:saturate(.55)}@keyframes pop{from{transform:translateY(10px) scale(.82);opacity:.3}to{transform:none;opacity:1}}
  .tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--amber-bg);padding:12px 0;margin:2px 0 14px}.tab{min-height:44px;border-radius:999px;border:1px solid var(--amber-separator);background:var(--amber-fill);color:var(--amber-text);font:inherit;font-weight:750}.tab[aria-selected="true"]{background:var(--amber-text);border-color:var(--amber-text);color:var(--amber-bg)}
  .screen{display:none}.screen.active{display:block}.grid{display:grid;gap:14px}.card{border-radius:var(--amber-radius);border:1px solid var(--amber-separator);background:var(--amber-surface);box-shadow:0 1px 0 rgba(0,0,0,.02);overflow:hidden}.card-pad{padding:16px}.empty{padding:28px 18px;text-align:center;color:var(--amber-text-secondary)}
  h2{font-size:1rem;margin:0 0 12px;letter-spacing:.01em}.quest{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 14px;border:0;border-top:1px solid var(--amber-separator);background:var(--amber-surface);color:var(--amber-text);font:inherit;text-align:left}.quest:first-child{border-top:0}.quest:active{transform:scale(.99)}.badge{width:46px;height:46px;border-radius:16px;background:var(--amber-accent-soft);display:grid;place-items:center;font-size:1.6rem}.quest[aria-pressed="true"] .badge{background:var(--amber-accent);color:var(--amber-on-accent)}.qname{display:block;font-size:1.04rem;font-weight:800;overflow-wrap:anywhere;line-height:1.15}.qmeta{display:block;margin-top:4px;color:var(--amber-text-secondary);font-size:.86rem;line-height:1.25}.check{width:32px;height:32px;border-radius:50%;border:2px solid var(--amber-separator);display:grid;place-items:center;color:transparent}.quest[aria-pressed="true"] .check{background:var(--amber-text);border-color:var(--amber-text);color:var(--amber-bg)}
  .meters{display:grid;gap:10px}.meter-row{display:grid;grid-template-columns:minmax(76px,1fr) 2fr auto;gap:10px;align-items:center}.meter-name{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar{height:14px;border-radius:99px;background:var(--amber-fill);overflow:hidden}.fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--amber-accent),var(--amber-accent-text));min-width:0}.num{font-size:.88rem;color:var(--amber-text-secondary);font-variant-numeric:tabular-nums}
  .map{display:grid;gap:8px;overflow:hidden}.map-row{display:grid;grid-template-columns:minmax(78px,118px) repeat(14,minmax(13px,1fr));gap:4px;align-items:center}.map-name{font-size:.82rem;color:var(--amber-text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile{aspect-ratio:1;border-radius:7px;background:var(--amber-fill);display:grid;place-items:center;font-size:.72rem}.tile.on{background:var(--amber-text);color:var(--amber-bg)}.tile.today{outline:2px solid var(--amber-accent);outline-offset:1px}.legend{display:flex;justify-content:space-between;gap:10px;margin-top:10px;color:var(--amber-text-secondary);font-size:.82rem}
  .trophy-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.trophy{padding:14px;border-radius:18px;background:var(--amber-fill);border:1px solid var(--amber-separator)}.trophy .big{font-size:2rem;display:block;margin-bottom:4px}.trophy strong{display:block}.trophy span:last-child{color:var(--amber-text-secondary);font-size:.88rem}.err{min-height:1.2em;margin:10px 2px;color:var(--amber-danger)}
  @media (min-width:700px){.wrap{padding-top:28px}.quest{min-height:74px}.dashboard{grid-template-columns:1.1fr .9fr;align-items:start}.tabs{max-width:520px;margin-top:28px}.trophy-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media (min-width:1000px){.hero{padding:30px;min-height:230px}.scene{position:absolute;right:26px;bottom:14px;width:45%;justify-content:flex-end}.top{max-width:58%}.dashboard{grid-template-columns:1fr 1fr}.wide-span{grid-column:1 / -1}}
  html.amber-widget .wrap{padding-top:12px} html.amber-widget .hero{min-height:auto} html.amber-widget .scene{display:none} html.amber-widget .tabs{position:static} html.amber-widget .score{min-width:76px;min-height:76px;border-radius:22px}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const DONE=/^(✓|✔|x|yes|y|1|true|done)$/i;let current="today",err="",lastAll="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const day=(iso,n)=>{const d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const wk=iso=>{const d=new Date(iso+"T12:00:00Z");return day(iso,-((d.getUTCDay()+6)%7))};
function pack(style){return style==="space"?["🚀","🪐","🌙","⭐️","☄️","🛰️","🌌","👾"]:style==="pets"?["🐶","🐱","🐰","🦊","🐼","🐸","🐥","🦄"]:["🌱","🌷","🌻","🍄","🌿","🌵","🌸","🍀"]}
function model(note){const t=note.tables.find(t=>t.columns.some(c=>/^(date|day)$/i.test(c.name)));if(!t)return{t:null};const dc=t.columns.findIndex(c=>/^(date|day)$/i.test(c.name));const habits=t.columns.map((c,i)=>({name:c.name,i})).filter(h=>h.i!==dc);const by=new Map(t.rows.map((r,i)=>[String(r[dc]||""),{r,i}]));const done=(date,h)=>DONE.test(String(by.get(date)?.r[h.i]??"").trim());const today=note.today;return{t,dc,habits,by,done,today}}
function streak(m,h){let n=0,d=m.done(m.today,h)?m.today:day(m.today,-1);while(m.done(d,h)&&n<500){n++;d=day(d,-1)}return n}
function render(note){const app=document.getElementById("app"),m=model(note),settings=amber.settings||{},icons=pack(settings.emojiSet),goal=Math.max(0,Math.min(7,Number(settings.weeklyGoal)||5));if(!m.t){app.innerHTML=`<section class="hero"><p class="garden-name">${esc(settings.gardenName||"Tiny Victory Garden")}</p><h1>${esc(note.title)}</h1><p class="sub">Add a table with a Date column and one column per habit. Then this will turn into a little game board.</p></section><div class="card empty">No habit table found yet.</div>`;return}
const doneToday=m.habits.filter(h=>m.done(m.today,h)).length,total=m.habits.length,all=total&&doneToday===total,ws=wk(m.today),week=Array.from({length:7},(_,i)=>day(ws,i)).filter(d=>d<=m.today),days=Array.from({length:14},(_,i)=>day(m.today,i-13));if(all&&lastAll!==m.today){lastAll=m.today;setTimeout(()=>{try{confetti({particleCount:90,spread:70,origin:{y:.22}})}catch(e){}},150)}
const scene=m.habits.length?m.habits.map((h,i)=>`<span class="sprite ${m.done(m.today,h)?"":"rest"}" title="${esc(h.name)}">${icons[i%icons.length]}</span>`).join(""):"<span class='sprite rest'>🌱</span>";
app.innerHTML=`<section class="hero"><div class="top"><div><p class="garden-name">${esc(settings.gardenName||"Tiny Victory Garden")}</p><h1>${esc(note.title)}</h1><p class="sub">Tap today's quests to grow the garden. Streaks add sparkle; finishing the day throws confetti.</p></div><div class="score" aria-label="${doneToday} of ${total} habits done today"><strong>${doneToday}/${total}</strong><span>today</span></div></div><div class="scene" aria-hidden="true">${scene}</div></section><section class="screen ${current==='today'?'active':''}" id="today"><div class="grid dashboard"><div class="card">${m.habits.length?m.habits.map((h,i)=>{const on=m.done(m.today,h),s=streak(m,h);return`<button class="quest" data-h="${h.i}" aria-pressed="${on}" aria-label="${on?'Mark not done':'Mark done'}: ${esc(h.name)}"><span class="badge">${icons[i%icons.length]}</span><span><span class="qname">${esc(h.name)}</span><span class="qmeta">${s?`${s} day streak`:'Start a streak today'}</span></span><span class="check">${on?'✓':''}</span></button>`}).join(""):`<div class="empty">Add habit columns next to Date.</div>`}</div><div class="card card-pad"><h2>Today's reward</h2><div class="trophy-grid"><div class="trophy"><span class="big">${all?'🏆':'✨'}</span><strong>${all?'Perfect day':'Keep going'}</strong><span>${total-doneToday} quests left</span></div><div class="trophy"><span class="big">🔥</span><strong>${Math.max(0,...m.habits.map(h=>streak(m,h)))} days</strong><span>best streak</span></div></div></div></div><div class="err" role="alert">${esc(err)}</div></section><nav class="tabs" aria-label="Habit tracker sections"><button class="tab" data-tab="today" aria-selected="${current==='today'}">Today</button><button class="tab" data-tab="garden" aria-selected="${current==='garden'}">Garden</button><button class="tab" data-tab="map" aria-selected="${current==='map'}">Map</button></nav><section class="screen ${current==='garden'?'active':''}" id="garden"><div class="grid dashboard"><div class="card card-pad"><h2>This week</h2><div class="meters">${m.habits.map(h=>{const n=week.filter(d=>m.done(d,h)).length,p=goal?Math.min(100,n/goal*100):0;return`<div class="meter-row"><span class="meter-name">${esc(h.name)}</span><span class="bar"><span class="fill" style="display:block;width:${p}%"></span></span><span class="num">${n}${goal?`/${goal}`:""}</span></div>`}).join("")}</div></div><div class="card card-pad"><h2>Garden badges</h2><div class="trophy-grid"><div class="trophy"><span class="big">🌞</span><strong>${doneToday}</strong><span>blooms today</span></div><div class="trophy"><span class="big">🌈</span><strong>${m.habits.reduce((a,h)=>a+week.filter(d=>m.done(d,h)).length,0)}</strong><span>weekly wins</span></div><div class="trophy"><span class="big">🧭</span><strong>${m.habits.length}</strong><span>quests</span></div><div class="trophy"><span class="big">🎉</span><strong>${all?'Yes':'Soon'}</strong><span>daily party</span></div></div></div></div></section><section class="screen ${current==='map'?'active':''}" id="map"><div class="card card-pad wide-span"><h2>Last 14 days</h2><div class="map" role="img" aria-label="Fourteen day habit map">${m.habits.map((h,i)=>`<div class="map-row"><span class="map-name">${icons[i%icons.length]} ${esc(h.name)}</span>${days.map(d=>`<span class="tile ${m.done(d,h)?'on':''} ${d===m.today?'today':''}">${m.done(d,h)?'✓':''}</span>`).join("")}</div>`).join("")}</div><div class="legend"><span>${days[0].slice(5)}</span><span>Today ${m.today.slice(5)}</span></div></div></section>`;
app.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.tab;render(amber.note)}));app.querySelectorAll('.quest').forEach(b=>b.addEventListener('click',async()=>{const h=m.habits.find(x=>x.i===Number(b.dataset.h));if(!h)return;const row=m.by.get(m.today),val=m.done(m.today,h)?"":"✓";const op=row?{op:"set_cell",table:m.t.index,row:row.i,col:h.name,value:val}:{op:"append_row",table:m.t.index,values:{[m.t.columns[m.dc].name]:m.today,[h.name]:val}};const r=await amber.update(op);err=r.ok?"":r.error;if(!r.ok)render(amber.note)}))}
amber.onChange(render);
</script>
</body>
</html>
