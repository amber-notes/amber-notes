<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-libs" content="chart">
<style>
  :root { --c0:#8a5a2b; --c1:#d98a1f; --c2:#2f7f8f; --c3:#6b5bb5; --c4:#3f8f5a; --c5:#b0475f; --good:#1b6a3a; --bad:#a63626; }
  @media (prefers-color-scheme: dark) { :root { --c0:#d9a066; --c1:#f0b24a; --c2:#5cc0d2; --c3:#a597ec; --c4:#6fcf8e; --c5:#ee8aa1; --good:#6fcf8e; --bad:#ff8a77; } }
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 64px; }
  h1 { font-size: 1.75rem; letter-spacing: -.02em; margin: 4px 0 4px; font-family: var(--amber-font-rounded); }
  .sub { color: var(--amber-text-secondary); font-size: .875rem; margin-bottom: 16px; }
  .seg { display: flex; gap: 4px; background: var(--amber-fill); padding: 4px; border-radius: var(--amber-radius-small); margin-bottom: 16px; }
  .seg button { flex: 1; min-height: 44px; border: 0; border-radius: calc(var(--amber-radius-small) - 2px); background: transparent; color: var(--amber-text); font: inherit; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--amber-surface); color: var(--amber-text); box-shadow: inset 0 -3px 0 var(--amber-accent); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi, .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 14px 16px; }
  .kpi .l { font-size: .8125rem; color: var(--amber-text-secondary); display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .kpi .v { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .kpi .d { font-size: .875rem; font-variant-numeric: tabular-nums; }
  .up { color: var(--good); } .down { color: var(--bad); }
  .grid { display: grid; gap: 16px; }
  @media (min-width: 900px) { .grid.two { grid-template-columns: 1fr 1fr; } }
  .card h2 { font-size: 1rem; margin: 0 0 10px; }
  .chart { position: relative; height: 280px; }
  .chart.tall { height: 340px; }
  .tools { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .tools h2 { margin: 0; }
  .pill { display: inline-flex; gap: 2px; background: var(--amber-fill); border-radius: 999px; padding: 3px; }
  .pill button { min-height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--amber-text); font: inherit; font-size: .875rem; }
  .pill button[aria-pressed="true"] { background: var(--amber-surface); color: var(--amber-text); font-weight: 700; box-shadow: inset 0 -3px 0 var(--amber-accent); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .9375rem; }
  th, td { text-align: right; padding: 10px 6px; border-top: 1px solid var(--amber-separator); }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: .8125rem; color: var(--amber-text-secondary); font-weight: 600; border-top: 0; }
  .tbl { overflow-x: auto; }
  .bw { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  @media (max-width: 420px) { .bw { grid-template-columns: 1fr; } }
  .bw .kpi { border-left: 4px solid var(--good); } .bw .kpi.worst { border-left-color: var(--bad); }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  const num = s => { const n = parseFloat(String(s ?? "").replace(/\s/g, "").replace(",", ".")); return isNaN(n) ? 0 : n; };
  const fmt = n => Math.round(n).toLocaleString("en-US");
  const pct = n => (n >= 0 ? "+" : "") + n.toFixed(1) + "%";
  let tab = "trends", mode = "actual", charts = [], last = null;
  const cv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const color = i => cv("--c" + (i % 6));

  function kill() { charts.forEach(c => c.destroy()); charts = []; }

  function render(note) {
    last = note;
    kill();
    const app = document.getElementById("app");
    const t = note.tables.find(t => t.columns.length >= 2 && t.rows.length);
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with a Month column and one column per sales line.</div>`; return; }
    const lines = t.columns.slice(1).map(c => c.name);
    const months = t.rows.map(r => r[0]);
    const data = lines.map((_, j) => t.rows.map(r => num(r[j + 1])));
    const totals = months.map((_, i) => data.reduce((s, d) => s + d[i], 0));
    const ytd = data.map(d => d.reduce((a, b) => a + b, 0));
    const grand = ytd.reduce((a, b) => a + b, 0);
    const n = months.length;

    let h = `<h1>${esc(note.title)}</h1><div class="sub">${esc(months[0])} to ${esc(months[n - 1])} · ${n} months · ${fmt(grand)} total</div>
      <div class="seg" role="group" aria-label="View">${[["trends","Trends"],["mix","Mix"],["months","Best & worst"]].map(([k, l]) => `<button data-tab="${k}" aria-pressed="${tab === k}">${l}</button>`).join("")}</div>`;

    if (tab === "trends") {
      h += `<div class="kpis">${lines.map((l, j) => {
        const d = data[j], first = d[0], cur = d[n - 1];
        const ch = first ? (cur - first) / first * 100 : 0;
        const prev = n > 1 && d[n - 2] ? (cur - d[n - 2]) / d[n - 2] * 100 : 0;
        const a3 = d.slice(-3).reduce((a, b) => a + b, 0), b3 = d.slice(-6, -3).reduce((a, b) => a + b, 0);
        const q = b3 ? (a3 - b3) / b3 * 100 : null;
        return `<div class="kpi"><div class="l"><span class="dot" style="background:${color(j)}"></span>${esc(l)}</div><div class="v">${fmt(cur)}</div>
          <div class="d ${ch >= 0 ? "up" : "down"}">${ch >= 0 ? "▲" : "▼"} ${pct(ch)} since ${esc(months[0])}</div>
          <div class="d ${prev >= 0 ? "up" : "down"}">${pct(prev)} vs ${esc(months[n - 2] ?? "")}</div>
          ${q !== null ? `<div class="d ${q >= 0 ? "up" : "down"}">${pct(q)} last 3 vs prior 3</div>` : ""}</div>`;
      }).join("")}</div>
      <div class="card"><div class="tools"><h2>Monthly sales by line</h2>
        <div class="pill" role="group" aria-label="Scale"><button data-mode="actual" aria-pressed="${mode === "actual"}">Amount</button><button data-mode="index" aria-pressed="${mode === "index"}">Growth (first month = 100)</button></div></div>
        <div class="chart tall"><canvas id="c1" role="img" aria-label="Line chart of monthly sales for each line"></canvas></div></div>`;
    } else if (tab === "mix") {
      h += `<div class="grid two"><div class="card"><h2>Share of total</h2><div class="chart"><canvas id="c2" role="img" aria-label="Doughnut chart of each line's share of total sales"></canvas></div></div>
        <div class="card"><h2>Mix each month</h2><div class="chart"><canvas id="c3" role="img" aria-label="Stacked bars of each line's share per month"></canvas></div></div></div>
        <div class="card" style="margin-top:16px"><div class="tbl"><table><thead><tr><th>Line</th><th>Total</th><th>Share</th><th>Share ${esc(months[0])}</th><th>Share ${esc(months[n - 1])}</th></tr></thead><tbody>
        ${lines.map((l, j) => `<tr><td><span class="dot" style="background:${color(j)}"></span> ${esc(l)}</td><td>${fmt(ytd[j])}</td><td>${grand ? (ytd[j] / grand * 100).toFixed(1) : 0}%</td><td>${totals[0] ? (data[j][0] / totals[0] * 100).toFixed(1) : 0}%</td><td>${totals[n - 1] ? (data[j][n - 1] / totals[n - 1] * 100).toFixed(1) : 0}%</td></tr>`).join("")}</tbody></table></div></div>`;
    } else {
      const bi = totals.indexOf(Math.max(...totals)), wi = totals.indexOf(Math.min(...totals));
      h += `<div class="bw"><div class="kpi"><div class="l">Best month</div><div class="v up">${esc(months[bi])}</div><div class="d">${fmt(totals[bi])} total</div></div>
        <div class="kpi worst"><div class="l">Worst month</div><div class="v down">${esc(months[wi])}</div><div class="d">${fmt(totals[wi])} total</div></div></div>
        <div class="card"><h2>Total sales per month</h2><div class="chart"><canvas id="c4" role="img" aria-label="Bar chart of total sales per month, best and worst highlighted"></canvas></div></div>
        <div class="card" style="margin-top:16px"><h2>Best and worst by line</h2><div class="tbl"><table><thead><tr><th>Line</th><th>Best</th><th>Amount</th><th>Worst</th><th>Amount</th></tr></thead><tbody>
        ${lines.map((l, j) => { const d = data[j], mx = d.indexOf(Math.max(...d)), mn = d.indexOf(Math.min(...d)); return `<tr><td><span class="dot" style="background:${color(j)}"></span> ${esc(l)}</td><td class="up">${esc(months[mx])}</td><td>${fmt(d[mx])}</td><td class="down">${esc(months[mn])}</td><td>${fmt(d[mn])}</td></tr>`; }).join("")}</tbody></table></div></div>`;
    }
    app.innerHTML = h;
    app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; amber.store.set("tab", tab); render(last); });
    app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; amber.store.set("mode", mode); render(last); });

    const txt = cv("--amber-text-secondary"), grid = cv("--amber-separator");
    Chart.defaults.color = txt; Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
    const axes = (extra = {}) => ({ x: { grid: { display: false }, ...(extra.x || {}) }, y: { grid: { color: grid }, ticks: { callback: v => extra.pct ? v + "%" : v >= 1000 ? v / 1000 + "k" : v }, ...(extra.y || {}) } });
    const mk = (id, cfg) => { const el = document.getElementById(id); if (el) charts.push(new Chart(el, cfg)); };
    const base = { responsive: true, maintainAspectRatio: false, animation: { duration: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 400 } };

    if (tab === "trends") {
      mk("c1", { type: "line", data: { labels: months, datasets: lines.map((l, j) => ({ label: l, borderColor: color(j), backgroundColor: color(j), borderWidth: 2.5, tension: .3, pointRadius: 3,
        data: mode === "index" ? data[j].map(v => data[j][0] ? v / data[j][0] * 100 : 0) : data[j] })) },
        options: { ...base, interaction: { mode: "index", intersect: false }, plugins: { legend: { position: "bottom", labels: { usePointStyle: true } }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${mode === "index" ? c.parsed.y.toFixed(0) : fmt(c.parsed.y)}` } } }, scales: axes() } });
    } else if (tab === "mix") {
      mk("c2", { type: "doughnut", data: { labels: lines, datasets: [{ data: ytd, backgroundColor: lines.map((_, j) => color(j)), borderColor: cv("--amber-surface"), borderWidth: 2 }] },
        options: { ...base, cutout: "58%", plugins: { legend: { position: "bottom", labels: { usePointStyle: true } }, tooltip: { callbacks: { label: c => `${c.label}: ${fmt(c.parsed)} (${(c.parsed / grand * 100).toFixed(1)}%)` } } } } });
      mk("c3", { type: "bar", data: { labels: months, datasets: lines.map((l, j) => ({ label: l, backgroundColor: color(j), data: data[j].map((v, i) => totals[i] ? v / totals[i] * 100 : 0) })) },
        options: { ...base, plugins: { legend: { position: "bottom", labels: { usePointStyle: true } }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y.toFixed(1)}%` } } }, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, max: 100, grid: { color: grid }, ticks: { callback: v => v + "%" } } } } });
    } else {
      const mx = Math.max(...totals), mn = Math.min(...totals);
      mk("c4", { type: "bar", data: { labels: months, datasets: [{ label: "Total", data: totals, borderRadius: 4,
        backgroundColor: totals.map(v => v === mx ? cv("--good") : v === mn ? cv("--bad") : color(1)) }] },
        options: { ...base, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => fmt(c.parsed.y) + (c.parsed.y === mx ? " (best)" : c.parsed.y === mn ? " (worst)" : "") } } }, scales: axes() } });
    }
  }
  amber.onChange(note => render(note));
  Promise.resolve(amber.data && amber.data.values).then(v => { if (v && (v.tab || v.mode)) { tab = v.tab || tab; mode = v.mode || mode; if (last) render(last); } });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => last && render(last));
</script>
</body>
</html>
