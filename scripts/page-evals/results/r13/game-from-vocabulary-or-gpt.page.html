<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-settings" content='{"settings":[{"key":"roundSize","label":"Questions per quest","type":"choice","options":["5","8","10"],"default":"5"},{"key":"direction","label":"Question style","type":"choice","options":["Mix both ways","Spanish to English","English to Spanish"],"default":"Mix both ways"}]}' />
<style>
:root{--quest-ok:#176f43;--quest-ok-text:#fff;--quest-primary:#4c1d95;--quest-primary-text:#fff}@media (prefers-color-scheme:dark){:root{--quest-ok:#5dc991;--quest-ok-text:#102015;--quest-primary:#c4b5fd;--quest-primary-text:#180a2f}}*{box-sizing:border-box}body{margin:0;padding:calc(14px + env(safe-area-inset-top)) var(--amber-gutter) calc(88px + env(safe-area-inset-bottom));color:var(--amber-text);font-family:var(--amber-font);}.wrap{max-width:var(--amber-content-max);margin:0 auto}.hero{position:relative;overflow:hidden;border:1px solid var(--amber-separator);border-radius:calc(var(--amber-radius) + 8px);padding:18px;background:linear-gradient(135deg,var(--amber-accent-soft),var(--amber-surface) 48%,var(--amber-fill));box-shadow:0 10px 28px rgba(0,0,0,.08)}h1{font-size:1.75rem;line-height:1.05;margin:0 0 6px;letter-spacing:-.03em}.tag{margin:0;color:var(--amber-text-secondary);font-size:1rem}.logo{display:inline-flex;align-items:center;gap:8px;margin-bottom:12px;padding:7px 10px;border-radius:999px;background:var(--amber-surface);border:1px solid var(--amber-separator);font-weight:800;font-size:.9rem;color:var(--amber-accent-text)}.coin{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--quest-primary);color:var(--quest-primary-text);font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:16px;padding:10px;min-width:0}.num{display:block;font-size:1.35rem;font-weight:850;letter-spacing:-.03em}.lbl{display:block;color:var(--amber-text-secondary);font-size:.78rem;margin-top:2px}.panel{margin-top:14px;background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:calc(var(--amber-radius) + 4px);padding:14px}.arena{display:grid;gap:14px}.scene{min-height:144px;border-radius:22px;background:radial-gradient(circle at 25% 20%,var(--amber-accent-soft),transparent 32%),linear-gradient(160deg,var(--amber-fill),var(--amber-surface));border:1px solid var(--amber-separator);display:grid;place-items:center;text-align:center;padding:18px;position:relative;overflow:hidden}.scene:before,.scene:after{content:"";position:absolute;border-radius:50%;background:var(--amber-accent-soft);opacity:.75}.scene:before{width:70px;height:70px;right:-22px;top:16px}.scene:after{width:96px;height:96px;left:-32px;bottom:-28px}.prompt{position:relative;z-index:1}.small{color:var(--amber-text-secondary);font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.word{font-family:var(--amber-font-rounded);font-size:2.2rem;line-height:1.05;font-weight:900;margin-top:8px;overflow-wrap:anywhere}.progress{height:10px;border-radius:999px;background:var(--amber-fill);overflow:hidden;border:1px solid var(--amber-separator)}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber-accent),#7c3aed);transition:width .25s}.choices{display:grid;gap:10px}.choice,.primary,.ghost{font:inherit;border-radius:16px;min-height:52px;padding:12px 14px;border:1px solid var(--amber-separator);background:var(--amber-field);color:var(--amber-text);text-align:left}.choice{font-weight:750}.choice:disabled{opacity:1}.choice.correct{background:var(--quest-ok);color:var(--quest-ok-text);border-color:var(--quest-ok)}.choice.wrong{background:var(--amber-danger);color:#fff;border-color:var(--amber-danger)}.choice.missed{box-shadow:inset 0 0 0 3px var(--quest-ok)}.primary{background:var(--quest-primary);border-color:var(--quest-primary);color:var(--quest-primary-text);font-weight:850;text-align:center}.ghost{background:var(--amber-surface);color:var(--amber-accent-text);font-weight:800;text-align:center}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.feedback{min-height:2.4em;color:var(--amber-text-secondary);font-weight:700}.feedback strong{color:var(--amber-text)}.badgebar{display:flex;gap:8px;flex-wrap:wrap}.badge{padding:7px 10px;border-radius:999px;background:var(--amber-fill);border:1px solid var(--amber-separator);font-size:.85rem;font-weight:750}.empty{padding:28px 16px;text-align:center;color:var(--amber-text-secondary)}.cards{display:grid;gap:10px}.mini{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-top:1px solid var(--amber-separator);color:var(--amber-text-secondary)}.mini b{color:var(--amber-text)}@media (min-width:760px){body{padding-top:24px}.gamegrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:16px;align-items:start}.hero{padding:22px}.word{font-size:3rem}.scene{min-height:220px}.choices{grid-template-columns:1fr 1fr}.side{margin-top:14px}}@media (max-width:360px){.stats{grid-template-columns:1fr}.word{font-size:1.85rem}.hero{padding:14px}}@media (prefers-reduced-motion:no-preference){.choice,.primary,.ghost{transition:transform .12s,box-shadow .12s}.choice:active,.primary:active,.ghost:active{transform:scale(.98)}}
</style>
</head>
<body>
<main id="app" class="wrap" aria-live="polite"></main>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state={mode:"home",deck:[],i:0,correct:0,answered:false,picked:null};let lastSig="";
function rows(note){const t=(note.tables||[]).find(x=>x.columns.length>=2&&x.rows.length);return t? t.rows.map((r,idx)=>({idx,sp:String(r[0]||"").trim(),en:String(r[1]||"").trim()})).filter(x=>x.sp&&x.en):[]} 
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function yesterday(d){const x=new Date(d+"T12:00:00");x.setDate(x.getDate()-1);return x.toISOString().slice(0,10)}
function buildDeck(note){const all=rows(note);const n=Math.min(Number(amber.settings.roundSize||5),all.length);const dir=amber.settings.direction||"Mix both ways";return shuffle(all).slice(0,n).map(item=>{let toEn=dir==="Spanish to English"?true:dir==="English to Spanish"?false:Math.random()>.5;let prompt=toEn?item.sp:item.en, answer=toEn?item.en:item.sp, label=toEn?"Choose the English meaning":"Choose the Spanish verb";let pool=all.map(x=>toEn?x.en:x.sp).filter(x=>x!==answer);let opts=shuffle([answer,...shuffle([...new Set(pool)]).slice(0,3)]);return{prompt,answer,label,opts,sp:item.sp,en:item.en}})}
function values(data){return (data&&data.values)||{}}
function render(note,data){const app=$("#app"), all=rows(note), v=values(data), stats=v.stats||{}, log=v.log||{}, today=note.today;if(!all.length){app.innerHTML=`<section class="hero"><h1>${esc(note.title)}</h1><p class="tag">Add a Spanish | English table to turn this note into a quick phone game.</p><div class="empty">No playable verbs found yet.</div></section>`;return}let played=(log[today]&&log[today].questions)||0;let side=`<section class="panel side"><div class="row"><strong>Verb vault</strong><span class="badge">${all.length} verbs</span></div><div class="cards">${all.map(x=>`<div class="mini"><b>${esc(x.sp)}</b><span>${esc(x.en)}</span></div>`).join("")}</div></section>`;if(state.mode==="play"&&state.deck.length){app.innerHTML=playHtml(note,v);bindPlay(note,data);return}if(state.mode==="done"){app.innerHTML=doneHtml(note,v,side);bindHome(note,data);return}app.innerHTML=`<section class="hero"><div class="logo"><span class="coin">¡</span>Verb Quest</div><h1>${esc(note.title)}</h1><p class="tag">A tiny daily dungeon: pick translations, earn XP, keep your streak.</p><div class="stats"><div class="stat"><span class="num">${stats.streak||0}</span><span class="lbl">day streak</span></div><div class="stat"><span class="num">${stats.xp||0}</span><span class="lbl">total XP</span></div><div class="stat"><span class="num">${stats.best||0}</span><span class="lbl">best round</span></div></div></section><div class="gamegrid"><section class="panel arena"><div class="badgebar"><span class="badge">${played?"Quest done today":"Daily quest ready"}</span><span class="badge">${amber.settings.roundSize||5} questions</span></div><div class="scene"><div class="prompt"><div class="small">Ready?</div><div class="word">Enter the verb dungeon</div></div></div><button class="primary" id="start">Start quest</button><button class="ghost" id="practice">Shuffle practice</button></section>${side}</div>`;bindHome(note,data)}
function playHtml(note,v){let q=state.deck[state.i], pct=(state.i/state.deck.length)*100, ans=state.answered;return`<section class="hero"><h1>${esc(note.title)}</h1><p class="tag">Verb Quest · ${state.correct} correct · ${state.deck.length-state.i} rooms left</p><div class="progress" aria-label="Quest progress"><span style="width:${pct}%"></span></div></section><section class="panel arena"><div class="scene"><div class="prompt"><div class="small">${esc(q.label)}</div><div class="word">${esc(q.prompt)}</div></div></div><div class="choices">${q.opts.map(o=>{let cls=o===q.answer&&ans?" correct":state.picked===o&&o!==q.answer?" wrong":ans&&o===q.answer?" missed":"";return`<button class="choice${cls}" ${ans?"disabled":""} data-choice="${esc(o)}">${esc(o)}</button>`}).join("")}</div><div class="feedback" role="status">${ans?(state.picked===q.answer?`✅ Correct: <strong>${esc(q.sp)}</strong> = ${esc(q.en)}`:`Not quite — <strong>${esc(q.sp)}</strong> = ${esc(q.en)}`):"Choose an answer."}</div>${ans?`<button class="primary" id="next">${state.i===state.deck.length-1?"Finish quest":"Next room"}</button>`:""}</section>`}
function doneHtml(note,v,side){let xp=state.correct*10+(state.correct===state.deck.length?15:0);return`<section class="hero"><div class="logo"><span class="coin">★</span>Quest complete</div><h1>${esc(note.title)}</h1><p class="tag">You cleared ${state.correct} of ${state.deck.length} rooms and earned ${xp} XP.</p><div class="stats"><div class="stat"><span class="num">${state.correct}/${state.deck.length}</span><span class="lbl">score</span></div><div class="stat"><span class="num">+${xp}</span><span class="lbl">XP</span></div><div class="stat"><span class="num">${(v.stats&&v.stats.streak)||0}</span><span class="lbl">day streak</span></div></div></section><div class="gamegrid"><section class="panel arena"><div class="scene"><div class="prompt"><div class="small">${state.correct===state.deck.length?"Perfect run":"Nice practice"}</div><div class="word">${state.correct===state.deck.length?"¡Excelente!":"Keep delving"}</div></div></div>${state.saveError?`<div class="feedback" role="alert">${esc(state.saveError)}</div>`:""}<button class="primary" id="start">Play again</button><button class="ghost" id="home">Back to camp</button></section>${side}</div>`}
function bindHome(note,data){const start=$("#start"), practice=$("#practice"), home=$("#home");const go=async()=>{const v=values(data);const r=await amber.setData({values:{starts:(v.starts||0)+1,lastStart:note.today}});state={mode:"play",deck:buildDeck(note),i:0,correct:0,answered:false,picked:null,saveError:r&&r.ok?"":((r&&r.error)||"Could not start quest")};render(note,amber.data||data)};if(start)start.onclick=go;if(practice)practice.onclick=go;if(home)home.onclick=()=>{state.mode="home";render(note,data)}}
function bindPlay(note,data){document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{if(state.answered)return;state.picked=b.dataset.choice;state.answered=true;if(state.picked===state.deck[state.i].answer)state.correct++;render(note,data)});const next=$("#next");if(next)next.onclick=async()=>{if(state.i<state.deck.length-1){state.i++;state.answered=false;state.picked=null;render(note,data)}else{await finish(note,data);state.mode="done";render(note,amber.data)}}}
async function finish(note,data){const v=values(data), stats={...(v.stats||{})}, log={...(v.log||{})}, today=note.today, qs=state.deck.length, xp=state.correct*10+(state.correct===qs?15:0), prev=log[today]||{rounds:0,correct:0,questions:0};let firstToday=!prev.questions;stats.xp=(stats.xp||0)+xp;stats.best=Math.max(stats.best||0,state.correct);stats.totalRounds=(stats.totalRounds||0)+1;stats.totalCorrect=(stats.totalCorrect||0)+state.correct;stats.totalQuestions=(stats.totalQuestions||0)+qs;if(firstToday){stats.streak=(stats.lastPlayed===yesterday(today)?(stats.streak||0)+1:1);stats.lastPlayed=today}log[today]={rounds:(prev.rounds||0)+1,correct:(prev.correct||0)+state.correct,questions:(prev.questions||0)+qs};const r=await amber.setData({values:{stats,log}});state.saveError=r&&r.ok?"":((r&&r.error)||"Could not save progress");}
amber.onChange((note,data)=>{const sig=rows(note).map(x=>x.sp+"="+x.en).join("|");if(lastSig&&sig!==lastSig)state={mode:"home",deck:[],i:0,correct:0,answered:false,picked:null};lastSig=sig;render(note,data)});
</script>
</body>
</html>
