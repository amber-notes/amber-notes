<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-libs" content="confetti">
<title>Habit tracker</title>
<style>
  :root { --g: #2f7d4f; --g-ink: #fff; --g-soft: #dff1e6; --g-card: #f1f6f2; --g-empty: #e1eae3; --gold: #7a5600; }
  @media (prefers-color-scheme: dark) { :root { --g: #5ccf8a; --g-ink: #0e2318; --g-soft: #1d3a2a; --g-card: #1a221d; --g-empty: #2a332d; --gold: #f0c04a; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 8px var(--amber-gutter) 60px; }
  h1 { font-size: 1.75rem; margin: 6px 0 2px; letter-spacing: -.02em; font-family: var(--amber-font-rounded); }
  .sub { color: var(--amber-text-secondary); margin-bottom: 14px; font-size: .95rem; }
  .label { font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 22px 4px 8px; }
  .card { background: var(--g-card); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 14px 16px; }
  .lvl { display: flex; align-items: center; gap: 14px; }
  .badge { width: 3.4rem; height: 3.4rem; border-radius: 50%; background: var(--g); color: var(--g-ink); display: grid; place-items: center; font-weight: 800; font-size: 1.4rem; flex: none; font-family: var(--amber-font-rounded); }
  .lvl .info { flex: 1; min-width: 0; }
  .lvl .t { font-weight: 700; font-size: 1.05rem; }
  .xp { height: 12px; border-radius: 6px; background: var(--g-empty); overflow: hidden; margin: 6px 0 4px; }
  .xp div { height: 100%; background: var(--g); border-radius: 6px; transition: width .5s cubic-bezier(.34,1.56,.64,1); }
  .small { font-size: .82rem; color: var(--amber-text-secondary); }
  .tiles { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 520px) { .tiles { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); } }
  .tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px 12px 14px; min-height: 11rem; border-radius: 22px; border: 2px solid var(--amber-separator); background: var(--g-card); color: var(--amber-text); font: inherit; cursor: pointer; transition: transform .15s, background .2s, border-color .2s; }
  .tile:active { transform: scale(.96); }
  .tile.done { background: var(--g-soft); border-color: var(--g); }
  .plant { font-size: 3.4rem; line-height: 1; transition: transform .4s cubic-bezier(.34,1.56,.64,1); filter: grayscale(.9) opacity(.6); }
  .tile.done .plant { filter: none; transform: scale(1.12) rotate(-4deg); }
  .tile .nm { font-weight: 700; font-size: 1.1rem; }
  .tile .st { font-size: .9rem; color: var(--amber-text-secondary); }
  .tile.done .st { color: var(--amber-text); }
  .tile .go { margin-top: auto; font-size: .85rem; font-weight: 700; padding: 6px 14px; border-radius: 99px; background: var(--g); color: var(--g-ink); }
  .tile.done .go { background: none; color: var(--g); border: 1.5px solid var(--g); }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
  .wd { padding: 8px 0; border-radius: 14px; background: var(--g-empty); font-size: .75rem; color: var(--amber-text-secondary); }
  .wd .e { font-size: 1.3rem; display: block; min-height: 1.6rem; }
  .wd.perfect { background: var(--g-soft); outline: 2px solid var(--g); }
  .wd.today { font-weight: 800; color: var(--amber-text); box-shadow: inset 0 0 0 2px var(--amber-text); }
  .wd.future { opacity: .45; }
  .heat { display: grid; gap: 4px; overflow-x: auto; }
  .hr { display: grid; grid-template-columns: minmax(56px, 90px) repeat(var(--n), minmax(14px, 1fr)); gap: 3px; align-items: center; }
  .hr .h { font-size: .8rem; color: var(--amber-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c { aspect-ratio: 1; border-radius: 5px; background: var(--g-empty); }
  .c.on { background: var(--g); }
  .c.today { outline: 2px solid var(--amber-text); outline-offset: -2px; }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .b { text-align: center; padding: 12px 8px; border-radius: 16px; background: var(--g-card); border: 1px solid var(--amber-separator); }
  .b .i { font-size: 1.9rem; display: block; filter: grayscale(1) opacity(.4); }
  .b.got .i { filter: none; }
  .b .n { font-weight: 700; font-size: .88rem; }
  .b.got .n { color: var(--gold); }
  .err { color: var(--amber-danger); min-height: 1.2em; text-align: center; font-size: .9rem; }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
  @media (min-width: 900px) { .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; } h1 { font-size: 2.1rem; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const DONE = /^(✓|✔|x|yes|y|1|true|done)$/i;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const ICONS = [[/walk|run|jog|step/i, "🚶"], [/read|book/i, "📚"], [/stretch|yoga|mobil/i, "🧘"], [/water|drink/i, "💧"], [/sleep/i, "😴"], [/med/i, "🧠"], [/write|journal/i, "✍️"], [/gym|lift|workout/i, "💪"]];
  const iconFor = (n) => (ICONS.find(([r]) => r.test(n)) || [0, "🌱"])[1];
  const stage = (s) => s >= 7 ? "🌳" : s >= 3 ? "🌿" : "🌱";
  let fx = null;
  const boom = (o) => { try { if (!fx) { const cv = document.createElement("canvas"); cv.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9"; cv.setAttribute("aria-hidden", "true"); document.body.appendChild(cv); fx = confetti.create(cv, { resize: true, useWorker: false }); } fx(o); } catch (e) {} };
  let error = "", lastDone = -1, celebrate = false;

  function render(note) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => t.columns.some((c) => /^(date|day)$/i.test(c.name)));
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with a Date column and one column per habit.</div>`; return; }
    const dc = t.columns.findIndex((c) => /^(date|day)$/i.test(c.name));
    const habits = t.columns.map((c, i) => ({ name: c.name, i })).filter((h) => h.i !== dc);
    const today = note.today;
    const byDate = new Map(t.rows.map((r, i) => [r[dc], { r, i }]));
    const done = (d, h) => DONE.test(String(byDate.get(d)?.r[h.i] ?? "").trim());
    const perfect = (d) => habits.length > 0 && habits.every((h) => done(d, h));
    habits.forEach((h) => {
      let n = 0, d = done(today, h) ? today : addDays(today, -1);
      while (done(d, h)) { n++; d = addDays(d, -1); }
      h.streak = n; h.today = done(today, h);
      h.total = t.rows.filter((r) => DONE.test(String(r[h.i] ?? "").trim())).length;
    });
    const xp = habits.reduce((a, h) => a + h.total * 10, 0) + t.rows.filter((r) => habits.length && habits.every((h) => DONE.test(String(r[h.i] ?? "").trim()))).length * 20;
    const level = Math.floor(xp / 100) + 1, into = xp % 100;
    const doneToday = habits.filter((h) => h.today).length;
    const allDone = habits.length > 0 && doneToday === habits.length;
    const monday = addDays(today, -((new Date(today + "T12:00:00Z").getUTCDay() + 6) % 7));
    const week = Array.from({ length: 7 }, (_, k) => addDays(monday, k));
    const names = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const days = Array.from({ length: 14 }, (_, k) => addDays(today, k - 13));
    const perfectDays = t.rows.filter((r) => habits.length && habits.every((h) => DONE.test(String(r[h.i] ?? "").trim()))).length;
    const bestStreak = Math.max(0, ...habits.map((h) => h.streak));
    const weekTicks = week.reduce((a, d) => a + habits.filter((h) => done(d, h)).length, 0);
    const badges = [
      ["🌱", "First tick", xp > 0], ["🔥", "3-day streak", bestStreak >= 3], ["🏆", "7-day streak", bestStreak >= 7],
      ["⭐", "Perfect day", perfectDays >= 1], ["🌈", "3 perfect days", perfectDays >= 3], ["🚀", "Level 5", level >= 5],
      ["💎", "10 ticks in a week", weekTicks >= 10]];
    const msg = allDone ? "Perfect day! Everything's watered 🎉" : doneToday ? `${habits.length - doneToday} to go. Keep growing!` : "Tap a plant to water it today";

    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="sub">${esc(msg)}</div>
      <div class="card lvl"><div class="badge" aria-hidden="true">${level}</div>
        <div class="info"><div class="t">Level ${level}</div><div class="xp" role="progressbar" aria-label="Progress to next level" aria-valuenow="${into}" aria-valuemin="0" aria-valuemax="100"><div style="width:${into}%"></div></div>
        <div class="small">${100 - into} XP to level ${level + 1} · 10 XP a tick, +20 for a perfect day</div></div></div>
      <div class="label">Today</div>
      <div class="tiles">${habits.map((h) => `
        <button class="tile${h.today ? " done" : ""}" data-h="${h.i}" aria-pressed="${h.today}" aria-label="${esc(h.name)}, ${h.today ? "done" : "not done"} today">
          <span class="plant" aria-hidden="true">${h.today ? stage(h.streak) : iconFor(h.name)}</span>
          <span class="nm">${esc(h.name)}</span>
          <span class="st">${h.streak ? `🔥 ${h.streak} day${h.streak > 1 ? "s" : ""} in a row` : "Streak starts today"}</span>
          <span class="go">${h.today ? "Done ✓" : "Water it"}</span>
        </button>`).join("")}</div>
      <div class="err" role="alert">${esc(error)}</div>
      <div class="cols"><div>
        <div class="label">This week</div>
        <div class="week">${week.map((d, k) => `<div class="wd${perfect(d) ? " perfect" : ""}${d === today ? " today" : ""}${d > today ? " future" : ""}"><span class="e">${d > today ? "" : perfect(d) ? "⭐" : habits.some((h) => done(d, h)) ? "🌿" : "·"}</span>${names[k]}</div>`).join("")}</div>
        <div class="label">Last 14 days</div>
        <div class="card heat" role="img" aria-label="Habits done in the last 14 days">${habits.map((h) => `<div class="hr" style="--n:14"><span class="h">${esc(h.name)}</span>${days.map((d) => `<span class="c${done(d, h) ? " on" : ""}${d === today ? " today" : ""}"></span>`).join("")}</div>`).join("")}</div>
      </div><div>
        <div class="label">Badges · ${badges.filter((b) => b[2]).length} of ${badges.length}</div>
        <div class="badges">${badges.map(([i, n, got]) => `<div class="b${got ? " got" : ""}"><span class="i" aria-hidden="true">${i}</span><span class="n">${n}</span><span class="small">${got ? "Earned" : "Locked"}</span></div>`).join("")}</div>
      </div></div>`;

    if (lastDone === -1) lastDone = allDone ? 1 : 0;
    if (celebrate && allDone && !lastDone) { boom({ particleCount: 140, spread: 80, origin: { y: .6 } }); }
    else if (celebrate && doneToday) { boom({ particleCount: 30, spread: 50, origin: { y: .7 } }); }
    lastDone = allDone ? 1 : 0; celebrate = false;

    app.querySelectorAll(".tile").forEach((b) => b.addEventListener("click", async () => {
      const h = habits.find((x) => x.i === Number(b.dataset.h));
      const row = byDate.get(today);
      const value = h.today ? "" : "✓";
      celebrate = !h.today;
      const r = row
        ? await amber.update({ op: "set_cell", table: t.index, row: row.i, col: h.name, value })
        : await amber.update({ op: "append_row", table: t.index, values: { [t.columns[dc].name]: today, [h.name]: value } });
      error = r.ok ? "" : r.error;
      if (!r.ok) { celebrate = false; render(amber.note); }
    }));
  }
  amber.onChange(render);
</script>
</body>
</html>
