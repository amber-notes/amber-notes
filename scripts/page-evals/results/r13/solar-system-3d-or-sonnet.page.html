<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-libs" content="three">
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 12px var(--amber-gutter) 24px; }
  .stage { position: relative; height: min(70vh, 640px); min-height: 320px; border-radius: var(--amber-radius); overflow: hidden; background: #05060f; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  h1 { position: absolute; left: 14px; top: 10px; margin: 0; font-size: 1.4rem; letter-spacing: -.02em; color: #f4f1ea; pointer-events: none; }
  .hint { position: absolute; left: 14px; bottom: 10px; font-size: .8rem; color: #b9bfd3; pointer-events: none; }
  .lbl { position: absolute; left: 0; top: 0; font-size: .75rem; color: #e8ebf5; pointer-events: none; white-space: nowrap; text-shadow: 0 1px 3px #000; }
  .lbl.sel { color: #ffd37a; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .chips button { font: inherit; font-size: .9rem; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--amber-separator); background: var(--amber-surface); color: var(--amber-text); }
  .chips button[aria-pressed="true"] { background: var(--amber-accent); color: var(--amber-on-accent); border-color: var(--amber-accent); font-weight: 600; }
  .info { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 12px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px 16px; }
  .info div span { display: block; font-size: .8rem; color: var(--amber-text-secondary); }
  .info div b { font-variant-numeric: tabular-nums; font-size: 1.05rem; }
  .note { margin-top: 8px; font-size: .8rem; color: var(--amber-text-secondary); }
  @media (prefers-color-scheme: dark) { .stage { background: #05060f; } h1 { color: #f4f1ea; } .hint { color: #b9bfd3; } }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
</style>
</head>
<body>
<main>
  <div class="stage" id="stage">
    <h1 id="title"></h1>
    <div class="hint">Drag to spin · pinch or scroll to zoom · tap a planet</div>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Planets"></div>
  <div class="info" id="info" aria-live="polite"></div>
  <div class="note">Sizes and distances are squashed (square roots) so every planet fits; spin speed follows each day length.</div>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const num = s => { const n = parseFloat(String(s).replace(/\s/g, "").replace(",", ".")); return isNaN(n) ? null : n; };
const COLORS = { mercury:0xa89f94, venus:0xe3b86b, earth:0x3e7bd6, mars:0xc8512f, jupiter:0xd4a373, saturn:0xe6cf95, uranus:0x8fd6dc, neptune:0x3f5fd0, pluto:0xb7a898 };
const stage = document.getElementById("stage");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let renderer, scene, camera, root, bodies = [], labels = [], sel = -1, rows = [];
let theta = 0.6, phi = 1.15, dist = 30, running = true, T = 0;
let pending = null;

function setup() {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  stage.insertBefore(renderer.domElement, stage.firstChild);
  renderer.domElement.setAttribute("role", "img");
  renderer.domElement.setAttribute("aria-label", "3D solar system. Drag to rotate.");
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);
  const pts = []; for (let i = 0; i < 700; i++) { const v = new THREE.Vector3().randomDirection().multiplyScalar(120 + Math.random() * 60); pts.push(v.x, v.y, v.z); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, sizeAttenuation: true })));
  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  const sun = new THREE.PointLight(0xfff2d0, 3.5, 0, 0); scene.add(sun);
  const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(1.9, 40, 24), new THREE.MeshBasicMaterial({ color: 0xffb938 }));
  scene.add(sunMesh);
  const glow = new THREE.Mesh(new THREE.SphereGeometry(2.4, 32, 16), new THREE.MeshBasicMaterial({ color: 0xff9a1f, transparent: true, opacity: 0.18 }));
  scene.add(glow);
  root = new THREE.Group(); scene.add(root);
  resize(); new ResizeObserver(resize).observe(stage);
  bindInput();
  requestAnimationFrame(loop);
}
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
function build(list) {
  while (root.children.length) { const c = root.children.pop(); c.traverse(o => { o.geometry && o.geometry.dispose(); }); }
  labels.forEach(l => l.remove()); labels = []; bodies = [];
  const maxAU = Math.max(...list.map(p => p.au)), maxR = Math.max(...list.map(p => p.rad));
  list.forEach((p, i) => {
    const orbit = 4.2 + 11 * Math.sqrt(p.au / maxAU);
    const size = 0.22 + 1.1 * Math.sqrt(p.rad / maxR);
    const col = COLORS[p.name.toLowerCase()] ?? new THREE.Color().setHSL((i * 0.17) % 1, 0.5, 0.6).getHex();
    const ring = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints(Array.from({ length: 129 }, (_, k) => new THREE.Vector3(Math.cos(k / 128 * 6.2832) * orbit, 0, Math.sin(k / 128 * 6.2832) * orbit))),
      new THREE.LineBasicMaterial({ color: 0x4a5070 }));
    root.add(ring);
    const pivot = new THREE.Group(); root.add(pivot);
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 32, 20), new THREE.MeshStandardMaterial({ color: col, roughness: 0.85 }));
    mesh.position.x = orbit; mesh.userData.i = i; pivot.add(mesh);
    if (/saturn/i.test(p.name)) {
      const r = new THREE.Mesh(new THREE.RingGeometry(size * 1.35, size * 2.1, 64), new THREE.MeshBasicMaterial({ color: 0xcdb98a, side: THREE.DoubleSide }));
      r.rotation.x = Math.PI / 2 - 0.45; mesh.add(r);
    }
    const el = document.createElement("div"); el.className = "lbl"; el.textContent = p.name; stage.appendChild(el); labels.push(el);
    const hrs = Math.abs(p.day) || 24;
    bodies.push({ pivot, mesh, speed: 0.5 / Math.pow(orbit / 4, 1.5), phase: i * 1.7, spin: 6 / Math.min(Math.max(hrs, 8), 60), size });
  });
  dist = Math.max(dist, 10);
}
function select(i) {
  sel = i; showInfo();
  document.querySelectorAll("#chips button").forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
  labels.forEach((l, k) => l.classList.toggle("sel", k === i));
}
function showInfo() {
  const el = document.getElementById("info"); const p = rows[sel];
  if (!p) { el.innerHTML = '<div><span>Tap a planet</span><b>to see its numbers</b></div>'; return; }
  const f = n => n.toLocaleString("en", { maximumFractionDigits: 2 });
  el.innerHTML = `<div><span>Planet</span><b>${esc(p.name)}</b></div><div><span>Distance</span><b>${f(p.au)} AU</b></div><div><span>Radius</span><b>${f(p.rad)} km</b></div><div><span>Day</span><b>${f(p.day)} h</b></div>`;
}
function bindInput() {
  const el = renderer.domElement, ptrs = new Map(); let moved = 0, pinch = 0;
  el.addEventListener("pointerdown", e => { el.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; el.style.cursor = "grabbing"; if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a[0]-b[0], a[1]-b[1]); } });
  el.addEventListener("pointermove", e => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p[0], dy = e.clientY - p[1]; ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a[0]-b[0], a[1]-b[1]); dist = clampD(dist * pinch / d); pinch = d; moved = 99; return; }
    moved += Math.abs(dx) + Math.abs(dy);
    theta -= dx * 0.008; phi = Math.min(Math.max(phi - dy * 0.008, 0.15), 3.0);
  });
  const up = e => {
    if (ptrs.has(e.pointerId) && ptrs.size === 1 && moved < 6) tap(e);
    ptrs.delete(e.pointerId); el.style.cursor = "grab";
  };
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  el.addEventListener("wheel", e => { e.preventDefault(); dist = clampD(dist * (1 + e.deltaY * 0.001)); }, { passive: false });
}
const clampD = d => Math.min(Math.max(d, 8), 70);
function tap(e) {
  const r = renderer.domElement.getBoundingClientRect();
  const v = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  const rc = new THREE.Raycaster(); rc.setFromCamera(v, camera);
  const hit = rc.intersectObjects(bodies.map(b => b.mesh), false)[0];
  select(hit ? hit.object.userData.i : -1);
}
let last = 0;
function loop(t) {
  requestAnimationFrame(loop);
  if (document.visibilityState === "hidden" || !renderer) return;
  const dt = last ? Math.min((t - last) / 1000, 0.1) : 0; last = t;
  if (!reduce) { T += dt; theta += dt * 0.03; }
  bodies.forEach(b => { b.pivot.rotation.y = -(b.phase + T * b.speed); b.mesh.rotation.y += reduce ? 0 : dt * b.spin; });
  camera.position.set(dist * Math.sin(phi) * Math.sin(theta), dist * Math.cos(phi), dist * Math.sin(phi) * Math.cos(theta));
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  const w = stage.clientWidth, h = stage.clientHeight, v = new THREE.Vector3();
  bodies.forEach((b, i) => {
    b.mesh.getWorldPosition(v); v.y += b.size; v.project(camera);
    const l = labels[i], vis = v.z < 1;
    l.style.display = vis ? "" : "none";
    l.style.transform = `translate(${(v.x * 0.5 + 0.5) * w}px, ${(-v.y * 0.5 + 0.5) * h}px) translate(-50%, -120%)`;
  });
}
function onNote(note) {
  document.getElementById("title").textContent = note.title;
  const t = note.tables.find(t => t.columns.some(c => /planet|name/i.test(c.name)) && t.columns.some(c => /AU|dist/i.test(c.name)));
  const chips = document.getElementById("chips");
  if (!t) { rows = []; chips.innerHTML = '<div class="empty">Add a table with Planet, Distance (AU), Radius (km) and Day (hours) columns.</div>'; return; }
  const ci = re => t.columns.findIndex(c => re.test(c.name));
  const n = ci(/planet|name/i), d = ci(/AU|dist/i), r = ci(/radius/i), y = ci(/day/i);
  rows = t.rows.map(x => ({ name: x[n] || "?", au: num(x[d]), rad: r >= 0 ? num(x[r]) : null, day: y >= 0 ? num(x[y]) : null }))
    .filter(p => p.au != null).map(p => ({ ...p, rad: p.rad ?? 5000, day: p.day ?? 24 }));
  if (!rows.length) { chips.innerHTML = '<div class="empty">No planets with a distance yet.</div>'; return; }
  chips.innerHTML = rows.map((p, i) => `<button type="button" data-i="${i}" aria-pressed="false">${esc(p.name)}</button>`).join("");
  chips.querySelectorAll("button").forEach(b => b.onclick = () => select(+b.dataset.i === sel ? -1 : +b.dataset.i));
  if (!renderer) setup();
  build(rows); if (sel >= rows.length) sel = -1; select(sel);
}
amber.onChange(onNote);
</script>
</body>
</html>
