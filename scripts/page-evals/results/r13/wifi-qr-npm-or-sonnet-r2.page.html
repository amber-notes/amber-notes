<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-libs" content="npm:qrcode-generator@1.4.4/qrcode.js#sha256-GK45n4EYK8nekW6cd7GV3yDMWNby1VpisIWimfG/F4A=">
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 40px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  h1 { font-family: var(--amber-font-rounded); font-size: 1.6rem; letter-spacing: -.02em; margin: 4px 0 4px; }
  .hint { color: var(--amber-text-secondary); font-size: 1rem; margin: 0 0 18px; }
  .qr { background: #fff; padding: 16px; border-radius: 20px; border: 1px solid var(--amber-separator); width: min(100%, 70vh, 520px); aspect-ratio: 1; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .info { display: grid; gap: 10px; margin-top: 20px; width: min(100%, 520px); text-align: left; }
  .item { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 12px 16px; }
  .item small { display: block; color: var(--amber-text-secondary); font-size: .8rem; }
  .item b { font-family: var(--amber-font-mono); font-size: 1.15rem; overflow-wrap: anywhere; font-weight: 600; }
  .empty { padding: 28px 16px; color: var(--amber-text-secondary); }
  @media (prefers-color-scheme: dark) { .qr { background: #fff; } }
  @media (min-width: 900px) {
    main { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 0 48px; text-align: left; }
    .head { width: 100%; text-align: center; }
    .info { margin-top: 0; align-self: center; width: 380px; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const wesc = (s) => s.replace(/([\\;,:"])/g, "\\$1");
  function field(md, re) {
    for (const line of md.split("\n")) {
      const m = line.match(/^\s*[-*]?\s*([^:]+?)\s*:\s*(.*?)\s*$/);
      if (m && re.test(m[1])) return m[2];
    }
    return "";
  }
  function render(note) {
    const app = document.getElementById("app");
    const ssid = field(note.markdown, /^(network|ssid|name|wi-?fi)$/i);
    const pass = field(note.markdown, /^(password|pass|key)$/i);
    let sec = field(note.markdown, /^(security|type|encryption)$/i).toUpperCase();
    if (!ssid) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="empty">Add a line “Network: name” (and “Password: …”) to the note to see the QR code.</div>`; return; }
    let t = /WEP/.test(sec) ? "WEP" : (/NONE|OPEN/.test(sec) || !pass) ? "nopass" : "WPA";
    const payload = `WIFI:T:${t};S:${wesc(ssid)};` + (t === "nopass" ? "" : `P:${wesc(pass)};`) + ";";
    const q = qrcode(0, "M"); q.addData(payload); q.make();
    const n = q.getModuleCount(), m = 2;
    let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
    const svg = `<svg viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges" role="img" aria-label="QR code to join Wi-Fi network ${esc(ssid)}"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
    app.innerHTML = `
      <div class="head"><h1>${esc(note.title)}</h1><p class="hint">Point your phone camera at the code to join.</p></div>
      <div class="qr">${svg}</div>
      <div class="info">
        <div class="item"><small>Network</small><b>${esc(ssid)}</b></div>
        ${t === "nopass" ? "" : `<div class="item"><small>Password</small><b>${esc(pass)}</b></div>`}
      </div>`;
  }
  amber.onChange(render);
</script>
</body>
</html>
