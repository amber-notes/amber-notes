<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-libs" content="three">
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 12px var(--amber-gutter) 24px; }
  .stage { position: relative; background: #05070f; border-radius: var(--amber-radius); overflow: hidden; height: min(72vh, 640px); min-height: 340px; color: #f2f4fa; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  h1 { position: absolute; left: 16px; top: 12px; margin: 0; font-size: 1.4rem; letter-spacing: -.02em; pointer-events: none; }
  .hint { position: absolute; left: 16px; bottom: 10px; font-size: .8rem; color: #b9c0d4; pointer-events: none; }
  .lbl { position: absolute; left: 0; top: 0; font-size: .75rem; color: #f2f4fa; pointer-events: none; white-space: nowrap; transform: translate(-50%, 0); text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .lbl.on { color: #ffd479; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .chips button { font: inherit; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--amber-separator); background: var(--amber-surface); color: var(--amber-text); display: inline-flex; align-items: center; gap: 8px; }
  .chips button[aria-pressed="true"] { background: var(--amber-accent); color: var(--amber-on-accent); border-color: var(--amber-accent); }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid var(--amber-separator); }
  .info { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 12px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px 16px; }
  .info b { display: block; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .info span { font-size: .8rem; color: var(--amber-text-secondary); }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
  @media (prefers-color-scheme: dark) { .stage { background: #05070f; color: #f2f4fa; } .hint { color: #b9c0d4; } }
</style>
</head>
<body>
<main>
  <div class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="3D solar system. Drag to rotate, pinch or scroll to zoom."></canvas>
    <h1 id="title"></h1>
    <div id="labels"></div>
    <div class="hint">Drag to spin · pinch to zoom · distances and sizes are squashed</div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="info" id="info"></div>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const num = s => { const v = parseFloat(String(s).replace(/\s/g, "").replace(",", ".")); return isNaN(v) ? null : v; };
const COLORS = { mercury: 0xa8a29a, venus: 0xe3b66f, earth: 0x3f8cff, mars: 0xd2542f, jupiter: 0xd9a77a, saturn: 0xe8d29a, uranus: 0x8fe0e6, neptune: 0x3f5fe0, pluto: 0xc9b7a5 };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv = document.getElementById("cv"), stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070f);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const sunLight = new THREE.PointLight(0xffffff, 3, 0, 0); scene.add(sunLight);
let world = new THREE.Group(); scene.add(world);
let bodies = [], selected = -1, camDist = 24, theta = 0.6, phi = 1.1, fitDist = 24, chipsKey = "";

// stars
{ const g = new THREE.BufferGeometry(), a = [];
  for (let i = 0; i < 700; i++) { const v = new THREE.Vector3().randomDirection().multiplyScalar(150 + Math.random() * 40); a.push(v.x, v.y, v.z); }
  g.setAttribute("position", new THREE.Float32BufferAttribute(a, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, sizeAttenuation: false }))); }

function build(note) {
  const t = note.tables.find(t => t.columns.some(c => /planet|name/i.test(c.name)) && t.columns.some(c => /dist|au/i.test(c.name)));
  scene.remove(world); world.traverse(o => { o.geometry && o.geometry.dispose(); o.material && o.material.dispose(); });
  world = new THREE.Group(); scene.add(world); bodies = []; document.getElementById("labels").innerHTML = "";
  const info = document.getElementById("info");
  if (!t) { info.innerHTML = '<div class="empty">Add a table with Planet, Distance (AU), Radius (km) columns.</div>'; document.getElementById("chips").innerHTML = ""; return; }
  const ci = re => t.columns.findIndex(c => re.test(c.name));
  const iN = ci(/planet|name/i), iD = ci(/dist|au/i), iR = ci(/radius/i), iDay = ci(/day/i);
  const rows = t.rows.map(r => ({ name: r[iN], au: num(r[iD]), km: iR >= 0 ? num(r[iR]) : null, day: iDay >= 0 ? num(r[iDay]) : null })).filter(p => p.name && p.au != null);
  const maxAU = Math.max(1, ...rows.map(p => p.au)), maxR = Math.max(1, ...rows.map(p => p.km || 0));
  const sun = new THREE.Mesh(new THREE.SphereGeometry(1.1, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffb347 }));
  world.add(sun);
  let far = 3;
  rows.forEach((p, i) => {
    const orbit = 2.6 + 10 * Math.sqrt(p.au / maxAU);
    const size = 0.17 + 0.8 * Math.sqrt((p.km || 3000) / maxR);
    far = Math.max(far, orbit);
    const hue = COLORS[p.name.toLowerCase()] ?? new THREE.Color().setHSL((i * 0.17) % 1, 0.5, 0.6).getHex();
    const pivot = new THREE.Group(); pivot.rotation.y = i * 1.7; world.add(pivot);
    const m = new THREE.Mesh(new THREE.SphereGeometry(size, 32, 24), new THREE.MeshStandardMaterial({ color: hue, roughness: 0.9 }));
    m.position.x = orbit; m.rotation.z = 0.2; pivot.add(m);
    if (/saturn/i.test(p.name)) {
      const ring = new THREE.Mesh(new THREE.RingGeometry(size * 1.3, size * 2.2, 64), new THREE.MeshBasicMaterial({ color: 0xcdb98a, side: THREE.DoubleSide }));
      ring.rotation.x = Math.PI / 2 - 0.3; m.add(ring);
    }
    const line = new THREE.LineLoop(new THREE.RingGeometry(orbit - 0.008, orbit + 0.008, 128).setAttribute ? new THREE.BufferGeometry().setFromPoints(Array.from({ length: 129 }, (_, k) => new THREE.Vector3(Math.cos(k / 128 * 6.2832) * orbit, 0, Math.sin(k / 128 * 6.2832) * orbit))) : null, new THREE.LineBasicMaterial({ color: 0x3a4260 }));
    world.add(line);
    const el = document.createElement("div"); el.className = "lbl"; el.textContent = p.name; document.getElementById("labels").appendChild(el);
    bodies.push({ p, m, pivot, el, orbit, size, hue, speed: 0.5 / Math.pow(orbit, 1.2), spin: p.day ? 2 / Math.sqrt(Math.max(p.day, 5)) : 0.5 });
  });
  fitDist = far * 2.3 + 4; if (!chipsKey || chipsKey !== rows.map(r => r.name).join()) camDist = fitDist;
  if (selected >= bodies.length) selected = -1;
  const key = rows.map(r => r.name).join(); chipsKey = key;
  document.getElementById("chips").innerHTML = bodies.map((b, i) => `<button data-i="${i}" aria-pressed="false"><span class="dot" style="background:#${b.hue.toString(16).padStart(6, "0")}"></span>${esc(b.p.name)}</button>`).join("");
  document.querySelectorAll(".chips button").forEach(btn => btn.onclick = () => { selected = selected === +btn.dataset.i ? -1 : +btn.dataset.i; showInfo(); });
  showInfo();
}
const fmt = v => v == null ? "–" : v.toLocaleString("en-US");
function showInfo() {
  document.querySelectorAll(".chips button").forEach((b, i) => b.setAttribute("aria-pressed", i === selected));
  bodies.forEach((b, i) => b.el.classList.toggle("on", i === selected));
  const info = document.getElementById("info");
  if (selected < 0) { info.innerHTML = `<div><b>${bodies.length}</b><span>planets</span></div><div><span>Tap a planet below for its numbers. Orbit spacing and sizes use a square-root scale so everything fits.</span></div>`; return; }
  const p = bodies[selected].p;
  info.innerHTML = `<div><b>${esc(p.name)}</b><span>planet</span></div><div><b>${fmt(p.au)}</b><span>AU from the Sun</span></div><div><b>${fmt(p.km)}</b><span>radius (km)</span></div><div><b>${fmt(p.day)}</b><span>day (hours)</span></div>`;
}

// controls
const ptrs = new Map(); let lastPinch = 0, interacted = false;
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); interacted = true; cv.style.cursor = "grabbing"; });
cv.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) { theta -= (e.clientX - prev[0]) * 0.008; phi = Math.min(2.9, Math.max(0.2, phi - (e.clientY - prev[1]) * 0.008)); }
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (lastPinch) camDist = clampD(camDist * lastPinch / d); lastPinch = d; }
});
const up = e => { ptrs.delete(e.pointerId); lastPinch = 0; cv.style.cursor = "grab"; };
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
cv.addEventListener("wheel", e => { e.preventDefault(); camDist = clampD(camDist * (1 + e.deltaY * 0.001)); }, { passive: false });
const clampD = d => Math.min(fitDist * 1.6, Math.max(5, d));

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

let last = 0; const v = new THREE.Vector3();
function frame(ts) {
  requestAnimationFrame(frame);
  if (document.visibilityState !== "visible") { last = 0; return; }
  const dt = last ? Math.min((ts - last) / 1000, 0.1) : 0; last = ts;
  if (!reduce) { bodies.forEach(b => { b.pivot.rotation.y += b.speed * dt; b.m.rotation.y += b.spin * dt; }); if (!interacted) theta += dt * 0.05; }
  const portrait = camera.aspect < 1, d = portrait ? camDist * 1.35 : camDist;
  camera.position.set(d * Math.sin(phi) * Math.sin(theta), d * Math.cos(phi), d * Math.sin(phi) * Math.cos(theta));
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  const w = stage.clientWidth, h = stage.clientHeight;
  bodies.forEach(b => { b.m.getWorldPosition(v); v.project(camera); const vis = v.z < 1; b.el.style.display = vis ? "" : "none";
    b.el.style.transform = `translate(${(v.x * 0.5 + 0.5) * w}px, ${(-v.y * 0.5 + 0.5) * h + b.size * 14 + 6}px) translate(-50%,0)`; });
}
amber.onChange(note => { document.getElementById("title").textContent = note.title; build(note); });
requestAnimationFrame(frame);
</script>
</body>
</html>
