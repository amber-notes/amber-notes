<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-settings" content='{"settings":[{"key":"monthlyLimit","label":"Monthly limit","type":"number","default":12000,"help":"Spending limit for one month, in kr"},{"key":"currency","label":"Currency","type":"currency","default":"SEK"}]}'>
<style>
*{box-sizing:border-box}body{margin:0;padding:calc(18px + env(safe-area-inset-top)) var(--amber-gutter) calc(80px + env(safe-area-inset-bottom));font-family:var(--amber-font);color:var(--amber-text)}.wrap{max-width:var(--amber-content-max);margin:0 auto}.hero{position:relative;overflow:hidden;border-radius:calc(var(--amber-radius) + 10px);padding:1.25rem;background:linear-gradient(135deg,var(--amber-accent-soft),var(--amber-surface));border:1px solid var(--amber-separator)}.hero:after{content:"kr";position:absolute;right:1rem;top:.2rem;font:800 5rem/1 var(--amber-font-rounded);color:var(--amber-accent);opacity:.13}h1{font-size:clamp(1.55rem,4.5vw,2.4rem);line-height:1.05;letter-spacing:-.035em;margin:0 0 1rem}.top{display:grid;gap:.9rem;position:relative;z-index:1}.total{font-size:clamp(2.3rem,10vw,4.7rem);line-height:.95;font-weight:800;letter-spacing:-.055em;font-variant-numeric:tabular-nums}.status{font-size:1.02rem;color:var(--amber-text);margin-top:.4rem}.status.over{color:var(--amber-danger);font-weight:700}.pill{display:inline-flex;align-items:center;gap:.45rem;width:max-content;min-height:2.4rem;padding:.45rem .75rem;border-radius:999px;background:var(--amber-surface);border:1px solid var(--amber-separator);font-weight:650}.bar{height:.9rem;background:var(--amber-fill);border:1px solid var(--amber-separator);border-radius:999px;overflow:hidden;margin-top:.95rem}.fill{height:100%;border-radius:999px;background:var(--amber-accent);transition:width .2s}.fill.over{background:var(--amber-danger)}.tabs{display:flex;gap:.5rem;margin:1rem 0;overflow-x:auto}.tabs button{flex:1;min-width:max-content;background:var(--amber-fill);color:var(--amber-text);border:1px solid var(--amber-separator)}.tabs button.active{background:var(--amber-accent-soft);color:var(--amber-text);border-color:var(--amber-accent);box-shadow:inset 0 -3px 0 var(--amber-accent)}h2{font-size:1.05rem;letter-spacing:-.01em;color:var(--amber-text);margin:1rem .25rem .55rem}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.row{display:flex;align-items:center;gap:.7rem;min-height:3.1rem;padding:.72rem .9rem;border-top:1px solid var(--amber-separator)}.row:first-child{border-top:0}.grow{flex:1;min-width:0;overflow-wrap:anywhere}.muted{color:var(--amber-text-secondary);font-size:.88rem}.num{font-variant-numeric:tabular-nums;font-weight:750;white-space:nowrap}.dot{width:.7rem;height:.7rem;border-radius:999px;flex:none}.empty{padding:1.5rem 1rem;text-align:center;color:var(--amber-text-secondary)}form{display:grid;grid-template-columns:1fr;gap:.65rem;padding:.9rem}label{display:flex;flex-direction:column;gap:.32rem;font-size:.86rem;color:var(--amber-text);font-weight:600}input,select{font:inherit;font-size:1rem;min-height:44px;width:100%;color:var(--amber-text);background:var(--amber-field);border:1px solid var(--amber-field-border);border-radius:var(--amber-radius-small);padding:.65rem .75rem}button{font:inherit;font-weight:750;min-height:44px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-text);color:var(--amber-bg);padding:.65rem .9rem}.err{min-height:1.2rem;color:var(--amber-danger);padding:0 .9rem .85rem}.monthPick{width:auto;min-width:9rem}.catbar{display:flex;height:.6rem;border-radius:999px;overflow:hidden;background:var(--amber-fill);margin:.6rem .9rem .2rem}.hint{margin:.8rem .25rem 0;color:var(--amber-text-secondary);font-size:.92rem}@media(min-width:720px){.top{grid-template-columns:1fr auto;align-items:end}.panel{max-width:760px}.panel.log{max-width:520px}form{grid-template-columns:1fr 10rem}button.submit{grid-column:1/-1}}@media(min-width:1100px){.hero{padding:1.6rem 1.8rem}.panel{max-width:820px}}.amber-widget body{padding:12px}.amber-widget .tabs,.amber-widget .panel{display:none}.amber-widget .hero{padding:1rem}.amber-widget .total{font-size:2rem}
</style>
</head>
<body>
<div class="wrap"><main id="app" aria-live="polite"></main></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toNum=s=>{const n=parseFloat(String(s??"").replace(/[\s ]/g,"").replace(/kr|sek|\$|€|£/gi,"").replace(",","."));return Number.isFinite(n)?n:0};
const findCol=(t,re)=>t.columns.findIndex(c=>re.test(c.name));
let chosenMonth="",error="",draft={item:"",amt:"",cat:""},tab="log";
function swatch(i){return ["var(--amber-accent)","#2f7d5b","#3c63b0","#9c5a2e","#a3478a","var(--amber-text-secondary)"][Math.min(i,5)]}
function render(note){
 const app=document.getElementById("app");
 const t=note.tables.find(tb=>findCol(tb,/^amt$|amount|cost|price|^kr$|sum|belopp/i)>=0);
 if(!t){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Date, Item, Category and Amt columns to use the expenses app.</div>`;return}
 const amount=findCol(t,/^amt$|amount|cost|price|^kr$|sum|belopp/i),date=findCol(t,/^date$|^day$|datum/i),cat=findCol(t,/categ|kategori|type/i),item=findCol(t,/item|what|desc|name|vad/i);
 const set=amber.settings||{},limit=Number(set.monthlyLimit)||0;
 const fmt=(()=>{try{return new Intl.NumberFormat("sv-SE",{style:"currency",currency:set.currency||"SEK",maximumFractionDigits:0})}catch{return new Intl.NumberFormat("sv-SE",{maximumFractionDigits:0})}})();
 const money=n=>fmt.format(n);
 const months=[...new Set(t.rows.map(r=>date>=0?String(r[date]).slice(0,7):"").filter(m=>/^\d{4}-\d{2}$/.test(m)))].sort();
 if(!chosenMonth||!months.includes(chosenMonth)) chosenMonth=months.includes(note.today.slice(0,7))?note.today.slice(0,7):(months[months.length-1]||note.today.slice(0,7));
 const rows=t.rows.map((r,i)=>({r,i,n:toNum(r[amount])})).filter(x=>date<0||String(x.r[date]).startsWith(chosenMonth));
 const total=rows.reduce((s,x)=>s+x.n,0),pct=limit?Math.min(100,Math.round(total/limit*100)):0;
 const byCat=new Map(); rows.forEach(x=>{const k=(cat>=0&&x.r[cat])||"Other";byCat.set(k,(byCat.get(k)||0)+x.n)});
 const cats=[...byCat.entries()].sort((a,b)=>b[1]-a[1]);
 const allCats=[...new Set(t.rows.map(r=>cat>=0?r[cat]:"").filter(Boolean))];
 const hero=`<section class="hero"><h1>${esc(note.title)}</h1><div class="top"><div><div class="total">${money(total)}</div><div class="status ${limit&&total>limit?"over":""}">${limit?(total>limit?`${money(total-limit)} over the ${money(limit)} monthly limit`:`${money(limit-total)} left of the ${money(limit)} monthly limit`):`${rows.length} expenses this month`}</div></div><label>Month<select id="month" class="monthPick">${months.length?months.map(m=>`<option ${m===chosenMonth?"selected":""}>${m}</option>`).join(""):`<option>${esc(chosenMonth)}</option>`}</select></label></div><div class="bar" aria-label="${esc(String(pct))}% of monthly limit used"><div class="fill ${limit&&total>limit?"over":""}" style="width:${limit?pct:0}%"></div></div><div class="pill">Monthly limit: ${limit?money(limit):"not set"}</div></section>`;
 const tabs=`<nav class="tabs" aria-label="Expenses views"><button data-tab="overview" class="${tab==="overview"?"active":""}">Overview</button><button data-tab="log" class="${tab==="log"?"active":""}">Add expense</button><button data-tab="history" class="${tab==="history"?"active":""}">History</button></nav>`;
 const overview=`<section class="panel"><h2>By category</h2><div class="card">${cats.length?`<div class="catbar">${cats.map(([k,v],i)=>`<span title="${esc(k)}" style="width:${(v/Math.max(total,1))*100}%;background:${swatch(i)}"></span>`).join("")}</div>${cats.map(([k,v],i)=>`<div class="row"><span class="dot" style="background:${swatch(i)}"></span><span class="grow">${esc(k)}<br><span class="muted">${Math.round(v/Math.max(total,1)*100)}% of spending</span></span><span class="num">${money(v)}</span></div>`).join("")}`:`<div class="empty">No expenses for this month.</div>`}</div><p class="hint">Change the monthly limit in this note's App Settings.</p></section>`;
 const log=`<section class="panel log"><h2>Add expense</h2><div class="card"><form id="add">${item>=0?`<label>What<input name="item" autocomplete="off" required value="${esc(draft.item)}"></label>`:""}<label>Amount<input name="amt" inputmode="decimal" required value="${esc(draft.amt)}"></label>${cat>=0?`<label>Category<input name="cat" list="catlist" value="${esc(draft.cat)}"><datalist id="catlist">${allCats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label>`:""}<button class="submit">Add expense</button></form><div class="err" role="alert">${esc(error)}</div></div><h2>Latest</h2><div class="card">${rows.slice().reverse().slice(0,3).map(x=>`<div class="row"><span class="grow">${esc(item>=0?x.r[item]:"Expense")}<br><span class="muted">${esc(date>=0?x.r[date]:"")}${cat>=0&&x.r[cat]?" · "+esc(x.r[cat]):""}</span></span><span class="num">${money(x.n)}</span></div>`).join("")||`<div class="empty">Nothing logged yet.</div>`}</div></section>`;
 const history=`<section class="panel"><h2>Latest in ${esc(chosenMonth)}</h2><div class="card">${rows.slice().reverse().slice(0,14).map(x=>`<div class="row"><span class="grow">${esc(item>=0?x.r[item]:"Expense")}<br><span class="muted">${esc(date>=0?x.r[date]:"")}${cat>=0&&x.r[cat]?" · "+esc(x.r[cat]):""}</span></span><span class="num">${money(x.n)}</span></div>`).join("")||`<div class="empty">Nothing logged yet.</div>`}</div></section>`;
 app.innerHTML=hero+tabs+(tab==="log"?log:tab==="history"?history:overview);
 const month=document.getElementById("month"); month.onchange=()=>{chosenMonth=month.value;render(amber.note)};
 document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render(amber.note)});
 const form=document.getElementById("add"); if(form)form.onsubmit=async e=>{e.preventDefault();const fd=new FormData(form);draft={item:String(fd.get("item")??""),amt:String(fd.get("amt")??""),cat:String(fd.get("cat")??"")};if(!toNum(draft.amt)){error="Write the amount as a number.";render(amber.note);return}const values={[t.columns[amount].name]:draft.amt.trim()};if(date>=0)values[t.columns[date].name]=amber.note.today;if(item>=0)values[t.columns[item].name]=draft.item.trim();if(cat>=0)values[t.columns[cat].name]=draft.cat.trim();const res=await amber.update({op:"append_row",table:t.index,values});if(res.ok){error="";draft={item:"",amt:"",cat:""};tab="history"}else{error=res.error||"Could not add the expense.";render(amber.note)}};
}
amber.onChange(render);
</script>
</body>
</html>
