<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-libs" content="npm:qrcode-generator@1.4.4/qrcode.js#sha256-GK45n4EYK8nekW6cd7GV3yDMWNby1VpisIWimfG/F4A=">
<style>
  * { box-sizing: border-box; }
  main { max-width: 760px; margin: 0 auto; padding: 20px var(--amber-gutter) 48px; text-align: center; }
  h1 { font-family: var(--amber-font-rounded); font-size: 1.9rem; letter-spacing: -.02em; margin: 4px 0 4px; }
  .sub { color: var(--amber-text-secondary); font-size: 1rem; margin: 0 0 20px; }
  .qr { background: #fff; padding: 18px; border-radius: 24px; width: min(100%, 520px); margin: 0 auto 20px; border: 1px solid var(--amber-separator); }
  .qr svg { display: block; width: 100%; height: auto; }
  .info { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); max-width: 520px; margin: 0 auto; text-align: left; }
  .row { display: flex; justify-content: space-between; gap: 16px; padding: 14px 16px; border-top: 1px solid var(--amber-separator); align-items: baseline; }
  .row:first-child { border-top: 0; }
  .k { color: var(--amber-text-secondary); font-size: .9rem; }
  .v { font-family: var(--amber-font-mono); font-size: 1.1rem; font-weight: 600; overflow-wrap: anywhere; text-align: right; }
  .empty { padding: 28px 16px; color: var(--amber-text-secondary); }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const q = (s) => String(s).replace(/([\\;,:"])/g, "\\$1");
  function field(md, re) {
    const m = md.match(new RegExp("^\\s*(?:" + re + ")\\s*:\\s*(.*?)\\s*$", "im"));
    return m ? m[1] : "";
  }
  function render(note) {
    const app = document.getElementById("app");
    const md = note.markdown || "";
    const ssid = field(md, "network|ssid|wifi|name");
    const pass = field(md, "password|pass|passphrase");
    let sec = field(md, "security|encryption|type").toUpperCase();
    let T = /WEP/.test(sec) ? "WEP" : /NONE|OPEN/.test(sec) || (!pass && !sec) ? "nopass" : "WPA";
    if (!ssid) {
      app.innerHTML = `<h1>${esc(note.title)}</h1><div class="empty">Add a line “Network: name” (and “Password: …”) to the note to see the QR code.</div>`;
      return;
    }
    const payload = `WIFI:T:${T};S:${q(ssid)};` + (T === "nopass" ? "" : `P:${q(pass)};`) + ";";
    let svg = "";
    try {
      const qr = qrcode(0, "M");
      qr.addData(payload);
      qr.make();
      const n = qr.getModuleCount(), b = 4, size = n + b * 2;
      let d = "";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + b},${r + b}h1v1h-1z`;
      svg = `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="QR code to join the Wi-Fi network ${esc(ssid)}" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
    } catch (e) {
      svg = `<div class="empty" style="color:#000">Could not make a QR code from this text.</div>`;
    }
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <p class="sub">Point your phone camera at the code to join</p>
      <div class="qr">${svg}</div>
      <div class="info">
        <div class="row"><span class="k">Network</span><span class="v">${esc(ssid)}</span></div>
        ${T === "nopass" ? "" : `<div class="row"><span class="k">Password</span><span class="v">${esc(pass)}</span></div>`}
      </div>`;
  }
  amber.onChange(render);
</script>
</body>
</html>
