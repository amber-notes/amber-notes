<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { --c-ink:#12343b; --c-int:#c2410c; --c-prin:#0f766e; --c-panel:#12343b; --c-panel-text:#f4fbfa; --c-panel-sub:#a9cfcb; --c-track:#d9e4e2; }
  @media (prefers-color-scheme: dark) { :root { --c-int:#fb923c; --c-prin:#2dd4bf; --c-panel:#0b2428; --c-panel-text:#f4fbfa; --c-panel-sub:#9cc7c2; --c-track:#2c4a4e; } }
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 40px; display: grid; gap: 16px; }
  @media (min-width: 900px) { main { grid-template-columns: 5fr 6fr; align-items: start; } header { grid-column: 1 / -1; } }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -.02em; font-family: var(--amber-font-rounded); }
  .sub { color: var(--amber-text-secondary); font-size: .875rem; margin-top: 2px; }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 16px; }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .lab { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .875rem; color: var(--amber-text-secondary); margin-bottom: 6px; }
  .lab label { font-weight: 600; color: var(--amber-text); }
  .inp { display: flex; align-items: center; gap: 6px; }
  .inp input[type=text] { width: 9.5rem; text-align: right; font: inherit; font-weight: 700; font-variant-numeric: tabular-nums; min-height: 44px; padding: 6px 10px; border-radius: var(--amber-radius-small); }
  .unit { color: var(--amber-text-secondary); font-size: .875rem; min-width: 2rem; }
  input[type=range] { width: 100%; min-height: 44px; accent-color: var(--c-prin); background: transparent; border: 0; padding: 0; margin: 0; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--amber-fill); padding: 4px; border-radius: var(--amber-radius-small); }
  .seg button { font: inherit; font-weight: 600; min-height: 44px; border: 0; border-radius: calc(var(--amber-radius-small) - 2px); background: transparent; color: var(--amber-text); }
  .seg button[aria-pressed=true] { background: var(--c-panel); color: var(--c-panel-text); }
  .hint { font-size: .8125rem; color: var(--amber-text-secondary); margin-top: 6px; }
  .result { background: var(--c-panel); color: var(--c-panel-text); border-radius: var(--amber-radius); padding: 20px 18px; }
  .result .k { font-size: .8125rem; text-transform: uppercase; letter-spacing: .08em; color: var(--c-panel-sub); }
  .big { font-family: var(--amber-font-rounded); font-size: clamp(2.2rem, 9vw, 3.4rem); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 4px 0 2px; overflow-wrap: anywhere; }
  .big small { font-size: .45em; font-weight: 600; color: var(--c-panel-sub); }
  .note2 { color: var(--c-panel-sub); font-size: .875rem; min-height: 1.3em; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.18); }
  .stats .v { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .stats .v.int { color: #fdba74; }
  .bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin-top: 16px; background: var(--c-track); }
  .bar i { display: block; height: 100%; transition: width .25s; }
  .bar .p { background: var(--c-prin); } .bar .i { background: var(--c-int); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: .8125rem; color: var(--c-panel-sub); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  h2 { font-size: 1rem; margin: 0 0 4px; }
  svg { width: 100%; height: 150px; display: block; }
  .axis { display: flex; justify-content: space-between; font-size: .75rem; color: var(--amber-text-secondary); }
  table { width: 100%; border-collapse: collapse; font-size: .875rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px 4px; border-top: 1px solid var(--amber-separator); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--amber-text-secondary); font-weight: 600; border-top: 0; font-size: .75rem; }
  .side { display: grid; gap: 16px; }
  .tablewrap { max-height: 320px; overflow-y: auto; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<main>
  <header><h1 id="title"></h1><div class="sub" id="sub"></div></header>

  <section class="card" aria-label="Loan inputs">
    <div class="field">
      <div class="lab"><label for="loanN">Loan</label><span class="inp"><input id="loanN" type="text" inputmode="numeric" autocomplete="off"><span class="unit">kr</span></span></div>
      <input id="loanR" type="range" min="100000" max="10000000" step="50000" aria-label="Loan slider">
    </div>
    <div class="field">
      <div class="lab"><label for="rateN">Interest rate</label><span class="inp"><input id="rateN" type="text" inputmode="decimal" autocomplete="off"><span class="unit">%</span></span></div>
      <input id="rateR" type="range" min="0" max="12" step="0.05" aria-label="Rate slider">
    </div>
    <div class="field">
      <div class="lab"><label for="yearsN">Term</label><span class="inp"><input id="yearsN" type="text" inputmode="numeric" autocomplete="off"><span class="unit">years</span></span></div>
      <input id="yearsR" type="range" min="1" max="50" step="1" aria-label="Years slider">
    </div>
    <div class="field">
      <div class="lab"><span style="font-weight:600;color:var(--amber-text)">Amortization</span></div>
      <div class="seg" role="group" aria-label="Amortization type">
        <button type="button" id="mStraight" aria-pressed="false">Straight</button>
        <button type="button" id="mAnnuity" aria-pressed="false">Annuity</button>
      </div>
      <div class="hint" id="modeHint"></div>
    </div>
  </section>

  <div class="side">
    <section class="result" aria-live="polite">
      <div class="k" id="payK">Monthly payment</div>
      <div class="big" id="pay"></div>
      <div class="note2" id="payNote"></div>
      <div class="bar" role="img" id="bar" aria-label="Share of principal and interest"><i class="p" id="bp"></i><i class="i" id="bi"></i></div>
      <div class="legend"><span><span class="dot" style="background:var(--c-prin)"></span>Principal <b id="lp"></b></span><span><span class="dot" style="background:var(--c-int)"></span>Interest <b id="li"></b></span></div>
      <div class="stats">
        <div><div class="k">Total interest</div><div class="v int" id="tint"></div></div>
        <div><div class="k">Total paid</div><div class="v" id="ttot"></div></div>
      </div>
    </section>

    <section class="card">
      <div class="seg" role="group" aria-label="Detail view" style="margin-bottom:12px"><button type="button" id="tChart" aria-pressed="true">Balance</button><button type="button" id="tYears" aria-pressed="false">Year by year</button></div>
      <div id="vChart">
      <svg id="chart" viewBox="0 0 300 100" preserveAspectRatio="none" role="img" aria-label="Remaining loan balance over the term"></svg>
      <div class="axis"><span>Today</span><span id="axMid"></span><span id="axEnd"></span></div>
      </div>
      <div id="vYears" hidden>
      <div class="tablewrap"><table><thead><tr><th>Year</th><th>Interest</th><th>Principal</th><th>Balance</th></tr></thead><tbody id="rows"></tbody></table></div>
      </div>
    </section>
  </div>
</main>
<script>
  const fmt = (n) => Math.round(n).toLocaleString("sv-SE").replace(/\u2212/g, "-");
  const kr = (n) => fmt(n) + " kr";
  const num = (s) => { const v = parseFloat(String(s).replace(/[\s\u00a0]/g, "").replace(",", ".")); return isNaN(v) ? NaN : v; };
  const $ = (id) => document.getElementById(id);
  const S = { loan: 3200000, rate: 4.1, years: 25, mode: "straight" };
  let started = false;

  function parseNote(md) {
    const o = {};
    let m;
    if ((m = md.match(/loan:\s*([\d\s\u00a0.,]+)/i))) { const v = num(m[1]); if (v > 0) o.loan = v; }
    if ((m = md.match(/rate:\s*([\d.,]+)/i))) { const v = num(m[1]); if (v >= 0) o.rate = v; }
    if ((m = md.match(/years?:\s*([\d.,]+)/i))) { const v = num(m[1]); if (v > 0) o.years = v; }
    if ((m = md.match(/amortization:\s*(\w+)/i))) o.mode = /annu/i.test(m[1]) ? "annuity" : "straight";
    return o;
  }

  function calc() {
    const P = S.loan, n = Math.max(1, Math.round(S.years * 12)), r = S.rate / 100 / 12;
    const sched = []; let bal = P, tInt = 0, first = 0, last = 0;
    const pm = r === 0 ? P / n : P * r / (1 - Math.pow(1 + r, -n));
    for (let k = 1; k <= n; k++) {
      const interest = bal * r;
      const prin = S.mode === "straight" ? P / n : pm - interest;
      const pay = prin + interest;
      bal = Math.max(0, bal - prin); tInt += interest;
      if (k === 1) first = pay; if (k === n) last = pay;
      sched.push({ k, interest, prin, bal });
    }
    return { n, sched, tInt, first, last, total: P + tInt };
  }

  function update(skipInputs) {
    const c = calc();
    if (!skipInputs) {
      $("loanN").value = fmt(S.loan); $("loanR").value = S.loan;
      $("rateN").value = String(S.rate).replace(".", ","); $("rateR").value = S.rate;
      $("yearsN").value = S.years; $("yearsR").value = S.years;
    }
    $("mStraight").setAttribute("aria-pressed", S.mode === "straight");
    $("mAnnuity").setAttribute("aria-pressed", S.mode === "annuity");
    $("modeHint").textContent = S.mode === "straight" ? "Same amount repaid every month, so payments shrink as interest falls." : "Same payment every month; more interest early, more principal later.";
    $("pay").innerHTML = fmt(c.first) + " <small>kr / month</small>";
    $("payK").textContent = S.mode === "straight" ? "First monthly payment" : "Monthly payment";
    $("payNote").textContent = S.mode === "straight" ? "Falls to " + kr(c.last) + " in the last month" : "Fixed for all " + c.n + " months";
    const pi = c.total ? c.tInt / c.total * 100 : 0;
    $("bp").style.width = (100 - pi) + "%"; $("bi").style.width = pi + "%";
    $("lp").textContent = kr(S.loan); $("li").textContent = Math.round(pi) + " %";
    $("tint").textContent = kr(c.tInt); $("ttot").textContent = kr(c.total);
    // chart
    const pts = [[0, S.loan]]; const step = Math.max(1, Math.floor(c.n / 120));
    c.sched.forEach((s) => { if (s.k % step === 0 || s.k === c.n) pts.push([s.k, s.bal]); });
    const path = pts.map((p, i) => (i ? "L" : "M") + (p[0] / c.n * 300).toFixed(1) + " " + (96 - p[1] / S.loan * 90).toFixed(1)).join(" ");
    $("chart").innerHTML = '<path d="' + path + ' L300 100 L0 100 Z" fill="var(--c-prin)" opacity=".18"/><path d="' + path + '" fill="none" stroke="var(--c-prin)" stroke-width="2" vector-effect="non-scaling-stroke"/>';
    $("axMid").textContent = "Year " + Math.round(S.years / 2); $("axEnd").textContent = "Year " + S.years;
    // yearly
    const yrs = Math.ceil(c.n / 12); let h = "";
    for (let y = 1; y <= yrs; y++) {
      const part = c.sched.slice((y - 1) * 12, y * 12);
      const i = part.reduce((a, s) => a + s.interest, 0), p = part.reduce((a, s) => a + s.prin, 0);
      h += "<tr><td>" + y + "</td><td>" + fmt(i) + "</td><td>" + fmt(p) + "</td><td>" + fmt(part[part.length - 1].bal) + "</td></tr>";
    }
    $("rows").innerHTML = h;
    amber.store.set("calc", S);
  }

  function bind(textId, rangeId, key, min, max, round) {
    const t = $(textId), r = $(rangeId);
    r.addEventListener("input", () => { S[key] = parseFloat(r.value); update(false); });
    t.addEventListener("input", () => {
      const v = num(t.value);
      if (isNaN(v)) return;
      S[key] = Math.min(max, Math.max(min, round ? Math.round(v) : v));
      r.value = S[key]; update(true);
    });
    t.addEventListener("blur", () => update(false));
  }
  bind("loanN", "loanR", "loan", 1000, 100000000, true);
  bind("rateN", "rateR", "rate", 0, 30, false);
  bind("yearsN", "yearsR", "years", 1, 60, true);
  function tab(y) { $("vChart").hidden = y; $("vYears").hidden = !y; $("tChart").setAttribute("aria-pressed", !y); $("tYears").setAttribute("aria-pressed", y); }
  $("tChart").onclick = () => tab(false); $("tYears").onclick = () => tab(true);
  $("mStraight").onclick = () => { S.mode = "straight"; update(true); };
  $("mAnnuity").onclick = () => { S.mode = "annuity"; update(true); };

  amber.onChange((note, data) => {
    $("title").textContent = note.title;
    $("sub").textContent = "Change any number, results update instantly. Starting values come from the note.";
    if (started) return;
    started = true;
    Object.assign(S, parseNote(note.markdown));
    const saved = (data && data.values && data.values.calc) || null;
    if (saved) Object.assign(S, saved);
    // widen sliders if values exceed range
    $("loanR").max = Math.max(10000000, S.loan); $("yearsR").max = Math.max(50, S.years);
    update(false);
  });
</script>
</body>
</html>
