<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;padding:calc(14px + env(safe-area-inset-top)) var(--amber-gutter) calc(92px + env(safe-area-inset-bottom));color:var(--amber-text);font-family:var(--amber-font)}.wrap{max-width:var(--amber-content-max);margin:0 auto}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 14px}h1{font-size:2rem;line-height:1.05;margin:0;letter-spacing:-.035em}h2{font-size:1.05rem;margin:0 0 10px}h3{font-size:.86rem;text-transform:uppercase;letter-spacing:.05em;color:var(--amber-text-secondary);margin:22px 0 8px}.date{color:var(--amber-text-secondary);font-weight:600}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 16px;position:sticky;top:0;background:var(--amber-bg);padding:8px 0;z-index:3}.tab{min-height:44px;border-radius:999px;border:1px solid var(--amber-field-border);background:var(--amber-field);color:var(--amber-text);font:inherit;font-weight:700}.tab.on{background:var(--amber-text);color:var(--amber-bg);border-color:var(--amber-text)}.grid{display:grid;gap:14px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.pad{padding:16px}.hero{background:linear-gradient(135deg,var(--amber-accent-soft),var(--amber-surface));border-color:var(--amber-accent-soft)}.big{font-size:2.35rem;line-height:1;font-weight:850;letter-spacing:-.045em}.muted{color:var(--amber-text-secondary)}.pill{display:inline-flex;align-items:center;gap:6px;background:var(--amber-accent-soft);color:var(--amber-accent-text);border-radius:999px;padding:5px 10px;font-weight:800;font-size:.85rem}.ex{padding:14px;border-top:1px solid var(--amber-separator)}.ex:first-child{border-top:0}.exhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.exname{font-weight:850;font-size:1.15rem}.rx{color:var(--amber-text-secondary);font-weight:700}.sets{display:grid;gap:8px}.set{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:center;min-height:52px}.check{width:44px;height:44px;accent-color:var(--amber-accent)}label{font-size:.84rem;color:var(--amber-text-secondary);font-weight:700}input,textarea{width:100%;min-height:44px;border-radius:var(--amber-radius-small);background:var(--amber-field);border:1px solid var(--amber-field-border);color:var(--amber-text);font:inherit;font-size:1rem;padding:10px 11px}textarea{min-height:84px;resize:vertical;line-height:1.35}.btns{display:flex;gap:10px;flex-wrap:wrap}.btn{min-height:44px;border-radius:var(--amber-radius-small);border:1px solid var(--amber-text);background:var(--amber-text);color:var(--amber-bg);font:inherit;font-weight:850;padding:10px 14px}.btn.secondary{background:var(--amber-field);color:var(--amber-text);border-color:var(--amber-field-border)}.btn.danger{background:var(--amber-danger);border-color:var(--amber-danger);color:var(--amber-on-accent)}.empty{text-align:center;color:var(--amber-text-secondary);padding:28px 18px}.err{color:var(--amber-danger);min-height:1.2em;margin-top:8px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--amber-separator)}.row:first-child{border-top:0}.num{font-variant-numeric:tabular-nums;font-weight:850}.bar{height:10px;border-radius:999px;background:var(--amber-fill);overflow:hidden}.bar i{display:block;height:100%;background:var(--amber-accent);border-radius:999px}.spark{width:100%;height:54px}.plans{display:grid;gap:12px}.planline{display:grid;gap:6px}.two{display:grid;gap:14px}.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--amber-fill);border:1px solid var(--amber-separator);border-radius:var(--amber-radius-small);padding:12px}.stat b{display:block;font-size:1.35rem}.hide{display:none!important}@media (min-width:700px){.two{grid-template-columns:1.25fr .75fr}.sets{grid-template-columns:repeat(2,1fr)}.mini{grid-template-columns:repeat(4,1fr)}}@media (min-width:1000px){.progress{grid-template-columns:repeat(2,1fr)}.plans{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], full=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const title=s=>String(s||'').trim().replace(/\b\w/g,m=>m.toUpperCase());
const num=s=>{const n=parseFloat(String(s??'').replace(',','.'));return Number.isFinite(n)?n:0};
const col=(t,n)=>t?t.columns.findIndex(c=>c.name.toLowerCase()===n.toLowerCase()):-1;
const todayName=iso=>days[new Date(iso+'T12:00:00Z').getUTCDay()];
function getPlanText(note){const m=note.markdown.match(/^##\s*Plan[^\n]*\n([\s\S]*?)(?=^##\s|\z)/m);return m?m[1].trim():''}
function parsePlan(note){const out={};getPlanText(note).split(/\n/).forEach(l=>{const m=l.match(/^\s*-\s*(Sun|Mon|Tue|Wed|Thu|Fri|Sat)\s*:\s*(.+)$/i);if(m)out[title(m[1]).slice(0,3)]=m[2].trim()});return out}
function parseExercises(text){return String(text||'').split(',').map(x=>x.trim()).filter(Boolean).map(part=>{const m=part.match(/^(.+?)\s+(\d+)\s*x\s*([\w]+)$/i);const name=title(m?m[1]:part);const sets=m?parseInt(m[2],10):3;const target=m?m[3]:'5';return {name,sets,target,rx:part}})}
function planToText(plan){return ['Mon','Wed','Fri','Tue','Thu','Sat','Sun'].filter(d=>plan[d]).map(d=>`- ${d}: ${plan[d]}`).join('\n')+'\n'}
function latestWeight(rows,ex){for(const r of rows){if(String(r.exercise).toLowerCase()===ex.toLowerCase()&&r.weight)return r.weight}return ''}
function rowsFromTable(t){if(!t)return[];const d=col(t,'Date'),e=col(t,'Exercise'),w=col(t,'Weight'),r=col(t,'Reps');return t.rows.map((row,i)=>({i,date:row[d]||'',exercise:row[e]||'',weight:row[w]||'',reps:row[r]||''})).sort((a,b)=>a.date<b.date?1:-1)}
function makeSession(note,data,plan,logs){const day=todayName(note.today);const chosen=plan[day]?day:Object.keys(plan)[0];let exercises=parseExercises(plan[chosen]);let label=chosen;if(!exercises.length){const seen=[...new Set(logs.map(r=>r.exercise).filter(Boolean))].slice(0,3);exercises=seen.length?seen.map(n=>({name:title(n),sets:3,target:'5',rx:title(n)+' 3x5'})):[{name:'Squat',sets:3,target:'5',rx:'Squat 3x5'},{name:'Bench',sets:3,target:'5',rx:'Bench 3x5'},{name:'Row',sets:3,target:'8',rx:'Row 3x8'}];label=chosen||'Today'}return {date:note.today,day:label,done:false,exercises:exercises.map(ex=>({name:ex.name,target:ex.target,rx:ex.rx,sets:Array.from({length:ex.sets},(_,i)=>({done:false,reps:ex.target==='max'?'':ex.target,weight:latestWeight(logs,ex.name)}))}))}}
function activeFor(note,data,plan,logs){let a=data?.values?.activeSession;if(!a||a.date!==note.today||!Array.isArray(a.exercises))a=makeSession(note,data,plan,logs);return a}
function progressStats(logs){const by={};logs.slice().reverse().forEach(r=>{if(!r.exercise)return;(by[r.exercise]??=[]).push(r)});return by}
let tab='today', error='';
async function saveActive(a){await amber.setData({values:{activeSession:a}})}
function render(note,data){const app=document.getElementById('app'), t=note.tables[0], logs=rowsFromTable(t), plan=parsePlan(note), active=activeFor(note,data,plan,logs), doneSets=active.exercises.flatMap(e=>e.sets).filter(s=>s.done).length, totalSets=active.exercises.reduce((n,e)=>n+e.sets.length,0), pct=totalSets?Math.round(100*doneSets/totalSets):0;
app.innerHTML=`<div class="top"><div><h1>${esc(note.title)}</h1><div class="date">${esc(full[new Date(note.today+'T12:00:00Z').getUTCDay()])} · ${esc(note.today)}</div></div><span class="pill">${doneSets}/${totalSets} sets</span></div><div class="btns" style="margin:0 0 10px"><button class="btn" id="topfinish">Finish & log</button><span class="muted" style="align-self:center">Latest log: ${esc(logs[0]?.exercise||'none')} ${esc(logs[0]?.weight||'')}</span></div><nav class="tabs" aria-label="Training sections"><button class="tab ${tab==='today'?'on':''}" data-tab="today">Today</button><button class="tab ${tab==='plan'?'on':''}" data-tab="plan">Plan</button><button class="tab ${tab==='progress'?'on':''}" data-tab="progress">Progress</button></nav><section id="today" class="${tab==='today'?'':'hide'}">${todayView(active,pct,t)}</section><section id="plan" class="${tab==='plan'?'':'hide'}">${planView(plan)}</section><section id="progress" class="${tab==='progress'?'':'hide'}">${progressView(logs)}</section>`;
app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render(note,data)});
bindToday(active,t);bindPlan(plan,note);}
function todayView(a,pct,t){if(!t)return `<div class="card empty">Add a Date / Exercise / Weight / Reps table to log workouts.</div>`;return `<div class="grid two"><div class="card hero pad"><div class="muted">Today's workout</div><div class="big">${esc(a.day)} session</div><p class="muted">Tick sets as you lift. Change reps or weight before finishing; completed exercises are written to the log table.</p><div class="bar" aria-label="${pct}% complete"><i style="width:${pct}%"></i></div></div><div class="card pad"><h2>Quick controls</h2><div class="btns"><button class="btn secondary" id="reset">Reset ticks</button><button class="btn" id="finish">Finish & log</button></div><div class="err" role="alert">${esc(error)}</div></div></div><h3>Sets</h3><div class="card">${a.exercises.map((ex,ei)=>`<div class="ex"><div class="exhead"><div><div class="exname">${esc(ex.name)}</div><div class="rx">${esc(ex.rx||'')}</div></div><span class="pill">${ex.sets.filter(s=>s.done).length}/${ex.sets.length}</span></div><div class="sets">${ex.sets.map((s,si)=>`<div class="set"><input class="check" type="checkbox" aria-label="${esc(ex.name)} set ${si+1} done" data-e="${ei}" data-s="${si}" ${s.done?'checked':''}><label>Weight<input data-w="${ei}:${si}" inputmode="decimal" value="${esc(s.weight)}" aria-label="${esc(ex.name)} set ${si+1} weight"></label><label>Reps<input data-r="${ei}:${si}" inputmode="numeric" value="${esc(s.reps)}" aria-label="${esc(ex.name)} set ${si+1} reps"></label></div>`).join('')}</div></div>`).join('')}</div>`}
function bindToday(a,t){document.querySelectorAll('[data-e]').forEach(ch=>ch.onchange=async()=>{a.exercises[ch.dataset.e].sets[ch.dataset.s].done=ch.checked;await saveActive(a)});document.querySelectorAll('[data-w]').forEach(inp=>inp.onchange=async()=>{const [e,s]=inp.dataset.w.split(':');a.exercises[e].sets[s].weight=inp.value;await saveActive(a)});document.querySelectorAll('[data-r]').forEach(inp=>inp.onchange=async()=>{const [e,s]=inp.dataset.r.split(':');a.exercises[e].sets[s].reps=inp.value;await saveActive(a)});const reset=document.getElementById('reset');if(reset)reset.onclick=async()=>{a.exercises.forEach(e=>e.sets.forEach(s=>s.done=false));await saveActive(a)};async function finishWorkout(){if(!t){error='Add a log table first.';render(amber.note,amber.data);return}const ops=a.exercises.length?a.exercises.map(ex=>{const done=ex.sets.filter(s=>s.done);const use=done.length?done:ex.sets;const weights=[...new Set(use.map(s=>String(s.weight||'').trim()).filter(Boolean))];return {op:'append_row',table:t.index,values:{Date:a.date,Exercise:ex.name,Weight:weights.length===1?weights[0]:weights.join('/'),Reps:use.map(s=>String(s.reps||'').trim()||'0').join(',')}}}):[{op:'append_row',table:t.index,values:{Date:a.date,Exercise:'Workout',Weight:'',Reps:''}}];const r=await amber.update(ops);if(r.ok){error='';await amber.setData({values:{activeSession:null}})}else{error=r.error;render(amber.note,amber.data)}}const finish=document.getElementById('finish');if(finish)finish.onclick=finishWorkout;const topfinish=document.getElementById('topfinish');if(topfinish)topfinish.onclick=finishWorkout}
function planView(plan){const order=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];return `<div class="card pad"><h2>Adjust the plan</h2><p class="muted">Use entries like “squat 3x5, bench 3x5”. Leave a day blank for rest.</p><div class="plans">${order.map(d=>`<label class="planline">${d}<textarea data-plan="${d}">${esc(plan[d]||'')}</textarea></label>`).join('')}</div><div class="btns" style="margin-top:12px"><button class="btn" id="saveplan">Save plan</button></div><div class="err" role="alert">${esc(error)}</div></div>`}
function bindPlan(plan,note){const b=document.getElementById('saveplan');if(!b)return;b.onclick=async()=>{document.querySelectorAll('[data-plan]').forEach(x=>plan[x.dataset.plan]=x.value.trim());const r=await amber.update({op:'set_text',heading:'Plan (3 days a week)',text:planToText(plan)});error=r.ok?'':r.error;render(amber.note,amber.data)}}
function progressView(logs){if(!logs.length)return `<div class="card empty">No logged sets yet.</div>`;const by=progressStats(logs), exs=Object.keys(by).sort(), sessions=[...new Set(logs.map(r=>r.date))];return `<div class="mini"><div class="stat"><span class="muted">Sessions</span><b>${sessions.length}</b></div><div class="stat"><span class="muted">Logged lifts</span><b>${logs.length}</b></div><div class="stat"><span class="muted">Exercises</span><b>${exs.length}</b></div><div class="stat"><span class="muted">Latest</span><b>${esc(logs[0]?.date||'—')}</b></div></div><h3>Exercise trends</h3><div class="grid progress">${exs.map(ex=>trendCard(ex,by[ex])).join('')}</div><h3>Recent log</h3><div class="card">${logs.slice(0,10).map(r=>`<div class="row"><div><b>${esc(r.exercise)}</b><div class="muted">${esc(r.date)} · reps ${esc(r.reps)}</div></div><div class="num">${esc(r.weight)}</div></div>`).join('')}</div>`}
function trendCard(ex,rs){const vals=rs.map(r=>num(r.weight)), max=Math.max(1,...vals), pts=vals.map((v,i)=>`${vals.length===1?50:(i*100/(vals.length-1)).toFixed(1)},${(50-45*v/max).toFixed(1)}`).join(' '), last=rs[rs.length-1];return `<div class="card pad"><div class="exhead"><div><div class="exname">${esc(ex)}</div><div class="muted">${rs.length} log${rs.length===1?'':'s'}</div></div><span class="num">${esc(last?.weight||'')}</span></div><svg class="spark" viewBox="0 0 100 55" role="img" aria-label="${esc(ex)} progress"><polyline points="${pts}" fill="none" stroke="var(--amber-accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`}
amber.onChange(render);
</script>
</body>
</html>
