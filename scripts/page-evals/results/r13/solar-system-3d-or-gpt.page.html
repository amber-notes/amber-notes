<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-libs" content="three">
<style>
  :root{--space-label:#f8fafc}@media (prefers-color-scheme:dark){:root{--space-label:#f8fafc}}*{box-sizing:border-box}body{margin:0;padding:0 0 max(20px,env(safe-area-inset-bottom));color:var(--amber-text);font-family:var(--amber-font)}.wrap{max-width:var(--amber-content-max);margin:0 auto;padding:calc(var(--amber-gutter) + 4px) var(--amber-gutter)}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:.8rem}h1{font-size:clamp(1.65rem,5vw,2.7rem);line-height:1.05;margin:.1rem 0 .25rem;letter-spacing:-.04em}.sub{margin:0;color:var(--amber-text-secondary);font-size:.98rem;line-height:1.35}.pill{flex:none;min-height:44px;display:flex;align-items:center;padding:.55rem .8rem;border:1px solid var(--amber-separator);border-radius:999px;background:var(--amber-surface);font-size:.9rem;color:var(--amber-text-secondary)}
  .stage{position:relative;min-height:520px;height:min(72vh,760px);border-radius:calc(var(--amber-radius) + 10px);overflow:hidden;border:1px solid color-mix(in srgb,var(--amber-separator) 70%,transparent);background:radial-gradient(circle at 50% 45%,#172554 0%,#020617 62%,#000 100%);box-shadow:0 20px 70px rgba(0,0,0,.22);touch-action:none}.stage canvas{display:block;width:100%;height:100%}.hint{position:absolute;left:1rem;bottom:1rem;right:1rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;pointer-events:none}.badge{border:1px solid rgba(255,255,255,.24);background:rgba(2,6,23,.84);color:var(--space-label);border-radius:999px;padding:.45rem .7rem;font-size:.85rem;backdrop-filter:blur(10px)}
  .toolbar{display:grid;grid-template-columns:1fr;gap:.65rem;margin:1rem 0}@media(min-width:760px){.toolbar{grid-template-columns:1fr auto auto}.stage{height:min(74vh,820px)}}.panel{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center;background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:.6rem}.btn{min-height:44px;border:1px solid var(--amber-field-border);border-radius:var(--amber-radius-small);background:var(--amber-field);color:var(--amber-text);font:inherit;padding:.5rem .75rem}.btn.primary{background:var(--amber-accent-soft);border-color:var(--amber-accent);color:var(--amber-text)}label{display:flex;align-items:center;gap:.55rem;color:var(--amber-text-secondary);font-size:.95rem}input[type="range"]{min-width:150px;accent-color:var(--amber-accent);background:var(--amber-field);border:1px solid var(--amber-field-border);border-radius:999px;min-height:44px;padding:0 .2rem}.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.55rem;margin-top:1rem}.planet-card{display:flex;align-items:center;gap:.6rem;min-height:52px;padding:.6rem .7rem;background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius-small)}.dot{width:1rem;height:1rem;border-radius:50%;flex:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--amber-bg) 55%,transparent)}.planet-card b{display:block;font-size:.96rem}.planet-card span{display:block;color:var(--amber-text-secondary);font-size:.82rem}.empty{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:1rem;line-height:1.45}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:520px){.wrap{padding-left:12px;padding-right:12px}header{display:block}.pill{display:inline-flex;margin-top:.65rem}.stage{height:560px;min-height:480px;border-radius:22px}.hint{left:.65rem;right:.65rem;bottom:.65rem}.badge{font-size:.8rem}.panel{padding:.5rem}.legend{grid-template-columns:1fr 1fr;gap:.45rem}.planet-card{min-width:0;padding:.5rem}.planet-card span{font-size:.78rem}}
</style>
</head>
<body>
<div class="wrap"><header><div><h1 id="title">Planets</h1><p class="sub">A touch-spinnable 3D solar system. Distances and planet sizes come from the table, compressed so everything fits on screen.</p></div><div class="pill" id="count" aria-live="polite">Loading…</div></header><section class="stage" id="stage" aria-label="3D solar system, drag to spin and pinch or scroll to zoom" role="img"><div class="hint"><span class="badge">Drag with one finger to spin</span><span class="badge">Pinch or scroll to zoom</span></div></section><div id="legend" class="legend" aria-label="Planet sizes and distances"></div><p id="status" class="sr-only" aria-live="polite"></p></div>
<script>
(function(){
  const colors=[0xb7b1a7,0xd6ad6b,0x3b82f6,0xd46a45,0xd8b36a,0xd9c08e,0x8bd3dd,0x5877e8];
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const num=v=>{const n=parseFloat(String(v??"").replace(/,/g,""));return Number.isFinite(n)?n:null};
  const nameOf=c=>String(c&&c.name||"").toLowerCase();
  let scene,camera,renderer,system,starField,raf,last=0,paused=false,planets=[],meshes=[],rings=[],drag=false,lastPt=null,distMul=1,orbitSpeed=.7,stage=document.getElementById('stage');
  let targetRot={x:.5,y:-.35}, currentRot={x:.5,y:-.35}, zoom=.88;
  function findTable(note){return (note.tables||[]).find(t=>t.columns.some(c=>/planet|name/i.test(c.name))&&t.columns.some(c=>/distance|au|orbit/i.test(c.name))&&t.columns.some(c=>/radius|size|diameter/i.test(c.name)))||(note.tables||[])[0];}
  function readPlanets(note){const t=findTable(note); if(!t) return []; const cols=t.columns.map(nameOf); const ni=cols.findIndex(n=>/planet|name/.test(n)); const di=cols.findIndex(n=>/distance|au|orbit/.test(n)); const ri=cols.findIndex(n=>/radius|size|diameter/.test(n)); const dayi=cols.findIndex(n=>/day|hours|rotation/.test(n)); return (t.rows||[]).map((r,i)=>({name:String(r[ni]||('Planet '+(i+1))).trim(),distance:num(r[di]),radius:num(r[ri]),day:num(dayi>=0?r[dayi]:null),color:colors[i%colors.length]})).filter(p=>p.name&&p.distance!==null&&p.radius!==null);}
  function init(){ if(renderer) return; scene=new THREE.Scene(); camera=new THREE.PerspectiveCamera(45,1,.1,2000); camera.position.set(0,42,105); renderer=new THREE.WebGLRenderer({antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(devicePixelRatio||1,2)); stage.prepend(renderer.domElement); system=new THREE.Group(); scene.add(system); scene.add(new THREE.AmbientLight(0xffffff,.75)); const sunLight=new THREE.PointLight(0xfff1b5,2.5,500); scene.add(sunLight); const sunMat=new THREE.MeshBasicMaterial({color:0xffd166}); const sun=new THREE.Mesh(new THREE.SphereGeometry(3.2,48,24),sunMat); sun.userData.sun=true; system.add(sun); addStars(); bind(); resize(); animate(0); }
  function addStars(){ const g=new THREE.BufferGeometry(), pts=[]; for(let i=0;i<900;i++){ const r=180+Math.random()*460, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1); pts.push(r*Math.sin(ph)*Math.cos(th),r*Math.cos(ph),r*Math.sin(ph)*Math.sin(th)); } g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3)); starField=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.9,sizeAttenuation:true,transparent:true,opacity:.72})); scene.add(starField); }
  function build(data){init(); planets=data; meshes.forEach(m=>system.remove(m.pivot)); rings.forEach(r=>system.remove(r)); meshes=[]; rings=[]; const maxD=Math.max(...data.map(p=>p.distance),1), maxR=Math.max(...data.map(p=>p.radius),1), minR=Math.min(...data.map(p=>p.radius),1); data.forEach((p,i)=>{ const d=(6+Math.pow(p.distance/maxD,.62)*48)*distMul; const rad=.55+Math.pow(p.radius/maxR,.52)*3.8; const pivot=new THREE.Group(); pivot.rotation.y=i*.9; const geom=new THREE.SphereGeometry(rad,48,24); const mat=new THREE.MeshStandardMaterial({color:p.color,roughness:.7,metalness:.03}); const mesh=new THREE.Mesh(geom,mat); mesh.position.x=d; mesh.userData=p; pivot.add(mesh); const ringG=new THREE.RingGeometry(d-.035,d+.035,160); const ringM=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.18,side:THREE.DoubleSide}); const ring=new THREE.Mesh(ringG,ringM); ring.rotation.x=Math.PI/2; system.add(ring); rings.push(ring); system.add(pivot); meshes.push({pivot,mesh,d,rad,day:p.day||24,orbit:(.09/(Math.sqrt(Math.max(p.distance,.1))))}); }); currentRot={x:.5,y:-.35}; targetRot={x:.5,y:-.35}; zoom=.88; }
  function resize(){ if(!renderer) return; const r=stage.getBoundingClientRect(); renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false); camera.aspect=r.width/r.height; camera.updateProjectionMatrix(); }
  function animate(t){ raf=requestAnimationFrame(animate); const dt=Math.min(.05,(t-last)/1000||.016); last=t; currentRot.x+=(targetRot.x-currentRot.x)*.12; currentRot.y+=(targetRot.y-currentRot.y)*.12; system.rotation.x=currentRot.x; system.rotation.y=currentRot.y; camera.position.z=122/zoom; camera.position.y=36/zoom; camera.lookAt(0,0,0); if(!paused){ meshes.forEach((m,i)=>{m.mesh.rotation.y+=dt*Math.max(.08,24/Math.max(m.day,1))*1.5; m.pivot.rotation.y+=dt*m.orbit*orbitSpeed;}); if(starField) starField.rotation.y+=dt*.004; } renderer.render(scene,camera); }
  function bind(){ new ResizeObserver(resize).observe(stage); stage.addEventListener('pointerdown',e=>{drag=true;lastPt={x:e.clientX,y:e.clientY};stage.setPointerCapture(e.pointerId);}); stage.addEventListener('pointermove',e=>{if(!drag||!lastPt)return; const dx=e.clientX-lastPt.x, dy=e.clientY-lastPt.y; targetRot.y+=dx*.008; targetRot.x=Math.max(-1.25,Math.min(1.25,targetRot.x+dy*.006)); lastPt={x:e.clientX,y:e.clientY};}); stage.addEventListener('pointerup',()=>{drag=false;lastPt=null;}); stage.addEventListener('pointercancel',()=>{drag=false;lastPt=null;}); stage.addEventListener('wheel',e=>{e.preventDefault(); zoom=Math.max(.55,Math.min(2.1,zoom*(e.deltaY>0?.92:1.08)));},{passive:false}); let pinch=0; stage.addEventListener('touchmove',e=>{ if(e.touches.length===2){ const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); if(pinch) zoom=Math.max(.55,Math.min(2.1,zoom*(d/pinch))); pinch=d; e.preventDefault(); }},{passive:false}); stage.addEventListener('touchend',()=>{pinch=0;});  }
  function render(note){ document.getElementById('title').textContent=note.title||'Planets'; const data=readPlanets(note); document.getElementById('count').textContent=data.length?data.length+' planets from table':'No planet table found'; const legend=document.getElementById('legend'); if(!data.length){ legend.innerHTML='<div class="empty">Add a table with Planet, Distance (AU), and Radius (km) columns to see the solar system.</div>'; return; } build(data); legend.innerHTML=data.map(p=>'<div class="planet-card"><span class="dot" style="background:#'+p.color.toString(16).padStart(6,'0')+'"></span><div><b>'+esc(p.name)+'</b><span>'+esc(p.distance)+' AU · '+esc(p.radius)+' km radius</span></div></div>').join(''); document.getElementById('status').textContent='Showing '+data.map(p=>p.name).join(', ')+'. Distances use a compressed power scale, and radii use a compressed square-root scale.'; }
  amber.onChange(render);
})();
</script>
</body>
</html>
