<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:22px var(--amber-gutter) calc(28px + env(safe-area-inset-bottom));color:var(--amber-text);font-family:var(--amber-font)}
  .wrap{max-width:var(--amber-content-max);margin:0 auto}
  h1{margin:0 0 16px;font-size:clamp(1.85rem,4vw,3.1rem);line-height:.95;letter-spacing:-.055em;font-family:var(--amber-font-rounded);font-weight:800}
  .tool{display:grid;gap:16px}
  .hero{position:relative;overflow:hidden;border-radius:calc(var(--amber-radius) + 10px);border:1px solid var(--amber-separator);background:var(--amber-surface);padding:20px;min-height:260px;box-shadow:0 16px 44px rgba(0,0,0,.08)}
  .hero:before{content:"";position:absolute;inset:auto -70px -110px auto;width:270px;height:270px;border-radius:50%;background:radial-gradient(circle,var(--amber-accent-soft),transparent 66%);opacity:.75}
  .eyebrow{display:flex;align-items:center;gap:8px;color:var(--amber-text-secondary);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--amber-accent);box-shadow:0 0 0 6px var(--amber-accent-soft)}
  .big{margin:16px 0 6px;font-size:clamp(2.35rem,10vw,5.4rem);line-height:.93;letter-spacing:-.07em;font-weight:900;font-variant-numeric:tabular-nums}
  .subline{color:var(--amber-text-secondary);font-size:1rem;line-height:1.35;max-width:56ch}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;position:relative;z-index:1}
  .stat{background:var(--amber-fill);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:13px;min-height:82px}
  .label{display:block;color:var(--amber-text-secondary);font-size:.82rem;font-weight:700;margin-bottom:7px}
  .value{font-size:1.28rem;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
  .panel{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:calc(var(--amber-radius) + 6px);padding:14px;overflow:hidden}
  .panel h2{margin:0 0 12px;font-size:1rem;letter-spacing:-.01em}.desk{display:grid;gap:12px}
  .control{background:var(--amber-fill);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:12px}
  .control-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.control strong{font-size:.95rem}.readout{font-weight:800;font-variant-numeric:tabular-nums;color:var(--amber-text)}
  input,select{font:inherit;color:var(--amber-text);background:var(--amber-field);border:1px solid var(--amber-field-border);border-radius:var(--amber-radius-small);min-height:44px;padding:9px 11px;width:100%}
  input[type=range]{padding:0 2px;height:44px;accent-color:var(--amber-accent);background:var(--amber-field);border:1px solid var(--amber-field-border)}
  .split{display:grid;grid-template-columns:1.4fr .85fr;gap:10px;align-items:center}.num{min-width:0;text-align:right;font-variant-numeric:tabular-nums}
  .mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode button{min-height:46px;border:1px solid var(--amber-field-border);border-radius:999px;background:var(--amber-field);color:var(--amber-text);font:inherit;font-weight:800}.mode button.on{background:var(--amber-text);border-color:var(--amber-text);color:var(--amber-bg)}
  .meter{height:28px;background:var(--amber-fill);border:1px solid var(--amber-separator);border-radius:999px;overflow:hidden;display:flex}.meter span:first-child{background:var(--amber-accent)}.meter span:last-child{background:var(--amber-danger);opacity:.72}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;color:var(--amber-text-secondary);font-size:.88rem}.key{display:inline-flex;align-items:center;gap:6px}.sw{width:11px;height:11px;border-radius:3px;background:var(--amber-accent)}.sw.red{background:var(--amber-danger);opacity:.72}
  .timeline{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;height:120px;margin-top:12px}.bar{border-radius:8px 8px 3px 3px;background:linear-gradient(to top,var(--amber-accent),var(--amber-accent-soft));min-height:7px;border:1px solid var(--amber-separator)}
  .hint{margin-top:10px;color:var(--amber-text-secondary);font-size:.9rem}.scenarios{margin-top:16px;border-top:1px solid var(--amber-separator);padding-top:12px}.scenario{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--amber-separator);font-size:.92rem}.scenario:first-of-type{border-top:0}.scenario b{font-variant-numeric:tabular-nums}.empty{padding:22px;text-align:center;color:var(--amber-text-secondary)}
  @media (max-width:599px){.stats{grid-template-columns:1fr}.split{grid-template-columns:1fr}.num{text-align:left}.hero{padding:18px}.timeline{height:88px}}
  @media (min-width:900px){.tool{grid-template-columns:1.05fr .95fr;align-items:start}.hero{min-height:100%;padding:28px}.desk{gap:14px}.panel{padding:18px}.big{margin-top:22px}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap"><h1 id="title">Mortgage</h1><main id="app" class="tool" aria-live="polite"></main></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const clean=s=>String(s??"").replace(/[\s ]/g,"").replace(/kr|sek|%/gi,"").replace(",",".");
const num=s=>{const n=parseFloat(clean(s));return Number.isFinite(n)?n:0};
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const money=n=>new Intl.NumberFormat("sv-SE",{style:"currency",currency:"SEK",maximumFractionDigits:0}).format(Number.isFinite(n)?n:0);
const short=n=>new Intl.NumberFormat("sv-SE",{maximumFractionDigits:0}).format(Number.isFinite(n)?n:0);
let state=null, dirty=false, saveTimer=null, saving=false;
function findTable(note){return note.tables.find(t=>["Loan","Rate","Years"].every(n=>t.columns.some(c=>c.name.toLowerCase()===n.toLowerCase())))||note.tables[0]}
function col(t,name){return t.columns.findIndex(c=>c.name.toLowerCase()===name.toLowerCase())}
function fromNote(note){const t=findTable(note);if(!t||!t.rows.length)return null;const rowIndex=Math.max(0,t.rows.length-1), r=t.rows[rowIndex], li=col(t,"Loan"), ri=col(t,"Rate"), yi=col(t,"Years"), mi=col(t,"Amortization");return {loan:clamp(num(r[li]),10000,100000000),rate:clamp(num(r[ri]),0,25),years:clamp(Math.round(num(r[yi])||1),1,40),mode:(mi>=0&&/fixed|annuity/i.test(r[mi]))?"fixed":"straight"}}
function calc(s){const p=s.loan, n=Math.max(1,s.years*12), r=s.rate/100/12;if(s.mode==="fixed"){const pay=r===0?p/n:p*r/(1-Math.pow(1+r,-n));const interest=pay*n-p;return {headline:pay,totalInterest:interest,totalPaid:p+interest,first:pay,last:pay,average:pay,label:"Monthly payment"}}const principal=p/n;const interest=r===0?0:r*principal*n*(n+1)/2;const first=principal+p*r;const last=principal+principal*r;return {headline:first,totalInterest:interest,totalPaid:p+interest,first,last,average:(p+interest)/n,label:"First monthly payment"}}
function scheduleSave(note){clearTimeout(saveTimer);saveTimer=setTimeout(()=>save(note),650)}
async function save(note){const t=findTable(note);if(!t||!t.rows.length||saving||!state)return;saving=true;const ops=[{op:"set_cell",table:t.index,row:Math.max(0,t.rows.length-1),col:"Loan",value:String(Math.round(state.loan))},{op:"set_cell",table:t.index,row:Math.max(0,t.rows.length-1),col:"Rate",value:String(+state.rate.toFixed(3))},{op:"set_cell",table:t.index,row:Math.max(0,t.rows.length-1),col:"Years",value:String(Math.round(state.years))}];if(col(t,"Amortization")>=0)ops.push({op:"set_cell",table:t.index,row:Math.max(0,t.rows.length-1),col:"Amortization",value:state.mode});const res=await amber.update(ops);saving=false;if(res.ok){dirty=false}else{console.warn(res.error)}}
function change(note,key,value){if(!state)return;state={...state,[key]:value};dirty=true;render(note);scheduleSave(note)}
function render(note){document.getElementById("title").textContent=note.title||"Mortgage";const incoming=fromNote(note);if(!incoming){document.getElementById("app").innerHTML='<section class="panel empty">Add a table with Loan, Rate and Years columns to use the calculator.</section>';return}if(!state||(!dirty&&!saving))state=incoming;const t=findTable(note);const s=state, c=calc(s), principal=s.loan, interest=Math.max(0,c.totalInterest), total=Math.max(1,c.totalPaid);const app=document.getElementById("app");const rows=t&&t.rows?t.rows:[];const li=t?col(t,"Loan"):-1,ri=t?col(t,"Rate"):-1,yi=t?col(t,"Years"):-1,mi=t?col(t,"Amortization"):-1;const scenarios=rows.map((r,i)=>`<div class="scenario"><span>${i===rows.length-1?"Active":"Saved"} ${i+1}: ${esc(mi>=0&&r[mi]?r[mi]:"straight")}</span><b>${money(num(r[li]))} · ${esc(num(r[ri]).toFixed(2))}% · ${esc(Math.round(num(r[yi])||0))}y</b></div>`).join("");const months=s.years*12;const bars=Array.from({length:12},(_,i)=>{const f=i/11;const pay=s.mode==="fixed"?c.headline:(c.first+(c.last-c.first)*f);const h=12+Math.max(0,Math.min(100,pay/c.first*100));return `<div class="bar" style="height:${h}%" title="${esc(money(pay))}"></div>`}).join("");app.innerHTML=`
<section class="hero">
  <div class="eyebrow"><span class="dot"></span>${esc(c.label)}</div>
  <div class="big">${money(c.headline)}</div>
  <div class="subline">${s.mode==="straight"?`Straight amortization: payments fall toward ${money(c.last)} by the last month.`:`Fixed-payment loan: the payment stays the same for ${months} months.`}</div>
  <div class="stats">
    <div class="stat"><span class="label">Total interest</span><div class="value">${money(interest)}</div></div>
    <div class="stat"><span class="label">Total paid</span><div class="value">${money(c.totalPaid)}</div></div>
    <div class="stat"><span class="label">Average / month</span><div class="value">${money(c.average)}</div></div>
    <div class="stat"><span class="label">Term</span><div class="value">${months} months</div></div>
  </div>
</section>
<section class="desk">
  <div class="panel"><h2>Loan cockpit</h2>
    <div class="control"><div class="control-head"><strong>Loan</strong><span class="readout">${money(s.loan)}</span></div><div class="split"><label><span class="label">Drag loan amount</span><input id="loanRange" type="range" min="100000" max="15000000" step="50000" value="${Math.round(s.loan)}"></label><label><span class="label">Exact amount</span><input id="loanNum" class="num" type="number" inputmode="numeric" min="10000" step="10000" value="${Math.round(s.loan)}"></label></div></div>
    <div class="control"><div class="control-head"><strong>Rate</strong><span class="readout">${s.rate.toFixed(2)}%</span></div><div class="split"><label><span class="label">Drag interest rate</span><input id="rateRange" type="range" min="0" max="12" step="0.05" value="${s.rate}"></label><label><span class="label">Exact rate</span><input id="rateNum" class="num" type="number" inputmode="decimal" min="0" max="25" step="0.01" value="${s.rate}"></label></div></div>
    <div class="control"><div class="control-head"><strong>Years</strong><span class="readout">${s.years} years</span></div><div class="split"><label><span class="label">Drag term</span><input id="yearsRange" type="range" min="1" max="40" step="1" value="${s.years}"></label><label><span class="label">Exact years</span><input id="yearsNum" class="num" type="number" inputmode="numeric" min="1" max="40" step="1" value="${s.years}"></label></div></div>
    <div class="control"><div class="control-head"><strong>Payment style</strong><span class="readout">${s.mode==="straight"?"Straight":"Fixed"}</span></div><div class="mode" role="group" aria-label="Payment style"><button id="straight" class="${s.mode==="straight"?"on":""}" type="button">Straight</button><button id="fixed" class="${s.mode==="fixed"?"on":""}" type="button">Fixed</button></div></div>
  </div>
  <div class="panel"><h2>What you pay back</h2><div class="meter" role="img" aria-label="Principal and interest"><span style="width:${100*principal/total}%"></span><span style="width:${100*interest/total}%"></span></div><div class="legend"><span class="key"><span class="sw"></span>Loan ${money(principal)}</span><span class="key"><span class="sw red"></span>Interest ${money(interest)}</span></div><div class="timeline" aria-label="Payment shape over the loan term">${bars}</div><div class="hint">${s.mode==="straight"?"Bars show how a straight loan starts higher and eases down over time.":"Bars stay level because a fixed-payment loan uses the same monthly payment."} Values are saved back to the note.</div><div class="scenarios"><h2>Saved scenarios</h2>${scenarios||"<div class=\"hint\">No saved scenarios yet.</div>"}</div></div>
</section>`;
const bind=(id,key,fn)=>{const el=document.getElementById(id);if(el)el.oninput=()=>change(note,key,fn(el.value))};
bind("loanRange","loan",v=>clamp(num(v),10000,100000000));bind("loanNum","loan",v=>clamp(num(v),10000,100000000));bind("rateRange","rate",v=>clamp(num(v),0,25));bind("rateNum","rate",v=>clamp(num(v),0,25));bind("yearsRange","years",v=>clamp(Math.round(num(v)||1),1,40));bind("yearsNum","years",v=>clamp(Math.round(num(v)||1),1,40));document.getElementById("straight").onclick=()=>change(note,"mode","straight");document.getElementById("fixed").onclick=()=>change(note,"mode","fixed");}
amber.onChange(render);
</script>
</body>
</html>
