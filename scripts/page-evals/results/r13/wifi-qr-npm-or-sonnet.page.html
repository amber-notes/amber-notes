<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-libs" content="npm:qrcode-generator@1.4.4/qrcode.js#sha256-GK45n4EYK8nekW6cd7GV3yDMWNby1VpisIWimfG/F4A=">
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 40px; display: grid; gap: 20px; justify-items: center; text-align: center; }
  h1 { font-family: var(--amber-font-rounded); font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 0; letter-spacing: -.02em; }
  .hint { margin: 0; color: var(--amber-text-secondary); font-size: 1rem; }
  .qr { background: #fff; padding: clamp(14px, 4vw, 28px); border-radius: 24px; border: 1px solid var(--amber-separator); width: min(100%, 560px); }
  @media (prefers-color-scheme: dark) { .qr { background: #fff; } } /* QR needs a light backdrop to scan */
  .qr svg { display: block; width: 100%; height: auto; }
  .info { display: grid; gap: 4px; width: min(100%, 560px); background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 8px 18px; text-align: left; }
  .info div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-top: 1px solid var(--amber-separator); align-items: baseline; }
  .info div:first-child { border-top: 0; }
  .k { color: var(--amber-text-secondary); font-size: .9rem; }
  .v { font-family: var(--amber-font-mono); font-size: 1.15rem; font-weight: 600; overflow-wrap: anywhere; text-align: right; }
  .empty { color: var(--amber-text-secondary); padding: 28px; }
  @media (min-width: 900px) {
    main { grid-template-columns: 1fr 1fr; align-items: center; text-align: left; justify-items: stretch; }
    main > .head { grid-column: 1 / -1; text-align: center; }
    .qr { justify-self: end; }
    .info { justify-self: start; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const wesc = (s) => String(s).replace(/([\\;,:"])/g, "\\$1");
  function field(md, re) {
    for (const line of md.split("\n")) {
      const m = line.match(/^\s*[-*]?\s*([^:]+?)\s*:\s*(.*?)\s*$/);
      if (m && re.test(m[1])) return m[2];
    }
    return "";
  }
  function render(note) {
    const app = document.getElementById("app");
    const ssid = field(note.markdown, /^(network|ssid|name|wifi|wi-fi)/i);
    const pw = field(note.markdown, /^(password|pass|key|passphrase)/i);
    let sec = field(note.markdown, /^security|^encryption|^type/i).toUpperCase();
    const head = `<div class="head"><h1>${esc(note.title)}</h1></div>`;
    if (!ssid) { app.innerHTML = head + `<div class="empty">Add a line “Network: your wifi name” to the note.</div>`; return; }
    let T = /WEP/.test(sec) ? "WEP" : (/NONE|OPEN/.test(sec) || (!pw && !sec)) ? "nopass" : "WPA";
    const payload = `WIFI:T:${T};S:${wesc(ssid)};` + (T === "nopass" ? "" : `P:${wesc(pw)};`) + ";";
    let svg = "";
    try {
      const q = qrcode(0, "M");
      q.addData(payload); q.make();
      svg = q.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
    } catch (e) { svg = ""; }
    app.innerHTML = head +
      (svg ? `<div class="qr" role="img" aria-label="QR code to join the wifi network ${esc(ssid)}">${svg}</div>` : `<div class="empty">Could not make a QR code.</div>`) +
      `<div><p class="hint">Open your phone camera, point it at the code and tap to join.</p>
       <div class="info" style="margin-top:16px">
         <div><span class="k">Network</span><span class="v">${esc(ssid)}</span></div>
         ${T === "nopass" ? "" : `<div><span class="k">Password</span><span class="v">${esc(pw)}</span></div>`}
         <div><span class="k">Security</span><span class="v">${esc(sec || (T === "nopass" ? "Open" : "WPA"))}</span></div>
       </div></div>`;
  }
  amber.onChange(render);
</script>
</body>
</html>
