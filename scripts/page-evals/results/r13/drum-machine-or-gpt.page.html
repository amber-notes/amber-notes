<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:var(--amber-bg);--surface:var(--amber-surface);--fill:var(--amber-fill);--text:var(--amber-text);--muted:var(--amber-text-secondary);--line:var(--amber-separator);--accent:var(--amber-accent);--accentText:var(--amber-on-accent);--soft:var(--amber-accent-soft);--danger:var(--amber-danger);--kick:#ff9f1c;--snare:#ef476f;--hat:#2ec4b6;--glow:rgba(255,159,28,.28)}
  @media (prefers-color-scheme:dark){:root{--kick:#ffb74d;--snare:#ff6b93;--hat:#53dfd3;--glow:rgba(255,183,77,.22)}}
  *{box-sizing:border-box} body{margin:0;padding:18px var(--amber-gutter) calc(28px + env(safe-area-inset-bottom));color:var(--text);font-family:var(--amber-font)}
  .wrap{max-width:var(--amber-content-max);margin:0 auto} h1{font-size:2rem;line-height:1.05;margin:.15rem 0 .9rem;letter-spacing:-.04em}.panel{background:linear-gradient(135deg,var(--surface),var(--fill));border:1px solid var(--line);border-radius:calc(var(--amber-radius) + 8px);padding:14px;box-shadow:0 10px 28px rgba(0,0,0,.06)}
  .transport{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;margin-bottom:14px}.play{width:72px;height:72px;border-radius:50%;border:0;background:var(--text);color:var(--bg);font:700 1.1rem var(--amber-font-rounded);box-shadow:0 0 0 7px var(--soft);display:grid;place-items:center}.play:active{transform:scale(.97)}
  .tempo{min-width:0}.tempo strong{font-size:1.35rem;font-variant-numeric:tabular-nums}.tempo p{margin:.2rem 0 0;color:var(--muted);line-height:1.35}.bar{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin-top:10px}.dot{height:8px;border-radius:999px;background:var(--line)}.dot.on{background:var(--accent);box-shadow:0 0 0 3px var(--soft)}
  .machines{display:grid;gap:12px}.track{border:1px solid var(--line);background:var(--surface);border-radius:var(--amber-radius);padding:12px}.trackHead{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-weight:750}.led{width:14px;height:14px;border-radius:50%;background:var(--track);box-shadow:0 0 14px color-mix(in srgb,var(--track),transparent 35%)}.hint{margin-left:auto;color:var(--muted);font-size:.82rem;font-weight:500}
  .steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.step{position:relative;min-height:48px;border-radius:13px;border:1px solid var(--amber-field-border);background:var(--amber-field);color:var(--text);font:700 .95rem var(--amber-font-rounded);font-variant-numeric:tabular-nums}.step.on{background:var(--track);border-color:var(--track);color:#08110f}.step.playing{outline:3px solid var(--accent);outline-offset:2px}.step small{position:absolute;right:7px;bottom:5px;font-size:.78rem;font-weight:800;opacity:.68}.empty{padding:20px;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--amber-radius)}
  .footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:.9rem}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:var(--surface)}.msg{margin-top:10px;color:var(--danger);min-height:1.2em;font-weight:600}button{cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  @media (min-width:620px){.panel{padding:18px}.transport{grid-template-columns:auto 1fr auto}.machines{grid-template-columns:repeat(3,minmax(0,1fr))}.steps{grid-template-columns:repeat(4,minmax(0,1fr))}.step{min-height:56px}}
  @media (min-width:980px){h1{font-size:2.5rem}.panel{padding:22px}.steps{gap:10px}.step{min-height:62px}.play{width:84px;height:84px}.footer{font-size:1rem}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let ctx,master,playing=false,pos=-1,timer=null,lastNote=null,message="";const colors={kick:"var(--kick)",snare:"var(--snare)",hat:"var(--hat)"};function showError(s){message=s||"";const m=document.getElementById("msg");if(m)m.textContent=message}
function findBeat(note){return note.tables.find(t=>t.columns.some(c=>/^step$/i.test(c.name))&&t.columns.some(c=>/kick/i.test(c.name)))||note.tables[0]}
function ix(t,name){return t.columns.findIndex(c=>new RegExp(name,"i").test(c.name))}function on(v){return /^(x|1|yes|on|true)$/i.test(String(v||"").trim())}
function bpm(note){const m=note.markdown.match(/(\d{2,3})\s*bpm/i);return m?Math.max(40,Math.min(240,Number(m[1]))):120}
function ensureAudio(){if(ctx)return;ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.7;master.connect(ctx.destination)}
function envGain(t,a,d,v){const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.001,t+a+d);return g}
function kick(t){const o=ctx.createOscillator(),g=envGain(t,.003,.28,.9);o.type="sine";o.frequency.setValueAtTime(145,t);o.frequency.exponentialRampToValueAtTime(42,t+.18);o.connect(g).connect(master);o.start(t);o.stop(t+.32)}
function noiseHit(t,d,filter,v){const b=ctx.createBuffer(1,ctx.sampleRate*d,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=ctx.createBufferSource();s.buffer=b;const f=ctx.createBiquadFilter();f.type=filter.type;f.frequency.value=filter.freq;f.Q.value=filter.q||1;const g=envGain(t,.002,d,v);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+d+.02)}
function snare(t){noiseHit(t,.18,{type:"bandpass",freq:1800,q:.9},.55);const o=ctx.createOscillator(),g=envGain(t,.002,.12,.22);o.type="triangle";o.frequency.value=185;o.connect(g).connect(master);o.start(t);o.stop(t+.14)}
function hat(t){noiseHit(t,.045,{type:"highpass",freq:7000},.32)}
function playStep(note){const t=findBeat(note);if(!t)return;const k=ix(t,"kick"),s=ix(t,"snare"),h=ix(t,"hat");const r=t.rows[pos];if(!r)return;const now=ctx.currentTime+.01;if(k>=0&&on(r[k]))kick(now);if(s>=0&&on(r[s]))snare(now);if(h>=0&&on(r[h]))hat(now)}
function paint(){document.querySelectorAll(".step").forEach(b=>b.classList.toggle("playing",playing&&Number(b.dataset.step)===pos));document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("on",playing&&i===pos))}
function stop(){playing=false;clearInterval(timer);timer=null;pos=-1;paint();const p=$(".play");if(p){p.textContent="Play";p.setAttribute("aria-pressed","false")}}
async function start(note){ensureAudio();await ctx.resume();playing=true;const ms=60000/bpm(note)/4;const t=findBeat(note);pos=-1;const tick=()=>{pos=(pos+1)%Math.max(1,(t?.rows.length||16));playStep(lastNote||note);paint()};tick();timer=setInterval(tick,ms);const p=$(".play");if(p){p.textContent="Stop";p.setAttribute("aria-pressed","true")}}
function render(note){lastNote=note;const app=$("#app"),t=findBeat(note),b=bpm(note);if(!t){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="empty">Add a Step/Kick/Snare/Hat table to make a beat.</div>`;return}const stepCol=ix(t,"^step$"),tracks=["Kick","Snare","Hat"].map(n=>({name:n,col:ix(t,n),key:n.toLowerCase()})).filter(x=>x.col>=0);app.innerHTML=`<h1>${esc(note.title)}</h1><section class="panel" aria-label="Drum machine"><div class="transport"><button class="play" type="button" aria-pressed="${playing}">${playing?"Stop":"Play"}</button><div class="tempo"><strong>${b} BPM</strong><p>Tap pads to write x’s into the note’s pattern table. Press play to hear the loop.</p><div class="bar" aria-hidden="true">${t.rows.map((_,i)=>`<span class="dot ${playing&&i===pos?"on":""}"></span>`).join("")}</div></div></div><div class="machines">${tracks.map(tr=>`<section class="track" style="--track:${colors[tr.key]||"var(--accent)"}"><div class="trackHead"><span class="led"></span><span>${esc(tr.name)}</span><span class="hint">${t.rows.filter(r=>on(r[tr.col])).length}/${t.rows.length}</span></div><div class="steps">${t.rows.map((r,i)=>`<button class="step ${on(r[tr.col])?"on":""} ${playing&&i===pos?"playing":""}" type="button" data-row="${i}" data-col="${tr.col}" data-step="${i}" aria-pressed="${on(r[tr.col])}" aria-label="${esc(tr.name)} step ${i+1} ${on(r[tr.col])?"on":"off"}">${on(r[tr.col])?"●":"·"}<small>${i+1}</small></button>`).join("")}</div></section>`).join("")}</div><div class="footer"><span class="pill">Pattern: ${t.rows.length} steps</span><span class="pill">Sounds: Kick · Snare · Hat</span></div><div class="msg" id="msg" role="alert">${esc(message)}</div></section>`;
$(".play").onclick=()=>playing?stop():start(note);document.querySelectorAll(".step").forEach(btn=>{btn.onclick=async()=>{const row=Number(btn.dataset.row),col=Number(btn.dataset.col);const val=on(t.rows[row][col])?"":"x";btn.disabled=true;const r=await amber.update({op:"set_cell",table:t.index,row,col,value:val});if(!r.ok){btn.disabled=false;showError(r.error||"Could not update the note")}}});paint()}
amber.onChange(render);
</script>
</body>
</html>
