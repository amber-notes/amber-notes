<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-libs" content="chart">
<style>
:root{--c1:#8a5a2b;--c2:#d98e2b;--c3:#3a7ca5;--good:#1b5e37;--bad:#9c2b1a}
@media (prefers-color-scheme:dark){:root{--c1:#c99a6b;--c2:#f0b04a;--c3:#6bb2dc;--good:#5fbf86;--bad:#ee8272}}
*{box-sizing:border-box}
main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 64px}
h1{font-family:var(--amber-font-rounded);font-size:1.75rem;letter-spacing:-.02em;margin:4px 0 4px}
.sub{color:var(--amber-text-secondary);font-size:.9rem;margin-bottom:16px}
.tabs{display:flex;gap:4px;background:var(--amber-fill);padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;min-height:44px;font:inherit;font-weight:600;border:0;border-radius:9px;background:transparent;color:var(--amber-text-secondary)}
.tabs button[aria-current=true]{background:var(--amber-surface);color:var(--amber-text);box-shadow:0 0 0 2px var(--amber-accent) inset}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:16px;margin-bottom:16px}
.card h2{font-size:1rem;margin:0 0 12px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
.kpis{display:grid;gap:12px;grid-template-columns:1fr}
.kpi .name{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block}
.kpi .big{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--amber-font-rounded)}
.kpi .d{font-size:.9rem;font-variant-numeric:tabular-nums;font-weight:600}
.up{color:var(--good)}.down{color:var(--bad)}
.muted{color:var(--amber-text-secondary);font-size:.85rem}
.chart{position:relative;height:280px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{min-height:44px;padding:0 14px;font:inherit;border:1px solid var(--amber-field-border);border-radius:var(--amber-radius-small);background:var(--amber-field);color:var(--amber-text)}
.seg button[aria-pressed=true]{background:var(--amber-accent-soft);color:var(--amber-text);border-color:var(--amber-accent);font-weight:700}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:10px 6px;border-top:1px solid var(--amber-separator);font-size:.9rem}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--amber-text-secondary);border-top:0}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--amber-accent-soft);color:var(--amber-text)}
.empty{padding:28px;text-align:center;color:var(--amber-text-secondary)}
@media(min-width:600px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid.two{grid-template-columns:1fr 1fr}.chart{height:340px}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const num=s=>{const n=parseFloat(String(s??"").replace(/\s/g,"").replace(",","."));return isNaN(n)?0:n};
const fmt=n=>Math.round(n).toLocaleString("en-US");
const pct=n=>(n>=0?"+":"")+(n*100).toFixed(1)+"%";
let tab="trends",mode="actual",charts=[],last=null;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function parse(note){
  const t=note.tables.find(t=>t.columns.length>=2&&t.rows.length);
  if(!t)return null;
  const lines=t.columns.slice(1).map((c,i)=>({name:c.name,vals:t.rows.map(r=>num(r[i+1]))}));
  return{months:t.rows.map(r=>r[0]),lines};
}
function render(note){
  last=note;
  charts.forEach(c=>c.destroy());charts=[];
  const app=document.getElementById("app");
  const d=parse(note);
  const head=`<h1>${esc(note.title)}</h1>`;
  if(!d){app.innerHTML=head+'<div class="card empty">Add a table with a Month column and one column per sales line.</div>';return}
  const cols=[css("--c1"),css("--c2"),css("--c3"),css("--amber-text-secondary")];
  const n=d.months.length;
  const totals=d.months.map((_,i)=>d.lines.reduce((s,l)=>s+l.vals[i],0));
  const grand=totals.reduce((a,b)=>a+b,0);
  const tabs=[["trends","Trends"],["mix","Mix"],["months","Months"]];
  let h=head+`<div class="sub">${esc(d.months[0])} – ${esc(d.months[n-1])} · ${fmt(grand)} total</div>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button data-tab="${k}" aria-current="${tab===k}">${l}</button>`).join("")}</div>`;
  if(tab==="trends"){
    h+='<div class="kpis">'+d.lines.map((l,i)=>{
      const f=l.vals[0],a=l.vals[n-1],p=n>1?l.vals[n-2]:a;
      const tot=f?a/f-1:0,mom=p?a/p-1:0;
      return`<div class="card kpi"><div class="name"><span class="dot" style="background:${cols[i%4]}"></span>${esc(l.name)}</div>
      <div class="big">${fmt(a)}</div>
      <div class="d ${mom>=0?"up":"down"}">${mom>=0?"▲":"▼"} ${pct(mom)} <span class="muted">vs ${esc(d.months[Math.max(n-2,0)])}</span></div>
      <div class="d ${tot>=0?"up":"down"}">${tot>=0?"▲":"▼"} ${pct(tot)} <span class="muted">since ${esc(d.months[0])}</span></div></div>`}).join("")+'</div>';
    h+=`<div class="card"><h2>Each line over time</h2><div class="seg">
      <button data-mode="actual" aria-pressed="${mode==="actual"}">Amounts</button>
      <button data-mode="index" aria-pressed="${mode==="index"}">Growth (${esc(d.months[0])} = 100)</button></div>
      <div class="chart"><canvas id="c1" role="img" aria-label="Line chart of each sales line by month"></canvas></div></div>`;
  }else if(tab==="mix"){
    h+=`<div class="grid two"><div class="card"><h2>Share of sales, year to date</h2><div class="chart"><canvas id="c2" role="img" aria-label="Doughnut chart of sales share by line"></canvas></div></div>
    <div class="card"><h2>Mix by month (%)</h2><div class="chart"><canvas id="c3" role="img" aria-label="Stacked bar chart of sales share by month"></canvas></div></div></div>
    <div class="card"><table><tr><th>Line</th><th>Total</th><th>Share</th><th>${esc(d.months[0])}</th><th>${esc(d.months[n-1])}</th></tr>
    ${d.lines.map(l=>{const s=l.vals.reduce((a,b)=>a+b,0);return`<tr><td>${esc(l.name)}</td><td>${fmt(s)}</td><td>${grand?(s/grand*100).toFixed(1):0}%</td><td>${totals[0]?(l.vals[0]/totals[0]*100).toFixed(1):0}%</td><td>${totals[n-1]?(l.vals[n-1]/totals[n-1]*100).toFixed(1):0}%</td></tr>`}).join("")}</table>
    <p class="muted">First and last columns show each line's share of that month.</p></div>`;
  }else{
    const bi=totals.indexOf(Math.max(...totals)),wi=totals.indexOf(Math.min(...totals));
    h+=`<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div class="card kpi"><div class="muted">Best month</div><div class="big up">${esc(d.months[bi])}</div><div class="d">${fmt(totals[bi])}</div></div>
      <div class="card kpi"><div class="muted">Weakest month</div><div class="big down">${esc(d.months[wi])}</div><div class="d">${fmt(totals[wi])}</div></div>
      <div class="card kpi"><div class="muted">Monthly average</div><div class="big">${fmt(grand/n)}</div></div></div>
    <div class="card"><h2>Total sales by month</h2><div class="chart"><canvas id="c4" role="img" aria-label="Bar chart of total sales per month, best and weakest highlighted"></canvas></div></div>
    <div class="card"><h2>Best and worst by line</h2><table><tr><th>Line</th><th>Best</th><th>Worst</th></tr>
    ${d.lines.map(l=>{const mx=Math.max(...l.vals),mn=Math.min(...l.vals);return`<tr><td>${esc(l.name)}</td><td><span class="pill">${esc(d.months[l.vals.indexOf(mx)])}</span> ${fmt(mx)}</td><td><span class="pill">${esc(d.months[l.vals.indexOf(mn)])}</span> ${fmt(mn)}</td></tr>`}).join("")}</table></div>`;
  }
  app.innerHTML=h;
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;amber.store.set("tab",tab);render(last)});
  app.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render(last)});
  const txt=css("--amber-text-secondary"),grid=css("--amber-separator");
  Chart.defaults.color=txt;Chart.defaults.font.family=css("--amber-font");
  const scales=(extra)=>({x:{grid:{display:false},stacked:!!(extra&&extra.stacked)},y:Object.assign({grid:{color:grid},beginAtZero:true,stacked:!!(extra&&extra.stacked)},extra&&extra.y||{})});
  const mk=(id,cfg)=>{const el=document.getElementById(id);if(el)charts.push(new Chart(el,cfg))};
  mk("c1",{type:"line",data:{labels:d.months,datasets:d.lines.map((l,i)=>({label:l.name,borderColor:cols[i%4],backgroundColor:cols[i%4],tension:.3,pointRadius:3,borderWidth:2.5,
    data:mode==="index"?l.vals.map(v=>l.vals[0]?v/l.vals[0]*100:0):l.vals}))},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{legend:{position:"bottom"}},scales:scales({y:mode==="index"?{beginAtZero:false}:{}})}});
  mk("c2",{type:"doughnut",data:{labels:d.lines.map(l=>l.name),datasets:[{data:d.lines.map(l=>l.vals.reduce((a,b)=>a+b,0)),backgroundColor:cols,borderColor:css("--amber-surface"),borderWidth:3}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{position:"bottom"}}}});
  mk("c3",{type:"bar",data:{labels:d.months,datasets:d.lines.map((l,i)=>({label:l.name,backgroundColor:cols[i%4],data:l.vals.map((v,j)=>totals[j]?+(v/totals[j]*100).toFixed(1):0)}))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},scales:scales({stacked:true,y:{max:100}})}});
  if(document.getElementById("c4")){
    const bi=totals.indexOf(Math.max(...totals)),wi=totals.indexOf(Math.min(...totals));
    mk("c4",{type:"bar",data:{labels:d.months,datasets:[{label:"Total",data:totals,backgroundColor:totals.map((_,i)=>i===bi?css("--good"):i===wi?css("--bad"):cols[1]),borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:scales()}});
  }
}
amber.onChange((note,data)=>{const t=data&&data.values&&data.values.tab;if(t&&!last)tab=t;render(note)});
</script>
</body>
</html>
