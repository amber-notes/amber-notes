<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household expenses</title>
<style>
  * { box-sizing: border-box; }
  body { padding: 20px 18px 80px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 28px; line-height: 1.1; letter-spacing: -.03em; margin: 0 0 18px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--amber-text-secondary); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .hero { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 18px; margin-bottom: 16px; }
  .eyebrow { color: var(--amber-text-secondary); font-size: 14px; margin-bottom: 6px; }
  .total { font-size: clamp(42px, 12vw, 68px); line-height: .95; font-weight: 800; letter-spacing: -.055em; font-variant-numeric: tabular-nums; }
  .hero-meta { margin-top: 10px; color: var(--amber-text-secondary); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); margin-bottom: 18px; overflow: hidden; }
  .section-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 22px 4px 10px; }
  .section-head h2 { margin: 0; }
  .muted { color: var(--amber-text-secondary); }
  .small { font-size: 13px; }
  .month-bars { padding: 8px 0; }
  .month { width: 100%; min-height: 56px; border: 0; border-top: 1px solid var(--amber-separator); background: transparent; color: var(--amber-text); font: inherit; padding: 11px 14px; display: grid; grid-template-columns: minmax(58px, .8fr) minmax(120px, 3fr) minmax(74px, auto); align-items: center; gap: 12px; text-align: left; }
  .month:first-child { border-top: 0; }
  .month[aria-pressed="true"] { background: var(--amber-accent-soft); }
  .month-name { font-weight: 700; white-space: nowrap; }
  .track { height: 12px; background: var(--amber-fill); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; min-width: 3px; border-radius: inherit; background: var(--amber-accent); }
  .month-amount { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .category { border-top: 1px solid var(--amber-separator); }
  .category:first-child { border-top: 0; }
  .cat-head { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 14px 16px 10px; align-items: baseline; }
  .cat-name { font-size: 18px; font-weight: 750; min-width: 0; overflow-wrap: anywhere; }
  .cat-total { font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cat-bar { height: 6px; background: var(--amber-fill); border-radius: 999px; overflow: hidden; margin: 0 16px 4px; }
  .cat-fill { height: 100%; background: var(--amber-accent); border-radius: inherit; }
  .expense { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 10px 16px; min-height: 48px; align-items: center; }
  .expense + .expense { border-top: 1px solid var(--amber-separator); }
  .item { min-width: 0; overflow-wrap: anywhere; }
  .date { color: var(--amber-text-secondary); font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .amt { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { padding: 28px 18px; text-align: center; color: var(--amber-text-secondary); }
  .missing { padding: 18px; line-height: 1.45; }
  @media (max-width: 430px) {
    body { padding-left: 14px; padding-right: 14px; }
    .month { grid-template-columns: 1fr auto; gap: 8px 10px; }
    .track { grid-column: 1 / -1; grid-row: 2; }
  }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const parseMoney = (s) => { const n = parseFloat(String(s ?? "").replace(/\s/g, "").replace(",", ".")); return Number.isFinite(n) ? n : 0; };
  const money = (n) => n.toLocaleString("sv-SE", { maximumFractionDigits: 0 }) + " kr";
  const monthLabel = (ym) => {
    if (!/^\d{4}-\d{2}$/.test(ym)) return ym || "No date";
    const d = new Date(ym + "-01T00:00:00");
    return d.toLocaleDateString("en", { month: "short", year: "numeric" });
  };
  const col = (t, re) => t.columns.findIndex((c) => re.test(c.name));
  let selectedMonth = "";

  function getModel(note) {
    const table = note.tables.find((t) => col(t, /^(amt|amount|cost|price|sum|total|kr)$/i) >= 0 && col(t, /^date$/i) >= 0) || note.tables[0];
    if (!table) return { error: "Add a table with Date, Item, Category and Amt columns to see expenses here." };
    const dateCol = col(table, /^date$/i);
    const itemCol = col(table, /^(item|what|description|name|title)$/i);
    const catCol = col(table, /^(category|cat|type|group)$/i);
    const amtCol = col(table, /^(amt|amount|cost|price|sum|total|kr)$/i);
    const missing = [];
    if (dateCol < 0) missing.push("Date");
    if (amtCol < 0) missing.push("Amt");
    if (missing.length) return { error: "Add these columns to the expense table: " + missing.join(", ") + "." };
    const rows = table.rows.map((r, index) => {
      const date = String(r[dateCol] || "");
      return {
        index,
        date,
        month: /^\d{4}-\d{2}/.test(date) ? date.slice(0, 7) : "No date",
        item: itemCol >= 0 ? r[itemCol] : "Expense",
        category: (catCol >= 0 && String(r[catCol] || "").trim()) ? r[catCol] : "Uncategorised",
        amount: parseMoney(r[amtCol])
      };
    }).filter((r) => r.amount !== 0 || r.item || r.date);
    return { table, rows };
  }

  function render(note) {
    const app = document.getElementById("app");
    const model = getModel(note);
    if (model.error) {
      app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card missing">${esc(model.error)}</div>`;
      return;
    }
    const rows = model.rows;
    const monthTotals = new Map();
    rows.forEach((r) => monthTotals.set(r.month, (monthTotals.get(r.month) || 0) + r.amount));
    const months = [...monthTotals.entries()].sort((a, b) => b[0].localeCompare(a[0]));
    const todayMonth = (note.today || "").slice(0, 7);
    if (!selectedMonth || !monthTotals.has(selectedMonth)) selectedMonth = monthTotals.has(todayMonth) ? todayMonth : (months[0] ? months[0][0] : todayMonth);
    const selectedRows = rows.filter((r) => r.month === selectedMonth).sort((a, b) => b.date.localeCompare(a.date) || b.index - a.index);
    const selectedTotal = selectedRows.reduce((s, r) => s + r.amount, 0);
    const maxMonth = Math.max(1, ...months.map((m) => m[1]));
    const byCategory = new Map();
    selectedRows.forEach((r) => {
      if (!byCategory.has(r.category)) byCategory.set(r.category, { total: 0, rows: [] });
      const group = byCategory.get(r.category);
      group.total += r.amount;
      group.rows.push(r);
    });
    const categories = [...byCategory.entries()].sort((a, b) => b[1].total - a[1].total || a[0].localeCompare(b[0]));
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <section class="hero" aria-label="Selected monthly total">
        <div class="eyebrow">${esc(monthLabel(selectedMonth))} total</div>
        <div class="total">${money(selectedTotal)}</div>
        <div class="hero-meta"><span>${selectedRows.length} ${selectedRows.length === 1 ? "expense" : "expenses"}</span><span>${categories.length} ${categories.length === 1 ? "category" : "categories"}</span></div>
      </section>
      <div class="section-head"><h2>Monthly spending</h2><div class="small muted">Tap a month</div></div>
      <section class="card month-bars" aria-label="Monthly spending bars">
        ${months.length ? months.map(([month, total]) => `
          <button class="month" type="button" data-month="${esc(month)}" aria-pressed="${month === selectedMonth ? "true" : "false"}">
            <span class="month-name">${esc(monthLabel(month))}</span>
            <span class="track" aria-hidden="true"><span class="fill" style="width:${Math.max(2, total / maxMonth * 100).toFixed(1)}%"></span></span>
            <span class="month-amount">${money(total)}</span>
          </button>`).join("") : `<div class="empty">No expenses yet.</div>`}
      </section>
      <div class="section-head"><h2>By category</h2><div class="small muted">${esc(monthLabel(selectedMonth))}</div></div>
      <section class="card" aria-label="Expenses grouped by category">
        ${categories.length ? categories.map(([name, group]) => `
          <div class="category">
            <div class="cat-head"><div class="cat-name">${esc(name)}</div><div class="cat-total">${money(group.total)}</div></div>
            <div class="cat-bar" aria-hidden="true"><div class="cat-fill" style="width:${Math.max(3, group.total / (selectedTotal || 1) * 100).toFixed(1)}%"></div></div>
            ${group.rows.map((r) => `
              <div class="expense">
                <div class="item">${esc(r.item || "Expense")}<div class="date">${esc(r.date || "No date")}</div></div>
                <div class="amt">${money(r.amount)}</div>
              </div>`).join("")}
          </div>`).join("") : `<div class="empty">No expenses for ${esc(monthLabel(selectedMonth))}.</div>`}
      </section>`;
    app.querySelectorAll(".month").forEach((button) => {
      button.addEventListener("click", () => {
        selectedMonth = button.getAttribute("data-month") || selectedMonth;
        render(amber.note);
      });
    });
  }
  amber.onChange(render);
</script>
</body>
</html>
