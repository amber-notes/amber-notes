<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --card: var(--amber-surface); --ink: var(--amber-text); --muted: var(--amber-text-secondary); --line: var(--amber-separator); --accent: var(--amber-accent); --accent-ink: var(--amber-on-accent); --field: var(--amber-fill); --over: var(--amber-danger); --c0: var(--amber-accent); --c1: #2f7d5b; --c2: #3c63b0; --c3: #a3478a; --c4: #7a6a3a; --c5: var(--amber-text-secondary); }
  @media (prefers-color-scheme: dark) { :root { --c1: #5cc497; --c2: #8aa8ef; --c3: #e38ccb; --c4: #cdb779; } }
  * { box-sizing: border-box; }
  body { padding: 20px 18px 96px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 12px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 22px 4px 8px; }
  .total { font-size: 42px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .sub { color: var(--muted); font-variant-numeric: tabular-nums; }
  .sub.over { color: var(--over); font-weight: 600; }
  .meter { height: 12px; border-radius: 6px; background: var(--field); overflow: hidden; margin: 12px 0 4px; display: flex; }
  .meter div { height: 100%; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--amber-radius); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); min-height: 48px; }
  .row:first-child { border-top: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .muted { color: var(--muted); font-size: 14px; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .bar { height: 4px; border-radius: 2px; background: var(--field); margin-top: 6px; overflow: hidden; }
  .bar div { height: 100%; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
  label.wide { grid-column: 1 / -1; }
  input { font: inherit; font-size: 16px; color: var(--ink); background: var(--field); border: 0; border-radius: var(--amber-radius-small); padding: 10px 12px; min-height: 44px; width: 100%; }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--amber-radius-small); background: var(--accent); color: var(--accent-ink); }
  form button { grid-column: 1 / -1; }
  .chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { min-height: 36px; padding: 0 12px; font-weight: 500; background: var(--field); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--amber-accent-soft); color: var(--amber-accent-text); font-weight: 600; }
  .err { color: var(--over); padding: 0 16px 12px; min-height: 1em; }
  .ok { color: var(--muted); padding: 0 16px 12px; }
  .empty { padding: 24px 16px; text-align: center; color: var(--muted); }
  .set { display: flex; padding: 12px; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const num = (s) => { const n = parseFloat(String(s ?? "").replace(/[\s\u00a0]/g, "").replace(/kr|sek|\$|€|£/gi, "").replace(",", ".")); return Number.isFinite(n) ? n : NaN; };
  const col = (t, re) => t.columns.findIndex((c) => re.test(c.name));
  let error = "", msg = "", form = { item: "", amount: "", cat: "", date: "" };

  function limitFrom(note, data) {
    const l = Number(data && data.limit);
    if (l > 0) return l;
    const m = /limit[^:\n]*:\s*([\d\s\u00a0.,]+)/i.exec(note.markdown || "");
    const n = m ? num(m[1]) : NaN;
    return n > 0 ? n : 0;
  }

  function render(note, data) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => col(t, /amount|cost|price|^kr$|sum/i) >= 0);
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Date, Item, Category and Amount columns to the note.</div>`; return; }
    const a = col(t, /amount|cost|price|^kr$|sum/i), d = col(t, /^date$|^day$/i), c = col(t, /categ/i), it = col(t, /item|what|desc|name/i);
    const cur = (data && data.currency) || "kr";
    const money = (n) => n.toLocaleString("sv-SE", { maximumFractionDigits: 2 }) + " " + cur;
    const rows = t.rows.map((r, i) => ({ r, i, n: num(r[a]) || 0 }));
    const total = rows.reduce((s, x) => s + x.n, 0);
    const limit = limitFrom(note, data);
    const byCat = new Map();
    for (const x of rows) { const k = (c >= 0 && String(x.r[c]).trim()) || "other"; byCat.set(k, (byCat.get(k) || 0) + x.n); }
    const cats = [...byCat].sort((p, q) => q[1] - p[1]);
    const color = (i) => `var(--c${Math.min(i, 5)})`;
    const pct = limit ? Math.round((100 * total) / limit) : 0;
    const over = limit && total > limit;
    if (!form.date) form.date = note.today;

    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="total">${money(total)}</div>
      <div class="sub${over ? " over" : ""}">${limit ? (over ? `${money(total - limit)} over the ${money(limit)} limit` : `${money(limit - total)} left of ${money(limit)} · ${pct}% used`) : `${rows.length} expenses · no limit set`}</div>
      <div class="meter" role="img" aria-label="${limit ? `${pct}% of limit used` : "Spending by category"}">${cats.map(([k, v], i) => `<div style="width:${(100 * v) / Math.max(total, limit, 1)}%;background:${color(i)}"></div>`).join("")}</div>

      <h2>Add an expense</h2>
      <div class="card">
        <form id="add">
          <label>Amount (${esc(cur)})<input name="amount" inputmode="decimal" autocomplete="off" required value="${esc(form.amount)}"></label>
          <label>Date<input name="date" type="date" value="${esc(form.date)}"></label>
          ${it >= 0 ? `<label class="wide">What<input name="item" autocomplete="off" required value="${esc(form.item)}"></label>` : ""}
          ${c >= 0 ? `<label class="wide">Category<input name="cat" autocomplete="off" value="${esc(form.cat)}"></label>
          <div class="chips" role="group" aria-label="Pick a category">${cats.filter(([k]) => k !== "other" || rows.some((x) => x.r[c] === "other")).map(([k]) => `<button type="button" class="chip" data-cat="${esc(k)}" aria-pressed="${k === form.cat}">${esc(k)}</button>`).join("")}</div>` : ""}
          <button type="submit">Add expense</button>
        </form>
        ${error ? `<div class="err" role="alert">${esc(error)}</div>` : msg ? `<div class="ok">${esc(msg)}</div>` : ""}
      </div>

      <h2>By category</h2>
      <div class="card">${cats.length ? cats.map(([k, v], i) => `<div class="row"><span class="dot" style="background:${color(i)}" aria-hidden="true"></span><span class="grow">${esc(k)}<div class="bar"><div style="width:${(100 * v) / (cats[0][1] || 1)}%;background:${color(i)}"></div></div></span><span class="muted">${Math.round((100 * v) / (total || 1))}%</span><span class="num">${money(v)}</span></div>`).join("") : `<div class="empty">No expenses yet.</div>`}</div>

      <h2>Latest</h2>
      <div class="card">${rows.slice().sort((p, q) => (d >= 0 ? String(q.r[d]).localeCompare(String(p.r[d])) : 0) || q.i - p.i).slice(0, 8).map((x) => `<div class="row"><span class="grow">${esc(it >= 0 ? x.r[it] : "")}<br><span class="muted">${esc(d >= 0 ? x.r[d] : "")}${c >= 0 && x.r[c] ? " · " + esc(x.r[c]) : ""}</span></span><span class="num">${money(x.n)}</span></div>`).join("") || `<div class="empty">No expenses yet.</div>`}</div>

      <h2>Monthly limit</h2>
      <div class="card"><div class="set"><label class="grow">Limit (${esc(cur)})<input id="limit" inputmode="decimal" value="${limit || ""}"></label></div></div>`;

    const f = document.getElementById("add");
    const keep = () => { const fd = new FormData(f); form = { item: String(fd.get("item") ?? ""), amount: String(fd.get("amount") ?? ""), cat: String(fd.get("cat") ?? ""), date: String(fd.get("date") ?? "") }; };
    f.querySelectorAll(".chip").forEach((b) => b.onclick = () => { keep(); form.cat = b.dataset.cat; render(amber.note, amber.data); });
    document.getElementById("limit").onchange = async (e) => {
      const v = e.target.value.trim(); const n = num(v);
      if (v && !(n > 0)) { error = "Write the limit as a number."; render(amber.note, amber.data); return; }
      const r = await amber.setData({ limit: v ? n : null }); error = r.ok ? "" : r.error; msg = ""; if (!r.ok) render(amber.note, amber.data);
    };
    f.onsubmit = async (e) => {
      e.preventDefault(); keep();
      const n = num(form.amount);
      if (!(n > 0)) { error = "Write the amount as a number, like 89 or 412,50."; msg = ""; render(amber.note, amber.data); return; }
      const values = { [t.columns[a].name]: String(Math.round(n * 100) / 100) };
      if (it >= 0) values[t.columns[it].name] = form.item.trim();
      if (c >= 0) values[t.columns[c].name] = form.cat.trim().toLowerCase();
      if (d >= 0) values[t.columns[d].name] = /^\d{4}-\d{2}-\d{2}$/.test(form.date) ? form.date : note.today;
      const r = await amber.update({ op: "append_row", table: t.index, values });
      error = r.ok ? "" : r.error;
      msg = r.ok ? `Added ${money(n)}${form.item.trim() ? " · " + form.item.trim() : ""}.` : "";
      if (r.ok) form = { item: "", amount: "", cat: "", date: "" };
      render(amber.note, amber.data);
    };
  }
  amber.onChange(render);
</script>
</body>
</html>
