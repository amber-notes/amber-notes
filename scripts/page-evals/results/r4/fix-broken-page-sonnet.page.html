<!doctype html>
<!-- template: budget | Spending this month against a limit, by category, with a month picker and a quick add form. The limit lives in page data. | A table with Date (yyyy-mm-dd), an amount column (Amount, Cost, Price, Kr or Sum) and optionally Item and Category columns. Optional amber.data.limit (a number) and amber.data.currency ("kr"). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: var(--amber-bg); --card: var(--amber-surface); --ink: var(--amber-text); --muted: var(--amber-text-secondary); --line: var(--amber-separator); --accent: var(--amber-accent); --accent-ink: var(--amber-on-accent); --field: var(--amber-fill); --over: var(--amber-danger); --c0: var(--amber-accent); --c1: #2f7d5b; --c2: #3c63b0; --c3: #a3478a; --c4: var(--amber-text-secondary); }
  @media (prefers-color-scheme: dark) { :root { --c1: #5cc497; --c2: #8aa8ef; --c3: #e38ccb; } }
  * { box-sizing: border-box; }
  body { padding: 20px 18px 96px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 12px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 22px 4px 8px; }
  .top { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .total { font-size: 42px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .sub { color: var(--muted); }
  .sub.over { color: var(--over); font-weight: 600; }
  .meter { height: 10px; border-radius: 5px; background: var(--field); overflow: hidden; margin: 12px 0 4px; display: flex; }
  .meter div { height: 100%; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--amber-radius); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); min-height: 48px; }
  .row:first-child { border-top: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .muted { color: var(--muted); font-size: 14px; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
  input, select { font: inherit; font-size: 16px; color: var(--ink); background: var(--field); border: 0; border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); }
  form button { grid-column: 1 / -1; }
  .month { min-height: 40px; width: auto; }
  .err { color: var(--over); padding: 0 16px 12px; min-height: 1em; }
  .empty { padding: 24px 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const num = (s) => { const n = parseFloat(String(s ?? "").replace(/[\s ]/g, "").replace(/kr|sek|\$|€|£/gi, "").replace(",", ".")); return Number.isFinite(n) ? n : 0; };
  const col = (t, re) => t.columns.findIndex((c) => re.test(c.name));
  let error = "", month = null, form = { item: "", amount: "", cat: "" };

  function render(note, data) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => col(t, /amount|^amt$|cost|price|^kr$|sum|belopp/i) >= 0);
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Date, Item, Category and Amount columns to the note.</div>`; return; }
    const a = col(t, /amount|^amt$|cost|price|^kr$|sum|belopp/i), d = col(t, /^date$|^day$|datum/i), c = col(t, /categ|kategori|type/i), it = col(t, /item|what|desc|name|vad/i);
    const cur = (data && data.currency) || "kr";
    const money = (n) => n.toLocaleString("sv-SE", { maximumFractionDigits: 2 }) + " " + cur;
    const months = [...new Set(t.rows.map((r) => (d >= 0 ? String(r[d]).slice(0, 7) : "")).filter((m) => /^\d{4}-\d{2}$/.test(m)))].sort();
    if (!month) month = months.includes(note.today.slice(0, 7)) ? note.today.slice(0, 7) : months[months.length - 1] || null;
    const rows = t.rows.map((r, i) => ({ r, i, n: num(r[a]) })).filter((x) => d < 0 || !month || String(x.r[d]).startsWith(month));
    const total = rows.reduce((s, x) => s + x.n, 0);
    const limit = Number(data && data.limit) || 0;
    const byCat = new Map();
    for (const x of rows) { const k = (c >= 0 && x.r[c]) || "Other"; byCat.set(k, (byCat.get(k) || 0) + x.n); }
    const cats = [...byCat].sort((p, q) => q[1] - p[1]);
    const color = (i) => `var(--c${Math.min(i, 4)})`;
    const allCats = [...new Set(t.rows.map((r) => (c >= 0 ? r[c] : "")).filter(Boolean))];
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="top">
        <div><div class="total">${money(total)}</div>
          <div class="sub${limit && total > limit ? " over" : ""}">${limit ? (total > limit ? `${money(total - limit)} over the ${money(limit)} limit` : `${money(limit - total)} left of ${money(limit)}`) : `${rows.length} expenses`}</div></div>
        ${months.length > 1 ? `<label>Month<select class="month" id="month">${months.map((m) => `<option ${m === month ? "selected" : ""}>${m}</option>`).join("")}</select></label>` : ""}
      </div>
      <div class="meter" role="img" aria-label="Spending by category">${cats.map(([k, v], i) => `<div style="width:${(100 * v) / Math.max(total, limit, 1)}%;background:${color(i)}"></div>`).join("")}</div>
      <h2>By category</h2>
      <div class="card">${cats.length ? cats.map(([k, v], i) => `<div class="row"><span class="dot" style="background:${color(i)}" aria-hidden="true"></span><span class="grow">${esc(k)}</span><span class="muted">${Math.round((100 * v) / (total || 1))}%</span><span class="num">${money(v)}</span></div>`).join("") : `<div class="empty">Nothing this month.</div>`}</div>
      <h2>Add an expense</h2>
      <div class="card">
        <form id="add">
          ${it >= 0 ? `<label>What<input name="item" required value="${esc(form.item)}"></label>` : ""}
          <label>Amount<input name="amount" inputmode="decimal" required value="${esc(form.amount)}"></label>
          ${c >= 0 ? `<label>Category<input name="cat" list="cats" value="${esc(form.cat)}"><datalist id="cats">${allCats.map((k) => `<option value="${esc(k)}">`).join("")}</datalist></label>` : ""}
          <label>Limit this month<input name="limit" inputmode="decimal" value="${limit || ""}"></label>
          <button>Add</button>
        </form>
        <div class="err" role="alert">${esc(error)}</div>
      </div>
      <h2>Latest</h2>
      <div class="card">${rows.slice().reverse().slice(0, 8).map((x) => `<div class="row"><span class="grow">${esc(it >= 0 ? x.r[it] : "")}<br><span class="muted">${esc(d >= 0 ? x.r[d] : "")}${c >= 0 && x.r[c] ? " · " + esc(x.r[c]) : ""}</span></span><span class="num">${money(x.n)}</span></div>`).join("") || `<div class="empty">No expenses yet.</div>`}</div>`;

    const m = document.getElementById("month");
    if (m) m.onchange = () => { month = m.value; render(amber.note, amber.data); };
    const f = document.getElementById("add");
    f.limit.onchange = async () => { const r = await amber.setData({ limit: f.limit.value.trim() ? num(f.limit.value) : null }); error = r.ok ? "" : r.error; if (!r.ok) render(amber.note, amber.data); };
    f.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(f);
      form = { item: String(fd.get("item") ?? ""), amount: String(fd.get("amount") ?? ""), cat: String(fd.get("cat") ?? "") };
      if (!num(form.amount)) { error = "Write the amount as a number."; render(amber.note, amber.data); return; }
      const values = { [t.columns[a].name]: form.amount.trim() };
      if (it >= 0) values[t.columns[it].name] = form.item.trim();
      if (c >= 0) values[t.columns[c].name] = form.cat.trim();
      if (d >= 0) values[t.columns[d].name] = note.today;
      const r = await amber.update({ op: "append_row", table: t.index, values });
      error = r.ok ? "" : r.error;
      if (r.ok) form = { item: "", amount: "", cat: "" };
      render(amber.note, amber.data);
    };
  }
  amber.onChange(render);
</script>
</body>
</html>
