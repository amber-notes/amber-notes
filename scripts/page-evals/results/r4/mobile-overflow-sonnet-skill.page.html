<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}
body{padding:20px 18px 64px;max-width:680px;margin:0 auto}
h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 16px}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);margin-bottom:12px;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;font-weight:600;font-size:17px}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--amber-accent-soft);color:var(--amber-accent-text)}
.m{display:flex;gap:12px;padding:10px 16px;border-top:1px solid var(--amber-separator)}
.m span:first-child{flex:0 0 84px;color:var(--amber-text-secondary);font-size:14px}
.m span:last-child{flex:1;min-width:0;overflow-wrap:anywhere}
.note{padding:10px 16px;border-top:1px solid var(--amber-separator);color:var(--amber-text-secondary);font-size:14px;overflow-wrap:anywhere}
.empty{padding:28px 16px;text-align:center;color:var(--amber-text-secondary)}
</style></head><body><main id="app"></main><script>
const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
amber.onChange((note)=>{
const tb=note.tables[0];let h="<h1>"+esc(note.title)+"</h1>";
if(!tb||!tb.rows.length){app.innerHTML=h+'<div class="card empty">Add rows to the table in the note.</div>';return}
const ix=(re)=>tb.columns.findIndex((c)=>re.test(c.name));
const d=ix(/^day$/i),s=ix(/^shop$/i),n=ix(/^notes?$/i);
h+=tb.rows.map((r)=>{
const shop=s>=0&&/^(yes|y|✓|x|1|true)$/i.test((r[s]||"").trim());
let o='<section class="card"><div class="head"><span>'+esc(d>=0?r[d]:"")+"</span>"+(shop?'<span class="badge">Shop</span>':"")+"</div>";
tb.columns.forEach((c,i)=>{if(i===d||i===s||i===n||!r[i])return;o+='<div class="m"><span>'+esc(c.name)+"</span><span>"+esc(r[i])+"</span></div>"});
if(n>=0&&r[n])o+='<div class="note">'+esc(r[n])+"</div>";
return o+"</section>"}).join("");
app.innerHTML=h});
</script></body></html>
