<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{max-width:680px;margin:0 auto;padding:20px 18px 96px}h1{font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:4px 0 8px}h2{font-size:18px;margin:0}.muted{color:var(--amber-text-secondary)}.summary{margin:0 0 18px;color:var(--amber-text-secondary)}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);margin:0 0 16px;overflow:hidden}.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--amber-separator)}.count{font-variant-numeric:tabular-nums;color:var(--amber-text-secondary);white-space:nowrap}.item{display:flex;align-items:flex-start;gap:12px;min-height:52px;padding:12px 16px;border-top:1px solid var(--amber-separator)}.item:first-child{border-top:0}.item input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:28px;height:28px;margin:0;border:2px solid var(--amber-text-secondary);border-radius:8px;background:var(--amber-fill);position:relative}.item input[type=checkbox]:checked{background:var(--amber-accent);border-color:var(--amber-accent)}.item input[type=checkbox]:checked::after{content:"";position:absolute;left:8px;top:3px;width:7px;height:14px;border:solid var(--amber-on-accent);border-width:0 3px 3px 0;transform:rotate(45deg)}.item span{min-width:0;overflow-wrap:anywhere;padding-top:3px}.item.done span{text-decoration:line-through;color:var(--amber-text-secondary)}form{display:grid;gap:12px;padding:16px}.fields{display:grid;gap:12px}label{display:grid;gap:6px;font-size:14px;color:var(--amber-text-secondary)}input[type=text],select{font:inherit;color:var(--amber-text);background:var(--amber-fill);border:1px solid var(--amber-separator);border-radius:var(--amber-radius-small);padding:10px 12px;min-height:44px;width:100%}button{font:inherit;font-weight:700;min-height:46px;padding:0 16px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-accent);color:var(--amber-on-accent)}button:disabled{opacity:.55}.empty{padding:26px 16px;text-align:center;color:var(--amber-text-secondary)}.message{min-height:1.3em;padding:0 16px 16px;color:var(--amber-text-secondary)}.message.err{color:var(--amber-danger)}:focus-visible{outline:3px solid var(--amber-accent);outline-offset:3px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}@media(min-width:560px){.fields{grid-template-columns:1fr 1.4fr auto;align-items:end}button{min-width:120px}}
</style>
</head>
<body>
<main id="app" aria-labelledby="pageTitle"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const norm=s=>String(s||"").trim().toLowerCase();
let status="";let isError=false;
function col(t,re){return t.columns.findIndex(c=>re.test(c.name));}
function isYes(v){return /^(yes|true|1|x|✓|done|packed)$/i.test(String(v||"").trim());}
function choices(column,rows,idx){let out=[];let m=String(column?.type||"").match(/^choice\s+(.+)$/i);if(m)out=m[1].split("|").map(s=>s.trim()).filter(Boolean);rows.forEach(r=>{let v=String(r[idx]||"").trim();if(v&&!out.some(x=>norm(x)===norm(v)))out.push(v);});if(!out.length)out=["Other"];return out;}
function render(note){
 const app=document.getElementById("app");
 const t=note.tables.find(tb=>col(tb,/^category$/i)>=0&&col(tb,/^(item|name|thing)$/i)>=0&&col(tb,/^(packed|done|status)$/i)>=0);
 if(!t){app.innerHTML=`<h1 id="pageTitle">${esc(note.title)}</h1><div class="card empty" role="status">Add a table with Category, Item and Packed columns to use this packing page.</div>`;return;}
 const cCat=col(t,/^category$/i),cItem=col(t,/^(item|name|thing)$/i),cPacked=col(t,/^(packed|done|status)$/i);
 const total=t.rows.length,done=t.rows.filter(r=>isYes(r[cPacked])).length;
 const cats=choices(t.columns[cCat],t.rows,cCat);
 const groups=[];cats.forEach(cat=>{let rows=[];t.rows.forEach((r,i)=>{if(norm(r[cCat])===norm(cat))rows.push({r,i});});if(rows.length)groups.push({cat,rows});});
 t.rows.forEach((r,i)=>{let cat=String(r[cCat]||"Other").trim()||"Other";if(!groups.some(g=>norm(g.cat)===norm(cat)))groups.push({cat,rows:[{r,i}]});});
 const groupHtml=groups.length?groups.map(g=>{let packed=g.rows.filter(x=>isYes(x.r[cPacked])).length;return `<section class="card" aria-labelledby="cat-${esc(g.cat).replace(/\W+/g,"-")}"><div class="head"><h2 id="cat-${esc(g.cat).replace(/\W+/g,"-")}">${esc(g.cat)}</h2><span class="count">${packed} of ${g.rows.length} packed</span></div>${g.rows.map(({r,i})=>{let checked=isYes(r[cPacked]);let id=`pack-${i}`;let item=String(r[cItem]||"Untitled item");return `<label class="item${checked?" done":""}" for="${id}"><input id="${id}" type="checkbox" data-row="${i}" ${checked?"checked":""} aria-label="${checked?"Packed":"Not packed"}: ${esc(item)}"><span>${esc(item)}</span></label>`;}).join("")}</section>`;}).join(""):`<div class="card empty">No packing items yet. Add the first one below.</div>`;
 app.innerHTML=`<h1 id="pageTitle">${esc(note.title)}</h1><p class="summary" id="summaryText">${done} of ${total} items packed. Use the checkboxes to mark items packed or not packed.</p>${groupHtml}<section class="card" aria-labelledby="addHeading"><div class="head"><h2 id="addHeading">Add an item</h2></div><form id="addForm" aria-describedby="formHelp msg"><div class="fields"><label for="category">Category<select id="category" name="category">${cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></label><label for="itemText">Item name<input id="itemText" name="item" type="text" autocomplete="off" required></label><button id="addButton" type="submit">Add item</button></div><p class="muted" id="formHelp">New items are added as not packed.</p></form><div id="msg" class="message${isError?" err":""}" role="status" aria-live="polite">${esc(status)}</div></section>`;
 app.querySelectorAll('input[type="checkbox"][data-row]').forEach(box=>{box.addEventListener("change",async e=>{let row=Number(e.currentTarget.dataset.row);let value=e.currentTarget.checked?"Yes":"No";e.currentTarget.disabled=true;status="Updating item…";isError=false;let r=await amber.update({op:"set_cell",table:t.index,row:row,col:t.columns[cPacked].name,value:value});if(r.ok){status=value==="Yes"?"Marked packed.":"Marked not packed.";isError=false;render(amber.note);}else{status=r.error||"Could not update the item.";isError=true;e.currentTarget.checked=!e.currentTarget.checked;e.currentTarget.disabled=false;render(amber.note);}});});
 document.getElementById("addForm").addEventListener("submit",async e=>{e.preventDefault();let form=e.currentTarget;let data=new FormData(form);let item=String(data.get("item")||"").trim();let category=String(data.get("category")||cats[0]||"Other").trim();if(!item){status="Enter an item name.";isError=true;render(amber.note);return;}let btn=document.getElementById("addButton");btn.disabled=true;status="Adding item…";isError=false;let r=await amber.update({op:"append_row",table:t.index,values:{[t.columns[cCat].name]:category,[t.columns[cItem].name]:item,[t.columns[cPacked].name]:"No"}});if(r.ok){status=`Added ${item}.`;isError=false;form.reset();render(amber.note);}else{status=r.error||"Could not add the item.";isError=true;btn.disabled=false;render(amber.note);}});
}
amber.onChange((note)=>render(note));
</script>
</body>
</html>
