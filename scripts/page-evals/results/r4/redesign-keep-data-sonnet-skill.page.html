<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household expenses</title>
<style>
  * { box-sizing: border-box; }
  body { padding: 20px 18px 80px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 8px; }
  .hero { margin: 8px 0 20px; }
  .big { font-size: 52px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .muted { color: var(--amber-text-secondary); font-size: 14px; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 0 4px 8px; }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); border: 1px solid var(--amber-separator); margin-bottom: 20px; overflow: hidden; }
  .chart { display: flex; align-items: flex-end; gap: 10px; padding: 16px 12px 8px; overflow-x: auto; }
  .m { flex: 1 0 64px; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; color: var(--amber-text); border: 0; padding: 6px 4px; min-height: 44px; border-radius: var(--amber-radius-small); font: inherit; }
  .m[aria-pressed="true"] { background: var(--amber-accent-soft); }
  .track { height: 120px; width: 100%; display: flex; align-items: flex-end; }
  .fill { width: 100%; background: var(--amber-text-secondary); border-radius: 6px 6px 2px 2px; min-height: 3px; opacity: .55; }
  .m[aria-pressed="true"] .fill { background: var(--amber-accent); opacity: 1; }
  .mv { font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .ml { font-size: 13px; color: var(--amber-text-secondary); }
  .head { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; background: var(--amber-fill); font-weight: 700; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--amber-separator); min-height: 48px; }
  .head + .row { border-top: 0; }
  .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  form { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--amber-text-secondary); flex: 1 1 120px; }
  input { font: inherit; color: var(--amber-text); background: var(--amber-fill); border: 0; border-radius: var(--amber-radius-small); padding: 10px 12px; min-height: 44px; width: 100%; }
  button.add { font: inherit; font-weight: 600; min-height: 44px; padding: 0 20px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-accent); color: var(--amber-on-accent); align-self: flex-end; }
  .err { color: var(--amber-danger); padding: 0 16px 12px; }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const fmt = (n) => Math.round(n).toLocaleString("sv-SE", { maximumFractionDigits: 0 });
  const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const mname = (k) => MN[parseInt(k.slice(5, 7), 10) - 1] + " " + k.slice(0, 4);
  let error = "";

  function render(note, data) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => t.columns.some((c) => /^(amt|amount|cost|price|kr|sum)$/i.test(c.name)));
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Date, Item, Category and Amt columns.</div>`; return; }
    const ci = (re) => t.columns.findIndex((c) => re.test(c.name));
    const a = ci(/^(amt|amount|cost|price|kr|sum)$/i), cat = ci(/^categ/i), item = ci(/^(item|what|description)$/i), date = ci(/^date$/i);
    const rows = t.rows.map((r) => ({
      date: date >= 0 ? r[date] : "", item: item >= 0 ? r[item] : "", cat: (cat >= 0 && r[cat]) || "Other",
      n: parseFloat(String(r[a]).replace(/\s/g, "").replace(",", ".")) || 0,
    }));
    const byMonth = new Map();
    for (const x of rows) { const k = /^\d{4}-\d{2}/.test(x.date) ? x.date.slice(0, 7) : "none"; byMonth.set(k, (byMonth.get(k) || 0) + x.n); }
    const months = [...byMonth.keys()].filter((k) => k !== "none").sort();
    if (!months.length) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">No dated expenses yet.</div>`; return; }
    const thisM = note.today.slice(0, 7);
    let sel = data && data.month;
    if (!months.includes(sel)) sel = months.includes(thisM) ? thisM : months[months.length - 1];
    const max = Math.max(...months.map((k) => byMonth.get(k)), 1);
    const inM = rows.filter((x) => x.date.slice(0, 7) === sel);
    const groups = new Map();
    for (const x of inM) { if (!groups.has(x.cat)) groups.set(x.cat, []); groups.get(x.cat).push(x); }
    const gs = [...groups].map(([k, v]) => [k, v, v.reduce((s, x) => s + x.n, 0)]).sort((p, q) => q[2] - p[2]);

    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="hero"><div class="muted">${esc(mname(sel))}</div><div class="big">${fmt(byMonth.get(sel))} kr</div><div class="muted">${inM.length} ${inM.length === 1 ? "entry" : "entries"}</div></div>
      <div class="label">By month</div>
      <div class="card"><div class="chart">${months.map((k) => `<button type="button" class="m" data-m="${k}" aria-pressed="${k === sel}" aria-label="${esc(mname(k))}: ${fmt(byMonth.get(k))} kr"><span class="mv">${fmt(byMonth.get(k))}</span><span class="track"><span class="fill" style="height:${(100 * byMonth.get(k) / max).toFixed(1)}%"></span></span><span class="ml">${MN[parseInt(k.slice(5), 10) - 1]}</span></button>`).join("")}</div></div>
      <div class="label">By category</div>
      ${gs.map(([k, v, s]) => `<div class="card"><div class="head"><span>${esc(k)}</span><span class="num">${fmt(s)} kr</span></div>${v.map((x) => `<div class="row"><div class="grow">${esc(x.item)}<div class="muted">${esc(x.date)}</div></div><div class="num">${fmt(x.n)} kr</div></div>`).join("")}</div>`).join("") || '<div class="card empty">Nothing this month.</div>'}
      <div class="label">Add an expense</div>
      <div class="card">
        <form id="add">
          <label>Item<input name="item" required></label>
          <label>Category<input name="cat" list="cats" required></label>
          <label>Amount<input name="amount" inputmode="decimal" required></label>
          <datalist id="cats">${[...new Set(rows.map((x) => x.cat))].map((c) => `<option value="${esc(c)}">`).join("")}</datalist>
          <button class="add">Add</button>
        </form>
        <div class="err" role="alert">${esc(error)}</div>
      </div>`;
    app.querySelectorAll(".m").forEach((b) => b.onclick = () => amber.setData({ month: b.dataset.m }));
    document.getElementById("add").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const values = { [t.columns[a].name]: String(f.get("amount")).trim() };
      if (item >= 0) values[t.columns[item].name] = String(f.get("item")).trim();
      if (cat >= 0) values[t.columns[cat].name] = String(f.get("cat")).trim();
      if (date >= 0) values[t.columns[date].name] = note.today;
      const r = await amber.update({ op: "append_row", table: t.index, values });
      error = r.ok ? "" : r.error;
      if (!r.ok) render(amber.note, amber.data);
    };
  }
  amber.onChange(render);
</script>
</body>
</html>
