<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{padding:20px 16px 88px;max-width:760px;margin:0 auto;color:var(--amber-text)}h1{font-size:32px;letter-spacing:-.03em;margin:0 0 8px}h2{margin:22px 2px 8px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--amber-text-secondary);display:flex;justify-content:space-between;gap:12px}.hero{display:grid;grid-template-columns:1fr;gap:10px;margin:8px 0 4px}.count{background:var(--amber-accent-soft);border-radius:var(--amber-radius);padding:16px;border:1px solid var(--amber-separator)}.count b{font-size:42px;line-height:1;letter-spacing:-.04em}.count span{color:var(--amber-text-secondary);margin-left:8px}.dates{margin-top:6px;color:var(--amber-text-secondary)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}.fact{padding:13px 14px;border-top:1px solid var(--amber-separator)}.fact:first-child{border-top:0}.fact .k{font-size:12px;color:var(--amber-text-secondary);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}.fact .v{overflow-wrap:anywhere;line-height:1.35}.check{display:flex;align-items:center;gap:12px;min-height:46px;padding:10px 14px;border-top:1px solid var(--amber-separator);cursor:pointer}.check:first-child{border-top:0}.check input{width:22px;height:22px;flex:none;accent-color:var(--amber-accent)}.check.done span{color:var(--amber-text-secondary);text-decoration:line-through}.bar{height:7px;background:var(--amber-fill);border-radius:99px;overflow:hidden;margin:0 2px 8px}.bar div{height:100%;background:var(--amber-accent)}.empty{padding:14px;color:var(--amber-text-secondary)}.err{min-height:1.2em;margin:10px 2px;color:var(--amber-danger)}@media(max-width:560px){.grid{grid-template-columns:1fr}body{padding-left:14px;padding-right:14px}.count b{font-size:36px}}
</style>
</head>
<body><main id="app"></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s??'').replace(/\*\*|__|`/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').trim();
let error='';
function lineVal(lines,label){const r=new RegExp('^\\s*'+label+'\\s*[:~]\\s*(.+)$','i');for(const l of lines){const m=l.match(r);if(m)return clean(m[1])}return''}
function prettyDate(iso){const d=new Date(iso+'T12:00:00Z');return d.toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'})}
function factsFrom(lines){const flights=lineVal(lines,'flights'),hotel=lineVal(lines,'hotel'),budget=lineVal(lines,'budget');let facts=[];if(flights){const m=flights.match(/^out\s+(.+?),\s*back\s+(.+)$/i);if(m){facts.push(['Flight out',m[1]]);facts.push(['Flight back',m[2]])}else facts.push(['Flights',flights])}if(hotel)facts.push(['Hotel',hotel]);if(budget)facts.push(['Budget',budget]);return facts}
function groups(note){const lines=note.markdown.split('\n'),out=[];for(const c of note.checklists){let h='To-dos';for(let i=c.line-2;i>=0;i--){const m=lines[i].match(/^#{1,6}\s+(.*)$/);if(m){h=clean(m[1]);break}}let g=out.find(x=>x.h===h);if(!g)out.push(g={h,items:[]});g.items.push(c)}return out}
function render(note,data){const lines=note.markdown.split('\n');const start=(data&&data.start)||'2026-10-16';const end=(data&&data.end)||'2026-10-18';const diff=Math.round((Date.parse(start+'T12:00:00Z')-Date.parse(note.today+'T12:00:00Z'))/864e5);const count=diff>0?`<b>${diff}</b><span>day${diff===1?'':'s'} until Porto</span>`:diff===0?`<b>Today</b><span>Porto starts</span>`:`<b>${-diff}</b><span>day${diff===-1?'':'s'} since the trip</span>`;const facts=factsFrom(lines);const gs=groups(note);document.getElementById('app').innerHTML=`<h1>${esc(note.title)}</h1><section class="hero"><div class="count">${count}<div class="dates">${esc(prettyDate(start))} – ${esc(prettyDate(end))}</div></div></section><h2><span>Flights & hotel at a glance</span></h2><div class="card grid">${facts.map(f=>`<div class="fact"><div class="k">${esc(f[0])}</div><div class="v">${esc(f[1])}</div></div>`).join('')}</div>${gs.map(g=>{const done=g.items.filter(x=>x.checked).length;return `<h2><span>${esc(g.h)}</span><span>${done}/${g.items.length}</span></h2><div class="bar"><div style="width:${g.items.length?100*done/g.items.length:0}%"></div></div><div class="card">${g.items.length?g.items.map(c=>`<label class="check ${c.checked?'done':''}"><input type="checkbox" data-line="${c.line}" ${c.checked?'checked':''}><span>${esc(clean(c.text))}</span></label>`).join(''):'<div class="empty">Nothing here yet.</div>'}</div>`}).join('')}<div class="err" role="alert">${esc(error)}</div>`;document.querySelectorAll('[data-line]').forEach(box=>box.addEventListener('change',async()=>{const r=await amber.update({op:'toggle_checklist',line:Number(box.dataset.line)});error=r.ok?'':r.error;if(!r.ok)render(amber.note,amber.data)}))}
amber.onChange(render);
</script></body></html>
