<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household expenses</title>
<style>
  * { box-sizing: border-box; }
  body { padding: 12px 18px 80px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 6px 0 0; }
  .hero { margin: 14px 0 20px; }
  .hero .lbl { color: var(--amber-text-secondary); font-size: 15px; }
  .total { font-size: 52px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.05; margin: 4px 0; overflow-wrap: anywhere; }
  .delta { color: var(--amber-text-secondary); font-size: 14px; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 0 4px 8px; }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); margin-bottom: 22px; overflow: hidden; }
  .chart { display: flex; align-items: flex-end; gap: 6px; padding: 14px 12px 8px; overflow-x: auto; }
  .mbtn { flex: 1 0 44px; max-width: 72px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 4px 2px; font: inherit; color: var(--amber-text); border-radius: var(--amber-radius-small); min-height: 44px; cursor: pointer; }
  .mbtn .v { font-size: 11px; color: var(--amber-text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mbtn .track { height: 130px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .mbtn .b { width: 70%; max-width: 34px; min-height: 3px; border-radius: 6px 6px 2px 2px; background: var(--amber-accent-soft); }
  .mbtn .m { font-size: 12px; color: var(--amber-text-secondary); }
  .mbtn[aria-pressed="true"] .b { background: var(--amber-accent); }
  .mbtn[aria-pressed="true"] .m { color: var(--amber-accent-text); font-weight: 700; }
  .mbtn[aria-pressed="true"] .v { color: var(--amber-text); font-weight: 600; }
  .group { border-top: 1px solid var(--amber-separator); }
  .group:first-child { border-top: 0; }
  .ghead { display: flex; align-items: center; gap: 10px; padding: 12px 16px 6px; }
  .ghead .name { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
  .pct { color: var(--amber-text-secondary); font-size: 13px; font-variant-numeric: tabular-nums; }
  .share { height: 4px; margin: 0 16px 6px; background: var(--amber-fill); border-radius: 2px; overflow: hidden; }
  .share div { height: 100%; background: var(--amber-accent); }
  .item { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 28px; min-height: 44px; }
  .item .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .muted { color: var(--amber-text-secondary); font-size: 13px; }
  .amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .group .item:last-child { padding-bottom: 12px; }
  form { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; }
  form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--amber-text-secondary); flex: 1 1 130px; min-width: 0; }
  form label.small { flex: 1 1 90px; }
  input { font: inherit; font-size: 16px; padding: 10px 12px; min-height: 44px; border-radius: var(--amber-radius-small); border: 0; background: var(--amber-fill); color: var(--amber-text); width: 100%; min-width: 0; }
  .add { font: inherit; font-weight: 600; min-height: 44px; border: 0; border-radius: var(--amber-radius-small); padding: 0 18px; background: var(--amber-accent); color: var(--amber-on-accent); align-self: flex-end; flex: 1 1 80px; }
  .err { color: var(--amber-danger); font-size: 14px; padding: 0 16px 12px; }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const group = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0");
  const kr = (n) => (n < 0 ? "−" : "") + group(Math.abs(n)) + "\u00a0kr";
  const short = (n) => n >= 10000 ? (n / 1000).toFixed(0) + "k" : n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(Math.round(n));
  const num = (s) => { const v = parseFloat(String(s ?? "").replace(/[\s\u00a0]/g, "").replace(/kr/i, "").replace(",", ".")); return isNaN(v) ? 0 : v; };
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const mShort = (ym) => MONTHS[+ym.slice(5, 7) - 1] || ym;
  const mLong = (ym) => (LONG[+ym.slice(5, 7) - 1] || ym) + " " + ym.slice(0, 4);
  const prevMonth = (ym) => { let y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1; if (m === 0) { y--; m = 12; } return y + "-" + String(m).padStart(2, "0"); };
  // Write amounts the way the note does: "1 210".
  const fmtIn = (s) => { s = s.trim().replace(/[\s\u00a0]/g, ""); return /^\d+$/.test(s) ? s.replace(/\B(?=(\d{3})+(?!\d))/g, " ") : s; };
  let error = "";

  function render(note, data) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => t.columns.some((c) => /^(amt|amount|cost|price|sum|kr)$/i.test(c.name.trim())));
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Date, Item, Category and Amt columns to see your spending here.</div>`; return; }
    const col = (re) => t.columns.findIndex((c) => re.test(c.name.trim()));
    const a = col(/^(amt|amount|cost|price|sum|kr)$/i), cat = col(/^categ/i), item = col(/^(item|what|description|name)$/i), date = col(/^date$/i);

    const rows = t.rows.map((r, i) => ({ i, r, n: num(r[a]), d: date >= 0 ? String(r[date] || "").trim() : "", c: (cat >= 0 && String(r[cat] || "").trim()) || "Other" }));
    const byMonth = new Map();
    for (const x of rows) { const ym = /^\d{4}-\d{2}/.test(x.d) ? x.d.slice(0, 7) : ""; if (ym) byMonth.set(ym, (byMonth.get(ym) || 0) + x.n); }
    const todayYm = note.today.slice(0, 7);
    if (!byMonth.has(todayYm)) byMonth.set(todayYm, 0);
    const months = [...byMonth.keys()].sort().slice(-12);
    const sel = data && data.month && byMonth.has(data.month) ? data.month : todayYm;
    const total = byMonth.get(sel) || 0;
    const prev = prevMonth(sel);
    const prevTotal = byMonth.get(prev);
    const max = Math.max(1, ...months.map((m) => byMonth.get(m)));

    const inMonth = rows.filter((x) => x.d.startsWith(sel));
    const groups = new Map();
    for (const x of inMonth) { if (!groups.has(x.c)) groups.set(x.c, { sum: 0, items: [] }); const g = groups.get(x.c); g.sum += x.n; g.items.push(x); }
    const cats = [...groups].sort((p, q) => q[1].sum - p[1].sum);
    const allCats = [...new Set(rows.map((x) => x.c))].sort();

    let delta = "";
    if (prevTotal !== undefined && prevTotal > 0) {
      const diff = total - prevTotal;
      delta = `${diff >= 0 ? kr(diff) + " more" : kr(-diff) + " less"} than ${mLong(prev).split(" ")[0]}`;
    }

    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <section class="hero">
        <div class="lbl">${esc(mLong(sel))}${sel === todayYm ? " · this month" : ""}</div>
        <div class="total">${kr(total)}</div>
        <div class="delta">${inMonth.length} ${inMonth.length === 1 ? "expense" : "expenses"}${delta ? " · " + esc(delta) : ""}</div>
      </section>

      <div class="label">By month</div>
      <div class="card"><div class="chart" role="group" aria-label="Spending per month">
        ${months.map((m) => { const v = byMonth.get(m); return `<button class="mbtn" data-m="${m}" aria-pressed="${m === sel}" aria-label="${esc(mLong(m))}: ${esc(kr(v))}">
          <span class="v">${short(v)}</span>
          <span class="track"><span class="b" style="height:${(100 * v / max).toFixed(1)}%"></span></span>
          <span class="m">${esc(mShort(m))}</span></button>`; }).join("")}
      </div></div>

      <div class="label">${esc(mLong(sel))} by category</div>
      <div class="card">${cats.length ? cats.map(([k, g]) => `
        <div class="group">
          <div class="ghead"><span class="name">${esc(k)}</span><span class="pct">${Math.round(100 * g.sum / (total || 1))}%</span><span class="amt">${kr(g.sum)}</span></div>
          <div class="share" aria-hidden="true"><div style="width:${(100 * g.sum / (total || 1)).toFixed(1)}%"></div></div>
          ${g.items.slice().sort((p, q) => q.d.localeCompare(p.d)).map((x) => `<div class="item"><div class="grow">${esc(item >= 0 ? x.r[item] : "") || "—"}<div class="muted">${esc(x.d)}</div></div><div class="amt">${kr(x.n)}</div></div>`).join("")}
        </div>`).join("") : `<div class="empty">No expenses in ${esc(mLong(sel))} yet.</div>`}</div>

      <div class="label">Add an expense</div>
      <div class="card">
        <form id="add">
          <label>What<input name="item" required autocomplete="off"></label>
          <label>Category<input name="cat" list="cats" autocomplete="off" value="${esc(cats[0] ? cats[0][0] : (allCats[0] || ""))}"></label>
          <label class="small">Amount (kr)<input name="amount" inputmode="decimal" required autocomplete="off"></label>
          <button class="add" type="submit">Add</button>
          <datalist id="cats">${allCats.map((k) => `<option value="${esc(k)}"></option>`).join("")}</datalist>
        </form>
        ${error ? `<div class="err" role="alert">${esc(error)}</div>` : ""}
      </div>`;

    app.querySelectorAll(".mbtn").forEach((b) => b.addEventListener("click", () => {
      amber.setData({ month: b.dataset.m === todayYm ? null : b.dataset.m });
    }));
    document.getElementById("add").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const amount = fmtIn(String(f.get("amount")));
      if (!amount || isNaN(num(amount))) { error = "Enter an amount as a number."; render(amber.note, amber.data); return; }
      const values = { [t.columns[a].name]: amount };
      if (item >= 0) values[t.columns[item].name] = String(f.get("item")).trim();
      if (cat >= 0) values[t.columns[cat].name] = String(f.get("cat")).trim() || "Other";
      if (date >= 0) values[t.columns[date].name] = amber.note.today;
      const r = await amber.update({ op: "append_row", table: t.index, values });
      error = r.ok ? "" : r.error;
      if (r.ok && amber.data && amber.data.month) amber.setData({ month: null });
      if (!r.ok) render(amber.note, amber.data);
    });
  }
  amber.onChange(render);
</script>
</body>
</html>
