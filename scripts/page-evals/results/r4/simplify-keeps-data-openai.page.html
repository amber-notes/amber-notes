<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household expenses</title>
<style>
  * { box-sizing: border-box; }
  body { padding: 20px 18px 80px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 18px; }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 14px; padding: 16px; border-top: 1px solid var(--amber-separator); min-height: 56px; }
  .row:first-child { border-top: 0; }
  .name { flex: 1; min-width: 0; font-weight: 600; }
  .amount { font-variant-numeric: tabular-nums; font-weight: 700; }
  .empty { padding: 28px 16px; color: var(--amber-text-secondary); text-align: center; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const money = (n) => n.toLocaleString("sv-SE", { maximumFractionDigits: 0 }) + " kr";
  const parseAmount = (s) => parseFloat(String(s ?? "").replace(/\s/g, "").replace(",", ".")) || 0;

  function render(note) {
    const app = document.getElementById("app");
    const table = note.tables.find((t) => t.columns.some((c) => /^(category|cat)$/i.test(c.name)) && t.columns.some((c) => /^(amt|amount|cost|kr|price|sum)$/i.test(c.name)));
    if (!table) {
      app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add Category and Amt columns to show Food and Housing.</div>`;
      return;
    }
    const col = (re) => table.columns.findIndex((c) => re.test(c.name));
    const categoryCol = col(/^(category|cat)$/i);
    const amountCol = col(/^(amt|amount|cost|kr|price|sum)$/i);
    const totals = { Food: 0, Housing: 0 };
    for (const row of table.rows) {
      const category = String(row[categoryCol] ?? "").trim().toLowerCase();
      if (category === "food") totals.Food += parseAmount(row[amountCol]);
      if (category === "housing") totals.Housing += parseAmount(row[amountCol]);
    }
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <section class="card" aria-label="Food and Housing totals">
        <div class="row"><div class="name">Food</div><div class="amount">${money(totals.Food)}</div></div>
        <div class="row"><div class="name">Housing</div><div class="amount">${money(totals.Housing)}</div></div>
      </section>`;
  }
  amber.onChange(render);
</script>
</body>
</html>
