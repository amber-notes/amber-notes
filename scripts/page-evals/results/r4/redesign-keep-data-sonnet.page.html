<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household expenses</title>
<style>
  * { box-sizing: border-box; }
  body { padding: 20px 18px 80px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 12px; }
  .hero { background: var(--amber-accent-soft); border-radius: var(--amber-radius); padding: 20px; margin-bottom: 16px; }
  .hero .m { color: var(--amber-text-secondary); font-size: 15px; }
  .hero .t { font-size: 48px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 4px 0; overflow-wrap: anywhere; }
  .muted { color: var(--amber-text-secondary); font-size: 14px; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 0 4px 8px; }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); border: 1px solid var(--amber-separator); margin-bottom: 20px; overflow: hidden; }
  .months { display: flex; align-items: flex-end; gap: 8px; padding: 16px 12px 8px; overflow-x: auto; }
  .mb { flex: 1 0 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; color: var(--amber-text); border: 0; border-radius: var(--amber-radius-small); padding: 6px 4px; min-height: 44px; font: inherit; cursor: pointer; }
  .mb[aria-pressed="true"] { background: var(--amber-fill); }
  .mb .col { height: 110px; width: 100%; display: flex; align-items: flex-end; }
  .mb .fill { width: 100%; background: var(--amber-text-secondary); border-radius: 6px 6px 2px 2px; min-height: 3px; opacity: .55; }
  .mb[aria-pressed="true"] .fill { background: var(--amber-accent); opacity: 1; }
  .mb .v { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--amber-text-secondary); }
  .mb .n { font-size: 13px; font-weight: 600; }
  .gh { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px 6px; background: var(--amber-fill); font-weight: 600; }
  .gh span:last-child { font-variant-numeric: tabular-nums; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--amber-separator); min-height: 48px; }
  .gh + .row { border-top: 0; }
  .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  form { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--amber-text-secondary); flex: 1 1 120px; }
  input, select { font: inherit; font-size: 16px; color: var(--amber-text); background: var(--amber-fill); border: 0; border-radius: var(--amber-radius-small); padding: 10px 12px; min-height: 44px; width: 100%; }
  button.add { font: inherit; font-weight: 600; min-height: 44px; padding: 0 20px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-accent); color: var(--amber-on-accent); align-self: flex-end; }
  .err { color: var(--amber-danger); padding: 0 16px 12px; }
  .empty { padding: 24px 16px; text-align: center; color: var(--amber-text-secondary); }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const kr = (n) => Math.round(n).toLocaleString("sv-SE", { maximumFractionDigits: 0 }) + " kr";
  const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const MF = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  let error = "";

  function render(note, data) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => t.columns.some((c) => /^(amt|amount|cost|kr|price|sum)$/i.test(c.name)));
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Date, Item, Category and Amt columns.</div>`; return; }
    const ci = (re) => t.columns.findIndex((c) => re.test(c.name));
    const a = ci(/^(amt|amount|cost|kr|price|sum)$/i), cat = ci(/categ/i), item = ci(/^(item|what|description|name)$/i), date = ci(/^date$/i);
    const rows = t.rows.map((r, i) => ({
      r, i,
      n: parseFloat(String(r[a]).replace(/\s/g, "").replace(",", ".")) || 0,
      m: date >= 0 ? String(r[date]).slice(0, 7) : "",
      c: (cat >= 0 && r[cat]) || "Other",
    }));
    const byMonth = new Map();
    for (const x of rows) byMonth.set(x.m, (byMonth.get(x.m) || 0) + x.n);
    const months = [...byMonth.keys()].sort();
    const thisMonth = note.today.slice(0, 7);
    let sel = data && data.month;
    if (!sel || !byMonth.has(sel)) sel = byMonth.has(thisMonth) ? thisMonth : (months[months.length - 1] || thisMonth);
    const total = byMonth.get(sel) || 0;
    const max = Math.max(1, ...byMonth.values());
    const mlabel = (m, full) => /^\d{4}-\d\d$/.test(m) ? (full ? MF[+m.slice(5) - 1] + " " + m.slice(0, 4) : MN[+m.slice(5) - 1]) : "No date";
    const inSel = rows.filter((x) => x.m === sel);
    const groups = new Map();
    for (const x of inSel) { const g = groups.get(x.c) || { sum: 0, list: [] }; g.sum += x.n; g.list.push(x); groups.set(x.c, g); }
    const gs = [...groups].sort((p, q) => q[1].sum - p[1].sum);
    const catNames = [...new Set(rows.map((x) => x.c))];

    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="hero"><div class="m">${esc(mlabel(sel, true))}</div><div class="t">${kr(total)}</div><div class="muted">${inSel.length} ${inSel.length === 1 ? "entry" : "entries"}</div></div>
      <div class="label">By month</div>
      <div class="card"><div class="months">${months.map((m) => `<button class="mb" data-m="${esc(m)}" aria-pressed="${m === sel}" aria-label="${esc(mlabel(m, true))}: ${kr(byMonth.get(m))}"><span class="v">${kr(byMonth.get(m))}</span><span class="col"><span class="fill" style="height:${(100 * byMonth.get(m) / max).toFixed(1)}%"></span></span><span class="n">${esc(mlabel(m))}</span></button>`).join("") || '<div class="empty" style="width:100%">No expenses yet.</div>'}</div></div>
      <div class="label">By category</div>
      <div class="card">${gs.map(([k, g]) => `<div class="gh"><span>${esc(k)}</span><span>${kr(g.sum)}</span></div>${g.list.map((x) => `<div class="row"><div class="grow">${esc(item >= 0 ? x.r[item] : "")}<div class="muted">${esc(date >= 0 ? x.r[date] : "")}</div></div><div class="amt">${kr(x.n)}</div></div>`).join("")}`).join("") || '<div class="empty">Nothing in this month.</div>'}</div>
      <div class="label">Add an expense</div>
      <div class="card">
        <form id="add">
          <label>What<input name="item" required></label>
          <label>Category<input name="cat" list="cats" required></label>
          <datalist id="cats">${catNames.map((k) => `<option value="${esc(k)}">`).join("")}</datalist>
          <label>Amount (kr)<input name="amount" inputmode="decimal" required></label>
          <button class="add">Add</button>
        </form>
        ${error ? `<div class="err" role="alert">${esc(error)}</div>` : ""}
      </div>`;
    app.querySelectorAll(".mb").forEach((b) => b.onclick = () => amber.setData({ month: b.dataset.m }));
    document.getElementById("add").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const values = { [t.columns[a].name]: String(f.get("amount")).trim() };
      if (item >= 0) values[t.columns[item].name] = String(f.get("item")).trim();
      if (cat >= 0) values[t.columns[cat].name] = String(f.get("cat")).trim();
      if (date >= 0) values[t.columns[date].name] = note.today;
      const r = await amber.update({ op: "append_row", table: t.index, values });
      error = r.ok ? "" : r.error;
      if (!r.ok) render(amber.note, amber.data);
    };
  }
  amber.onChange(render);
</script>
</body>
</html>
