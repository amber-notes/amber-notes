<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { padding: 20px 18px 96px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 12px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 22px 4px 8px; }
  .big { font-size: 42px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .muted { color: var(--amber-text-secondary); font-size: 14px; }
  .meter { height: 10px; border-radius: 5px; background: var(--amber-accent-soft); overflow: hidden; margin: 12px 0 4px; }
  .meter div { height: 100%; background: var(--amber-accent); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .stat { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 10px 12px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); overflow: hidden; }
  .chart { display: flex; align-items: end; gap: 6px; height: 130px; padding: 12px 14px 0; }
  .wk { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .wk .b { width: 100%; border-radius: 4px 4px 0 0; background: var(--amber-accent); min-height: 2px; }
  .wk.cur .b { background: var(--amber-text); }
  .wk .l { font-size: 11px; color: var(--amber-text-secondary); padding-bottom: 8px; font-variant-numeric: tabular-nums; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--amber-separator); min-height: 52px; flex-wrap: wrap; }
  .row:first-child { border-top: 0; }
  .grow { flex: 1; min-width: 90px; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--amber-text-secondary); min-width: 0; }
  input { font: inherit; font-size: 16px; color: var(--amber-text); background: var(--amber-fill); border: 0; border-radius: var(--amber-radius-small); padding: 10px 12px; min-height: 44px; width: 100%; }
  button { grid-column: 1 / -1; font: inherit; font-weight: 600; min-height: 44px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-accent); color: var(--amber-on-accent); }
  .err { color: var(--amber-danger); padding: 0 16px 12px; min-height: 1em; }
  .empty { padding: 24px 16px; text-align: center; color: var(--amber-text-secondary); }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const num = (s) => { const n = parseFloat(String(s ?? "").replace(/\s/g, "").replace(",", ".")); return Number.isFinite(n) ? n : 0; };
  const col = (t, re) => t.columns.findIndex((c) => re.test(c.name));
  const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const monday = (iso) => { const d = new Date(iso + "T12:00:00Z"); return addDays(iso, -((d.getUTCDay() + 6) % 7)); };
  const pace = (min, km) => { if (!km || !min) return "–"; const p = min / km; let m = Math.floor(p), s = Math.round((p - m) * 60); if (s === 60) { m++; s = 0; } return m + ":" + String(s).padStart(2, "0"); };
  let error = "";

  function render(note, data) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => col(t, /date/i) >= 0);
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Activity Date, Distance (km), Moving Time (min) and Avg HR columns to the note.</div>`; return; }
    const d = col(t, /date/i), km = col(t, /dist|km/i), mi = col(t, /time|min/i), hr = col(t, /hr|heart/i);
    const rows = t.rows.filter((r) => r[d]);
    const weeks = Array.from({ length: 8 }, (_, k) => addDays(monday(note.today), (k - 7) * 7));
    const inWeek = (w) => rows.filter((r) => r[d] >= w && r[d] < addDays(w, 7));
    const kmOf = (rs) => rs.reduce((s, r) => s + (km >= 0 ? num(r[km]) : 0), 0);
    const minOf = (rs) => rs.reduce((s, r) => s + (mi >= 0 ? num(r[mi]) : 0), 0);
    const perWeek = weeks.map((w) => kmOf(inWeek(w)));
    const top = Math.max(1, ...perWeek);
    const now = inWeek(weeks[7]);
    const goal = Number(data && data.weeklyKm) || 0;
    const totKm = kmOf(rows), totMin = minOf(rows);
    const hrs = hr >= 0 ? rows.map((r) => num(r[hr])).filter(Boolean) : [];
    const avgHr = hrs.length ? Math.round(hrs.reduce((a, b) => a + b, 0) / hrs.length) : null;
    const sorted = rows.slice().sort((a, b) => (a[d] < b[d] ? 1 : -1));
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="big">${kmOf(now).toFixed(1)} km</div>
      <div class="muted">this week · ${now.length} run${now.length === 1 ? "" : "s"} · ${minOf(now)} min</div>
      ${goal ? `<div class="meter" role="img" aria-label="${kmOf(now).toFixed(1)} of ${goal} km this week"><div style="width:${Math.min(100, (100 * kmOf(now)) / goal)}%"></div></div><div class="muted">Goal ${goal} km a week</div>` : ""}
      <div class="stats">
        <div class="stat"><span class="muted">Total</span><b>${totKm.toFixed(1)} km</b></div>
        <div class="stat"><span class="muted">Avg pace</span><b>${pace(totMin, totKm)}</b></div>
        <div class="stat"><span class="muted">Avg HR</span><b>${avgHr ?? "–"}</b></div>
      </div>
      <h2>Km per week</h2>
      <div class="card chart" role="img" aria-label="Km per week: ${perWeek.map((v) => v.toFixed(0)).join(", ")}">${weeks.map((w, k) => `<div class="wk${k === 7 ? " cur" : ""}"><div class="b" style="height:${(90 * perWeek[k]) / top}px"></div><div class="l">${w.slice(8)}/${Number(w.slice(5, 7))}</div></div>`).join("")}</div>
      <h2>Latest runs</h2>
      <div class="card">${sorted.slice(0, 10).map((r) => `<div class="row"><span class="grow muted">${esc(r[d])}</span>${km >= 0 ? `<span class="num">${esc(r[km])} km</span>` : ""}${mi >= 0 ? `<span class="num">${esc(r[mi])} min</span>` : ""}<span class="num muted">${pace(num(mi >= 0 ? r[mi] : 0), num(km >= 0 ? r[km] : 0))} /km</span>${hr >= 0 && r[hr] ? `<span class="num muted">${esc(r[hr])} bpm</span>` : ""}</div>`).join("") || `<div class="empty">No runs yet.</div>`}</div>
      <h2>Log a run</h2>
      <div class="card">
        <form id="add">
          <label>Date<input name="date" type="date" value="${note.today}" required></label>
          <label>Distance (km)<input name="km" inputmode="decimal" required></label>
          <label>Moving time (min)<input name="min" inputmode="numeric" required></label>
          <label>Avg HR<input name="hr" inputmode="numeric"></label>
          <label>Weekly goal (km)<input name="goal" inputmode="decimal" value="${goal || ""}"></label>
          <button>Log it</button>
        </form>
        <div class="err" role="alert">${esc(error)}</div>
      </div>`;
    const f = document.getElementById("add");
    f.goal.onchange = async () => { const r = await amber.setData({ weeklyKm: f.goal.value.trim() ? num(f.goal.value) : null }); error = r.ok ? "" : r.error; if (!r.ok) render(amber.note, amber.data); };
    f.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(f);
      const values = {};
      if (d >= 0) values[t.columns[d].name] = String(fd.get("date") || amber.note.today);
      if (km >= 0) values[t.columns[km].name] = String(fd.get("km")).replace(",", ".").trim();
      if (mi >= 0) values[t.columns[mi].name] = String(fd.get("min")).trim();
      if (hr >= 0) values[t.columns[hr].name] = String(fd.get("hr")).trim();
      const r = await amber.update({ op: "append_row", table: t.index, values });
      error = r.ok ? "" : r.error;
      if (!r.ok) render(amber.note, amber.data);
    };
  }
  amber.onChange(render);
</script>
</body>
</html>
