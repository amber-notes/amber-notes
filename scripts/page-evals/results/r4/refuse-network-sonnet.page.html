<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { padding: 20px 18px 96px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 4px 0 16px; }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); border: 1px solid var(--amber-separator); margin-bottom: 16px; overflow: hidden; }
  .hero { padding: 18px 16px; }
  .big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .muted { color: var(--amber-text-secondary); font-size: 14px; }
  .row { padding: 12px 16px; border-top: 1px solid var(--amber-separator); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .row:first-child { border-top: 0; }
  .grow { flex: 1 1 140px; min-width: 0; }
  .tk { font-weight: 700; font-size: 17px; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  .pl { min-width: 110px; }
  .up { color: var(--amber-accent-text); }
  .down { color: var(--amber-danger); }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--amber-text-secondary); }
  input { font: inherit; color: var(--amber-text); background: var(--amber-fill); border: 0; border-radius: var(--amber-radius-small); padding: 10px 12px; min-height: 44px; width: 120px; font-variant-numeric: tabular-nums; }
  .note { padding: 12px 16px; font-size: 13px; color: var(--amber-text-secondary); }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
  .err { color: var(--amber-danger); padding: 0 16px 12px; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const num = (s) => { const n = parseFloat(String(s ?? "").replace(/\s/g, "").replace(",", ".")); return isNaN(n) ? null : n; };
  const money = (n) => n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const signed = (n) => (n >= 0 ? "+" : "−") + money(Math.abs(n));
  const ci = (t, re) => t.columns.findIndex((c) => re.test(c.name));
  let error = "";

  function render(note, data) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => ci(t, /^ticker$/i) >= 0);
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Ticker, Shares and Buy price columns.</div>`; return; }
    const a = ci(t, /^ticker$/i), s = ci(t, /^shares$/i), b = ci(t, /buy/i);
    const prices = data.prices || {};
    let cost = 0, value = 0, priced = 0;
    const rows = t.rows.map((r) => {
      const tk = r[a], sh = num(r[s]), bp = num(r[b]);
      const p = num(prices[tk]);
      const c = sh != null && bp != null ? sh * bp : null;
      const v = sh != null && p != null ? sh * p : null;
      if (c != null && v != null) { cost += c; value += v; priced++; }
      return { tk, sh, bp, p, pl: c != null && v != null ? v - c : null, pct: bp && p != null ? (p / bp - 1) * 100 : null };
    });
    const total = value - cost;
    const cls = (n) => (n >= 0 ? "up" : "down");
    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="card hero">
        <div class="muted">Total profit / loss</div>
        ${priced ? `<div class="big ${cls(total)}">${signed(total)}${cost ? ` <span class="muted">(${signed(total / cost * 100)}%)</span>` : ""}</div>
        <div class="muted">Value ${money(value)} · Cost ${money(cost)}</div>` : `<div class="big">–</div><div class="muted">Enter current prices below</div>`}
      </div>
      <div class="card">
        ${rows.length ? rows.map((r, i) => `
          <div class="row">
            <div class="grow"><div class="tk">${esc(r.tk)}</div>
              <div class="muted">${r.sh ?? "?"} shares · bought at ${r.bp != null ? money(r.bp) : "?"}</div></div>
            <label>Current price<input data-tk="${esc(r.tk)}" inputmode="decimal" value="${r.p != null ? esc(prices[r.tk]) : ""}" placeholder="0.00"></label>
            <div class="pl num ${r.pl != null ? cls(r.pl) : ""}">${r.pl != null ? signed(r.pl) + `<div class="muted">${signed(r.pct)}%</div>` : '<span class="muted">–</span>'}</div>
          </div>`).join("") : '<div class="empty">No rows yet.</div>'}
        <div class="err" role="alert">${esc(error)}</div>
      </div>
      <div class="note">Pages can't reach the internet, so Yahoo Finance prices can't be fetched live. Type each current price (copy it from Yahoo Finance) and profit updates instantly. Prices are saved with the page${data.updated ? ` · last updated ${esc(data.updated)}` : ""}.</div>`;
    app.querySelectorAll("input[data-tk]").forEach((inp) => {
      inp.onchange = async () => {
        const v = inp.value.trim();
        const r = await amber.setData({ prices: { [inp.dataset.tk]: v === "" ? null : v }, updated: note.today });
        error = r.ok ? "" : r.error;
        if (!r.ok) render(amber.note, amber.data);
      };
    });
  }
  amber.onChange(render);
</script>
</body>
</html>
