<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{padding:20px 18px 88px;max-width:760px;margin:0 auto}h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 8px}.sub{color:var(--amber-text-secondary);font-size:14px;line-height:1.35;margin:0 0 16px}.grid{display:grid;grid-template-columns:1fr;gap:12px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.metric,.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius)}.metric{padding:14px}.label{color:var(--amber-text-secondary);font-size:13px}.value{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}.gain{color:var(--amber-accent-text)}.loss{color:var(--amber-danger)}.card{overflow:hidden}.stock{padding:14px 16px;border-top:1px solid var(--amber-separator)}.stock:first-child{border-top:0}.top{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}.ticker{font-size:18px;font-weight:700}.muted{color:var(--amber-text-secondary);font-size:13px}.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.pill{background:var(--amber-fill);border-radius:var(--amber-radius-small);padding:10px 12px;min-width:0}.num{font-variant-numeric:tabular-nums;font-weight:650}label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--amber-text-secondary)}input{font:inherit;color:var(--amber-text);background:var(--amber-fill);border:0;border-radius:var(--amber-radius-small);padding:10px 12px;min-height:44px;width:100%;font-variant-numeric:tabular-nums}button{font:inherit;font-weight:700;min-height:44px;padding:0 16px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-accent);color:var(--amber-on-accent)}.priceRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-top:12px}form.add{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px;border-top:1px solid var(--amber-separator)}form.add .wide{grid-column:1/-1}.note{background:var(--amber-accent-soft);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:12px 14px;color:var(--amber-text-secondary);font-size:14px;line-height:1.35;margin-bottom:14px}.err{color:var(--amber-danger);font-size:13px;min-height:1.2em;padding:0 16px 14px}.empty{padding:28px 16px;text-align:center;color:var(--amber-text-secondary)}@media (min-width:640px){.summary{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:1fr 1fr}.stock{border-top:0}.card.holdings{display:grid;grid-template-columns:1fr 1fr}.card.holdings .stock{border-top:1px solid var(--amber-separator)}form.add{grid-template-columns:1.2fr 1fr 1fr 1fr auto}.add .wide{grid-column:auto}.add button{align-self:end}.note{margin-bottom:16px}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;","}":"&#125;",";":";","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]||c));
const idx=(t,names)=>t.columns.findIndex(c=>names.some(n=>n.test(c.name)));
const num=s=>{const v=parseFloat(String(s??"").replace(/\s/g,"").replace(",","."));return Number.isFinite(v)?v:NaN};
const money=n=>Number.isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:2,minimumFractionDigits:2}):"—";
let error="";
function table(note){return note.tables.find(t=>idx(t,[/^ticker$/i,/^symbol$/i])>=0)||note.tables[0];}
function calc(t){const c={ticker:idx(t,[/^ticker$/i,/^symbol$/i]),shares:idx(t,[/^shares?$/i,/^qty$/i,/^quantity$/i]),buy:idx(t,[/^buy price$/i,/^buy$/i,/^cost$/i,/^avg/i]),cur:idx(t,[/^current price$/i,/^price$/i,/^last$/i])};let rows=[],invested=0,value=0,known=0;for(let i=0;i<t.rows.length;i++){const r=t.rows[i],shares=num(r[c.shares]),buy=num(r[c.buy]),cur=num(r[c.cur]);const cost=shares*buy, val=shares*cur, has=Number.isFinite(shares)&&Number.isFinite(buy)&&Number.isFinite(cur);if(Number.isFinite(cost))invested+=cost;if(has){value+=val;known++}rows.push({i,ticker:r[c.ticker]||"—",shares,buy,cur,cost,val,profit:has?val-cost:NaN,pct:has&&cost!==0?(val-cost)/cost*100:NaN});}return{c,rows,invested,value,profit:value-invested,known};}
function cls(n){return Number.isFinite(n)&&n<0?"loss":"gain"}
function render(note,data){const app=document.getElementById("app"),t=table(note);if(!t){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">Add a stocks table with Ticker, Shares, Buy price, and Current price columns.</div>`;return}const s=calc(t);if(s.c.ticker<0||s.c.shares<0||s.c.buy<0||s.c.cur<0){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">This page needs columns named Ticker, Shares, Buy price, and Current price.</div>`;return}const cards=s.rows.map(row=>`<section class="stock"><div class="top"><div><div class="ticker">${esc(row.ticker)}</div><div class="muted">${money(row.shares)} shares @ ${money(row.buy)}</div></div><div class="num ${cls(row.profit)}">${money(row.profit)}</div></div><div class="nums"><div class="pill"><div class="label">Cost</div><div class="num">${money(row.cost)}</div></div><div class="pill"><div class="label">Value</div><div class="num">${money(row.val)}</div></div><div class="pill"><div class="label">Return</div><div class="num ${cls(row.pct)}">${Number.isFinite(row.pct)?row.pct.toFixed(1)+"%":"—"}</div></div><div class="pill"><label>Current price<input inputmode="decimal" aria-label="Current price for ${esc(row.ticker)}" data-row="${row.i}" value="${esc(t.rows[row.i][s.c.cur]||"")}" placeholder="Latest"></label></div></div></section>`).join("");app.innerHTML=`<h1>${esc(note.title)}</h1><p class="sub">Profit is calculated from the current prices saved in the note.</p><div class="note">Amber pages cannot make web requests, so live market data cannot be pulled in here. Enter or paste the latest prices in the Current price fields. Totals assume all rows use the same currency.</div><section class="summary"><div class="metric"><div class="label">Invested</div><div class="value">${money(s.invested)}</div></div><div class="metric"><div class="label">Current value</div><div class="value">${s.known?money(s.value):"—"}</div></div><div class="metric"><div class="label">Profit / loss</div><div class="value ${cls(s.profit)}">${s.known?money(s.profit):"—"}</div></div><div class="metric"><div class="label">Priced holdings</div><div class="value">${s.known}/${s.rows.length}</div></div></section><div class="card holdings">${cards||'<div class="empty">No holdings yet.</div>'}</div><div class="card" style="margin-top:14px"><form class="add" id="add"><label class="wide">Ticker<input name="Ticker" required autocomplete="off"></label><label>Shares<input name="Shares" inputmode="decimal" required></label><label>Buy price<input name="Buy price" inputmode="decimal" required></label><label>Current price<input name="Current price" inputmode="decimal"></label><button>Add</button></form><div class="err" role="alert">${esc(error)}</div></div>`;document.querySelectorAll('input[data-row]').forEach(inp=>{inp.addEventListener('change',async e=>{const r=await amber.update({op:"set_cell",table:t.index,row:Number(e.target.dataset.row),col:t.columns[s.c.cur].name,value:e.target.value.trim()});error=r.ok?"":r.error;if(!r.ok)render(amber.note,amber.data);});});document.getElementById("add").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const values={};["Ticker","Shares","Buy price","Current price"].forEach(k=>values[k]=String(f.get(k)||"").trim());const r=await amber.update({op:"append_row",table:t.index,values});error=r.ok?"":r.error;if(!r.ok)render(amber.note,amber.data);};}
amber.onChange(render);
</script>
</body>
</html>
