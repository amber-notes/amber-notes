<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;color:var(--amber-text);font:16px/1.4 var(--amber-font);padding:20px 18px;max-width:680px;margin:0 auto}
h1{font-size:28px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--amber-separator)}.total{font-size:36px;font-weight:700;color:var(--amber-text)}
.pill{background:var(--amber-fill);color:var(--amber-text-secondary);border-radius:99px;padding:2px 10px;font-size:13px}
</style></head><body><main id="app"></main><script>
const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const num=(s)=>parseFloat(String(s).replace(/\s/g,"").replace(",","."))||0;
amber.onChange((note)=>{const t=note.tables[0];if(!t){app.innerHTML="<h1>"+esc(note.title)+"</h1><p>No expense table found.</p>";return}const a=t.columns.findIndex((c)=>/^(amt|amount\s*\(kr\)|amount|kr)$/i.test(c.name));if(a<0){app.innerHTML="<h1>"+esc(note.title)+"</h1><p>Add an amount column to see totals.</p>";return}
app.innerHTML="<h1>"+esc(note.title)+"</h1><div class=total>"+t.rows.reduce((s,r)=>s+num(r[a]),0).toLocaleString("sv-SE")+" kr</div>"+
t.rows.map((r)=>"<div class=row><span>"+esc(r[1])+" <span class=pill>"+esc(r[2])+"</span></span><b>"+esc(r[a])+"</b></div>").join("")});
</script></body></html>
