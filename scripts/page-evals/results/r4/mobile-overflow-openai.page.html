<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}
body{padding:20px 16px 96px;max-width:680px;margin:0 auto}
h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 16px}
table{width:100%;border-collapse:collapse;background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}
th,td{padding:12px 14px;border-bottom:1px solid var(--amber-separator);text-align:left;vertical-align:top;white-space:normal;overflow-wrap:anywhere}
th{font-size:13px;color:var(--amber-text-secondary);font-weight:600}
tr:last-child td{border-bottom:0}
.empty{padding:24px 16px;background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);color:var(--amber-text-secondary);text-align:center}
@media(max-width:640px){
  h1{font-size:26px}
  table,tbody,tr,th,td{display:block;width:100%}
  tr:first-child{display:none}
  table{background:transparent;border:0;border-radius:0;overflow:visible}
  tr:not(:first-child){background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);margin:0 0 14px;overflow:hidden}
  td{display:grid;grid-template-columns:minmax(86px,34%) 1fr;gap:12px;padding:11px 14px;min-height:44px;align-items:start}
  td:before{content:attr(data-label);color:var(--amber-text-secondary);font-size:13px;font-weight:600}
  td:last-child{border-bottom:0}
}
</style></head><body><h1 id="t"></h1><table id="grid"></table><script>
const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
amber.onChange((note)=>{const title=document.getElementById("t"),grid=document.getElementById("grid");title.textContent=note.title;const tb=note.tables[0];
if(!tb){grid.outerHTML='<div class="empty">Add a meal plan table to see it here.</div>';return}
const heads=tb.columns.map((c)=>c.name);
grid.innerHTML="<tr>"+heads.map((h)=>"<th>"+esc(h)+"</th>").join("")+"</tr>"+tb.rows.map((r)=>"<tr>"+r.map((c,i)=>"<td data-label=\""+esc(heads[i]||"")+"\">"+esc(c||"—")+"</td>").join("")+"</tr>").join("")});
</script></body></html>
