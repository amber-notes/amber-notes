<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Household expenses</title>
<style>
  * { box-sizing: border-box; }
  body { padding: 8px 18px 60px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 700; margin: 6px 0 0; color: var(--amber-text-secondary); }
  .total { font-size: 52px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin: 4px 0 0; line-height: 1.1; }
  .sub { color: var(--amber-text-secondary); font-size: 15px; margin: 2px 0 20px; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 0 4px 8px; }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); margin-bottom: 20px; overflow: hidden; }
  .chart { display: flex; align-items: flex-end; gap: 10px; height: 170px; padding: 14px 14px 10px; }
  .col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
  .col .v { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--amber-text-secondary); white-space: nowrap; }
  .col .b { width: 100%; max-width: 64px; background: var(--amber-fill); border-radius: 6px 6px 2px 2px; min-height: 3px; }
  .col.sel .b { background: var(--amber-accent); }
  .col.sel .m { color: var(--amber-accent-text); font-weight: 700; }
  .col .m { font-size: 13px; }
  .grp { padding: 12px 16px 4px; display: flex; justify-content: space-between; align-items: baseline; border-top: .5px solid var(--amber-separator); }
  .grp:first-child { border-top: 0; }
  .grp .n { font-weight: 700; }
  .grp .s { font-weight: 700; font-variant-numeric: tabular-nums; }
  .item { display: flex; gap: 10px; padding: 6px 16px; }
  .item:last-child { padding-bottom: 12px; }
  .item .g { flex: 1; min-width: 0; }
  .item .d { color: var(--amber-text-secondary); font-size: 13px; }
  .amt { font-variant-numeric: tabular-nums; }
  .empty { padding: 20px 16px; color: var(--amber-text-secondary); }
  form { display: grid; grid-template-columns: 1.4fr 1fr .9fr auto; gap: 8px; padding: 12px; }
  input { font: inherit; font-size: 16px; padding: 9px 10px; border-radius: var(--amber-radius-small); border: 0; background: var(--amber-fill); color: var(--amber-text); min-width: 0; }
  button.add { font: inherit; font-weight: 600; border: 0; border-radius: var(--amber-radius-small); padding: 0 14px; background: var(--amber-accent); color: var(--amber-on-accent); }
  .err { color: var(--amber-danger); font-size: 14px; padding: 0 16px 10px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const kr = (n) => Math.round(n).toLocaleString("sv-SE", { maximumFractionDigits: 0 }) + " kr";
  const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const monthName = (k) => MN[+k.slice(5, 7) - 1] + " " + k.slice(0, 4);
  let selected = null, error = "";

  function render(note) {
    const app = document.getElementById("app");
    const re = /amount|amt|cost|kr|price/i;
    const t = note.tables.find((t) => t.columns.some((c) => re.test(c.name)));
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with an amount column.</div>`; return; }
    const col = (r) => t.columns.findIndex((c) => r.test(c.name));
    const a = col(re), cat = col(/categ/i), item = col(/item|what|description/i), date = col(/^date$/i);
    const rows = t.rows.map((r) => ({
      n: parseFloat(String(r[a]).replace(/[\s\u00a0]/g, "").replace(",", ".")) || 0,
      m: date >= 0 ? String(r[date]).slice(0, 7) : "",
      d: date >= 0 ? r[date] : "", it: item >= 0 ? r[item] : "", c: (cat >= 0 && r[cat]) || "Other",
    }));
    const months = new Map();
    for (const x of rows) months.set(x.m, (months.get(x.m) || 0) + x.n);
    const keys = [...months.keys()].sort();
    if (!selected || !months.has(selected)) {
      const cur = note.today.slice(0, 7);
      selected = months.has(cur) ? cur : keys[keys.length - 1];
    }
    const max = Math.max(...months.values(), 1);
    const inMonth = rows.filter((x) => x.m === selected);
    const total = months.get(selected) || 0;
    const groups = new Map();
    for (const x of inMonth) { if (!groups.has(x.c)) groups.set(x.c, []); groups.get(x.c).push(x); }
    const gs = [...groups].map(([k, v]) => [k, v, v.reduce((s, x) => s + x.n, 0)]).sort((p, q) => q[2] - p[2]);
    const cats = [...new Set(rows.map((x) => x.c))];

    app.innerHTML = `
      <h1>${esc(note.title)} · ${esc(selected ? monthName(selected) : "")}</h1>
      <div class="total">${kr(total)}</div>
      <div class="sub">${inMonth.length} ${inMonth.length === 1 ? "entry" : "entries"}</div>
      <div class="label">By month</div>
      <div class="card chart">${keys.map((k) => `<button class="col ${k === selected ? "sel" : ""}" data-m="${k}"><div class="v">${kr(months.get(k))}</div><div class="b" style="height:${(100 * months.get(k) / max * 0.78).toFixed(1)}%"></div><div class="m">${MN[+k.slice(5, 7) - 1]}</div></button>`).join("")}</div>
      <div class="label">By category</div>
      <div class="card">${gs.length ? gs.map(([k, v, s]) => `<div class="grp"><div class="n">${esc(k)}</div><div class="s">${kr(s)}</div></div>${v.map((x) => `<div class="item"><div class="g">${esc(x.it)}<div class="d">${esc(x.d)}</div></div><div class="amt">${kr(x.n)}</div></div>`).join("")}`).join("") : `<div class="empty">No expenses this month.</div>`}</div>
      <div class="label">Add an expense</div>
      <div class="card">
        <form id="add">
          <input name="item" placeholder="What" required>
          <input name="cat" placeholder="Category" list="cats" required>
          <datalist id="cats">${cats.map((c) => `<option value="${esc(c)}">`).join("")}</datalist>
          <input name="amount" placeholder="kr" inputmode="decimal" required>
          <button class="add">Add</button>
        </form>
        ${error ? `<div class="err">${esc(error)}</div>` : ""}
      </div>`;
    app.querySelectorAll(".col").forEach((b) => b.addEventListener("click", () => { selected = b.dataset.m; render(amber.note); }));
    document.getElementById("add").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const values = { [t.columns[a].name]: String(f.get("amount")).trim() };
      if (item >= 0) values[t.columns[item].name] = String(f.get("item")).trim();
      if (cat >= 0) values[t.columns[cat].name] = String(f.get("cat")).trim();
      if (date >= 0) { values[t.columns[date].name] = amber.note.today; selected = amber.note.today.slice(0, 7); }
      const r = await amber.update({ op: "append_row", table: t.index, values });
      error = r.ok ? "" : r.error;
      if (!r.ok) render(amber.note);
    });
  }
  amber.onChange(render);
</script>
</body>
</html>
