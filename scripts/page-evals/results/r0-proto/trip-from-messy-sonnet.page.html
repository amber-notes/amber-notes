<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;padding:16px;font-family:var(--amber-font)}
h1{font-family:var(--amber-font-rounded);font-size:26px;margin:0 0 12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--amber-text-secondary);margin:22px 0 8px}
.card{background:var(--amber-surface);border-radius:var(--amber-radius);padding:12px 14px;margin-bottom:8px}
.count{background:var(--amber-accent-soft);text-align:center}
.count b{display:block;font-size:44px;font-family:var(--amber-font-rounded);color:var(--amber-accent-text)}
.k{font-size:12px;color:var(--amber-text-secondary)}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;background:var(--amber-surface);border-bottom:1px solid var(--amber-separator);cursor:pointer}
.row:first-of-type{border-radius:var(--amber-radius) var(--amber-radius) 0 0}.row:last-of-type{border-radius:0 0 var(--amber-radius) var(--amber-radius);border:0}
.box{width:20px;height:20px;border-radius:50%;border:2px solid var(--amber-accent);flex:none;box-sizing:border-box}
.done .box{background:var(--amber-accent)}.done .t{text-decoration:line-through;color:var(--amber-text-secondary)}
</style></head><body><h1 id="ti"></h1><div id="app"></div><script>
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(n){
const md=n.markdown.split('\n');
const get=p=>{const l=md.find(x=>x.toLowerCase().startsWith(p));return l?l.slice(l.indexOf(':')+1).trim():''};
const todoAt=md.findIndex(x=>/^to do/i.test(x));
const todoTexts=new Set(md.slice(todoAt<0?md.length:todoAt).map(x=>x.replace(/^- \[.\] /,'').trim()));
const ideas=n.checklists.filter(c=>!todoTexts.has(c.text.trim()));
const todos=n.checklists.filter(c=>todoTexts.has(c.text.trim()));
const flights=get('flights'), hotel=get('hotel'), budget=(md.find(x=>/^budget/i.test(x))||'').replace(/^budget\s*/i,'');
const m=flights.match(/out\s+\w+\s+(\d+)\s+(\w+)\s+(\d\d:\d\d)/i);
let cd='';
if(m){const mo=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(m[2].toLowerCase().slice(0,3));
const y=+n.today.slice(0,4);const d=Math.round((Date.UTC(y,mo,+m[1])-Date.parse(n.today))/864e5);
cd=`<div class="card count"><b>${d>0?d:d==0?'Today!':'✈︎'}</b>${d>0?'days to Porto':d==0?'Take-off day':'Trip started'}</div>`}
const out=flights.split(/,\s*back/i);
const fl=out.length>1?[`Out ${out[0].replace(/^out\s*/i,'')}`,`Back ${out[1].trim()}`]:[flights];
const item=c=>`<div class="row ${c.checked?'done':''}" data-l="${c.line}"><div class="box"></div><div class="t">${esc(c.text)}</div></div>`;
document.getElementById('ti').textContent=n.title;
document.getElementById('app').innerHTML=cd+
`<h2>Flights</h2>`+fl.map(f=>`<div class="card">✈️ ${esc(f)}</div>`).join('')+
`<h2>Hotel</h2><div class="card">🏨 ${esc(hotel)}</div>`+
(budget?`<div class="card"><span class="k">Budget</span><br>${esc(budget)}</div>`:'')+
`<h2>Ideas</h2><div>${ideas.map(item).join('')}</div><h2>To do before</h2><div>${todos.map(item).join('')}</div>`;
document.querySelectorAll('.row').forEach(r=>r.onclick=()=>amber.update({op:'toggle_checklist',line:+r.dataset.l}));
}
amber.onChange(render);
</script></body></html>
