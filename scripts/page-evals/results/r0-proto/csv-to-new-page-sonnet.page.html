<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;padding:16px;font-family:var(--amber-font)}
h2{font-size:15px;margin:20px 0 8px;color:var(--amber-text-secondary);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.card{background:var(--amber-surface);border-radius:var(--amber-radius);padding:12px}
.card b{display:block;font-size:22px;font-family:var(--amber-font-rounded);color:var(--amber-accent-text)}
.card span{font-size:12px;color:var(--amber-text-secondary)}
.chart{background:var(--amber-surface);border-radius:var(--amber-radius);padding:12px}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px}
.bar{flex:1;background:var(--amber-accent);border-radius:3px 3px 0 0;min-height:2px}
.lbl{display:flex;gap:4px;font-size:10px;color:var(--amber-text-secondary);margin-top:4px}
.lbl div{flex:1;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--amber-surface);border-radius:var(--amber-radius);overflow:hidden}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--amber-separator)}
th:first-child,td:first-child{text-align:left}th{color:var(--amber-text-secondary);font-weight:600}
form{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
input{padding:8px;border-radius:var(--amber-radius-small);border:none;background:var(--amber-fill);color:var(--amber-text);font:inherit;min-width:0}
button{grid-column:1/-1;padding:10px;border:none;border-radius:var(--amber-radius-small);background:var(--amber-accent);color:var(--amber-on-accent);font:inherit;font-weight:600}
#err{color:var(--amber-danger);font-size:12px;grid-column:1/-1}
</style></head><body>
<div class="grid" id="stats"></div>
<h2>Weekly distance (km)</h2><div class="chart"><div class="bars" id="bars"></div><div class="lbl" id="lbl"></div></div>
<h2>Runs</h2><table><thead><tr><th>Date</th><th>km</th><th>min</th><th>Pace</th><th>HR</th></tr></thead><tbody id="rows"></tbody></table>
<h2>Add a run</h2>
<form id="f"><input name="Date" type="date" required><input name="Distance (km)" placeholder="Distance km" inputmode="decimal" required><input name="Moving Time (min)" placeholder="Minutes" inputmode="decimal" required><input name="Avg HR" placeholder="Avg HR" inputmode="numeric"><div id="err"></div><button>Add run</button></form>
<script>
const $=id=>document.getElementById(id);
function wk(d){const t=new Date(d+'T00:00:00');const day=(t.getDay()+6)%7;t.setDate(t.getDate()-day);return t.toISOString().slice(0,10)}
function pace(k,m){if(!k)return'–';const p=m/k,mm=Math.floor(p),s=Math.round((p-mm)*60);return mm+':'+String(s%60).padStart(2,'0')}
amber.onChange(n=>{
const t=n.tables[0];if(!t)return;
const runs=t.rows.map(r=>({d:r[0],k:parseFloat(r[1])||0,m:parseFloat(r[2])||0,h:parseFloat(r[3])||0})).filter(r=>r.d).sort((a,b)=>a.d<b.d?-1:1);
const tk=runs.reduce((s,r)=>s+r.k,0),tm=runs.reduce((s,r)=>s+r.m,0),hr=runs.filter(r=>r.h);
$('stats').innerHTML=[[runs.length,'runs'],[tk.toFixed(1)+' km','total distance'],[pace(tk,tm)+' /km','average pace'],[hr.length?Math.round(hr.reduce((s,r)=>s+r.h,0)/hr.length)+' bpm':'–','average HR']].map(x=>`<div class="card"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
const w={};runs.forEach(r=>{const k=wk(r.d);w[k]=(w[k]||0)+r.k});
const ks=Object.keys(w).sort(),mx=Math.max(1,...Object.values(w));
$('bars').innerHTML=ks.map(k=>`<div class="bar" title="${k}: ${w[k].toFixed(1)} km" style="height:${w[k]/mx*100}%"></div>`).join('');
$('lbl').innerHTML=ks.map(k=>`<div>${w[k].toFixed(0)}</div>`).join('');
$('rows').innerHTML=runs.slice().reverse().map(r=>`<tr><td>${r.d}</td><td>${r.k.toFixed(1)}</td><td>${r.m}</td><td>${pace(r.k,r.m)}</td><td>${r.h||'–'}</td></tr>`).join('');
});
$('f').onsubmit=async e=>{e.preventDefault();const v={};new FormData(e.target).forEach((x,k)=>v[k]=x);const r=await amber.update({op:'append_row',table:0,values:v});$('err').textContent=r.ok?'':r.error;if(r.ok)e.target.reset()};
</script></body></html>
