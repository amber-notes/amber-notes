<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;padding:16px;font-family:var(--amber-font)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--amber-text-secondary);font-size:14px;margin-bottom:12px}
.bar{height:6px;background:var(--amber-fill);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar div{height:100%;background:var(--amber-accent);transition:width .3s}
.card{background:var(--amber-surface);border-radius:var(--amber-radius);min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;border:1px solid var(--amber-separator);user-select:none}
.word{font-family:var(--amber-font-rounded);font-size:38px;font-weight:600}
.hint{color:var(--amber-text-secondary);font-size:13px;margin-top:14px}
.badge{font-size:12px;margin-bottom:12px;padding:3px 10px;border-radius:99px;background:var(--amber-fill);color:var(--amber-text-secondary)}
.badge.k{background:var(--amber-accent-soft);color:var(--amber-accent-text)}
.row{display:flex;gap:10px;margin-top:14px}
button{flex:1;padding:14px;font-size:16px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-fill);color:var(--amber-text);font-family:inherit}
button.p{background:var(--amber-accent);color:var(--amber-on-accent);font-weight:600}
button.s{flex:0 0 auto;padding:6px 12px;font-size:13px}
</style></head><body><div id="app"></div><script>
let order=null,pos=0,flipped=false,rev=false,note=null,busy=false;
function rows(){const t=note.tables[0];const c=n=>t.columns.findIndex(x=>x.name===n);
return t.rows.map((r,i)=>({i,es:r[c("Spanish")],en:r[c("English")],k:/^(yes|true|y|✓)$/i.test((r[c("Known")]||"").trim())}))}
function build(R){order=R.filter(r=>!r.k).map(r=>r.i).concat(R.filter(r=>r.k).map(r=>r.i));pos=0;flipped=false}
function render(){
const R=rows();if(!order)build(R);
order=order.filter(i=>R[i]);R.forEach(r=>{if(!order.includes(r.i))order.push(r.i)});
const app=document.getElementById("app");
if(!R.length){app.textContent="No verbs yet.";return}
if(pos>=order.length)pos=0;
const r=R[order[pos]],known=R.filter(x=>x.k).length;
const front=rev?r.en:r.es,back=rev?r.es:r.en;
app.innerHTML=`<div class="top"><span>${known} of ${R.length} known</span><span>${pos+1} / ${order.length}</span><button class="s" id="dir">${rev?"EN→ES":"ES→EN"}</button></div>
<div class="bar"><div style="width:${known/R.length*100}%"></div></div>
<div class="card" id="card"><div class="badge ${r.k?"k":""}">${r.k?"Known":"Learning"}</div><div class="word"></div><div class="hint">${flipped?"":"Tap to flip"}</div></div>
<div class="row"><button id="prev">←</button><button id="no">Still learning</button><button class="p" id="yes">I know it</button></div>
<div class="row"><button id="restart">Restart deck (unknown first)</button></div>`;
app.querySelector(".word").textContent=flipped?back:front;
document.getElementById("card").onclick=()=>{flipped=!flipped;render()};
document.getElementById("dir").onclick=()=>{rev=!rev;flipped=false;render()};
document.getElementById("prev").onclick=()=>{pos=(pos-1+order.length)%order.length;flipped=false;render()};
document.getElementById("restart").onclick=()=>{build(rows());render()};
const mark=v=>{if(busy)return;busy=true;const next=()=>{pos=(pos+1)%order.length;flipped=false;busy=false;render()};
if((v==="Yes")===r.k){next();return}
amber.update({op:"set_cell",table:0,row:r.i,col:"Known",value:v}).then(()=>{busy=false;pos=(pos+1)%order.length;flipped=false;render()})};
document.getElementById("yes").onclick=()=>mark("Yes");
document.getElementById("no").onclick=()=>mark("No");
}
amber.onChange(n=>{note=n;render()});
</script></body></html>
