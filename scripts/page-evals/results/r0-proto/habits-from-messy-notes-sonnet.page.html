<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;padding:16px;font-family:var(--amber-font)}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--amber-text-secondary);font-size:14px;margin-bottom:14px}
.card{background:var(--amber-surface);border-radius:var(--amber-radius);padding:6px 14px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--amber-separator)}
.row:last-child{border-bottom:0}
.name{flex:1;font-size:17px}
.streak{font-size:13px;color:var(--amber-text-secondary);margin-top:2px}
.streak b{color:var(--amber-accent-text)}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--amber-accent);background:var(--amber-fill);color:var(--amber-on-accent);font-size:22px;cursor:pointer;padding:0}
.chk.on{background:var(--amber-accent)}
h2{font-size:15px;margin:0 0 8px;color:var(--amber-text-secondary);font-weight:600}
.grid{display:grid;gap:4px;align-items:center;font-size:12px;overflow-x:auto}
.cell{height:22px;border-radius:6px;background:var(--amber-fill)}
.cell.on{background:var(--amber-accent)}
.lbl{color:var(--amber-text-secondary);text-align:center}
.hl{text-align:left;color:var(--amber-text);white-space:nowrap;padding-right:6px}
.today{outline:2px solid var(--amber-accent-text)}
.err{color:var(--amber-danger);font-size:13px}
</style></head><body>
<h1>Habits</h1><div class="sub" id="sub"></div>
<div class="card" id="list"></div>
<h2>Last 14 days</h2><div class="card" style="padding:12px 14px"><div class="grid" id="grid"></div></div>
<div class="err" id="err"></div>
<script>
let busy=false;
function findTable(n){return n.tables.find(t=>t.columns[0].name==='Date')||n.tables[0]}
function yes(v){return /^(yes|true|y|1|✓|x)$/i.test(String(v||'').trim())}
function addDays(s,d){const t=new Date(s+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+d);return t.toISOString().slice(0,10)}
async function act(p){if(busy)return;busy=true;const r=await p;busy=false;if(!r.ok)document.getElementById('err').textContent=r.error||'Could not save'}
function render(n){
 const t=findTable(n);if(!t)return;
 const today=n.today;
 const habits=t.columns.map((c,i)=>({name:c.name,i})).filter(c=>c.i>0&&c.name!=='Note');
 const byDate={};t.rows.forEach((r,ri)=>{byDate[r[0]]={r,ri}});
 if(!byDate[today]&&!busy){busy=true;amber.update({op:'append_row',table:t.index,values:{Date:today}}).then(()=>{busy=false});}
 const done=(d,h)=>byDate[d]&&yes(byDate[d].r[h.i]);
 const list=document.getElementById('list');list.innerHTML='';
 let cnt=0;
 habits.forEach(h=>{
  const on=done(today,h);if(on)cnt++;
  let d=on?today:addDays(today,-1),s=0;while(done(d,h)){s++;d=addDays(d,-1)}
  let best=0,cur=0;Object.keys(byDate).sort().forEach((k,idx,a)=>{if(done(k,h)&&(idx===0||addDays(a[idx-1],1)===k||cur===0)){cur=(cur&&addDays(a[idx-1],1)===k)?cur+1:1}else cur=done(k,h)?1:0;best=Math.max(best,cur)});
  const row=document.createElement('div');row.className='row';
  row.innerHTML='<div class="name">'+h.name+'<div class="streak">🔥 <b>'+s+'</b> day streak · best '+best+'</div></div>';
  const b=document.createElement('button');b.className='chk'+(on?' on':'');b.textContent=on?'✓':'';
  b.onclick=()=>{const e=byDate[today];if(!e)return;act(amber.update({op:'set_cell',table:t.index,row:e.ri,col:h.name,value:on?'No':'Yes'}))};
  row.appendChild(b);list.appendChild(row);
 });
 document.getElementById('sub').textContent=cnt+' of '+habits.length+' done today';
 const g=document.getElementById('grid');g.style.gridTemplateColumns='auto repeat(14,minmax(14px,1fr))';g.innerHTML='';
 const days=[];for(let i=13;i>=0;i--)days.push(addDays(today,-i));
 g.appendChild(document.createElement('div'));
 days.forEach(d=>{const e=document.createElement('div');e.className='lbl';e.textContent=+d.slice(8);g.appendChild(e)});
 habits.forEach(h=>{const l=document.createElement('div');l.className='hl';l.textContent=h.name;g.appendChild(l);
  days.forEach(d=>{const c=document.createElement('div');c.className='cell'+(done(d,h)?' on':'')+(d===today?' today':'');g.appendChild(c)})});
}
amber.onChange(render);
</script></body></html>
