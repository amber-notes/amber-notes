<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;padding:16px;font-family:var(--amber-font)}
.stats{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;background:var(--amber-surface);border-radius:var(--amber-radius);padding:12px}
.stat b{display:block;font-size:26px;font-family:var(--amber-font-rounded);color:var(--amber-accent-text)}
.stat span{font-size:12px;color:var(--amber-text-secondary)}
h2{font-size:14px;margin:18px 0 8px;color:var(--amber-text-secondary);text-transform:uppercase;letter-spacing:.04em}
.chart{background:var(--amber-surface);border-radius:var(--amber-radius);padding:12px;display:flex;align-items:flex-end;gap:8px;height:120px;overflow-x:auto}
.col{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar{width:100%;max-width:36px;background:var(--amber-accent);border-radius:6px 6px 2px 2px;min-height:2px}
.col small{font-size:11px;color:var(--amber-text-secondary);margin-top:4px}
.col em{font-style:normal;font-size:11px;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{background:var(--amber-surface);border-radius:var(--amber-radius);overflow:hidden}
.cover{aspect-ratio:2/3;padding:12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative}
.cover::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.25)}
.cover .t{font-family:var(--amber-font-rounded);font-weight:700;font-size:15px;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.cover .a{font-size:11px;opacity:.9}
.meta{padding:8px 10px;font-size:12px;color:var(--amber-text-secondary);display:flex;justify-content:space-between;align-items:center}
.stars{color:var(--amber-accent-text);letter-spacing:1px;font-size:13px}
</style></head><body>
<div class="stats"><div class="stat"><b id="n">0</b><span>books read</span></div><div class="stat"><b id="avg">–</b><span>average rating</span></div><div class="stat"><b id="best">–</b><span>best month</span></div></div>
<h2>Books per month</h2><div class="chart" id="chart"></div>
<h2>Shelf</h2><div class="grid" id="grid"></div>
<script>
const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
amber.onChange(note=>{
 const t=note.tables[0];if(!t)return;
 const ix=n=>t.columns.findIndex(c=>c.name===n);
 const rows=t.rows.map(r=>({t:r[ix("Title")]||"",a:r[ix("Author")]||"",d:r[ix("Finished")]||"",r:parseInt(r[ix("Rating")])||0})).filter(b=>b.t);
 document.getElementById("n").textContent=rows.length;
 const rated=rows.filter(b=>b.r);
 document.getElementById("avg").textContent=rated.length?(rated.reduce((s,b)=>s+b.r,0)/rated.length).toFixed(1)+" ★":"–";
 const cnt={};rows.forEach(b=>{const k=b.d.slice(0,7);if(/^\d{4}-\d\d$/.test(k))cnt[k]=(cnt[k]||0)+1});
 const keys=Object.keys(cnt).sort();const chart=document.getElementById("chart");chart.innerHTML="";
 if(keys.length){
  const all=[];let [y,m]=keys[0].split("-").map(Number);const [ey,em]=keys[keys.length-1].split("-").map(Number);
  while(y<ey||(y===ey&&m<=em)){all.push(y+"-"+String(m).padStart(2,"0"));if(++m>12){m=1;y++}}
  const max=Math.max(...Object.values(cnt));
  let bk=keys[0];keys.forEach(k=>{if(cnt[k]>cnt[bk])bk=k});
  document.getElementById("best").textContent=M[+bk.slice(5)-1];
  all.forEach(k=>{const c=cnt[k]||0;const d=document.createElement("div");d.className="col";
   d.innerHTML='<em>'+c+'</em><div class="bar" style="height:'+(c/max*70)+'px"></div><small>'+M[+k.slice(5)-1]+'</small>';chart.appendChild(d)});
 }
 const g=document.getElementById("grid");g.innerHTML="";
 rows.slice().sort((a,b)=>b.d.localeCompare(a.d)).forEach(b=>{
  const h=hue(b.t);const c=document.createElement("div");c.className="card";
  c.innerHTML='<div class="cover" style="background:linear-gradient(160deg,hsl('+h+',55%,45%),hsl('+((h+40)%360)+',60%,30%))"><div class="t">'+esc(b.t)+'</div><div class="a">'+esc(b.a)+'</div></div><div class="meta"><span class="stars">'+"★".repeat(b.r)+"☆".repeat(5-b.r)+'</span><span>'+esc(b.d.slice(5).replace("-","/"))+'</span></div>';
  g.appendChild(c)});
});
</script></body></html>
