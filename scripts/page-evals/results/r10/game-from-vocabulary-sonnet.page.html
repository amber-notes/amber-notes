<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
main{max-width:var(--amber-content-max);margin:0 auto;padding:16px var(--amber-gutter) 48px}
h1{font-size:1.5rem;letter-spacing:-.02em;margin:4px 0 12px;font-family:var(--amber-font-rounded)}
.muted{color:var(--amber-text-secondary);font-size:.9rem}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:18px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius-small);padding:10px;text-align:center}
.stat b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums;font-family:var(--amber-font-rounded)}
.stat span{font-size:.8rem;color:var(--amber-text-secondary)}
button{font:inherit;font-weight:600;min-height:48px;padding:0 18px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-text);color:var(--amber-bg);cursor:pointer}
button.alt{background:var(--amber-fill);color:var(--amber-text)}
button.big{width:100%;min-height:60px;font-size:1.2rem}
.hud{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums;font-weight:600;margin-bottom:8px}
.bar{height:10px;background:var(--amber-fill);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--amber-accent);width:100%}
.prompt{text-align:center;padding:26px 10px 22px}
.prompt .dir{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--amber-text-secondary)}
.prompt .word{font-size:2.4rem;font-weight:700;font-family:var(--amber-font-rounded);overflow-wrap:anywhere;margin-top:6px}
.combo{min-height:1.6rem;text-align:center;font-weight:700;color:var(--amber-accent-text);margin-bottom:8px}
.opts{display:grid;gap:10px}
.opt{background:var(--amber-surface);color:var(--amber-text);border:2px solid var(--amber-separator);min-height:56px;text-align:left;padding:8px 16px;font-weight:500;display:flex;gap:12px;align-items:center}
.opt kbd{font-family:var(--amber-font-mono);font-size:.8rem;color:var(--amber-text-secondary)}
.opt.good{border-color:var(--amber-accent);background:var(--amber-accent-soft)}
.opt.bad{border-color:var(--amber-danger)}
.opt.bad::after{content:"✕ wrong";margin-left:auto;font-size:.85rem;color:var(--amber-danger)}
.opt.good::after{content:"✓ correct";margin-left:auto;font-size:.85rem;color:var(--amber-accent-text)}
.big-score{font-size:3.4rem;font-weight:800;text-align:center;font-family:var(--amber-font-rounded);font-variant-numeric:tabular-nums}
.center{text-align:center}
.miss{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--amber-separator)}
.row2{display:flex;gap:10px;margin-top:12px}.row2 button{flex:1}
.flash.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.flash.shake{animation:none}}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.dot{padding:4px 10px;border-radius:99px;background:var(--amber-fill);font-size:.85rem}
.dot.l1{background:var(--amber-accent-soft);outline:1px solid var(--amber-accent)}
.dot.l2{background:var(--amber-accent);color:var(--amber-on-accent);font-weight:600}
@media(min-width:700px){.opts{grid-template-columns:1fr 1fr}.prompt .word{font-size:3.2rem}}
@media(min-width:900px){.menu{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.menu .stats,.menu h1{grid-column:1/-1}.menu .card,.menu .stats{margin:0}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const ROUND=60, PENALTY=4;
let deck=[], g=null, screen="menu", raf=0, last=0;
const app=document.getElementById("app");
const store=()=>({best:amber.store.get("best")||0,streak:amber.store.get("streak")||0,lastDay:amber.store.get("lastDay")||"",rounds:amber.store.get("rounds")||0,mastery:amber.store.get("mastery")||{}});
function loadDeck(note){
  const t=note.tables.find(t=>t.columns.length>=2)||null;
  deck=t?t.rows.filter(r=>r[0]&&r[1]).map(r=>({es:r[0],en:r[1]})):[];
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function level(k){const m=store().mastery[k]||0;return m>=4?2:m>=1?1:0}
function menu(){
  const s=store();
  const dots=deck.map(d=>`<span class="dot l${level(d.es)}">${esc(d.es)}</span>`).join("");
  const mastered=deck.filter(d=>level(d.es)===2).length;
  if(deck.length<3){app.innerHTML=`<h1>${esc(amber.note.title)}</h1><div class="card center muted">Add at least 3 rows to the table (Spanish | English) to play.</div>`;return}
  app.innerHTML=`<div class="menu"><h1>${esc(amber.note.title)}</h1>
  <div class="stats"><div class="stat"><b>${s.best}</b><span>Best score</span></div><div class="stat"><b>${s.streak}</b><span>Day streak</span></div><div class="stat"><b>${mastered}/${deck.length}</b><span>Mastered</span></div></div>
  <div class="card center"><p style="margin:0 0 6px;font-weight:600">Verb Rush: ${ROUND} seconds</p>
  <p class="muted" style="margin:0 0 16px">Answer fast. Chain correct answers for a bigger combo. A wrong answer costs ${PENALTY} seconds and breaks your combo.</p>
  <button class="big" id="go">${s.lastDay===amber.note.today?"Play again":"Play today's round"}</button>
  <div class="dots" style="justify-content:center;margin-top:18px">${dots}</div>
  <p class="muted" style="margin:8px 0 0">${deck.length} verbs from your note: grey new, outlined learning, solid mastered.</p></div></div>`;
  document.getElementById("go").onclick=start;
}
function start(){
  g={time:ROUND,score:0,combo:0,maxCombo:0,right:0,wrong:0,misses:{},queue:[],locked:false,q:null,msg:""};
  screen="play";next();last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
}
function pickCard(){
  if(!g.queue.length){
    const m=store().mastery;
    // weight weaker verbs: repeat them
    let pool=[];deck.forEach(d=>{const w=Math.max(1,4-(m[d.es]||0));for(let i=0;i<w;i++)pool.push(d)});
    const seen=new Set();g.queue=shuffle(pool).filter(d=>seen.has(d.es)?false:(seen.add(d.es),true));
    if(g.q&&g.queue.length>1&&g.queue[0].es===g.q.card.es)g.queue.push(g.queue.shift());
  }
  return g.queue.shift();
}
function next(){
  const card=pickCard();
  const rev=Math.random()<0.3;
  const key=rev?"es":"en";
  const others=shuffle(deck.filter(d=>d.es!==card.es&&d[key]!==card[key])).slice(0,3);
  g.q={card,rev,opts:shuffle([card,...others]),picked:-1};
  g.locked=false;draw();
}
function draw(){
  const q=g.q,key=q.rev?"es":"en";
  app.innerHTML=`<h1>${esc(amber.note.title)}</h1>
  <div class="hud"><span>Score <span id="sc">${g.score}</span></span><span id="tm">${Math.ceil(g.time)}s</span></div>
  <div class="bar" role="progressbar" aria-label="Time left" aria-valuemin="0" aria-valuemax="${ROUND}" aria-valuenow="${Math.ceil(g.time)}"><i id="fill" style="width:${g.time/ROUND*100}%"></i></div>
  <div class="combo" id="cb">${g.combo>1?"Combo x"+g.combo:""}${g.msg?" "+g.msg:""}</div>
  <div class="card prompt flash" id="pr"><div class="dir">${q.rev?"English to Spanish":"Spanish to English"}</div><div class="word">${esc(q.rev?q.card.en:q.card.es)}</div></div>
  <div class="opts" id="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(o[key])}</span></button>`).join("")}</div>
  <div class="row2"><button class="alt" id="quit">End round</button></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  document.getElementById("quit").onclick=finish;
}
function answer(i){
  if(!g||screen!=="play"||g.locked)return;
  g.locked=true;
  const q=g.q,ok=q.opts[i].es===q.card.es;
  const mast=amber.store.get("mastery")||{};
  const k=q.card.es;
  const btns=document.querySelectorAll(".opt");
  btns[q.opts.findIndex(o=>o.es===k)].classList.add("good");
  if(ok){
    g.combo++;g.maxCombo=Math.max(g.maxCombo,g.combo);g.right++;
    g.score+=10*Math.min(g.combo,5);g.msg="";
    mast[k]=Math.min(5,(mast[k]||0)+1);
  }else{
    btns[i].classList.add("bad");document.getElementById("pr").classList.add("shake");
    g.combo=0;g.wrong++;g.time-=PENALTY;g.msg="";
    g.misses[k]=q.card;mast[k]=Math.max(0,(mast[k]||0)-2);
  }
  amber.store.set("mastery",mast);
  document.getElementById("sc").textContent=g.score;
  document.getElementById("cb").textContent=ok?(g.combo>1?"Combo x"+g.combo:"Correct"):"Wrong, -"+PENALTY+"s";
  setTimeout(()=>{if(g&&screen==="play"&&g.time>0)next()},ok?350:1100);
}
function tick(ts){
  if(screen!=="play")return;
  if(last){const dt=Math.min(.25,(ts-last)/1000);if(document.visibilityState==="visible")g.time-=dt}
  last=ts;
  if(g.time<=0){g.time=0;return finish()}
  const f=document.getElementById("fill"),t=document.getElementById("tm");
  if(f){f.style.width=g.time/ROUND*100+"%";t.textContent=Math.ceil(g.time)+"s"}
  raf=requestAnimationFrame(tick);
}
function finish(){
  if(screen!=="play")return;
  screen="end";cancelAnimationFrame(raf);
  const s=store();const today=amber.note.today;
  const newBest=g.score>s.best;
  let streak=s.streak;
  if(s.lastDay!==today){
    const y=new Date(today+"T00:00:00");y.setDate(y.getDate()-1);
    const yd=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    streak=s.lastDay===yd?s.streak+1:1;
  }
  amber.setData({values:{best:Math.max(s.best,g.score),streak,lastDay:today,rounds:s.rounds+1}}).then(r=>{if(r&&r.ok===false){const p=document.querySelector('.big-score');if(p)p.insertAdjacentText('afterend','Could not save progress: '+r.error)}});
  const miss=Object.values(g.misses);
  const acc=g.right+g.wrong?Math.round(g.right/(g.right+g.wrong)*100):0;
  app.innerHTML=`<h1>${esc(amber.note.title)}</h1>
  <div class="card"><div class="muted center">${newBest&&g.score>0?"New best score":"Round over"}</div><div class="big-score">${g.score}</div>
  <p class="center muted" style="margin:0">${g.right} right, ${g.wrong} wrong, ${acc}% accuracy, best combo x${g.maxCombo}<br>Day streak: ${streak}</p></div>
  ${miss.length?`<div class="card"><b>Review these</b>${miss.map(m=>`<div class="miss"><span>${esc(m.es)}</span><span class="muted">${esc(m.en)}</span></div>`).join("")}</div>`:`<div class="card center">No misses. Nice.</div>`}
  <div class="row2"><button id="again">Play again</button><button class="alt" id="home">Menu</button></div>`;
  document.getElementById("again").onclick=start;
  document.getElementById("home").onclick=()=>{screen="menu";menu()};
}
document.addEventListener("keydown",e=>{
  if(screen==="play"&&/^[1-4]$/.test(e.key))answer(+e.key-1);
  else if(screen!=="play"&&(e.key==="Enter")){const b=document.getElementById("go")||document.getElementById("again");if(b)b.click()}
});
amber.onChange(note=>{loadDeck(note);if(screen==="menu")menu()});
</script>
</body>
</html>
