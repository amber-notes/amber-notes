<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-settings" content='{"settings":[{"key":"weeklyGoal","label":"Weekly distance goal (km)","type":"number","default":20}]}'>
<style>
*{box-sizing:border-box}
main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 80px}
h1{font-size:1.75rem;letter-spacing:-.02em;margin:4px 0 16px}
h2{font-size:1rem;margin:0 0 12px}
.grid{display:grid;gap:16px}
@media(min-width:900px){.grid{grid-template-columns:3fr 2fr;align-items:start}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:14px 16px;margin-bottom:16px;overflow:hidden}
.stat .v{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--amber-font-rounded)}
.stat .l{font-size:.8rem;color:var(--amber-text-secondary)}
.muted{color:var(--amber-text-secondary);font-size:.85rem}
.bars{display:flex;align-items:flex-end;gap:8px;height:160px;position:relative;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bar i{display:block;width:100%;background:var(--amber-accent);border-radius:6px 6px 2px 2px;min-height:2px}
.bar.cur i{background:var(--amber-accent-text)}
.bar b{font-size:.75rem;font-variant-numeric:tabular-nums;margin-bottom:3px}
.xl{display:flex;gap:8px}.xl span{flex:1;text-align:center;font-size:.78rem;color:var(--amber-text-secondary);margin-top:4px;white-space:nowrap;min-width:0}
.goal{position:absolute;left:0;right:0;border-top:2px dashed var(--amber-text-secondary);pointer-events:none}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--amber-separator);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.row:first-of-type{border-top:0}
.row .d{flex:1 1 90px}.row .k{font-weight:600}
form{display:flex;flex-wrap:wrap;gap:8px}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--amber-text-secondary);flex:1 1 110px}
input{font:inherit;color:var(--amber-text);background:var(--amber-fill);border:0;border-radius:var(--amber-radius-small);padding:10px 12px;min-height:44px;width:100%}
button{font:inherit;font-weight:600;min-height:44px;padding:0 18px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-text);color:var(--amber-bg);align-self:flex-end}
.err{color:var(--amber-danger);min-height:1.2em;font-size:.85rem;margin-top:6px}
.empty{padding:24px;text-align:center;color:var(--amber-text-secondary)}
</style>
</head>
<body>
<main id="app"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const num=s=>{const n=parseFloat(String(s).replace(/\s/g,"").replace(",","."));return isNaN(n)?null:n};
const fi=(t,re)=>t.columns.findIndex(c=>re.test(c.name));
const D=s=>new Date(s+"T00:00:00Z");
const iso=d=>d.toISOString().slice(0,10);
const monday=s=>{const d=D(s);d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return iso(d)};
const addDays=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const fmtPace=m=>{if(!isFinite(m))return"–";const mm=Math.floor(m),ss=Math.round((m-mm)*60);return(ss==60?mm+1:mm)+":"+String(ss==60?0:ss).padStart(2,"0")};
const short=s=>D(s).toLocaleDateString(undefined,{month:"short",day:"numeric",timeZone:"UTC"});
let error="";
function render(note){
  const app=document.getElementById("app");
  const goal=(amber.settings&&num(amber.settings.weeklyGoal))||20;
  const t=note.tables.find(t=>fi(t,/date/i)>=0&&fi(t,/dist/i)>=0);
  if(!t){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Activity Date and Distance (km) columns.</div>`;return}
  const ci={d:fi(t,/date/i),k:fi(t,/dist/i),m:fi(t,/time/i),h:fi(t,/hr|heart/i)};
  const runs=t.rows.map((r,i)=>({i,date:r[ci.d],km:num(r[ci.k]),min:ci.m>=0?num(r[ci.m]):null,hr:ci.h>=0?num(r[ci.h]):null})).filter(r=>r.km!=null&&/^\d{4}-\d\d-\d\d$/.test(r.date)).sort((a,b)=>a.date<b.date?-1:1);
  const form=`<div class="card"><h2>Log a run</h2><form id="add"><label>Date<input name="d" type="date" required value="${esc(note.today)}"></label><label>Distance (km)<input name="k" type="number" step="0.1" min="0" required></label><label>Time (min)<input name="m" type="number" step="1" min="0"></label><label>Avg HR<input name="h" type="number" step="1" min="0"></label><button>Add run</button></form><div class="err" role="alert">${esc(error)}</div></div>`;
  let body;
  if(!runs.length){body=`<div class="card empty">No runs yet.</div>`+form}
  else{
    const tot=runs.reduce((a,r)=>a+r.km,0), tm=runs.reduce((a,r)=>a+(r.min||0),0);
    const withT=runs.filter(r=>r.min);const pk=withT.reduce((a,r)=>a+r.km,0);
    const hrs=runs.filter(r=>r.hr!=null);const ahr=hrs.length?hrs.reduce((a,r)=>a+r.hr,0)/hrs.length:null;
    const cw=monday(note.today);const weeks=[];
    for(let i=7;i>=0;i--){const s=addDays(cw,-7*i);weeks.push({s,km:0})}
    runs.forEach(r=>{const w=weeks.find(w=>w.s===monday(r.date));if(w)w.km+=r.km});
    const thisW=weeks[7].km;
    const max=Math.max(goal,...weeks.map(w=>w.km))*1.1;
    const longest=Math.max(...runs.map(r=>r.km));
    const bars=weeks.map((w,i)=>`<div class="bar${i==7?" cur":""}"><b>${w.km?w.km.toFixed(1):""}</b><i style="height:${(w.km/max*100).toFixed(1)}%"></i></div>`).join("");
    const labels=weeks.map((w,i)=>`<span>${i==0||D(w.s).getUTCMonth()!==D(weeks[i-1].s).getUTCMonth()?esc(short(w.s)).replace(/ /g,"\u00a0").replace(/^(\S+)\u00a0(\d+)$/,"$2\u00a0$1"):D(w.s).getUTCDate()}</span>`).join("");
    const recent=runs.slice().reverse().slice(0,12).map(r=>`<div class="row"><span class="d">${esc(short(r.date))}</span><span class="k">${r.km.toFixed(1)} km</span><span class="muted">${r.min?fmtPace(r.min/r.km)+" /km":""}</span><span class="muted">${r.hr!=null?r.hr+" bpm":""}</span></div>`).join("");
    body=`<div class="stats">
      <div class="card stat" style="margin:0"><div class="v">${thisW.toFixed(1)}<span class="muted"> / ${goal} km</span></div><div class="l">This week (Mon–Sun)</div></div>
      <div class="card stat" style="margin:0"><div class="v">${tot.toFixed(1)} km</div><div class="l">${runs.length} runs, ${Math.floor(tm/60)}h ${Math.round(tm%60)}m</div></div>
      <div class="card stat" style="margin:0"><div class="v">${tm?fmtPace(tm/pk):"–"}</div><div class="l">Avg pace /km</div></div>
      <div class="card stat" style="margin:0"><div class="v">${ahr?Math.round(ahr):"–"}</div><div class="l">Avg HR · longest ${longest.toFixed(1)} km</div></div></div>
      <div class="grid"><div>
      <div class="card"><h2>Weekly distance, last 8 weeks</h2><div class="bars" role="img" aria-label="Weekly kilometres: ${weeks.map(w=>short(w.s)+" "+w.km.toFixed(1)).join(", ")}. Goal ${goal} km."><div class="goal" style="bottom:${(goal/max*100*0.92).toFixed(1)}%"></div>${bars}</div><div class="xl">${labels}</div><p class="muted">Dashed line: weekly goal of ${goal} km. Week starts Monday.</p></div>
      ${form}</div>
      <div class="card"><h2>Recent runs</h2>${recent}</div></div>`;
  }
  app.innerHTML=`<h1>${esc(note.title)}</h1>`+body;
  const f=document.getElementById("add");
  if(f)f.onsubmit=async e=>{e.preventDefault();const g=n=>f.elements[n].value.trim();
    const v={};v[t.columns[ci.d].name]=g("d");v[t.columns[ci.k].name]=g("k");
    if(ci.m>=0&&g("m"))v[t.columns[ci.m].name]=g("m");
    if(ci.h>=0&&g("h"))v[t.columns[ci.h].name]=g("h");
    const r=await amber.update({op:"append_row",table:t.index,values:v});
    error=r.ok?"":r.error;if(!r.ok)render(amber.note)};
}
amber.onChange(render);
</script>
</body>
</html>
