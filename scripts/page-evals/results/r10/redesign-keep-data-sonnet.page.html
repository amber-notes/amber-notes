<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expenses</title>
<meta name="amber-settings" content='{"settings":[{"key":"budget","label":"Monthly budget","type":"number","default":15000},{"key":"currency","label":"Currency","type":"currency","default":"SEK"},{"key":"categories","label":"Categories","type":"list","default":[],"help":"Extra choices when you add an expense, besides the ones already in the note."}]}'>
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 8px var(--amber-gutter) 60px; }
  h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; margin: 6px 0 2px; }
  .hero { margin: 8px 0 20px; }
  .eyebrow { font-size: .8125rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-text-secondary); }
  .total { font-size: clamp(2.75rem, 12vw, 4.5rem); font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.05; margin: 4px 0; }
  .sub { color: var(--amber-text-secondary); font-size: .9375rem; }
  .meter { height: 8px; border-radius: 4px; background: var(--amber-fill); margin-top: 12px; overflow: hidden; }
  .meter div { height: 100%; background: var(--amber-accent); }
  .meter.over div { background: var(--amber-danger); }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); margin-bottom: 20px; overflow: hidden; border: 1px solid var(--amber-separator); }
  .label { font-size: .8125rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 0 4px 8px; }
  .chart { display: flex; align-items: flex-end; gap: 10px; padding: 16px 12px 8px; height: 220px; }
  .col { flex: 1 1 0; min-width: 0; max-width: 120px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; background: none; color: var(--amber-text); border-radius: var(--amber-radius-small); padding: 4px 2px; font: inherit; border: 0; min-height: 44px; cursor: pointer; }
  .col .v { font-size: .75rem; font-variant-numeric: tabular-nums; color: var(--amber-text-secondary); white-space: nowrap; }
  .col .b { width: 70%; min-height: 4px; border-radius: 6px 6px 2px 2px; background: var(--amber-accent-soft); border: 2px solid var(--amber-accent); }
  .col .m { font-size: .8125rem; font-weight: 600; }
  .col[aria-pressed="true"] .b { background: var(--amber-accent); }
  .col[aria-pressed="true"] .m { color: var(--amber-accent-text); text-decoration: underline; text-underline-offset: 3px; }
  .grp-h { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px 6px; border-top: 1px solid var(--amber-separator); background: var(--amber-fill); }
  .grp-h:first-child { border-top: 0; }
  .grp-h .n { flex: 1; font-weight: 700; }
  .grp-h .pct { color: var(--amber-text-secondary); font-size: .8125rem; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: .5px solid var(--amber-separator); min-height: 48px; }
  .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .muted { color: var(--amber-text-secondary); font-size: .8125rem; }
  .empty { padding: 24px 16px; text-align: center; color: var(--amber-text-secondary); }
  form { display: grid; grid-template-columns: 1.4fr 1fr .9fr auto; gap: 8px; padding: 12px; }
  input, select { font: inherit; font-size: 1rem; padding: 9px 10px; min-height: 44px; border-radius: var(--amber-radius-small); border: 0; background: var(--amber-fill); color: var(--amber-text); min-width: 0; width: 100%; }
  button.add { font: inherit; font-weight: 600; border: 0; min-height: 44px; border-radius: var(--amber-radius-small); padding: 0 16px; background: var(--amber-accent-soft); color: var(--amber-text); border: 2px solid var(--amber-accent); }
  .err { color: var(--amber-danger); font-size: .875rem; padding: 0 16px 10px; }
  .sr { position: absolute; left: -9999px; }
  @media (max-width: 599px) { form { grid-template-columns: 1fr 1fr; } form input[name=item] { grid-column: 1 / -1; } }
  @media (min-width: 900px) {
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 28px; align-items: start; }
    .layout > section { min-width: 0; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const money = (n) => { const c = (amber.settings && amber.settings.currency) || "SEK"; return c === "SEK" ? Math.round(n).toLocaleString("sv-SE") + " kr" : n.toLocaleString("en-GB", { style: "currency", currency: c, maximumFractionDigits: 0 }); };
  const short = (n) => n >= 10000 ? Math.round(n / 1000) + "k" : n >= 1000 ? (n / 1000).toFixed(1).replace(".0", "") + "k" : String(Math.round(n));
  const num = (s) => { const v = parseFloat(String(s ?? "").replace(/\s/g, "").replace(",", ".")); return isNaN(v) ? 0 : v; };
  const monthName = (k, long) => { const [y, m] = k.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleString("en-GB", { month: long ? "long" : "short" }) + (long ? " " + y : ""); };
  let selected = null, error = "";

  function render(note) {
    const app = document.getElementById("app");
    const t = note.tables.find((t) => t.columns.some((c) => /^(amt|amount|cost|price|kr|sum)$/i.test(c.name)));
    if (!t) { app.innerHTML = `<h1>${esc(note.title)}</h1><div class="card empty">Add a table with Date, Item, Category and Amt columns.</div>`; return; }
    const col = (re) => t.columns.findIndex((c) => re.test(c.name));
    const a = col(/^(amt|amount|cost|price|kr|sum)$/i), cat = col(/categ/i), item = col(/item|what|description|name/i), date = col(/^date$/i);
    const rows = t.rows.map((r, i) => ({ r, i, n: num(r[a]), m: date >= 0 && /^\d{4}-\d{2}/.test(r[date]) ? r[date].slice(0, 7) : "", c: (cat >= 0 && r[cat]) || "Other" }));
    const months = [...new Set(rows.map((x) => x.m).filter(Boolean))].sort();
    const thisM = note.today.slice(0, 7);
    if (!selected || !months.includes(selected)) selected = months.includes(thisM) ? thisM : months[months.length - 1] || null;
    const sums = Object.fromEntries(months.map((m) => [m, rows.filter((x) => x.m === m).reduce((s, x) => s + x.n, 0)]));
    const max = Math.max(1, ...Object.values(sums));
    const cur = rows.filter((x) => x.m === selected);
    const total = selected ? sums[selected] : 0;
    const budget = Number(amber.settings && amber.settings.budget) || 0;
    const groups = new Map();
    for (const x of cur) { if (!groups.has(x.c)) groups.set(x.c, []); groups.get(x.c).push(x); }
    const gl = [...groups].map(([k, xs]) => [k, xs, xs.reduce((s, x) => s + x.n, 0)]).sort((p, q) => q[2] - p[2]);
    const cats = [...new Set([...((amber.settings && amber.settings.categories) || []), ...rows.map((x) => x.c)])];

    app.innerHTML = `
      <h1>${esc(note.title)}</h1>
      <div class="hero">
        <div class="eyebrow">${selected ? esc(monthName(selected, true)) : "No month yet"}</div>
        <div class="total" aria-label="Total for the month">${money(total)}</div>
        <div class="sub">${cur.length} entries${budget ? ` · ${total <= budget ? money(budget - total) + " left of " + money(budget) : money(total - budget) + " over " + money(budget)}` : ""}</div>
        ${budget ? `<div class="meter ${total > budget ? "over" : ""}" role="img" aria-label="${Math.round(100 * total / budget)}% of budget"><div style="width:${Math.min(100, 100 * total / budget).toFixed(1)}%"></div></div>` : ""}
      </div>
      <div class="layout"><section>
        <div class="label">By month</div>
        <div class="card"><div class="chart">${months.length ? months.map((m) => `<button class="col" data-m="${m}" aria-pressed="${m === selected}" aria-label="${esc(monthName(m, true))}: ${money(sums[m])}"><span class="v">${short(sums[m])}</span><span class="b" style="height:${Math.max(2, 78 * sums[m] / max).toFixed(1)}%"></span><span class="m">${esc(monthName(m))}</span></button>`).join("") : '<div class="empty" style="width:100%">No dated rows yet.</div>'}</div></div>
        <div class="label">Add an expense</div>
        <div class="card">
          <form id="add">
            <input name="item" aria-label="What" placeholder="What" required>
            <select name="cat" aria-label="Category">${cats.map((k) => `<option>${esc(k)}</option>`).join("")}</select>
            <input name="amount" aria-label="Amount" placeholder="Amount" inputmode="decimal" required>
            <button class="add">Add</button>
          </form>
          ${error ? `<div class="err" role="alert">${esc(error)}</div>` : ""}
        </div>
      </section><section>
        <div class="label">By category</div>
        <div class="card">${gl.length ? gl.map(([k, xs, s]) => `<div class="grp-h"><span class="n">${esc(k)}</span><span class="pct">${Math.round(100 * s / (total || 1))}%</span><span class="amt">${money(s)}</span></div>${xs.slice().sort((p, q) => (q.r[date] || "").localeCompare(p.r[date] || "")).map((x) => `<div class="item"><div class="grow">${esc(item >= 0 ? x.r[item] : "")}<div class="muted">${esc(date >= 0 ? x.r[date] : "")}</div></div><div class="amt">${money(x.n)}</div></div>`).join("")}`).join("") : '<div class="empty">Nothing this month.</div>'}</div>
      </section></div>`;
    app.querySelectorAll(".col").forEach((b) => b.addEventListener("click", () => { selected = b.dataset.m; render(amber.note); }));
    document.getElementById("add").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const values = { [t.columns[a].name]: String(f.get("amount")).trim() };
      if (item >= 0) values[t.columns[item].name] = String(f.get("item")).trim();
      if (cat >= 0) values[t.columns[cat].name] = String(f.get("cat"));
      if (date >= 0) { values[t.columns[date].name] = note.today; selected = note.today.slice(0, 7); }
      const r = await amber.update({ op: "append_row", table: t.index, values });
      error = r.ok ? "" : r.error;
      if (!r.ok) render(amber.note);
    });
  }
  amber.onChange(render);
</script>
</body>
</html>
