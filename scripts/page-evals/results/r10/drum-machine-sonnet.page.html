<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 64px; }
  h1 { font-size: 1.75rem; letter-spacing: -.02em; margin: 4px 0 14px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 20px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-text); color: var(--amber-bg); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  button.sec { background: var(--amber-fill); color: var(--amber-text); }
  .tempo { display: flex; align-items: center; gap: 8px; color: var(--amber-text-secondary); font-size: .9rem; flex: 1 1 220px; }
  .tempo input[type=range] { flex: 1; min-width: 80px; min-height: 44px; accent-color: var(--amber-accent); }
  .tempo output { color: var(--amber-text); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 4.5em; }
  .lane { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 10px 12px 12px; margin-bottom: 12px; }
  .lane h2 { font-size: .85rem; margin: 0 0 8px; color: var(--amber-text-secondary); text-transform: uppercase; letter-spacing: .06em; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  @media (min-width: 700px) { .steps { grid-template-columns: repeat(16, 1fr); } }
  .step { min-height: 44px; padding: 0; border-radius: var(--amber-radius-small); background: var(--amber-fill); color: var(--amber-text); font-size: .8rem; font-variant-numeric: tabular-nums; border: 2px solid transparent; position: relative; }
  .step.beat { font-weight: 700; }
  .step.on { background: var(--amber-accent); color: #1a1200; font-weight: 700; }
  .step.now { border-color: var(--amber-text); transform: scale(1.06); }
  .hint { color: var(--amber-text-secondary); font-size: .85rem; margin-top: 12px; }
  .err { color: var(--amber-danger); min-height: 1.2em; }
  .empty { padding: 28px 16px; text-align: center; color: var(--amber-text-secondary); }
  @media (prefers-color-scheme: dark) { .step.on { color: #1a1200; } }
  @media (prefers-reduced-motion: reduce) { .step.now { transform: none; } }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="bar">
    <button id="play" aria-label="Play"></button>
    <div class="tempo"><label for="bpm">Tempo</label><input id="bpm" type="range" min="60" max="200" step="1"><output id="bpmOut" for="bpm"></output></div>
    <button class="sec" id="clear">Clear</button>
  </div>
  <div id="grid"></div>
  <div class="err" id="err" role="alert"></div>
  <div class="hint">Tap a step to switch it on or off. Changes are saved in the note's table, and edits made there are played too.</div>
</main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const isOn = (s) => /^(x|✓|yes|1|true|●)$/i.test(String(s || "").trim());
  const ICON_PLAY = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 2l12 7-12 7z" fill="currentColor"/></svg>Play';
  const ICON_STOP = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="3" width="12" height="12" rx="2" fill="currentColor"/></svg>Stop';

  let note = null, tbl = null, bpm = 120, playing = false, cur = -1;
  let ctx = null, nextTime = 0, nextStep = 0, timer = null, queue = [], raf = null;
  const $ = (id) => document.getElementById(id);

  function findTable(n) {
    return n.tables.find((t) => t.columns.length > 1 && /^step$/i.test(t.columns[0].name)) || n.tables.find((t) => t.columns.length > 1);
  }
  function noteBpm(n) {
    const m = /(\d{2,3})\s*bpm/i.exec(n.markdown || "");
    return m ? Math.min(200, Math.max(60, +m[1])) : 120;
  }

  function render(n, data) {
    note = n; tbl = findTable(n);
    $("title").textContent = n.title;
    const saved = data && data.values && data.values.bpm;
    if (document.activeElement !== $("bpm")) { bpm = saved || noteBpm(n); $("bpm").value = bpm; }
    $("bpmOut").textContent = bpm + " bpm";
    $("play").innerHTML = playing ? ICON_STOP : ICON_PLAY;
    $("play").setAttribute("aria-label", playing ? "Stop" : "Play");
    const g = $("grid");
    if (!tbl || !tbl.rows.length) { g.innerHTML = '<div class="lane empty">Add a table with a Step column and one column per drum (Kick, Snare, Hat) to the note.</div>'; return; }
    g.innerHTML = tbl.columns.slice(1).map((c, ci) => `
      <section class="lane"><h2>${esc(c.name)}</h2><div class="steps">${tbl.rows.map((r, ri) => {
        const on = isOn(r[ci + 1]);
        return `<button class="step${on ? " on" : ""}${ri % 4 === 0 ? " beat" : ""}" data-r="${ri}" data-c="${ci + 1}" aria-pressed="${on}" aria-label="${esc(c.name)} step ${ri + 1}">${ri + 1}</button>`;
      }).join("")}</div></section>`).join("");
    markNow();
  }

  function markNow() {
    document.querySelectorAll(".step.now").forEach((e) => e.classList.remove("now"));
    if (cur >= 0) document.querySelectorAll(`.step[data-r="${cur}"]`).forEach((e) => e.classList.add("now"));
  }

  // ---- sound ----
  function noiseBuf() {
    const b = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  let nb = null;
  function env(g, t, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
  function noise(t, dur, type, freq, peak) {
    const s = ctx.createBufferSource(); s.buffer = nb;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ctx.createGain(); env(g, t, peak, dur);
    s.connect(f); f.connect(g); g.connect(ctx.destination); s.start(t); s.stop(t + dur + 0.02);
  }
  function tone(t, f0, f1, dur, peak, wave) {
    const o = ctx.createOscillator(); o.type = wave || "sine";
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain(); env(g, t, peak, dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function hit(name, t) {
    const n = name.toLowerCase();
    if (/kick|bass|bd/.test(n)) tone(t, 150, 45, 0.35, 0.9);
    else if (/snare|sd/.test(n)) { noise(t, 0.18, "highpass", 1500, 0.5); tone(t, 220, 140, 0.12, 0.4, "triangle"); }
    else if (/clap/.test(n)) { noise(t, 0.04, "bandpass", 1200, 0.5); noise(t + 0.02, 0.04, "bandpass", 1200, 0.5); noise(t + 0.04, 0.15, "bandpass", 1200, 0.5); }
    else if (/open/.test(n)) noise(t, 0.35, "highpass", 7000, 0.25);
    else if (/hat|hh/.test(n)) noise(t, 0.05, "highpass", 8000, 0.3);
    else if (/tom/.test(n)) tone(t, 200, 90, 0.3, 0.6);
    else tone(t, 660, 600, 0.12, 0.3, "square");
  }

  function schedule() {
    const spb = 60 / bpm / 4; // 16th notes
    while (nextTime < ctx.currentTime + 0.15) {
      const rows = tbl ? tbl.rows : [];
      if (rows.length) {
        const s = nextStep % rows.length;
        tbl.columns.slice(1).forEach((c, ci) => { if (isOn(rows[s][ci + 1])) hit(c.name, nextTime); });
        queue.push({ t: nextTime, s });
        nextStep = s + 1;
      }
      nextTime += spb;
    }
  }
  function tick() {
    if (!playing) return;
    const now = ctx.currentTime;
    let last = null;
    while (queue.length && queue[0].t <= now) last = queue.shift();
    if (last && last.s !== cur) { cur = last.s; markNow(); }
    raf = requestAnimationFrame(tick);
  }
  function start() {
    if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); nb = noiseBuf(); }
    if (ctx.state === "suspended") ctx.resume();
    playing = true; nextStep = 0; nextTime = ctx.currentTime + 0.06; queue = [];
    timer = setInterval(schedule, 25); schedule();
    raf = requestAnimationFrame(tick);
    $("play").innerHTML = ICON_STOP; $("play").setAttribute("aria-label", "Stop");
  }
  function stop() {
    playing = false; clearInterval(timer); cancelAnimationFrame(raf); queue = []; cur = -1; markNow();
    $("play").innerHTML = ICON_PLAY; $("play").setAttribute("aria-label", "Play");
  }

  $("play").onclick = () => (playing ? stop() : start());
  document.addEventListener("visibilitychange", () => { if (document.hidden && playing) stop(); });
  document.addEventListener("keydown", (e) => { if (e.code === "Space" && !/INPUT|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); $("play").click(); } });

  $("bpm").addEventListener("input", (e) => { bpm = +e.target.value; $("bpmOut").textContent = bpm + " bpm"; });
  $("bpm").addEventListener("change", (e) => { amber.store.set("bpm", +e.target.value); });

  $("grid").addEventListener("click", async (e) => {
    const b = e.target.closest(".step"); if (!b || !tbl) return;
    const r = +b.dataset.r, c = +b.dataset.c;
    const on = isOn(tbl.rows[r][c]);
    if (!on && ctx && !playing) hit(tbl.columns[c].name, ctx.currentTime);
    const res = await amber.update({ op: "set_cell", table: tbl.index, row: r, col: c, value: on ? "" : "x" });
    $("err").textContent = res.ok ? "" : res.error;
  });
  $("clear").onclick = async () => {
    if (!tbl) return;
    const ops = [];
    tbl.rows.forEach((row, r) => tbl.columns.slice(1).forEach((c, ci) => { if (isOn(row[ci + 1])) ops.push({ op: "set_cell", table: tbl.index, row: r, col: ci + 1, value: "" }); }));
    if (!ops.length) return;
    const res = await amber.update(ops);
    $("err").textContent = res.ok ? "" : res.error;
  };

  amber.onChange(render);
</script>
</body>
</html>
