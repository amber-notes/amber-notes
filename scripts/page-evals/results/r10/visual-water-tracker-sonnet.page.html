<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-settings" content='{"settings":[{"key":"goal","label":"Daily goal (glasses)","type":"number","default":8,"help":"Used when the note has no Goal: N line."}]}'>
<style>
*{box-sizing:border-box}
main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 64px}
h1{font-size:1.75rem;letter-spacing:-.02em;margin:4px 0 16px}
h2{font-size:.8125rem;text-transform:uppercase;letter-spacing:.06em;color:var(--amber-text-secondary);margin:0 0 12px}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);padding:16px;margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.grid{grid-template-columns:5fr 7fr}.grid .card{margin-bottom:0}}
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.big{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;font-family:var(--amber-font-rounded)}
.big small{font-size:1.25rem;color:var(--amber-text-secondary);font-weight:600}
.muted{color:var(--amber-text-secondary);font-size:.875rem}
.glasses{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:8px;margin-top:16px}
.glasses svg{width:100%;height:auto;display:block}
.water{fill:var(--amber-accent)}.empty{fill:var(--amber-fill)}
.outline{fill:none;stroke:var(--amber-text-secondary);stroke-width:2}
.btns{display:flex;gap:8px;margin-top:16px}
button{font:inherit;font-weight:600;min-height:44px;padding:0 18px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-text);color:var(--amber-bg);cursor:pointer}
button.sec{background:var(--amber-fill);color:var(--amber-text)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--amber-fill);border-radius:var(--amber-radius-small);padding:10px}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--amber-text-secondary)}
.chart{display:flex;align-items:flex-end;gap:4px;height:200px;position:relative;padding-top:8px}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bar{width:100%;border-radius:5px 5px 2px 2px;background:var(--amber-accent-soft);border:2px solid var(--amber-accent);min-height:3px}
.bar.hit{background:var(--amber-accent)}
.bar.today{outline:2px solid var(--amber-text);outline-offset:2px}
.v{font-size:.75rem;font-variant-numeric:tabular-nums;color:var(--amber-text-secondary)}
.goal{position:absolute;left:0;right:0;border-top:2px dashed var(--amber-text-secondary);pointer-events:none}
.goal span{position:absolute;right:0;top:-1.4em;font-size:.75rem;color:var(--amber-text-secondary);background:var(--amber-surface);padding:0 4px}
.days{display:flex;gap:4px;margin-top:6px}
.days div{flex:1;text-align:center;font-size:.75rem;color:var(--amber-text-secondary);min-width:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;border:2px solid var(--amber-accent)}
.err{color:var(--amber-danger);min-height:1.2em;margin-top:8px;font-size:.875rem}
.emptymsg{text-align:center;padding:28px;color:var(--amber-text-secondary)}
</style>
</head>
<body>
<main id="app"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
let error="";
const num=s=>{const n=parseFloat(String(s).replace(/\s/g,"").replace(",","."));return isNaN(n)?null:n};
function render(note){
  const app=document.getElementById("app");
  const t=note.tables.find(t=>t.columns.some(c=>/^date$/i.test(c.name)));
  if(!t){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card emptymsg">Add a table with Date and Glasses columns to see it here.</div>`;return}
  const di=t.columns.findIndex(c=>/^date$/i.test(c.name));
  let gi=t.columns.findIndex(c=>/glass|cup|water|ml|l$/i.test(c.name));
  if(gi<0)gi=t.columns.findIndex((c,i)=>i!==di);
  const m=/goal\D{0,12}(\d+(?:[.,]\d+)?)/i.exec(note.markdown||"");
  const goal=Math.max(1,(m&&num(m[1]))||(amber.settings&&num(amber.settings.goal))||8);
  const today=note.today;
  const byDate={};t.rows.forEach((r,i)=>{byDate[r[di]]={v:num(r[gi])||0,i}});
  const rows=Object.keys(byDate).sort().map(d=>({d,v:byDate[d].v}));
  const todayRow=byDate[today];
  const tv=todayRow?todayRow.v:0;
  // streak of goal-hit days, ending today (if today not yet hit, count from yesterday)
  let streak=0;
  const idx=rows.findIndex(r=>r.d===today);
  let k=(idx>=0?idx:rows.length-1);
  if(k>=0&&rows[k].d===today&&rows[k].v<goal)k--;
  for(;k>=0&&rows[k].v>=goal;k--)streak++;
  const last7=rows.slice(-7);
  const avg=last7.length?last7.reduce((a,r)=>a+r.v,0)/last7.length:0;
  const hit=rows.filter(r=>r.v>=goal).length;
  const shown=rows.slice(-14);
  const max=Math.max(goal,...shown.map(r=>r.v),1)*1.1;
  const nG=Math.max(goal,Math.ceil(tv));
  const glass=(f)=>`<svg viewBox="0 0 40 52" aria-hidden="true"><path class="${f?'water':'empty'}" d="M6 6h28l-3.5 40a4 4 0 0 1-4 3.5h-13a4 4 0 0 1-4-3.5z"/><path class="outline" d="M6 6h28l-3.5 40a4 4 0 0 1-4 3.5h-13a4 4 0 0 1-4-3.5z"/></svg>`;
  const left=goal-tv;
  const msg=tv>=goal?(tv>goal?`Goal smashed, ${tv-goal} over`:"Goal reached"):`${left} more to go`;
  const dn=d=>["S","M","T","W","T","F","S"][new Date(d+"T12:00:00").getDay()];
  app.innerHTML=`<h1>${esc(note.title)}</h1>
  <div class="grid">
   <section class="card" aria-label="Today">
    <h2>Today</h2>
    <div class="hero"><div class="big">${tv}<small> / ${goal}</small></div><div class="muted">${msg}</div></div>
    <div class="glasses" role="img" aria-label="${tv} of ${goal} glasses today">${Array.from({length:nG},(_,i)=>glass(i<tv)).join("")}</div>
    <div class="btns"><button id="plus" aria-label="Add one glass">+ 1 glass</button><button id="minus" class="sec" aria-label="Remove one glass">− 1</button></div>
    <div class="err" role="alert">${esc(error)}</div>
    <div class="stats">
     <div class="stat"><b>${streak}</b><span>day streak</span></div>
     <div class="stat"><b>${avg.toFixed(1)}</b><span>7-day avg</span></div>
     <div class="stat"><b>${hit}/${rows.length}</b><span>days on goal</span></div>
    </div>
   </section>
   <section class="card" aria-label="Last 14 days">
    <h2>Last ${shown.length} days</h2>
    <div class="chart" role="img" aria-label="Bar chart of glasses per day. ${shown.map(r=>r.d+': '+r.v).join(', ')}">
     <div class="goal" style="bottom:calc((100% - 8px) * ${goal/max})"><span>goal ${goal}</span></div>
     ${shown.map(r=>`<div class="col"><div class="v">${r.v}</div><div class="bar ${r.v>=goal?'hit':''} ${r.d===today?'today':''}" style="height:calc((100% - 24px) * ${r.v/max})"></div></div>`).join("")}
    </div>
    <div class="days">${shown.map(r=>`<div>${dn(r.d)}<br>${r.d.slice(8)}</div>`).join("")}</div>
    <div class="legend muted"><span><i class="sw" style="background:var(--amber-accent)"></i>Goal met</span><span><i class="sw" style="background:var(--amber-accent-soft)"></i>Below goal</span></div>
   </section>
  </div>`;
  const set=async nv=>{
    nv=Math.max(0,nv);
    const r=todayRow?await amber.update({op:"set_cell",table:t.index,row:todayRow.i,col:gi,value:String(nv)})
      :await amber.update({op:"append_row",table:t.index,values:{[t.columns[di].name]:today,[t.columns[gi].name]:String(nv)}});
    error=r.ok?"":r.error;if(!r.ok)render(amber.note);
  };
  document.getElementById("plus").onclick=()=>set(tv+1);
  document.getElementById("minus").onclick=()=>set(tv-1);
}
amber.onChange(render);
</script>
</body>
</html>
