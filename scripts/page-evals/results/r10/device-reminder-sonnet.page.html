<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-settings" content='{"settings": [{"key": "packTime", "label": "Packing reminder time", "type": "text", "default": "20:00", "help": "hh:mm on the evening before the outbound flight."}]}'>
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 96px; }
  h1 { font-size: 1.9rem; letter-spacing: -.02em; margin: 4px 0 8px; }
  h2 { display: flex; justify-content: space-between; font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 22px 4px 8px; }
  .count { display: inline-flex; align-items: baseline; gap: 8px; background: var(--amber-accent-soft); border-radius: 14px; padding: 10px 14px; }
  .count b { font-size: 2rem; font-variant-numeric: tabular-nums; }
  .grid { display: grid; gap: 16px; }
  @media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; align-items: start; } }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); overflow: hidden; }
  .fact { display: grid; grid-template-columns: minmax(80px, 28%) 1fr; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--amber-separator); }
  .fact:first-child, .item:first-child, .idea:first-child { border-top: 0; }
  .fact dt { color: var(--amber-text-secondary); font-size: .9rem; }
  .fact dd { margin: 0; overflow-wrap: anywhere; }
  .idea { padding: 12px 16px; border-top: 1px solid var(--amber-separator); overflow-wrap: anywhere; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--amber-separator); min-height: 48px; cursor: pointer; }
  .item input { width: 22px; height: 22px; flex: none; accent-color: var(--amber-accent); }
  .item.done span { color: var(--amber-text-secondary); text-decoration: line-through; }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 18px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-accent); color: var(--amber-on-accent); }
  button:disabled { background: var(--amber-fill); color: var(--amber-text); }
  .remind { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 16px; }
  .remind p { margin: 0; flex: 1 1 200px; color: var(--amber-text-secondary); font-size: .9rem; }
  .msg { margin: 8px 4px; min-height: 1.2em; font-size: .9rem; }
  .err { color: var(--amber-danger); }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const MON = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  const pad = (n) => String(n).padStart(2, "0");
  let msg = "", bad = false;

  function outbound(note) {
    const m = note.markdown.match(/out\s+(?:\w+\s+)?(\d{1,2})\s+([a-z]{3})[a-z]*\s+(\d{1,2}):(\d{2})/i);
    if (!m) return null;
    const mo = MON.indexOf(m[2].toLowerCase());
    if (mo < 0) return null;
    let y = +note.today.slice(0, 4);
    return { y, mo: mo + 1, d: +m[1], h: +m[3], mi: +m[4] };
  }
  function eveIso(f, time) {
    const t = /^(\d{1,2}):(\d{2})$/.exec(time || "") || ["", "20", "00"];
    const x = new Date(Date.UTC(f.y, f.mo - 1, f.d - 1));
    return `${x.getUTCFullYear()}-${pad(x.getUTCMonth() + 1)}-${pad(x.getUTCDate())}T${pad(+t[1])}:${t[2]}:00`;
  }

  function render(note) {
    const lines = note.markdown.split("\n");
    const facts = [];
    for (const l of lines) {
      const m = l.match(/^(flights|hotel|budget)\s*[:~]?\s*(.+)$/i);
      if (m) facts.push({ k: m[1][0].toUpperCase() + m[1].slice(1).toLowerCase(), v: m[2].replace(/^~\s*/, "~ ") });
    }
    const ideas = [];
    let inIdeas = false;
    for (const l of lines) {
      if (/^ideas\s*$/i.test(l.trim())) { inIdeas = true; continue; }
      if (inIdeas) { const m = l.match(/^\s*[-*]\s+(?!\[)(.+)$/); if (m) ideas.push(m[1]); else if (l.trim()) break; }
    }
    const f = outbound(note);
    let days = null;
    if (f) days = Math.round((Date.UTC(f.y, f.mo - 1, f.d) - Date.parse(note.today + "T00:00:00Z")) / 864e5);
    const items = note.checklists;
    const done = items.filter((c) => c.checked).length;
    const time = (amber.settings && amber.settings.packTime) || "20:00";
    document.getElementById("app").innerHTML = `
      <h1>${esc(note.title)}</h1>
      ${days !== null ? `<div class="count">${days > 0 ? `<b>${days}</b> day${days === 1 ? "" : "s"} to go` : days === 0 ? `<b>Today</b>` : `<b>${-days}</b> days ago`}</div>` : ""}
      <h2><span>Packing reminder</span></h2>
      <div class="card remind">
        <p>${f ? `Set a reminder on your phone for the evening before the flight (${f.d - 1} ${MON[f.mo - 1]}, ${esc(time)}).` : "Add a flight line like “out fri 16 oct 07:10” to the note to set this."}</p>
        <button id="rem" ${f ? "" : "disabled"}>Remind me to pack</button>
      </div>
      <div class="msg ${bad ? "err" : ""}" role="status">${esc(msg)}</div>
      <div class="grid">
        <div>
          ${facts.length ? `<h2><span>At a glance</span></h2><dl class="card" style="margin:0">${facts.map((x) => `<div class="fact"><dt>${esc(x.k)}</dt><dd>${esc(x.v)}</dd></div>`).join("")}</dl>` : ""}
          ${ideas.length ? `<h2><span>Ideas</span></h2><div class="card">${ideas.map((i) => `<div class="idea">${esc(i)}</div>`).join("")}</div>` : ""}
        </div>
        <div>
          ${items.length ? `<h2><span>To do before</span><span>${done}/${items.length}</span></h2><div class="card">${items.map((c) => `<label class="item ${c.checked ? "done" : ""}"><input type="checkbox" data-line="${c.line}" ${c.checked ? "checked" : ""}><span>${esc(c.text)}</span></label>`).join("")}</div>` : ""}
        </div>
      </div>`;
    document.querySelectorAll("[data-line]").forEach((b) => b.addEventListener("change", async () => {
      const r = await amber.update({ op: "toggle_checklist", line: Number(b.dataset.line) });
      if (!r.ok) { bad = true; msg = r.error; render(amber.note); }
    }));
    const btn = document.getElementById("rem");
    if (btn && f) btn.onclick = async () => {
      const r = await amber.device.reminders.create({ title: "Pack for Porto (flight tomorrow 07:10)".replace("07:10", pad(f.h) + ":" + pad(f.mi)), due: eveIso(f, time) });
      bad = !r.ok;
      msg = r.ok ? `Reminder set for ${f.d - 1} ${MON[f.mo - 1]} at ${time}.` : (r.error || "Couldn't set the reminder.");
      render(amber.note);
    };
  }
  amber.onChange(render);
</script>
</body>
</html>
