<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 80px}
h1{font-size:1.75rem;letter-spacing:-.02em;margin:4px 0 4px}
.sub{color:var(--amber-text-secondary);font-size:.9rem;margin-bottom:16px}
.layout{display:grid;gap:16px}
@media(min-width:900px){.layout{grid-template-columns:300px 1fr;align-items:start}}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);overflow:hidden}
.plan{padding:8px}
.wk{font-size:.8rem;color:var(--amber-text-secondary);text-transform:uppercase;letter-spacing:.05em;padding:10px 8px 4px;display:flex;justify-content:space-between}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.day{min-height:56px;border-radius:var(--amber-radius-small);background:var(--amber-fill);color:var(--amber-text);border:2px solid transparent;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.day small{font-size:.75rem;color:var(--amber-text-secondary)}
.day.sel{border-color:var(--amber-accent)}
.day.full{background:var(--amber-accent-soft)}
.day.full small{color:var(--amber-accent-text);font-weight:600}
.head{padding:16px;border-bottom:1px solid var(--amber-separator)}
.head h2{margin:0;font-size:1.4rem}
.badge{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--amber-accent-soft);color:var(--amber-accent-text);margin-left:6px;vertical-align:middle}
.bar{height:8px;border-radius:4px;background:var(--amber-fill);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber-accent);transition:width .2s}
.lift{padding:16px;border-top:1px solid var(--amber-separator)}
.lift:first-of-type{border-top:0}
.lh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lh b{font-size:1.15rem}
.kg{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem}
.rx{color:var(--amber-text-secondary);font-size:.9rem;margin:2px 0 10px}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.set{min-width:72px;min-height:56px;padding:0 14px;border-radius:var(--amber-radius-small);border:2px solid var(--amber-separator);background:var(--amber-fill);color:var(--amber-text);font:inherit;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.set small{font-weight:400;font-size:.75rem;color:var(--amber-text-secondary)}
.set.on{background:var(--amber-accent);border-color:var(--amber-accent);color:var(--amber-on-accent)}
.set.on small{color:var(--amber-on-accent)}
.nav{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--amber-separator);justify-content:space-between}
.nav button{min-height:44px;padding:0 16px;border:0;border-radius:var(--amber-radius-small);background:var(--amber-fill);color:var(--amber-text);font:inherit;font-weight:600;cursor:pointer}
.nav button.p{background:var(--amber-accent-soft);color:var(--amber-text);box-shadow:inset 0 0 0 2px var(--amber-accent)}.nav button.p:disabled{background:var(--amber-fill);color:var(--amber-text-secondary)}
.nav button:disabled{background:var(--amber-fill);color:var(--amber-text-secondary)}
.empty{padding:28px 16px;text-align:center;color:var(--amber-text-secondary)}
</style>
</head>
<body>
<main id="app"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
let sel=null;
const fmt=k=>String(+k);
const tot=s=>s.lifts.reduce((a,l)=>a+l.done.length,0);
const dn=s=>s.lifts.reduce((a,l)=>a+l.done.filter(Boolean).length,0);
const dfmt=d=>{const [y,m,x]=d.split("-").map(Number);return new Date(y,m-1,x).toLocaleDateString(undefined,{day:"numeric",month:"short"})};
function render(note,data){
  const app=document.getElementById("app");
  const ss=((data&&data.collections&&data.collections.sessions)||[]).slice().sort((a,b)=>a.n-b.n);
  if(!ss.length){app.innerHTML=`<h1>${esc(note.title)}</h1><div class="card empty">No program in the app's data yet.</div>`;return}
  if(sel==null||!ss.find(s=>s.n===sel)){const f=ss.find(s=>dn(s)<tot(s))||ss[ss.length-1];sel=f.n}
  const cur=ss.find(s=>s.n===sel);
  const all=ss.reduce((a,s)=>a+dn(s),0),allt=ss.reduce((a,s)=>a+tot(s),0);
  const weeks=[...new Set(ss.map(s=>s.week))];
  const plan=weeks.map(w=>{const ws=ss.filter(s=>s.week===w);return `<div class="wk"><span>Week ${w}${ws[0].deload?" · deload":""}</span></div><div class="days">`+ws.map(s=>`<button class="day${s.n===sel?" sel":""}${dn(s)===tot(s)?" full":""}" data-n="${s.n}" aria-label="Week ${w} ${esc(s.day)}, ${dn(s)} of ${tot(s)} sets done"><span>${esc(s.day)}</span><small>${dn(s)}/${tot(s)}</small></button>`).join("")+`</div>`}).join("");
  const d=dn(cur),t=tot(cur),i=ss.indexOf(cur);
  const lifts=cur.lifts.map((l,li)=>`<div class="lift"><div class="lh"><b>${esc(l.name)}</b><span class="kg">${fmt(l.kg)} kg</span></div><div class="rx">${l.sets} × ${l.reps}</div><div class="sets">`+l.done.map((x,si)=>`<button class="set${x?" on":""}" data-l="${li}" data-s="${si}" aria-pressed="${x}" aria-label="${esc(l.name)} set ${si+1}, ${l.reps} reps${x?", done":""}">Set ${si+1}<small>${x?"done":l.reps+" reps"}</small></button>`).join("")+`</div></div>`).join("");
  app.innerHTML=`<h1>${esc(note.title)}</h1><div class="sub">${all} of ${allt} sets done · block starts ${esc(dfmt(ss[0].date))}</div>
  <div class="layout"><div class="card plan">${plan}</div>
  <div class="card"><div class="head"><h2>Week ${cur.week} · ${esc(cur.day)}${cur.deload?'<span class="badge">Deload</span>':""}</h2><div class="sub" style="margin:2px 0 0">${esc(dfmt(cur.date))}${cur.date===note.today?" · today":""} · ${d} of ${t} sets</div><div class="bar" role="img" aria-label="${d} of ${t} sets done"><i style="width:${t?d/t*100:0}%"></i></div></div>${lifts}
  <div class="nav"><button id="prev" ${i===0?"disabled":""}>Previous</button><button id="next" class="p" ${i===ss.length-1?"disabled":""}>${d===t?"Next day":"Skip to next"}</button></div></div></div>`;
  app.querySelectorAll(".day").forEach(b=>b.onclick=()=>{sel=+b.dataset.n;render(amber.note,amber.data)});
  app.querySelectorAll(".set").forEach(b=>b.onclick=()=>{
    const li=+b.dataset.l,si=+b.dataset.s;
    const lifts=cur.lifts.map((l,k)=>k===li?{...l,done:l.done.map((x,j)=>j===si?!x:x)}:l);
    amber.store.collection("sessions").update(cur.id,{lifts});
  });
  document.getElementById("prev").onclick=()=>{sel=ss[i-1].n;render(amber.note,amber.data)};
  document.getElementById("next").onclick=()=>{sel=ss[i+1].n;render(amber.note,amber.data)};
}
amber.onChange(render);
</script>
</body>
</html>
