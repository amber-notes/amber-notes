<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-needs" content='{"hosts":["api.openweathermap.org"],"keys":[{"name":"OpenWeather","hosts":["api.openweathermap.org"],"query":"appid={key}","help":"Free key at openweathermap.org: sign up, then API keys in your account."}]}'>
<meta name="amber-settings" content='{"settings":[{"key":"city","label":"City","type":"text","default":"Porto,PT","help":"City name and country code, as OpenWeather expects."},{"key":"units","label":"Units","type":"choice","options":["metric","imperial"],"default":"metric"}]}'>
<style>
  * { box-sizing: border-box; }
  main { max-width: var(--amber-content-max); margin: 0 auto; padding: 20px var(--amber-gutter) 96px; }
  h1 { font-size: 1.75rem; letter-spacing: -.02em; margin: 4px 0 4px; }
  h2 { font-size: 1.1rem; margin: 24px 0 8px; }
  .muted { color: var(--amber-text-secondary); font-size: .875rem; }
  .days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 14px; }
  .day { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 14px 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .day.today { border-color: var(--amber-accent); background: var(--amber-accent-soft); }
  .dn { font-weight: 700; }
  .day svg { width: 44px; height: 44px; color: var(--amber-accent-text); }
  .hi { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .lo { color: var(--amber-text-secondary); font-variant-numeric: tabular-nums; }
  .desc { font-size: .875rem; text-transform: capitalize; }
  .meta { font-size: .8125rem; color: var(--amber-text-secondary); font-variant-numeric: tabular-nums; }
  @media (max-width: 599px) {
    .days { grid-template-columns: 1fr; }
    .day { flex-direction: row; justify-content: space-between; text-align: left; padding: 10px 14px; gap: 10px; }
    .day .col { display: flex; flex-direction: column; flex: 1; }
    .day svg { width: 40px; height: 40px; }
  }
  .col { display: flex; flex-direction: column; align-items: inherit; gap: 2px; }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; padding: 4px 16px; min-height: 48px; border-top: 1px solid var(--amber-separator); }
  .item:first-child { border-top: 0; }
  .item input { width: 22px; height: 22px; accent-color: var(--amber-accent); flex: none; }
  .item label { flex: 1; padding: 10px 0; }
  .item.done label { text-decoration: line-through; color: var(--amber-text-secondary); }
  .msg { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 18px 16px; margin-top: 14px; }
  .msg.bad { border-color: var(--amber-danger); }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--amber-radius-small); background: var(--amber-fill); color: var(--amber-text); margin-top: 10px; }
  .facts { display: grid; gap: 4px; padding: 12px 16px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="muted" id="sub"></div>
  <section aria-label="5-day forecast"><div id="fc" aria-live="polite"></div></section>
  <div id="rest"></div>
</main>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ICON = {
  clear: '<circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></g>',
  clouds: '<path d="M7 18h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7 9.5 4.3 4.3 0 0 0 7 18z" fill="currentColor"/>',
  rain: '<path d="M7 14h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7 5.5 4.3 4.3 0 0 0 7 14z" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/></g>',
  storm: '<path d="M7 14h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7 5.5 4.3 4.3 0 0 0 7 14z" fill="currentColor"/><path d="M12.5 14l-3 5h3l-1 3.5 4-5.5h-3l1.5-3z" fill="currentColor"/>',
  snow: '<g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></g>',
  mist: '<g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h16M4 12h16M7 16h13"/></g>'
};
const kind = (m) => ({ Clear: "clear", Clouds: "clouds", Rain: "rain", Drizzle: "rain", Thunderstorm: "storm", Snow: "snow" })[m] || "mist";
const state = { loading: false, err: "", days: null, city: "", key: "" };

async function load() {
  const s = amber.settings || {};
  const city = s.city || "Porto,PT", units = s.units || "metric";
  const key = city + "|" + units;
  if (state.loading || state.key === key) return;
  state.loading = true; state.err = ""; state.key = key; paint();
  const r = await amber.fetch("https://api.openweathermap.org/data/2.5/forecast?q=" + encodeURIComponent(city) + "&units=" + units, { key: "OpenWeather" });
  state.loading = false;
  let body = r && r.body;
  if (typeof body === "string") { try { body = JSON.parse(body); } catch (e) { body = null; } }
  if (!r || !r.ok || !body || !body.list) {
    state.key = "";
    const st = r && r.status;
    state.err = st === 401 ? "OpenWeather rejected the API key. In Amber Notes open Settings › API Keys, and check the key named OpenWeather. New keys can take a couple of hours to activate."
      : st === 404 ? "City not found. Change it in App Settings (for example Porto,PT)."
      : (r && r.error && /key/i.test(r.error)) ? "No OpenWeather key yet. In Amber Notes open Settings › API Keys, add a key named OpenWeather and paste it there."
      : "Couldn't load the forecast" + (r && (r.error || st) ? ": " + esc(r.error || st) : ".");
    state.days = null; paint(); return;
  }
  const tz = body.city.timezone || 0, by = {};
  body.list.forEach((e) => {
    const d = new Date((e.dt + tz) * 1000).toISOString().slice(0, 10);
    (by[d] = by[d] || []).push({ h: new Date((e.dt + tz) * 1000).getUTCHours(), e });
  });
  state.days = Object.keys(by).sort().slice(0, 5).map((d) => {
    const a = by[d].map((x) => x.e);
    const pick = by[d].reduce((b, x) => Math.abs(x.h - 13) < Math.abs(b.h - 13) ? x : b).e;
    return {
      d, hi: Math.round(Math.max(...a.map((e) => e.main.temp_max))), lo: Math.round(Math.min(...a.map((e) => e.main.temp_min))),
      main: pick.weather[0].main, desc: pick.weather[0].description,
      pop: Math.round(Math.max(...a.map((e) => e.pop || 0)) * 100), wind: Math.round(Math.max(...a.map((e) => e.wind.speed)))
    };
  });
  state.city = body.city.name;
  paint();
}

function paint() {
  const s = amber.settings || {}, u = s.units === "imperial";
  const fc = document.getElementById("fc");
  document.getElementById("sub").textContent = "5-day forecast" + (state.city ? " for " + state.city : "") + " · OpenWeather";
  if (state.loading) fc.innerHTML = '<div class="msg">Loading forecast…</div>';
  else if (state.err) fc.innerHTML = '<div class="msg bad" role="alert">' + state.err + '<br><button id="retry">Try again</button></div>';
  else if (state.days) fc.innerHTML = '<div class="days">' + state.days.map((x) => {
    const dt = new Date(x.d + "T12:00:00Z");
    const nm = x.d === amber.note.today ? "Today" : dt.toLocaleDateString("en-GB", { weekday: "short", timeZone: "UTC" });
    return '<div class="day' + (x.d === amber.note.today ? " today" : "") + '"><div class="col"><span class="dn">' + nm + '</span><span class="meta">' + dt.toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" }) + '</span></div>' +
      '<svg viewBox="0 0 24 24" role="img" aria-label="' + esc(x.desc) + '">' + ICON[kind(x.main)] + '</svg>' +
      '<div class="col"><span class="hi">' + x.hi + '°<span class="lo"> / ' + x.lo + '°</span></span><span class="desc">' + esc(x.desc) + '</span>' +
      '<span class="meta">Rain ' + x.pop + '% · Wind ' + x.wind + (u ? ' mph' : ' m/s') + '</span></div></div>';
  }).join("") + '</div>';
  const rb = document.getElementById("retry");
  if (rb) rb.onclick = () => { state.key = ""; load(); };
}

function renderNote(note) {
  document.getElementById("title").textContent = note.title;
  document.title = note.title;
  const lines = note.markdown.split("\n").slice(1);
  const facts = lines.filter((l) => /^(flights|hotel|budget)\b/i.test(l.trim()));
  let h = "";
  if (facts.length) h += '<h2>Trip</h2><div class="card facts">' + facts.map((f) => '<div>' + esc(f) + '</div>').join("") + '</div>';
  if (note.checklists.length) h += '<h2>To do before</h2><div class="card">' + note.checklists.map((c, i) =>
    '<div class="item' + (c.checked ? " done" : "") + '"><input type="checkbox" id="c' + i + '" data-line="' + c.line + '"' + (c.checked ? " checked" : "") + '><label for="c' + i + '">' + esc(c.text) + '</label></div>').join("") + '</div>';
  const rest = document.getElementById("rest");
  rest.innerHTML = h;
  rest.querySelectorAll("input[type=checkbox]").forEach((el) => el.onchange = () => amber.update({ op: "toggle_checklist", line: Number(el.dataset.line) }));
}

amber.onChange((note) => { renderNote(note); load(); paint(); });
</script>
</body>
</html>
