<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
main{max-width:var(--amber-content-max);margin:0 auto;padding:20px var(--amber-gutter) 96px}
h1{font-size:1.75rem;letter-spacing:-.02em;margin:4px 0 4px}
h2{font-size:1.1rem;margin:0;padding:12px 16px 4px}
.sub{color:var(--amber-text-secondary);font-size:.95rem;margin:0 0 16px}
.card{background:var(--amber-surface);border:1px solid var(--amber-separator);border-radius:var(--amber-radius);margin-bottom:16px;overflow:hidden}
ul{list-style:none;margin:0;padding:0}
li{border-top:1px solid var(--amber-separator)}
li:first-child{border-top:0}
li label{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 16px;cursor:pointer;overflow-wrap:anywhere}
li input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--amber-accent);margin:0}
li input:checked+span{color:var(--amber-text-secondary);text-decoration:line-through}
.empty{padding:12px 16px;color:var(--amber-text-secondary)}
form{display:flex;flex-wrap:wrap;gap:8px;padding:16px}
form label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--amber-text-secondary);flex:1 1 180px}
input[type=text],select{font:inherit;color:var(--amber-text);background:var(--amber-fill);border:1px solid var(--amber-separator);border-radius:var(--amber-radius-small);padding:10px 12px;min-height:44px;width:100%}
button{font:inherit;font-weight:600;min-height:44px;padding:0 20px;border-radius:var(--amber-radius-small);background:var(--amber-accent-soft);color:var(--amber-accent-text);border:2px solid var(--amber-accent-text);align-self:flex-end;cursor:pointer}
:focus-visible{outline:3px solid var(--amber-accent-text);outline-offset:2px}
.msg{padding:0 16px 14px;min-height:1.4em;font-size:.95rem}
.msg.err{color:var(--amber-danger)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(min-width:900px){#lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}#lists .card{margin:0}}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p class="sub" id="progress"></p>
<div id="lists"></div>
<div class="card">
<form id="add">
<label for="newtext">New item<input type="text" id="newtext" name="newtext" autocomplete="off"></label>
<label for="newsec">Add to section<select id="newsec" name="newsec"></select></label>
<button type="submit">Add item</button>
</form>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
</div>
</main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
let message="",isErr=false,focusLine=null;
function render(note){
  document.getElementById("title").textContent=note.title;
  document.title=note.title;
  const lines=(note.markdown||"").split("\n");
  const heads=[];
  lines.forEach((l,i)=>{const m=l.match(/^#{2,6}\s+(.*)$/);if(m)heads.push({line:i+1,text:m[1].trim()});});
  const groups=[];
  const getG=name=>{let g=groups.find(g=>g.name===name);if(!g){g={name,items:[]};groups.push(g);}return g;};
  heads.forEach(h=>getG(h.text));
  note.checklists.forEach(c=>{
    let h=null;heads.forEach(x=>{if(x.line<c.line)h=x;});
    getG(h?h.text:"Other").items.push(c);
  });
  const total=note.checklists.length,done=note.checklists.filter(c=>c.checked).length;
  document.getElementById("progress").textContent=done+" of "+total+" items packed";
  document.getElementById("lists").innerHTML=groups.filter(g=>g.items.length||g.name!=="Other").map((g,i)=>{
    const d=g.items.filter(c=>c.checked).length;
    return `<section class="card" aria-labelledby="h${i}"><h2 id="h${i}">${esc(g.name)} <span class="sr">, ${d} of ${g.items.length} packed</span></h2>`+
    (g.items.length?`<ul>${g.items.map(c=>`<li><label><input type="checkbox" data-line="${c.line}"${c.checked?" checked":""}><span>${esc(c.text)}</span></label></li>`).join("")}</ul>`:`<div class="empty">No items yet.</div>`)+`</section>`;
  }).join("")||'<div class="card empty">No checklist items in this note yet.</div>';
  document.querySelectorAll("#lists input[type=checkbox]").forEach(b=>{
    b.onchange=async()=>{
      focusLine=b.dataset.line;
      const r=await amber.update({op:"toggle_checklist",line:+b.dataset.line});
      if(!r.ok){setMsg(r.error,true);b.checked=!b.checked;}
    };
  });
  if(focusLine){const f=document.querySelector('#lists input[data-line="'+focusLine+'"]');if(f)f.focus();focusLine=null;}
  const sel=document.getElementById("newsec"),cur=sel.value;
  const names=heads.map(h=>h.text);
  sel.innerHTML=names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");
  if(names.includes(cur))sel.value=cur;
  sel.disabled=!names.length;
  document.getElementById("msg").textContent=message;
  document.getElementById("msg").className="msg"+(isErr?" err":"");
}
function setMsg(t,e){message=t;isErr=!!e;const m=document.getElementById("msg");m.textContent=t;m.className="msg"+(e?" err":"");}
document.getElementById("add").onsubmit=async e=>{
  e.preventDefault();
  const inp=document.getElementById("newtext"),sec=document.getElementById("newsec");
  const v=inp.value.trim();
  if(!v){setMsg("Type an item name first.",true);inp.focus();return;}
  const op={op:"add_checklist_item",text:v};
  if(sec.value)op.under_heading=sec.value;
  const r=await amber.update(op);
  if(r.ok){inp.value="";setMsg("Added "+v+(sec.value?" to "+sec.value:"")+".",false);inp.focus();}
  else{setMsg(r.error||"Could not add the item.",true);}
};
amber.onChange(render);
</script>
</body>
</html>
