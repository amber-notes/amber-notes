<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="amber-libs" content="htm, router">
<title>Training</title>
<style>
  html, body { height: 100%; }
  .shell { min-height: 100%; display: grid; grid-template-rows: 1fr auto; }
  .content { max-width: 720px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 16px var(--amber-gutter) 24px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  header h1 { font-size: 1.7rem; margin: 0; letter-spacing: -0.02em; flex: 1; min-width: 0; }
  .icon { all: unset; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--amber-fill); color: var(--amber-text); }
  .icon svg { width: 18px; height: 18px; }
  .muted { color: var(--amber-text-secondary); }
  .small { font-size: 0.85rem; }
  .card { background: var(--amber-surface); border-radius: var(--amber-radius); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; }
  .row + .row { border-top: 1px solid var(--amber-separator); }
  .row .grow { flex: 1; min-width: 0; }
  .row b { font-weight: 600; }
  a.row { color: inherit; text-decoration: none; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--amber-text-secondary); margin: 22px 4px 8px; }
  .btn { font: inherit; font-weight: 600; border: 0; border-radius: var(--amber-radius-small); padding: 9px 14px; background: var(--amber-accent); color: var(--amber-on-accent); cursor: pointer; }
  .btn.ghost { background: var(--amber-fill); color: var(--amber-text); }
  .done { color: var(--amber-accent-text); font-weight: 600; }
  input.w { width: 76px; text-align: right; }
  .seg { display: inline-flex; background: var(--amber-fill); border-radius: 999px; padding: 3px; }
  .seg button { all: unset; cursor: pointer; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; }
  .seg button[aria-pressed="true"] { background: var(--amber-bg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--amber-surface); border-radius: var(--amber-radius); padding: 12px; }
  .stat b { display: block; font-size: 1.5rem; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  svg.chart { width: 100%; height: 160px; display: block; }
  svg.chart text { fill: var(--amber-text-secondary); font: 11px var(--amber-font); }

  /* iPhone: a tab bar at the bottom. Mac and wide windows: a sidebar. */
  nav.tabs { position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--amber-bg); border-top: 1px solid var(--amber-separator);
             padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  nav.tabs a { display: grid; justify-items: center; gap: 2px; padding: 4px; color: var(--amber-text-secondary); text-decoration: none; font-size: 0.72rem; font-weight: 600; }
  nav.tabs a svg { width: 24px; height: 24px; }
  nav.tabs a[aria-current="page"] { color: var(--amber-accent-text); }
  @media (min-width: 900px) {
    .shell { grid-template-rows: none; grid-template-columns: 220px 1fr; }
    nav.tabs { position: sticky; top: 0; align-self: start; height: 100vh; box-sizing: border-box; grid-template-columns: none; grid-auto-rows: min-content; gap: 2px;
               border-top: 0; border-right: 1px solid var(--amber-separator); padding: 18px 10px; order: -1; background: var(--amber-surface); }
    nav.tabs a { grid-template-columns: 22px 1fr; justify-items: start; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--amber-radius-small); font-size: 0.95rem; }
    nav.tabs a svg { width: 20px; height: 20px; }
    nav.tabs a[aria-current="page"] { background: var(--amber-accent-soft); }
    nav.tabs .brand { font-weight: 700; font-size: 1.1rem; padding: 4px 10px 12px; }
  }
  @media (max-width: 899px) { nav.tabs .brand { display: none; } }
</style></head>
<body><div id="app" style="height:100%"></div>
<script>
  const html = htm.bind(preact.h);
  const { useState, useLayoutEffect } = preactHooks;
  const { Router, route, back, useRoute } = amberRouter;
  const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const icon = {
    today: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
    plan: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>`,
    progress: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19l5-6 4 3 7-9"/></svg>`,
    gear: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>`,
    back: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>`,
  };

  // The note and the app's own data, live.
  function useNote() {
    const [n, set] = useState(amber.note);
    useLayoutEffect(() => { amber.onChange((note) => set({ ...note })); }, []);
    return n;
  }
  const prefs = () => Object.assign({ unit: "kg", goal: 3 }, ((amber.data && amber.data.values) || {}).prefs || {});
  const tables = (note) => ({
    plan: note.tables.find((t) => t.columns.some((c) => /exercises/i.test(c.name))),
    log: note.tables.find((t) => t.columns.some((c) => /weight/i.test(c.name))),
  });
  const kgShown = (kg) => prefs().unit === "lb" ? Math.round(kg * 2.2046) + " lb" : kg + " kg";
  const today = (note) => note.today || new Date().toISOString().slice(0, 10);

  function Today() {
    const note = useNote(), { plan, log } = tables(note);
    const day = DAYS[new Date(today(note) + "T12:00").getDay()];
    const row = plan && (plan.rows.find((r) => r[0] === day) || plan.rows[0]);
    const ex = row ? row[2].split(",").map((x) => x.trim()) : [];
    const last = (name) => log && [...log.rows].reverse().find((r) => r[1] === name);
    const doneToday = (name) => log && log.rows.some((r) => r[0] === today(note) && r[1] === name);
    const [w, setW] = useState({});
    const logSet = (name) => {
      const l = last(name), kg = w[name] || (l ? l[4] : "");
      amber.update({ op: "append_row", table: log.index, values: { Date: today(note), Exercise: name, Sets: l ? l[2] : "3", Reps: l ? l[3] : "8", Weight: String(kg) } });
    };
    return html`<${Page} title="Today" sub=${row ? `${row[1]} · ${day === row[0] ? "today" : row[0]}` : "No plan yet"}>
      <div class="card">${ex.map((name) => {
        const l = last(name);
        return html`<div class="row"><div class="grow"><b>${name}</b><div class="small muted">${l ? `Last: ${l[2]} × ${l[3]} at ${kgShown(+l[4])}` : "First time"}</div></div>
          ${doneToday(name) ? html`<span class="done">Logged</span>` : html`<input class="w" inputmode="decimal" aria-label=${"Weight for " + name} placeholder=${l ? l[4] : "kg"} onInput=${(e) => setW({ ...w, [name]: e.target.value })} />
          <button class="btn" onClick=${() => logSet(name)}>Log</button>`}</div>`;
      })}</div>
    </${Page}>`;
  }

  function Plan() {
    const note = useNote(), { plan } = tables(note);
    return html`<${Page} title="Plan" sub=${plan ? `${plan.rows.length} sessions a week` : ""}>
      <div class="card">${(plan ? plan.rows : []).map((r) => html`<a class="row" href=${"#/plan/" + r[0]}><div class="grow"><b>${r[0]} · ${r[1]}</b><div class="small muted">${r[2]}</div></div><span class="muted">›</span></a>`)}</div>
    </${Page}>`;
  }

  function PlanDay({ day }) {
    const note = useNote(), { plan, log } = tables(note);
    const r = plan && plan.rows.find((x) => x[0] === day);
    const ex = r ? r[2].split(",").map((x) => x.trim()) : [];
    return html`<${Page} title=${r ? r[1] : day} sub=${day} back>
      <div class="card">${ex.map((name) => {
        const best = log ? Math.max(0, ...log.rows.filter((x) => x[1] === name).map((x) => +x[4] || 0)) : 0;
        return html`<div class="row"><div class="grow"><b>${name}</b></div><span class="muted">${best ? "Best " + kgShown(best) : "Not yet"}</span></div>`;
      })}</div>
    </${Page}>`;
  }

  function Progress() {
    const note = useNote(), { log } = tables(note);
    const rows = log ? log.rows : [];
    const names = [...new Set(rows.map((r) => r[1]))];
    const [pick, setPick] = useState("Bench press");
    const pts = rows.filter((r) => r[1] === pick).map((r) => ({ d: r[0], kg: +r[4] || 0 }));
    const W = 600, H = 160, min = Math.min(...pts.map((p) => p.kg)) - 5, max = Math.max(...pts.map((p) => p.kg)) + 5;
    const x = (i) => 30 + i * (W - 60) / Math.max(1, pts.length - 1), y = (kg) => H - 24 - (kg - min) / (max - min || 1) * (H - 44);
    const sessions = new Set(rows.map((r) => r[0])).size, weeks = Math.max(1, Math.round((Date.parse(today(note)) - Date.parse(rows[0] ? rows[0][0] : today(note))) / 6048e5));
    return html`<${Page} title="Progress" sub=${`${sessions} sessions since ${rows[0] ? rows[0][0].slice(5).replace("-", "/") : "—"}`}>
      <div class="stats">
        <div class="stat"><b>${sessions}</b><span class="small muted">sessions</span></div>
        <div class="stat"><b>${(sessions / weeks).toFixed(1)}</b><span class="small muted">a week (goal ${prefs().goal})</span></div>
        <div class="stat"><b>${pts.length ? kgShown(pts[pts.length - 1].kg) : "–"}</b><span class="small muted">${pick} now</span></div>
      </div>
      <h2>Weight over time</h2>
      <div class="seg" role="group">${names.slice(0, 3).map((n) => html`<button aria-pressed=${n === pick} onClick=${() => setPick(n)}>${n}</button>`)}</div>
      <div class="card" style="margin-top:10px;padding:8px">
        <svg class="chart" viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none" role="img" aria-label=${pick + " over time"}>
          <polyline fill="none" stroke="var(--amber-accent)" stroke-width="3" points=${pts.map((p, i) => `${x(i)},${y(p.kg)}`).join(" ")} />
          ${pts.map((p, i) => html`<circle cx=${x(i)} cy=${y(p.kg)} r="4" fill="var(--amber-accent)" /><text x=${x(i)} y=${H - 6} text-anchor="middle">${p.d.slice(5).replace("-", "/")}</text>`)}
        </svg>
      </div>
    </${Page}>`;
  }

  // The app's own settings: a screen of its own, kept in its data.
  function Settings() {
    const [p, setP] = useState(prefs());
    const save = (next) => { setP(next); amber.setData({ values: { prefs: next } }); };
    return html`<${Page} title="Settings" back>
      <div class="card">
        <div class="row"><div class="grow"><b>Units</b></div><div class="seg">${["kg", "lb"].map((u) => html`<button aria-pressed=${p.unit === u} onClick=${() => save({ ...p, unit: u })}>${u}</button>`)}</div></div>
        <div class="row"><div class="grow"><b>Sessions a week</b><div class="small muted">Your goal on Progress</div></div><div class="seg">${[2, 3, 4].map((g) => html`<button aria-pressed=${p.goal === g} onClick=${() => save({ ...p, goal: g })}>${g}</button>`)}</div></div>
      </div>
    </${Page}>`;
  }

  function Page({ title, sub, back: canBack, children }) {
    return html`<div class="content">
      <header>
        ${canBack ? html`<button class="icon" aria-label="Back" onClick=${back}>${icon.back}</button>` : null}
        <h1>${title}</h1>
        ${canBack ? null : html`<button class="icon" aria-label="Settings" onClick=${() => route("/settings")}>${icon.gear}</button>`}
      </header>
      ${sub ? html`<div class="muted" style="margin:-8px 0 14px">${sub}</div>` : null}
      ${children}
    </div>`;
  }

  function Tabs() {
    const path = useRoute();
    const tab = (to, label, ic) => html`<a href=${"#" + to} aria-current=${(to === "/" ? path === "/" : path.startsWith(to)) ? "page" : null}>${ic}<span>${label}</span></a>`;
    return html`<nav class="tabs" aria-label="Screens"><div class="brand">Training</div>${tab("/", "Today", icon.today)}${tab("/plan", "Plan", icon.plan)}${tab("/progress", "Progress", icon.progress)}</nav>`;
  }

  const App = () => html`<div class="shell"><main><${Router}>
      <${Today} path="/" default /><${Plan} path="/plan" /><${PlanDay} path="/plan/:day" /><${Progress} path="/progress" /><${Settings} path="/settings" />
    </${Router}></main><${Tabs} /></div>`;
  preact.render(html`<${App} />`, document.getElementById("app"));
</script></body></html>
