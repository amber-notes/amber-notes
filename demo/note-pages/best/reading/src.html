<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amber-needs" content='{"hosts": ["openlibrary.org", "covers.openlibrary.org", "archive.org", "*.archive.org"]}'>
<meta name="amber-settings" content='{"settings":[{"key":"goal","label":"Books this year","type":"number","default":24},{"key":"sort","label":"Sort the shelf by","type":"choice","options":["Most recent","Title","Author","Rating"],"default":"Most recent"},{"key":"covers","label":"Fetch covers from Open Library","type":"toggle","default":true}]}'>
<title>Reading</title>
<style>
/*KIT_CSS*/
:root { --serif: "New York", ui-serif, Georgia, serif; }
.cover { position: relative; border-radius: 4px 7px 7px 4px; overflow: hidden; background: var(--amber-fill); box-shadow: 0 1px 1px rgba(0,0,0,.08), 0 6px 16px rgba(60,30,0,.16); aspect-ratio: 2 / 3; flex: none; }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.18), rgba(255,255,255,.12) 4%, transparent 9%); pointer-events: none; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover.gen { display: flex; flex-direction: column; justify-content: space-between; padding: 12% 10%; color: #fff; background: var(--g); }
.cover.gen b { font-family: var(--serif); font-size: .8em; line-height: 1.15; }
.cover.gen.long b { font-size: .64em; }
.cover.gen span { font-size: .6em; opacity: .85; }

.now { display: flex; gap: 1.1rem; padding: 1.1rem; align-items: stretch; }
.now .cover { width: 6.4rem; font-size: 1rem; }
.now .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.now .k { font-size: .78rem; font-weight: 600; color: var(--amber-text-secondary); }
.now h2 { font-family: var(--serif); font-size: 1.3rem; font-weight: 600; line-height: 1.15; margin: .2rem 0 .15rem; }
.now .by { color: var(--amber-text-secondary); font-size: .9rem; }
.now .grow2 { flex: 1; min-height: .6rem; }
.prog { height: .45rem; border-radius: 99px; background: var(--amber-fill); overflow: hidden; margin: .5rem 0 .35rem; }
.prog b { display: block; height: 100%; background: var(--amber-accent); border-radius: 99px; transition: width .8s var(--ease-out); }
.now .pg { font-size: .82rem; color: var(--amber-text-secondary); display: flex; gap: .4rem; }
.now .pg span:first-child { flex: 1; color: var(--amber-text); font-weight: 600; }
.now .btns { display: flex; gap: .5rem; margin-top: .75rem; flex-wrap: wrap; }
.now .btns .btn { min-height: 2.4rem; padding: 0 .95rem; font-size: .9rem; }
.dots2 { display: flex; justify-content: center; gap: .35rem; margin-top: .6rem; }
.dots2 button { width: .5rem; height: .5rem; border-radius: 50%; border: 0; padding: 0; background: var(--amber-separator); }
.dots2 button[aria-pressed="true"] { background: var(--amber-text); }
.nows { display: grid; gap: .75rem; }

.goal { padding: 1rem 1.1rem 1.1rem; }
.goal .gh { display: flex; align-items: baseline; gap: .5rem; margin-bottom: .8rem; }
.goal .gh b { font-size: 1.5rem; letter-spacing: -.02em; }
.goal .gh .grow { color: var(--amber-text-secondary); font-size: .9rem; }
.goal .pace { font-size: .82rem; font-weight: 600; padding: .2rem .55rem; border-radius: 99px; background: var(--amber-fill); color: var(--amber-text-secondary); }
.goal .pace.ahead { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.slots { display: grid; grid-template-columns: repeat(8, 1fr); gap: .35rem; }
.slots .cover { font-size: .45rem; border-radius: 2px 3px 3px 2px; box-shadow: 0 1px 3px rgba(60,30,0,.18); }
.slots .empty-slot { aspect-ratio: 2 / 3; border-radius: 3px; border: 1.5px dashed var(--amber-separator); }
.slots .rise { animation-delay: calc(var(--i) * 25ms); }

.tabs { margin: 1.4rem 0 .9rem; display: flex; align-items: center; gap: .6rem; }
.tabs .seg { flex: none; }
.tabs .grow { flex: 1; }
.shelf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.1rem .9rem; }
.book { border: 0; background: none; padding: 0; text-align: left; color: inherit; font: inherit; }
.book .cover { width: 100%; font-size: .9rem; transition: transform .2s var(--ease-out); }
.book:active .cover { transform: scale(.97); }
.book .t { font-size: .82rem; font-weight: 600; margin-top: .45rem; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.book .a { font-size: .74rem; color: var(--amber-text-secondary); margin-top: .1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stars { color: var(--amber-accent); letter-spacing: .05em; font-size: .78rem; }
.stars .off { color: var(--amber-separator); }

.quote { padding: 1.1rem 1.2rem; }
.quote p { font-family: var(--serif); font-size: 1.08rem; line-height: 1.45; font-style: italic; }
.quote .src { font-size: .8rem; color: var(--amber-text-secondary); margin-top: .5rem; }
.quotes { display: grid; gap: .6rem; }

/* Sheets */
.bk { display: flex; gap: 1rem; align-items: flex-start; margin-bottom: 1rem; }
.bk .cover { width: 6rem; font-size: .95rem; }
.bk h3 { font-family: var(--serif); font-size: 1.25rem; line-height: 1.15; }
.bk .meta { color: var(--amber-text-secondary); font-size: .88rem; margin-top: .25rem; }
.rate { display: flex; gap: .15rem; margin-top: .5rem; }
.rate button { border: 0; background: none; font-size: 1.6rem; line-height: 1; padding: .15rem; color: var(--amber-separator); min-width: 2.2rem; min-height: 2.4rem; }
.rate button.on { color: var(--amber-accent); }
.statuses { display: flex; flex-wrap: wrap; gap: .4rem; margin: .4rem 0 1rem; }
.pagebig { display: flex; align-items: center; justify-content: center; gap: .9rem; margin: .4rem 0 .4rem; }
.pagebig input { width: 7rem; text-align: center; font-size: 2.4rem; font-weight: 700; font-family: var(--amber-font-rounded); background: var(--amber-fill); border: 0; border-radius: var(--amber-radius-small); padding: .3rem; min-height: 3.6rem; color: var(--amber-text); }
.pagebig .of { color: var(--amber-text-secondary); }
input[type=range] { width: 100%; accent-color: var(--amber-accent); height: 2.4rem; }
.res { display: flex; gap: .8rem; align-items: center; }
.res .cover { width: 3rem; font-size: .5rem; }
.res .btn { min-height: 2.2rem; padding: 0 .8rem; font-size: .85rem; }
.searchbar { display: flex; gap: .5rem; }
.searchbar .in { flex: 1; }
.spin { width: 1.2rem; height: 1.2rem; border: 2px solid var(--amber-separator); border-top-color: var(--amber-accent); border-radius: 50%; animation: sp 0.8s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes sp { to { transform: rotate(360deg); } }

@media (min-width: 600px) { .shelf { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 900px) {
  .shelf { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1.5rem 1.2rem; }
  .nows { grid-template-columns: 1fr 1fr; }
  .now .cover { width: 7.4rem; }
  .slots { grid-template-columns: repeat(12, 1fr); gap: .4rem; }
  .quotes { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<script>
/*KIT_JS*/
const { esc, ico, D, num, col, sheet, announce } = Kit;
const S = { get: () => { const s = Kit.settings(); return { goal: s.goal, sort: { "Title": "title", "Author": "author", "Rating": "rating" }[s.sort] || "recent", covers: Kit.on(s.covers) }; } };
const STATUSES = ["Reading", "Want to read", "Read", "Stopped"];
let tab = "Read";
const key = (t) => String(t).trim().toLowerCase();

function model(note) {
  const t = Kit.table(note, /^title$/i);
  if (!t) return null;
  const c = { title: col(t, /^title$/i), author: col(t, /^author$/i), status: col(t, /^status$/i), rating: col(t, /^rating$/i), fin: col(t, /^(finished|date|read on)$/i) };
  const meta = amber.data.values.books || {};
  const books = t.rows.map((r, i) => {
    const title = r[c.title].trim(); const m = meta[key(title)] || {};
    const rt = c.rating >= 0 ? r[c.rating] : "";
    const rating = /★/.test(rt) ? (rt.match(/★/g) || []).length : parseInt(rt) || 0;
    const st = c.status >= 0 ? r[c.status].trim() : "";
    return { i, title, author: c.author >= 0 ? r[c.author].trim() : "", status: STATUSES.find((s) => s.toLowerCase() === st.toLowerCase()) || st || "Want to read", rating, fin: c.fin >= 0 ? r[c.fin].trim() : "", ...m };
  }).filter((b) => b.title);
  return { t, c, books };
}

const hue = (s) => [...s].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) % 360, 7);
function cover(b, cls = "") {
  const src = b.cover && (typeof b.cover === "string" ? b.cover : amber.files.url(b.cover, { width: 240 }));
  if (src) return `<div class="cover ${cls}"><img src="${esc(src)}" alt=""></div>`;
  const h = hue(b.title);
  const long = b.title.split(/\s+/).some((w) => w.length > 8);
  return `<div class="cover gen ${long ? "long" : ""} ${cls}" style="--g:linear-gradient(160deg, hsl(${h} 45% 42%), hsl(${(h + 30) % 360} 50% 28%))"><b>${esc(b.title)}</b><span>${esc(b.author)}</span></div>`;
}
const stars = (n) => `<span class="stars" aria-label="${n} of 5 stars">${"★".repeat(n)}<span class="off">${"★".repeat(5 - n)}</span></span>`;

function pace(b) {
  const sess = (amber.data.collections.sessions || []).filter((s) => s.book === key(b.title));
  if (sess.length < 2 || !b.pages || !b.page) return "";
  const days = Math.max(1, D.diff(amber.note.today, sess[0].created.slice(0, 10)) + 1);
  const per = sess.reduce((a, s) => a + (s.to - s.from), 0) / days;
  if (per < 1) return "";
  const left = Math.ceil((b.pages - b.page) / per);
  return `About ${left} ${left === 1 ? "day" : "days"} left at ${Math.round(per)} pages a day`;
}

function render(note = amber.note) {
  const app = document.getElementById("app");
  const m = model(note);
  if (!m) {
    app.innerHTML = `<header class="top"><div class="titles"><h1>${esc(note.title || "Reading")}</h1></div></header>
      <div class="card empty">${ico("book")}<h3>No books yet</h3><p>Books go in a table in this note with Title, Author and Status. Search for the first one and it's added for you.</p><button class="btn primary" id="add">${ico("search")} Find a book</button></div>`;
    return;
  }
  const s = S.get(), year = note.today.slice(0, 4);
  const reading = m.books.filter((b) => b.status === "Reading");
  const readYear = m.books.filter((b) => b.status === "Read" && b.fin.startsWith(year)).sort((a, b) => a.fin.localeCompare(b.fin));
  const goal = Number(s.goal) || 24;
  const dayOfYear = D.diff(note.today, `${year}-01-01`) + 1, daysInYear = D.diff(`${+year + 1}-01-01`, `${year}-01-01`);
  const expected = goal * dayOfYear / daysInYear, diff = readYear.length - expected;
  const paceTxt = readYear.length >= goal ? "Goal reached" : Math.abs(diff) < 1 ? "On pace" : diff > 0 ? `${Math.floor(diff)} ahead` : `${Math.ceil(-diff)} behind`;
  const sorters = { recent: (a, b) => (b.fin || "").localeCompare(a.fin || "") || a.i - b.i, title: (a, b) => a.title.localeCompare(b.title), author: (a, b) => a.author.split(" ").pop().localeCompare(b.author.split(" ").pop()), rating: (a, b) => b.rating - a.rating };
  const shelf = m.books.filter((b) => b.status === tab).sort(tab !== "Read" && (s.sort || "recent") === "recent" ? (a, b) => b.i - a.i : sorters[s.sort] || sorters.recent);
  const quotes = (amber.data.collections.quotes || []).slice().sort((a, b) => (b.created || "").localeCompare(a.created || ""));
  const bookOf = (k) => m.books.find((b) => key(b.title) === k);

  app.innerHTML = `
  <header class="top"><div class="titles"><h1>${esc(note.title)}</h1><div class="sub">${readYear.length} ${readYear.length === 1 ? "book" : "books"} in ${year}${reading.length ? ` · ${reading.length} on the go` : ""}</div></div>
    <button class="round" id="add" aria-label="Add a book">${ico("plus")}</button></header>
  ${reading.length ? `<div class="nows">${reading.map((b) => {
    const f = b.pages && b.page ? Math.min(1, b.page / b.pages) : 0;
    return `<section class="card now" aria-label="Reading ${esc(b.title)}">${cover(b)}<div class="info"><div class="k">Reading now</div><h2>${esc(b.title)}</h2><div class="by">${esc(b.author)}</div><div class="grow2"></div>
      ${b.pages ? `<div class="prog" role="progressbar" aria-label="Progress" aria-valuenow="${Math.round(f * 100)}" aria-valuemin="0" aria-valuemax="100"><b style="width:${f * 100}%"></b></div>
      <div class="pg num"><span>Page ${b.page || 0} of ${b.pages}</span><span>${Math.round(f * 100)}%</span></div>${pace(b) ? `<div class="pg" style="margin-top:.2rem"><span style="font-weight:400;color:var(--amber-text-secondary)">${pace(b)}</span></div>` : ""}` : ""}
      <div class="btns"><button class="btn primary" data-page="${b.i}">Update page</button><button class="btn tint" data-quote="${b.i}" aria-label="Save a quote from ${esc(b.title)}">${ico("quote")} Quote</button></div></div></section>`;
  }).join("")}</div>` : ""}
  <div class="label"><span class="grow">${year} goal</span></div>
  <section class="card goal"><div class="gh"><b class="num">${readYear.length} of ${goal}</b><span class="grow">books</span><span class="pace ${diff >= 0 ? "ahead" : ""}">${paceTxt}</span></div>
    <div class="slots" role="img" aria-label="${readYear.length} of ${goal} books read">${[...Array(Math.max(goal, readYear.length))].map((_, k) => readYear[k] ? `<div class="rise" style="--i:${k}">${cover(readYear[k])}</div>` : `<div class="empty-slot"></div>`).join("")}</div></section>
  <div class="tabs"><div class="seg" role="group" aria-label="Shelf">${["Read", "Want to read", "Reading"].map((x) => `<button data-tab="${x}" aria-pressed="${tab === x}">${x === "Want to read" ? "Up next" : x}</button>`).join("")}</div><span class="grow"></span><span class="muted small num">${shelf.length}</span></div>
  ${shelf.length ? `<section class="shelf">${shelf.map((b) => `<button class="book" data-book="${b.i}" aria-label="${esc(b.title)} by ${esc(b.author)}">${cover(b)}<div class="t">${esc(b.title)}</div><div class="a">${b.rating ? stars(b.rating) : esc(b.author)}</div></button>`).join("")}</section>`
    : `<div class="card empty"><p>${tab === "Want to read" ? "Nothing up next. Add a book you want to read." : "Nothing here yet."}</p></div>`}
  ${quotes.length ? `<div class="label"><span class="grow">Quotes</span></div><section class="quotes">${quotes.slice(0, 4).map((q) => { const b = bookOf(q.book); return `<blockquote class="card quote" style="margin:0"><p>“${esc(q.text)}”</p><div class="src">${esc(b ? b.title : q.book)}${q.page ? `, page ${q.page}` : ""}</div></blockquote>`; }).join("")}</section>` : ""}`;
}

async function setCell(m, b, k, v) {
  if (m.c[k] < 0) return { ok: true };
  return amber.update({ op: "set_cell", table: m.t.index, row: b.i, col: m.t.columns[m.c[k]].name, value: v });
}
const meta = (b, patch) => amber.setData({ values: { books: { [key(b.title)]: patch } } });

function pageSheet(i) {
  const m = model(amber.note); const b = m.books.find((x) => x.i === i);
  const pages = b.pages || 400, from = b.page || 0;
  sheet(b.title, `<div class="pagebig"><label class="sr" for="pg">Page</label><input id="pg" class="num" inputmode="numeric" value="${from}" autofocus><span class="of">of ${pages}</span></div>
    <input type="range" id="rg" min="0" max="${pages}" value="${from}" aria-label="Page slider">
    <div class="fields two" style="margin-top:.6rem"><button class="btn tint" id="fin">Finished it</button><button class="btn primary" id="save">Save</button></div><div class="err" id="err" role="alert"></div>`, {
    mount(root, close) {
      const pg = root.querySelector("#pg"), rg = root.querySelector("#rg");
      pg.oninput = () => (rg.value = pg.value);
      rg.oninput = () => (pg.value = rg.value);
      root.querySelector("#save").onclick = async () => {
        const to = Math.max(0, Math.min(pages, parseInt(pg.value) || 0));
        await meta(b, { page: to, pages: b.pages || pages });
        if (to > from) await amber.store.collection("sessions").add({ book: key(b.title), from, to });
        close();
        if (to >= pages) finishSheet(i);
        else announce(`Page ${to}.`);
      };
      root.querySelector("#fin").onclick = () => { close(); setTimeout(() => finishSheet(i), 350); };
    },
  });
}

function finishSheet(i) {
  const m = model(amber.note); const b = m.books.find((x) => x.i === i);
  let r = b.rating || 0;
  sheet("Finished", `<div class="bk">${cover(b)}<div><h3>${esc(b.title)}</h3><div class="meta">${esc(b.author)}</div>
    <div class="rate" role="group" aria-label="Rating">${[1, 2, 3, 4, 5].map((n) => `<button data-r="${n}" class="${n <= r ? "on" : ""}" aria-label="${n} ${n === 1 ? "star" : "stars"}">★</button>`).join("")}</div></div></div>
    <button class="btn primary block" id="done">Mark as read</button><div class="err" id="err" role="alert"></div>`, {
    mount(root, close) {
      root.querySelector(".rate").onclick = (e) => { const x = e.target.closest("[data-r]"); if (!x) return; r = +x.dataset.r; root.querySelectorAll("[data-r]").forEach((y) => y.classList.toggle("on", +y.dataset.r <= r)); };
      root.querySelector("#done").onclick = async () => {
        for (const [k, v] of [["status", "Read"], ["fin", amber.note.today], ["rating", r ? "★".repeat(r) : ""]]) {
          const res = await setCell(m, b, k, v); if (!res.ok) { root.querySelector("#err").textContent = res.error; return; }
        }
        await meta(b, { page: b.pages || b.page || null });
        tab = "Read"; close(); announce(`${b.title} finished.`);
      };
    },
  });
}

function bookSheet(i) {
  const m = model(amber.note); const b = m.books.find((x) => x.i === i);
  const qs = (amber.data.collections.quotes || []).filter((q) => q.book === key(b.title));
  sheet(b.status === "Read" ? "Read" : b.status, `<div class="bk">${cover(b)}<div><h3>${esc(b.title)}</h3><div class="meta">${esc(b.author)}${b.year ? ` · ${b.year}` : ""}${b.pages ? ` · ${b.pages} pages` : ""}</div>
      ${b.fin ? `<div class="meta">Finished ${D.fmt(b.fin, { day: "numeric", month: "long", year: "numeric" })}</div>` : ""}
      <div class="rate" role="group" aria-label="Rating">${[1, 2, 3, 4, 5].map((n) => `<button data-r="${n}" class="${n <= b.rating ? "on" : ""}" aria-label="Rate ${n} ${n === 1 ? "star" : "stars"}">★</button>`).join("")}</div></div></div>
    <div class="statuses" role="group" aria-label="Status">${STATUSES.map((s) => `<button class="btn ${s === b.status ? "primary" : ""}" data-st="${s}" style="min-height:2.3rem;font-size:.88rem">${s}</button>`).join("")}</div>
    ${qs.length ? `<div class="label" style="margin-top:.4rem">Quotes</div><div class="quotes">${qs.map((q) => `<blockquote class="card quote" style="margin:0"><p>“${esc(q.text)}”</p>${q.page ? `<div class="src">Page ${q.page}</div>` : ""}</blockquote>`).join("")}</div>` : ""}
    <button class="btn plain" data-quote="${b.i}" style="margin-top:.5rem">${ico("quote")} Save a quote</button>
    <div class="err" id="err" role="alert"></div>`, {
    mount(root, close) {
      root.addEventListener("click", async (e) => {
        const r = e.target.closest("[data-r]"), st = e.target.closest("[data-st]");
        if (r) { const v = +r.dataset.r === b.rating ? 0 : +r.dataset.r; b.rating = v; root.querySelectorAll("[data-r]").forEach((y) => y.classList.toggle("on", +y.dataset.r <= v)); const res = await setCell(m, b, "rating", v ? "★".repeat(v) : ""); if (!res.ok) root.querySelector("#err").textContent = res.error; }
        if (st) {
          const v = st.dataset.st;
          if (v === "Read" && b.status !== "Read") { close(); setTimeout(() => finishSheet(i), 350); return; }
          const res = await setCell(m, b, "status", v); if (!res.ok) { root.querySelector("#err").textContent = res.error; return; }
          if (v === "Reading") await meta(b, { started: amber.note.today });
          close();
        }
      });
    },
  });
}

function quoteSheet(i) {
  const m = model(amber.note); const b = m.books.find((x) => x.i === i);
  sheet("Save a quote", `<form id="qf" class="fields"><div class="muted small">${esc(b.title)}</div>
    <label class="field">Quote<textarea id="qt" rows="4" required autofocus style="font-family:var(--serif);font-size:1.05rem"></textarea></label>
    <label class="field">Page<input id="qp" inputmode="numeric" value="${b.page || ""}"></label><button class="btn primary block">Save quote</button></form>`, {
    mount(root, close) {
      root.querySelector("#qf").onsubmit = async (e) => {
        e.preventDefault();
        const text = root.querySelector("#qt").value.trim(); if (!text) return;
        await amber.store.collection("quotes").add({ book: key(b.title), text, page: parseInt(root.querySelector("#qp").value) || null });
        close();
      };
    },
  });
}

// Open Library: search by title or author; the cover is drawn small and kept with the book.
async function coverData(id) {
  const r = await amber.fetch(`https://covers.openlibrary.org/b/id/${id}-M.jpg`);
  if (!r.ok || r.status !== 200 || !r.base64) return null;
  const img = new Image();
  img.src = `data:image/jpeg;base64,${r.body}`;
  await img.decode().catch(() => null);
  if (!img.naturalWidth) return null;
  const c = document.createElement("canvas"); c.width = 132; c.height = Math.round(img.naturalHeight * 132 / img.naturalWidth);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.75);
}

function addSheet() {
  let results = [], busy = false, err = "";
  const draw = (root) => {
    root.querySelector("#rs").innerHTML = busy ? `<p class="muted" style="padding:1rem;text-align:center"><span class="spin"></span></p>` : err ? `<p class="err">${esc(err)}</p>`
      : results.length ? `<div class="card list">${results.map((d, k) => `<div class="row res">${d.thumb ? `<div class="cover"><img src="${d.thumb}" alt=""></div>` : cover({ title: d.title, author: d.author }, "")}
        <div class="grow"><div style="font-weight:600;line-height:1.2">${esc(d.title)}</div><div class="small muted">${esc(d.author)}${d.year ? ` · ${d.year}` : ""}</div></div>
        <button class="btn tint" data-pick="${k}" aria-label="Add ${esc(d.title)}">Add</button></div>`).join("")}</div>` : "";
  };
  sheet("Add a book", `<form id="sf" class="searchbar"><label class="sr" for="q">Title or author</label><input id="q" class="in" placeholder="Title or author" autofocus enterkeyhint="search"><button class="btn primary" aria-label="Search">${ico("search")}</button></form>
    <p class="muted small" style="margin:.5rem .2rem .8rem">From Open Library. Covers and page counts come with it.</p><div id="rs"></div>`, {
    wide: true,
    mount(root, close) {
      root.querySelector("#sf").onsubmit = async (e) => {
        e.preventDefault();
        const q = root.querySelector("#q").value.trim(); if (!q) return;
        busy = true; err = ""; draw(root);
        const r = await amber.fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&fields=title,author_name,first_publish_year,cover_i,number_of_pages_median&limit=6`);
        busy = false;
        if (!r.ok || r.status !== 200) { err = r.error || "Open Library didn't answer. Try again in a moment."; draw(root); return; }
        results = (JSON.parse(r.body).docs || []).map((d) => ({ title: d.title, author: (d.author_name || [""])[0], year: d.first_publish_year, pages: d.number_of_pages_median, coverId: d.cover_i }));
        if (!results.length) err = "No books found. Try fewer words.";
        draw(root);
        if (S.get().covers) for (const d of results.slice(0, 6)) if (d.coverId) { d.thumb = await coverData(d.coverId); draw(root); }
      };
      root.querySelector("#rs").addEventListener("click", async (e) => {
        const p = e.target.closest("[data-pick]"); if (!p) return;
        const d = results[+p.dataset.pick];
        const m = model(amber.note);
        const n = (k) => m.t.columns[m.c[k]].name;
        const values = { [n("title")]: d.title };
        if (m.c.author >= 0) values[n("author")] = d.author;
        if (m.c.status >= 0) values[n("status")] = "Want to read";
        const res = await amber.update({ op: "append_row", table: m.t.index, values });
        if (!res.ok) { err = res.error; draw(root); return; }
        let ref = null;
        if (d.thumb) { const f = await amber.files.save({ name: `${d.title}.jpg`, type: "image/jpeg", base64: d.thumb.split(",")[1] }); if (f.ok) ref = { $file: f.file.$file }; }
        await amber.setData({ values: { books: { [key(d.title)]: { cover: ref, year: d.year || null, pages: d.pages || null } } } });
        tab = "Want to read"; close(); announce(`${d.title} added to Up next.`);
      });
    },
  });
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("#add,#settings,[data-tab],[data-book],[data-page],[data-quote]"); if (!t) return;
  if (t.closest(".sheet") && !t.dataset.quote) return;
  if (t.id === "add") addSheet();
  else if (t.dataset.tab) { tab = t.dataset.tab; render(); }
  else if (t.dataset.book) bookSheet(+t.dataset.book);
  else if (t.dataset.page) pageSheet(+t.dataset.page);
  else if (t.dataset.quote) { Kit.close(); setTimeout(() => quoteSheet(+t.dataset.quote), t.closest(".sheet") ? 350 : 0); }
});
amber.onChange((note) => render(note));
</script>
</body>
