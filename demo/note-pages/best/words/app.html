<title>Word Rush</title>
<style>
/* The shared look of the best-apps set: Amber Notes' variables, iOS-like grouped lists, sheets. */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-size: 1rem; line-height: 1.35; }
:root {
  --c1: #D96A06; --c2: #2F8577; --c3: #3D6DB5; --c4: #9A4E8E; --c5: #7C8A24; --c6: #C4455B; --c7: #8A6A4A;

}
@media (prefers-color-scheme: dark) {

}
main.wrap { max-width: var(--amber-content-max); margin: 0 auto; padding: .5rem var(--amber-gutter) 6rem; }

.round.accent { background: var(--amber-accent); color: var(--amber-on-accent); }

/* Section labels and cards. */
.label { font-size: .8rem; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 1.4rem .25rem .5rem; display: flex; align-items: baseline; gap: .5rem; }
.label .grow { flex: 1; }
.label button { text-transform: none; letter-spacing: 0; font-size: .88rem; font-weight: 600; color: var(--amber-accent-text); background: none; border: 0; padding: .3rem .2rem; }
.card { background: var(--amber-surface); border-radius: var(--amber-radius); overflow: hidden; }
.card.pad { padding: 1rem; }
.list > .row, .list > li { display: flex; align-items: center; gap: .75rem; min-height: 2.9rem; padding: .6rem 1rem; position: relative; }
.list > .row + .row::before, .list > li + li::before { content: ""; position: absolute; top: 0; left: 1rem; right: 0; border-top: 1px solid var(--amber-separator); }
.list.inset > .row + .row::before { left: 3.6rem; }
ul.list { list-style: none; margin: 0; padding: 0; }
button.row { width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; transition: background .2s; }
button.row:active { background: var(--amber-fill); }
.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Buttons. */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 2.75rem; padding: 0 1.1rem; border: 0; border-radius: 999px; font-weight: 600; background: var(--amber-fill); color: var(--amber-text); transition: transform .15s var(--ease-out), opacity .2s, background .2s; white-space: nowrap; }

.seg button { border: 0; background: none; border-radius: 999px; padding: .42rem .9rem; font-size: .88rem; font-weight: 600; color: var(--amber-text-secondary); min-height: 2.2rem; transition: color .2s, background .25s var(--ease-out), box-shadow .25s; }
.seg button[aria-pressed="true"] { background: var(--amber-bg); color: var(--amber-text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* Forms. */
.field { display: flex; flex-direction: column; gap: .3rem; font-size: .8rem; font-weight: 600; color: var(--amber-text-secondary); }
.field input, .field select, .field textarea, input.in, select.in, textarea.in { font-size: 1rem; font-weight: 400; color: var(--amber-text); background: var(--amber-fill); border: 0; border-radius: var(--amber-radius-small); padding: .65rem .8rem; min-height: 2.75rem; width: 100%; outline-offset: 0; }
textarea { resize: vertical; line-height: 1.4; }
.fields { display: grid; gap: .8rem; }

.err { color: var(--amber-danger); font-size: .88rem; min-height: 1.2em; }
.switch { appearance: none; -webkit-appearance: none; width: 3.1rem; height: 1.9rem; border-radius: 999px; background: var(--amber-fill); position: relative; flex: none; transition: background .25s; margin: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: calc(1.9rem - 4px); height: calc(1.9rem - 4px); border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .3s var(--ease-pop); }
.switch:checked { background: var(--good); }
.switch:checked::after { transform: translateX(1.2rem); }

/* Sheet: a bottom sheet on the phone, a centered panel when wide. */
.scrim { position: fixed; inset: 0; background: rgba(20, 10, 0, .32); opacity: 0; transition: opacity .28s; z-index: 50; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow: auto; background: var(--amber-bg); border-radius: 1.2rem 1.2rem 0 0; padding: .6rem 1.1rem calc(1.4rem + env(safe-area-inset-bottom)); z-index: 51; transform: translateY(105%); transition: transform .38s var(--ease-out); box-shadow: 0 -8px 40px rgba(0,0,0,.18); }
.sheet .grab { width: 2.4rem; height: .3rem; border-radius: 99px; background: var(--amber-separator); margin: 0 auto .8rem; }
.sheet header { display: flex; align-items: center; gap: .5rem; margin-bottom: 1rem; }
.sheet header h2 { flex: 1; font-size: 1.2rem; font-weight: 700; }
.open .scrim { opacity: 1; }
.open .sheet { transform: none; }
@media (min-width: 700px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: min(34rem, 92vw); border-radius: 1.2rem; transform: translate(-50%, -46%) scale(.97); opacity: 0; transition: transform .3s var(--ease-out), opacity .2s; padding: 1.2rem 1.4rem 1.4rem; }
  .open .sheet { transform: translate(-50%, -50%); opacity: 1; }
  .sheet .grab { display: none; }
}
@media (prefers-color-scheme: dark) { .sheet { background: var(--amber-surface); } .sheet .field input, .sheet .field select, .sheet .field textarea, .sheet .in { background: var(--amber-fill); } }

/* Empty states. */
.empty { text-align: center; padding: 2.2rem 1.2rem; color: var(--amber-text-secondary); }
.empty svg { width: 2.6rem; height: 2.6rem; color: var(--amber-accent); opacity: .85; margin-bottom: .6rem; }
.empty h3 { color: var(--amber-text); font-size: 1.05rem; margin-bottom: .3rem; }
.empty p { max-width: 22rem; margin: 0 auto 1rem; font-size: .94rem; }

/* A quiet confirmation under the header, for things that don't change the note. */
.note-line { font-size: .85rem; color: var(--amber-text-secondary); min-height: 1.2em; transition: opacity .3s; }

/* Motion: things that arrive rise in; nothing moves when asked not to. */
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.rise { animation: rise .35s var(--ease-out) both; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* Wide: two columns where the app asks for them. */
.cols { display: grid; gap: 0 1.6rem; grid-template-columns: minmax(0, 1fr); }
.cols > * { min-width: 0; }
@media (min-width: 900px) {
  .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .cols.side { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
  .top h1 { font-size: 2.2rem; }
}

:root { --ok: #2E9E5B; --bad: #D64545; }
@media (prefers-color-scheme: dark) { :root { --ok: #4CD38A; --bad: #FF6B6B; } }
.playgrid { display: grid; gap: 1rem; }
.side { display: none; }
@media (min-width: 900px) {
  .playgrid { grid-template-columns: minmax(0, 1fr) 19rem; align-items: start; gap: 1.4rem; }
  .hud .score, .hud .combo, .hud .t { display: none; }
  .hud { margin-bottom: .4rem; }
  .side { display: grid; gap: .8rem; position: sticky; top: 1rem; }
  .side .card { padding: 1rem 1.1rem; }
  .side .big { font-family: var(--amber-font-rounded); font-size: 3.4rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .side .k { font-size: .74rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--amber-text-secondary); margin-bottom: .35rem; }
  .side .pair { display: flex; gap: .6rem; }
  .side .pair > div { flex: 1; }
  .side .mid { font-family: var(--amber-font-rounded); font-size: 1.8rem; font-weight: 800; }
  .side .missed span { display: inline-block; margin: .15rem .2rem 0 0; font-size: .88rem; padding: .25rem .6rem; border-radius: 999px; background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .side .keys { font-size: .8rem; color: var(--amber-text-secondary); line-height: 1.6; }
  .board { padding: 1.3rem; gap: .8rem 1.1rem; }
  .col { gap: .8rem; }
  .tile { min-height: 5.4rem !important; font-size: 1.5rem !important; border-radius: 1.2rem; }
  .timebar { height: .6rem; }
  .homegrid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0 1.6rem; align-items: start; }
  .hero h2 { font-size: 3.2rem; }
}
.hero { border-radius: calc(var(--amber-radius) + 6px); padding: 1.4rem 1.3rem 1.3rem; background:
  radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--amber-accent) 32%, transparent), transparent 60%),
  radial-gradient(90% 80% at 0% 100%, color-mix(in srgb, var(--c3) 22%, transparent), transparent 60%), var(--amber-surface); position: relative; overflow: hidden; }
.hero .k { font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--amber-accent-text); }
.hero h2 { font-family: var(--amber-font-rounded); font-size: 2.6rem; line-height: 1; letter-spacing: -.03em; margin: .35rem 0 .5rem; font-weight: 800; }
.hero p { color: var(--amber-text-secondary); max-width: 26rem; }
.hero .row3 { display: flex; gap: .6rem; align-items: center; margin-top: 1.1rem; flex-wrap: wrap; }
.hero .btn.primary { min-height: 3.2rem; padding: 0 1.6rem; font-size: 1.1rem; }
.floaty { position: absolute; right: -.4rem; top: .6rem; display: grid; gap: .4rem; transform: rotate(8deg); pointer-events: none; opacity: .9; }
.floaty span { font-family: var(--amber-font-rounded); font-weight: 800; font-size: .9rem; padding: .35rem .7rem; border-radius: .7rem; background: var(--amber-bg); box-shadow: var(--shadow); animation: bob 3s ease-in-out infinite; }
.floaty span:nth-child(2) { margin-left: 1.4rem; animation-delay: -.8s; } .floaty span:nth-child(3) { margin-left: .4rem; animation-delay: -1.6s; }
@keyframes bob { 50% { transform: translateY(-5px); } }
@media (max-width: 520px) { .floaty { display: none; } }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-top: 1rem; }
.stats3 div { background: var(--amber-surface); border-radius: var(--amber-radius); padding: .8rem .9rem; }
.stats3 b { display: block; font-family: var(--amber-font-rounded); font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; }
.stats3 span { font-size: .78rem; color: var(--amber-text-secondary); }
.tricky { display: flex; flex-wrap: wrap; gap: .4rem; padding: .9rem 1rem; }
.tricky span { font-size: .88rem; padding: .3rem .7rem; border-radius: 999px; background: var(--amber-fill); }
.tricky span b { font-weight: 700; }
.tricky span i { font-style: normal; color: var(--bad); font-weight: 700; margin-left: .3rem; font-size: .78rem; }

.hud { display: flex; align-items: center; gap: .7rem; margin: .2rem 0 .8rem; }

.hud .combo { font-family: var(--amber-font-rounded); font-weight: 800; font-size: 1rem; color: var(--amber-on-accent); background: var(--amber-accent); border-radius: 999px; padding: .2rem .65rem; transform-origin: center; }
.hud .combo.zero { background: var(--amber-fill); color: var(--amber-text-secondary); }

.hud .grow { flex: 1; }

.hud .t.low { color: var(--bad); animation: pulse .6s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .45; } }
.timebar { height: .45rem; border-radius: 99px; background: var(--amber-fill); overflow: hidden; margin-bottom: 1rem; }
.timebar b { display: block; height: 100%; background: linear-gradient(90deg, var(--amber-accent), color-mix(in srgb, var(--amber-accent) 70%, var(--c6))); border-radius: 99px; transform-origin: left; }
.board { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem .8rem; position: relative; padding: .9rem; border-radius: calc(var(--amber-radius) + 6px); background:
  radial-gradient(80% 60% at 0% 0%, color-mix(in srgb, var(--amber-accent) 14%, transparent), transparent 70%),
  radial-gradient(80% 60% at 100% 100%, color-mix(in srgb, var(--c3) 14%, transparent), transparent 70%), var(--amber-surface); }
.col:first-child .tile:not(.sel):not(.ok):not(.bad) { background: color-mix(in srgb, var(--amber-accent) 10%, var(--amber-bg)); }
.col:last-child .tile:not(.sel):not(.ok):not(.bad) { background: color-mix(in srgb, var(--c3) 9%, var(--amber-bg)); }
.col { display: grid; gap: .6rem; }
.colh { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--amber-text-secondary); text-align: center; }
.tile { position: relative; min-height: 3.7rem; border: 0; border-radius: 1rem; background: var(--amber-surface); color: var(--amber-text); font-family: var(--amber-font-rounded); font-size: 1.12rem; font-weight: 700; padding: .5rem .8rem; box-shadow: 0 2px 0 color-mix(in srgb, var(--amber-text) 10%, transparent); transition: transform .12s var(--ease-out), background .18s, color .18s, box-shadow .18s; touch-action: manipulation; overflow-wrap: anywhere; }
.tile:active { transform: scale(.96); }
.tile .key { position: absolute; left: .55rem; top: .4rem; font-size: .66rem; font-family: var(--amber-font-mono); color: var(--amber-text-secondary); opacity: .7; display: none; }
@media (pointer: fine) { .tile .key { display: block; } }
.tile.sel { background: var(--amber-accent); color: var(--amber-on-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber-accent) 35%, transparent); transform: translateY(-2px); }
.tile.ok { background: var(--ok); color: #fff; animation: okpop .38s var(--ease-pop) forwards; }
@keyframes okpop { 40% { transform: scale(1.08); } 100% { transform: scale(.4); opacity: 0; } }
.tile.bad { background: var(--bad); color: #fff; animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.tile.in { animation: tilein .35s var(--ease-pop) both; }
@keyframes tilein { from { transform: scale(.6); opacity: 0; } }
.spark { position: fixed; width: .5rem; height: .5rem; border-radius: 50%; pointer-events: none; z-index: 60; animation: spark .7s var(--ease-out) forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
.float { position: fixed; z-index: 61; pointer-events: none; font-family: var(--amber-font-rounded); font-weight: 800; color: var(--ok); font-size: 1.2rem; animation: up .8s var(--ease-out) forwards; }
@keyframes up { to { transform: translateY(-2.4rem); opacity: 0; } }
.sound { width: 2.6rem; height: 2.6rem; }

/* Results */
.result { text-align: center; padding: 1.8rem 1.2rem 1.4rem; }
.result .big { font-family: var(--amber-font-rounded); font-size: 4.2rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.result .badge { display: inline-block; margin: .6rem 0 .2rem; padding: .3rem .8rem; border-radius: 999px; background: var(--amber-accent); color: var(--amber-on-accent); font-weight: 800; font-size: .85rem; animation: pop .5s var(--ease-pop); }
.result p { color: var(--amber-text-secondary); margin-top: .4rem; }

.scores li { font-variant-numeric: tabular-nums; }

.scores .pts { font-family: var(--amber-font-rounded); font-weight: 800; }

      ${r.newBest ? `<span class="badge">New best</span>` : `<p>Best is ${best}</p>`}
      <p>${r.matched} matched · ${r.wrong} wrong · longest combo ×${Math.max(1, r.best)}</p>
      ${Object.keys(r.missed).length ? `<p>Missed: ${Object.keys(r.missed).map((q) => `<b>${esc(q)}</b>`).join(", ")}. They're counted in the note and come back more often.</p>` : ""}
      ${r.err ? `<p class="err">${esc(r.err)}</p>` : ""}
      <div class="row3"><button class="btn primary" id="play">${ico("play")} Play again</button></div></section>`
  : `<section class="hero"><div class="floaty" aria-hidden="true"><span>${esc(W.list[3].q)}</span><span>${esc(W.list[7].ans)}</span><span>${esc(W.list[12].q)}</span></div>
      <div class="k">Word Rush</div><h2>Match as many as you can</h2><p>Tap a word, then what it means. Quick matches build a combo. ${seconds()} seconds.</p>
      <div class="row3"><button class="btn primary" id="play">${ico("play")} Play</button>${best ? `<span class="muted">Best ${best}</span>` : ""}</div></section>`}
  <div class="stats3"><div><b class="num">${best}</b><span>Best score</span></div><div><b class="num">${scores.length}</b><span>Rounds played</span></div><div><b class="num">${scores.length ? Math.round(100 * scores.reduce((s, x) => s + x.matched, 0) / Math.max(1, scores.reduce((s, x) => s + x.matched + x.wrong, 0))) : 0}%</b><span>Right first time</span></div></div>
  </div><div>
    <div>${tricky.length ? `<div class="label"><span class="grow">Tricky words</span></div><section class="card tricky">${tricky.map((w) => `<span><b>${esc(w.q)}</b> ${esc(w.ans)}<i>${w.missed}</i></span>`).join("")}</section>` : ""}</div>
    <div>${scores.length ? `<div class="label"><span class="grow">Top rounds</span></div><ul class="card list scores">${scores.slice(0, 5).map((s, k) => `<li><span class="rank">${k + 1}</span><span class="grow">${Kit.D.fmt(s.created.slice(0, 10), { weekday: "short", day: "numeric", month: "short" })}</span><span class="muted small">×${s.best}</span><span class="pts num">${s.score}</span></li>`).join("")}</ul>` : ""}</div>
  </div></div>`;
}
const soundIcon = () => soundOn ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`
  : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>`;

document.addEventListener("click", (e) => {
  const t = e.target.closest("#play,#snd,#quit,.tile"); if (!t) return;
  if (t.id === "play") start();
  else if (t.id === "snd") { soundOn = !soundOn; if (soundOn) { audio(); sfx.pick(); } t.setAttribute("aria-pressed", soundOn); t.setAttribute("aria-label", `Sound ${soundOn ? "on" : "off"}`); t.innerHTML = soundIcon(); }
  else if (t.id === "quit") { state = "home"; cancelAnimationFrame(raf); render(); }
  else choose(t.dataset.side, +t.dataset.k);
});
// On the Mac: 1 to 5 picks a word on the left, A S D F G one on the right; Space starts a round.
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.target.closest("input, textarea")) return;
  const k = e.key.toUpperCase();
  if (state !== "play") { if (e.key === " " || e.key === "Enter") { if (!e.target.closest("button")) { e.preventDefault(); start(); } } return; }
  if (KEYS_L.includes(k)) choose("l", KEYS_L.indexOf(k));
  else if (KEYS_R.includes(k)) choose("r", KEYS_R.indexOf(k));
  else if (e.key === "Escape") { state = "home"; render(); }
});
amber.onChange((note) => { if (state !== "play") render(note); });
</script>
</body>
