      <div class="grab"></div><header><h2>${esc(title)}</h2>${actions}<button class="round" data-close aria-label="Close">${ico("close")}</button></header><div class="sheet-body">${html}</div></section>`;

const { esc, ico, announce } = Kit;
const COLORS = { kick: "--kick", snare: "--snare", clap: "--clap", hat: "--hat", "open hat": "--ohat", bass: "--bass" };
const BASS = ["C2", "D#2", "F2", "G2", "A#2", "C3", "G1", "A#1"];
let kbd = false, pat = 0, page = 0, playing = false, step = -1, muted = new Set(), soundOn = false, cursor = { r: 0, c: 0 };
let ac, master, analyser, timer, nextTime = 0, nextStep = 0, queue = [];

// The patterns: every table in the note with a Sound column, named by the heading above it.
function patterns(note) {
  const lines = note.markdown.split("\n"), names = [];
  let heading = "";
  for (let i = 0; i < lines.length; i++) {
    const h = /^#{1,6}\s+(.*)/.exec(lines[i]); if (h) heading = h[1].trim();
    if (lines[i].trim().startsWith("|") && /^\s*\|[\s|:-]+\|?\s*$/.test(lines[i + 1] || "") && (lines[i + 1] || "").includes("-")) {
      names.push(heading || `Pattern ${names.length + 1}`);
      while (i + 1 < lines.length && lines[i + 1].trim().startsWith("|")) i++;
    }
  }
  return note.tables.map((t, k) => ({ t, name: names[k] || `Pattern ${k + 1}` }))
    .filter((p) => /^(sound|instrument|track)$/i.test(p.t.columns[0].name.trim()) && p.t.columns.length > 2)
    .map((p) => ({ ...p, steps: p.t.columns.length - 1, rows: p.t.rows.map((r, i) => ({ i, name: r[0].trim(), key: r[0].trim().toLowerCase(), cells: r.slice(1).map((c) => c.trim()) })) }));
}
const S = () => { const s = Kit.settings(); return { tempo: Math.min(220, Math.max(50, Number(s.tempo) || 100)), swing: { None: 0, Light: .12, Heavy: .24 }[s.swing] || 0, kit: s.kit || "Warm", chain: /next/i.test(s.chain || "") }; };
const active = (v) => v && v !== "." && v !== "-" && v !== "0";
const freq = (n) => { const m = /^([A-G])(#|b)?(-?\d)$/.exec(n || ""); if (!m) return 65.4; const semis = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0) + (+m[3] + 1) * 12; return 440 * Math.pow(2, (semis - 69) / 12); };

// The synth: everything drawn with Web Audio, no samples.
function audio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .8;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    analyser = ac.createAnalyser(); analyser.fftSize = 1024;
    master.connect(comp).connect(analyser).connect(ac.destination);
  }
  if (ac.state === "suspended") ac.resume();
  return ac;
}
let noiseBuf;
const noise = () => { if (noiseBuf) return noiseBuf; noiseBuf = ac.createBuffer(1, ac.sampleRate * .5, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return noiseBuf; };

// A look-ahead scheduler: steps are queued against the audio clock, the screen follows.
function schedule() {
  const ps = patterns(amber.note); const p = ps[pat]; if (!p) return;
  const s = S(), sixteenth = 60 / s.tempo / 4;
  while (nextTime < ac.currentTime + .12) {
    const k = nextStep % p.steps;
    const t = nextTime + (k % 2 ? s.swing * sixteenth : 0);
    if (soundOn) for (const r of p.rows) if (!muted.has(r.key) && active(r.cells[k])) voice(r.key, t, r.cells[k]);
    queue.push({ k, t });

function start() {
  audio(); soundOn = true; playing = true; nextTime = ac.currentTime + .05; nextStep = 0; queue = [];

function stop() { playing = false; clearInterval(timer); step = -1; queue = []; render(); }
document.addEventListener("visibilitychange", () => { if (document.hidden && playing) stop(); });

// The playhead and the scope, drawn every frame from what the audio is playing now.
function draw() {
  if (!playing) return;
  while (queue.length && queue[0].t <= ac.currentTime) { const q = queue.shift(); setStep(q.k); }

}
function setStep(k) {

  const p = patterns(amber.note)[pat]; if (!p) return;

  document.querySelectorAll("[data-page]").forEach((b) => b.classList.toggle("playing", Math.floor(k / per) === +b.dataset.page));
  document.querySelectorAll(".pad.now, .steps .now").forEach((e) => e.classList.remove("now"));
  document.querySelectorAll(`[data-c="${k}"]`).forEach((e) => { e.classList.add("now"); if (e.classList.contains("on")) { e.classList.remove("hit"); void e.offsetWidth; e.classList.add("hit"); } });

}
const perPage = (p) => (innerWidth < 700 ? Math.min(8, p.steps) : p.steps);

function render(note = amber.note) {
  const app = document.getElementById("app");
  const ps = patterns(note);
  if (!ps.length) {
    app.innerHTML = `<header class="top"><div class="titles"><h1>${esc(note.title)}</h1></div></header><div class="card empty">${ico("play")}<h3>No pattern yet</h3><p>Add a table whose first column is Sound, with a row per sound (Kick, Snare, Hat, Bass) and a column per step (1 to 16). An x plays the step.</p></div>`;
    return;
  }

  const p = ps[pat], s = S(), per = perPage(p), pages = Math.ceil(p.steps / per);
  if (page >= pages) page = 0;
  const from = page * per, cols = [...Array(per)].map((_, j) => from + j);
  app.innerHTML = `
  <header class="top"><div class="titles"><h1>${esc(note.title)}</h1><div class="sub">${ps.length} ${ps.length === 1 ? "pattern" : "patterns"} · ${p.rows.length} sounds · ${p.steps} steps</div></div></header>
  <section class="deck" aria-label="Transport">
    <div class="transport">
      <button class="play" id="play" aria-label="${playing ? "Stop" : "Play"}">${playing ? `<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>` : `<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>`}</button>
      <div class="lcd" aria-hidden="true"><div><b id="pos">${step >= 0 ? `${Math.floor(step / 4) + 1}.${(step % 4) + 1}` : "1.1"}</b> <span>bar</span></div><div><b>${s.tempo}</b> <span>bpm</span></div><div class="pname"><b>${esc(p.name.slice(0, 8))}</b></div></div>
      <div class="tempo"><button id="slower" aria-label="Slower">−</button><button id="faster" aria-label="Faster">+</button></div>
      <span class="grow"></span>
    </div>
    <canvas class="scope" id="scope" aria-hidden="true"></canvas>
  </section>
  <div class="patterns" role="group" aria-label="Patterns">${ps.map((x, k) => `<button data-pat="${k}" aria-current="${k === pat}">${esc(x.name)}</button>`).join("")}
    ${pages > 1 ? `<span class="pages seg" role="group" aria-label="Steps">${[...Array(pages)].map((_, k) => `<button data-page="${k}" aria-pressed="${k === page}">${k * per + 1}–${Math.min(p.steps, (k + 1) * per)}</button>`).join("")}</span>` : ""}</div>

    ${p.rows.map((r, ri) => `<button class="name ${muted.has(r.key) ? "muted" : ""}" data-mute="${esc(r.key)}" style="--c:var(${COLORS[r.key] || "--c1"})" aria-pressed="${!muted.has(r.key)}" aria-label="${esc(r.name)}, ${muted.has(r.key) ? "muted" : "on"}"><i></i>${esc(r.name)}</button>
      ${cols.map((c) => { const v = r.cells[c], on = active(v); return `<button class="pad ${on ? "on" : ""} ${c % 4 === 0 ? "beat" : ""} ${c === step ? "now" : ""} ${kbd && cursor.r === ri && cursor.c === c ? "cur" : ""}" data-r="${ri}" data-c="${c}" style="--c:var(${COLORS[r.key] || "--c1"})" aria-label="${esc(r.name)} step ${c + 1}${on ? `, ${r.key === "bass" ? esc(v) : "on"}` : ""}">${r.key === "bass" && on ? esc(v) : ""}</button>`; }).join("")}`).join("")}
  </div>
  <div class="steps" style="--steps:${per}"><span></span>${cols.map((c) => `<span data-c="${c}" class="${c === step ? "now" : ""}">${c + 1}</span>`).join("")}</div>
  <p class="hint">Tap a pad to change the note's pattern. Tap a name to mute it. On the Mac: <span class="kbd">Space</span> plays, arrows move, <span class="kbd">Return</span> toggles.</p>`;
}

// A tap writes the step into the note's table: an x, or the next bass note.
async function toggle(ri, c) {
  const p = patterns(amber.note)[pat]; const r = p.rows[ri]; const v = r.cells[c];
  let next = active(v) ? "" : "x";
  if (r.key === "bass") { const k = BASS.indexOf(v); next = !active(v) ? BASS[0] : k >= 0 && k < BASS.length - 1 ? BASS[k + 1] : ""; }
  const pad = document.querySelector(`.pad[data-r="${ri}"][data-c="${c}"]`); if (pad) pad.classList.toggle("on", !!next);
  if (playing && next && soundOn) voice(r.key, ac.currentTime, next);

async function tempo(d) { await amber.setData({ values: { settings: { tempo: S().tempo + d } } }); }

document.addEventListener("click", (e) => {

  if (t.id === "play") playing ? stop() : start();

  else if (t.id === "faster") tempo(4);
  else if (t.dataset.pat) { pat = +t.dataset.pat; page = 0; nextStep = 0; render(); }
  else if (t.dataset.page) { page = +t.dataset.page; render(); }

Kit.onResize(() => render());
amber.onChange((note) => render(note));
</script>
