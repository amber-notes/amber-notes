<script>
// The shared helpers of the best-apps set. Everything here reads the note through amber.note and
// changes it only through amber.update; the app's own state goes through amber.store.
const Kit = (() => {
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  const s = S.get();
  const p = period(note.today, Math.min(28, Math.max(1, Number(s.payday) || 25)));
  const tx = t.rows.map((r, i) => ({ i, date: (r[c.date] || "").trim(), item: c.item >= 0 ? r[c.item] : "", cat: (c.cat >= 0 && r[c.cat].trim()) || "Other", amt: num(r[c.amt]) }))
    .filter((x) => D.parse(x.date) && Number.isFinite(x.amt));
  const inP = tx.filter((x) => x.date >= p.start && x.date <= note.today);
  const bills = bt ? bt.rows.map((r, i) => {
    const name = r[col(bt, /^bill$/i)], day = parseInt(r[col(bt, /^day$/i)]) || 1, amt = num(r[col(bt, /^amount$/i)]) || 0;
    let due = p.start.slice(0, 8) + String(day).padStart(2, "0");
    if (due < p.start) due = D.iso(new Date(Date.UTC(+p.start.slice(0, 4), +p.start.slice(5, 7), day)));
    const paid = inP.find((x) => x.item.toLowerCase().includes(name.toLowerCase()) || name.toLowerCase().includes(x.item.toLowerCase()) && x.item.length > 2);
    return { i, name, day, amt, due, paid };
  }).sort((a, b) => a.due.localeCompare(b.due)) : [];
  const billNames = new Set(bills.filter((b) => b.paid).map((b) => b.paid.i));
  const flexTx = inP.filter((x) => !billNames.has(x.i) && !/^bills?$/i.test(x.cat));
  const billsTotal = bills.reduce((a, b) => a + b.amt, 0);
  const flexible = (Number(s.income) || 0) - (Number(s.save) || 0) - billsTotal;
  const spent = flexTx.reduce((a, x) => a + x.amt, 0);
  const spentToday = flexTx.filter((x) => x.date === note.today).reduce((a, x) => a + x.amt, 0);
  const safe = (flexible - (spent - spentToday)) / p.left - spentToday;
  const env = amber.data.values.envelopes || {};
  const cats = [...new Set([...Object.keys(env), ...flexTx.map((x) => x.cat)])];
  const envs = cats.map((name) => ({ name, budget: Number(env[name]) || 0, spent: flexTx.filter((x) => x.cat === name).reduce((a, x) => a + x.amt, 0) }))
    .sort((a, b) => (b.budget ? 1 : 0) - (a.budget ? 1 : 0) || b.spent - a.spent);
  return { t, c, bt, p, tx, inP, flexTx, bills, flexible, spent, spentToday, safe, envs, s };
}

function chart(m) {
  const W = Math.round(Math.max(260, Kit.width("chart", innerWidth - 64))), H = Math.round(Math.min(220, Math.max(150, W * 0.42))), L = 4, R = 4, T = 10, B = 22;
  const max = Math.max(m.flexible, m.spent) * 1.05 || 1;
  const x = (i) => L + (i / (m.p.days - 1)) * (W - L - R), y = (v) => T + (1 - v / max) * (H - T - B);
  let acc = 0; const pts = [];
  for (let i = 0; i <= m.p.index; i++) { const d = D.add(m.p.start, i); acc += m.flexTx.filter((t) => t.date === d).reduce((a, t) => a + t.amt, 0); pts.push([x(i), y(acc)]); }
  const line = pts.map((p, k) => (k ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L ${pts[pts.length - 1][0].toFixed(1)} ${y(0)} L ${x(0)} ${y(0)} Z`;
  const last = pts[pts.length - 1];
  const paceNow = m.flexible * (m.p.index + 1) / m.p.days;
  const ahead = acc - paceNow;
  return `<div class="head"><b>${kr(acc)}</b><span class="muted small">spent of ${kr(m.flexible)} · ${ahead > 0 ? `${kr(ahead)} over pace` : `${kr(-ahead)} under pace`}</span></div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending so far against an even pace">
    ${[0.25, 0.5, 0.75, 1].map((f) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(m.flexible * f)}" y2="${y(m.flexible * f)}"/>`).join("")}
    <line class="pace" x1="${x(0)}" y1="${y(0)}" x2="${x(m.p.days - 1)}" y2="${y(m.flexible)}"/>
    <path class="area" d="${area}"/><path class="spent" d="${line}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--amber-accent)" stroke="var(--amber-surface)" stroke-width="2"/>
    <text class="ax" x="${L}" y="${H - 4}">${D.fmt(m.p.start, { day: "numeric", month: "short" })}</text>
    <text class="ax" x="${Math.min(Math.max(last[0], 60), W - 120)}" y="${H - 4}" text-anchor="middle">Today</text>
    <text class="ax" x="${W - R}" y="${H - 4}" text-anchor="end">${D.fmt(m.p.end, { day: "numeric", month: "short" })}</text>
  </svg>
  <div class="mix" aria-hidden="true">${m.envs.filter((e) => e.spent > 0).map((e) => `<i style="--cc:${cc(e.name)};flex:${e.spent}"></i>`).join("")}</div>
  <div class="keys">${m.envs.filter((e) => e.spent > 0).map((e) => `<span style="--cc:${cc(e.name)}"><i></i>${esc(e.name)} ${Math.round(e.spent / Math.max(1, m.spent) * 100)}%</span>`).join("")}</div>`;
}

// Paste rows from a bank's export (CSV or copied from the web bank); each row gets a category from the rules.
function parseBank(text, m) {
  const rules = amber.data.values.rules || {};
  const out = [], skipped = { income: 0, other: 0 };
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim(); if (!line) continue;
    const delim = line.includes("\t") ? "\t" : line.includes(";") ? ";" : ",";
    const f = line.split(delim).map((s) => s.trim().replace(/^"|"$/g, ""));
    let date = null, amt = null, item = "";
    for (const v of f) {
      const iso = /^(\d{4})[-/.](\d\d)[-/.](\d\d)$/.exec(v), eu = /^(\d\d)[-/.](\d\d)[-/.](\d{4})$/.exec(v);
      if (!date && (iso || eu)) { date = iso ? `${iso[1]}-${iso[2]}-${iso[3]}` : `${eu[3]}-${eu[2]}-${eu[1]}`; continue; }
      if (/^[-+−]?\s?[\d\s ]+([.,]\d{1,2})?(\s?kr)?$/i.test(v) && /\d/.test(v)) { amt = num(v.replace("−", "-")); continue; }
      if (v.length > item.length && /[a-zåäö]/i.test(v)) item = v;
    }
    if (!date || amt == null || !item) { skipped.other++; continue; }
    if (amt > 0 && /-/.test(text)) { skipped.income++; continue; }
    amt = Math.abs(amt);
    const low = item.toLowerCase() + " ";
    const hit = Object.keys(rules).sort((a, b) => b.length - a.length).find((k) => low.includes(k));
    const dup = m.tx.some((x) => x.date === date && Math.abs(x.amt - amt) < 0.01);
    out.push({ date, item: item.replace(/\s+/g, " ").slice(0, 60), amt, cat: hit ? rules[hit] : "Other", dup, use: !dup });
  }
  return { rows: out, skipped };
}

    mount(root, close) {
      const ta = root.querySelector("#csv");
      ta.addEventListener("input", () => { parsed = ta.value.trim() ? parseBank(ta.value, m) : null; draw(root); });
      root.addEventListener("change", async (e) => {
        const u = e.target.closest("[data-use]"), c = e.target.closest("[data-cat]");
        if (u) { parsed.rows[+u.dataset.use].use = u.checked; draw(root); }
        if (c) {
          const r = parsed.rows[+c.dataset.cat]; r.cat = c.value;
          const key = r.item.toLowerCase().split(/\s+/)[0];
          if (key.length > 2) { await amber.setData({ values: { rules: { [key]: c.value } } }); parsed.rows.forEach((x) => { if (x.item.toLowerCase().startsWith(key)) x.cat = c.value; }); draw(root); }
        }
      });
      root.addEventListener("click", async (e) => {
        if (!e.target.closest("#go")) return;
        const rows = parsed.rows.filter((r) => r.use).sort((a, b) => a.date.localeCompare(b.date));
        const name = (k) => m.t.columns[m.c[k]].name;
        const r = await Kit.addRows(m.t.index, rows.map((x) => ({ [name("date")]: x.date, ...(m.c.item >= 0 ? { [name("item")]: x.item } : {}), ...(m.c.cat >= 0 ? { [name("cat")]: x.cat } : {}), [name("amt")]: amountText(x.amt) })));
        if (!r.ok) { root.querySelector("#pv").insertAdjacentHTML("beforeend", `<p class="err">${esc(r.error)}</p>`); return; }
        close(); announce(`Added ${rows.length} rows.`);
      });
    },
  });
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("#add,#import,#budgets,[data-go],[data-tx],[data-pay]"); if (!t) return;
  if (t.id === "add") addSheet();
  else if (t.id === "import") importSheet();
  else if (t.id === "budgets") budgetsSheet();
  else if (t.dataset.go) { shell.tab = t.dataset.go; scrollTo(0, 0); }
  else if (t.dataset.tx) addSheet(+t.dataset.tx);
  else if (t.dataset.pay) payBill(+t.dataset.pay);
});
amber.onChange((note) => render(note));
</script>
</body>
</html>
