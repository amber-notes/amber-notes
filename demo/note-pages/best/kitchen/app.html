<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen</title>
<style>
/* The shared look of the best-apps set: Amber Notes' variables, iOS-like grouped lists, sheets. */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: 17px; }
body { font-size: 1rem; line-height: 1.35; }
:root {
  --c1: #D96A06; --c2: #2F8577; --c3: #3D6DB5; --c4: #9A4E8E; --c5: #7C8A24; --c6: #C4455B; --c7: #8A6A4A;
  --good: #2E7D4F; --ease-out: cubic-bezier(.2, .8, .2, 1); --ease-pop: cubic-bezier(.3, 1.4, .5, 1);
  --shadow: 0 1px 2px rgba(60, 30, 0, .06), 0 6px 24px rgba(60, 30, 0, .07);
}
@media (prefers-color-scheme: dark) {
  :root { --c1: #F4AD33; --c2: #4FC1AE; --c3: #7DA6F0; --c4: #D58ACB; --c5: #B9C95A; --c6: #F07D90; --c7: #C9A57F; --good: #5BD08A; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35); }
}
main.wrap { max-width: var(--amber-content-max); margin: 0 auto; padding: .5rem var(--amber-gutter) 6rem; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--amber-accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--amber-text-secondary); }
.small { font-size: .82rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Header: large title, a line under it, round buttons on the right. */
.top { display: flex; align-items: flex-end; gap: .75rem; padding: .35rem 0 1rem; }
.top .titles { flex: 1; min-width: 0; }
.top h1 { font-size: 2rem; font-weight: 700; letter-spacing: -.025em; line-height: 1.1; overflow-wrap: anywhere; }
.top .sub { color: var(--amber-text-secondary); margin-top: .2rem; font-size: .94rem; }
.round { width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 0; background: var(--amber-fill); color: var(--amber-text); display: inline-grid; place-items: center; flex: none; transition: transform .15s var(--ease-out), background .2s; }
.round svg { width: 1.2rem; height: 1.2rem; }
.round:active { transform: scale(.92); }
.round.accent { background: var(--amber-accent); color: var(--amber-on-accent); }

/* Section labels and cards. */
.label { font-size: .8rem; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--amber-text-secondary); margin: 1.4rem .25rem .5rem; display: flex; align-items: baseline; gap: .5rem; }
.label .grow { flex: 1; }
.label button { text-transform: none; letter-spacing: 0; font-size: .88rem; font-weight: 600; color: var(--amber-accent-text); background: none; border: 0; padding: .3rem .2rem; }
.card { background: var(--amber-surface); border-radius: var(--amber-radius); overflow: hidden; }
.card.pad { padding: 1rem; }
.list > .row, .list > li { display: flex; align-items: center; gap: .75rem; min-height: 2.9rem; padding: .6rem 1rem; position: relative; }
.list > .row + .row::before, .list > li + li::before { content: ""; position: absolute; top: 0; left: 1rem; right: 0; border-top: 1px solid var(--amber-separator); }
.list.inset > .row + .row::before { left: 3.6rem; }
ul.list { list-style: none; margin: 0; padding: 0; }
button.row { width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; transition: background .2s; }
button.row:active { background: var(--amber-fill); }
.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { color: var(--amber-text-secondary); opacity: .6; width: .7rem; flex: none; }

/* Buttons. */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 2.75rem; padding: 0 1.1rem; border: 0; border-radius: 999px; font-weight: 600; background: var(--amber-fill); color: var(--amber-text); transition: transform .15s var(--ease-out), opacity .2s, background .2s; white-space: nowrap; }
.btn svg { width: 1.1rem; height: 1.1rem; }
.btn:active { transform: scale(.96); }
.btn.primary { background: var(--amber-accent); color: var(--amber-on-accent); }
.btn.tint { background: var(--amber-accent-soft); color: var(--amber-accent-text); }
.btn.plain { background: none; color: var(--amber-accent-text); padding: 0 .6rem; }
.btn.danger { background: none; color: var(--amber-danger); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* Segmented control. */
.seg { display: inline-flex; background: var(--amber-fill); border-radius: 999px; padding: 3px; gap: 2px; position: relative; }
.seg button { border: 0; background: none; border-radius: 999px; padding: .42rem .9rem; font-size: .88rem; font-weight: 600; color: var(--amber-text-secondary); min-height: 2.2rem; transition: color .2s, background .25s var(--ease-out), box-shadow .25s; }
.seg button[aria-pressed="true"] { background: var(--amber-bg); color: var(--amber-text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* Forms. */
.field { display: flex; flex-direction: column; gap: .3rem; font-size: .8rem; font-weight: 600; color: var(--amber-text-secondary); }
.field input, .field select, .field textarea, input.in, select.in, textarea.in { font-size: 1rem; font-weight: 400; color: var(--amber-text); background: var(--amber-fill); border: 0; border-radius: var(--amber-radius-small); padding: .65rem .8rem; min-height: 2.75rem; width: 100%; outline-offset: 0; }
textarea { resize: vertical; line-height: 1.4; }
.fields { display: grid; gap: .8rem; }
.fields.two { grid-template-columns: 1fr 1fr; }
.err { color: var(--amber-danger); font-size: .88rem; min-height: 1.2em; }
.switch { appearance: none; -webkit-appearance: none; width: 3.1rem; height: 1.9rem; border-radius: 999px; background: var(--amber-fill); position: relative; flex: none; transition: background .25s; margin: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: calc(1.9rem - 4px); height: calc(1.9rem - 4px); border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .3s var(--ease-pop); }
.switch:checked { background: var(--good); }
.switch:checked::after { transform: translateX(1.2rem); }

/* Sheet: a bottom sheet on the phone, a centered panel when wide. */
.scrim { position: fixed; inset: 0; background: rgba(20, 10, 0, .32); opacity: 0; transition: opacity .28s; z-index: 50; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow: auto; background: var(--amber-bg); border-radius: 1.2rem 1.2rem 0 0; padding: .6rem 1.1rem calc(1.4rem + env(safe-area-inset-bottom)); z-index: 51; transform: translateY(105%); transition: transform .38s var(--ease-out); box-shadow: 0 -8px 40px rgba(0,0,0,.18); }
.sheet .grab { width: 2.4rem; height: .3rem; border-radius: 99px; background: var(--amber-separator); margin: 0 auto .8rem; }
.sheet header { display: flex; align-items: center; gap: .5rem; margin-bottom: 1rem; }
.sheet header h2 { flex: 1; font-size: 1.2rem; font-weight: 700; }
.open .scrim { opacity: 1; }
.open .sheet { transform: none; }
@media (min-width: 700px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: min(34rem, 92vw); border-radius: 1.2rem; transform: translate(-50%, -46%) scale(.97); opacity: 0; transition: transform .3s var(--ease-out), opacity .2s; padding: 1.2rem 1.4rem 1.4rem; }
  .open .sheet { transform: translate(-50%, -50%); opacity: 1; }
  .sheet .grab { display: none; }
}
@media (prefers-color-scheme: dark) { .sheet { background: var(--amber-surface); } .sheet .field input, .sheet .field select, .sheet .field textarea, .sheet .in { background: var(--amber-fill); } }

/* Empty states. */
.empty { text-align: center; padding: 2.2rem 1.2rem; color: var(--amber-text-secondary); }
.empty svg { width: 2.6rem; height: 2.6rem; color: var(--amber-accent); opacity: .85; margin-bottom: .6rem; }
.empty h3 { color: var(--amber-text); font-size: 1.05rem; margin-bottom: .3rem; }
.empty p { max-width: 22rem; margin: 0 auto 1rem; font-size: .94rem; }

/* A quiet confirmation under the header, for things that don't change the note. */
.note-line { font-size: .85rem; color: var(--amber-text-secondary); min-height: 1.2em; transition: opacity .3s; }

/* Motion: things that arrive rise in; nothing moves when asked not to. */
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.rise { animation: rise .35s var(--ease-out) both; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* Wide: two columns where the app asks for them. */
.cols { display: grid; gap: 0 1.6rem; grid-template-columns: minmax(0, 1fr); }
.cols > * { min-width: 0; }
@media (min-width: 900px) {
  .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .cols.side { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
  .top h1 { font-size: 2.2rem; }
}

:root { --serif: "New York", ui-serif, Georgia, serif; }
.tile { position: relative; overflow: hidden; background: var(--g); color: #fff; display: flex; flex-direction: column; justify-content: flex-end; }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile .shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, rgba(20,10,0,.78)); }
.tile b, .tile h2, .tile h3, .tile .k, .tile .m, .tile p, .tile span:not(.mono) { text-shadow: 0 1px 10px rgba(0,0,0,.45); }
.tile .mono { position: absolute; right: -.08em; top: -.18em; font-family: var(--serif); font-size: 7rem; line-height: 1; opacity: .16; font-weight: 700; pointer-events: none; }

.tonight { border-radius: var(--amber-radius); min-height: 15rem; padding: 1.1rem 1.2rem; box-shadow: var(--shadow); }
.tonight > * { position: relative; }
.tonight .k { font-size: .78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; opacity: .85; }
.tonight h2 { font-family: var(--serif); font-size: 1.9rem; line-height: 1.1; margin: .25rem 0 .35rem; font-weight: 600; }
.tonight .m { font-size: .88rem; opacity: .9; display: flex; gap: .8rem; }
.tonight .row2 { display: flex; gap: .5rem; margin-top: .9rem; }
.tonight .btn { background: #fff; color: #2A1D10; }
.tonight .btn.ghost { background: rgba(255,255,255,.2); color: #fff; }

.week .row { min-height: 3.4rem; }
.week .dd { width: 2.9rem; flex: none; line-height: 1.05; }
.week .dd b { display: block; font-size: .95rem; }
.week .dd span { font-size: .72rem; color: var(--amber-text-secondary); font-weight: 600; }
.week .today .dd b { color: var(--amber-accent-text); }
.week .dish { font-weight: 600; }
.week .plan { color: var(--amber-text-secondary); font-weight: 500; }
.week .sv { font-size: .78rem; color: var(--amber-text-secondary); }
.week .sw { width: 2.4rem; height: 2.4rem; border-radius: .6rem; background: var(--g); flex: none; overflow: hidden; }
.week .sw img { width: 100%; height: 100%; object-fit: cover; display: block; }
.week .sw.none { background: var(--amber-fill); }
.mk { display: flex; gap: .6rem; align-items: center; margin-top: .8rem; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
.rc { border: 0; padding: 0; text-align: left; border-radius: var(--amber-radius); aspect-ratio: 1 / 1.08; padding: .8rem; box-shadow: var(--shadow); font: inherit; transition: transform .2s var(--ease-out); }
.rc:active { transform: scale(.97); }
.rc b { position: relative; font-family: var(--serif); font-size: 1.08rem; line-height: 1.15; font-weight: 600; }
.rc span { position: relative; font-size: .76rem; opacity: .9; margin-top: .2rem; }

.groc .aisle { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--amber-text-secondary); padding: .8rem 1rem .2rem; }
.item { cursor: pointer; }
.item .box { width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--amber-text-secondary) 45%, transparent); display: grid; place-items: center; flex: none; color: var(--amber-on-accent); transition: background .2s, border-color .2s; }
.item .box svg { width: .9rem; height: .9rem; stroke-width: 3.2; opacity: 0; }
.item[aria-checked="true"] .box { background: var(--amber-accent); border-color: var(--amber-accent); }
.item[aria-checked="true"] .box svg { opacity: 1; }
.item[aria-checked="true"] .txt { color: var(--amber-text-secondary); text-decoration: line-through; }
.gh { display: flex; align-items: center; gap: .6rem; padding: .9rem 1rem .3rem; }
.gh b { font-size: 1.05rem; }
.bar2 { height: .35rem; border-radius: 99px; background: var(--amber-fill); margin: .2rem 1rem .4rem; overflow: hidden; }
.bar2 b { display: block; height: 100%; background: var(--amber-accent); border-radius: 99px; transition: width .5s var(--ease-out); }

/* Sheets */
.hero2 { border-radius: var(--amber-radius); min-height: 12rem; padding: 1rem; margin-bottom: 1rem; }
.hero2 h3 { position: relative; font-family: var(--serif); font-size: 1.5rem; line-height: 1.1; }
.hero2 p { position: relative; font-size: .85rem; opacity: .9; margin-top: .3rem; }
.scale { display: flex; align-items: center; gap: .7rem; margin-bottom: .8rem; }
.scale .grow { font-weight: 600; }
.ing .row { font-size: .95rem; min-height: 2.5rem; }
.ing .q { width: 5rem; flex: none; font-weight: 600; font-variant-numeric: tabular-nums; }
.steps { counter-reset: s; display: grid; gap: .7rem; margin-top: .4rem; }
.steps li { list-style: none; display: grid; grid-template-columns: 1.8rem 1fr; gap: .6rem; font-size: 1rem; line-height: 1.4; }
.steps li::before { counter-increment: s; content: counter(s); width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--amber-accent-soft); color: var(--amber-accent-text); font-weight: 800; font-size: .8rem; display: grid; place-items: center; }
.tmr { border: 0; background: var(--amber-accent-soft); color: var(--amber-accent-text); font: inherit; font-weight: 700; border-radius: 99px; padding: 0 .5rem; display: inline-flex; align-items: center; gap: .2rem; min-height: 1.7rem; }
.tmr svg { width: .9rem; height: .9rem; }
.tmr.run { background: var(--amber-accent); color: var(--amber-on-accent); }
.cook .big { font-family: var(--serif); font-size: 1.45rem; line-height: 1.35; min-height: 8rem; margin: .4rem 0 1rem; }
.cook .stepn { font-size: .8rem; font-weight: 700; color: var(--amber-text-secondary); text-transform: uppercase; letter-spacing: .04em; }
.cook .dots3 { display: flex; gap: .3rem; margin-bottom: 1rem; }
.cook .dots3 i { flex: 1; height: .25rem; border-radius: 99px; background: var(--amber-fill); }
.cook .dots3 i.on { background: var(--amber-accent); }
.pick .row { min-height: 3rem; }
.pick .sw { width: 2.4rem; height: 2.4rem; border-radius: .6rem; background: var(--g); flex: none; display: grid; place-items: center; color: #fff; font-family: var(--serif); font-weight: 700; }
.preview .aisle { font-size: .72rem; font-weight: 700; text-transform: uppercase; color: var(--amber-text-secondary); padding: .6rem 1rem .1rem; letter-spacing: .04em; }
.preview label.row { min-height: 2.6rem; font-size: .95rem; cursor: pointer; }
.preview input { width: 1.2rem; height: 1.2rem; accent-color: var(--amber-accent); }
.preview .for { font-size: .74rem; color: var(--amber-text-secondary); }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } .tonight { min-height: 14rem; } .tonight h2 { font-size: 2.3rem; } }
</style>

    cloud: '<path d="M7 18a4.5 4.5 0 1 1 .9-8.9A6 6 0 0 1 19.5 11 3.5 3.5 0 0 1 18 18z"/>',
    rain: '<path d="M7 15a4.5 4.5 0 1 1 .9-8.9A6 6 0 0 1 19.5 8 3.5 3.5 0 0 1 18 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
    suitcase: '<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V4.5h6V7M3 12h18"/>',
    coins: '<ellipse cx="9" cy="7" rx="6" ry="3"/><path d="M3 7v5c0 1.7 2.7 3 6 3s6-1.3 6-3V7"/><path d="M9 15v2c0 1.7 2.7 3 6 3s6-1.3 6-3v-5c0-1.7-2.7-3-6-3"/>',

    cards: '<rect x="3" y="6" width="14" height="15" rx="2.5"/><path d="M7 3h11.5A2.5 2.5 0 0 1 21 5.5V18"/>',
    dumbbell: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
    map: '<path d="M9 4L3 6.5v14L9 18l6 2.5 6-2.5V4l-6 2.5zM9 4v14M15 6.5v14"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/>',
    note: '<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/>',
  };
  const ico = (n, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${paths[n] || ""}</svg>`;

  // Dates are "yyyy-mm-dd" strings from the note; the clock is amber.note.today.
  const D = {
    parse: (s) => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(String(s || "").trim()); return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null; },

    add: (s, n) => { const d = D.parse(s); d.setUTCDate(d.getUTCDate() + n); return D.iso(d); },
    diff: (a, b) => Math.round((D.parse(a) - D.parse(b)) / 86400000),
    wd: (s) => (D.parse(s).getUTCDay() + 6) % 7, // 0 = Monday
    weekStart: (s) => D.add(s, -D.wd(s)),
    fmt: (s, o = { weekday: "short", day: "numeric", month: "short" }) => { const d = D.parse(s); return d ? d.toLocaleDateString("en-GB", { timeZone: "UTC", ...o }) : ""; },
    month: (s) => D.fmt(s, { month: "long" }),
    rel: (s, today) => { const n = D.diff(s, today); return n === 0 ? "Today" : n === 1 ? "Tomorrow" : n === -1 ? "Yesterday" : n > 1 && n < 7 ? D.fmt(s, { weekday: "long" }) : n > 0 ? `In ${n} days` : `${-n} days ago`; },
  };

  const num = (s) => { const n = parseFloat(String(s ?? "").replace(/\s| /g, "").replace(/kr|sek|€|\$/gi, "").replace(",", ".")); return Number.isFinite(n) ? n : NaN; };
  const kr = (n, o = {}) => new Intl.NumberFormat("sv-SE", { maximumFractionDigits: o.dec ?? 0, minimumFractionDigits: o.dec ?? 0 }).format(Math.round(n * 10 ** (o.dec ?? 0)) / 10 ** (o.dec ?? 0)) + (o.unit === false ? "" : " " + (o.unit || "kr"));
  const fmtN = (n, dec = 0) => new Intl.NumberFormat("sv-SE", { maximumFractionDigits: dec }).format(n);
  const done = (s) => /^(✓|✔|x|yes|done|1|true)$/i.test(String(s ?? "").trim());
  const col = (t, re) => t ? t.columns.findIndex((c) => re.test(c.name.trim())) : -1;
  const table = (note, ...res) => note.tables.find((t) => res.every((re) => col(t, re) >= 0));

  // Where each table sits in the markdown, so several rows can go in with one edit (one Undo).
  function tableLines(md) {
    const lines = md.split("\n"), out = [];
    const isRow = (l) => l.trim().startsWith("|");
    const isSep = (l) => { const t = l.trim(); return t.startsWith("|") && t.includes("-") && [...t].every((c) => "|-: ".includes(c)); };
    for (let i = 0; i < lines.length;) {
      if (!(isRow(lines[i]) && isSep(lines[i + 1] || ""))) { i++; continue; }
      let j = i + 2; while (j < lines.length && isRow(lines[j])) j++;
      out.push({ start: i, end: j }); i = j;
    }
    return { lines, tables: out };
  }
  const level = (l) => { const m = /^(#{1,6}) /.exec(l); return m ? m[1].length : 0; };
  const cellText = (v) => String(v ?? "").replace(/\n/g, " ").replace(/\|/g, "\\|");
  /** Adds rows to table `index` in one edit: the section around the table is rewritten with set_text. */
  async function addRows(index, rows, columns) {
    const note = amber.note, t = note.tables[index];
    const asCells = rows.map((r) => Array.isArray(r) ? r : (columns || t.columns.map((c) => c.name)).map((n) => r[n] ?? ""));
    const { lines, tables } = tableLines(note.markdown);
    const at = tables[index];
    let h = -1; for (let k = at.start - 1; k >= 0; k--) if (level(lines[k])) { h = k; break; }
    if (h < 0 || rows.length === 1) {

    }
    const lv = level(lines[h]); let end = h + 1; while (end < lines.length && !(level(lines[end]) && level(lines[end]) <= lv)) end++;

    return amber.update({ op: "set_text", heading: lines[h].replace(/^#+\s*/, ""), text: section.join("\n") });
  }

  // A sheet: one at a time, Escape or the scrim closes it, focus goes in and comes back.
  let current = null;
  function sheet(title, html, { mount, wide, actions = "" } = {}) {
    close();
    const back = document.activeElement;
    const host = document.createElement("div");
    host.className = "sheet-host";
    host.innerHTML = `<div class="scrim" data-close></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}" ${wide ? 'style="width:min(46rem,94vw)"' : ""}>
      <div class="grab"></div><header><h2>${esc(title)}</h2>${actions}<button class="round" data-close aria-label="Close">${ico("close")}</button></header><div class="sheet-body">${html}</div></section>`;
    document.body.appendChild(host);
    const onKey = (e) => { if (e.key === "Escape") close(); };
    host.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) close(); });
    addEventListener("keydown", onKey);
    current = { host, back, onKey };
    requestAnimationFrame(() => requestAnimationFrame(() => host.classList.add("open")));
    mount && mount(host.querySelector(".sheet-body"), close);
    setTimeout(() => (host.querySelector("[autofocus]") || host.querySelector(".sheet header .round")).focus({ preventScroll: true }), 60);

  }
  function close() {
    if (!current) return;
    const { host, back, onKey } = current;
    current = null;
    removeEventListener("keydown", onKey);
    host.classList.remove("open");
    setTimeout(() => host.remove(), 380);
    back && back.focus && back.focus({ preventScroll: true });
  }

  // App settings: declared once with defaults, changed in a sheet without asking an AI. Kept in the
  // app's own data under "settings" (amber.settings when the app offers it).
  function settings(schema) {
    const get = () => {
      const saved = (amber.settings && amber.settings.values) || (amber.data.values.settings || {});
      return Object.fromEntries(schema.map((f) => [f.key, saved[f.key] ?? f.default]));
    };
    const save = (key, value) => amber.settings && amber.settings.set ? amber.settings.set(key, value) : amber.setData({ values: { settings: { [key]: value } } });
    function open(title = "Settings", extra = "") {
      const s = get();
      const field = (f) => {
        const id = "set-" + f.key;
        if (f.type === "toggle") return `<label class="row" for="${id}"><span class="grow">${esc(f.label)}${f.help ? `<div class="muted small">${esc(f.help)}</div>` : ""}</span><input class="switch" type="checkbox" id="${id}" data-key="${f.key}" ${s[f.key] ? "checked" : ""}></label>`;
        const input = f.type === "select"
          ? `<select class="in" id="${id}" data-key="${f.key}">${f.options.map((o) => `<option value="${esc(o[0])}" ${String(s[f.key]) === String(o[0]) ? "selected" : ""}>${esc(o[1])}</option>`).join("")}</select>`
          : `<input class="in num" id="${id}" data-key="${f.key}" type="${f.type === "number" ? "number" : f.type === "time" ? "time" : "text"}" ${f.type === "number" ? `inputmode="decimal" step="${f.step || 1}" min="${f.min ?? 0}"` : ""} value="${esc(s[f.key])}">`;
        return `<div class="row stack"><label for="${id}" class="grow">${esc(f.label)}${f.unit ? ` <span class="muted">(${esc(f.unit)})</span>` : ""}${f.help ? `<div class="muted small">${esc(f.help)}</div>` : ""}</label><div class="set-input">${input}</div></div>`;
      };
      sheet(title, `<div class="card list settings-list">${schema.map(field).join("")}</div>${extra}<p class="muted small" style="margin:.9rem .3rem 0">Settings are kept in this note's app, on all your devices.</p>`, {
        mount(root) {
          root.addEventListener("change", (e) => {
            const el = e.target.closest("[data-key]"); if (!el) return;
            const f = schema.find((x) => x.key === el.dataset.key);
            const v = f.type === "toggle" ? el.checked : f.type === "number" ? (Number.isFinite(parseFloat(el.value)) ? parseFloat(el.value) : f.default) : el.value;

  const style = document.createElement("style");
  style.textContent = `.settings-list .row.stack { flex-wrap: wrap; } .settings-list .set-input { width: 9.5rem; } .settings-list .set-input .in { text-align: right; } .settings-list label.row { cursor: pointer; }
  @media (max-width: 420px) { .settings-list .set-input { width: 8rem; } }`;
  document.head.appendChild(style);

  // Charts drawn at their real width (so 10 px labels stay 10 px): width(key) is the last measured
  // width of the element with data-w="key"; fit(render) re-renders once when a width changed.

})();

const { esc, ico, D, num, col, sheet, announce } = Kit;
const S = Kit.settings([
  { key: "servings", label: "Usual servings", type: "number", default: 2, min: 1, help: "For dinners you plan from here." },
  { key: "pantry", label: "Always at home", type: "text", default: "salt, pepper, olive oil", help: "Left off the shopping list. Separate with commas." },
  { key: "groupAisles", label: "Group the list by aisle", type: "toggle", default: true },
]);
const hue = (s) => [...s].reduce((a, ch) => (a * 29 + ch.charCodeAt(0)) % 360, 23);
const grad = (name) => { const h = (hue(name) % 70) + 5; return `linear-gradient(150deg, hsl(${h} 62% 52%), hsl(${(h + 330) % 360} 55% 34%))`; };
const art = (r) => r.photo ? `<img src="${r.photo}" alt="">` : `<span class="mono" aria-hidden="true">${esc(r.name[0])}</span>`;
const recipes = () => (amber.data.collections.recipes || []);
const byName = (n) => recipes().find((r) => r.name.toLowerCase() === String(n).trim().toLowerCase());
const fmtQ = (q) => { if (!q) return ""; const w = Math.floor(q + 1e-9), f = Math.round((q - w) * 100) / 100; const fr = { 0.25: "¼", 0.5: "½", 0.75: "¾" }[f]; return f === 0 ? String(w) : fr ? (w ? w : "") + fr : String(Math.round(q * 10) / 10).replace(".", ","); };
const qty = (i, k) => { const q = i.qty * k; const nice = i.unit === "g" ? Math.round(q / 5) * 5 : i.unit === "" ? Math.ceil(q * 2) / 2 : Math.round(q * 4) / 4; return `${fmtQ(nice)}${i.unit ? " " + i.unit : ""}`.trim(); };

function model(note) {
  const t = Kit.table(note, /^(day|date)$/i, /^(dinner|meal|recipe)$/i);
  const c = t && { day: col(t, /^(day|date)$/i), dish: col(t, /^(dinner|meal|recipe)$/i), sv: col(t, /^servings?$/i) };
  const plan = t ? t.rows.map((r, i) => ({ i, day: r[c.day].trim(), dish: r[c.dish].trim(), servings: c.sv >= 0 ? parseInt(r[c.sv]) || 0 : 0 })).filter((p) => D.parse(p.day)) : [];
  const lines = note.markdown.split("\n");
  let h = -1; lines.forEach((l, k) => { if (/^#{1,6}\s+(groceries|shopping)/i.test(l)) h = k; });
  let end = lines.length; if (h >= 0) for (let k = h + 1; k < lines.length; k++) if (/^#{1,2}\s/.test(lines[k])) { end = k; break; }
  const groc = note.checklists.filter((x) => h < 0 || (x.line - 1 > h && x.line - 1 < end));
  // The aisle of each item: the ### heading above it, if any.
  for (const g of groc) { for (let k = g.line - 2; k > h; k--) { const m = /^###\s+(.*)/.exec(lines[k]); if (m) { g.aisle = m[1].trim(); break; } } }
  return { t, c, plan, groc, grocHeading: h >= 0 ? lines[h].replace(/^#+\s*/, "") : null };
}

function render(note = amber.note) {
  const app = document.getElementById("app");
  const m = model(note), today = note.today;
  const tonight = m.plan.find((p) => p.day === today);
  const tr = tonight && byName(tonight.dish);
  const upcoming = m.plan.filter((p) => p.day >= today);
  const planned = upcoming.filter((p) => p.dish).length;
  const done = m.groc.filter((g) => g.checked).length;
  const aisles = [...new Set(m.groc.map((g) => g.aisle || ""))];
  app.innerHTML = `
  <header class="top"><div class="titles"><h1>${esc(note.title)}</h1><div class="sub">${planned} ${planned === 1 ? "dinner" : "dinners"} planned${m.groc.length ? ` · ${m.groc.length - done} to buy` : ""}</div></div>
    <button class="round" id="newr" aria-label="New recipe">${ico("plus")}</button><button class="round" id="settings" aria-label="Settings">${ico("gear")}</button></header>
  <div class="cols side">
    <div>
      ${tr ? `<section class="tile tonight" style="--g:${grad(tr.name)}">${art(tr)}<div class="shade" style="background:linear-gradient(180deg, rgba(20,10,0,0) 15%, rgba(20,10,0,.8))"></div>
        <div class="k">Tonight</div><h2>${esc(tr.name)}</h2><div class="m"><span>${tr.minutes} min</span><span>${tonight.servings || tr.servings} servings</span></div>
        <div class="row2"><button class="btn" data-cook="${esc(tr.id)}" data-sv="${tonight.servings || tr.servings}">${ico("pot")} Start cooking</button><button class="btn ghost" data-recipe="${esc(tr.id)}">Recipe</button></div></section>`
      : `<section class="card empty" style="padding:1.6rem">${ico("pot")}<h3>Nothing planned tonight</h3><p>Pick something from your recipes.</p>${m.t ? `<button class="btn primary" data-plan="${today}">Plan tonight</button>` : ""}</section>`}
      <div class="label"><span class="grow">This week</span></div>
      ${m.t ? `<section class="card list week">${m.plan.filter((p) => p.day >= D.add(today, -1)).map((p) => { const r = byName(p.dish); return `<button class="row ${p.day === today ? "today" : ""}" data-plan="${p.day}">
          <span class="dd"><b>${D.fmt(p.day, { weekday: "short" })}</b><span>${+p.day.slice(8)} ${D.fmt(p.day, { month: "short" })}</span></span><span class="sw ${p.dish ? "" : "none"}" style="--g:${p.dish ? grad(p.dish) : ""}">${r && r.photo ? `<img src="${r.photo}" alt="">` : ""}</span>
          <span class="grow">${p.dish ? `<span class="dish ellipsis" style="display:block">${esc(p.dish)}</span><span class="sv">${r ? `${r.minutes} min · ` : ""}${p.servings || "?"} servings</span>` : `<span class="plan">Plan something</span>`}</span>${ico("chevron", 'class="chev"')}</button>`; }).join("")}</section>
        <div class="mk"><button class="btn primary" id="make">${ico("cart")} Make grocery list</button><span class="muted small">From the dinners ahead</span></div>`
      : `<div class="card empty"><p>Add a table with Day, Dinner and Servings under a "This week" heading to plan dinners.</p></div>`}
    </div>
    <div>
      <div class="label"><span class="grow">Groceries</span>${done ? `<button id="clear">Clear ${done} bought</button>` : ""}</div>
      <section class="card groc">${m.groc.length ? `<div class="gh"><b class="num">${done} of ${m.groc.length}</b><span class="muted small">in the basket</span></div><div class="bar2"><b style="width:${(done / m.groc.length) * 100}%"></b></div>
        ${aisles.map((a) => `${a ? `<div class="aisle">${esc(a)}</div>` : ""}<div class="list">${m.groc.filter((g) => (g.aisle || "") === a).map((g) => `<div class="row item" role="checkbox" tabindex="0" aria-checked="${g.checked}" data-line="${g.line}"><span class="box">${ico("check")}</span><span class="txt grow">${esc(g.text)}</span></div>`).join("")}</div>`).join("")}`
        : `<div class="empty" style="padding:1.4rem"><p style="margin:0">The list is empty. Make one from the week's dinners.</p></div>`}</section>
    </div>
  </div>
  <div class="label"><span class="grow">Recipes</span><span class="small num" style="text-transform:none">${recipes().length}</span></div>
  <section class="grid">${recipes().map((r) => `<button class="tile rc" style="--g:${grad(r.name)}" data-recipe="${esc(r.id)}">${art(r)}<div class="shade"></div><b>${esc(r.name)}</b><span>${r.minutes} min · ${esc((r.tags || []).join(", "))}</span></button>`).join("")}</section>`;
}

function ingredientsHTML(r, k) {
  return `<div class="card list ing">${r.ingredients.map((i) => `<div class="row"><span class="q">${esc(qty(i, k))}</span><span class="grow">${esc(i.item)}</span></div>`).join("")}</div>`;
}
// "for 9 minutes" in a step becomes a timer you can start.
const withTimers = (s) => esc(s).replace(/(\d+)\s*(minutes?|min)\b/g, (x, n) => `<button class="tmr" data-timer="${n}" aria-label="Start a ${n} minute timer">${ico("timer")}${n} min</button>`);

function recipeSheet(id) {
  const r = recipes().find((x) => x.id === id); if (!r) return;
  let sv = r.servings;
  const body = () => `<div class="tile hero2" style="--g:${grad(r.name)}">${art(r)}<div class="shade"></div><h3>${esc(r.name)}</h3><p>${r.minutes} min · ${esc((r.tags || []).join(", "))}</p></div>
    <div class="scale"><span class="grow">Servings</span><button class="round" data-sv="-1" aria-label="Fewer servings">−</button><b class="num" aria-live="polite">${sv}</b><button class="round" data-sv="1" aria-label="More servings">+</button></div>
    ${ingredientsHTML(r, sv / r.servings)}
    <div class="label">Method</div><ol class="steps" style="padding:0;margin:0">${r.steps.map((s) => `<li><span>${withTimers(s)}</span></li>`).join("")}</ol>
    <div class="fields two" style="margin-top:1.2rem"><button class="btn tint" data-addplan="${esc(r.id)}">${ico("calendar")} Add to the week</button><button class="btn primary" data-cook="${esc(r.id)}" data-sv="${sv}">${ico("pot")} Cook</button></div>`;
  sheet("Recipe", body(), {
    mount(root, close) {
      root.addEventListener("click", (e) => {
        const b = e.target.closest("[data-sv]:not([data-cook])"); if (b) { sv = Math.max(1, Math.min(12, sv + Number(b.dataset.sv))); root.innerHTML = body(); return; }
        const c = e.target.closest("[data-cook]"); if (c) { close(); setTimeout(() => cook(r.id, sv), 360); return; }
        const a = e.target.closest("[data-addplan]"); if (a) { close(); setTimeout(() => dayPicker(r), 360); }
      });
    },
  });
}

function dayPicker(r) {
  const m = model(amber.note), today = amber.note.today;
  const days = m.plan.filter((p) => p.day >= today);
  sheet(`When?`, `<div class="card list pick">${days.map((p) => `<button class="row" data-d="${p.day}"><span class="grow"><b>${D.rel(p.day, today)}</b><div class="small muted">${p.dish ? esc(p.dish) : "Nothing yet"}</div></span>${ico("chevron", 'class="chev"')}</button>`).join("")}</div>`, {
    mount(root, close) { root.addEventListener("click", async (e) => { const b = e.target.closest("[data-d]"); if (!b) return; await setDinner(b.dataset.d, r.name, r.servings); close(); }); },
  });
}

async function setDinner(day, dish, servings) {
  const m = model(amber.note); const p = m.plan.find((x) => x.day === day);
  const name = (k) => m.t.columns[m.c[k]].name;
  if (p) {
    let r = await amber.update({ op: "set_cell", table: m.t.index, row: p.i, col: name("dish"), value: dish });
    if (r.ok && m.c.sv >= 0) r = await amber.update({ op: "set_cell", table: m.t.index, row: p.i, col: name("sv"), value: dish ? String(servings || S.get().servings) : "" });
    return r;
  }
  return amber.update({ op: "append_row", table: m.t.index, values: { [name("day")]: day, [name("dish")]: dish, ...(m.c.sv >= 0 ? { [name("sv")]: String(servings || S.get().servings) } : {}) } });
}

function planSheet(day) {
  const m = model(amber.note), p = m.plan.find((x) => x.day === day);
  sheet(D.fmt(day, { weekday: "long", day: "numeric", month: "long" }), `<div class="card list pick">${recipes().map((r) => `<button class="row" data-pick="${esc(r.id)}"><span class="sw" style="--g:${grad(r.name)}">${r.photo ? `<img src="${r.photo}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">` : esc(r.name[0])}</span><span class="grow"><b style="font-weight:600">${esc(r.name)}</b><div class="small muted">${r.minutes} min · ${esc((r.tags || []).join(", "))}</div></span>${p && p.dish === r.name ? ico("check", 'style="width:1.1rem;color:var(--amber-accent-text)"') : ""}</button>`).join("")}</div>
    ${p && p.dish ? `<button class="btn danger block" id="clearday" style="margin-top:.6rem">Clear this day</button>` : ""}`, {
    mount(root, close) {
      root.addEventListener("click", async (e) => {
        const b = e.target.closest("[data-pick]");
        if (b) { const r = recipes().find((x) => x.id === b.dataset.pick); await setDinner(day, r.name, r.servings > 2 && S.get().servings <= 2 ? S.get().servings : r.servings); close(); }
        if (e.target.closest("#clearday")) { await setDinner(day, "", 0); close(); }
      });
    },
  });
}

// The list: every ingredient of the dinners ahead, scaled to their servings, added up, minus the pantry.
function groceryList() {
  const m = model(amber.note), today = amber.note.today;
  const pantry = S.get().pantry.split(",").map((s) => s.trim().toLowerCase()).filter(Boolean);
  const need = new Map();
  for (const p of m.plan.filter((x) => x.day >= today && x.dish)) {
    const r = byName(p.dish); if (!r) continue;
    const k = (p.servings || r.servings) / r.servings;
    for (const i of r.ingredients) {
      if (pantry.some((x) => i.item.toLowerCase() === x || i.item.toLowerCase().startsWith(x + " "))) continue;
      const id = `${i.item.toLowerCase().replace(/(es|s)$/, "")}|${i.unit}`;
      const e = need.get(id) || { ...i, qty: 0, for: [] };
      e.qty += i.qty * k; if (!e.for.includes(r.name)) e.for.push(r.name);
      need.set(id, e);
    }
  }
  const have = new Set(m.groc.filter((g) => !g.checked).map((g) => g.text.toLowerCase()));
  const items = [...need.values()].map((e) => ({ ...e, text: `${e.qty ? qty(e, 1) + " " : ""}${e.item}`, use: true })).sort((a, b) => (a.aisle || "").localeCompare(b.aisle || "") || a.item.localeCompare(b.item));
  const keep = m.groc.filter((g) => !g.checked && !items.some((i) => i.text.toLowerCase() === g.text.toLowerCase()));
  const draw = () => { const aisles = [...new Set(items.map((i) => i.aisle || "Other"))]; return `<p class="muted small" style="margin:0 .2rem .7rem">${items.length} things for ${m.plan.filter((x) => x.day >= today && x.dish).length} dinners. Untick what you already have.</p>
    <div class="card preview">${aisles.map((a) => `<div class="aisle">${esc(a)}</div><div class="list">${items.map((it, k) => (it.aisle || "Other") === a ? `<label class="row"><input type="checkbox" data-k="${k}" ${it.use ? "checked" : ""}><span class="grow">${esc(it.text)}<div class="for">${esc(it.for.join(", "))}</div></span></label>` : "").join("")}</div>`).join("")}</div>
    ${keep.length ? `<p class="muted small" style="margin:.7rem .2rem 0">Also kept on the list: ${esc(keep.map((g) => g.text).join(", "))}.</p>` : ""}
    <div class="err" id="err" role="alert"></div><button class="btn primary block" id="write" style="margin-top:.8rem">${ico("cart")} Put it in the note</button>`; };
  sheet("Grocery list", draw(), {
    mount(root, close) {
      root.addEventListener("change", (e) => { const c = e.target.closest("[data-k]"); if (c) items[+c.dataset.k].use = c.checked; });
      root.addEventListener("click", async (e) => {
        if (!e.target.closest("#write")) return;
        const use = items.filter((i) => i.use);
        const group = S.get().groupAisles;
        let text = "";
        if (group) {
          const aisles = [...new Set(use.map((i) => i.aisle || "Other"))];
          text = (keep.length ? keep.map((g) => `- [ ] ${g.text}`).join("\n") + "\n\n" : "") + aisles.map((a) => `### ${a}\n` + use.filter((i) => (i.aisle || "Other") === a).map((i) => `- [ ] ${i.text}`).join("\n")).join("\n\n");
        } else text = [...keep.map((g) => g.text), ...use.map((i) => i.text)].map((t) => `- [ ] ${t}`).join("\n");
        let r = await amber.update({ op: "set_text", heading: m.grocHeading || "Groceries", text: "\n" + text });
        if (!r.ok) { root.querySelector("#err").textContent = "Add a heading named Groceries to the note, and the list goes under it."; return; }
        close(); announce(`${use.length} things on the list.`);
      });
    },
  });
}

async function clearBought() {
  const m = model(amber.note);
  const lines = amber.note.markdown.split("\n");
  const h = lines.findIndex((l) => /^#{1,6}\s+(groceries|shopping)/i.test(l)); if (h < 0) return;
  let end = lines.length; for (let k = h + 1; k < lines.length; k++) if (/^#{1,2}\s/.test(lines[k])) { end = k; break; }
  const bought = new Set(m.groc.filter((g) => g.checked).map((g) => g.line - 1));
  let sec = lines.slice(h + 1, end).filter((_, k) => !bought.has(h + 1 + k));
  // A heading left with nothing under it goes too.
  sec = sec.filter((l, k) => !/^###\s/.test(l) || sec.slice(k + 1).find((x) => x.trim() && !/^###\s/.test(x)) && !/^###\s/.test(sec.slice(k + 1).find((x) => x.trim()) || "###"));
  await amber.update({ op: "set_text", heading: lines[h].replace(/^#+\s*/, ""), text: sec.join("\n") });
}

// Cooking: one step at a time, big, with the screen's timers turned into real notifications.
function cook(id, sv) {
  const r = recipes().find((x) => x.id === id); let n = 0;
  const body = () => `<div class="cook"><div class="dots3">${r.steps.map((_, k) => `<i class="${k <= n ? "on" : ""}"></i>`).join("")}</div>
    ${n === 0 ? `<div class="label" style="margin-top:0">You need, for ${sv}</div>${ingredientsHTML(r, sv / r.servings)}<div style="height:1rem"></div>` : ""}
    <div class="stepn">Step ${n + 1} of ${r.steps.length}</div><p class="big">${withTimers(r.steps[n])}</p>
    <div class="fields two"><button class="btn" data-step="-1" ${n ? "" : "disabled"}>Back</button><button class="btn primary" data-step="1">${n === r.steps.length - 1 ? "Done" : "Next"}</button></div></div>`;
  sheet(r.name, body(), {
    wide: true,
    mount(root, close) {
      root.addEventListener("click", (e) => {
        const b = e.target.closest("[data-step]"); if (!b) return;
        if (+b.dataset.step > 0 && n === r.steps.length - 1) { close(); announce("Enjoy."); return; }
        n = Math.max(0, Math.min(r.steps.length - 1, n + Number(b.dataset.step))); root.innerHTML = body();
      });
    },
  });
}

async function timer(btn) {
  const mins = +btn.dataset.timer;
  if (btn.classList.contains("run")) return;
  const r = await amber.device.notify({ title: "Timer done", body: `${mins} minutes are up.`, in: mins * 60 });
  if (!r.ok) { announce(r.error); return; }
  btn.classList.add("run");
  const end = Date.now() + mins * 60000;
  const tick = () => { const s = Math.max(0, Math.round((end - Date.now()) / 1000)); btn.lastChild.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; if (s > 0 && btn.isConnected) setTimeout(tick, 1000); else btn.classList.remove("run"); };
  tick();
}

function newRecipe() {
  sheet("New recipe", `<form id="nf" class="fields"><label class="field">Name<input id="rn" required autofocus maxlength="60"></label>
    <div class="fields two"><label class="field">Minutes<input id="rm" inputmode="numeric" value="30"></label><label class="field">Servings<input id="rs" inputmode="numeric" value="${S.get().servings}"></label></div>
    <label class="field">Ingredients, one a line<textarea id="ri" rows="5" placeholder="200 g spaghetti&#10;1 lemon&#10;50 g parmesan"></textarea></label>
    <label class="field">Steps, one a line<textarea id="rt" rows="5"></textarea></label><button class="btn primary block">Save recipe</button></form>`, {
    mount(root, close) {
      root.querySelector("#nf").onsubmit = async (e) => {
        e.preventDefault();
        const ing = root.querySelector("#ri").value.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => { const m = /^([\d.,½¼¾]+)?\s*(g|kg|dl|ml|l|tbsp|tsp|pack|jar|bunch)?\s+(.*)$/i.exec(l); return m ? { qty: num((m[1] || "").replace("½", ".5")) || (m[1] ? 0 : 1), unit: m[2] || "", item: m[3], aisle: "" } : { qty: 1, unit: "", item: l, aisle: "" }; });
        await amber.store.collection("recipes").add({ id: Kit.hash(root.querySelector("#rn").value + Date.now()), name: root.querySelector("#rn").value.trim(), minutes: parseInt(root.querySelector("#rm").value) || 30, servings: parseInt(root.querySelector("#rs").value) || 2, tags: [], ingredients: ing, steps: root.querySelector("#rt").value.split("\n").map((l) => l.trim()).filter(Boolean) });
        close();
      };
    },
  });
}

document.addEventListener("click", (e) => {
  const tm = e.target.closest("[data-timer]"); if (tm) { timer(tm); return; }
  const t = e.target.closest("#settings,#make,#clear,#newr,[data-recipe],[data-cook],[data-plan],[data-line]"); if (!t || t.closest(".sheet")) return;
  if (t.id === "settings") S.open("Kitchen settings");
  else if (t.id === "make") groceryList();
  else if (t.id === "clear") clearBought();
  else if (t.id === "newr") newRecipe();
  else if (t.dataset.recipe) recipeSheet(t.dataset.recipe);
  else if (t.dataset.cook) cook(t.dataset.cook, +t.dataset.sv);
  else if (t.dataset.plan) planSheet(t.dataset.plan);
  else if (t.dataset.line) amber.update({ op: "toggle_checklist", line: +t.dataset.line });
});
document.addEventListener("keydown", (e) => { const t = e.target.closest("[data-line]"); if (t && (e.key === " " || e.key === "Enter")) { e.preventDefault(); amber.update({ op: "toggle_checklist", line: +t.dataset.line }); } });
amber.onChange((note) => render(note));
</script>
