<title>Bookshelf</title>
<style>
/* The shared look of the best-apps set: Amber Notes' variables, iOS-like grouped lists, sheets. */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* Header: large title, a line under it, round buttons on the right. */

.top .titles { flex: 1; min-width: 0; }

/* Section labels and cards. */

.list > .row, .list > li { display: flex; align-items: center; gap: .75rem; min-height: 2.9rem; padding: .6rem 1rem; position: relative; }

.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { color: var(--amber-text-secondary); opacity: .6; width: .7rem; flex: none; }

/* Buttons. */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 2.75rem; padding: 0 1.1rem; border: 0; border-radius: 999px; font-weight: 600; background: var(--amber-fill); color: var(--amber-text); transition: transform .15s var(--ease-out), opacity .2s, background .2s; white-space: nowrap; }
.btn svg { width: 1.1rem; height: 1.1rem; }

.seg button[aria-pressed="true"] { background: var(--amber-bg); color: var(--amber-text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* Forms. */
.field { display: flex; flex-direction: column; gap: .3rem; font-size: .8rem; font-weight: 600; color: var(--amber-text-secondary); }
.field input, .field select, .field textarea, input.in, select.in, textarea.in { font-size: 1rem; font-weight: 400; color: var(--amber-text); background: var(--amber-fill); border: 0; border-radius: var(--amber-radius-small); padding: .65rem .8rem; min-height: 2.75rem; width: 100%; outline-offset: 0; }

.switch { appearance: none; -webkit-appearance: none; width: 3.1rem; height: 1.9rem; border-radius: 999px; background: var(--amber-fill); position: relative; flex: none; transition: background .25s; margin: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: calc(1.9rem - 4px); height: calc(1.9rem - 4px); border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .3s var(--ease-pop); }

/* Sheet: a bottom sheet on the phone (above the keyboard), a centred panel from 700 px. */
.scrim { position: fixed; inset: 0; background: rgba(20, 10, 0, .34); opacity: 0; transition: opacity .28s; z-index: 50; }
.sheet { position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); max-height: calc(var(--vvh, 100vh) - 3.5rem); display: flex; flex-direction: column; background: var(--amber-bg); border-radius: 1.25rem 1.25rem 0 0; z-index: 51; transform: translateY(105%); transition: transform .38s var(--ease-out), bottom .25s var(--ease-out); box-shadow: 0 -8px 40px rgba(0,0,0,.18); }
.sheet header { position: relative; display: flex; align-items: center; gap: .5rem; padding: 1.1rem 1.1rem .7rem; flex: none; }
.sheet .grab { position: absolute; top: .45rem; left: 50%; transform: translateX(-50%); width: 2.4rem; height: .3rem; border-radius: 99px; background: var(--amber-separator); }
.sheet header h2 { flex: 1; min-width: 0; font-size: 1.15rem; font-weight: 700; overflow-wrap: anywhere; }
.sheet header .round { width: 2.2rem; height: 2.2rem; }
.sheet-body { overflow: auto; overscroll-behavior: contain; padding: .2rem 1.1rem calc(1.4rem + env(safe-area-inset-bottom) + var(--amber-inset-bottom, 0px)); min-width: 0; }
.open .scrim { opacity: 1; }
.open .sheet { transform: none; }

/* A sheet's main action stays in reach at the bottom while its content scrolls. */
.sheet-foot { --pb: calc(1.4rem + env(safe-area-inset-bottom) + var(--amber-inset-bottom, 0px)); position: sticky; bottom: calc(-1 * var(--pb)); margin: .6rem -1.1rem calc(-1 * var(--pb)); padding: .7rem 1.1rem var(--pb); background: linear-gradient(to bottom, transparent, var(--amber-bg) .7rem); display: grid; gap: .5rem; z-index: 1; }
@media (min-width: 700px) { .sheet-foot { --pb: 1.4rem; margin: .6rem -1.4rem calc(-1 * var(--pb)); padding: .7rem 1.4rem var(--pb); } }
@media (prefers-color-scheme: dark) { .sheet-foot { background: linear-gradient(to bottom, transparent, var(--amber-surface) .7rem); } }
@media (min-width: 700px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: min(34rem, calc(100vw - 3rem)); max-height: min(44rem, calc(100vh - 4rem)); border-radius: 1.2rem; transform: translate(-50%, -46%) scale(.97); opacity: 0; transition: transform .3s var(--ease-out), opacity .2s; }
  .sheet.wide { width: min(46rem, calc(100vw - 3rem)); }
  .open .sheet { transform: translate(-50%, -50%); opacity: 1; }

}
@media (prefers-color-scheme: dark) { .sheet { background: var(--amber-surface); } .sheet .card { background: var(--amber-fill); } .sheet .field input, .sheet .field select, .sheet .field textarea, .sheet .in { background: color-mix(in srgb, var(--amber-text) 9%, var(--amber-surface)); } }
.fields.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.field input, .field select, .field textarea, input.in, select.in, textarea.in { min-width: 0; max-width: 100%; }

/* The app's frame: tabs at the bottom on the phone, a sidebar from 900 px; pushed screens slide. */
.shell-root { max-width: none !important; padding: 0 !important; }
.shell { min-height: 100vh; }
.screen { max-width: var(--amber-content-max); margin: 0 auto; padding: .5rem var(--amber-gutter) calc(6.2rem + env(safe-area-inset-bottom) + var(--amber-inset-bottom, 0px)); min-width: 0; }
.screen.in { animation: pushin .32s var(--ease-out); }
.screen.out { animation: popin .32s var(--ease-out); }
.screen.fade { animation: rise .25s var(--ease-out); }
@keyframes pushin { from { transform: translateX(14%); opacity: 0; } }
@keyframes popin { from { transform: translateX(-10%); opacity: 0; } }
.sidebar { display: none; }
.shell.immersive .tabbar { display: none !important; }
.shell.immersive .screen { padding-bottom: calc(2rem + env(safe-area-inset-bottom) + var(--amber-inset-bottom, 0px)); }
.tabbar { position: fixed; left: 0; right: 0; bottom: var(--amber-inset-bottom, 0px); z-index: 40; display: flex; justify-content: space-around; padding: .35rem .4rem calc(.35rem + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--amber-bg) 86%, transparent); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4); border-top: 1px solid var(--amber-separator); }
.tb-item { position: relative; flex: 1; max-width: 7rem; border: 0; background: none; color: var(--amber-text-secondary); display: flex; flex-direction: column; align-items: center; gap: .15rem; padding: .3rem 0; font-size: .68rem; font-weight: 600; min-height: 2.9rem; border-radius: .8rem; }
.tb-item svg { width: 1.45rem; height: 1.45rem; }
.tb-item[aria-current="page"] { color: var(--amber-accent-text); }
.badge { position: absolute; font-style: normal; font-size: .62rem; font-weight: 800; min-width: 1.1rem; height: 1.1rem; padding: 0 .3rem; border-radius: 99px; background: var(--amber-danger); color: #fff; display: grid; place-items: center; }
.tb-item .badge { top: .05rem; left: calc(50% + .4rem); }
.push-h { display: flex; align-items: center; min-height: 2.6rem; margin: 0 -.4rem .2rem; }
.backb { display: inline-flex; align-items: center; gap: .15rem; border: 0; background: none; color: var(--amber-accent-text); font-weight: 600; padding: .4rem .4rem; min-height: 2.6rem; border-radius: .6rem; }
.backb svg { width: 1.25rem; height: 1.25rem; }
@media (min-width: 900px) {

.empty { text-align: center; padding: 2.2rem 1.2rem; color: var(--amber-text-secondary); }
.empty svg { width: 2.6rem; height: 2.6rem; color: var(--amber-accent); opacity: .85; margin-bottom: .6rem; }

@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.rise { animation: rise .35s var(--ease-out) both; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

.cols { display: grid; gap: 0 1.6rem; grid-template-columns: minmax(0, 1fr); }
.cols > * { min-width: 0; }
@media (min-width: 900px) {

  .cols.side { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
  .top h1 { font-size: 2.2rem; }
}

async function build(m) {
  const tall = camera.aspect < 1;
  const sig = JSON.stringify([m.books.map((b) => [b.title, b.status, b.pages]), Kit.settings().wood, tall]);
  if (sig === lastBuilt) { lightUp(); return; }
  lastBuilt = sig;
  while (shelfGroup.children.length) shelfGroup.remove(shelfGroup.children[0]);
  bookMeshes = []; picked = null;
  const width = (b) => .16 + Math.min(b.pages, 900) / 900 * .34;
  // A tall stage (a phone) gets a narrower case: a long shelf goes on over two boards.
  const maxLen = tall ? 3.3 : 7;
  const rows = [];
  for (const st of STATUS) {
    let cur = [], len = 0;
    for (const b of m.books.filter((x) => x.status === st)) { if (len + width(b) > maxLen && cur.length) { rows.push(cur); cur = []; len = 0; } cur.push(b); len += width(b) + .025; }
    rows.push(cur);
  }
  const lens = rows.map((r) => r.reduce((a, b) => a + width(b) + .025, 0));
  const W = Math.max(4, ...lens) + .7, Hh = SH * rows.length + BOARD;
  const wood = new T.CanvasTexture(woodTexture(Kit.settings().wood)); wood.colorSpace = T.SRGBColorSpace; wood.wrapS = wood.wrapT = T.RepeatWrapping;
  const woodMat = new T.MeshStandardMaterial({ map: wood, roughness: .72 });
  const backMat = new T.MeshStandardMaterial({ map: wood, roughness: .9, color: 0xb8a48c });
  const add = (geo, mat, x, y, z) => { const me = new T.Mesh(geo, mat); me.position.set(x, y, z); me.castShadow = me.receiveShadow = true; shelfGroup.add(me); return me; };
  add(new T.BoxGeometry(W, Hh, .08), backMat, 0, Hh / 2, -DEPTH / 2);
  for (const sx of [-1, 1]) add(new T.BoxGeometry(BOARD, Hh + BOARD, DEPTH), woodMat, sx * (W / 2 + BOARD / 2), Hh / 2, 0);
  for (let k = 0; k <= rows.length; k++) add(new T.BoxGeometry(W + BOARD * 2, BOARD, DEPTH), woodMat, 0, k * SH, 0);
  const paper = new T.CanvasTexture(paperTexture()); paper.colorSpace = T.SRGBColorSpace;
  const paperMat = new T.MeshStandardMaterial({ map: paper, roughness: .95 });
  // Reading now on top, then read, then up next.
  for (let r = 0; r < rows.length; r++) {
    let x = -W / 2 + .35;
    const y0 = (rows.length - 1 - r) * SH + BOARD / 2;
    for (const b of rows[r]) {
      const w = width(b), h = 1.35 + (H(b.title) % 40) / 100, d = 1.0 + (H(b.author) % 20) / 100;
      const img = await coverImage(b); const rgb = img ? avgColor(img) : null;
      const sp = new T.CanvasTexture(spineTexture(b, rgb)); sp.colorSpace = T.SRGBColorSpace; sp.anisotropy = 4;
      const cv = new T.CanvasTexture(coverTexture(b, img, rgb)); cv.colorSpace = T.SRGBColorSpace;
      const plain = new T.MeshStandardMaterial({ color: rgb ? new T.Color(`rgb(${rgb.map((v) => Math.round(v * .7)).join(",")})`) : new T.Color(hsl(H(b.title) % 360, 40, 30)), roughness: .6 });
      // Box faces: +z is the spine, facing you on the shelf; +x the front cover, which turns to you
      // when the book is pulled out; -x the back; the rest is paper.
      const mesh = new T.Mesh(new T.BoxGeometry(w, h, d), [
        new T.MeshStandardMaterial({ map: cv, roughness: .55 }), plain, paperMat, paperMat, new T.MeshStandardMaterial({ map: sp, roughness: .5 }), paperMat]);
      mesh.position.set(x + w / 2, y0 + h / 2, DEPTH / 2 - d / 2 - .05);
      if (b.status === "Want to read" && (H(b.title) % 5 === 0)) { mesh.rotation.z = -.08; mesh.position.y -= .02; }
      mesh.castShadow = mesh.receiveShadow = true;
      mesh.userData = { b, home: mesh.position.clone(), homeRot: mesh.rotation.clone(), t: 0 };
      shelfGroup.add(mesh); bookMeshes.push(mesh);
      x += w + .025;
    }
  }
  shelfGroup.position.y = -Hh / 2;
  fit(); lightUp(); kick();
}
function lightUp() { const on = Kit.on(Kit.settings().lamp); scene.userData.lamp.intensity = on ? 9 : 0; kick(); }

// ---------- Motion: render only while something moves ----------
function kick() { if (!animating) { animating = 1; requestAnimationFrame(loop); } }
let lastT = 0; const renderMs = [];
function loop(t) {
  if (document.hidden) { animating = 0; return; }
  const dt = Math.min(.05, (t - (lastT || t)) / 1000); lastT = t;
  frames.push(t); while (frames.length && t - frames[0] > 1000) frames.shift();
  let moving = false;
  const ease = (a, b, k) => { const v = a + (b - a) * (1 - Math.pow(1 - k, dt * 60)); if (Math.abs(b - v) > 1e-4) moving = true; return Math.abs(b - v) < 1e-4 ? b : v; };
  yaw = ease(yaw, target.yaw, .12); pitch = ease(pitch, target.pitch, .12); dist = ease(dist, target.dist, .12);
  camera.position.set(Math.sin(yaw) * dist * Math.cos(pitch), Math.sin(pitch) * dist + .2, Math.cos(yaw) * dist * Math.cos(pitch));
  camera.lookAt(0, 0, 0);
  // Where a pulled-out book floats: in front of the camera, in the upper half of the view.
  const vf = camera.fov * Math.PI / 180, D = 1.45 / ((camera.aspect < 1 ? .34 : .5) * 2 * Math.tan(vf / 2));
  const dir = new T.Vector3(); camera.getWorldDirection(dir);
  const up = new T.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
  const outPos = camera.position.clone().add(dir.multiplyScalar(D)).add(up.multiplyScalar(D * Math.tan(vf / 2) * (camera.aspect < 1 ? .5 : .3))).sub(shelfGroup.position);
  for (const me of bookMeshes) {
    const u = me.userData, out = me === picked;
    u.t = ease(u.t, out ? 1 : 0, .1);
    const k = u.t, s = k * k * (3 - 2 * k);
    // Out: slides forward, rises to the middle and turns its cover to you.
    me.position.x = u.home.x + (outPos.x - u.home.x) * s;
    me.position.y = u.home.y + (outPos.y - u.home.y) * s + Math.sin(s * Math.PI) * .35;
    me.position.z = u.home.z + (outPos.z - u.home.z) * s;
    me.rotation.y = -Math.PI / 2 * s;
    me.rotation.z = u.homeRot.z * (1 - s);
    const f = bookMeshes.indexOf(me) === focus && kbd && !picked;
    me.position.z += f ? .18 : 0;
  }
  const r0 = performance.now(); renderer.render(scene, camera); renderMs.push(performance.now() - r0); if (renderMs.length > 120) renderMs.shift();
  if (moving || dragging) requestAnimationFrame(loop); else { animating = 0; report(); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) kick(); });
// Frames drawn in the last second of movement: for the frame-rate checks on iPhone and Mac.
function report() {
  const n = frames.length; window.__fps = n;
  const el = document.getElementById("fps"); if (el) el.setAttribute("aria-label", `Frame rate ${n}`);
}
// A slow turn for a set time, for measuring (the Mac check calls this).
window.__spin = (ms) => new Promise((res) => {
  const t0 = performance.now(), y0 = target.yaw; let n = 0;
  const step = (t) => { n++; target.yaw = y0 + Math.sin((t - t0) / ms * Math.PI * 2) * .4; kick(); if (t - t0 < ms) requestAnimationFrame(step); else { target.yaw = y0; const avg = renderMs.reduce((a, b) => a + b, 0) / Math.max(1, renderMs.length); res(`${Math.round(n / (ms / 1000))} fps, ${avg.toFixed(1)} ms per frame to draw`); } };
  requestAnimationFrame(step);
});

// ---------- Touch, mouse, trackpad and keys ----------
let dragging = false, kbd = false;
function bindInput(cv) {
  let sx = 0, sy = 0, moved = 0, y0 = 0, p0 = 0; const pts = new Map(); let pinch = 0;
  cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, e); dragging = true; sx = e.clientX; sy = e.clientY; moved = 0; y0 = target.yaw; p0 = target.pitch; kick(); tipOff(); });
  cv.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, e);
    if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); if (pinch) target.dist = Math.min(fitDist * 1.6, Math.max(fitDist * .55, target.dist * pinch / d)); pinch = d; return; }
    const dx = e.clientX - sx, dy = e.clientY - sy; moved = Math.max(moved, Math.hypot(dx, dy));
    target.yaw = Math.max(-.6, Math.min(.6, y0 - dx * .005)); target.pitch = Math.max(-.15, Math.min(.5, p0 + dy * .004));
  });
  const up = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pinch = 0; if (!pts.size) { dragging = false; if (moved < 6) tap(e); kick(); } };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("wheel", (e) => { e.preventDefault(); if (e.ctrlKey) target.dist = Math.min(fitDist * 1.6, Math.max(fitDist * .55, target.dist * (1 + e.deltaY * .01))); else { target.yaw = Math.max(-.6, Math.min(.6, target.yaw + e.deltaX * .003)); target.pitch = Math.max(-.15, Math.min(.5, target.pitch + e.deltaY * .002)); } kick(); tipOff(); }, { passive: false });
  cv.addEventListener("keydown", (e) => {
    const n = bookMeshes.length; if (!n) return;
    if (["ArrowRight", "ArrowLeft", "ArrowUp", "ArrowDown"].includes(e.key)) { e.preventDefault(); kbd = true; focus = (focus + ({ ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key]) + n) % n; announce(bookMeshes[focus].userData.b.title); kick(); }
    else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(bookMeshes[focus]); }
    else if (e.key === "Escape") putBack();
  });
}
function tipOff() { const t = document.getElementById("tip"); if (t) t.style.opacity = 0; }
function tap(e) {
  const r = renderer.domElement.getBoundingClientRect();
  raycaster.setFromCamera(new T.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const hit = raycaster.intersectObjects(bookMeshes)[0];
  if (hit) pick(hit.object === picked ? null : hit.object); else putBack();
}
function pick(me) {
  if (!me) return putBack();
  picked = me; focus = bookMeshes.indexOf(me); target.yaw = 0; target.pitch = .05; target.dist = fitDist;
  showCard(me.userData.b); kick();
}
function putBack() { picked = null; target.dist = fitDist; document.getElementById("card").classList.remove("on"); kick(); }

function showCard(b) {
  const el = document.getElementById("card");
  el.innerHTML = `<button class="round close" id="putback" aria-label="Put it back">${Kit.ico("close")}</button><h2>${esc(b.title)}</h2><div class="by">${esc(b.author)} · ${b.pages} pages</div>
    <div class="rate" role="group" aria-label="Rating">${[1, 2, 3, 4, 5].map((n) => `<button data-r="${n}" class="${n <= b.rating ? "on" : ""}" aria-label="${n} ${n === 1 ? "star" : "stars"}">★</button>`).join("")}</div>
    <div class="row4">${STATUS.map((s) => `<button class="btn ${s === b.status ? "primary" : ""}" data-st="${s}">${SHELF_NAME[s]}</button>`).join("")}</div>`;
  el.classList.add("on");
}
async function setCell(b, k, v) { const m = model(amber.note); return m.c[k] >= 0 ? amber.update({ op: "set_cell", table: m.t.index, row: b.i, col: m.t.columns[m.c[k]].name, value: v }) : { ok: false, error: "Add that column to the note first." }; }

document.addEventListener("click", async (e) => {
  const t = e.target.closest("#putback,[data-r],[data-st]"); if (!t || !picked) return;
  const b = picked.userData.b;
  if (t.id === "putback") putBack();
  else if (t.dataset.r) { const v = +t.dataset.r === b.rating ? 0 : +t.dataset.r; b.rating = v; await setCell(b, "rating", "★".repeat(v)); showCard(b); }
  else if (t.dataset.st && t.dataset.st !== b.status) { putBack(); const r = await setCell(b, "status", t.dataset.st); if (r.ok) announce(`${b.title} moved to ${SHELF_NAME[t.dataset.st]}.`); }
});

function render(note) {
  document.getElementById("title").textContent = note.title;
  const m = model(note);
  if (!m) { document.getElementById("sub").textContent = "Add a table with Title, Author and Status to fill the shelf."; return; }
  const n = (s) => m.books.filter((b) => b.status === s).length;
  document.getElementById("sub").textContent = `${m.books.length} books`;
  document.getElementById("legend").innerHTML = STATUS.map((s) => `<span><b>${n(s)}</b> ${SHELF_NAME[s].toLowerCase()}</span>`).join("") + `<span>Top: reading now · middle: read · bottom: up next</span>`;
  document.getElementById("srlist").innerHTML = m.books.map((b) => `<li>${esc(b.title)} by ${esc(b.author)}, ${SHELF_NAME[b.status]}</li>`).join("");
  build(m);
}
if (init()) amber.onChange((note) => render(note));
</script>
</body>
</html>
