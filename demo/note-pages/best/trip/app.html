<style>

    rain: '<path d="M7 15a4.5 4.5 0 1 1 .9-8.9A6 6 0 0 1 19.5 8 3.5 3.5 0 0 1 18 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
    suitcase: '<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V4.5h6V7M3 12h18"/>',
    coins: '<ellipse cx="9" cy="7" rx="6" ry="3"/><path d="M3 7v5c0 1.7 2.7 3 6 3s6-1.3 6-3V7"/><path d="M9 15v2c0 1.7 2.7 3 6 3s6-1.3 6-3v-5c0-1.7-2.7-3-6-3"/>',
    knife: '<path d="M4 20L18 6a2.8 2.8 0 0 1 2 4L9 21z"/>',
    pot: '<path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM2 10h20M9 6c0-1.5 1-2 1-3M14 6c0-1.5 1-2 1-3"/>',
    cards: '<rect x="3" y="6" width="14" height="15" rx="2.5"/><path d="M7 3h11.5A2.5 2.5 0 0 1 21 5.5V18"/>',
    dumbbell: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
    map: '<path d="M9 4L3 6.5v14L9 18l6 2.5 6-2.5V4l-6 2.5zM9 4v14M15 6.5v14"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/>',
    note: '<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/>',
  };
  const ico = (n, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${paths[n] || ""}</svg>`;

  // Dates are "yyyy-mm-dd" strings from the note; the clock is amber.note.today.
  const D = {
    parse: (s) => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(String(s || "").trim()); return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null; },
    iso: (d) => d.toISOString().slice(0, 10),
    add: (s, n) => { const d = D.parse(s); d.setUTCDate(d.getUTCDate() + n); return D.iso(d); },
    diff: (a, b) => Math.round((D.parse(a) - D.parse(b)) / 86400000),
    wd: (s) => (D.parse(s).getUTCDay() + 6) % 7, // 0 = Monday
    weekStart: (s) => D.add(s, -D.wd(s)),
    fmt: (s, o = { weekday: "short", day: "numeric", month: "short" }) => { const d = D.parse(s); return d ? d.toLocaleDateString("en-GB", { timeZone: "UTC", ...o }) : ""; },
    month: (s) => D.fmt(s, { month: "long" }),
    rel: (s, today) => { const n = D.diff(s, today); return n === 0 ? "Today" : n === 1 ? "Tomorrow" : n === -1 ? "Yesterday" : n > 1 && n < 7 ? D.fmt(s, { weekday: "long" }) : n > 0 ? `In ${n} days` : `${-n} days ago`; },
  };

  const num = (s) => { const n = parseFloat(String(s ?? "").replace(/\s| /g, "").replace(/kr|sek|€|\$/gi, "").replace(",", ".")); return Number.isFinite(n) ? n : NaN; };
  const kr = (n, o = {}) => new Intl.NumberFormat("sv-SE", { maximumFractionDigits: o.dec ?? 0, minimumFractionDigits: o.dec ?? 0 }).format(Math.round(n * 10 ** (o.dec ?? 0)) / 10 ** (o.dec ?? 0)) + (o.unit === false ? "" : " " + (o.unit || "kr"));
  const fmtN = (n, dec = 0) => new Intl.NumberFormat("sv-SE", { maximumFractionDigits: dec }).format(n);
  const done = (s) => /^(✓|✔|x|yes|done|1|true)$/i.test(String(s ?? "").trim());
  const col = (t, re) => t ? t.columns.findIndex((c) => re.test(c.name.trim())) : -1;
  const table = (note, ...res) => note.tables.find((t) => res.every((re) => col(t, re) >= 0));

  /** Adds rows to table `index` as one change (one Undo). */
  function addRows(index, rows) {
    return amber.update(rows.map((values) => ({ op: "append_row", table: index, values })));
  }

  // A sheet: one at a time, Escape or the scrim closes it, focus goes in and comes back.
  let current = null;
  function sheet(title, html, { mount, wide, actions = "" } = {}) {
    close();
    const back = document.activeElement;
    const host = document.createElement("div");
    host.className = "sheet-host";
    host.innerHTML = `<div class="scrim" data-close></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}" ${wide ? 'style="width:min(46rem,94vw)"' : ""}>
      <div class="grab"></div><header><h2>${esc(title)}</h2>${actions}<button class="round" data-close aria-label="Close">${ico("close")}</button></header><div class="sheet-body">${html}</div></section>`;
    document.body.appendChild(host);
    const onKey = (e) => { if (e.key === "Escape") close(); };
    host.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) close(); });
    addEventListener("keydown", onKey);
    current = { host, back, onKey };
    requestAnimationFrame(() => requestAnimationFrame(() => host.classList.add("open")));
    mount && mount(host.querySelector(".sheet-body"), close);
    setTimeout(() => (host.querySelector("[autofocus]") || host.querySelector(".sheet header .round")).focus({ preventScroll: true }), 60);
    return close;
  }
  function close() {
    if (!current) return;
    const { host, back, onKey } = current;
    current = null;
    removeEventListener("keydown", onKey);
    host.classList.remove("open");
    setTimeout(() => host.remove(), 380);
    back && back.focus && back.focus({ preventScroll: true });
  }

  // App settings are declared in <meta name="amber-settings"> and changed in Amber Notes' own
  // App Settings sheet; amber.settings has the defaults filled in.
  const settings = () => amber.settings || {};
  const on = (v) => v === true || v === "On" || v === "on" || v === "Yes";

  // Charts drawn at their real width (so 10 px labels stay 10 px): width(key) is the last measured
  // inner width of the element with data-w="key"; fit(render) re-renders once when a width changed.
  const widths = {};
  const width = (key, fallback) => widths[key] || fallback;
  function fit(render) {
    let changed = false;
    for (const el of document.querySelectorAll("[data-w]")) {
      const cs = getComputedStyle(el);
      const w = Math.round(el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
      if (w && Math.abs((widths[el.dataset.w] || 0) - w) > 4) { widths[el.dataset.w] = w; changed = true; }
    }
    if (changed) render();
  }
  let resizeT;
  const onResize = (render) => addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { for (const k in widths) delete widths[k]; render(); fit(render); }, 120); });

  const once = (fn) => { let p; return () => p || (p = fn()); };
  const hash = (s) => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
  const announce = (() => { let el; return (msg) => { if (!el) { el = document.createElement("div"); el.className = "sr"; el.setAttribute("aria-live", "polite"); document.body.appendChild(el); } el.textContent = ""; setTimeout(() => (el.textContent = msg), 30); }; })();

  return { width, fit, onResize, esc, $, $$, ico, D, num, kr, fmtN, done, col, table, addRows, sheet, close, settings, on, once, hash, announce };
})();

const { esc, ico, D, num, kr, col, sheet, announce } = Kit;
const S = { get: () => { const s = Kit.settings(); const people = Array.isArray(s.people) ? s.people : String(s.people || "Me").split(","); return { people: people.map((x) => String(x).trim()).filter(Boolean), currency: { SEK: "kr", NOK: "kr", DKK: "kr", EUR: "€", USD: "$", GBP: "£", CHF: "CHF ", JPY: "¥" }[s.currency] || "kr", units: /fahr/i.test(s.units) ? "fahrenheit" : "celsius" }; } };
let day = null, wxErr = "", maps = {}, cityMap = null, adding = "";
const dark = () => matchMedia("(prefers-color-scheme: dark)").matches;
const place = (n) => (amber.data.values.places || {})[String(n).trim().toLowerCase()];
const money = (n) => { const c = S.get().currency; return c === "kr" ? kr(n) : c + Kit.fmtN(n); };

function model(note) {
  const plan = Kit.table(note, /^(day|date)$/i, /^what$/i);
  const costs = note.tables.find((t) => col(t, /^paid by$/i) >= 0);
  const c = plan && { day: col(plan, /^(day|date)$/i), time: col(plan, /^time$/i), what: col(plan, /^what$/i), where: col(plan, /^(where|place)$/i) };
  const stops = plan ? plan.rows.map((r, i) => ({ i, day: r[c.day].trim(), time: c.time >= 0 ? r[c.time].trim() : "", what: r[c.what].trim(), where: c.where >= 0 ? r[c.where].trim() : "" })).filter((s) => D.parse(s.day)) : [];
  const days = [...new Set(stops.map((s) => s.day))].sort();
  const lines = note.markdown.split("\n");
  let h = -1; lines.forEach((l, k) => { if (/^#{1,6}\s+packing/i.test(l)) h = k; });
  const packing = note.checklists.filter((x) => h < 0 || x.line - 1 > h);
  return { plan, c, stops, days, costs, packing, hasPackingHeading: h >= 0 };
}

const wmo = (code) => code == null ? null : code <= 1 ? ["sun", "Clear"] : code <= 3 ? ["cloud", "Cloudy"] : code < 50 ? ["cloud", "Fog"] : code < 70 || (code >= 80 && code < 83) ? ["rain", "Rain"] : code < 80 ? ["cloud", "Snow"] : ["rain", "Storms"];
const wxIcon = (code) => { const w = wmo(code); return w ? `<span class="${w[0]}">${ico(w[0])}</span>` : `<span class="cloud" style="opacity:.3">${ico("cloud")}</span>`; };
const temp = (c) => (S.get().units === "fahrenheit" ? Math.round(c * 9 / 5 + 32) : Math.round(c)) + "°";

// The forecast for the trip's days, kept with the app so it shows offline; refreshed after 3 hours.
async function weather(m) {
  const city = amber.data.values.city; if (!city || !m.days.length) return;
  const w = amber.data.values.weather;
  const last = m.days[m.days.length - 1];
  if (w && Date.now() - Date.parse(w.at) < 3 * 3600e3 && m.days.every((d) => w.days[d])) return;
  if (D.diff(m.days[0], amber.note.today) > 15) { wxErr = "The forecast comes 16 days ahead."; return; }
  const r = await amber.fetch(`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=${m.days[0] < amber.note.today ? amber.note.today : m.days[0]}&end_date=${last}`);
  if (!r.ok || r.status !== 200) { wxErr = r.error || "No forecast right now."; render(); return; }
  const j = JSON.parse(r.body).daily, days = {};
  j.time.forEach((d, k) => (days[d] = { code: j.weather_code[k], max: j.temperature_2m_max[k], min: j.temperature_2m_min[k], rain: j.precipitation_probability_max[k] }));
  wxErr = "";
  await amber.store.set("weather", { at: new Date().toISOString(), days });
}

// A map picture of the day's stops, numbered, fitted to them; far-off stops (the airport) are left out.
const inflight = new Set();
async function dayMap(m, d, width) {
  const ks = `${d}-${dark()}-${width}`; if (maps[ks] || inflight.has(ks)) return null;
  const stops = m.stops.filter((s) => s.day === d).map((s, k) => ({ k: k + 1, p: place(s.where) })).filter((x) => x.p);
  if (!stops.length) return null;
  const c = stops[0].p, dist = (p) => Math.hypot((p.lon - c.lon) * 111320 * Math.cos(c.lat * Math.PI / 180), (p.lat - c.lat) * 110540);
  const near = stops.filter((x) => dist(x.p) < 8000);
  inflight.add(ks);
  const W = Math.min(1200, Math.round(width * 2)), H = Math.round(W * 9 / 16);
  const r = await amber.device.maps.snapshot(near.length > 1 ? { pins: near.map((x) => ({ lat: x.p.lat, lon: x.p.lon, label: String(x.k) })), width: W, height: H, dark: dark() }
    : { lat: c.lat, lon: c.lon, km: 1.5, width: W, height: H, dark: dark() });
  inflight.delete(ks);
  if (!r.ok) return null;
  maps[ks] = { url: r.dataURL, far: stops.length - near.length };
  return maps[ks];
}

async function heroMap(width) {
  const city = amber.data.values.city; if (!city) return;
  const k = `${dark()}-${width}`; if ((cityMap && cityMap.k === k) || inflight.has(k)) return;
  inflight.add(k);
  const W = Math.min(1200, Math.round(width * 2)), H = Math.round(W * (width >= 860 ? 8 / 21 : 9 / 16));
  const r = await amber.device.maps.snapshot({ lat: city.lat, lon: city.lon, km: 9, width: W, height: H, dark: dark(), pin: false });
  inflight.delete(k);
  if (r.ok) { cityMap = { k, url: r.dataURL }; render(); }
}

function settle(names, costs) {
  const bal = Object.fromEntries(names.map((n) => [n, 0]));
  for (const c of costs) { const share = c.amt / names.length; for (const n of names) bal[n] -= share; if (bal[c.by] != null) bal[c.by] += c.amt; }
  const debt = names.map((n) => ({ n, v: bal[n] })).filter((x) => x.v < -0.5).sort((a, b) => a.v - b.v);
  const cred = names.map((n) => ({ n, v: bal[n] })).filter((x) => x.v > 0.5).sort((a, b) => b.v - a.v);
  const out = [];
  for (const d of debt) for (const c of cred) { if (d.v >= -0.5) break; const x = Math.min(-d.v, c.v); if (x < 0.5) continue; out.push({ from: d.n, to: c.n, amt: x }); d.v += x; c.v -= x; }
  return { bal, out };
}

function render(note = amber.note) {
  const app = document.getElementById("app");
  const m = model(note), today = note.today;
  if (!m.days.length) {
    app.innerHTML = `<header class="top"><div class="titles"><h1>${esc(note.title || "Trip")}</h1></div></header>
      <div class="card empty">${ico("suitcase")}<h3>No plan yet</h3><p>The plan goes in a table in this note with Day, Time, What and Where. A Packing checklist and a Costs table (Date, What, Paid by, Amount) show up here too.</p></div>`;
    return;
  }
  const first = m.days[0], last = m.days[m.days.length - 1];
  if (!day || !m.days.includes(day)) day = today >= first && today <= last ? today : first;
  const until = D.diff(first, today), w = (amber.data.values.weather || {}).days || {};
  const big = until > 0 ? `${until} ${until === 1 ? "day" : "days"} to go` : today <= last ? `Day ${D.diff(today, first) + 1} of ${m.days.length}` : "Back home";
  const range = `${D.fmt(first, { weekday: "short", day: "numeric" })} to ${D.fmt(last, { weekday: "short", day: "numeric", month: "short" })}`;
  const stops = m.stops.filter((s) => s.day === day);
  const wd = w[day];
  const packed = m.packing.filter((x) => x.checked).length;
  const people = S.get().people;
  let costs = [], cc = null;
  if (m.costs) {
    cc = { date: col(m.costs, /^date$/i), what: col(m.costs, /^what$/i), by: col(m.costs, /^paid by$/i), amt: col(m.costs, /^amount$/i) };
    costs = m.costs.rows.map((r, i) => ({ i, date: cc.date >= 0 ? r[cc.date] : "", what: cc.what >= 0 ? r[cc.what] : "", by: r[cc.by].trim(), amt: num(r[cc.amt]) })).filter((x) => Number.isFinite(x.amt));
  }
  const total = costs.reduce((a, x) => a + x.amt, 0);
  const st = settle(people, costs);
  const dm = maps[`${day}-${dark()}-${Kit.width("daymap", 340)}`];
  const R = 15.9, C = 2 * Math.PI * R;

  app.innerHTML = `
  <header class="top"><div class="titles"><h1>${esc(note.title)}</h1><div class="sub">${range}</div></div></header>
  <section class="hero" data-w="hero">${cityMap ? `<img class="mapimg" src="${cityMap.url}" alt="Map of ${esc((amber.data.values.city || {}).name || note.title)}">` : `<div class="mapimg ph"></div>`}
    <div class="over"><b>${big}</b><span>${esc((amber.data.values.city || {}).name || "")}${m.stops.length ? ` · ${m.stops.length} plans` : ""}</span></div>
    <div class="wx" style="--n:${m.days.length}" role="group" aria-label="Days">${m.days.map((d) => { const x = w[d]; return `<button data-day="${d}" aria-pressed="${d === day}" aria-label="${D.fmt(d, { weekday: "long", day: "numeric", month: "long" })}${x ? `, ${wmo(x.code)[1]}, ${temp(x.max)}` : ""}">
      <span class="d">${D.fmt(d, { weekday: "short" })} ${+d.slice(8)}</span>${wxIcon(x && x.code)}<span class="t num">${x ? `${temp(x.max)}<small> ${temp(x.min)}</small>` : "–"}</span><span class="p">${x && x.rain >= 20 ? `${x.rain}% rain` : ""}</span></button>`; }).join("")}</div></section>
  ${wxErr ? `<p class="muted small" style="margin:.5rem .3rem 0">${esc(wxErr)}</p>` : ""}
  <div class="cols side">
    <div>
      <div class="dayhead"><h2>${D.fmt(day, { weekday: "long", day: "numeric", month: "long" })}</h2><span class="w">${wd ? `${wmo(wd.code)[1]}, ${temp(wd.max)}` : ""}</span></div>
      <div class="daymap" data-w="daymap" ${dm ? "" : 'style="aspect-ratio:16/9"'}>${dm ? `<img src="${dm.url}" alt="Map of the day's stops">${dm.far ? `<span class="note2">${dm.far} more out of town</span>` : ""}` : ""}</div>
      <section class="card list tl">${stops.map((s, k) => `<div class="row stop ${day < today || (day === today && s.time && s.time < nowTime()) ? "past" : ""}"><span class="tm">${esc(s.time)}</span><span class="no ${place(s.where) ? "" : "none"}">${k + 1}</span>
        <div><div class="wh">${esc(s.what)}</div>${s.where ? `<div class="pl">${esc(s.where)}</div>` : ""}</div>
        ${s.where ? `<button class="go" data-go="${s.i}" aria-label="Directions to ${esc(s.where)}">${ico("pin")}</button>` : "<span></span>"}</div>`).join("")}</section>
      <button class="btn plain" id="addstop" style="margin-top:.4rem">${ico("plus")} Add to ${D.fmt(day, { weekday: "long" })}</button>
    </div>
    <div>
      <div class="label"><span class="grow">Packing</span></div>
      <section class="card pack">
        <div class="packhead"><div class="ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="${R}" fill="none" stroke="var(--amber-fill)" stroke-width="4"/><circle cx="18" cy="18" r="${R}" fill="none" stroke="var(--amber-accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - (m.packing.length ? packed / m.packing.length : 0))}" style="transition:stroke-dashoffset .6s var(--ease-out)"/></svg></div>
          <div class="grow"><b class="num">${packed} of ${m.packing.length} packed</b><div class="small muted">${m.packing.length - packed ? `${m.packing.length - packed} to go` : "All packed"}</div></div></div>
        <div class="list">${m.packing.map((x) => `<div class="row item" role="checkbox" tabindex="0" aria-checked="${x.checked}" data-line="${x.line}"><span class="box">${ico("check")}</span><span class="txt grow">${esc(x.text)}</span></div>`).join("")}</div>
        <form class="additem" id="addpack"><label class="sr" for="pi">Add to packing</label><input class="in" id="pi" placeholder="Add something" value="${esc(adding)}"><button class="btn tint" aria-label="Add">${ico("plus")}</button></form>
      </section>
      <div class="label"><span class="grow">Shared costs</span><button id="addcost" aria-label="Add a shared cost">Add</button></div>
      <section class="card money">
        <div class="tot"><b class="num">${money(total)}</b><span class="muted small">${people.length > 1 ? `${money(total / people.length)} each` : ""}</span></div>
        <div class="people">${people.map((n) => { const v = st.bal[n] || 0; return `<div><span>${esc(n)}</span><b class="num ${v > 0.5 ? "pos" : v < -0.5 ? "neg" : ""}">${v > 0.5 ? "+" : v < -0.5 ? "−" : ""}${money(Math.abs(v))}</b></div>`; }).join("")}</div>
        <div class="settle">${st.out.length ? st.out.map((x) => `<div><span><b>${esc(x.from)}</b> owes <b>${esc(x.to)}</b></span><span class="grow"></span><span class="num">${money(x.amt)}</span></div>`).join("") : `<div class="muted">All square.</div>`}</div>
      </section>
      ${costs.length ? `<section class="card list costs" style="margin-top:.6rem">${costs.slice().reverse().map((x) => `<div class="row"><span class="grow ellipsis">${esc(x.what)}<div class="small muted">${esc(x.by)}${x.date ? ` · ${D.fmt(x.date, { day: "numeric", month: "short" })}` : ""}</div></span><span class="num">${money(x.amt)}</span></div>`).join("")}</section>` : ""}
    </div>
  </div>`;
  Kit.fit(() => render());
  const dw = Kit.width("daymap", 0), hw = Kit.width("hero", 0);
  if (hw) heroMap(hw);
  if (dw && !dm) dayMap(m, day, dw).then((x) => x && render());
}
const nowTime = () => new Date().toTimeString().slice(0, 5);

async function toggle(line) { const r = await amber.update({ op: "toggle_checklist", line: +line }); if (!r.ok) announce(r.error); }

function costSheet() {
  const m = model(amber.note);
  const people = S.get().people;
  let by = people[people.length - 1];
  sheet("Add a shared cost", `<form id="cf" class="fields"><label class="field">What<input id="cw" autofocus required placeholder="Dinner at Da Remo" maxlength="80"></label>
    <label class="field">Amount (${esc(S.get().currency)})<input id="ca" inputmode="decimal" required class="num"></label>
    <div class="field">Paid by<div class="who" role="group" aria-label="Paid by">${people.map((p) => `<button type="button" data-by="${esc(p)}" aria-pressed="${p === by}">${esc(p)}</button>`).join("")}</div></div>
    <div class="err" id="err" role="alert"></div><button class="btn primary block">Add cost</button></form>`, {
    mount(root, close) {
      root.querySelector(".who").onclick = (e) => { const b = e.target.closest("[data-by]"); if (!b) return; by = b.dataset.by; root.querySelectorAll("[data-by]").forEach((x) => x.setAttribute("aria-pressed", x === b)); };
      root.querySelector("#cf").onsubmit = async (e) => {
        e.preventDefault();
        const what = root.querySelector("#cw").value.trim(), amt = num(root.querySelector("#ca").value);
        if (!(amt > 0)) return (root.querySelector("#err").textContent = "Type an amount.");
        const t = m.costs; if (!t) return (root.querySelector("#err").textContent = "Add a Costs table (Date, What, Paid by, Amount) to the note first.");
        const n = (re) => t.columns[col(t, re)];
        const values = { [n(/^paid by$/i).name]: by, [n(/^amount$/i).name]: String(amt) };
        if (col(t, /^what$/i) >= 0) values[n(/^what$/i).name] = what;
        if (col(t, /^date$/i) >= 0) values[n(/^date$/i).name] = amber.note.today;
        const r = await amber.update({ op: "append_row", table: t.index, values });
        if (!r.ok) return (root.querySelector("#err").textContent = r.error);
        close();
      };
    },
  });
}

function stopSheet() {
  const m = model(amber.note);
  sheet(`Add to ${D.fmt(day, { weekday: "long" })}`, `<form id="sf" class="fields"><div class="fields two"><label class="field">Time<input id="st" type="time" value="12:00"></label><label class="field">Day<input id="sd" type="date" value="${day}"></label></div>
    <label class="field">What<input id="sw" required autofocus placeholder="Lunch"></label><label class="field">Where<input id="sp" placeholder="Name of the place"></label>
    <div class="err" id="err" role="alert"></div><button class="btn primary block">Add</button></form>`, {
    mount(root, close) {
      root.querySelector("#sf").onsubmit = async (e) => {
        e.preventDefault();
        const t = m.plan, v = { day: root.querySelector("#sd").value, time: root.querySelector("#st").value, what: root.querySelector("#sw").value.trim(), where: root.querySelector("#sp").value.trim() };
        // Rows stay in time order: the new one goes after the last stop that comes before it.
        const before = m.stops.filter((s) => s.day < v.day || (s.day === v.day && s.time <= v.time)).pop();
        const add = { op: "append_row", table: t.index, values: { [t.columns[m.c.day].name]: v.day, ...(m.c.time >= 0 ? { [t.columns[m.c.time].name]: v.time } : {}), [t.columns[m.c.what].name]: v.what, ...(m.c.where >= 0 ? { [t.columns[m.c.where].name]: v.where } : {}) } };
        const to = before ? before.i + 1 : 0;
        const r = await amber.update(to < t.rows.length ? [add, { op: "move_row", table: t.index, from: t.rows.length, to }] : add);
        if (!r.ok) return (root.querySelector("#err").textContent = r.error);
        if (v.where && !place(v.where)) locate(v.where);
        day = v.day; close();
      };
    },
  });
}

// Where a new place is, from OpenStreetMap, kept with the app for the day's map.
async function locate(q) {
  const city = amber.data.values.city || {};
  const r = await amber.fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q + (city.name ? ", " + city.name : ""))}`, { headers: { "User-Agent": "AmberNotes-TripApp/1.0" } });
  if (!r.ok || r.status !== 200) return;
  const hit = JSON.parse(r.body)[0]; if (!hit) return;
  maps = {};
  await amber.setData({ values: { places: { [q.toLowerCase()]: { lat: +hit.lat, lon: +hit.lon } } } });
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("#settings,#addcost,#addstop,[data-day],[data-line],[data-go]"); if (!t) return;
  if (t.id === "addcost") costSheet();
  else if (t.id === "addstop") stopSheet();
  else if (t.dataset.day) { day = t.dataset.day; render(); }
  else if (t.dataset.line) toggle(t.dataset.line);
  else if (t.dataset.go) { const m = model(amber.note), s = m.stops.find((x) => x.i === +t.dataset.go), p = place(s.where); amber.device.maps.open(p ? { lat: p.lat, lon: p.lon, name: s.where, directions: true } : { query: s.where, directions: true }); }
});
document.addEventListener("keydown", (e) => { const t = e.target.closest("[data-line]"); if (t && (e.key === " " || e.key === "Enter")) { e.preventDefault(); toggle(t.dataset.line); } });
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "addpack") return;
  e.preventDefault();
  const v = document.getElementById("pi").value.trim(); if (!v) return;
  const m = model(amber.note);
  const r = await amber.update({ op: "add_checklist_item", text: v, ...(m.hasPackingHeading ? { under_heading: "Packing" } : {}) });
  if (r.ok) { adding = ""; requestAnimationFrame(() => document.getElementById("pi")?.focus()); } else announce(r.error);
});
document.addEventListener("input", (e) => { if (e.target.id === "pi") adding = e.target.value; });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { maps = {}; cityMap = null; render(); });
Kit.onResize(() => { maps = {}; cityMap = null; render(); });
let first = true;
amber.onChange((note) => { render(note); if (first) { first = false; weather(model(note)); } });
</script>
</body>
