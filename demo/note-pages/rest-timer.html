<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="amber-settings" content='{"settings":[
 {"key":"rest","label":"Rest between sets","type":"number","min":30,"max":300,"step":15,"default":90,"section":"Timer","help":"Seconds."},
 {"key":"sound","label":"Sound when rest is over","type":"toggle","default":true,"section":"Timer"},
 {"key":"tone","label":"Sound","type":"choice","options":[{"value":"bell","label":"Bell"},{"value":"chime","label":"Chime"},{"value":"knock","label":"Knock"}],"default":"bell","section":"Timer","showIf":"sound"},
 {"key":"days","label":"Training days","type":"multi","options":["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],"default":["Mon","Wed","Fri"],"section":"Plan"},
 {"key":"start","label":"Programme starts","type":"date","default":"2026-10-06","section":"Plan"},
 {"key":"remind","label":"Remind me at","type":"time","default":"18:00","section":"Plan"}
]}'>
<title>Rest timer</title>
<style>
  main { max-width: 560px; margin: 0 auto; padding: 18px var(--amber-gutter) 32px; display: grid; gap: 14px; }
  h1 { font-size: 1.6rem; margin: 0; letter-spacing: -0.02em; }
  .clock { font-size: 4rem; font-weight: 700; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; text-align: center; padding: 18px 0 6px; }
  .card { background: var(--amber-surface); border: 1px solid var(--amber-separator); border-radius: var(--amber-radius); padding: 14px 16px; display: grid; gap: 8px; }
  .row { display: flex; justify-content: space-between; gap: 12px; }
  .muted { color: var(--amber-text-secondary); }
  button { font: inherit; font-weight: 600; border: 0; border-radius: var(--amber-radius-small); padding: 12px 16px; background: var(--amber-accent); color: var(--amber-on-accent); }
  button.ghost { background: var(--amber-fill); color: var(--amber-text); }
  .buttons { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
</style></head>
<body><main>
  <h1 id="title"></h1>
  <div class="clock" id="clock"></div>
  <div class="buttons"><button id="go">Start Rest</button><button class="ghost" id="settings">Settings</button></div>
  <div class="card" id="plan"></div>
</main>
<script>
  let left = 0, timer = null;
  const s = () => amber.settings;
  const fmt = (n) => Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0");
  function draw(note) {
    document.getElementById("title").textContent = note.title;
    document.getElementById("clock").textContent = fmt(left || s().rest);
    const tone = { bell: "Bell", chime: "Chime", knock: "Knock" }[s().tone] || s().tone;
    const rows = [["Rest", s().rest + " s"], ["Sound", s().sound ? tone : "Off"], ["Days", (s().days || []).join(", ") || "None"],
      ["Starts", new Date(s().start + "T12:00").toLocaleDateString("en-GB", { day: "numeric", month: "long" })], ["Reminder", s().remind]];
    document.getElementById("plan").innerHTML = rows.map(([k, v]) => `<div class="row"><span class="muted">${k}</span><span>${v}</span></div>`).join("");
  }
  document.getElementById("go").onclick = () => {
    clearInterval(timer); left = s().rest; draw(amber.note);
    timer = setInterval(() => { left -= 1; if (left <= 0) { clearInterval(timer); left = 0; } draw(amber.note); }, 1000);
  };
  document.getElementById("settings").onclick = () => amber.openSettings();
  amber.onChange(draw);
</script></body></html>
