name: Pane
options:
  bundleIdPrefix: dev.emilwagman
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.31.0
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: 0.6.0
  # Updates for the Mac download only (target PaneDirect); App Store builds never link it.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    # iPhone builds sign with Emil's paid team (a year per install, app groups, TestFlight).
    # The Mac app stays ad-hoc for now.
    "DEVELOPMENT_TEAM[sdk=iphoneos*]": 4UM3XVUN9Y
    "CODE_SIGN_STYLE[sdk=iphoneos*]": Automatic
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Pane:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: &appSources
      - Pane
      # The website's changelog, for the What's new card (offline, no network).
      - path: web/content/changelog.json
        buildPhase: resources
    configFiles:
      Debug: Config/Backend.xcconfig
      Release: Config/Backend.xcconfig
    dependencies:
      - package: Markdown
      - package: Supabase
      - package: ZIPFoundation
      - target: PaneShare
        platformFilter: iOS
    # SwiftPM resource bundles (ZIPFoundation's and swift-crypto's privacy manifests, and any
    # added later) arrive in Contents/Resources signed with the archive's Apple Development
    # identity. The App Store export re-signs only the app and its nested code, so Apple
    # rejected those bundles (ITMS-90284). Without their own signature they're plain resources,
    # sealed by the app's signature, which the export does re-sign. Bundles with an executable
    # keep theirs. The bundles' names aren't known ahead, so the script can't declare them as
    # outputs; the target turns off user script sandboxing (this is its only script).
    postBuildScripts:
      - name: Unsign resource bundles
        basedOnDependencyAnalysis: false
        script: |
          [ "$PLATFORM_NAME" = macosx ] || exit 0
          cd "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" || exit 0
          for b in *.bundle; do
            [ -d "$b/Contents/_CodeSignature" ] || continue
            /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$b/Contents/Info.plist" >/dev/null 2>&1 && continue
            rm -rf "$b/Contents/_CodeSignature"
            echo "Unsigned $b"
          done
    info:
      path: Pane/Resources/Info.plist
      properties: &appInfo
        CFBundleDisplayName: Amber Notes
        CFBundleName: Amber Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: dev.emilwagman.pane.connect
            CFBundleURLSchemes: [ambernotes]
        # Handoff: Connect ChatGPT or Claude, started on iPhone, continues on the Mac.
        NSUserActivityTypes: [dev.emilwagman.pane.connect]
        PaneSupabaseURL: $(PANE_SUPABASE_URL)
        PaneSupabaseKey: $(PANE_SUPABASE_KEY)
        PaneShareURL: $(PANE_SHARE_URL)
        PaneMCPURL: $(PANE_MCP_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSAppleEventsUsageDescription: Amber Notes reads the Apple Notes you choose to import. It never changes them.
        NSFaceIDUsageDescription: Amber Notes uses Face ID to open your locked notes, show your recovery key, approve AI connections and add a device.
        NSCameraUsageDescription: Amber Notes uses the camera to scan the code on a device you add, and to take photos for a note that is an app.
        NSRemindersFullAccessUsageDescription: A note that is an app can add reminders for you, such as a daily nudge for a habit. It asks each time it wants to.
        NSCalendarsFullAccessUsageDescription: A note that is an app can show today's events, such as a meeting prep note. Nothing from your calendar leaves this device.
        NSLocationWhenInUseUsageDescription: A note that is an app can use your location once, such as a trip log noting where you are.
        NSPhotoLibraryAddUsageDescription: A note that is an app can save photos you take with it.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.emilwagman.pane.item
            UTTypeDescription: Pane item
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {}
        # Evernote exports (.enex), which Evernote doesn't declare. Opening one (Files, Finder,
        # the share sheet) starts the Evernote import.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.evernote.enex
            UTTypeDescription: Evernote export
            UTTypeConformsTo: [public.xml, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [enex]
              public.mime-type: [application/enex+xml]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Evernote export
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.evernote.enex]
        # Opened in place: the import copies the file before reading it.
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base: &appSettings
        PRODUCT_BUNDLE_IDENTIFIER: dev.emilwagman.pane
        # The app's file name. Dev and test builds are Pane.app; scripts/testflight.sh sets
        # PANE_PRODUCT_NAME="Amber Notes" so the shipped Mac app installs as Amber Notes.app.
        PANE_PRODUCT_NAME: Pane
        PRODUCT_NAME: $(PANE_PRODUCT_NAME)
        PRODUCT_MODULE_NAME: Pane
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        # Ad-hoc builds use Pane-mac.entitlements; scripts/install-mac.sh passes
        # PANE_MAC_ENTITLEMENTS=Pane-mac-signed.entitlements for the team-signed app, and
        # scripts/testflight.sh passes Pane-mac-appstore.entitlements (sandboxed) for TestFlight.
        PANE_MAC_ENTITLEMENTS: Pane-mac.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Pane/Resources/$(PANE_MAC_ENTITLEMENTS)
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Pane/Resources/Pane-ios.entitlements
  # The Mac download (Developer ID, notarized, a DMG): the same app plus Sparkle for updates.
  # Built only by scripts/release-mac.sh; the App Store/TestFlight build is the Pane target.
  PaneDirect:
    type: application
    platform: macOS
    sources: *appSources
    configFiles:
      Debug: Config/Backend.xcconfig
      Release: Config/Backend.xcconfig
    dependencies:
      - package: Markdown
      - package: Supabase
      - package: ZIPFoundation
      - package: Sparkle
    info:
      path: Pane/Resources/Info-Direct.plist
      properties:
        <<: *appInfo
        SUFeedURL: https://ambernotes.app/updates/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        <<: *appSettings
        PANE_PRODUCT_NAME: Amber Notes
        PANE_MAC_ENTITLEMENTS: Pane-mac-direct.entitlements
        # SPARKLE: updates; DIRECT: Sign in with Apple through the web (no entitlement in Developer ID).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SPARKLE DIRECT
        # Sparkle's EdDSA public key; the private half is in the login Keychain (and .secrets/).
        SPARKLE_PUBLIC_KEY: teSFUYF3dK744mGRKD/3wqWEt7hBH4+J5DINTeFq5r4=
  PaneShare:
    type: app-extension
    platform: iOS
    sources:
      - PaneShare
      - Pane/Views/AppMark.swift
      - Pane/Model/Inbox.swift
      - Pane/Model/SharedItem.swift
      - Pane/Model/RichTextToMarkdown.swift
      - Pane/Model/OfflineHTML.swift
      - Pane/Editor/Platform.swift
      - Pane/Editor/Palette.swift
      - path: Pane/Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: PaneShare/Info.plist
      properties:
        CFBundleDisplayName: Amber Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emilwagman.pane.share
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PaneShare/PaneShare.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES
  PaneTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: PaneTests
        excludes: [Fixtures]
      - path: PaneTests/Fixtures
        excludes: [Markdown, Keep]
        buildPhase: resources
      # Export trees from Obsidian, Notion, Bear, Joplin, Logseq, Simplenote and Standard Notes,
      # copied whole so their folders (and hidden ones) stay as the apps write them.
      - path: PaneTests/Fixtures/Markdown
        type: folder
        buildPhase: resources
      # A Google Takeout download with its Keep folder, as Google writes it.
      - path: PaneTests/Fixtures/Keep
        type: folder
        buildPhase: resources
      # Server files the tests check against, copied into the bundle when it's built (the test
      # host can't read the checkout under ~/Documents without a privacy prompt).
      - path: supabase/functions/_shared/e2ee-vectors.json
        buildPhase: resources
      - path: supabase/migrations/20260929230000_tip_events.sql
        buildPhase: resources
    dependencies:
      - target: Pane
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Pane.app/Contents/MacOS/Pane"
  PaneUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources: [PaneUITests]
    dependencies:
      - target: Pane
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pane
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  AmberNotesDirect:
    build:
      targets:
        PaneDirect: all
    archive:
      config: Release
  Pane:
    build:
      targets:
        Pane: all
    test:
      targets: [PaneTests, PaneUITests]
