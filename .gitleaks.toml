# Secret scanning (gitleaks). CI runs it on every push; run `gitleaks git` locally before pushing.
[extend]
useDefault = true

[allowlist]
description = "Public values that look like secrets"
regexes = [
  # Supabase's standard local-development anon key (issuer "supabase-demo"). Every `supabase start`
  # uses it and it only works against a stack on your own machine.
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9\.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0''',
  # Test key ids that are just the hex digits in order, forwards or backwards (the locked notes
  # tests' KEY and OLD_KEY): made-up labels, not keys.
  '''^0123456789abcdef$''',
  '''^fedcba9876543210$''',
]
paths = [
  # Cross-platform encryption test vectors: fixed, published inputs (the data key is the bytes 1 to 32
  # in order). Every implementation must reproduce them, so they are public by design.
  '''supabase/functions/_shared/e2ee-vectors\.json''',
]
