 <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0.55" stop-color="#FFD48A" stop-opacity="0"/><stop offset="1" stop-color="#FFE2A8" stop-opacity=".9"/></linearGradient>
