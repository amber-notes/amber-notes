<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#121114}
.row{display:flex;gap:40px;padding:40px}
.tile{width:380px;text-align:center;color:#bbb;font:600 18px -apple-system}
svg{width:380px;height:380px;display:block;border-radius:86px}
</style></head><body><div class="row">

<!-- A: tumbled amber nugget with a trapped leaf -->
<div class="tile"><svg viewBox="0 0 1024 1024">
<defs>
 <radialGradient id="gA" cx="0.5" cy="0.2" r="1"><stop offset="0" stop-color="#3b2a18"/><stop offset=".55" stop-color="#1c1819"/><stop offset="1" stop-color="#111013"/></radialGradient>
 <radialGradient id="bodyA" cx="0.42" cy="0.4" r="0.7"><stop offset="0" stop-color="#FFD66B"/><stop offset="0.35" stop-color="#F7A21B"/><stop offset="0.72" stop-color="#D2600A"/><stop offset="1" stop-color="#7E2E04"/></radialGradient>
 <radialGradient id="coreA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFF1B8" stop-opacity=".95"/><stop offset="1" stop-color="#FFC94A" stop-opacity="0"/></radialGradient>
 <linearGradient id="rimA" x1="0" y1="0" x2="1" y2="1"><stop offset="0.55" stop-color="#FFB547" stop-opacity="0"/><stop offset="1" stop-color="#FFD27A" stop-opacity=".9"/></linearGradient>
 <filter id="glowA" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="34" stdDeviation="44" flood-color="#F08A18" flood-opacity=".4"/></filter>
 <filter id="b3"><feGaussianBlur stdDeviation="3"/></filter>
 <filter id="b10"><feGaussianBlur stdDeviation="10"/></filter>
 <clipPath id="cA"><path id="nug" d="M300 330 C 360 230, 520 200, 640 236 C 760 272, 836 372, 830 500 C 824 640, 760 760, 610 806 C 470 850, 316 800, 244 700 C 176 604, 214 452, 300 330 Z"/></clipPath>
</defs>
<rect width="1024" height="1024" fill="url(#gA)"/>
<g filter="url(#glowA)"><use href="#nug" fill="url(#bodyA)"/></g>
<g clip-path="url(#cA)">
 <ellipse cx="520" cy="500" rx="230" ry="190" fill="url(#coreA)" filter="url(#b10)"/>
 <!-- flow lines in the resin -->
 <path d="M250 560 C 380 520, 520 610, 700 560 S 860 520, 880 540" fill="none" stroke="#B4500A" stroke-opacity=".35" stroke-width="18" filter="url(#b3)"/>
 <path d="M260 660 C 400 630, 560 700, 760 650" fill="none" stroke="#9E4307" stroke-opacity=".3" stroke-width="14" filter="url(#b3)"/>
 <!-- the trapped leaf -->
 <g transform="translate(520 520) rotate(-28)" opacity=".78" filter="url(#b3)">
  <path d="M-120 0 C -60 -70, 60 -70, 120 0 C 60 70, -60 70, -120 0 Z" fill="#6B3A06"/>
  <path d="M-130 0 L 120 0" stroke="#4A2503" stroke-width="7" stroke-linecap="round"/>
  <path d="M-40 0 L -5 -40 M 20 0 L 55 -38 M -40 0 L -5 40 M 20 0 L 55 38" stroke="#4A2503" stroke-width="5" stroke-linecap="round"/>
 </g>
 <!-- bubbles -->
 <g fill="none" stroke="#FFF3CC" stroke-opacity=".7" stroke-width="4">
  <circle cx="660" cy="410" r="14"/><circle cx="690" cy="446" r="7"/><circle cx="380" cy="660" r="10"/><circle cx="610" cy="700" r="6"/>
 </g>
 <!-- darker edge, lit rim -->
 <use href="#nug" fill="none" stroke="#6A2503" stroke-opacity=".55" stroke-width="40" filter="url(#b10)"/>
 <use href="#nug" fill="none" stroke="url(#rimA)" stroke-width="16"/>
</g>
<!-- polished highlights -->
<path d="M330 360 C 380 300, 470 270, 560 276 C 480 300, 410 340, 360 400 Z" fill="#fff" opacity=".82"/>
<ellipse cx="700" cy="330" rx="26" ry="14" fill="#fff" opacity=".55" transform="rotate(30 700 330)"/>
</svg>A · Amber nugget, trapped leaf</div>

<!-- B: faceted amber gem -->
<div class="tile"><svg viewBox="0 0 1024 1024">
<defs>
 <radialGradient id="gB" cx="0.5" cy="0.2" r="1"><stop offset="0" stop-color="#3b2a18"/><stop offset=".55" stop-color="#1c1819"/><stop offset="1" stop-color="#111013"/></radialGradient>
 <filter id="glowB" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="34" stdDeviation="44" flood-color="#F08A18" flood-opacity=".42"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#gB)"/>
<g filter="url(#glowB)" stroke="#FFE3A0" stroke-opacity=".35" stroke-width="3" stroke-linejoin="round">
 <polygon points="512,170 700,300 512,360" fill="#FFD36A"/>
 <polygon points="512,170 324,300 512,360" fill="#FBBF45"/>
 <polygon points="324,300 250,520 512,360" fill="#E8901C"/>
 <polygon points="700,300 774,520 512,360" fill="#F4A62C"/>
 <polygon points="512,360 250,520 420,560" fill="#D9760F"/>
 <polygon points="512,360 774,520 604,560" fill="#EA8A15"/>
 <polygon points="512,360 420,560 604,560" fill="#FFC857"/>
 <polygon points="250,520 420,560 512,860" fill="#B45209"/>
 <polygon points="774,520 604,560 512,860" fill="#C8620B"/>
 <polygon points="420,560 604,560 512,860" fill="#E07E14"/>
</g>
<polygon points="512,190 640,300 512,340" fill="#fff" opacity=".35"/>
<polygon points="470,390 540,390 512,450" fill="#fff" opacity=".45"/>
</svg>B · Faceted amber</div>

<!-- C: resin drop with a trapped quill -->
<div class="tile"><svg viewBox="0 0 1024 1024">
<defs>
 <radialGradient id="gC" cx="0.5" cy="0.2" r="1"><stop offset="0" stop-color="#3b2a18"/><stop offset=".55" stop-color="#1c1819"/><stop offset="1" stop-color="#111013"/></radialGradient>
 <radialGradient id="bodyC" cx="0.4" cy="0.38" r="0.75"><stop offset="0" stop-color="#FFE08A"/><stop offset="0.35" stop-color="#F8AC2A"/><stop offset="0.75" stop-color="#D2650C"/><stop offset="1" stop-color="#7A2D04"/></radialGradient>
 <radialGradient id="coreC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFF4C2" stop-opacity=".9"/><stop offset="1" stop-color="#FFC94A" stop-opacity="0"/></radialGradient>
 <linearGradient id="rimC" x1="0" y1="0" x2="0" y2="1"><stop offset="0.6" stop-color="#FFB547" stop-opacity="0"/><stop offset="1" stop-color="#FFDB8F" stop-opacity=".95"/></linearGradient>
 <filter id="glowC" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="34" stdDeviation="44" flood-color="#F08A18" flood-opacity=".4"/></filter>
 <filter id="c3"><feGaussianBlur stdDeviation="2.5"/></filter>
 <filter id="c10"><feGaussianBlur stdDeviation="12"/></filter>
 <clipPath id="cC"><path id="dropC" d="M512 150 C 540 150, 560 176, 584 214 C 660 330, 806 450, 806 616 A 294 294 0 0 1 218 616 C 218 450, 364 330, 440 214 C 464 176, 484 150, 512 150 Z"/></clipPath>
</defs>
<rect width="1024" height="1024" fill="url(#gC)"/>
<g filter="url(#glowC)"><use href="#dropC" fill="url(#bodyC)"/></g>
<g clip-path="url(#cC)">
 <ellipse cx="500" cy="590" rx="210" ry="200" fill="url(#coreC)" filter="url(#c10)"/>
 <!-- the trapped quill -->
 <g transform="translate(512 640) rotate(-38)" opacity=".8" filter="url(#c3)">
  <path d="M-200 0 C -120 -58, 60 -70, 170 -12 C 60 -20, -100 -8, -200 0 Z" fill="#6B3A06"/>
  <path d="M-200 0 C -120 44, 50 50, 170 -12 C 60 10, -100 12, -200 0 Z" fill="#7A4508"/>
  <path d="M-230 8 L 180 -14" stroke="#3F2002" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#3F2002" stroke-width="3.5" stroke-linecap="round" opacity=".7">
   <path d="M-120 4 L -95 -34 M -60 2 L -30 -44 M 0 -1 L 32 -48 M 60 -5 L 90 -44"/>
   <path d="M-120 4 L -98 36 M -60 2 L -34 40 M 0 -1 L 26 38 M 60 -5 L 84 28"/>
  </g>
 </g>
 <g fill="none" stroke="#FFF3CC" stroke-opacity=".7" stroke-width="4">
  <circle cx="640" cy="470" r="13"/><circle cx="668" cy="506" r="6"/><circle cx="360" cy="720" r="9"/><circle cx="600" cy="790" r="6"/>
 </g>
 <use href="#dropC" fill="none" stroke="#6A2503" stroke-opacity=".5" stroke-width="44" filter="url(#c10)"/>
 <use href="#dropC" fill="none" stroke="url(#rimC)" stroke-width="18"/>
</g>
<path d="M392 400 C 420 340, 460 290, 500 250 C 480 320, 450 380, 430 450 Z" fill="#fff" opacity=".8"/>
<ellipse cx="640" cy="560" rx="18" ry="10" fill="#fff" opacity=".45" transform="rotate(40 640 560)"/>
</svg>C · Resin drop, trapped quill</div>

</div></body></html>
