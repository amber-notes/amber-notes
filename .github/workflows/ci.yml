name: ci

# Runs on every push and pull request, forks included. Needs no secrets.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the change touches, so a job that cannot be affected by it is skipped. A skipped job
  # counts as passed for a required check; a job that never started would not, so the jobs are
  # always there and decide by this. A push to main runs everything. Only the app's job is
  # decided here (it is the long one, on the scarce runners): the server's and the site's tests
  # read each other's files and the app's, and take a few minutes on plentiful runners.
  #
  # The app's job is skipped only when every changed file is in a place the app is not built or
  # tested from. supabase/ is not such a place: the app's tests read server files (the E2EE and
  # collaboration vectors, a migration, the MCP server's sources), and web/content/changelog.json
  # ships inside the app. When in doubt a path is left out of the list, and the job runs.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.paths.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "Not a pull request: every job runs."
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout is the pull request merged into its base: against the base, that is the change.
          git fetch --quiet --depth=1 origin "$BASE"
          git diff --name-only "$BASE" HEAD > changed.txt
          echo "$(wc -l < changed.txt | tr -d ' ') files changed"
          app=false
          if grep -qvE '^(web/|docs/|strategy/|brand/|plugins/|cli/|scripts/|[^/]+\.md$|LICENSE$|\.github/)' changed.txt \
             || grep -qxE 'web/content/changelog\.json|\.github/workflows/ci\.yml' changed.txt; then app=true; fi
          echo "app tests: $app"
          echo "app=$app" >> "$GITHUB_OUTPUT"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact -v -c .gitleaks.toml

  # The Mac work as three jobs side by side (it was one after the other, 24 minutes): the unit
  # and interaction tests, the timing tests in a process and on a runner of their own, and the
  # iPhone build. "App tests (macOS)" below is the one required check and passes when all three did.
  app-unit:
    name: App unit tests (macOS)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # The suites that time things (PaneTests/Perf) run in the timing job.
      PERF_SKIP: -skip-testing:PaneTests/EditorPerfTests -skip-testing:PaneTests/AppPerfTests -skip-testing:PaneTests/ScanPerfTests -skip-testing:PaneTests/WindowUpdateTests -skip-testing:PaneTests/ListPiecesPerfTests
      XC_FLAGS: ENABLE_TESTABILITY=YES ENABLE_HARDENED_RUNTIME=NO CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=${{ github.workspace }}/build/cas
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      # The Swift packages and the compiler's own cache of what it has built (by content, so a
      # file that did not change is not compiled again), kept between runs of this job.
      - name: Packages and compiled output from earlier runs
        uses: actions/cache@v4
        with:
          path: |
            build/DD/SourcePackages
            build/cas
          key: app-unit-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            app-unit-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            app-unit-${{ steps.xcode.outputs.version }}-
      - name: Generate the project
        run: brew install xcodegen && xcodegen generate
      - name: Build the app and its tests
        run: |
          set -o pipefail
          mkdir -p build
          du -sh build/cas build/DD/SourcePackages 2>/dev/null || echo "nothing from earlier runs"
          xcodebuild build-for-testing -project Pane.xcodeproj -scheme Pane -destination 'platform=macOS' \
            -derivedDataPath build/ci -clonedSourcePackagesDirPath build/DD/SourcePackages $XC_FLAGS \
            | tee build/ci-build.log | grep -E "error:|\*\* TEST BUILD" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build/ci-build.log
      - name: Unit and interaction tests
        env:
          # Runners are several times slower than a developer's Mac; see PaneTests/Perf/PerfBudget.swift.
          TEST_RUNNER_PANE_PERF_SLACK: "4"
          # Snapshot tests that draw windows (ImageViewerSnapshots) run here only, never on a developer's Mac.
          TEST_RUNNER_PANE_SNAPSHOTS: "1"
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Pane.xcodeproj -scheme Pane -destination 'platform=macOS' \
            -only-testing:PaneTests $PERF_SKIP -derivedDataPath build/ci -resultBundlePath build/ci-tests.xcresult $XC_FLAGS \
            | tee build/ci-test.log | grep -E "✔ Test run|✘|error:|PERF|\*\* TEST" || true
          # test-without-building says TEST EXECUTE SUCCEEDED.
          grep -qE "\*\* TEST (EXECUTE )?SUCCEEDED \*\*" build/ci-test.log
      # A failure keeps the whole log and the result bundle: a test host that hangs or crashes
      # records no issue in the filtered output above, only its name under "Failing tests". The
      # crash reports say where it died.
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: |
            build/ci-build.log
            build/ci-test.log
            build/ci-tests.xcresult
            ~/Library/Logs/DiagnosticReports/Pane*
          retention-days: 7
      # Pictures the snapshot tests attach (FileViewerSnapshots and others): kept after every run, so a
      # UI change can be looked at without running anything on a developer's screen.
      - name: Export the snapshots
        if: always()
        run: |
          mkdir -p build/snapshots
          [ -d build/ci-tests.xcresult ] && xcrun xcresulttool export attachments --path build/ci-tests.xcresult --output-path build/snapshots || true
      - name: Keep the snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: build/snapshots
          if-no-files-found: ignore
          retention-days: 7

  app-timing:
    name: App timing tests (macOS)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      PERF_ONLY: -only-testing:PaneTests/EditorPerfTests -only-testing:PaneTests/AppPerfTests -only-testing:PaneTests/ScanPerfTests -only-testing:PaneTests/WindowUpdateTests -only-testing:PaneTests/ListPiecesPerfTests
      XC_FLAGS: ENABLE_TESTABILITY=YES ENABLE_HARDENED_RUNTIME=NO CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=${{ github.workspace }}/build/cas
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      # The Swift packages and the compiler's own cache of what it has built (by content, so a
      # file that did not change is not compiled again), kept between runs of this job.
      - name: Packages and compiled output from earlier runs
        uses: actions/cache@v4
        with:
          path: |
            build/DD/SourcePackages
            build/cas
          key: app-timing-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            app-timing-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            app-timing-${{ steps.xcode.outputs.version }}-
      - name: Generate the project
        run: brew install xcodegen && xcodegen generate
      - name: Build the app and its tests
        run: |
          set -o pipefail
          mkdir -p build
          du -sh build/cas build/DD/SourcePackages 2>/dev/null || echo "nothing from earlier runs"
          xcodebuild build-for-testing -project Pane.xcodeproj -scheme Pane -destination 'platform=macOS' \
            -derivedDataPath build/ci -clonedSourcePackagesDirPath build/DD/SourcePackages $XC_FLAGS \
            | tee build/ci-build.log | grep -E "error:|\*\* TEST BUILD" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build/ci-build.log
      - name: Timing tests, on their own
        env:
          # Runners are several times slower than a developer's Mac; see PaneTests/Perf/PerfBudget.swift.
          TEST_RUNNER_PANE_PERF_SLACK: "4"
        run: |
          set -o pipefail
          # A process and a runner of their own, one test at a time, so nothing else slows what they measure.
          xcodebuild test-without-building -project Pane.xcodeproj -scheme Pane -destination 'platform=macOS' \
            $PERF_ONLY -parallel-testing-enabled NO -derivedDataPath build/ci -resultBundlePath build/ci-perf.xcresult $XC_FLAGS \
            | tee build/ci-perf.log | grep -E "✔ Test run|✘|error:|PERF|\*\* TEST" || true
          grep -qE "\*\* TEST (EXECUTE )?SUCCEEDED \*\*" build/ci-perf.log
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-timing-results
          path: |
            build/ci-build.log
            build/ci-perf.log
            build/ci-perf.xcresult
            ~/Library/Logs/DiagnosticReports/Pane*
          retention-days: 7

  app-ios:
    name: iPhone build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XC_FLAGS: CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=${{ github.workspace }}/build/cas
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      # The Swift packages and the compiler's own cache of what it has built (by content, so a
      # file that did not change is not compiled again), kept between runs of this job.
      - name: Packages and compiled output from earlier runs
        uses: actions/cache@v4
        with:
          path: |
            build/DD/SourcePackages
            build/cas
          key: app-ios-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            app-ios-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            app-ios-${{ steps.xcode.outputs.version }}-
      - name: Generate the project
        run: brew install xcodegen && xcodegen generate
      - name: iOS simulator build
        run: |
          set -o pipefail
          mkdir -p build
          du -sh build/cas build/DD/SourcePackages 2>/dev/null || echo "nothing from earlier runs"
          xcodebuild build -project Pane.xcodeproj -scheme Pane -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ci-ios -clonedSourcePackagesDirPath build/DD/SourcePackages $XC_FLAGS | grep -E "error:|\*\* BUILD" || true
          test -d build/ci-ios/Build/Products/Debug-iphonesimulator/Pane.app

  # The required check. It passes when the three Mac jobs passed, or were skipped because the
  # change touches nothing the app is built or tested from.
  app:
    name: App tests (macOS)
    needs: [changes, app-unit, app-timing, app-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The three Mac jobs
        env:
          RESULTS: unit ${{ needs.app-unit.result }}, timing ${{ needs.app-timing.result }}, iPhone build ${{ needs.app-ios.result }}, what changed ${{ needs.changes.result }}
        run: |
          echo "$RESULTS"
          [ "${{ needs.changes.result }}" = success ] || exit 1
          for r in "${{ needs.app-unit.result }}" "${{ needs.app-timing.result }}" "${{ needs.app-ios.result }}"; do
            [ "$r" = success ] || [ "$r" = skipped ] || exit 1
          done

  server:
    name: Server (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck the Edge Functions
        run: for f in supabase/functions/*/index.ts scripts/e2ee-tool.ts scripts/e2ee-wipe-storage.ts; do deno check "$f"; done
      - name: Unit tests
        run: >-
          deno test --allow-all
          supabase/functions/_shared/e2ee.test.ts supabase/functions/_shared/log.test.ts supabase/functions/_shared/apns.test.ts supabase/functions/_shared/db.test.ts supabase/functions/_shared/client.test.ts supabase/functions/_shared/region.test.ts
          supabase/functions/mcp/notes.test.ts supabase/functions/mcp/needs_database.test.ts supabase/functions/mcp/annotations.test.ts supabase/functions/mcp/card.test.ts supabase/functions/mcp/instructions.test.ts
          supabase/functions/mcp/oauth.pglite.test.ts supabase/functions/mcp/locked.pglite.test.ts supabase/functions/mcp/e2ee.pglite.test.ts
          supabase/functions/mcp/canary.pglite.test.ts supabase/functions/mcp/sealed_tools.pglite.test.ts supabase/functions/mcp/device_add.pglite.test.ts
          supabase/functions/mcp/tips.pglite.test.ts supabase/functions/mcp/folder_files.pglite.test.ts supabase/functions/mcp/share_ask.pglite.test.ts supabase/functions/mcp/open_source_ask.pglite.test.ts supabase/functions/mcp/download_counts.pglite.test.ts supabase/functions/mcp/collab.pglite.test.ts
          supabase/functions/share-files/logic.test.ts scripts/e2ee-tool.test.ts
          supabase/functions/account/account.pglite.test.ts supabase/functions/_shared/hash.test.ts
          scripts/auth-emails.test.ts scripts/ops/daily-digest.test.ts supabase/functions/mcp/tool_errors.test.ts supabase/functions/lifecycle/logic.test.ts supabase/functions/lifecycle/emails.test.ts supabase/functions/lifecycle/assets.test.ts supabase/functions/lifecycle/lifecycle.pglite.test.ts
          supabase/functions/mcp/rename.pglite.test.ts

  web:
    name: Share site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
